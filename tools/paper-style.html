<title>Pricing Transparency Audit</title>
<style>
:root{
  --paper:#FBFBFC; --raise:#F3F4F7; --ink:#16181D; --ink-soft:#474C57;
  --rule:#DCDFE6; --rule-soft:#E9EBF0; --accent:#2B4A7E; --accent-soft:#5C7BAE;
  --mark:#8A5A18; --mark-bg:#F6EFE2; --code-bg:#EDEFF4; --code-ink:#243046;
  --measure:66ch;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,"Times New Roman",serif;
  --mono:"SF Mono","IBM Plex Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --paper:#101216; --raise:#171A20; --ink:#E4E6EB; --ink-soft:#A8AEBB;
  --rule:#2A2F38; --rule-soft:#222630; --accent:#8FB0DE; --accent-soft:#6D8CB8;
  --mark:#D6A45C; --mark-bg:#241D12; --code-bg:#1B1F27; --code-ink:#B9C6DC;
  }
}
:root[data-theme="dark"]{
  --paper:#101216; --raise:#171A20; --ink:#E4E6EB; --ink-soft:#A8AEBB;
  --rule:#2A2F38; --rule-soft:#222630; --accent:#8FB0DE; --accent-soft:#6D8CB8;
  --mark:#D6A45C; --mark-bg:#241D12; --code-bg:#1B1F27; --code-ink:#B9C6DC;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--serif);
  font-size:17.5px; line-height:1.62; margin:0;
  padding:clamp(2rem,6vw,5.5rem) clamp(1.1rem,5vw,3rem) 7rem;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.sheet{max-width:var(--measure); margin:0 auto; position:relative}
p,ul,.tw{margin:0 0 1.15em}
h1,h2,h3,h4{font-weight:600; text-wrap:balance; line-height:1.24; margin:0}
h1{font-size:2.05rem; letter-spacing:-.015em; margin-bottom:.5rem}
h2{font-size:1.42rem; margin:3.1rem 0 .85rem; padding-top:1.1rem; border-top:1px solid var(--rule)}
h3{font-size:1.12rem; margin:2.1rem 0 .6rem}
h4{font-size:1rem; margin:1.5rem 0 .45rem; color:var(--ink-soft)}
h2 .secno,h3 .secno,h4 .secno{
  font-family:var(--mono); font-size:.72em; font-weight:500; color:var(--accent-soft);
  letter-spacing:.02em; margin-right:.62em; font-variant-numeric:tabular-nums;
}
@media(min-width:1080px){
  h2 .secno,h3 .secno{position:absolute; left:-5.2rem; width:4.4rem; text-align:right; margin:0;
    padding-top:.22em}
  h2,h3{position:relative}
}
strong{font-weight:660; color:var(--ink)}
em{font-style:italic}
a{color:var(--accent); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px}
a:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
code{
  font-family:var(--mono); font-size:.845em; background:var(--code-bg); color:var(--code-ink);
  padding:.1em .34em; border-radius:3px; white-space:nowrap;
}
hr{border:0; height:1px; background:var(--rule); margin:2.6rem 0}
ul{padding-left:1.15rem}
li{margin-bottom:.5em}
li::marker{color:var(--accent-soft)}
.tw{overflow-x:auto; border:1px solid var(--rule); border-radius:5px; background:var(--raise)}
table{border-collapse:collapse; width:100%; font-size:.9rem; font-variant-numeric:tabular-nums}
th,td{padding:.5rem .72rem; border-bottom:1px solid var(--rule-soft); vertical-align:top}
thead th{
  font-family:var(--mono); font-size:.72rem; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-soft); background:var(--paper);
  border-bottom:1px solid var(--rule); white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
.tw.audit{border-color:var(--mark); border-left-width:2px; background:var(--mark-bg)}
.tw.audit thead th{background:var(--mark-bg); color:var(--mark); border-bottom-color:var(--mark)}
.tw.audit td{border-bottom-color:var(--rule-soft)}
.auditlab{
  font-family:var(--mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.12em;
  color:var(--mark); margin:0; padding:.6rem .72rem .1rem;
}
.masthead{border-bottom:2px solid var(--ink); padding-bottom:1.4rem; margin-bottom:2.2rem}
.eyebrow{
  font-family:var(--mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.13em;
  color:var(--accent); margin:0 0 .9rem;
}
.masthead h1+p{font-size:1.16rem; line-height:1.4; color:var(--ink-soft); margin:.35rem 0 1.1rem}
.masthead p{margin-bottom:.42em; font-size:.95rem}
@media print{
  body{background:#fff; color:#000; font-size:10.5pt; padding:0; line-height:1.45}
  .sheet{max-width:none}
  h2{page-break-after:avoid; border-top-color:#999}
  h3,h4{page-break-after:avoid}
  .tw,table{page-break-inside:avoid}
  .tw{border-color:#bbb; background:#fff}
  code{background:#f0f0f0; color:#000}
  .tw.audit{background:#f7f2e8; border-color:#8A5A18}
  .auditlab{color:#8A5A18}
  a{color:#000; text-decoration:none}
  h2 .secno,h3 .secno{position:static; margin-right:.5em; width:auto; text-align:left}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
