# --- Unit-of-analysis note (per assignment) ---
# This product is a Community Actor on the Apify marketplace:
# taroyamada/robotstxt-ai-checker ("robots.txt Parser & AI Crawler Block Checker").
# Confirmed as the correct actor via site/lib/affiliates.ts URL mapping for this
# product_id (technical link-mapping file only; no rating/review content opened).
# The actor uses Apify's "Pay Per Event" monetization model: a flat per-result
# rate is the PRODUCT's own price. Apify account subscription plans (Free /
# Starter / Scale / Business / Enterprise) are the payment vehicle, per
# assignment instruction. Each coded variable below carries a `layer` tag:
# "actor" = read from the actor's own Apify Store page; "platform" = read from
# Apify's account-level pricing/legal/help docs, used because the actor page
# was silent on that (mostly contractual) point.

