  credit_system_present:
    value: "no"
    layer: actor
    source: "https://apify.com/taroyamada/robotstxt-ai-checker/pricing"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806192207/https://apify.com/taroyamada/robotstxt-ai-checker/pricing"
    evidence: >
      Price is stated directly in USD per output unit ("$0.011 per delivered
      result" / "$11.00 / 1,000 ... rows"), with no intermediate abstracted
      unit (credits/tokens/points/coins) to convert. Apify's account-level
      "prepaid usage" balance is a dollar-denominated spend balance, not an
      intermediate currency needing a conversion rate -- rule 1 applies
      ("allowance stated directly in output units ... is not a credit
      system"; here it is stated directly in USD per unit, even more direct).
      Gates C1/C2/C4 out of the index.

