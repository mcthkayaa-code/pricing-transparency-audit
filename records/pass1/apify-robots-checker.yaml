    layer: platform
    source: "https://apify.com/pricing"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806192655/https://apify.com/pricing"
    evidence: >
      Free is presented as a standing plan alongside paid plans ("Start for
