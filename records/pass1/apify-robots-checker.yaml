  cost_per_output_computable:
    value: "yes"
    layer: actor
    source: "https://apify.com/taroyamada/robotstxt-ai-checker/pricing"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806192207/https://apify.com/taroyamada/robotstxt-ai-checker/pricing"
    evidence: >
      Entry tier price ($11.00/1,000 results, default display state, no
      toggle to switch) is already expressed as a direct per-unit-output
      rate -- no plan allowance or credit layer to convert. $11.00 / 1,000 =
