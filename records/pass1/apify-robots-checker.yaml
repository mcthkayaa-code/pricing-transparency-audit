default_display_state: >
  Actor page (apify.com/taroyamada/robotstxt-ai-checker) and its Pricing tab show
  ONE flat pay-per-event rate ($11.00 per 1,000 delivered results); there is no
  monthly/annual billing toggle on the actor's own pricing (usage-based, no
  subscription). Cookie-consent banner ("Apify uses cookies") was present on
  apify.com on first load; no analytics/marketing cookies were affirmatively
  accepted and no account/login action was taken at any point. Currency: USD
  throughout, no non-USD figures encountered. Apify's separate ACCOUNT/platform
  pricing page (apify.com/pricing) has its own "Bill monthly / Bill annually"
  toggle for account subscription plans (Free/Starter/Scale/Business), but that
  toggle state does not feed any coded value of this product (this product's
  own price is the flat per-event rate, not an account subscription tier).

variables:
