  # ===== Domain 3: Real usability of the free plan (B1, B2) =====
  # Actor itself publishes no free tier of its own (flat pay-per-event only).
  # Apify's account-level Free plan is documented to fund Store-actor
  # pay-per-event charges (platform layer), so it is coded here as this
  # product's free plan per rule 2 ("a plan priced at zero with an ongoing
  # allowance is a free plan"). See coder_note for the layer explanation.
  free_plan_exists:
    value: "yes"
    layer: platform
    source: "https://apify.com/pricing"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806192655/https://apify.com/pricing"
    evidence: >
      Platform pricing page, "Free" plan card: "$0 ... $5 to spend in Apify
      Store or on your own Actors ... Start for free ... No credit card
      required." FAQ: "Both models [pay per event / pay per usage] draw on
      the platform usage credits included in your plan" -- confirms the
      Free plan's $5/mo credit is spendable on this actor's $0.011/result
      charge. Actor's own Pricing tab corroborates: "Additional costs:
      Platform usage: Free", i.e. no extra platform surcharge on top of the
      per-event rate this credit would be spent against.

  free_plan_cap_documented:
    value: all_quantified
    layer: platform
    source: "https://apify.com/pricing"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806192655/https://apify.com/pricing"
    evidence: >
      The one free-plan limit clearly and unambiguously attributable to this
      product is "$5 to spend ... / month" -- number + dimension (USD to
      spend) + period (month) = quantified rate per section 5.1. The
      platform comparison table also lists other Free-row infrastructure
      figures (compute units, RAM, concurrent runs, proxy allowances); these
      are platform-wide capacity figures not specific to using this actor,
      and the table's column-to-value mapping could not be read unambiguously
      from rendered text without risking misattribution across plan columns,
      so they are not separately claimed here (see coder_note).

  free_plan_cap_value:
    value: "5 usd platform credit per month"
    layer: platform
    source: "https://apify.com/pricing"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806192655/https://apify.com/pricing"
    evidence: >
      "Free / $0 / $5 to spend in Apify Store or on your own Actors ...
      $5/month" (Prepaid usage row of the plan-comparison table). Recorded
