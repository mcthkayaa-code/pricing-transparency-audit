      subject to any set-off unless stated otherwise." 15.6: "We will not
      refund any Fees if you downgrade the purchased Services or terminate
      the Agreement, except if you terminate the Agreement in accordance
      with Section 15.5.2 [Apify's own uncured material breach]; in such a
      case, you are entitled to receive a pro-rata refund for unused
      prepaid Fees." Narrow breach-remedy exception, not a buyer-initiated
      refund window -- same pattern as the codebook's own Vendor Q worked
      example ("non-refundable except where required by law" ->
      no_refunds_stated). Corroborated by help.apify.com "Resolving Actor
      compensations": "as Apify's terms and conditions specify, we do not
      return money" (compensation is credit, not cash). Preamble also
      states Services are "business use only... not suitable for
      consumers", so no consumer statutory withdrawal right applies either.

