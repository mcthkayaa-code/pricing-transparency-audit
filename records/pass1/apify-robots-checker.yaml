    value: "11.00"
    layer: actor
    source: "https://apify.com/taroyamada/robotstxt-ai-checker/pricing"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806192207/https://apify.com/taroyamada/robotstxt-ai-checker/pricing"
    evidence: >
      Only one paid pricing candidate is published: usage-based Pay Per Event.
      Header badge (shown identically 3x on the actor page) and the Pricing tab
      table both read "$11.00 / 1,000 robots.txt ai policy rows". Per rule 6
      (usage-based pricing is the only paid option): recorded the published
      unit rate; unit named in coder_note. Per-unit equivalent stated
      elsewhere on the same page as "$0.011 per delivered result" (11/1000 =
      0.011, internally consistent).

  headline_billing_basis:
    value: usage_based
    layer: actor
    source: "https://apify.com/taroyamada/robotstxt-ai-checker"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806192139/https://apify.com/taroyamada/robotstxt-ai-checker"
    evidence: >
      Cost section: "Pay Per Event: ... apify-default-dataset-item: $0.011 per
      delivered result. ... No subscription required — you only pay for what
      you use." No monthly/annual qualifier anywhere on the page.

  first_charge_amount_usd:
    value: unknown
    layer: actor
    source: "https://apify.com/taroyamada/robotstxt-ai-checker"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806192139/https://apify.com/taroyamada/robotstxt-ai-checker"
    evidence: >
      Pure pay-per-event pricing, no minimum purchase, no subscription, no
      stated billing period ("No subscription required — you only pay for
      what you use"). No document states a determinate first-transaction
      total: actual first charge depends entirely on how many domains the
      buyer chooses to check in the first run. Rule 3 applies (billing
      frequency/period not stated in the periodic sense this variable
      assumes) rather than inventing a "smallest possible charge" figure.
      README Cost section also hedges current pricing ("Current transition
      pricing may include a temporary legacy start fee until the scheduled
      pricing update activates") without stating an amount, reinforcing that
      no stable first-charge figure is determinable. See conflict_note.

