    evidence: "No credit system (credit_system_present=no)."

  # ===== Domain 8: Charging for failed generations (C5) =====
  failed_generation_charge_policy:
    value: charged
    layer: platform
    source: "https://docs.apify.com/platform/actors/publishing/monetize/pay-per-event"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806195937/https://docs.apify.com/actors/publishing/monetize/pay-per-event"
    evidence: >
      Apify's own Pay-Per-Event documentation (the billing model this actor
      uses) instructs, under "Charge for invalid input": "Charge for inputs
      that seem valid but lead to errors, such as URLs that return a 404.
      Even though such action doesn't produce usable data, you still spend
      platform resources... Instead of failing the entire run because of the
      bad input, return error items with clear error codes and messages."
      This actor's own output schema implements exactly that pattern:
      rowType includes robots_txt_error / robots_txt_invalid_domain as
      regular emitted result rows alongside robots_txt_policy_snapshot, and
      the README states "Every emitted Dataset row is pushed individually...
      and must receive chargedCount >= 1." Actor page also documents a
      separate, discretionary post-charge remedy: help.apify.com's
      "Resolving Actor compensations" describes a request-based credit
      (not cash refund) process for disputed/problematic runs via the
      Issues tab -- a secondary appeal path, not evidence that failures are
      free by default. Output schema field chargedEvent is documented as
      "string or null" (i.e. some rows can in principle be unbilled), so
      this is not airtight for every row type; recorded as `charged` on the
      weight of the two corroborating platform/actor sources above.

  # ===== Domain 9: Auto-renewal (D1, D2) =====
  # Actor page is entirely silent on renewal (pure pay-per-event, "No
  # subscription required"). Per assignment instruction, platform-layer ToS
  # governs this contractual variable where the actor page is silent.
  auto_renewal_default:
    value: "on"
    layer: platform
    source: "https://docs.apify.com/legal/general-terms-and-conditions"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806193448/https://docs.apify.com/legal/general-terms-and-conditions"
    evidence: >
      General T&C 14.3: "Unless otherwise specified in the Order, each Order
      will automatically renew for the same Order Term at the then-current
      pricing. To prevent automatic renewal, either party must notify the
      other in writing... You may also cancel auto-renewal directly through
      your Account." Corroborated by apify.com/pricing FAQ ("Can I upgrade,
      downgrade or cancel my plan?"): "If you decide to cancel, your
      subscription will last until the end of the current billing cycle. It
      won't be renewed after that." -- two sources in agreement (see
      auto_renewal_disclosure_location=multiple). Actor's own pay-per-event
      charges themselves require no subscription/Order at all; this value
      describes the account-subscription payment-vehicle layer per
      assignment framing, since the actor page is silent on renewal.

  auto_renewal_disclosure_location:
    value: multiple
    layer: platform
    source: "https://docs.apify.com/legal/general-terms-and-conditions | https://apify.com/pricing"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806193448/https://docs.apify.com/legal/general-terms-and-conditions"
    evidence: >
      Stated in both the terms (14.3, explicit "will automatically renew")
      and the pricing-page FAQ (cancellation implies renewal is the default
      state being opted out of) -- two document classes in agreement.

  renewal_notice_commitment:
    value: no_notice_stated
    layer: platform
    source: "https://docs.apify.com/legal/general-terms-and-conditions"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806193448/https://docs.apify.com/legal/general-terms-and-conditions"
    evidence: >
      No clause commits to advance notice before a renewal charge. Notice
      commitments found are for different events only: ToS changes ("For
      material revisions, Apify will notify you") and overage notifications
      ("you'll get a notification" when prepaid usage is exceeded) -- neither
      is advance notice of a renewal charge itself.

  # ===== Domain 10: Refund and cancellation terms (D3, D4) =====
  refund_policy_exists:
