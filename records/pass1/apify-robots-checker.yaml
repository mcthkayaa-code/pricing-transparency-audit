  cost_per_output_unit:
    value: other
    layer: actor
    source: "https://apify.com/taroyamada/robotstxt-ai-checker"
    access_date: "2026-08-06"
    archive_url: "https://web.archive.org/web/20260806192139/https://apify.com/taroyamada/robotstxt-ai-checker"
    evidence: >
      Principal output is a delivered dataset row: one robots.txt AI-crawler
      policy check result per domain (billed event apify-default-dataset-item,
      "$0.011 per delivered result"). None of the enumerated units fits;
