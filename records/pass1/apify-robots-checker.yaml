    value: >
      Entry tier: Pay Per Event (only option), usage_based, no monthly/annual
      toggle, no periodic allowance to convert. Pricing tab: $11.00/1,000
      delivered rows = $0.011/row (vendor's own stated per-unit figure;
      arithmetic self-consistent, no conversion needed).
