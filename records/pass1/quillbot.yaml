coder_note: |
  BUNDLE NOTE (per orchestrator instruction): QuillBot sells ONE subscription (Premium) that unlocks
  a full tool suite, not a humanizer-only product. Vendor's own words, pricing page: "All Premium
  plans include: Paraphraser, Grammar Checker, Plagiarism Checker, AI Detector, AI Humanizer,
  Summarizer, Apps, Browser Extensions, Much more." The help center further lists AI Chat, Image
  Generator, AI Presentation Generator, Translator, Flow (storage), and Website Builder as also gated
  by the same Premium subscription. The humanizer is one of roughly ten tools unlocked by this one
  purchase; this record codes Premium (the plan that grants the humanizer) per the frame's AI-humanizer
  categorization — no humanizer-only SKU exists.

  ENTRY TIER: Premium is the only single-seat, generally-available, no-sales-contact standing paid
  plan. Annual-equivalent cost in the default display state (Annual) = $49.95/yr ($4.17/mo billed
  annually). Losing candidate: Team (quillbot.com/upgrade/teams) — self-serve, no sales contact
  required on the page itself, but its minimum purchasable block is 2 seats at $44.95/seat/yr
  (2-10 seat band) = $89.90/yr for the smallest block a buyer can actually purchase (sampling-rules
  7.2's "a buyer cannot buy less" rule for seat-block minimums), which exceeds Premium's $49.95/yr;
  Team loses. Its other bands (11-50 seats $39.95/seat/yr; 51+ $34.95/seat/yr) exceed Premium's
  single-seat cost by an even wider margin at their own minimums.

  ANNUAL-PRICING PRESENTATION (flagged by orchestrator as a known vendor pattern; confirmed true
  here): the /premium marketing page shows ONLY the Annual plan's monthly-equivalent figure ($4.17)
  with "billed annually" adjacent; it never displays a true monthly-billed price ($9.95/mo) or the
  annual total ($49.95) anywhere in its rendered/visible text. Both figures exist only inside the
  page's own embedded SSR JSON payload (script type=application/json, data-for=route-props), never
  in anything a visitor reads. DOM was inspected directly (not just text-extracted) to confirm: zero
  occurrences of "Monthly"/"Quarterly"/"Semi-Annual" as rendered text anywhere on the page, and the
  page's only role=tab structure is an unrelated testimonial carousel. Coded annual_default_toggle=
  no_toggle on that basis: there is no toggle control to preselect, only one displayed configuration.
  A naive 4.17 x 12 = 50.04 would MISSTATE the true first charge; the vendor's own embedded data
  states the annual total directly as 49.95 (used for first_charge_amount_usd instead of computing
  it) — a real $0.09 gap between the computed and the stated figure, exactly the "read a price twice"
  trap the instrument warns about.

  FREE-TIER LIMITS, TWO SOURCES: the pricing page states six free-plan features, three quantified
  ("Paraphrase up to 125 words", "Paraphrase in 2 modes", "Humanize up to 125 words, 6 uses/day") and
  three not ("Fix basic grammar errors", "Generate basic summaries", "Access AI Detector (limited)").
  The official help-center comparison article (360058341753) publishes a fuller, mostly-quantified
  table (Summarizing up to 1,200 words; AI Detector up to 1,200 words + 10 scans/day; Translator up
  to 5,000 characters; 20 AI Chat queries/day; 3 image generations/day; 3 AI presentation
  generations/day; 10 MB Flow storage; 5 Website Builder create/edit) that is not surfaced on the
  marketing pricing page at all — confirms the orchestrator's expectation that "the pricing page and
  the in-product copy often differ." See conflict_note for the one item (Humanizer) where the two
  sources give incompatible numbers rather than merely different precision.

  USAGE CAP ON PREMIUM: several Premium features carry an explicit quantified monthly/per-scan cap
  (listed in usage_cap_quantified's evidence). The core paraphraser/humanizer/AI Chat/Translator/AI
  Detector are marketed "Unlimited", but Learneo's general Terms of Service (incorporated by
  reference) reserves the right to impose "reasonable usage limits and restrictions (such as
  throttling, queuing, or other similar measures)" with no figure attached — the same fact pattern as
  the codebook's own Vendor U worked example — so those "Unlimited" claims are coded not-quantified
  and unquantified_limit_clause=present.

  COMMERCIAL USE (judgment call, flagged for adjudication): a three-way gradient in the Terms — Free:
  "personal, non-commercial purposes" (excluded); Premium: "personal use or your internal business
  purposes" (does not use the word commercial); Team: "personal or commercial purposes, including
  both internal and external business use" (explicit). Coded commercial_use_lowest_tier=highest_tier
  (Team) on the reading that "internal business purposes" is deliberately narrower than "commercial
  purposes ... external business use" and stops short of a general commercial-use grant. A reader
  could reasonably treat Premium's "internal business purposes" as already a form of commercial use;
  flagging for review rather than resolving silently.

  TRIAL: no free trial of Premium is documented anywhere (pricing page, both Terms documents, three
  help-center articles read); the free plan is a standing metered tier, not a time-limited trial. No
  A-012 concern — the Monthly/Quarterly/Semi-Annual/Annual options are all standard ongoing recurring
  terms at their own stated recurring rate, not a cheap intro period that jumps to a higher rate after
  a short window.

  WATERMARK: not mentioned in any document read (pricing page, Quillbot ToS, Learneo ToS, three help
  articles). Coded unknown rather than not_applicable because Premium's bundle now includes an AI
  Image Generator (300 images/month) — an output type that could carry a watermark — so positive
  evidence that "the construct does not exist for this product" (section 2.2's bar for not_applicable)
  is not met; the documents are simply silent.

  MINOR DOCUMENT INCONSISTENCIES (see conflict_note; neither affects an entry-tier coded value):
  (1) the refund help-center article cites Terms "Section 5" for the refund position, but
  quillbot.com/terms' own Section 5 is "Take-Down Requests", not refunds — the operative refund text
  was instead read directly from the help-center article and from Learneo's general Paid Services
  clause; (2) quillbot.com/terms Section 3 legal boilerplate labels "QUARTERLY" as "(4 MONTH)" while
  the same page's own embedded SSR pricing data defines Quarterly as a 3-month term ($19.95 total).

  CURRENCY (deviation D-003/D-007): request made from the study's Turkey network location. The
  pricing page's own SSR JSON explicitly tags every price object currency:USD despite detecting
  countryCode:TR, with priceVariants empty (no region-specific price override being served). No EUR/
  GBP/TRY symbols found anywhere on any page read. Treated as strong vendor-side evidence the reader
  is served USD, not a currency requiring unknown/non_usd.

  blindness: no other product's record, no aitoolspolice.com review page, and no pass-2 material was
  opened.
conflict_note: "Free-plan Humanizer limit: quillbot.com/premium states \"Humanize up to 125 words, 6 uses/day\"; the official help-center feature table (https://help.quillbot.com/hc/en-us/articles/360058341753-What-s-the-difference-between-a-free-and-a-Premium-account) states \"Humanize text (Advanced mode): 3 uses\" for Free — a different structure/number, not merely added precision. Pricing page ranks first for free-tier limits per protocol 6.2, so free_plan_cap_value is coded from it; the help-center figure is recorded here rather than silently dropped. Also: quillbot.com/terms Section 3 boilerplate labels a \"QUARTERLY (4 MONTH)\" subscription term while the same page's own embedded pricing JSON defines Quarterly as duration:3 (3 months, $19.95) — does not affect any coded value (entry tier is Annual/Premium). Also: the refund help article cites Terms \"Section 5\" for the refund position, but quillbot.com/terms' own Section 5 is \"Take-Down Requests\" — operative refund text was read from the help-center article and Learneo's general terms instead."
