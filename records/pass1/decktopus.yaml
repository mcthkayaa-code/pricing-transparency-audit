  first_charge_amount_usd:
    value: "119.88"
    source: s1
    access_date: "2026-08-07"
    evidence: "Read directly, not computed: the Pro Annual card itself prints 'billed $119.88/year' beneath the '$9.99/mo' figure, in the default display state. (9.99 x 12 = 119.88, consistent.)"
  mandatory_addon_present:
    value: "no"
    source: s1; s2; s12
    access_date: "2026-08-07"
    evidence: "Full Pro feature list (pricing page: 750 AI credits/mo, presentations & carousels, PDF/PPT/PNG export, one-click sharing, Loop, version history, mobile access) and ToS section 3.1 (general add-on clause, conditional on 'if your order includes additional add-on packages') read; no required charge beyond the plan price is stated for any advertised Pro feature. Loop is explicitly bundled ('Included on Pro and above -- Studio -> Loop is the full workflow, not two separate purchases', s1). The only priced extras found ('Top-Up Credits Packages', s12) are explicitly optional, purchased only if a subscriber exceeds the included 750/mo credits -- an overage/optional add-on excluded by decision rule 3, not a required charge."

  annual_condition_disclosure:
    value: adjacent
    source: s1
    access_date: "2026-08-07"
    evidence: "'billed $119.88/year' is printed directly beneath the '$9.99/mo' figure inside the same Annual price card -- same visual block as the headline figure."
  annual_default_toggle:
    value: annual_preselected
    source: s1
    access_date: "2026-08-07"
    evidence: "There is no click-to-switch monthly/annual toggle on this page (see default_display_state.billing_toggle) -- Annual, 3-Month and Monthly are three permanently co-present cards in one scroll. Coded annual_preselected because Annual functions as the page's default/featured billing period exactly as that value is meant to capture: it is first in reading order, the only one visually distinguished (dark gradient card vs the plain page background), and carries 'Best Value' + 'Save $180/yr' badges -- i.e. it is what a reader sees and is steered toward without clicking anything, which is the same state of affairs annual_preselected exists to record on vendors that use a literal toggle. Logged as a UI-pattern departure from the variable's literal 'toggle' framing rather than silently forced into no_toggle, whose own definition ('the page offers one billing period only') does not fit a page offering three."

  free_plan_exists:
    value: "yes"
    source: s3; s4
    access_date: "2026-08-07"
    evidence: "Help Center article 56, titled 'Can I use Decktopus without a subscription?', subtitled 'An overview of how subscriptions AND THE FREE VERSION operate': 'Yes, you can use Decktopus for free. Your first deck is free... You can create decks from scratch using various layouts and design elements.' The vendor's own subtitle names this 'the free version' as a standing counterpart to paid subscriptions, not a countdown. See coder_note for a documentation ambiguity: a sibling article (s4) badges the identical mechanic 'free trial' -- resolved against the codebook's own operative test (time-limited or not), not the vendor's label."
  free_plan_cap_documented:
    value: none_quantified
    source: s3; s4
    access_date: "2026-08-07"
    evidence: "The two restrictions the documents actually state are unquantified feature-gates, not numbers: 'you can't export' and 'your slides will have a Decktopus watermark' (s3, s4). The only number present, 'your FIRST deck is free' (singular), is not treated as a reliable quantified cap because the very next sentence in the SAME article (s4) contradicts strict single-deck framing by calling them 'free DECKS' (plural), and no document anywhere states the actual starting AI-credit balance a new/no-subscription user holds (s4 only says referrals 'earn 30 AI credits', not what the base balance is). Given that internal inconsistency and the missing base number, 'first deck' is read as onboarding phrasing, not a documented ceiling."
  free_plan_cap_value:
    value: "none quantified -- documented restrictions are unquantified (no export; Decktopus watermark on output); see free_plan_cap_documented"
    source: s3; s4
