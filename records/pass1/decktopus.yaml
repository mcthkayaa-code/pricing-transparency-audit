default_display_state:
  billing_toggle: "The Pro/Business segmented control at the top of the pricing card defaults to 'Pro' (dark/active) on every fresh load; Business requires a click. Within the selected tier's card, THREE billing-period options -- 'Annual' (Best Value, dark-highlighted, largest figure), '3-Month', and 'Monthly' -- are simultaneously present in the DOM and page flow (confirmed via getBoundingClientRect: all three headings report real, positive, visible dimensions at increasing Y-offsets in one continuous scroll), not behind a click-to-switch toggle. 'Annual' is first/topmost and the only one styled with a dark gradient card, a 'Best Value' badge and a 'Save $X/yr' badge; '3-Month' and 'Monthly' sit below it in the normal page flow without equivalent emphasis. No billing-period toggle was clicked; the Pro/Business tier control was clicked once (after recording Pro's default state) solely to read Business's figures for the entry-tier comparison required by sampling-rules.md 7.2, per protocol-v1.md 6.3's allowance to switch a display toggle after recording the default state."
  cookie_consent: "No cookie-consent banner appeared on https://www.decktopus.com or https://www.decktopus.com/pricing at any point in this pass; nothing was clicked or accepted."
  currency: "USD throughout; no non_usd values in this record."

