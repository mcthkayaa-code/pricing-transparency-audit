conflict_note: not_applicable

coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md section 7.2). Winner: Pro, Annual sub-option,
  $9.99/mo, billed $119.88/year (the default-display-state figure -- Annual is the
  topmost/only visually-emphasized of the three simultaneously-shown billing options on
  Pro's own card; see default_display_state and annual_default_toggle evidence), single
  user, generally available, purchasable without contacting sales -> annual-equivalent
  $119.88/yr. Losing candidates:
  - Business: per-seat pricing, Annual sub-option $19.99/mo/seat, billed
    $239.88/seat/year -> annual-equivalent $239.88/seat/yr (single-seat variant per
    eligibility rule 4). No minimum-seat count is stated anywhere found (pricing page,
    the Pro-vs-Business Help Center article, or the Business-collaboration article) --
    unlike some competitors' team tiers, Business appears purchasable from 1 seat.
    Excluded either way: higher annual-equivalent than Pro regardless of any minimum.
  - Enterprise: "For organizations deploying Decktopus company-wide" / "Let's Talk" ->
    links to a Brevo meeting-scheduler, no published price. Excluded, fails eligibility
    criterion 2 (not purchasable without contacting sales); this is the product's
    no_public_price case but does not govern entry_tier_name since an eligible
    self-serve candidate (Pro) exists.
  - Pro's OWN 3-Month ($19.99/mo, billed $59.97/3mo -> annualized $239.88/yr) and Monthly
    ($24.99/mo, billed $24.99/mo -> annualized $299.88/yr) sub-options were read (all
    three sub-options sit on the one card, see default_display_state) but are not the
    default-display-state figure and are not used for the price-basis comparison, per
    sampling-rules.md 7.2 rule 1.
  Only Pro-Annual was the default-state figure for the cheapest eligible tier; Business's
  own default-state (Annual) figure was read for comparison only, per protocol-v1.md 6.3's
  allowance to switch a display toggle after recording the default state.

  FREE-PLAN vs FREE-TRIAL LABELING AMBIGUITY. Decktopus's own Help Center is internally
  inconsistent about what to call its no-subscription usage mode. Article 56
  (https://help.decktopus.com/en/articles/56-can-i-use-decktopus-without-a-subscription),
  subtitled "An overview of how subscriptions and THE FREE VERSION operate," and article
  57 (https://help.decktopus.com/en/articles/57-does-decktopus-provide-a-free-trial),
  titled "Does Decktopus provide A FREE TRIAL?", describe the IDENTICAL mechanic in nearly
  identical prose ("Your first deck is free... you can't export and your slides will have
  a Decktopus watermark... subscribe" to remove) -- one calling it a "free version," the
  sibling literally titled "free trial." Neither article, nor the ToS (zero matches for
  "trial" across its full text), states any time limit. Coded per the codebook's own
  operative test (time-limited = domain 4 trial; zero-cost/no-time-limit = domain 3 free
  plan), not the vendor's inconsistent label: free_plan_exists = yes, trial_exists = no.
  Flagged for a second coder/adjudicator to independently weigh, since this is exactly the
  kind of vendor self-contradiction the study is designed to surface.

  cost_per_output_unit REASONING (slide vs. presentation). Decktopus's product category is
  "AI presentation," and cost_per_output_unit's enum lists per_presentation as a
  first-class option -- the more obvious-looking fit. Coded "other" (per_slide) instead,
  for two reasons: (1) the vendor's OWN documents never publish a credits-per-presentation
  rate, and explicitly say one cannot exist because presentations vary in length --
  "how far your credits go depends on how many slides you create" (article 60); only a
  credits-PER-SLIDE rate (5 credits) is fixed and published. (2) This follows the
  codebook's own worked example for an analogous case: a video generator is coded
  per_video_minute (the granular metered sub-unit), not "per video" (the variable-length
  whole deliverable) -- codebook-v1.md section 7 domain 6, Vendor M example. Slide is to
  presentation what minute is to video here. Naming it "other" rather than forcing
  per_presentation avoids overstating computability: had per_presentation been coded, the
  correct value of credit_to_output_rate_published / cost_per_output_computable would
  instead have been "partial" (rate/computation possible only for the slide sub-unit, not
  the variable-length principal "presentation"), per rule 5. A second coder who reads this
  differently should get partial on both instead of yes -- flagged so that disagreement is
  legible rather than silent.

