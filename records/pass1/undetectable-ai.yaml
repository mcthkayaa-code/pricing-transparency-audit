coder_note: |
  ENTRY-TIER CANDIDATES (sampling-rules 7.2, default Yearly display state):
  10K words/month = $5.00/mo, billed annually $60.00/yr -> lowest annual-equivalent, SELECTED.
  20K words/month = $9.50/mo, billed annually $114.00/yr -> losing candidate.
  35K words/month = $15.75/mo, billed annually $189.00/yr -> losing candidate.
  50K-380K words/month (slider tier) = $21.25/mo base, annual total not printed on-page -> losing
  candidate regardless (base already exceeds the 10K tier's annual-equivalent).
  Business/Enterprise tier = sales-gated ("Contact Us"), excluded from candidacy under eligibility
  rule 2 (not purchasable without contacting sales).

  MONTHLY vs YEARLY TIER ASYMMETRY: switching the toggle to Monthly (done only after recording the
  default state, permitted under protocol 6.3/6.8) shows a DIFFERENT tier ladder - 20K/$19.00,
  35K/$31.00, 50K/$42.00, 80K-unlimited/$64.00 - with NO 10K option at all under monthly billing.
  The 10K-words/mo tier exists exclusively under annual billing. Recorded as a product
  characteristic (both states reached by deliberately toggling one control on one load), not a
  section-6.8 display_variant (that classification requires two DIFFERENT DEFAULT states across
  two separate page loads, which was not observed here).

  BUNDLE: every paid humanizer tier's feature list includes "Unlimited AI Detecting" - the tier
  coded here is a HUMANIZER+DETECTOR BUNDLE in the vendor's own wording, not a humanizer-only plan.

  A-012: not applicable to this record. No paid time-limited intro period was found; the trial is
  free (not a low-cost paid tier), so the literal token is deliberately omitted.

  REFUND - FOUR DIFFERENT STATEMENTS ACROSS THREE OFFICIAL DOCUMENT CLASSES, reading the whole
  pricing page including its embedded FAQ per instructions:
  (1) Terms 6.1 AND Terms 27 (internally consistent with each other, contractual class, ranks
  highest): "Refund of credits is only available if a submission provably flags as less than 75%
  human on a reputable AI detector. Refund of credit or payment requests must be made within 30
  days of incident." -> CODED (refund_conditions=conditional, refund_window_days=30).
  (2) Pricing-page top banner (marketing, same kind/quality condition as Terms but no window
  stated): "Money back guarantee. If anything we produce is flagged as not human, we will refund
  the cost of humanization."
  (3) Pricing-page FAQ, JSON-LD, same page as (2) but a different condition/window: "We offer a
  satisfaction guarantee. If you're not happy with our service within the first 7 days, contact
  our support team for a full refund." 7 days, general dissatisfaction - NOT the 30-day
  AI-detection-threshold condition Terms states, and not resolved by picking one; recorded as a
  disagreement since pricing page ranks below Terms for this contractual variable class.
  (4) Help center FAQ ("What is the UNDETECTABLE guarantee?"): "If anything we generate is
  detected by any AI detector... we will refund the cost of the generation, no questions asked."
  No window stated; "no questions asked" sits in tension with Terms' "provably flags" (which
  implies a proof burden).
  Per protocol 6.2/codebook 2.1 step 3, Terms outranks both the pricing page and the help center
  for contractual variables, so (1) is coded and (2)-(4) are recorded here as the disagreement
  rather than picked from. refund_policy_exists=yes and refund_conditions=conditional are stable
  across all four statements (all agree some condition applies); only the window and the exact
  condition wording move.

  CANCELLATION - jurisdiction split in Terms 6.3/6.4: non-California/non-New-York residents (the
  general/default case) must cancel by email ("All other users may cancel by emailing us");
  California and New York residents get a self-serve account-dashboard option instead. Coded
  contact_required as the general/default rule; the regional carve-out is not a separate coded
  value the instrument provides for.

  TRIAL LENGTH - the pricing page's own persistent (non-popup) footnote states a USAGE cap only:
  "Free Trial is limited to 250 words," no day-count given. A separate interstitial popup shown on
  page load (same domain, dismissed via its close control before reading the cards beneath) says
  "Sign up for a FREE 3-day trial!" - a DAY-based claim in a different unit, not corroborated by
  the FAQ, Terms, or Help. Codebook's trial_length_days conflicting rule contemplates two
  incompatible figures in the SAME unit (e.g. 7 days vs 14 days); a word-cap and a day-count are
  not directly comparable, so conflicting was not used - coded unknown instead with both claims
  recorded here per the instruction that the gap itself is the finding.

  WATERMARK - "Watermark and future proof" is printed identically on every paid tier's feature
  list. Grammatically ambiguous: could mean "watermark-free and future-proof" (a dropped word) or
  could mean outputs DO carry a watermark. The vendor separately sells an unrelated "AI Text
  Watermark Remover" product (for OTHER tools' AI-provenance watermarks per nav), which makes a
  "watermark-free" reading plausible but that is cross-referencing a sibling product to fill a gap,
  which the protocol's no-inference rule bars - coded unknown rather than resolved by inference.

  OUTPUT RIGHTS - Business/Enterprise tier's exclusive feature "Redistribution & white labeling"
  implies (but nowhere states) that the entry tier lacks that specific right; Help FAQ says the
  vendor serves clients "in a wide range of industries, including... finance, legal, and
  marketing" (descriptive marketing, not a rights grant). Neither is a direct statement answering
  commercial_use_lowest_tier or output_ownership_statement, so both stayed unknown.

  PRICING PAGE FRAMING - the "50% off"/"SALE" badge is the page's standing, everyday annual-vs-
  monthly pricing structure (present on every read, no stated expiry/end date), not a limited-time
  promotional plan under sampling-rules 7.2 eligibility rule 3.

  A/B-TEST SIGNAL - the pricing page's root container carries data-attribute value "pricing page
  variation-a-v1". This suggests the vendor may run pricing-page layout variants, but only one
  state was actually observed on this pass (one load, confirmed consistent across a static curl
  fetch and a rendered browser read), so this was NOT logged as a section-6.8 display_variant
  register event, which requires witnessing two different states. Flagged here per protocol
  section 9 item 13 (a variant a coder is never served cannot be detected by a documents-only
  study) so a reader knows the exposure exists even though it wasn't triggered.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Terms (governs, contractual class): refund window 30 days of incident, condition = AI-detector flags submission <75% human. Pricing-page FAQ (same page, ranks lower): 7 days, general dissatisfaction. Pricing banner + Help FAQ: no window stated, 'detected by any AI detector, no questions asked'. Full breakdown in coder_note."
