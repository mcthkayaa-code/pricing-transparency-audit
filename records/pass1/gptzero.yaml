  capture that actually contains price figures -- re-tested the same snapshot
  checked under the original D-003 pass, https://web.archive.org/web/20260807100537/https://gptzero.me/pricing:
  identical result, every figure a "$0" pre-hydration placeholder, not a real
  price. A Wayback CDX query for a newer snapshot timed out twice (effort cap);
  the Wayback UI's own current redirect confirms no newer capture exists. Full
  log: gptzero-sources/d007-currency-recheck-2026-08-10.txt.
  OUTCOME: value CHANGED, but not to a money figure. headline_price_usd moves
  from non_usd to unknown: the amended rule requires POSITIVE evidence the
  vendor publishes only a non-USD price before non_usd can stand, and here the
  vendor's own ToS argues the opposite (it claims USD billing), while no arm
  supplies an actual number to code as money -- the honest value for "vendor
  disputes non-USD but no figure exists anywhere" is unknown, not non_usd.
  first_charge_amount_usd stays unknown (unchanged in value -- it was already
  unknown for the independent, still-valid billing-frequency reason); only its
  and computation_assumptions's stray cross-references to the old
  headline_price_usd=non_usd value are corrected. cost_per_output_computable is
  unaffected in value or in its TRY-denominated arithmetic, since that
  variable's rule never gated on headline_price_usd's specific value. The
  existing register_events display_variant entry's stale "non_usd stands"
  conclusion is corrected in place; its original observation fields (the TRY
  read, the original D-003 archive finding) are preserved unedited.

conflict_note:
  - id: annual_billing_help_article_stale
    variables_affected: [annual_default_toggle, headline_billing_basis, annual_condition_disclosure]
    summary: >
      The official support article "Do you have an annual billing option?"
      (re-fetched fresh 2026-08-09; unchanged) still states "Not yet, but we are
      currently working on it, and hope to release the feature within a few weeks
      to come" ("Last updated 11 months ago" per its own stamp) — directly
      contradicted by the D-005 rendered capture, which shows an annual Billing
      Cycle control already live and preselected, labelled "(Save 45%)", on both
      the Premium/Professional cards and the Professional Plan widget, and by the
      "How can I create a team subscription?" article's "choose whether to sign up
      for the Annual or Monthly Professional plan." Per protocol-v1.md 6.2 the
      pricing page ranks 1st for pricing-class variables, so all three variables
      are coded from the pricing page's rendered state and the help article is read
      as stale rather than as evidence annual billing is unavailable. Recorded per
      protocol-v1.md 6.2's instruction that a marketing/documentation gap is
      reported "even where the hierarchy settles the coded value cleanly."
    urls:
      - https://gptzero.me/pricing
      - https://support.gptzero.me/articles/9783812961-do-you-have-an-annual-billing-option

  - id: commercial_use_vs_marketing
    variables_affected: [commercial_use_lowest_tier]
    summary: >
      Not a two-official-source value conflict in the codebook's technical sense
      (the pricing page never states a commercial-use RIGHT to disagree with the
      ToS), but a marketing-vs-contract gap protocol-v1.md 6.2 requires recording
      regardless. ToS Section 8, the governing document for this contractual
      variable, restricts all Site use, by default, to non-commercial purposes
      "except those that are specifically endorsed or approved by us." The D-005
      capture shows the pricing page simultaneously marketing an "Enterprise and
      Team Plans" path explicitly "for your organization", trust badges ("Trusted
      by over 10 million teachers and students", "Used in over 100 countries",
      "Official AI detector partners of the American Federation of Teachers"), and
      an "API for developers" section aimed at platform integration — audience-and
      -scale positioning that reads as inviting institutional/business use, on
      pages that never state a commercial-use grant. Coded not_granted from the
      higher-ranked ToS per codebook rule 1; the gap itself is the finding.
    urls:
      - https://gptzero.me/terms-of-use.html
      - https://gptzero.me/pricing

  - id: tos_usd_vs_pricing_page_try
    variables_affected: [headline_price_usd, first_charge_amount_usd]
    summary: >
      Not a two-source disagreement the codebook's `conflicting` value applies to
      (headline_price_usd/first_charge_amount_usd are pricing-class variables and
      the pricing page's own displayed currency governs them under protocol-v1.md
      6.2, so non_usd/unknown stand as coded), but a genuine documentary tension
      worth recording on its own terms. ToS Section 5, "FEES AND PAYMENT": "All
      payments shall be in U.S. dollars." The D-005 rendered capture shows every
      price on the pricing page in TRY, with no USD figure anywhere, and the D-003
      web.archive.org check (coder_note) found none either. Read together, this
      suggests a USD charge amount likely exists on GPTZero's backend behind a
      geo-localized TRY display (the "300.000"-style Turkish thousands-separator
      formatting on the same page supports a locale-driven display, not a
      TRY-denominated product), but no official document available to this
      documents-only, Turkey-network study states what that USD figure is. This is
      exactly the kind of buyer-position finding the study measures: undeterminable
      for this reader from public materials, not merely undisclosed by the vendor.
    urls:
      - https://gptzero.me/terms-of-use.html
      - https://gptzero.me/pricing

