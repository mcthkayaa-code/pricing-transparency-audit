coder_note: >
  D-005 RE-COLLECTION. This record replaces the 2026-08-07 pass-1 record in full.
  The prior record's two attempts to read gptzero.me/pricing statically both showed
  only a pre-hydration "$0" placeholder (confirmed by that pass's own JS-source
  inspection: the price is fetched at runtime, not server-embedded, so a
  non-executing fetch could never resolve it) and coded headline_price_usd, and
  everything price-dependent, unknown/no. Per the codebook's D-005 rule ("rendered
  reads are documentary"), this coder was given an orchestrator-captured ordinary
  -browser RENDERED read of the same URL, dated 2026-08-08
  (gptzero-sources/pricing-rendered-2026-08-08.txt), and did not fetch the pricing
  page directly. All six A-domain variables (headline_price_usd,
  headline_billing_basis, first_charge_amount_usd, mandatory_addon_present,
  annual_condition_disclosure, annual_default_toggle) are coded from that capture.

  WHAT CHANGED VERSUS THE SUPERSEDED RECORD, AND WHY. The rendered capture revealed
  something the superseded record could not see at all: a real, resolved price grid
  with TWO self-serve paid plans, PREMIUM (TRY 549/mo billed annually, "MOST
  POPULAR" tag, up to 300,000 words/month) and PROFESSIONAL (TRY 1,049/mo billed
  annually, 500,000 words/month) — not one plan as the superseded record concluded.
  Re-applying sampling-rules.md 7.2 mechanically (lowest annual-equivalent
  single-seat cost among eligible candidates) now returns PREMIUM, not Professional:
  Premium 549x12=6,588 TRY/yr beats Professional 1,049x12=12,588 TRY/yr. Both are
  self-serve ("Choose Plan", no sales contact), standing (not promotional) plans, so
  both are eligible; Professional is recorded here as the losing candidate at its
  12,588 TRY/yr annual-equivalent. "Enterprise and Team Plans" is not a separate
  candidate: its own copy reads "Everything you get with a Professional plan, for
  everyone" and its purchase paths are self-serve team creation (not a distinct
  priced tier) or "Contact Sales" (fails eligibility rule 2). "API for developers"
  is a distinct product line with its own "View Pricing"/"Contact Sales", not a plan
  tier. entry_tier_name therefore changes from "Professional Plan" to "Premium".
  This is a mechanical consequence of the codebook's own price-basis rule applied to
  newly-visible evidence, not a judgment call.
  Values that changed as a direct or cascading result: headline_price_usd
  (unknown -> non_usd, TRY 549/mo); first_charge_amount_usd (unknown, same value,
  now for a currency/billing-mechanic reason rather than a fully-unresolved price);
