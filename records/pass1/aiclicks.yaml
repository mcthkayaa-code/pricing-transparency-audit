conflict_note: >
  (1) Trial coverage for the Business tier is inconsistent between two
  official pages of equal rank: the homepage FAQ (https://aiclicks.io)
  states "All plans include a 3-day free trial," while the dedicated
  pricing-page FAQ (https://aiclicks.io/pricing) states "Starter and Pro
  plans include a 3-day free trial... Business plan includes a live demo
  with the team." The Business plan card's own CTA button on the pricing
  page itself also reads "Start a 3-day trial" (matching the homepage),
  contradicting its own page's FAQ text lower on the same page. Protocol-v1.md
  6.2 gives no hierarchy distinguishing a homepage FAQ from a dedicated
  pricing-page FAQ within the same (pricing) variable class, so this cannot
  be resolved by rank. Does not change any coded value: the entry tier is
  Starter, and every source agrees Starter carries an unconditional 3-day
  trial with no card required (trial_exists, trial_length_days,
  trial_card_required all unaffected).

  (2) credit_system_present is coded "no" from the pricing page
  (https://aiclicks.io/pricing), which frames every plan allowance directly
  in output units and is the higher-authority document for this variable
  class per protocol-v1.md 6.2. Two lower-authority documents use
  credit-adjacent wording for the same allowances: docs.aiclicks.io/create-prompts
  states an activated prompt "consumes prompt credits from your team's
  remaining prompts," and the Help Center billing tutorial
  (docs.aiclicks.io/help-center/faq/billing, embedded Loom video,
  https://www.loom.com/share/e1c13d1239294424862883ee6f3df33f) shows an
  in-app billing-dashboard frame headed "AVAILABLE CREDITS" over two
  separate direct sub-counts, "Prompts" and "Blog Posts" — no shared/fungible
  pool and no stated conversion rate between them. Coded from the
  higher-authority pricing page per protocol-v1.md 6.2; this terminology
  divergence is recorded here rather than changing credit_system_present,
  credit_unit_defined, credit_to_output_rate_published, or credit_rate_location.

coder_note: >
  Entry-tier selection (sampling-rules.md 7.2): eligible candidates were
  Starter ($59/mo), Pro ($189/mo), Business ($499/mo); Enterprise was
  excluded as ineligible under rule 2 ("Custom" price, "Book a Call" CTA,
  sales-gated, no self-serve purchase path). Annual-equivalent cost in the
  default Monthly display state (monthly figure x12): Starter = 708.00
