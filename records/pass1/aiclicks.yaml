default_display_state: >
  Pricing page (https://aiclicks.io/pricing) loads with the Monthly/Yearly toggle
  set to Monthly (visually highlighted, active pill); the Yearly option, labeled
  "Up to -29%", is not selected. All four plan cards (Starter, Pro, Business,
  Enterprise) display their monthly-billed figures ($59, $189, $499, Custom) with
  no annual-prepay qualifier attached, since annual is not the loaded state.
  Observed on 2026-08-06 after declining non-essential cookies where a consent
  prompt appeared; no reload was performed before recording this state; the
  fresh page load was independently confirmed by the web.archive.org save
  request (server-side fetch, not reliant on browser session state), which
  captured the same default. No display-variant was observed on a later read
  within this pass, so no register_events entry was needed for this rule.

