  pricing URL). Billing interval control defaults to "Monthly" on load, confirmed both
  visually (white/active pill on "Monthly", "Yearly" inactive) and via DOM inspection
  (the Monthly option element carries the component's own "...selected..." CSS class;
  the Yearly element does not). Plan cards in this state: FREE $0/mo, STARTER $19/mo,
  DAILY $39/mo, HARDCORE $69/mo. The FREE card additionally shows a "Temporarily paused"
  notice over its signup action. No cookie/consent banner was presented to accept or
  decline. Annual-toggle price figures were not obtainable: the toggle click did not
  reach the page's handler in this session's browser tool (verified via DOM re-read
  showing no state change after repeated click attempts), and annual figures are not
  present in the pre-click DOM (client-computed on toggle, not server-rendered), so no
  value in this record is anchored to the Yearly state. Not needed for any coded
  variable: the entry-tier selection and all Domain-1/2 variables use the Monthly
  default state per protocol section 6.8 rule 4 (no reload/interaction-hunting for a
  different state).

