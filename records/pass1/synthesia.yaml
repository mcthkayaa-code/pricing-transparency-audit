coder_note: |
  Entry tier selection (sampling-rules 7.2): eligible paid candidates were Starter ($18/mo
  yearly default = $216.00/yr annual-equivalent, single seat/1 editor) and Creator ($64/mo
  yearly default = $768.00/yr, losing candidate). Starter wins on lowest annual-equivalent
  cost. Excluded as ineligible: Enterprise (sales-gated, "Let's talk" / Book demo, no
  published price, fails criterion 2); "Personal" plan, found only in the help-center pricing
  article, is in maintenance mode and closed to new signups ("If your subscription expires,
  you can only subscribe to a plan that isn't in maintenance mode") -- fails criterion 1,
  generally available to any buyer.

  Judgment calls made, flagged for reviewer attention:
  1) refund_policy_exists coded no_refunds_stated rather than yes, even though the Contract
     does carve out one scenario (termination-for-cause refund of prepaid remainder-of-term
     fees). This mirrors the codebook's own worked example (Vendor Q, "non-refundable except
     where required by law" -> no_refunds_stated with the exception noted) -- both official
     sources (ToS, help center) lead with "non-refundable" as the headline position.
  2) commercial_use_lowest_tier coded free, not lowest_paid. The Video Licensing help article's
     allowed/not-allowed table is gated by AVATAR TYPE (stock/synthetic vs custom), not by
     plan tier, and Basic/free already includes 9 stock avatars (compare table), so the same
     licence (business use allowed; only PAID ADVERTISING disallowed) reads as applying from
     the free tier up. No document ties the licence table to a paid subscription.
  3) first_charge_amount_usd coded conflicting: see conflict_note. Not a coder misread -- the
     $18/mo card figure was confirmed in raw HTML (span[yearly-per-month-starter]="18", w-tab-
     pane w--tab-active = the Yearly pane) and via screenshot, independent of the FAQ figure.

  Read-twice / row-mapping checks performed (not merely trusted text-extractor order):
  - Price card figures confirmed via DOM attributes (pricing-string spans: currency-symbol +
    price + month, e.g. yearly-per-month-starter="18") AND a screenshot, not just innerText.
  - Yearly-vs-Monthly default state confirmed via aria-selected/w--current on the Webflow tab
    control and via which w-tab-pane carries w--tab-active, not from which price printed first.
  - Compare-table "Personal Avatars" and "Studio Avatars" rows re-verified cell-by-cell by
    indexed child element (idx0=label,1=Basic,2=Starter,3=Creator,4=Enterprise) rather than
    flattened text, after a duplicate mobile-accordion DOM instance produced a different-
    looking readout for the Studio Avatars row (see below).
  - Observed, not used to code anything: the pricing page renders the "Studio Avatars" row
    TWICE in the DOM (desktop table + a separate mobile accordion list). The desktop instance
    shows the $1,000/year paid add-on available on Enterprise only (cross icons on Basic/
    Starter/Creator); the mobile-accordion instance shows it available on Starter/Creator/
    Enterprise too. Immaterial to mandatory_addon_present either way, since a Studio Avatar
    is an optional premium upsell, not required to use Starter as advertised -- flagged only
    for completeness.

  Currency: USD ($) served directly on every read, no country/currency selector or geo-based
  price found anywhere on the pricing page; no non_usd signal arose so the D-003 arm-by-arm
  check was not needed.

  A-012: not applicable -- no paid time-limited intro period found (Synthesia's trial-adjacent
  offerings are a free plan and a free one-off "try for free" video generator, not a discounted
  paid intro period).

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Same-URL, same-authority conflict on https://www.synthesia.io/pricing (pricing
  page ranks first for pricing variables; no sub-hierarchy between page sections). The default
  Yearly-tab price card (DOM-verified, w-tab-pane w--tab-active) shows Starter at $18/mo, which
  implies a $216.00/yr annual total (18x12). The SAME page's FAQPage JSON-LD, answering 'How
  much does Synthesia cost?', states verbatim: 'For Starter plan users, Synthesia costs $29 per
  month or $264 if you go with an annual plan.' 264/12=$22.00/mo and 89(Creator monthly)->
  804/12=$67.00/mo, neither of which matches the live $18/mo or $64/mo card figures (both clean
  round numbers, consistent with the FAQ predating the page's own 'NEW LOWER PRICES - Save 38%'
  promotional banner and struck-through reference prices). Coded first_charge_amount_usd =
  conflicting rather than inferring the FAQ is stale, per protocol's bar on inference. Both
  statements are on https://www.synthesia.io/pricing, accessed 2026-08-12, archived at
  https://web.archive.org/web/20260812114521/https://www.synthesia.io/pricing."
