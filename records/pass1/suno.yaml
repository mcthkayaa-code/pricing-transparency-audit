conflict_note: |
  trial_exists: the ToS (lower authority for trial terms per protocol 6.2's pricing-variable
  hierarchy: pricing page 1st, documentation 2nd, ToS 3rd) contains a generic "Free Trial"
  clause -- "You can sign up for a trial for the paid portion of the Service and your trial
  period starts on the day you sign up... (or if not specified, then 7 days)" -- describing
  trial mechanics in the abstract. The live pricing page (https://suno.com/pricing, checked
  twice, 2026-08-12 and 2026-08-13) shows no trial CTA or mention anywhere -- only "Sign up"
  (free) and "Subscribe" (Pro/Premier) -- and 8 official help-center articles checked are
  likewise silent on any trial. Coded trial_exists=no from the higher-authority pricing page
  plus silent documentation, per codebook rule 2.1 step 3 and trial_exists rule 3. Both URLs:
  https://suno.com/pricing and https://suno.com (ToS). Flagged for adjudicator review since the
  ToS clause is affirmatively worded ("You can sign up for a trial") rather than clearly
  legacy/unused boilerplate, though nothing in this documents-only study can settle whether it
  is currently active (e.g. as a mobile-app-store-specific flow not shown on the web pricing
  page) without contacting the vendor, which protocol 6.3 prohibits.

coder_note: |
  BLINDNESS: no other product's record, no review page under site/content/reviews/, and no
  pass-2 material was opened at any point in this collection. Only the files this agent's
  instructions permit were read.

  ENTRY TIER: Eligible paid candidates were Pro Plan ($8/mo default annual-preselected state;
  annual-equivalent 8x12=$96.00/yr) and Premier Plan ($24/mo annual-preselected;
  annual-equivalent 24x12=$288.00/yr). Free Plan ($0/mo) is not a paid-tier candidate. Pro Plan
  wins on lowest annual-equivalent cost; Premier Plan is the losing candidate at $288.00/yr.

  SECOND-REPRESENTATION CONFIRMATION: every price figure was checked in at least two
  representations across two independent reads a day apart (2026-08-12 static+DOM,
  2026-08-13 rendered text + DOM radio-input query) and cross-validated by arithmetic: the
  displayed $8/mo and $24/mo annual figures, combined with the page's own "save $24/yr" and
  "save $72/yr" badges, resolve to exactly $10/mo and $30/mo monthly-billed equivalents, each
  a precise 20% discount matching the page's "SAVE 20%" badge. No superscript/formatting
  misread risk found; both reads agree exactly.

  CURRENCY: suno.com/pricing serves USD ($) figures directly regardless of the Turkish-
  localized UI strings served to this collection's network location; no currency selector or
  localized-currency figure was observed, so the D-003 currency check resolves trivially --
  the vendor serves USD directly, arm 1 of the currency-check ladder.

  ARCHIVAL: per this run's instructions and deviation D-012 (Wayback rate-limiting), no
  web.archive.org saves were attempted this run. All sources are archive_status=local_copy_only
  with dated verbatim local captures: suno-sources/pricing-page-annual-default-2026-08-12.txt
  and suno-sources/tos-full-text-2026-08-12.txt (top-level product dir, from an earlier run),
  plus records/pass1/suno-sources/pricing-page-2026-08-13-rendered-text.txt and
  records/pass1/suno-sources/help-center-articles-2026-08-13.txt (this run).

  TOS SCOPE: the ToS capture truncates at a 50,000-character tool limit partway through the
  Arbitration Procedures section. Every commercially-relevant clause (Fees, Subscription
  Renewals and Cancellations, Free Trial, Payment Processing, Refunds and Cancellations,
  Commercial Use, Content/Output ownership) was captured in full before that cutoff point;
  nothing coded here relies on text past the truncation. The ToS page also carries a banner,
  "Our terms are changing soon. See here to view the new terms," dated Last Revision March 26,
  2026 -- coded from the currently-live version as read; worth a priority re-check at the
  mid-window recheck since a replacement is apparently pending.

  TERMINOLOGY: the pricing page names the zero-cost tier "Free Plan" / "Ücretsiz Plan"; the
  official help center instead calls the same tier "Basic" throughout (e.g. "reverts to the
  Basic plan," "Basic (free) plan"). Same construct, inconsistent vendor naming across its own
  document classes -- not coded as a conflict since no VALUE disagrees, only the label.

  REFUND JUDGMENT CALL: refund_policy_exists was coded "yes" rather than "no_refunds_stated"
  because the ToS's own carve-out ("unless otherwise determined by Suno") is open-ended rather
  than a narrow statutory exception, and the official help-center article
  (help.suno.com/en/articles/2550209) spells out real, concrete categories where Suno commits
  to refunding (pro-rata on discontinuation; accidental payment; accidental/unattended signup;
  malfunction credit). A stricter reading could code this "no_refunds_stated" with the
  exceptions folded into refund_conditions instead of refund_policy_exists=yes -- flagged
  explicitly for the adjudicator; both source URLs and full quotes are in the variable's
  evidence field and in this repo's help-center-articles-2026-08-13.txt.

  CREDITS -- WHAT SUNO DOES AND DOES NOT DEFINE (per this run's specific brief): checked
  whether Suno defines what one credit buys (credit_unit_defined) -- it does NOT, across 10
  official documents (pricing page, ToS, 8 help-center articles). Checked whether credits roll
  over (credit_rollover_policy) -- they do NOT for the plan-included allotment
  (expires_at_period_end, help.suno.com/en/articles/2524993 titled "Why did my credits reset?"
  is explicit and unambiguous), though PURCHASED top-up credits are a separate bucket that
  "do not expire, but require an active subscription to use" per the pricing page's Need More
  section -- a meaningful two-tier nuance, not coded as conflicting since the two credit types
  are distinct constructs, both stated consistently. Checked whether a failed generation
  consumes credits (failed_generation_charge_policy) -- no official document addresses this at
  all (unknown); searched the ToS in full plus the Billing, Accounts, Rights & Ownership and
  Troubleshooting help-center categories specifically for this.

  NON-AUTHORITATIVE ARITHMETIC (explicitly NOT used to code any variable, per this run's
  fabrication-avoidance instruction): Free tier shows 50 credits/day (pricing page + help
  center) alongside a separately-listed 10 songs/day cap (Compare Suno plans table); Pro shows
  2,500 credits/month alongside a separately-listed 500 songs/month cap (same table). Both
  ratios reduce to 5 credits/song if divided evenly. The vendor never states this connection
  in any of the 10 documents read -- the two figures live on independent, unconnected rows/
  sources -- so this is coder inference, not a published rate, and credit_unit_defined /
  credit_to_output_rate_published are coded "no" rather than "yes"/"partial" on this basis.

  OUTPUT OWNERSHIP: Suno's ToS explicitly defines "Output" as a distinct term ("generate and
  return audio and visual output... ('Output', and together with the Submissions, 'Content')")
  and then, unlike the pattern flagged in this run's brief, DOES assign ownership of it --
  conditionally, to Pro/Premier subscribers only, for Output generated during the paid term.
  Free/Basic-tier users receive a personal/non-commercial use license only, with no ownership
  assignment. See output_ownership_statement=conditional and its evidence for exact quotes.

