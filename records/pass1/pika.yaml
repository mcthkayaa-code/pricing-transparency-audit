coder_note: |
  ENTRY-TIER SELECTION: Candidates were the three paid cards, Standard/Pro/Fancy (Basic at $0
  is the free plan, domain 3, not a "paid tier" -- codebook separates these constructs and
  headline_price_usd's own not_applicable definition ties "paid tier" to a product having one
  at all, distinct from a free plan). Annual-equivalent costs in the default (Yearly) display
  state: Standard 8*12=96.00 (winner), Pro 28*12=336.00 (lost), Fancy 76*12=912.00 (lost).

  CODER-TOOLING MISREAD CAUGHT AND CORRECTED (per "read a price twice" rule): an initial
  WebFetch (AI-summarized) read of the pricing page reported Standard=$28 ("Best value") and
  Pro=Fancy=$76 (duplicate). A second representation -- raw HTML fetched via curl, with card
  boundaries and h3/price DOM positions parsed directly -- shows this was wrong: the "Best
  value" badge belongs to Pro ($28), not Standard, and Standard is actually $8 while Pro is
  $28 and only Fancy is $76. The true reading (Basic $0, Standard $8, Pro $28 "Best value",
  Fancy $76) is confirmed by exact byte offsets of each card's price span vs. its h3 heading
  in pricing-raw.html and is what this record codes throughout.

  CREDIT SYSTEM COMPLEXITY: the FAQ publishes a second credit-to-output table for what it
  labels "2.2 Model" (plus separate Turbo/Pro Mode/1.0/1.5/2.1 figures), with different credit
  counts than the pricing page's "Model 2.5" table used for this record's computations. These
  are presented as different named model versions, not a restated conflicting claim about the
  same model, so this was not coded as a source conflict -- but a reader should know a second,
  differently-numbered rate table exists in the FAQ.

  COST PER OUTPUT RANGE (cost_per_output_computable = partial): using the Standard tier ($8/mo
  billed annually, 700 credits/mo) against the Model 2.5 rate table, cost per video-minute
  ranges from about $1.65/min at 480p to about $2.74/min at 720p to about $5.49/min at 1080p,
  depending on the resolution chosen. No single figure is possible because the vendor's rate
  genuinely varies by resolution with no single "principal" resolution designated.

  CURRENCY CHECK (deviation D-007/D-003): arm 1 succeeded directly -- ToS states billing is
  "in U.S. Dollars" (Plan Selection and Subscription Payment clause), an explicit vendor
  currency disclosure. No Accept-Language or IP-geolocation signal was used or relied on for
  this determination.

  FIRST-CHARGE COMPUTATION JUDGMENT CALL: no document states an explicit annual lump-sum
  figure (e.g. "$96/year") in so many words. The $96.00 figure is computed under codebook
  domain-1 rule 2, on the basis that (a) the ToS names "annually" as its own billing cycle
  ("subscriptions automatically renew at the end of each billing cycle (e.g., monthly or
  annually)") and (b) the FAQ's upgrade-flow answer describes crediting back "remaining
  months" when upgrading off a yearly plan, which is only coherent if a yearly plan is prepaid
  as one charge for the year. Flagged here for adjudication in case a stricter reading is
  preferred (e.g. coding first_charge_amount_usd = unknown for want of a literal lump-sum
  statement).

  TRIAL: pricing page and FAQ are both silent on "trial" (zero occurrences of the word in
  either). The ToS carries a generic, discretionary clause ("We may offer free or trial Plans
  at our discretion... continue for the duration specified at signup (or, if unspecified,
  seven days)... automatically convert to a paid subscription") that is not tied to any
  concrete, currently-offered trial on the pricing page's four plans. Coded trial_exists = no
  per codebook rule 3 (pricing page + documentation silence). A-012 does not apply -- this is
  not a paid time-limited intro period, it is the ordinary "no trial found" case.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "free_plan_cap_value: pricing page states \"80 monthly video credits\" for the Basic/free tier (https://pika.art/pricing, accessed 2026-08-10) vs. FAQ states \"On the Basic (free) plan you get 150 credits per month\" (https://pika.art/faq, accessed 2026-08-10). Free-tier limits are a pricing-class variable where the live pricing page ranks above documentation per protocol 6.2, so 80/month (pricing page) is coded as the value; the FAQ's 150/month is recorded here rather than silently dropped."
