coder_note: |
  STATIC FETCH FAILURE, PER D-005: WebFetch on both the homepage and /pricing timed out
  (60s). curl also failed against myperfectresume.com from this network: HTTP/2 attempt exit
  92 (connection failure), HTTP/1.1 retry exit 28 (timeout). Both count as the two capped
  fetch attempts. Per D-005 this is not a finding ("our fetcher could not see it" is not
  unknown) -- pivoted immediately to a rendered read via mcp__Claude_Browser, which succeeded
  cleanly. All coded values rest on that rendered read (pricing, terms-conditions) or a
  second rendered read (faq, contact-us), never on the failed static fetch.

  ENTRY-TIER SELECTION (sampling-rules.md 7.2) -- the single biggest judgment call in this
  record, documented for override. Two eligible paid candidates on the pricing page:
    (1) "14-Day Premium Access" -- headline $2.95, described as "After 14 days, auto-renews
        at $23.95 billed every 4 weeks."
    (2) "1-Year Premium Access" -- headline $7.95/month, "Pay $95.40 up-front... Automatically
        renews each year."
  Sampling-rules 7.2 rule 2 enumerates exactly three annualization patterns (monthly x12,
  annual as-is, "per month billed annually" x12) and none cleanly covers a flat one-time
  introductory charge for a stated non-monthly, non-annual period (14 days) with a SEPARATELY
  disclosed follow-on recurring rate. Candidate (2) matches the rule cleanly: $7.95/mo x 12 =
  $95.40/yr, matching the page's own stated up-front figure. For candidate (1), multiplying
  the $2.95 headline by 12 would misstate what the buyer actually pays annually (the page
  itself labels $2.95 as a one-time 14-day charge, not a monthly recurring rate) and would
  defeat the purpose of the annual-equivalent rule (comparing TRUE ongoing cost rather than a
  teaser sticker). I instead annualized candidate (1) from its own disclosed steady-state
  recurring rate: $23.95 every 4 weeks x 13 four-week periods/year = $311.35/year. On that
  basis candidate (2) has the lower annual-equivalent cost ($95.40 vs $311.35) and is the
  selected entry tier. LOSING CANDIDATE: "14-Day Premium Access", annual-equivalent
  approximately $311.35 (computed from the disclosed post-intro recurring rate, not the $2.95
  teaser; see above). Both candidates were otherwise eligible (generally available, no sales
  contact, standing plans, no seat scaling). A reader who annualizes differently (e.g. treats
  $2.95 x 12 = $35.40 as the comparison figure, ignoring the disclosed renewal rate) would
  select "14-Day Premium Access" instead; I judge that reading inconsistent with the rule's
  stated purpose and with the worked examples in codebook-v1.md, but flag it explicitly here.

  DOMAIN 4 (trial_*) JUDGMENT CALL: codebook-v1.md's trial_exists definition text says "a
  time-limited free trial of a paid tier", but the domain-9 map title (section 9) reads only
  "Whether a trial requires a payment card", with no zero-cost requirement, and the vendor's
  own documents never use the word "trial" anywhere (0 hits across the full 113,851-char
  terms-conditions and the pricing page). MyPerfectResume's "14-Day Premium Access" is a PAID
  ($2.95, charged immediately) time-limited period that auto-converts to a much higher
  recurring rate -- functionally the exact pattern this domain exists to catch, even though it
  is not literally "free" and the vendor does not use the word "trial". I coded trial_exists =
  yes, trial_card_required = yes (necessarily, since $2.95 is charged to start it),
  trial_length_days = 14, trial_auto_converts = yes on that reading. If the intended reading
  of "free trial" is strictly zero-cost, all four values should instead be: trial_exists = no,
  and trial_card_required / trial_length_days / trial_auto_converts = not_applicable. Flagging
  for human sign-off per protocol 7.5 either way, since this is a genuine definitional gap, not
  a documents gap.

  free_plan_cap_documented / free_plan_cap_value JUDGMENT CALL: the free ("Basic Access") plan
  card is NOT distinguishable from the two Premium cards by plain text extraction -- all three
  show an identical bullet list. DOM inspection (::before background-image) revealed the free
  card's wrapper carries CSS class "lock-3": the first 3 of 6 Resume Tools bullets (Resume &
  Cover Letter Builder, Expert-Written Content Suggestions, Unlimited Downloads in TXT Format)
  render with a navy checkmark, the remaining 3 (Professionally Designed Templates, Unlimited
  PDF & Word Downloads, ResumeCheck (TM) Feedback) plus 2 of 3 Career Tools bullets (Interview
  Preparation Tools, Career Development Webinars) render with a grey lock.svg icon
  (background-image url ".../wp-content/uploads/2025/04/lock.svg"). Neither Premium card
  carries a lock-N class -- both show all 9 bullets unlocked. I treated the one explicit
  numberless "unlimited" statement (TXT downloads) as the plan's one quantified limit, and the
  5 entirely-locked (0-access) items as unquantified limits on the free plan's real usability,
  landing on some_quantified. The codebook's own worked example (Vendor G) only covers caps on
  things a plan DOES provide in some quantity; it does not directly address an entirely-locked
  feature carrying no number at all. A stricter reading that entirely-excluded features are
  not "limits" in this variable's sense (they're just tier differences) would instead give
  all_quantified (the one stated limit, "unlimited", is quantified). Flagging for override.

  commercial_use_lowest_tier / watermark_removal_tier / free_plan_watermark = unknown: no
  document states a commercial-use right or a watermark policy for the resume/cover-letter
  output. One ambiguous phrase was found in the acceptable-use section governing the Bold.pro
  public profile page ("...refrain from transmitting any commercial, advertising, or
  promotional materials, or use the digital resume for commercial purposes") but this reads as
  an anti-spam/anti-advertising rule for the public profile, not a licensing restriction on the
  resume output itself (a literal reading would be self-contradictory, since job-seeking is the
  product's entire purpose); not used to code a determinate value.

  ENTRY-TIER VARIABLE SCOPING NOTE (codebook-v1.md 5.2): trial_length_days is nominally scoped
  to "the entry paid tier", but the selected entry tier (1-Year Premium Access) has no trial of
  its own -- only the losing candidate (14-Day Premium Access) does. There is exactly one trial
  construct anywhere in the product, so I recorded its length (14) rather than coding
  not_applicable/unknown, on the reading that the entry-tier caveat exists to disambiguate
  BETWEEN multiple trials of different length, a case that does not arise here. Flagging this
  as a second consequence of the same entry-tier tension described above.

  All other entry-tier-scoped variables (first_charge_amount_usd, mandatory_addon_present,
  usage_cap_quantified, cost_per_output_computable, refund_window_days) were read cleanly off
  the selected entry tier (1-Year Premium Access) or, for refund_window_days, off a
  premium-access-wide statement that does not vary by which path was purchased.

  ARCHIVAL: pricing and terms-conditions archived cleanly to web.archive.org on first attempt.
  faq and contact-us both failed archival twice (HTTP 520 from web.archive.org, transient
  server-side) -- local text copies saved instead per protocol 6.4 (myperfectresume-sources/),
  archive_status local_copy_only for those two sources.

  D-003 CURRENCY CHECK: not triggered. All price figures were observed directly in USD ($) on
  the rendered read from our Turkey-based network, no VPN, no geo-based currency variant
  detected. No non_usd value was coded anywhere in this record, so the mechanical US-locale
  cross-check was not required; noting the observation here for auditability per the D-003
  instruction to log local-state observations even when non_usd is not coded.

  blindness: no other record, no review page, no pass-2 material was opened.

  D-009 re-read 2026-08-10: re-opened https://www.myperfectresume.com/pricing live and confirmed
  entry_tier_name ("1-Year Premium Access"), headline_price_usd ($7.95), headline_billing_basis
  (per_month_billed_annually) and first_charge_amount_usd ($95.40) in a SECOND representation
  independent of the original innerText transcript: direct structural DOM/outerHTML search.
  Confirmed the "1-Year Premium Access" <h2> and the $7.95/$95.40 <p> tags sit inside the same
  card container, correctly mapped. Investigated a genuine <sup> tag found near the headline
  price (<p class="free-title package-price">$7.95<sup>/month</sup></p>): the superscript wraps
  only the "/month" unit label, not any digit -- the price itself, "$7.95", is one plain unsplit
  text node, so this does not create a nicepage-class magnitude error. first_charge_amount_usd
  provenance (coordinator addendum): confirmed a DIRECT read, not a coder computation -- the
  phrase "Pay $95.40 up-front and save 69%. Automatically renews each year." is vendor prose
  printed verbatim on the card, unchanged since original collection; rule 2/3's
  once-for-twelve-months requirement does not apply since no x12 multiplication was performed.
  Evidence saved to myperfectresume-sources/d009-second-representation-2026-08-10.txt. No
  correction; all four scoped values confirmed as coded. This re-read does not revisit the
  original coder's flagged entry-tier selection judgment call (1-Year vs. 14-Day Premium Access).
