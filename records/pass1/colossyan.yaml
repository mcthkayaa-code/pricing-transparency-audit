coder_note: >
  Entry-tier selection (sampling-rules.md 7.2): two candidates on the pricing page, Professional
  and Enterprise. Enterprise is ineligible (requires contacting sales: "Let's talk"/"Contact
  sales" CTAs, fails eligibility rule 2), so Professional is the only eligible candidate;
  coder_note per rule states so. Starter is not a paid-tier candidate at all (it is the $0 free
  plan). Professional is priced per seat (1/2/3-editor selector); the single-seat ("1 editor")
  variant is the default and the one priced, per sampling-rules 7.2.4.
  --
  Assignment vs. frame-frozen data: this record's vendor_home_url (https://www.colossyan.com) was
  given directly in the assignment. frame-frozen-2026-08-04.csv row 16 lists vendor_home_url as
  "https://schema.org/SoftwareApplication", which is a data error in that file (not used for
  coding); the live pricing page was independently located and confirmed at
  https://www.colossyan.com/pricing/.
  --
  NEO vs NEO2: Colossyan's core metered resource ("video generation minutes") is split into two
  parallel, non-fungible pools by rendering engine -- NEO (the larger/older allocation) and NEO2
  (a newer, smaller allocation; per third-party discovery-only sources, NEO2 is a rebuilt
  full-body/gesture engine) -- with no published rate to convert one into the other and no
  published split of a plan's price between them. This is the basis for cost_per_output_computable
  = no (domain 6) and is unrelated to credit_system_present (there is no credit currency at all;
  both NEO and NEO2 allowances are stated directly in minutes).
  --
  Cora ("AI Video Generator", a storyboard-drafting assistant) is a separate, currently
  research-preview feature available on every tier with its own monthly storyboard cap (Free: 1,
  Trial: 2, Professional: 10, Enterprise: 40) plus a separate, unquantified "fair use" turn limit.
  Source: Help Center article updated 13 days before access (the most current help-center source
  found), materially more current than the five other Help Center articles used, which are dated
  "1 year ago" (Free Trial; Pricing & Packaging FAQ; Video rights; Managing your account) or "8
  months ago" (Video generation minutes) at access time.
  --
