coder_note: |
  Entry-tier selection (sampling-rules 7.2): three eligible paid candidates (Basic, Pro,
  Ultra; Free is $0 and not a paid candidate; none are seat-priced, none are sales-gated,
  none are time-limited promos). Annual-equivalent single-seat cost in default (Yearly)
  display state: Basic 144.00 (WINNER), Pro 216.00 (losing candidate), Ultra 432.00 (losing
  candidate). entry_tier_name = Basic.

  No paid time-limited intro period (A-012) exists for this product -- all tiers are
  standard ongoing monthly/annual subscriptions -- so A-012 does not apply here.

  cost_per_output_unit coded "other" rather than a listed unit (e.g. per_1k_words) because
  the metered/sold dimension is a discrete capped "humanizer request" (each request bounded
  by a tier-specific max-words figure), not a continuous word pool. Computing a $/word figure
  would require assuming a typical buyer fills every request to its word cap, which codebook
  C3 rule 7 forbids; computing $/request needs no such assumption, which is why
  cost_per_output_computable = yes on the request unit rather than partial/no on a word unit.

  free_plan_watermark and watermark_removal_tier both coded "unknown" rather than
  not_applicable: text/AI-content watermarking is squarely applicable to this exact product
  category (WriteHuman's own site banner discusses "Claude ... adding invisible watermarks to
  AI-generated text"), so the output type can plausibly carry a watermark/branding; no
  document (pricing, terms, or /faqs help center) states WriteHuman's own practice either way.

  output_ownership_statement coded "unknown": the terms carefully define "User Generated
  Content" as exactly User Submissions + User Contributions + User Input, and define "output"
  (the humanized text returned to the user) as a separate concept in the same paragraph. The
  ownership grant in sec. 8 is scoped only to "User Generated Content" and never says "output".
  This reads as a genuine drafting gap (who owns the input is stated; who owns the output is
  not), not a case where a reasonable stretch of "content" would resolve it either way.

  commercial_use_lowest_tier coded "not_granted" from terms sec. 3's "personal, non-commercial
  use only" license and sec. 4's repeated commercial-exploitation prohibitions, with no tier
  carve-out anywhere and no "commercial use" row in the pricing feature grid. Noted for a human
  reader: this sits in tension with the vendor's own marketing, which links to dedicated pages
  for "AI Humanizer API for Content Marketing / SEO Agencies / SaaS / Enterprise" -- but per the
  codebook's own rule, marketing tone does not override terms language, so the terms govern.
  not_granted and a hypothetical granted value score identically on E1 (determinability, not
  favorability), so this reading carries no scoring asymmetry.

  Refund-policy divergence check (explicitly required by this study's brief for humanizers):
  checked terms of service (sec. 11), the pricing-page FAQ accordion, and the separate /faqs
  help center. Terms and pricing FAQ AGREE (no refunds, self-serve cancellation, access
  continues to term end); /faqs help center is silent (no billing/refund category exists there
  at all -- its five categories are AI Humanizer, AI Detector, Image Detector, Word Counter,
  General). No divergence found across the three pages for this product.

  Auto-renewal sourcing: stated only on the pricing-page FAQ ("Your plan auto-renews annually
  unless you cancel"). The terms of service, which ranks first for this variable class, was
  searched end-to-end for "renew"/"auto-renew"/"recurring" with zero matches -- silence at the
  higher-ranked source, not a disagreement, so the value is coded from the source that states it.

  Currency: pricing page rendered plain $ (USD) figures directly to this Turkey-egress session
  with no currency selector, locale toggle, or non-USD figure observed anywhere; no non_usd
  concern arose for this product (unlike several sibling records per D-003/D-007/D-012).

  Price read twice in two representations: rendered DOM/accessibility-tree text and a
  screenshot, cross-checked against the page's embedded Next.js RSC script payload, which
  carries a structured initialTiers array with explicit monthly_price/yearly_price fields
  (18/144, 27/216, 48/432) matching the DOM exactly. No misread risk found.

  "Unlimited" claim check: Ultra's tier advertises "Unlimited requests", "Unlimited detection
  checks", and "Unlimited image scans" with no on-page asterisk. Terms of service read in full
  (see unquantified_limit_clause) contain no fair-use/reasonable-use/discretionary-throttling
  clause anywhere that would qualify an unlimited claim, so per codebook 5.1/usage_cap_quantified
  rule 3 these would count as quantified if Ultra were the tier being scored; Ultra is not the
  entry tier here (Basic is; all of Basic's own limits are numeric, not "unlimited"), so this
  does not directly feed usage_cap_quantified on this record, but it is the fact pattern behind
  unquantified_limit_clause = absent applying uniformly across the whole pricing page.

  blindness: no other record, no review page, no pass-2 material was opened.
