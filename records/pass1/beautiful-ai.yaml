conflict_note: |
  Two contractual disagreements found between the ToS (rank-1 source for contractual
  variables per protocol-v1.md section 6.2) and lower-ranked official documents. Both
  coded from the ToS per the hierarchy; both disagreements are real findings, not noise.

  (1) REFUND POLICY. ToS section 4.2 (https://www.beautiful.ai/terms-of-service): "All
  fees are non-refundable and non-cancellable." Contradicted by the Help Center article
  "What is your refund policy?" (https://support.beautiful.ai/hc/en-us/articles/360030719012-What-is-your-refund-policy,
  rank-2) and the pricing-page FAQ of the same title (https://www.beautiful.ai/pricing,
  rank-3), which agree with each other: "Annual subscribers may be able to receive a
  partial refund** if you submit a request within 24 hours of your initial purchase or
  renewal of your subscription... Monthly subscriptions are not refundable... **All
  refunds are subject to a processing fee." Coded refund_policy_exists / refund_window_days
  / refund_conditions / refund_policy_location from the ToS (no_refunds_stated / 0 /
  not_applicable / terms) per the hierarchy; a buyer relying on the pricing page or Help
  Center instead would expect a 24-hour annual refund window that the ToS says does not
  exist.

  (2) CANCELLATION ROUTE. ToS section 6.2(a) (https://www.beautiful.ai/terms-of-service):
  "Customer may terminate this Agreement and its Account, at any time, by submitting its
  request to Beautiful.ai by contacting us at: support@beautiful.ai." Contradicted by the
  Help Center article "How do I cancel my subscription (Trial or Pro)?"
  (https://support.beautiful.ai/hc/en-us/articles/360030985471-How-do-I-cancel-my-subscription-Trial-or-Pro,
  rank-2) and the pricing-page FAQ (rank-3), which both describe a fully self-serve flow
  (Profile icon > Manage Account > Billing tab > Manage Plan > cancel), with no mention of
  contacting anyone. Coded cancellation_self_serve = contact_required from the ToS per the
  hierarchy. Noted for a future reader/adjudicator: the Help Center's separate "Delete
  Account" article (https://support.beautiful.ai/hc/en-us/articles/360028561851-Delete-Account),
  which is the closer analogue to the ToS's "terminate this Agreement and its Account", is
  ALSO fully self-serve (Profile > Manage Account > My Profile tab > Delete My Account,
  type your email, confirm) with no contact step -- so the ToS's contact-required framing
  does not clearly match either the "cancel subscription" action or the "delete account"
  action as the product's own Help Center describes them today. This weakens, without
  resolving, the case for mechanically preferring the ToS reading here; flagged rather than
  silently resolved, per protocol-v1.md section 3.

coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md section 7.2). Winner: Pro, $12.00/mo billed
  annually, single seat ("INDIVIDUAL" badge), generally available, no sales contact
  required -> annual-equivalent $144.00/yr. Losing candidates:
  - Teams: $40/mo/user billed annually, but requires a minimum of 2 seats ("2-20 SEATS"
    badge). Per-seat annualized = $480.00/yr; as a minimum-purchase block (2 seats, the
    least a buyer can actually buy) = $960.00/yr. Excluded either way (higher than Pro).
  - Enterprise: "Custom" / "Contact sales for pricing" -- excluded, fails eligibility
    criterion 2 (not purchasable without contacting sales); this is the product's
    no_public_price case but it does not govern entry_tier_name since an eligible
    self-serve candidate (Pro) exists.
  - "$45 ad hoc / single presentation" card ("Everything in Pro plan (billed monthly)...
    For ad hoc projects"): ambiguous framing -- labelled both "one-off single
    presentation" (pricing FAQ) and "(billed monthly)" / "Cancel anytime" (the card
    itself), i.e. it is unclear whether this is a true one-time purchase or Pro's
    monthly-billing alternative. If treated as recurring: annualized = $540.00/yr.
    Excluded either way (higher than Pro; and if genuinely one-time/non-recurring it is
    not a "standing plan" comparable on an annual-equivalent basis under eligibility
    criterion 3).
  - "SMB plan" (linked from the Enterprise card, "flat rates for smaller teams" ->
    https://www.beautiful.ai/teams#explore / https://www.beautiful.ai/teams): no
    self-serve price published on that landing page; only "Schedule a demo" / "Explore
    the SMB plan" CTAs. Excluded for lack of a published price to compare (and likely
    fails eligibility criterion 2 as well). Not archived as a formal source since no
    coded value rests on it.
  Only Pro was eligible with a directly comparable, clearly lower annual-equivalent cost.

  PRICING-EXPERIMENT FINDING (protocol-v1.md section 6.8 / limitations item 13). DOM
  inspection of the Pro price element on https://www.beautiful.ai/pricing found:
  data-pricing-exp="true" data-pricing-exp-false="$12" data-pricing-exp-true="$14.50" on
  the div rendering the headline figure, with the visible/rendered text = "$12" (the
  "false" branch) on every one of this pass's page loads. This is direct evidence the
  vendor runs an active A/B price test on the Pro headline figure, with $14.50 as the
