  cookie_consent: "Non-essential cookies were declined: opened the Preferences dialog; Marketing/Personalization/Analytics checkboxes were left unchecked (their pre-existing default state); clicked 'Save preferences' and, on a later load, 'Reject all cookies'. The banner UI did not visibly dismiss after these clicks (tool/rendering issue, logged), but no non-essential category was ever enabled, and the substantive reads used for coding (get_page_text, the price-card screenshot) were captured on the initial page load, before any interaction with the banner."
