coder_note: |
  Third-party search results (PitchMeAI, saasworthy, enhancv, trybeem, pissedconsumer) used
  only to LOCATE official URLs, never as a coded value's source, per protocol 6.2/6.3.
  resumeio.com and instaresume.io are DIFFERENT, unrelated domains surfaced by search and are
  NOT used as sources; vendor_home_url per the frozen frame is https://resume.io.

  ENTRY TIER SELECTION (sampling-rules 7.2): two eligible paid candidates on the pricing page,
  both generally available, no-sales-contact, standing (not a limited-time promo):
    - "7-day Trial" ($2.95 first charge) -- LOST. Card discloses its own recurring rate:
      "After 7 days, auto-renews to $29.95 billed every 4 weeks" (pricing page). Annualizing
      the disclosed recurring rate (not the $2.95 teaser, which is a one-time 7-day intro
      charge, not a monthly rate -- multiplying it by 12 would be a reading error): $29.95 x
      13 (52/4 four-week cycles per year) = $389.35/yr. A conflicting official source (Right of
      Withdrawal page) states the renewal is $24.95/4wks instead (see conflict_note); even on
      that lower figure, $24.95 x 13 = $324.35/yr. Either way this candidate's true
      annual-equivalent cost is far above Quarterly's, so the conflict does not change the
      entry-tier outcome.
    - "Quarterly" ($49.95, billed every 3 months, no intro discount) -- WON. Annual-equivalent
      $49.95 x 4 = $199.80/yr, the lowest of the two eligible candidates by a wide margin
      (roughly 1.6x-2.0x cheaper than the "7-day Trial" candidate's true annualized cost,
      depending on which conflicting renewal figure is used).
  entry_tier_name = Quarterly. This is the exact "cheap non-zero intro period that auto-converts
  to a much higher recurring rate" pattern flagged for this product family: the $2.95 figure is
  the most prominent number on the page but is NOT the entry tier under the annual-equivalent
  rule, because it is not what a buyer actually pays across a year.

  A-012: resume-io sells a cheap non-zero (not free) time-limited intro period ($2.95 for 7
  days on the non-entry "7-day Trial" card) that auto-converts to a much higher recurring rate.
  trial_exists/trial_auto_converts were coded "yes" because the vendor's own documents
  repeatedly call it a "trial" ("7-day Trial", "premium trial", "7-day trial subscription"),
  even though it is not free; trial_card_required stayed unknown per the no-inference rule.

  UNPRICED PLANS: the billing FAQ (help.resume.io) references "6-Month & Yearly Subscriptions"
  as an offered option ("Our 6-month or yearly subscriptions offer big savings..."), but no
  price for either was found on the live pricing page, the billing FAQ itself, the
  billing/accounts help-center category listing, or any other official page located. Because no
  official document publishes a price for these, they could not be evaluated as entry-tier
  candidates under the annual-equivalent rule (no figure to annualize), and
  headline_price_usd/entry_tier_name are coded from the two candidates that ARE priced. A
  vendor help article naming subscription options it never prices anywhere findable is itself a
  transparency finding.

  Free plan: "Downloads only in TXT format" plus "Only one resume and cover letter" (quantified)
  and "Limited resume sharing and analytics" (unquantified) -- see conflict_note for a PDF-access
  discrepancy against a help article.

  TOOLING NOTE (check_price_arithmetic.py): running the checker prints "BASIS resume-io: no
  period defined for 'unknown' (headline 49.95, first 49.95)". Reviewed and not an error:
  headline_price_usd and first_charge_amount_usd are equal (49.95 = 49.95, ratio 1.00, no gap)
  because the entry tier's headline figure IS its first charge with no intro discount. The flag
  fires only because headline_billing_basis=unknown has no entry in the script's period lookup
  table (it only knows per_month_billed_annually/monthly, per_seat_per_month, per_year,
  one_time) -- unknown was coded because the tier's actual cadence (quarterly, "billed every 3
  months") has no matching category in the codebook's closed value list for that variable, per
  the evidence recorded on headline_billing_basis above. No multiplication was performed and
  none was needed.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "(1) Renewal price for the non-entry '7-day Trial' plan: pricing page states 'auto-renews to $29.95 billed every 4 weeks' (https://resume.io/pricing) vs Right of Withdrawal page states renewal is '$24.95' for the same 4-week period (https://resume.io/right-of-withdrawl) -- does not affect any coded value since this plan is not the entry tier, recorded per protocol as a finding in its own right even though not decisive. (2) Free-plan download format: pricing page states free-plan downloads are 'Downloads only in TXT format' (https://resume.io/pricing) vs help article states free users can download 'a PDF file with our Vancouver template or as a text file (TXT)' (https://help.resume.io/en/articles/3785088) -- coded free_plan_cap_value/free_plan_cap_documented from the higher-ranked pricing page. (3) Refund-guarantee scope: the dedicated Right of Withdrawal page and the ToS EU Supplemental Terms both word the money-back guarantee specifically around 'a 7-day trial subscription' (https://resume.io/right-of-withdrawl, https://resume.io/tos), while the pricing page displays a '7-day money back guarantee' badge directly on the Quarterly (entry-tier, non-trial) card and the ToS general clause defers to 'package descriptions' for guarantee scope (https://resume.io/pricing) -- coded refund_policy_exists=yes / refund_window_days=7 for the entry tier from the pricing page's direct per-card evidence."
