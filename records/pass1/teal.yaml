coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md 7.2): three eligible, priced, standing candidates on
  the pricing page, compared by lowest annual-equivalent single-seat cost (price x 365/period-days):
    - Weekly, $13 every 7 days -> annual-equivalent $677.86 (LOST)
    - Monthly, $29 every 30 days -> annual-equivalent $352.83 (LOST)
    - Quarterly, $79 every 90 days -> annual-equivalent $320.39 (WINNER, entry_tier_name)
  A fourth billing period, "annual", is named in the ToS (section 5) and in the cancellation-policy
  help article's refund-window table, but no price for it is published anywhere reachable without
  an account (not on the pricing page, not in the "Teal vs Teal+" comparison doc). It could not be
  scored as an eligible candidate (no figure to annualize) and is not entry_tier_name; see
  conflict_note.

  A-011: headline_billing_basis coded `unknown` because the vendor publishes "$79 Every 90 days"
  (quarterly/90-day recurring billing) for the entry tier, which matches none of the codebook's
  five headline_billing_basis values (per_month_billed_annually, per_month_billed_monthly,
  per_seat_per_month, one_time, usage_based). Same instrument gap as jobscan and resume-io
  (quarterly prepay) — this record belongs with A-011, not a fresh item.

  No A-012 case found: Teal documents no free trial AND no paid time-limited intro period of any
  kind (confirmed by a dedicated official FAQ, "Is There a Teal+ Free Trial?", stating plainly
  that no standard free trial exists). The free plan's limited AI credits are an ongoing feature
  of the perpetual free tier, not a time-limited offer, so A-012 is not invoked on this record.

  credit_unit_defined / credit_to_output_rate_published both coded `no`: the pricing page and the
  free-trial FAQ state per-feature credit allowances ("10 Credits" for Resume Bullets, "2 Credits"
  each for Professional Summary and Cover Letter) but never state what one credit converts to or
  costs per output — codebook rule 5 under credit_unit_defined treats a stated allowance as a
  quantity, not a definition, "whatever the output it is attached to," which is read here as
  covering a per-feature-labeled allowance as much as an undifferentiated pool.

  auto_renewal_disclosure_location coded `terms_only` rather than `multiple`: the pricing-page FAQ
  and the cancellation-policy help article both use the phrase "recurring subscription" while
  explaining how to cancel, but neither independently asserts that billing renews automatically —
  only ToS section 5 ("Automatic Renewal") does so explicitly. Read narrowly (requiring an actual
  auto-renewal statement, not an incidental "recurring" reference) rather than broadly.

  commercial_use_lowest_tier and watermark_removal_tier both coded `unknown` rather than
  `not_applicable`: neither construct is addressed by any document in either direction, and a
  resume/cover-letter output is not structurally incapable of carrying commercial-use terms or a
  branding footer the way, e.g., a detection score is — so documented absence (which
  `not_applicable` requires) could not be established, only silence.

  annual_default_toggle coded `no_toggle`: this is a judgment call flagged for the record. Teal's
  page has no monthly/annual toggle at all (no annual option is shown), but it does show three
  simultaneous billing-cadence cards rather than strictly "one billing period" as the value's own
  wording says. `no_toggle` is the closest of the five available values since no toggle mechanism
  of any kind exists on the page; the codebook does not anticipate a same-product,
  multiple-simultaneous-cadence layout with no monthly/annual axis.

  Archival: web.archive.org was unavailable for this record — static WebFetch returned HTTP 403
  on every tealhq.com/help.tealhq.com URL attempted (2 URLs tried directly), the Wayback Save
  endpoint returned "Job failed" for the pricing page, and the Wayback availability API returned
  429 (Too Many Requests) on retry, consistent with the shared collector load noted in the
  deviations log for 2026-08-12. Per the two-archive-attempt cap this was not retried further;
  all five sources are `archive_failed` / `local_copy_only`, with verbatim rendered-text and raw
  HTML captures retained under records/pass1/teal-sources/.

  Rendered reads: static WebFetch was blocked (403) for every tealhq.com and help.tealhq.com URL
  tried; all values in this record come from a rendered browser read of the live pages, with the
  headline price figures cross-checked against a second representation (raw outerHTML, which
  showed the same plain-text $13/$29/$79 nodes with no superscript-cents markup) and a magnitude
  check against the printed daily-rate figures.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "(1) ToS section 5 and the cancellation-policy help article (help.tealhq.com/en/articles/9451252) both name a fourth 'annual' billing period with a 14-day refund window, but the pricing page (tealhq.com/pricing) and the 'Teal vs Teal+' comparison doc (help.tealhq.com/en/articles/9530153) both list only weekly/monthly/quarterly with no annual price published anywhere reachable without an account. Pricing page ranks first for pricing-class variables per codebook section 3, so entry-tier selection and headline_price_usd proceed on the three priced plans only; the unpriced fourth period is recorded here rather than folded into a coded value. (2) The pricing page (tealhq.com/pricing) and the free-trial FAQ (help.tealhq.com/en/articles/9535168) both state the free plan carries '10 Credits' for AI Bullet/Resume-Bullet Generation, but the 'Teal vs Teal+' comparison doc (help.tealhq.com/en/articles/9530153) states '5 credits' for the same feature ('Resume Bullet Generation'). Coded from the pricing page (two of three docs agree, and it is the higher-ranked source for a free-tier limit, a pricing-class variable): free_plan_cap_value records 10, not 5."
