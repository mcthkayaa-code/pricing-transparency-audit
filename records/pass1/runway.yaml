coder_note: |
  Entry-tier selection (sampling-rules 7.2): candidates were Standard, Pro, Max (Free excluded,
  not a paid tier; Enterprise excluded, sales-gated / "Contact Us", ineligible per rule 2).
  Annual-equivalent single-seat cost in the default (Yearly) display state: Standard $12/mo x
  12 = $144.00/yr (WINNER, lowest); Pro $28/mo x 12 = $336.00/yr (lost); Max $76/mo x 12 =
  $912.00/yr (lost). Product also offers a separate "Runway Dev" API/usage-based pricing
  surface (docs.dev.runwayml.com/guides/pricing) behind a product-family selector that defaults
  to "Runway Creative" (the consumer tool coded here, matching our frame category "AI video
  generator"); Dev pricing was not coded as it is a distinct product surface, not a candidate
  tier of the product under study.

  Credit-to-output rate detail (task brief: record what the vendor publishes rather than
  reducing it to one number). Runway's "Compare models across plans" table on the pricing page
  publishes an exact rate per model, not one product-wide rate: Gen-4.5 60 credits/5s (=12
  cr/s), Aleph 2.0 140 credits/5s (=28 cr/s), Seedance 2.0 Pro 1080p 160 credits/4s (=40 cr/s),
  Seedance 2.0 Fast 116 credits/4s (=29 cr/s) -- a 3.3x spread. At the Standard entry tier
  ($12/mo default-annual, 625 credits/mo) this yields, per model: Gen-4.5 $13.82/min, Aleph 2.0
  $32.26/min, Seedance 2.0 Pro 1080p $46.08/min, Seedance 2.0 Fast $33.41/min. Coded
  credit_to_output_rate_published = yes (the rate is precisely published for every model the
  entry tier advertises, nothing is vague or left as an open range) but cost_per_output_computable
  = partial (no single figure represents "the" cost per video minute without assuming which
  model the buyer uses, which the codebook's cost_per_output_computable decision rule -- "the
  reader's job is arithmetic, not estimation" -- does not allow).

  Free-plan watermark (free_plan_watermark = unknown): the live pricing page's Free-tier card
  lists only "125 credits (one time)", "a selection of generative creative models", and "5GB
  asset storage" -- it does not say outputs are or are not watermarked. "No watermarks" appears
  only in Standard's own feature list. Per the codebook's own worked rule ("A silent pricing
  table is unknown"), this reads unknown from the pricing page alone. A help-center article
  (help.runwayml.com .../Free-plan-details) appears to state plainly that Free-plan outputs are
  watermarked, surfaced via WebSearch, but could not be fetched (403 twice) or archived (520
  from archive.org's save endpoint, no prior capture found) within budget, so it is NOT used to
  code the value -- see runway-sources/help-center-blocked-leads.txt. This does not affect
  watermark_removal_tier, which is independently well-evidenced from the archived pricing page:
  Standard (lowest_paid) is confirmed watermark-free regardless of what Free's status turns out
  to be.

  Credit rollover varies by tier (credit_rollover_policy is coded for the Standard entry tier,
  by analogy to how usage_cap_quantified is scoped, since the codebook does not name this
  variable's scope explicitly): Standard & Pro reset within 24h of billing date
  (expires_at_period_end, the coded value); Max rolls over up to 1 month of unused credits
  (partial_rollover); Free's one-time 125 credits "doesn't expire" but also never renews (not a
  rollover scenario, a standing non-renewing grant).

  Ownership/license nuance: ToS 4.4 states the Company does not claim ownership of Inputs or
  Outputs (coded user_owns) AND separately requires the user to grant the Company a broad
  perpetual/irrevocable/worldwide license to use Inputs and Outputs for model training and
  related purposes. Both are true simultaneously; the license grant is noted here because a
  buyer should know it, but it does not change the ownership-statement coding, which is a
  distinct construct from a license grant.

  Currency check (binding instructions, D-003/D-007): performed and NOT triggered. Every price
  read on this Turkey-egress session displayed in plain "$" figures with no currency selector,
  no forced local-currency conversion, and no non-USD symbol observed anywhere on the pricing
  page, in the archived capture, or in the Terms of Use. This is the ordinary USD case, not a
  non_usd case requiring the fallback-arm procedure; no ambiguity to resolve.

  Two-representation price check (binding instructions): headline/entry-tier figures were
  confirmed identically across three independent reads -- WebFetch text extraction, a live
  rendered-DOM javascript_tool read (fresh tab, origin verified before and after), and the
  Wayback-archived HTML snapshot (grepped directly for $ figures) -- all agreeing on Standard
  $15->$12, Pro $35->$28, Max $95->$76 and the $36/$84/$228 annual savings figures. No
  superscript-cents or plan-grid row-mapping error found.

  Shared-browser-tool note: the Browser pane in this environment is shared across concurrent
  sibling coders working other products in this same study window (observed tabs cycling
  through resume.io, sapling.ai, speechify.com content under tab IDs I had just navigated
  myself). Every browser-sourced fact in this record was re-verified by checking
  location.href/document.title in the SAME javascript_tool call that extracted the data (not a
  prior or subsequent call), to rule out cross-tab contamination; two tab attempts were
  discarded after the origin check showed contamination before any data was taken from them.

  Refund note: see conflict_note for the ToS-vs-help-center refund gap.

  blindness: no other product's record, no review page, no pass-2 material was opened.
conflict_note: "ToS (higher-ranked source for refund variables, protocol 6.2) Section 8.5 frames fees as non-refundable with only ad hoc discretion (\"we may provide a refund upon request\"), coded as no_refunds_stated / 0 days / not_applicable conditions. A help-center article, \"Requesting a refund for your plan or payment\" (https://help.runwayml.com/hc/en-us/articles/24343363554067-Requesting-a-refund-for-your-plan-or-payment), surfaced via WebSearch, appears to document a concrete conditional policy -- refundable within 30 days of purchase/renewal if the subscription or credits are unused or close to unused -- which is more specific and more generous than the ToS framing suggests. This lower-ranked source could not be independently fetched (403) or archived (520) within budget, so it was NOT used to override the ToS-coded value, per protocol's hierarchy rule and its instruction that a gap between sources is reported even where the hierarchy settles the coded value cleanly. Both URLs: https://runway.com/terms-of-use ; https://help.runwayml.com/hc/en-us/articles/24343363554067-Requesting-a-refund-for-your-plan-or-payment. A future coder with access to the help-center domain should re-verify this article directly and, if confirmed, take it to adjudication."
