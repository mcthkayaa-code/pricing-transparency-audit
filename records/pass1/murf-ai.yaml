coder_note: |
  Entry-tier selection (sampling-rules.md 7.2): eligible paid candidates were Creator ($19/mo,
  $228/yr annual-equivalent) and Business ($66/mo, $792/yr annual-equivalent); Business LOST on
  annual-equivalent cost. Enterprise was NOT an eligible candidate (rule 2: "Contact Sales", no
  self-serve purchase). Free ($0/mo) is not a paid-tier candidate at all; it is coded entirely
  under the free_plan_* variables instead. One pricing-page FAQ item ("I am a registered
  Business. Can I use Murf's creator Plan?") answers "it is ideal to opt for the Business Plan"
  -- an advisory recommendation, not a stated restriction/prohibition -- so Creator remains
  "generally available to any buyer" under eligibility rule 1 and stands as the entry tier.

  trial_exists=no is a deliberate, well-evidenced call, not a default: Murf's help center labels
  a "Free Trial" throughout its nav, and the pricing page says "Try Business Plan for free", but
  the vendor's OWN dedicated FAQ ("How long does the free trial last?") states in full: "There
  is no validity or end date to the free trial. The trial will expire once the entire 10 minutes
  of voice generation and transcription time have been exhausted." -- word-for-word parallel to
  the pricing page's "How long can I use the free plan for?" answer ("There is no time limit to
  the free plan... 10 mins"). Both describe the SAME 10-minute, non-time-boxed allowance,
  automatically assigned to all first-time signups (help.murf.ai/is-murf-free-to-use: "All
  first-time users/signups are automatically assigned a Free Trial"). Since the codebook's trial
  construct requires TIME-limitation and Murf explicitly disclaims one, this is coded as the free
  plan under Domain 3, not a Domain 4 trial, despite the vendor's marketing label.

  credit_system_present=no despite help.murf.ai/what-is-voice-generation-time-vgt calling VGT
  "Studio credits" colloquially: VGT is a direct, undiscounted 1:1 measure of output (1 minute of
  VGT = 1 minute of generated audio, explained with a worked example), with no published
  conversion/exchange rate -- codebook rule 1 (plan allowance stated directly in output units)
  governs over the vendor's colloquial word choice.

  commercial_use_lowest_tier=free (from ToS 5.1's untiered general grant) conflicts with the
  pricing page's explicit "No Commercial Rights" callout and crossed-out Commercial Rights cell
  for the Free plan; both applied per codebook's explicit terms-vs-grid rule; see conflict_note.

  output_ownership_statement=unknown: ToS 3.1 ("Content" = user-submitted material only) never
  addresses the generated voiceover output itself for Studio. Product-Specific Terms 9.1.2(a)
  shows Murf's API product line uses a vendor-retains/customer-licenses model for "Generated
  Content", but that clause is scoped to Murf API, a distinct product line from Studio/Creator
  (the entry tier under study), so it was not used to code Studio's value -- noted as contrast
  only, per the assignment's instruction to record which document governs which variable.

  Taxes are confirmed excluded from first_charge_amount_usd: pricing-page FAQ "Do you charge
  sales or consumption taxes?" states applicable sales/VAT/GST tax is shown separately "after the
  billing step and before checkout is complete."

  Scope note: Murf sells three product lines from one pricing page (Studio | Dub | API tabs).
  This record codes Studio (the default tab, and the voiceover-generation product matching this
  review's "AI voice" category); Murf Dub and Murf API have their own plans/terms
  (Product-Specific Terms sections 9.1-9.2) not coded here. The Enterprise-only "Master Service
  Agreement" (a negotiated contract vehicle, itself listed as an Enterprise plan feature) was not
  separately fetched since it does not govern the Creator entry tier.

  Voice cloning (per assignment note on split documents): consent/authorization terms live in
  ToS section 4.2 (Consenting Speaker definition, mandatory written consent, prohibition on
  submitting unauthorized third-party voice recordings) -- this is the "voice/cloning policy"
  document. help.murf.ai/what-is-murf-voice-cloning (docs) confirms voice cloning is Enterprise
  add-on only / "We do not currently provide self-served Voice Cloning solutions" -- it is not
  part of the Creator entry tier's advertised feature set at all, so it does not affect any
  entry-tier variable above. The pricing-page "Personal vs Business License" FAQ item serves as
  the licensing FAQ for commercial_use_lowest_tier context.

  ToS 10.7 contains generic SaaS boilerplate ("Murf may offer optional trials and betas...") --
  a hypothetical-future-offering disclaimer, not a statement that a specific time-limited
  paid-tier trial is currently offered; does not change trial_exists.

  D-003 currency check performed mechanically: curl with default and with `Accept-Language:
  en-US,en;q=0.9` both returned only the unrendered JS-shell (6-8 KB, no price text either way,
  consistent behavior regardless of locale header) since murf.ai/pricing is a client-rendered
  SPA; the fresh web.archive.org/save capture is likewise an unrendered shell. The rendered
  browser read itself (method of record, D-005) showed clean USD figures ($0, $19, $66, $228,
  $792) with no currency selector and no non-USD symbols anywhere in ~10,861 chars of rendered
  text, so no non_usd coding was at issue and no display_variant register event was warranted
  (no divergent state was actually observed).

  blindness: no other record, no review page, no pass-2 material was opened.

  D-009 re-read 2026-08-10: re-opened https://murf.ai/pricing live and confirmed entry_tier_name
  (Creator), headline_price_usd ($19), headline_billing_basis (per_month_billed_annually) and
  first_charge_amount_usd ($228) in a SECOND representation independent of the original
  innerText transcript: direct DOM/class lookup on the toggle labels and on the isolated <p>
  price nodes. Confirmed "Billed Yearly" still carries the active class
  (text-violet6/font-weight-600) and "Billed Monthly" the inactive class (opacity-50) before any
  interaction. Confirmed the Creator card's own two price tags read "$19 / month" and "$228
  Billed Annually" directly (first_charge is a direct read, not a computation). Confirmed 0
  <sup>/<sub> elements exist anywhere on the page. Page body length (10,861 chars) matched the
  original coder's D-003 note exactly, indicating no page change since original collection.
  Evidence saved to murf-ai-sources/d009-second-representation-2026-08-10.txt. No correction;
  all four scoped values confirmed as coded.

conflict_note: "commercial_use_lowest_tier: ToS 5.1 grants commercial use generally ('You can use Murf created voices for commercial purposes', no tier qualifier) [https://murf.ai/legal/terms-of-service], while the pricing page marks the Free plan 'No Commercial Rights' and shows a cross for Free in the Commercial Rights comparison row (checks start at Creator) [https://murf.ai/pricing]. Coded from ToS (higher authority for this contractual variable) per codebook rule; pricing-page restriction not applied to the value. Separately, refund_policy_exists: the pricing-page FAQ states starkly 'Payments already made against monthly or annual subscriptions would not be eligible for a refund' with no mention of any conditional window [https://murf.ai/pricing], while ToS 2.5.3 documents a specific conditional refund path (purchase <24h ago AND usage <10 min) [https://murf.ai/legal/terms-of-service]. Coded from ToS (higher authority, contractual); a buyer reading only the pricing page would not learn of the conditional refund path."

