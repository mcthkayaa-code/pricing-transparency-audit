coder_note: |
  Entry-tier selection (sampling-rules 7.2): all five paid tiers are generally-available,
  sales-contact-free candidates. Annual-equivalent single-seat costs computed from the
  pricing page's default (Yearly) display state: Plus 16x12=192.00 (WINNER), Pro
  37x12=444.00, Max 166x12=1992.00, Business 375x12=4500.00 (self-serve up to 50 team
  members; only >50 requires sales contact), Ultra 416x12=4992.00. Free ($0) is not a
  paid-tier candidate.

  Judgment calls:
  - cost_per_output_unit coded "other", named unit: credit-metered AI task/message with
    no single fixed output type (chat response, code execution, chart, and report all
    draw from one undifferentiated credit pool); access is metered (hard monthly/annual
    credit caps exist), so per_seat_month's own "unmetered access" trigger condition
    (rule 2) is not met, ruling that classification out despite the product's seat-based
    plan structure.
  - commercial_use_lowest_tier and watermark_removal_tier coded unknown rather than
    not_applicable: the product does produce outputs (analyses, exportable charts,
    slides, images) these constructs could plausibly attach to, and no document states
    the construct is absent. Codebook section 2.2 warns specifically against defaulting
    to not_applicable without positive documented absence, since that would wrongly
    remove these items from the index denominator rather than scoring the gap as 0.
  - usage_cap_quantified coded some_quantified via the "unlimited claim qualified by a
    general discretionary clause" mechanism in codebook rule 3, applying ToS Section 18's
    general "may impose limits... without notice" reservation to the pricing page's
    "Unlimited file storage formats" / "Unlimited charts" bullets on Plus. This mirrors
    the codebook's own Vendor U worked example precisely (unlimited claim + fair-use-type
    clause elsewhere = not quantified), and is also why unquantified_limit_clause = present
    (protocol 8.3.10's intentional F1/F2 double-count).
  - refund_policy_location coded dedicated_refund_page rather than multiple: only the
    dedicated Refund Policy page states the substantive case-by-case policy and process;
    the ToS only reiterates the narrower "credits are non-refundable" point already on
    that page, so the operative policy is not meaningfully duplicated across classes.
  - annual_condition_disclosure coded adjacent on the strength of the shared Yearly/
    Monthly toggle's label sitting immediately above the price cards and directly
    controlling each card's displayed figure; codebook section 7 explicitly allows a
    toggle label to qualify as adjacent.

  Documentation-internal inconsistencies observed on the vendor's own pages (beyond the
  free-plan credit conflict already coded on free_plan_cap_value, see conflict_note):
  the credits-overview FAQ "How do credits work on annual plans?" states a Pro annual
  subscriber "gets all 50,000 credits for the year", which matches neither the same
  page's own plan table (Pro 5,000/mo x 12 = 60,000/yr) nor the pricing page ("60,000
  credits per year" on the Pro card). Pro is not this record's entry tier, so this was
  not coded against any variable; noted here only as context, since it corroborates the
  general pattern of internally inconsistent credit figures on this vendor's docs.

  Two claims surfaced by WebSearch (used only to locate official pages, per protocol
  6.3/6.2) were checked against the live documents actually read today and NOT found in
  them, so were disregarded entirely: (1) a "personal, non-commercial use" license
  restriction supposedly in the ToS -- not present in the live ToS (Last Updated March 6,
  2026) read in full; (2) a "14-day refund policy" -- not present anywhere in the live,
  dedicated Refund Policy document. Neither third-party claim was used to code any value.

  Network/currency: egress observed as a Turkish ISP (Superonline Iletisim Hizmetleri
  A.S.) via archive.org response headers (D-003 context). No currency localization was
  observed anywhere on julius.ai -- prices rendered directly in USD on first load -- so
  no non_usd coding arose and no further D-003 cross-check was required.

  blindness: no other record, no review page, no pass-2 material was opened.

  D-009 re-read 2026-08-10: re-opened https://julius.ai/pricing live and confirmed
  entry_tier_name (Plus), headline_price_usd ($16), headline_billing_basis
  (per_month_billed_annually) and first_charge_amount_usd ($192.00) in a SECOND representation
  independent of the original innerText transcript: a card-by-card structural DOM query
  (div.pricing-card containers, each card's plan-name text paired directly with its own
  .yearly-price/.monthly-price divs). Confirmed toggle default from the DOM (input#pricing-yearly
  .checked=true before interaction), confirmed the Plus card's $16 pairs correctly with the Plus
  name (not a shifted row), and confirmed 0 <sup>/<sub> elements exist anywhere on the page
  (rules out a nicepage-class superscript-cents misread). Re-read
  julius.ai/docs/billing/credits-overview and confirmed "Annual plans are billed once per year at
  a discounted rate, with all credits granted upfront" is still stated, present both in the
  rendered innerText and in the page's embedded Next.js RSC payload (a second, independent
  representation of the same source text). Evidence saved to
  julius-ai-sources/d009-second-representation-2026-08-10.txt. No correction; all four scoped
  values confirmed as coded.

  D-009 provenance check (coordinator addendum, 2026-08-10): first_charge_amount_usd (192.00) IS
  a coder computation (16 x 12), not a vendor-published annual total, per this record's own
  computation_assumptions field. Codebook rule 2 permits multiplying a monthly figure by 12 only
  where a document states the plan is charged once for twelve months. The supporting document,
  julius.ai/docs/billing/credits-overview, states "Annual plans are billed once per year at a
  discounted rate, with all credits granted upfront" -- re-read live today (see the D-009 note
  above) and unchanged. "Billed once per year... upfront" is a positive statement that the annual
  plan is charged as a single lump sum covering the year, which is what rule 2 requires ("charged
  once for twelve months" and "billed once per year" describe the same cadence); it is not merely
  a "billed annually" label with no lump-sum statement (contrast the mubert record in this same
  slice, correctly coded unknown for exactly that gap, and the plus-ai case the coordinator cited).
  Provenance verdict: SUPPORTED. 192.00 stands; not corrected to unknown.

conflict_note: "Free-plan credit allowance disputed within a single official document, https://julius.ai/docs/billing/credits-overview (accessed 2026-08-09): the 'Credits by plan' table states 'Free: 25 welcome bonus + 25 daily credits' (a recurring daily grant), while the FAQ 'When are credits granted?' on the same page states 'Free plan users receive a one-time grant of 100 credits when they sign up; these credits do not renew' (a single one-time grant, different number). Both are equal-authority statements on the same source; protocol 6.2's hierarchy does not distinguish a table from an FAQ accordion on one page, so free_plan_cap_value is coded conflicting. free_plan_cap_documented itself is unaffected (all_quantified) since both competing readings are themselves numerically quantified -- only the figure, not the fact of quantification, is in dispute."

