coder_note: |
  Entry-tier selection (sampling-rules 7.2): three eligible paid candidates on the default
  (Annual-toggle, Subscription-tab) display state -- Creator $11.69/mo x12 = 140.28
  annual-equivalent (WINNER, lowest); Pro $32.49/mo x12 = 389.88 (lost); Business $149.29/mo
  x12 = 1791.48 (lost). Ambassador is the free plan, not a paid candidate. All three paid
  plans are generally available, self-serve ("Get Plan" buttons, no sales contact), standing
  (not time-limited promos), not seat-scaled, not usage-based-only, so all three qualify as
  candidates under section 7.2's eligibility test.

  Governing document for output_ownership_statement and commercial_use_lowest_tier (per
  assignment note on music products splitting licensing terms from the ToS): the general
  website Terms of Use (docs/tou) explicitly disclaims coverage of Render specifically --
  "Mubert's various services and products (Mubert Render, Mubert API) may be subject to
  separate agreements ... please follow the rules relating to those products and services."
  The document that actually carries Render's output-rights/commercial-use terms is the
  dedicated page at /render/license (self-titled "Mubert Music License -- Terms of Use for
  AI-Generated Content"), corroborated by the FAQ's "Licensing & Subscription" section. Both
  were read and coded from accordingly; docs/tou was confirmed silent on these points rather
  than assumed silent. No "broadcast" tier or personal/commercial/broadcast three-way split
  exists in Mubert's documents -- checked for it specifically per the assignment note and
  found only the four-rung ladder Ambassador (non-commercial, free) / Creator (non-commercial,
  entry paid) / Pro (limited commercial) / Business (commercial), consistent across the
  pricing page's DOM-verified checkmarks and the FAQ's prose answers.

  D-003 currency check: no non_usd figure ever arose (all documents and the rendered pricing
  page showed USD throughout), so there is nothing to override, but the check was still run
  mechanically. Two methods attempted: (1) curl with `-H "Accept-Language: en-US,en;q=0.9"`
  against the live pricing page -- returned USD-only static shell, 0 price figures (SPA, see
  sources note), no non-USD currency markers. (2) web.archive.org: the availability API
  (`archive.org/wayback/available`) returned HTTP 429 (rate-limited) on 2 attempts and was not
  retried further per the two-attempt cap; the direct Save-Page-Now submission for each of the
  4 source URLs succeeded on the first attempt (see sources[].archive) and those snapshots
  were fetched back and confirmed to load. No discrepancy between the Turkey-egressing render
  and the en-US check was observed on any variable, so no display_variant register event was
  needed for currency specifically.

  Judgment calls / places a different reading was possible: (a) first_charge_amount_usd coded
  unknown rather than 140.28 (11.69x12) because no document states the annual plan is "charged
  once for twelve months" -- "Billed annually" states the cadence label but not the lump-sum
  mechanic, and the FAQ's "monthly or annual installments" phrasing does not resolve it either
  way; this mirrors the codebook's own worked example, which requires an explicit
  once-for-twelve-months statement before multiplying, not just an adjacent "billed annually"
  label. (b) free_plan_watermark coded unknown rather than "yes" despite the FAQ's watermark
  answer, because that answer is not scoped to a tier and the pricing page's free-tier feature
  list is silent (empty), not a documented cross -- see full reasoning in the variable's own
  evidence field. (c) refund_conditions coded not_applicable (not "conditional") for
  consistency with refund_policy_exists = no_refunds_stated: the FAQ's narrow exception --
  "I accidentally chose the wrong plan. How can I upgrade? -- Please reach us our directly, so
  we could refund the previous payment in case you want to upgrade the plan. However, please
  note, that in all other cases we have a zero-refund policy." -- is a discretionary,
  contact-required carve-out for one specific mistake, not a general conditional-refund
  policy; recorded here in full rather than dropped. (d) cost_per_output_unit coded "other"
  and named "per track generation" -- the product meters by discrete generation count, not by
  audio minutes, so per_audio_minute was rejected as a mis-fit despite being the closest-sounding
  listed option.

  Scope note: the pricing page also offers a "Perpetual License" tab (one-time-purchase
  alternative to the default "Subscription" tab) and a "Monthly" billing-toggle option. Per
  sampling-rules 7.2 and protocol 6.8, only the page's default display state (Subscription tab,
  Annual toggle) governs entry-tier selection and headline pricing, so the Perpetual License
  tab's terms were not part of this record's scope. Its content was not read: repeated attempts
  to switch tabs/toggle via the browser tool's click and via dispatched DOM events did not
  change the rendered React state (component appears to require a pointer-event sequence the
  available tooling could not produce), and the codebook explicitly forbids switching state
  before recording the default read in any case, so no further attempts were made once the
  default state was captured. This does not affect any coded value.

  Vendor home URL (https://mubert.com, from the frozen frame) resolved correctly; no frame
  correction needed.

  blindness: no other record, no review page, no pass-2 material was opened.

  D-009 re-read 2026-08-10: re-opened https://mubert.com/render/pricing live and confirmed
  entry_tier_name (Creator), headline_price_usd ($11.69) and headline_billing_basis
  (per_month_billed_annually) in a SECOND representation independent of the original innerText
  transcript: a card-by-card structural DOM query on [class*="pricing-card__inner-content"]
  containers. Confirmed the Annual toggle carries the "-selected" class before interaction, and
  confirmed the Creator card's $11.69 is correctly paired with the Creator name (not shifted).
  Confirmed 0 <sup>/<sub> elements exist anywhere on the pricing page. Separately re-fetched
  https://mubert.com/render/faq via a static curl (a different tool/representation from the
  browser render used for the pricing page) and confirmed the "payment options" FAQ answer is
  unchanged and still does not state the annual plan is charged as a single lump sum; a full-text
  search of the FAQ's embedded JSON for "once for"/"upfront"/"lump sum"/"charged once"/"billed
  once" found zero matches anywhere in the document. first_charge_amount_usd=unknown is
  re-confirmed as the correct reading, not an unread gap. Evidence saved to
  mubert-sources/d009-second-representation-2026-08-10.txt. No correction; all four scoped
  values confirmed as coded.
