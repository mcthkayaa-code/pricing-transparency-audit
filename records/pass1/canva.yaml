  cancellation_self_serve: { value: self_serve_documented, source: "https://www.canva.com/policies/terms-of-use/", evidence: "Terms of Use, Cancellation, re-quoted verbatim this pass: 'You can stop using the Service and/or cancel your subscription and/or Add-Ons at any time via your account settings.' No email/ticket/call is described as required." }
  refund_policy_location: { value: terms, source: "https://www.canva.com/policies/terms-of-use/", evidence: "Among the documents read this pass, a refund position is stated only in Terms of Use. The pricing page's FAQ (re-searched this pass) does not address refunds. The dedicated Help Center refund article was not re-attempted this pass (see refund_window_days), so it does not count toward this determination, unchanged from the superseded record." }
  commercial_use_lowest_tier: { value: free, source: "https://www.canva.com/policies/content-license-agreement/", evidence: "Content License Agreement, section 5, re-quoted verbatim this pass: permitted uses of 'Canva Designs that contain Content (Free or Pro)' include 'invitations, advertising and promotional projects, including printed materials, product packaging, presentations, film and video presentations, commercials, catalogues, brochures, greeting cards and postcards for promotion and/or resale, without any reproduction quantity limit'. Explicitly scoped to designs containing 'Free or Pro' content, so commercial/promotional/resale use is granted starting from the free tier." }
  watermark_removal_tier: { value: unknown, source: "https://www.canva.com/pricing/", evidence: "Same search and same result as free_plan_watermark, re-confirmed this pass: zero occurrences of 'watermark' in any of the four documents read. The dedicated Help Center article ('Watermarks or Canva logos are on my design') was not re-attempted this pass. Principal output (exported designs/images) plainly could carry a watermark, so not_applicable does not fit; documented silence plus an unreached dedicated article codes unknown, unchanged from the superseded record." }
  output_ownership_statement: { value: conditional, source: "https://www.canva.com/policies/terms-of-use/", evidence: "Terms of Use states two positions depending on content type, re-quoted verbatim this pass. User-uploaded content: 'As between you and Canva, you own all right, title and interest in and to your User Content.' Designs incorporating Canva's own Licensed Content: 'While you retain ownership of your User Content, any use of Designs containing Licensed Content are subject to the applicable terms of the Content License Agreement', which in turn states 'Canva and its contributors reserve all rights that aren't explicitly given to you under this license.' Rights depend on content type, matching conditional." }
  usage_cap_quantified: { value: some_quantified, source: "https://www.canva.com/pricing/", evidence: "Entry-tier variable, now resolved to Pro specifically (the superseded record hedged across Pro and Business). Re-extracted this pass from the archived snapshot's embedded JSON: Pro's card lists quantified standing limits '5 Brand Kits' and '100GB of cloud storage', plus a quantified rate ('Up to 2,000 uses of Standard AI tools, or up to 200 uses of Premium AI tools, or up to 20 uses of Ultra AI tools', resets monthly) - but 'Ad insights and AI ad creation^' and 'Access to Affinity with AI^' both carry the fair-use footnote with no number given, which is unquantified. At least one quantified and at least one not => some_quantified." }
  unquantified_limit_clause: { value: present, source: "https://www.canva.com/pricing/", evidence: "The pricing page's footnote system ties 'Ad insights and AI ad creation' and 'Access to Affinity'/'Access to Affinity with AI' - across the Free, Pro, Business, and Enterprise cards alike - to a (^) footnote, re-quoted verbatim this pass: 'Included based on your plan and don't count toward your shared monthly AI allowance. Subject to fair use limits. See FAQ for more details.' No figure defines the fair-use threshold. Terms of Use was searched in full this pass for 'fair use'/'excessive'/'throttl'/'discretion' language specifically for this variable: zero hits for 'fair use' or 'excessive'; the only 'reasonable discretion' language found concerns domain-name removal and content-moderation/ToU-violation actions, which rule 3 excludes ('A prohibition on illegal or abusive content is not a usage limit'). No separate Acceptable Use Policy document exists. The finding rests on the pricing-page footnotes, which are official documents in their own right." }
coder_note: |
  D-005 RE-COLLECTION of a stalled prior attempt. This record replaces the previous canva.yaml
  in full. Nothing from the superseded record was carried over without re-verifying it against
  a source myself this pass: pricing-archived.html, terms-of-use-archived.html,
  content-license-archived.html, and ai-pass-archived.html were each re-opened and every quote
  used above was re-extracted fresh from the page's embedded JSON content blob (Canva ships
  this copy as an escaped JSON object inside one large <script> tag rather than as plain DOM
  text - decoding it was necessary to read anything at all from these files).
  WHAT CHANGED VS THE SUPERSEDED RECORD: entry_tier_name = Pro (was unknown - flagged as an
  instrument-gap case, both Pro and Business unpriced); headline_price_usd = non_usd, TRY 1920
  (was unknown); first_charge_amount_usd = non_usd, TRY 1920 (was unknown); annual_default_toggle
  = annual_preselected (was unknown); annual_condition_disclosure = adjacent (was unknown);
  cost_per_output_computable = yes (was no - a price now exists, and because the principal
  output is per_seat_month, the monthly-equivalent price itself is the computable figure, so
  computation_assumptions is now a real value rather than not_applicable). headline_billing_basis
  remains unknown, but for a different reason than before (see the instrument-gap flag below,
  not "no price block observed at all"). Every other variable is unchanged in value from the
  superseded record; each was independently re-verified against its source this pass rather
  than copied.
  ENTRY TIER (sampling-rules.md 7.2): eligible candidates are Pro and Business (Free is 0 TRY /
  not paid; Enterprise is sales-gated only - "Bize ulasin"/"Contact Sales"/"Book a demo", no
  self-serve path, fails eligibility criterion 2; a separate "Egitim" pricing tab exists but is
  a restricted/named program under criterion 1 regardless and was not the default tab shown).
  The default display state already presents both candidates as annual, per-person totals, so
  rule 2's annualize step needs no multiplication: Pro = 1.920 TRY (winner), Business = 3.400
  TRY (LOSING CANDIDATE, recorded here per 7.2's instruction).
  A-DOMAIN SOURCE (deviation D-005): coded from an orchestrator-captured ORDINARY-BROWSER
  rendered read of https://www.canva.com/pricing/, 2026-08-08 (local file:
  canva-sources/pricing-rendered-2026-08-08.txt) - a documentary page load (no account, no
  login, no checkout), per this study's D-005 rule that letting a public page's own scripts
  render is reading a document, not prohibited conduct. The collection host for that read
  egresses from Turkey; Canva's locale/currency selection is IP-based, not path-based
  (/en_us/pricing/ served the identical tr-TR page). This is also why the archived
  English-locale pricing snapshot this record already held never showed a price at all, in
  either pass: it is a non-JS-executing archive.org crawl of a client-side-rendered price
  widget, and would show no price in ANY currency, not specifically a missing-USD one.
  CURRENCY (D-003): headline_price_usd and first_charge_amount_usd both coded non_usd. Verbatim
  published figures: Pro "1.920 TRY" captioned "Bir kisi icin yillik fiyat" (annual price for
  one person); Business "3.400 TRY" captioned "Kisi basi yillik fiyat"; Free "0 TRY". Two curl
  attempts against web.archive.org US-crawled captures of this exact URL, run 2026-08-09: (1)
  `curl -m 45 -sL "https://web.archive.org/web/2026/https://www.canva.com/pricing/"` redirected
  to a snapshot (20260805141457) that itself captured Canva's own bot-block page ("Unsupported
  client - Canva", 10,794 bytes) - archive.org's own crawler was blocked too; zero "$"/"US$".
  (2) a direct curl of the specific snapshot already cited in this record's sources
  (20260805125923, 143,221 bytes, confirmed real page content, title "Canva Pricing: Compare
  Free, Pro, Business and Enterprise plans") - zero "$" anywhere except one unrelated Cloudflare
  JS variable name ("__CF$cv$params"). A USD figure could not be verified from this network in
  either attempt; non_usd stands per this coder's brief.
  NON-BASE-PLAN USD DATA POINT (not used to code headline_price_usd - it is a different,
  optional add-on): the AI Pass help article states "AI Pass is USD $100 globally per person,
  per month" (re-verified verbatim this pass). Canva does publish a flat global USD figure for
  this specific add-on - informative context that the vendor has USD-publishing capability, it
  simply doesn't use it for the Pro/Business base-plan price shown on the pricing page, which is
  region/currency-adaptive.
  HEADLINE_BILLING_BASIS INSTRUMENT-GAP FLAG: the Pro/Business price is captioned as an ANNUAL
  total per seat ("yillik fiyat"), not as a monthly figure - unlike this variable's own worked
  example (Vendor B: "$12 per user/month", billed annually, coded per_seat_per_month because the
  DISPLAYED figure is itself monthly). None of headline_billing_basis's four recurring values
  (per_month_billed_annually, per_month_billed_monthly, per_seat_per_month, one_time) describe an
  annual total shown directly as such. Coded unknown rather than stretching a mismatched
  category; flagged here in case a future codebook revision wants to add an annual-total value.
  ARCHIVAL: live canva.com remains Cloudflare-bot-walled to static fetchers (the prior pass's
  finding - WebFetch bare 403, curl 403-with-challenge-body - was not re-tested exhaustively
  this pass, since the orchestrator's rendered capture made a fresh live-page attempt
  unnecessary for the A-domain). The five official documents the prior pass archived (pricing,
  home, Terms of Use, Content License Agreement, AI Pass help article) were re-read from their
  existing local/web.archive.org copies this pass, decoded, and re-quoted directly from each
  page's embedded JSON blob. The three help-center articles the prior pass could never fetch
  (cancel-canva-plan, subscription-refunds, watermarks-design) were not re-attempted this pass,
  which is scoped to the entry tier and currency; refund_policy_location, free_plan_watermark,
  and watermark_removal_tier remain terms/unknown/unknown for the same reason as the superseded
  record (note: refund_policy_location is corrected to the value "terms" in this record - the
  superseded record had miscoded it "terms_only", a value that belongs to the different
  auto_renewal_disclosure_location list, not to this variable's own list). The five "-raw.html"/"-raw2.html" salvage pairs in canva-sources/ were independently
  spot-checked again this pass (title tags, cf_chl_opt markers) and reconfirmed to be Cloudflare
  challenge interstitials, not usable content; not cited.
  blindness: no other record, no review page, no pass-2 material was opened.
  D-007 re-check 2026-08-10: this record was one of six flagged for re-verification
  under the amended currency rule (deviations-log.md D-007), which supersedes D-003's
  Accept-Language/archive-only check this record originally rested on. Arms attempted,
  in order: (1) vendor's own currency disclosure -- rendered DOM scan for a currency/
  country selector on both /pricing/ (TR locale) and a second, previously-untried
  /en/pricing/ locale path (0 matches on either; a footer "Turkce" control found is a
  language switcher, not a currency selector, and even the English-UI /en/pricing/
  page still prices in TRY); a ?currency=USD URL parameter (dropped/ignored, TRY
  unchanged); and a full-text read of the official help article
  https://www.canva.com/help/pay-credit-debit-card/ (located via web search of
  canva.com's own help domain, then read directly), which states "If your local
  currency isn't available, you'll be charged in US dollars using your bank's
  conversion rate" -- positive documentary evidence that USD is a fallback only
  where local currency is unsupported, and TRY is demonstrably supported/active for
  this reader (real TRY prices render consistently across two locale-path variants).
  (2) A US-crawled archive capture that actually contains price figures -- both
  https://web.archive.org/web/2026/https://www.canva.com/pricing/ and the
  /en/pricing/ equivalent still redirect to Canva's own "Unsupported client"
  bot-block interstitial (321 bytes, no price content) -- returned nothing readable.
  Full log: canva-sources/d007-currency-recheck-2026-08-10.txt. Outcome (AS FIRST
  WRITTEN, later corrected below): value UNCHANGED. headline_price_usd and
  first_charge_amount_usd both remain non_usd (Pro, TRY 1,920/yr), now resting on
  Arm 1's positive documentary evidence rather than on the original absence-only
  Accept-Language/archive check. No dependent variable required updating:
  cost_per_output_computable's arithmetic is already denominated in TRY per
  protocol-v1.md 6.5 (no exchange rate invented), and is unaffected.

  CANVA RE-EXAMINATION UNDER CORRECTED WORDING, 2026-08-10 (same day, second
  pass, ordered by the study coordinator after finding the agent brief and
  deviations-log.md D-007 disagreed on the test's wording): the D-007 pass above
  read the amended currency rule's Arm 1 test as asking whether a non-USD price
  is served "to the reader" -- and applied that to THIS study's own
  Turkey-egressing reader, for whom TRY is confirmed available, concluding
  non_usd. The authoritative text, deviations-log.md D-007, actually asks
  whether "a US reader" is served one, which is a different question and the one
  D-003 was written to answer in the first place (D-003 exists because a
  Turkey-rendered page "may be measuring us rather than the vendor"). The
  reasoning does not change: Canva's own help article
  (https://www.canva.com/help/pay-credit-debit-card/) states local currency is
  used by default, with USD only where the reader's local currency is
  UNAVAILABLE. What changes is which reader that clause is evaluated against.
  For a US reader, local currency is USD, which is obviously available (Canva
  plainly serves USD to US customers), so the SAME clause puts a US reader in
  the ordinary case -- billed in their own available local currency, USD -- not
  the fallback case. Under the corrected test this means the vendor does NOT
  publish only a non-USD price, and a US reader is NOT served one: neither
  condition non_usd requires is met. Arm 2 (US-crawled archive captures) still
  returns nothing readable (unchanged from the finding above), so no actual USD
  figure is in hand.
  VALUES, BEFORE AND AFTER THIS RE-EXAMINATION (2026-08-10): headline_price_usd
  non_usd -> unknown; first_charge_amount_usd non_usd -> unknown. Both were
  briefly re-confirmed non_usd earlier the same day (see the outcome paragraph
  directly above, now superseded) before this correction. cost_per_output_computable
  is unaffected (stays yes, TRY-denominated arithmetic unchanged -- that
  variable's rule does not gate on headline_price_usd's coded value); only a
  stale cross-reference in its computation_assumptions text is corrected. A new
  register_events entry logs the TRY figure as the locally-served display
  variant under this reading. This makes canva's resolution consistent with how
  gptzero and phrasly were coded earlier in this same sweep: a real, documented
  currency fact that argues against non_usd, without a recovered figure to code
  as money, resolves to unknown. Full reasoning also recorded in
  d007-recheck-report.md under "canva re-examination under corrected wording."
  This coder reached the same conclusion the coordinator proposed after
  independently re-deriving it from the two texts and the evidence already on
  file; it is not a value changed merely to match an instruction.
