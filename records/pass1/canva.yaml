default_display_state: |
  D-005 re-collection. Live canva.com remains Cloudflare-bot-walled to static fetchers (prior
  pass confirmed WebFetch bare HTTP 403 and curl HTTP 403-with-JS-challenge-body; not
  re-tested exhaustively this pass). The A-domain in this record is coded from an
  orchestrator-captured ORDINARY-BROWSER rendered read of https://www.canva.com/pricing/ taken
  2026-08-08 (local file: canva-sources/pricing-rendered-2026-08-08.txt) - deviation D-005: a
  page load that lets the vendor's own scripts render is reading a document, not prohibited
  conduct (no account, no login, no checkout, no trial). The collection host for that read
  egresses from Turkey; Canva's locale/currency selection is IP-based, not path-based
  (requesting /en_us/pricing/ served the identical tr-TR page, redirected to
  /tr_tr/ucretlendirme/, html lang="tr-TR"). Default (pre-interaction) state observed: TRY
  currency, four plan cards (Free / Pro / Business / Enterprise) on the default "Individual and
  Corporate Use" tab (a separate "Egitim"/Education tab exists but was not the tab shown), each
  paid card showing ONE price captioned as an annual, per-person figure, plus a monthly/annual
  toggle ("Aylik | Yillik, %16 tasarruf et") whose annual side is what the caption reflects.
  Free = 0 TRY; Pro = 1.920 TRY ("Bir kisi icin yillik fiyat"); Business = 3.400 TRY ("Kisi
  basi yillik fiyat"); Enterprise = sales-gated ("Bize ulasin"), no published price. D-003
  currency check (protocol 6.5): two curl attempts against web.archive.org US-crawled captures
  of this same URL (2026-08-09) found no USD figure in either state reachable - see coder_note
  for the full log. All non-price contractual/feature content (free-plan caps, AI-allowance
  table, fair-use footnote, Terms of Use, Content License Agreement, AI Pass help article) is
  coded from this record's existing same-window English-locale archive.org snapshots
  (2026-08-04/05/06), each re-opened and re-quoted fresh this pass directly from its embedded
  JSON content blob (Canva ships this copy as an escaped JSON object inside one large <script>
  tag, not as plain DOM text). Those snapshots' server-rendered HTML still contains zero price
  digits anywhere, in any currency - unchanged from the prior pass, and exactly why the
  orchestrator's rendered capture was necessary for the A-domain. Cookies/consent: not
  observable in any source read (no consent-banner markup present in any capture).
