  # --- coded variables (codebook section 10 column order) ---
  headline_price_usd: { value: unknown, source: "https://www.canva.com/pricing/", evidence: "CHANGED AGAIN under a 2026-08-10 re-examination -- see coder_note ('canva re-examination under corrected wording') and d007-recheck-report.md for the full reasoning; canva-sources/d007-currency-recheck-2026-08-10.txt carries the underlying Arm 1/Arm 2 fact-finding, unchanged. Entry paid tier is Pro. Orchestrator-captured rendered read (D-005, 2026-08-08) shows the Pro card's sole price as '1.920 TRY' captioned 'Bir kisi icin yillik fiyat' (annual price for one person). The D-007 re-check's Arm 1 evidence stands unchanged (help article https://www.canva.com/help/pay-credit-debit-card/: 'If your local currency isn't available, you'll be charged in US dollars using your bank's conversion rate'), but the FIRST D-007 pass misread which reader that clause has to be evaluated against: the authoritative test (deviations-log.md D-007) asks whether 'a US reader' is served a non-USD price, not whether this study's Turkey-egressing reader is. Read against a US reader, USD is that reader's own local currency and is obviously available to them, so the same clause puts a US reader in the ORDINARY case (billed in their available local currency, USD), not the fallback case -- meaning the vendor does not publish only a non-USD price, and a US reader is not served one. Both conditions non_usd requires now fail. Arm 2 still returns nothing readable (US-crawled archive captures of both pricing URLs redirect to Canva's own bot-block interstitial), so no actual USD figure is in hand to code as money either. unknown is the value for 'a real currency fact points away from non_usd, but no figure was recovered' -- the same resolution already reached for gptzero and phrasly earlier in this sweep. TRY 1,920/yr is logged as the locally-served display_variant (see register_events)." }
  headline_billing_basis: { value: unknown, source: "https://www.canva.com/pricing/", evidence: "The qualifier printed with the Pro card's price is 'Bir kisi icin yillik fiyat' ('annual price for one person') - the figure IS the annual total itself, not a monthly rate. None of this variable's four recurring-basis values fit: per_month_billed_annually and per_seat_per_month both require the DISPLAYED figure to be a monthly amount (this variable's own worked example, Vendor B, shows '$12 per user/month' - a monthly-denominated figure - even though billed annually); per_month_billed_monthly and one_time plainly do not apply either. The page's own monthly/annual toggle ('Aylik | Yillik, %16 tasarruf et') confirms a monthly alternative exists, so the annual denomination is a real, read fact, not an omission - but the instrument's value list has no 'annual total, per seat, billed annually' option. Coded unknown rather than stretching a mismatched category; flagged in coder_note as an instrument-observation." }
  first_charge_amount_usd: { value: unknown, source: "https://www.canva.com/pricing/", evidence: "CHANGED AGAIN under the 2026-08-10 re-examination -- same basis as headline_price_usd (see that field, coder_note's 'canva re-examination under corrected wording', and d007-recheck-report.md). Rule 2 would apply directly if a USD figure existed (the default state already shows an ANNUAL figure, so no x12 needed) -- TRY 1,920/yr for Pro is the figure this study's own network observes, but under the corrected 'US reader' test, Canva's own stated policy (local currency by default, USD only where the reader's local currency is unavailable) implies a US reader is billed in USD, their own available local currency, not shown TRY at all. No document states what that USD annual figure is, and Arm 2 returns nothing readable. unknown, not non_usd -- no arm supplies a figure to annualize, and the evidence that exists argues against a clean non-USD publication." }
  mandatory_addon_present: { value: "no", source: "https://www.canva.com/help/ai-pass/", evidence: "AI Pass ('AI Pass is an optional add-on ... AI Pass is USD $100 globally per person, per month', re-verified verbatim this pass) and AI top-ups ('a one-time purchase for Business users who subscribe online ... valid for 30 days', re-verified verbatim this pass) are the only priced extras documented anywhere, and both are explicitly optional (rule 3: 'Optional add-ons are not mandatory add-ons'). The Content License Agreement confirms Pro Content is included 'at no additional cost if you have a valid Canva subscription'. No other required charge, minimum purchase, platform fee, or onboarding fee is documented in Terms of Use, the CLA, the pricing page, or the AI Pass article for the Pro tier." }
  annual_condition_disclosure: { value: adjacent, source: "https://www.canva.com/pricing/", evidence: "The Pro card's price block reads '1.920 TRY - Bir kisi icin yillik fiyat' (annual price for one person) in the D-005 rendered capture (2026-08-08): the annual-prepayment condition is disclosed directly beneath/with the figure, inside the same card. Matches the adjacent definition ('directly beneath the figure') exactly - contrast with the superseded record, where this was unknown because no price block had been observed at all." }
  annual_default_toggle: { value: annual_preselected, source: "https://www.canva.com/pricing/", evidence: "The default (pre-interaction) state captured by the D-005 rendered read shows the price explicitly captioned as the annual figure for both Pro and Business, with a monthly alternative also offered via the 'Aylik | Yillik' toggle. Since the annual figure is what loaded before any interaction, annual was the preselected state on this read. No variant of the toggle STATE itself was observed in this pass (the archived English snapshot shows no price/toggle content at all, per default_display_state, so there is nothing to compare as a second observed toggle state); the separate TRY-vs-no-price difference across sources is logged as its own display_variant register event." }
  free_plan_exists: { value: "yes", source: "https://www.canva.com/pricing/", evidence: "Re-verified this pass from the archived snapshot's embedded JSON: the free plan card's own object carries plan name 'Free' and CTA 'Get started' - not a trial-style CTA (contrast Pro/Business's 'Start a free trial'). The D-005 rendered TR capture cross-confirms independently: 'Bireysel Kullanim - Ucretsiz' (Individual Use - Free) with CTA 'Baslayin' (Get started), again distinct from Pro/Business's 'Ucretsiz denemeyi baslatin' (Start a free trial). Corroborated by the pricing FAQ: 'Canva Free is available to anyone.'" }
  free_plan_cap_documented: { value: some_quantified, source: "https://www.canva.com/pricing/", evidence: "Re-extracted this pass from the archived snapshot's embedded JSON. Quantified standing limits: '1 Brand Kit (3 colors only)', '5GB of cloud storage'. Quantified rate: the AI-allowance intro states 'AI usage is pooled across all AI tools listed below, and resets monthly', and the Free row reads 'Up to 200 uses of Standard AI tools, or up to 20 uses of Premium AI tools. No access to Ultra AI tools.' Unquantified: 'Ad insights and AI ad creation^' and 'Access to Affinity^' both carry the (^) footnote 'Included based on your plan and don't count toward your shared monthly AI allowance. Subject to fair use limits' - no number given. At least one quantified and at least one not => some_quantified." }
  free_plan_cap_value: { value: "5GB cloud storage | 1 Brand Kit (3 colors only) | up to 200 Standard AI uses per month | up to 20 Premium AI uses per month", source: "https://www.canva.com/pricing/", evidence: "The quantified free-plan limits re-confirmed this pass (see free_plan_cap_documented). The two AI-allowance figures are alternate ceilings of one pooled/shared monthly allowance (Standard-only use yields up to 200; Premium-only use yields up to 20), not additive; both recorded per section 5.1 since both are independently quantified statements the vendor publishes. The unquantified fair-use-limited items are excluded." }
  free_plan_watermark: { value: unknown, source: "https://www.canva.com/pricing/", evidence: "Re-confirmed this pass: zero occurrences of 'watermark' in the pricing page, Terms of Use, Content License Agreement, or AI Pass help article (fresh full-text search of all four this pass). The dedicated Help Center article ('Watermarks or Canva logos are on my design') was not re-attempted this pass, which is scoped to the entry tier and currency; the prior pass's 2-3 archival attempts for it (beyond this study's 2-retry cap) already failed. Free-plan output could plainly carry a watermark (not a not_applicable case), so documented silence plus an unreachable dedicated article codes unknown, unchanged from the superseded record." }
  free_plan_duration: { value: perpetual, source: "https://www.canva.com/pricing/", evidence: "Free is presented as a standing card alongside the paid tiers, CTA 'Get started'/'Baslayin' (not a trial-style CTA), no expiry stated anywhere in any of the four documents read this pass. FAQ: 'Canva Free is available to anyone' - a standing, ongoing option, not a countdown." }
  trial_exists: { value: "yes", source: "https://www.canva.com/pricing/", evidence: "Both the Pro and Business cards carry a 'Start a free trial' CTA ('Ucretsiz denemeyi baslatin' in the D-005 TR render), re-confirmed this pass from both sources. Corroborated by Terms of Use ('At the end of your free trial, Canva will charge the relevant subscription fee for the next billing cycle ...') and the Content License Agreement ('free trials of Canva Business'), both re-quoted verbatim this pass." }
  trial_card_required: { value: unknown, source: "https://www.canva.com/policies/terms-of-use/", evidence: "Terms of Use states the trial auto-converts by charging 'your nominated payment method' at the end of the trial unless canceled first, implying a payment method is already on file - but none of the four documents read this pass explicitly states a card must be entered to START the trial. The pricing FAQ adds one non-conclusive data point re-found this pass ('You won't be billed at all during your trial period', re: Business team invites) that also does not state a card requirement. Matches this codebook's own worked example (Vendor I: conversion implies stored payment details, but implication is not a statement -> unknown); same reasoning, unchanged from the superseded record." }
  trial_length_days: { value: unknown, source: "https://www.canva.com/pricing/", evidence: "Fresh day-count search this pass across all four documents (pricing FAQ, Terms of Use, Content License Agreement, AI Pass article) finds no day/week/month figure for the actual Pro or Business trial length. The only day-figures present anywhere are unrelated: AI top-ups 'valid for 30 days' (a top-up expiry, not a trial length) and the AI Pass article's list of prepaid-plan durations ('1-day, 1-week, 1-month, or 1-year prepaid plan', an eligibility exclusion, not a trial length). True for both Pro and Business alike." }
  trial_auto_converts: { value: "yes", source: "https://www.canva.com/policies/terms-of-use/", evidence: "Terms of Use, Subscriptions and Renewals, re-quoted verbatim this pass: 'At the end of your free trial, Canva will charge the relevant subscription fee for the next billing cycle to your nominated payment method, unless you cancel your subscription prior to the end of the free trial.' Matches the rule exactly." }
  credit_system_present: { value: "yes", source: "https://www.canva.com/pricing/", evidence: "Product-level finding (not one of the six entry-tier-scoped variables per codebook-v1.md 5.2). Re-confirmed this pass: the AI-allowance table states usage 'is pooled across all AI tools listed below, and resets monthly', then gives THREE PARALLEL maximum-use ceilings per plan depending on which AI-tool tier is drawn from exclusively (e.g. Pro: 'Up to 2,000 uses of Standard AI tools, or up to 200 uses of Premium AI tools, or up to 20 uses of Ultra AI tools'). Three ceilings for one underlying monthly allowance is the signature of an intermediate currency converting into outputs (rule 2), not a single output-unit allowance (rule 1). The word 'credit' itself is never used for this system in any of the four documents read this pass (zero occurrences after excluding 'credit card'); Canva calls it an 'AI allowance', but section 5's definition scores the construct 'whatever the vendor calls it'." }
  credit_unit_defined: { value: "no", source: "https://www.canva.com/pricing/", evidence: "Fresh full-text search this pass (pricing page, Terms of Use, Content License Agreement, AI Pass article) finds no sentence defining what one unit of the pooled AI allowance equals - no 'AI credit'/'AI point' term, no 'X units = 1 output' conversion. What is published is three parallel per-plan ceiling figures (e.g. Pro's 2,000/200/20 Standard/Premium/Ultra), which lets a reader back-calculate an implied ratio but is not a stated unit definition - the same distinction rule 5 draws for a bare 'plan includes N credits' statement." }
  credit_to_output_rate_published: { value: "no", source: "https://www.canva.com/pricing/", evidence: "Follows from credit_unit_defined=no: with no named underlying unit, there is no stated credits-per-output conversion rate for the principal output either - only the parallel per-tool-tier ceiling figures, which the documents present as maximums, not a rate formula. No rate is published for any output, principal or secondary, in any of the four documents read this pass." }
  credit_rate_location: { value: absent, source: "https://www.canva.com/pricing/", evidence: "credit_to_output_rate_published = no; no credit-to-output rate is published anywhere to have a location. (The AI-allowance ceiling table itself IS published and lives on the pricing page, cross-referenced by URL from the AI Pass article - but per credit_to_output_rate_published this table is not a credits-to-output rate, so its location is not recorded here.)" }
  cost_per_output_unit: { value: per_seat_month, source: "https://www.canva.com/pricing/", evidence: "Canva's principal offering, as its own pricing page frames it, is unmetered access to a design platform sold per person: the Pro card is scoped 'For one person' ('Bireysel Kullanim' in the TR render) and the Business card 'For your team'. Core design features carry no usage ceiling anywhere in the documents read - only the secondary AI-generation feature set is allowance-metered (see credit_system_present). Matches codebook rule 2 and its own worked example (Vendor L, flat monthly price per user -> per_seat_month) precisely." }
  cost_per_output_computable: { value: "yes", source: "https://www.canva.com/pricing/", evidence: "CHANGED from the superseded record's no, which was coded solely because no price had been located at all. Principal output unit is per_seat_month (unmetered seat access). The entry tier's price is now known: Pro, 1.920 TRY annual total per person, in the pricing page's default display state (D-005 rendered read, 2026-08-08). Rule 3: converting the annual price to a month (1.920 / 12 = 160.00 TRY/month) puts price and the implicit '1 seat' allowance on the same period; no additional unpublished figure or usage assumption is needed for a per_seat_month unit - the monthly-equivalent price IS the cost per output unit. See computation_assumptions." }
  computation_assumptions: { value: "Pro tier, 1.920 TRY billed annually per default display state (rendered capture, 2026-08-08) = 160.00 TRY/month. per_seat_month output = monthly price directly; no separate allowance to convert. TRY is the figure this study's network observed; headline_price_usd is unknown as of the 2026-08-10 re-examination (was non_usd, briefly) -- no USD figure exists in any document to substitute, and this variable's rule does not gate on headline_price_usd's specific value, so the TRY-denominated computation itself is unaffected. See headline_price_usd.", source: "https://www.canva.com/pricing/", evidence: "Arithmetic per cost_per_output_computable rule 3; not a vendor statement. Cross-reference corrected 2026-08-10; see coder_note." }
  credit_rollover_policy: { value: expires_at_period_end, source: "https://www.canva.com/pricing/", evidence: "Re-quoted verbatim this pass from the pricing page's AI-allowance table: 'AI usage is pooled across all AI tools listed below, and resets monthly.' Matches the rule's own example wording ('Credits reset monthly' -> expires_at_period_end)." }
  failed_generation_charge_policy: { value: unknown, source: "https://www.canva.com/pricing/", evidence: "Fresh full-text search this pass of all four documents (pricing page, Terms of Use, Content License Agreement, AI Pass article) for 'fail'/'error'/'unsuccessful' finds only unrelated matches: ToS compliance-failure and service-failure/liability clauses, a CLA license-termination-for-failure-to-comply clause, and an AI-Pass-article URL-slug 'failed-payments' (routing metadata, not prose) - none address whether a technical failure or empty AI-generation result consumes allowance. Silence is unknown per the rule, which itself notes 'this variable is silent often. That is the finding.'" }
  auto_renewal_default: { value: "on", source: "https://www.canva.com/policies/terms-of-use/", evidence: "Terms of Use, Subscriptions and Renewals, re-quoted verbatim this pass: 'If you're subscribing to a paid plan your subscription (excluding any one-time payments) will automatically renew each billing cycle, for example, on a monthly or annual basis as applicable. We'll notify you before auto-renewal of your subscription. You can cancel your subscription at any time, subject to section (d) below.' Top-ranked contractual source states this directly and unambiguously." }
  auto_renewal_disclosure_location: { value: multiple, source: "https://www.canva.com/policies/terms-of-use/", evidence: "Stated in the terms_only-class document directly (quoted above) AND in a docs_help_center-class document, re-confirmed this pass: the AI Pass article's eligibility section states 'You can purchase AI Pass on a monthly or yearly auto-renewing Canva Pro, Canva Teams, Canva Business, or Canva for Nonprofits plan' - itself a statement that the base plans are auto-renewing. Not found on the pricing page (its FAQ, re-searched this pass, does not mention auto-renewal). Two of the four document classes state it in agreement, so multiple." }
  renewal_notice_commitment: { value: advance_notice_stated, source: "https://www.canva.com/policies/terms-of-use/", evidence: "Terms of Use, same clause as auto_renewal_default: 'We'll notify you before auto-renewal of your subscription.' A stated advance-notice commitment (no specific day-count given, but the rule only requires a stated commitment, 'ideally with a period')." }
  refund_policy_exists: { value: no_refunds_stated, source: "https://www.canva.com/policies/terms-of-use/", evidence: "Terms of Use, Cancellation, re-quoted verbatim this pass: 'If you cancel your subscription and/or Add-Ons, your subscription and/or Add-Ons will be cancelled at the end of your then-current billing cycle and you will not be entitled to a refund of any fees already paid (except where required by law) and any outstanding fees will become immediately due and payable.' Matches this codebook's own worked example almost verbatim (Vendor Q -> no_refunds_stated, exception noted)." }
  refund_window_days: { value: 0, source: "https://www.canva.com/policies/terms-of-use/", evidence: "refund_policy_exists=no_refunds_stated with no day-count window published anywhere in the four documents read this pass for the general position (matches the value list: '0 where no refunds are given'). This is an entry-tier-scoped variable (codebook 5.2) but the ToS position is stated generally, not per-plan, so it holds for Pro directly. The dedicated 'Refunds for Canva subscriptions' help article remains unread this pass (not re-attempted; out of this pass's entry-tier/currency scope, and the prior pass's retry cap was already exceeded on it)." }
