  - { type: display_variant, detail: "Same pricing-page URL served two materially different states across this study's collection. An English-locale, server-rendered archive.org capture (2026-08-05, US/English render context per its own embedded page-state object) shows zero price digits anywhere - prices are injected client-side post-hydration. An orchestrator-captured ordinary-browser rendered read from a Turkey-egressing network (2026-08-08) shows full TRY pricing (Free 0 TRY, Pro 1.920 TRY/yr, Business 3.400 TRY/yr) with tr-TR locale copy, and this state persisted even when the /en_us/ path was requested. protocol-v1.md 6.8 geography case: locale/currency is IP-based, not URL-based. D-003 checks (2026-08-09) against web.archive.org's own US-crawled captures of this URL found no USD price in any state reachable from this collection network.", urls: ["https://www.canva.com/pricing/", "https://web.archive.org/web/20260805125923/https://www.canva.com/pricing/", "https://web.archive.org/web/20260805141457/https://www.canva.com/pricing/"] }
  - { type: display_variant, detail: "2026-08-10 re-examination addendum (deviations-log.md D-007, corrected wording). Canva's own help article (https://www.canva.com/help/pay-credit-debit-card/) states its billing policy is local-currency-by-default with USD used only where the reader's local currency is unavailable. Evaluated against a US reader specifically -- USD is that reader's own local currency and is plainly available to them -- this policy implies a US reader is billed in USD as their ordinary available local currency, not shown TRY. The TRY 1,920/yr this study's own Turkey-egressing network observed is therefore logged here as the locally-served display variant from the presumed USD state a US reader would see, per protocol-v1.md 6.8, rather than treated as evidence of the vendor's general publication practice. No document available to this study states the actual USD figure a US reader would be shown (Arm 2 returned no readable US-crawled capture), so headline_price_usd/first_charge_amount_usd are coded unknown rather than a money value or non_usd.", urls: ["https://www.canva.com/pricing/", "https://www.canva.com/help/pay-credit-debit-card/"] }
