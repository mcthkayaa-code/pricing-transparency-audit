    evidence: "No trial exists (trial_exists = no)."
  trial_auto_converts:
    value: not_applicable
    source: https://www.magnific.com/pricing
    evidence: "No trial exists (trial_exists = no)."

  credit_system_present:
    value: "yes"
    source: https://www.magnific.com/pricing
    evidence: >
      Credits are an intermediate currency converting into outputs (e.g. "75
      credits/image", "240K credits/year" allowance) rather than a direct output-unit
      allowance.
  credit_unit_defined:
    value: "yes"
    source: https://www.magnific.com/pricing
    evidence: >
      Pricing page's "Compare plans" table converts credits into specific output units
      for many models, e.g. "Google Nano Banana 2 1K ... 75 credits/image", "Google
      Lyria 3 ... 160 credits/song" - satisfies "any official document converts
      credits into any output unit."
  credit_to_output_rate_published:
    value: "yes"
    source: https://www.magnific.com/pricing
    evidence: >
      Exact numeric rates published for the principal output (image: 44-400
      credits/image across 13 named models) and for the other advertised output types
      (video: credits/second per model; audio: credits/song, credits/30s). None stated
      only as an unresolved range.
  credit_rate_location:
    value: pricing_page
    source: https://www.magnific.com/pricing | https://www.magnific.com/ai/docs/plans-and-pricing
    evidence: >
      Per-model credit rates appear only in the pricing page's "Compare plans" tool;
      the plans-and-pricing docs page shows plan-level credit allocations
      (240K/600K/4M per year) but does not restate per-output conversion rates.
  cost_per_output_unit:
    value: per_image
    source: https://www.magnific.com/ai/image-generator
    evidence: "Product audited is the AI Image Generator; principal output is a generated image."
  cost_per_output_computable:
    value: partial
    source: https://www.magnific.com/pricing
    evidence: >
      Entry tier Premium's price (now $14.50/mo per the D-007 re-check, 240,000
      credits/yr = 20,000/mo) is published, and exact credit-per-image rates are
      published for 13 distinct image models (44 to 400 credits/image - e.g.
      Ideogram 2K High=44, Nano Banana 2 Lite 1K=60, Nano Banana 2 1K/2K=75,
      Seedream 5.0 Pro 2K=100, GPT Image 2.0 Mid 2K=400), but no single model is
      designated as "the" default/principal rate, so the arithmetic yields a
      range (~$0.03-0.29/image, CHANGED from ~TRY0.99-9.00/image -- see
      computation_assumptions) rather than one figure. Falls under the "only
      across a published range that yields a range" branch of partial. Value
      itself (partial) is unaffected by the D-007 currency re-check; only the
      computed range's denomination changed.
  computation_assumptions:
    value: >-
      Premium (entry tier), $14.50/mo billed annually (default state; D-007
      re-check 2026-08-10 changed this from TRY450/mo/non-USD -- see
      headline_price_usd), 240,000 credits/yr=20,000/mo (currency-independent,
      unchanged). Per-image rates published per model, 44-400 credits/image
      (unchanged), no default model named => price per credit =
      14.50/20,000=0.000725; cost/image ranges 44x0.000725=$0.03 to
      400x0.000725=$0.29, not one figure (was TRY0.99-9.00).
    source: https://web.archive.org/web/20260807070007/https://www.magnific.com/pricing
    evidence: "Coder's own arithmetic from the two figures above; see cost_per_output_computable and freepik-sources/d007-currency-recheck-2026-08-10.txt for the currency re-check that changed the denomination."
  credit_rollover_policy:
    value: expires_at_period_end
    source: https://www.magnific.com/pricing | https://www.magnific.com/legal/terms-of-use
    evidence: >
      Pricing page (per-plan bullet): "Credits valid for 1 year, no monthly resets."
      ToS section 9.1: "Unused usage credits within the billing period in which they
      were assigned will not be transferred to the next billing period" and "usage
      credits...will automatically reset at the start of each billing period." For
      these annual plans the billing period is 1 year, so the base allowance is lost
      unused at year-end. Distinct from purchased "Extra Credits" (ToS 9.3.3), which
      DO roll over subject to a 3-year expiry; this variable is coded on the plan's
      base/included allowance, which is what a buyer compares across tiers.
  failed_generation_charge_policy:
    value: unknown
    source: https://www.magnific.com/legal/terms-of-use | https://www.magnific.com/legal/acceptable-use-policy | https://www.magnific.com/ai/docs/plans-and-pricing
    evidence: >
      No document read (ToS, AI Products Terms, AUP, plans-and-pricing docs,
      subscriptions-and-refunds docs) states whether a failed, errored, or empty
      generation consumes a credit. AI Products Terms describe credits being deducted
      for actions performed but do not address the failure/outcome case.

  auto_renewal_default:
    value: "on"
    source: https://www.magnific.com/legal/terms-of-use | https://www.magnific.com/ai/docs/subscriptions-and-refunds
    evidence: >
      ToS 9.1: "Unless otherwise indicated, Subscriptions will be automatically
      renewed, successively at the end of their term using the same payment method,
      unless the User cancels the Subscription renewal before its expiration."
      Corroborated by docs: "All paid Magnific subscriptions renew automatically at
      the end of each billing period."
  auto_renewal_disclosure_location:
    value: multiple
    source: https://www.magnific.com/legal/terms-of-use | https://www.magnific.com/ai/docs/subscriptions-and-refunds
    evidence: >
      Stated in the Terms of Service (9.1) AND the dedicated subscriptions-and-refunds
      docs page (both quoted under auto_renewal_default) - two document classes agree.
      Pricing page also lists "Is my subscription automatically renewed?" as an FAQ
      title (not expanded), a possible third touchpoint not needed for this value.
  renewal_notice_commitment:
    value: advance_notice_stated
    source: https://www.magnific.com/legal/terms-of-use
    evidence: >
      ToS 9.1: "In case of a price modification applicable to any renewal, the Company
      will inform the User at least one month before the application date by email."
      Scope caveat: commitment is specific to renewals where the price changes; no
      general "notice before every renewal" statement was found - the
      subscriptions-and-refunds docs page confirms no general advance-notice statement
      exists.
  refund_policy_exists:
    value: "yes"
    source: https://www.magnific.com/ai/docs/subscriptions-and-refunds | https://www.magnific.com/pricing | https://www.magnific.com/legal/terms-of-use
    evidence: >
      Docs: "Refunds are only available if you have not used the service: no
      downloads..., and no AI credits consumed" (30-day window). Pricing page: "30-day
      refund guarantee." ToS states "no right of withdrawal applies...unless the
      Company indicates otherwise" - and it does, via the above two documents.
  refund_window_days:
    value: 30
    source: https://www.magnific.com/ai/docs/subscriptions-and-refunds
    evidence: >
      "Window: 30 days from payment date"; corroborated by pricing page's "30-day
      refund guarantee."
  refund_conditions:
    value: conditional
    source: https://www.magnific.com/ai/docs/subscriptions-and-refunds
    evidence: >
      "Refunds are only available if you have not used the service: no downloads from
      Magnific.com or Flaticon.com, and no AI credits consumed. If you have downloaded
      any content or used any AI credits during the billing period, you are not
      eligible for a refund."
  cancellation_self_serve:
    value: self_serve_documented
    source: https://www.magnific.com/legal/terms-of-use | https://www.magnific.com/ai/docs/subscriptions-and-refunds
    evidence: >
      ToS 9.3.2: "The User may cancel the renewal of their Subscription at any time
      through their profile." Docs: "Click your profile picture and select 'Plan &
      billing'" then "'Danger zone -- Cancel a subscription'...'Cancel subscription'."
  refund_policy_location:
    value: multiple
    source: https://www.magnific.com/pricing | https://www.magnific.com/ai/docs/subscriptions-and-refunds
    evidence: >
      Pricing page states "30-day refund guarantee" (with a "More info" link to the
      docs page); the dedicated docs page states the full conditional policy. Two
      classes agree (pricing_page + dedicated_refund_page).
  commercial_use_lowest_tier:
    value: lowest_paid
    source: https://www.magnific.com/legal/terms-of-use | https://www.magnific.com/pricing
    evidence: >
      Pricing page lists "Commercial AI license" as a checked feature starting at the
      Premium card (entry paid tier). AI Products Terms sec.7: only "Users who have
      purchased a Subscription" (Subscribers) are assigned ownership/full rights in
      Output "in perpetuity"; "Free User[s]" get only a revocable license "exclusively
      for personal and non-commercial purposes." See conflict_note re: a marketing
      page's broader, tier-unqualified claim.
  watermark_removal_tier:
    value: unknown
    source: https://www.magnific.com/pricing | https://www.magnific.com/legal/terms-of-use | https://www.magnific.com/ai/image-generator
    evidence: >
      No document read (pricing page, ToS, AI Products Terms, AUP, docs, AI Image
      Generator product page) states which tier(s) apply or remove a watermark on
      AI-generated image outputs. Same gap noted under free_plan_watermark, including
      the attribution-vs-watermark distinction.
  output_ownership_statement:
    value: conditional
    source: https://www.magnific.com/legal/terms-of-use
    evidence: >
      AI Products Terms sec.7: "Between Magnific and the Users who have purchased a
      Subscription...(the 'Subscribers'), Magnific hereby assigns to them all rights,
      title, and interest...The Subscriber will be the exclusive owner...in
      perpetuity...provided that their Subscription remains active at the time of
      generation." Free Users instead get only "a personal, non-exclusive,
      non-transferable, and revocable license...exclusively for personal and
      non-commercial purposes." Rights explicitly depend on tier (Subscriber vs Free).

  usage_cap_quantified:
    value: some_quantified
    source: https://www.magnific.com/pricing | https://www.magnific.com/legal/terms-of-use
    evidence: >
      Premium's credit allowance is quantified: "240,000/year" (number+dimension+
      period). Downloads are marketed as not specifically limited, but ToS 9.4.2
      (Premium Subscription benefits): "Not being subject to specific download limits
      of Magnific Content that apply at any given time, without prejudice to certain
      quantitative limitations to prevent fraudulent or abusive use of the Website" -
      an unlimited-style claim qualified by a discretionary, unquantified clause, so it
      does not count as quantified per section 5.1 rule 3. At least one quantified
      (credits) + at least one not (downloads) => some_quantified.
  unquantified_limit_clause:
    value: present
    source: https://www.magnific.com/legal/acceptable-use-policy | https://www.magnific.com/legal/terms-of-use
    evidence: >
      AUP "Fair Use" section (read in full): "Magnific reserves the right to monitor
      usage patterns to ensure compliance with this Fair Use Policy, and may
      temporarily restrict, suspend, or disable access to certain features or accounts
      where abnormal, excessive, or automated activity is detected." No number given
      for "excessive." Corroborated by ToS 9.4.2's "quantitative limitations to
      prevent fraudulent or abusive use" carve-out on Premium's download benefit.

conflict_note: >
  Commercial-use rights: https://www.magnific.com/ai/image-generator FAQ states
  outputs may be used "for both personal and commercial use" with no tier qualifier.
  AI Products Terms (https://www.magnific.com/legal/terms-of-use, sec.7) restrict Free
  Users to a revocable license for "personal and non-commercial purposes" only; only
  paid Subscribers get full (and thus commercial) rights. Coded
  commercial_use_lowest_tier and output_ownership_statement from the Terms (ToS ranks
  first for contractual variables per protocol-v1.md 6.2); both URLs recorded here.
coder_note: >
  PRODUCT SCOPE: audited product is the AI image generator (principal output = an
  AI-generated image). Freepik/Magnific also sells a stock-asset subscription on the
  same account/plans; out of scope except where it affects entry-tier eligibility (no
  eligible AI-inclusive plan is stock-only, so this does not change the selection).

  REBRAND: the frame's vendor_home_url (https://www.freepik.com) 301-redirects in full
  (root and /pricing) to https://www.magnific.com; banner reads "Freepik is now
  Magnific", page title "Magnific (formerly Freepik) | The AI Creative Platform"; ToS
  confirms the same legal entity, Freepik Company, S.L. Per sampling-rules.md 10.4
  (rebrand keeps product_id, both names recorded) and this task's instruction to
  locate the official domain when the frame URL is dead/wrong: all coded values are
  sourced from magnific.com. See register_events.

  ENTRY TIER (sampling-rules.md 7.2): Individual plan type, Annual default display
  state. Eligible candidates by annual-equivalent cost: Premium TRY450/mo x12=
  TRY5,400/yr (SELECTED - cheapest); Premium+ TRY1,125/mo x12=TRY13,500/yr; Pro
