  free_plan_cap_value:
    value: "20 images per day | 10 downloads per day"
    source: https://www.magnific.com/ai/docs/plans-and-pricing
    evidence: >
      Only the two quantified rates recorded per codebook section 5.1; the unquantified
      model-access restriction is excluded from this field.
  free_plan_watermark:
    value: unknown
    source: https://www.magnific.com/ai/docs/plans-and-pricing | https://www.magnific.com/ai/image-generator | https://www.magnific.com/legal/terms-of-use
    evidence: >
      No document read states whether free-tier or paid-tier AI-generated images carry
      a visible watermark or vendor branding. Free plan docs state "Attribution
      required on all content" - a credit/attribution requirement, a distinct construct
      from a pixel watermark on the output; not treated as equivalent. A watermark-free
      claim found in search discovery applies only to the separate Mockup Generator
      tool, out of scope for this product, so not used to code this variable.
  free_plan_duration:
    value: perpetual
    source: https://www.magnific.com/ai/docs/plans-and-pricing
    evidence: >
      "Free plan" is documented as a standing account type, not "free for N days"; no
