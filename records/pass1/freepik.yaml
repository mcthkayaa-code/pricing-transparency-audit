    value: "no"
    source: https://www.magnific.com/pricing | https://www.magnific.com/legal/terms-of-use | https://www.magnific.com/ai/docs/plans-and-pricing
    evidence: >
      Premium's advertised feature set (models, Spaces, editing tools, upscalers,
      credits, stock library) carries no separate required charge in the pricing page,
