  trial_exists:
    value: "no"
    source: https://www.magnific.com/pricing | https://www.magnific.com/ai/docs/plans-and-pricing | https://www.magnific.com/legal/terms-of-use
    evidence: >
      No trial construct found: pricing page CTAs read "Get Premium/Premium+/Pro" (not
