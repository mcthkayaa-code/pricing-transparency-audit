variables:
  headline_price_usd:
    value: 14.50
    source: https://web.archive.org/web/20260807070007/https://www.magnific.com/pricing
    evidence: >
      CHANGED under D-007 re-check (2026-08-10) -- see coder_note and
      freepik-sources/d007-currency-recheck-2026-08-10.txt for the full
      arm-by-arm log. Live re-read 2026-08-10 confirms the Premium card still
      shows "TRY 675" struck through / "TRY 450 /month" bold on this network,
      and Arm 1 of the amended currency rule again found no selector, no
      working currency URL parameter, and no explicit currency-offering
      statement in the terms of use or the subscriptions-and-refunds docs
      (only indirect EUR-denominated liability figures). Arm 2 -- this
      record's OWN previously-cited archive_url,
      https://web.archive.org/web/20260807070007/https://www.magnific.com/pricing
      (a Save-Page-Now capture, fetched from archive.org's own US-based
      infrastructure independent of the submitter's network; archived
      successfully but never actually opened by the original coder) -- was
      read in full for this re-check (808,514-byte raw fetch after the
      browser tool hung twice on this URL; 9,047 characters of real page
      text once tags/scripts are stripped, not a pre-hydration shell) and
      shows: "Premium For individuals exploring AI tools and stock content
      $20 $14.50 /month Billed annually Includes 240K credits/year..." --
      the identical tier name, description, "Billed annually" state, and
      240K-credits/year allowance already coded here, with the same
      struck-through/active price pattern (TRY 675/450) now in USD
      ($20/$14.50). Confirmed in a second representation: raw HTML shows
      "$14" and ".50" as two adjacent but unambiguous spans (the cents span
      already carries the decimal point, unlike the dangerous
      superscript-split pattern). Cross-tier check: Premium+ ($45/$33.75,
      600K credits/yr) and Pro ($280/$210) both also appear, corroborating
      across three tiers. Per the amended rule, a USD figure a US-crawled
      reader is served is coded as the published price; TRY is logged as
      the locally-served display_variant (see register_events, new entry).
      Verbatim USD figure: $14.50/month (Premium, billed annually).
  headline_billing_basis:
    value: per_month_billed_annually
    source: https://www.magnific.com/pricing
    evidence: "Premium card: 'TRY 450 /month' with 'billed annually' printed directly beneath."
  first_charge_amount_usd:
    value: 174.00
    source: https://web.archive.org/web/20260807070007/https://www.magnific.com/pricing
    evidence: >
      CHANGED under D-007 re-check (2026-08-10) -- same basis as
      headline_price_usd (see that field and freepik-sources/d007-currency
      -recheck-2026-08-10.txt). Default state is annual ("Billed annually").
      No explicit "charged once for twelve months" sentence located, but
      this is the standard meaning of "billed annually" as the vendor uses
      it throughout (unchanged reasoning, currency-independent). With the
      amended rule now coding the USD figure Arm 2 confirmed ($14.50/mo,
      see headline_price_usd): $14.50 x 12 = $174.00/yr computed first
      charge. Arithmetic in computation_assumptions.
