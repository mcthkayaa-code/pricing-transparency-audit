      Confirmed identical on two independent fresh loads of the page.

  free_plan_exists:
    value: "yes"
    source: https://www.magnific.com/ai/docs/plans-and-pricing
    evidence: >
      Docs page names a "Free plan": "Up to 20 AI image generations per day with the
