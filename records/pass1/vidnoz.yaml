coder_note: |
  Entry-tier selection (sampling-rules 7.2): eligible paid candidates were Starter
  ($19.99/mo x12 = $239.88/yr-equiv) and Business ($56.99/mo x12 = $683.88/yr-equiv);
  Starter is lower and is entry_tier_name. Business is the only losing eligible
  candidate. Free ($0) is not a paid tier. Enterprise is sales-gated ("Let's Talk" /
  "Book a Demo"), ineligible under sampling-rules 7.2 rule 2 (no sales contact).

  Credit-slider note: each paid card also carries an interactive credit-quantity
  slider (Starter ticks 300/450/900/1800; Business 900/1800/2700) that changes the
  displayed price when dragged. Per protocol 6.8's anti-cherry-picking principle
  (applied here to the slider by the same logic as the billing toggle), it was
  read but NOT interacted with for pricing purposes -- the DEFAULT handle position
  (450 for Starter, 900 for Business, confirmed via DOM class "m-active") is what
  was coded. A cheaper Starter price likely exists at the 300-credit slider
  position but was deliberately not read, so it is not reported as a losing
  entry-tier candidate figure (unread, not merely lower).

  annual_condition_disclosure judgment call: coded adjacent because the Yearly/
  25%-Off toggle sits directly above and governs the price cards (codebook's
  "label of the toggle attached to it" clause). A stricter reader could instead
  call this same_page_secondary, since "annually"/"billed yearly" is not printed
  inside the Starter card's own price block -- only in the toggle label ("Yearly")
  and in a separate sticky compare-table widget lower on the page. Flagging for
  adjudicator attention. Separately, DOM contains a hidden (style="display:none")
  "25% OFF / First Month" badge next to "Starter" under the Yearly toggle; not
  visible to a reader at 1280x720 and not corroborated by any "then $X" / "after
  first month" / "renew" language found anywhere on the page (confirmed via
  full-body keyword search under both toggle states) -- treated as inert/unused
  markup, not coded as a value.

  A-012 considered and NOT applied: no document states a specific, distinctly
  time-boxed low intro window (e.g. "$X for N days") before a rate change; the
  discounts found (25% Off for annual vs monthly billing; "50% OFF" on the two
  add-ons) read as ordinary billing-frequency/sale discounts, structurally
  parallel to the plan pricing's own confirmed monthly-vs-annual mechanism (see
  next paragraph), not a confirmed first-term-only promo that steps up later.

  Custom-avatar add-on question: "Avatar Pro" ("Create your own custom AI Avatar
  to serve as your digital twin") is a PAID ADD-ON at every tier including
  Business -- never bundled free into any paid plan. Priced $299/yr (promo, was
  $598/yr, "50% OFF", billed yearly); the non-promotional/list renewal rate for
  this add-on is NOT published anywhere in the documents read -- that gap is
  itself the finding. Coded mandatory_addon_present=no because Starter/Business
  are fully usable (with their large included stock-avatar libraries) without
  ever buying Avatar Pro. Voice Clone is a second, separately optional paid
  add-on ($9.99/mo promo, was $19.99/mo, "50% OFF").

  Promo-vs-renewal gap on the base plans: verified by toggling Monthly/Yearly
  (permitted post-default-state-recording) that $26.99/mo (Starter) and $74.99/mo
  (Business) are the plain monthly-billing list prices, and $19.99/mo / $56.99/mo
  are the annual-billed monthly-equivalent (a ~25% discount for prepaying a
  year) -- a normal, disclosed mechanism, not a hidden renewal jump. No document
  anywhere states the year-2+ renewal rate differs from the year-1 rate for
  annual plans; taken at face value (whatever "billed yearly" charges this year
  is assumed to recur), since no evidence suggests otherwise.

  cost_per_output_computable: the credit table gives THREE different per-second
  avatar/video rates -- "Video Generation" 0.5 credits/s (used for the
  computation, as the generic/base rate) vs "Expressive Avatar" and "Product
  Avatar" both 2 credits/s (4x). All three are named categories with exact
  published rates, not a vague range, so this was coded yes rather than partial;
  but the choice of which row is "the" principal output is a judgment call an
  adjudicator may revisit.

  ai-terms-of-service.html vs terms.html: the site publishes two ToS-class
  documents. terms.html is dated "Last Update: July 2026", uses "Vidnoz"
  branding, and covers the general web Services. ai-terms-of-service.html is
  copyright-dated 2024, uses "Vidnoz AI" branding (matching this product's own
  name), and is written around Apple ID / iOS App Store in-app purchases
  specifically ("every Apple ID can make a purchase only once", refund
  instructions via iTunes). Both were treated as co-equal "terms of service"
  class sources per protocol 6.2's literal wording, since no cross-reference in
  either document states that one supersedes or is scoped narrower than the
  other for a web-pricing-page buyer -- this drives the conflicting codings in
  conflict_note.

  Excluded from this record: https://www.vidnoz.com/get-started/how-does-vidnoz-
  ai-studio-billing-work.html is a billing help article about "Vidnoz AI Studio",
  a different product in the vendor's portfolio (image/video enhancer, per its
  sidebar links), not our target avatar/video-generation product. A third-party
  web-search summary of it described credits that "accumulate" and cited
  200/1,500 monthly/yearly credit figures inconsistent with Vidnoz AI's actual
  450/900 credits -- confirming the different-product read and validating why it
  was NOT used to code credit_rollover_policy. A second help article,
  https://www.vidnoz.com/settings/manage-subscriptions.html, was opened to look
  for corroborating self-serve-cancellation evidence but its main article body
  did not render through the extraction tools used within budget; not cited as a
  source, not used to code any value.

  renewal_notice_commitment: the only stated notice commitment (>=7 days) is
  scoped to PRICE INCREASES specifically, not a general pre-every-renewal
  reminder; flagged so the coded value is not read as broader than the documents
  support.

  Archival: web.archive.org returned no response (HTTP 000) via both a WebFetch
  attempt and a curl attempt across two different source URLs on 2026-08-13,
  consistent with deviation D-012. All four sources coded local_copy_only; dated
  verbatim captures saved under vidnoz-sources/ (three raw-HTML curls verified by
  grep to contain the exact quoted operative phrases used as evidence above, one
  rendered-DOM text capture for the JS-driven pricing.html, per D-005).

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Three-way conflict on refund/cancellation (domain 10), all rank-1 contractual sources under protocol 6.2 ('terms of service OR the dedicated policy page'): (1) refundpolicy.html: '7-day full Money Back Guarantee for 1-year subscription... Refund requests for a 1-month subscription will not be accepted' and, to cancel, 'please email us at support@vidnoz.com'. (2) terms.html: 'Payments are non-refundable, except where required by law' and 'You can cancel your paid subscription at any time in your Vidnoz account' (self-serve). (3) ai-terms-of-service.html: 'all charges for purchases are non-refundable, and there are no refunds or credits for partially used periods' and cancel 'via the payment settings option under your profile' (self-serve, agrees with terms.html against refundpolicy.html on method, but disagrees with BOTH other documents on whether/how much is refundable). Coded refund_policy_exists=conflicting, cancellation_self_serve=conflicting, refund_policy_location=conflicting; refund_window_days=7 taken from refundpolicy.html as the only document publishing a specific number, restricted to annual billing (our default display state)."
