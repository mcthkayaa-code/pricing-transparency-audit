default_display_state: >
  Archived pricing page (capture 20250625003728, i.e. 2025-06-25): USD, no currency
  selector engaged; billing toggle pre-selected on "Annually" (radio input id="annually"
  carries checked="" in the raw markup, id="monthly" does not); page served four cards
  -- Free $0, Creator $31.20/mo ("USD $374.40 billed annually"), Unlimited $49.00/mo
  struck through from $99 ("USD $588.00 billed annually", badged "Limited time deal!"),
  Enterprise "Custom pricing / Contact Sales". No region/geo selector observed. This is
  the archived DOCUMENT's display state at its own 2025-06-25 capture time, not a live
