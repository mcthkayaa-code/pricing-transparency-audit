coder_note: |
  DISCONTINUED PRODUCT (sampling-rules 6.2 / protocol discontinued-product provisions).
  No live site exists at collection_date 2026-08-13: play.ht has no A record and its
  nameservers now point at Facebook infrastructure (background from prior verification,
  used for CONTEXT only, not cited as any coded value's source). All values below are
  coded from web.archive.org captures of the vendor's own pages, taken while the product
  was still operating. Access date (today, 2026-08-13) and document date (the capture
  timestamp) are different and both matter here:
    - pricing: capture 20250625003728 = document dated 2025-06-25. This is the LATEST
      capture that still shows a normally operating pricing page with real figures.
      Checked (CDX, all statuses): play.ht/pricing/ starts 307-redirecting to the
      homepage from a 2025-09-27 capture onward, continuing through captures dated
      2025-12-04 and 2026-01-09, i.e. the dedicated pricing page was gone well before
      the Dec-2025 shutdown. The Dec-2025 homepage captures checked (2025-12-31) show no
      "Pricing" nav link and no dollar figures anywhere in the rendered HTML, so no later
      capture of an operating priced offer exists to prefer over 2025-06-25.
    - terms: capture 20251225125707 = document dated 2025-12-25, the latest available and
      only days before the reported shutdown.
    - help-center cancel-subscription article: capture 20250515084025 = 2025-05-15.
    - help-center billing category: capture 20250325092238 = 2025-03-25.
  All four fetched via web.archive.org's unmodified-original ("id_") endpoint, one
  attempt each (no retries needed, nothing failed); no new /save/ requests were made
  (D-012) -- only existing captures were read. Two representations cross-checked for the
  headline price per the two-representation rule: the visible rendered text ("$31.20",
  "/month", "USD $374.40 billed annually") against the raw HTML price-card markup
  (identical figures, no superscript/split-digit layout), plus the annual/monthly radio
  button's `checked` attribute in the raw markup confirming the default toggle state
  independent of the rendered text.

  ENTRY TIER (sampling-rules 7.2): Creator selected, lowest annual-equivalent single-seat
  cost among eligible candidates at $374.40/yr ($31.20/mo billed annually, the page's
  default annual-preselected state). Losing candidate: Unlimited, $588.00/yr at its own
  default-displayed price ($49.00/mo, badged "Limited time deal!" struck through from a
  $99.00/mo anchor -- the anchor price was not used for the comparison per the "read the
  page as it loads" rule). Free ($0) is not a paid-tier candidate. Enterprise excluded
  under eligibility rule 2 (sales-gated, "Contact Sales", no published price).

  JUDGMENT CALLS, flagged rather than hidden:
  1. free_plan_watermark / watermark_removal_tier: PlayHT's documents never use the word
     "watermark" (audio product). The feature-grid row "Attribution-Free Use" (crossed
     for Free, checked from Creator up) is read as this product's equivalent of the
     codebook's own "watermark-free exports" worked example -- same check/cross-by-tier
     pattern, different label because the output is audio rather than video/image.
  2. cost_per_output_unit = other ("per_character"): PlayHT allocates and bills directly
     in input characters, not audio-minutes; none of the enumerated units fits and no
     characters-to-audio-minutes rate is published anywhere read, so no conversion to
     per_audio_minute was attempted. Expressed per-1,000-characters in
     computation_assumptions for readability ($0.1248/1,000 chars).
  3. credit_system_present = no: the words "credit"/"token"/"point"/"coin" never appear
     in any document read except "credit card" as a payment instrument. Characters are a
     directly-stated allocation unit, not an abstracted intermediate currency.
  4. trial_exists = unknown rather than no: the ONLY trial-related text found anywhere is
     the pricing-page FAQ line "Sign up for the free trial and give it a try!", with no
     supporting length/card/conversion terms in the ToS (read in full) or either help
     article. Genuinely ambiguous between "a real time-limited trial" and loose marketing
     language for the perpetual Free Plan, so left unknown rather than resolved by
     inference, per protocol 6.3's bar on inference.
  5. refund_window_days = 1 (24 hours, ToS 5.4.1) is the GENERALLY applicable condition.
     ToS 5.4.3 separately grants UK/EU users an unconditional 14-day cooling-off refund
     (pro-rata for actual usage) -- a jurisdiction-specific enhancement on top of the
     general policy, not a conflicting value, so not coded as `conflicting`; recorded
     here rather than invented into the single-value field.
  6. Currency: no D-003/D-007 currency check needed. ToS Section 4: "Unless specifically
     stated otherwise, all fees are in U.S. Dollars" -- vendor's own explicit USD
     statement; pricing page also shows $ figures directly. headline_price_usd and
     first_charge_amount_usd coded as ordinary USD money values, not non_usd.
  7. Front-end marketing on the 2025-06-25 pricing capture is branded "PlayAI"
     (<title>PlayAI Pricing...</title>, "PlayAI" throughout body copy), while the
     footer copyright ("(c) 2025 PlayHT") and the help-center ("Play.ht Helpdesk") still
     use "PlayHT" -- consistent with the frame's product_id/product_name. Noted for a
     future reader who sees "PlayAI" in the archived screenshots and wonders why it does
     not match this record's product_name.
  8. mandatory_addon_present coded from the pricing page + ToS Sections 4 and 6 (read in
     full); a full crawl of docs.play.ht/API documentation was not performed, so a
     mandatory add-on documented ONLY there (if any) would not have been found. Given
     this is a discontinued product coded from archives, no further pages were pulled
     for a single supporting variable rather than stretch the search.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "commercial_use_lowest_tier: ToS 6.1.1 (\"PlayAI grants you, solely for your personal or commercial use...\") grants commercial use without a tier qualifier -- https://web.archive.org/web/20251225125707/https://play.ht/terms/ -- while the pricing page lists \"Commercial and re-sell rights\" as an Enterprise-only checked feature -- https://web.archive.org/web/20250625003728/https://play.ht/pricing/. Coded from the ToS per protocol 6.2 (contractual variable, ToS ranks first); the pricing-grid line may denote a narrower resale/white-label right rather than ordinary commercial use of outputs, but no document disambiguates this."
