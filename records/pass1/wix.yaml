coder_note: |
  Domain 1 (A1/A3) coded. Entry tier = Light ($17/mo default display, $204.00/yr annual-
  equivalent). Losing eligible candidates (all generally available, no sales gate, standing
  plans): Core $29/mo = $348.00/yr; Business $39/mo = $468.00/yr; Business Elite $159/mo =
  $1908.00/yr. Free ($0) is not a paid tier and is excluded from entry-tier selection per
  sampling-rules 7.2/7.3; it is scored separately under free_plan_exists.
  Domains 2-3 coded. free_plan_cap_value conflict: support.wix.com/en/article/about-storage-
  and-bandwidth ("up to 1GB bandwidth") vs support.wix.com/en/article/requesting-a-refund-for-
  a-premium-plan ("up to 500MB bandwidth"); storage (500MB) and Wix's official blog (wix.com/
  blog/is-wix-free, "up to 500 MB of storage and up to 1 GB bandwidth") both agree with the
  1GB-bandwidth reading, but the blog is a lower-authority class (vendor blog, not docs/help
  center) so it does not resolve a conflict between two equal-authority help-center pages;
  full figures preserved in conflict_note per free_plan_cap_value's decision rule.
  Domain 4 coded. No paid time-limited intro period exists (standard upfront billing plus a
  14-day money-back guarantee, not a discounted trial period) -- A-012 does not apply here.
  Domains 5-8 coded. Wix runs TWO parallel AI credit systems, both discovered mid-collection
  and both read in full: (1) "AI credits" for Smart Chat / AI Custom Agent / AI Marketing Agent
  / Wixel, tier-scaled, monthly renewal (free plan: 30/day up to 120/month); (2) Wix Vibe daily
  chat-request credits gating the core AI site-building chat itself, flat 6/day free vs 50/day
  on any Premium plan (not tier-scaled), also non-rolling. Neither system publishes a fixed
  credit-to-output conversion; both explicitly disclaim their action-count estimates as
  non-binding. cost_per_output_unit/computable are scored on the flat per-site plan price
  (per_seat_month), not on either credit system, because the pricing page frames the product
  as unmetered site hosting/building and the core site-generation chat (Aria) is stated
  elsewhere to be free and credit-free ("Chatting with Aria (Wix's AI agent) is free and does
  not use AI credits" -- About AI Credits doc), leaving the flat plan price as the only
  principal-output cost basis with a published figure.
  Domains 9-11 coded. TERMS OF USE ACCESS FAILURE (affects auto_renewal_disclosure_location,
  commercial_use_lowest_tier, output_ownership_statement, and unquantified_limit_clause below):
  https://www.wix.com/about/terms-of-use was fetched twice (raw HTTP fetch, and a full browser
  JS render with a manual language-selector switch back to English after the page's own
  geo-redirect sent it to tr.wix.com) and inspected via DOM heading enumeration
  (document.querySelectorAll('h1,h2,h3,h4')). Both attempts show only "1. Introduction" /
  "1.1. Our Purpose" / "1.2. Legal Agreement" followed immediately by an Israel-residents
  payment addendum -- Sections 2 through 19 (the numbered sections that section 1's own banner
  text references, including whatever governs IP/content ownership, commercial terms, and
  usage/fair-use conditions) are absent from the document as served, not merely hidden by CSS
  (outerHTML was 772KB with only those two headings present; no iframe or lazy-load endpoint
  carried the missing body). Per this study's own rule, an official source that could not be
  read is not evidence; it is logged here and in conflict_note rather than guessed from a
  third-party paraphrase (one WebSearch summary offered a "Section 2.1" ownership quote that
  could not be verified against the live DOM and was DISCARDED, not coded, per the fabrication
  warning). support.wix.com/en/article/wix-account-and-site-ownership-disputes was checked as
  a possible substitute and found to cover a different construct (account login/access
  control, not content/IP ownership).
  Domain 12 coded.

  Two-representation price check (binding rule): headline/tier figures (159, 39, 29, 17, 0)
  were confirmed in TWO representations -- the rendered page's accessible text (get_page_text:
  "$159/mo", "$39/mo", "$29/mo", "$17/mo", "$0") and the raw server-rendered HTML's rich-text
  spans (grep on wix_plans_raw.html: standalone "159", "39", "29", "17", "0" nodes, no
  superscript-cents split). Magnitudes sanity-checked against tier names and annual-equivalent
  math; no reading error found.

  Currency: USD figures ($) were served directly on every read (rendered browser AND plain
  curl with no Accept-Language header), despite collection running from a Turkey-based network
  location that DID geo-redirect a different page (the Terms of Use) to a Turkish-language
  subdomain. Since a USD figure was served directly, headline_price_usd is coded from it per
  codebook rule 3 -- the multi-arm non_usd check was not needed.

  Frame check: no correction needed to the frame row (product_id/name/category/status/
  paid_submission all matched what the live site and docs state).

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: >
  free_plan_cap_value / bandwidth: support.wix.com/en/article/about-storage-and-bandwidth
  states "Free Wix sites come with up to 500MB of storage and up to 1GB bandwidth."
  support.wix.com/en/article/requesting-a-refund-for-a-premium-plan states "The free site
  version includes up to 500MB of storage, up to 500MB bandwidth and displays Wix ads." Both
  are official Wix help-center articles (equal authority); storage (500MB) agrees across both,
  bandwidth does not (1GB vs 500MB). Not resolved by the source hierarchy -- coded conflicting
  per codebook decision tree 2.1 step 3.
  Unreadable official source: https://www.wix.com/about/terms-of-use is the vendor's Terms of
  Use and is first-rank authority for contractual variables (commercial use, output ownership,
  auto-renewal, unquantified-limit clauses), but its substantive body (Sections 2-19) did not
  render on access (2026-08-13) despite a raw fetch and a full browser JS render -- see
  coder_note for the verification steps. Per this study's rule, a source that could not be read
  is not evidence: commercial_use_lowest_tier, output_ownership_statement, and
  unquantified_limit_clause are coded unknown rather than inferred from it, and
  auto_renewal_disclosure_location is coded from the next-ranked accessible source (help
  center) instead of confirming or ruling out "terms".
