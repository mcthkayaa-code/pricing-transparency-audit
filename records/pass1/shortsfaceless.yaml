coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md 7.2): Two standing, generally-available,
  no-sales-contact, single-seat candidates found on the default pricing page.
  - Essential: $19/mo x 12 = $228.00 annual-equivalent -> SELECTED (lowest).
  - Professional: $29/mo x 12 = $348.00 annual-equivalent, 60 videos/mo vs 30, otherwise
    identical feature list -> LOST (higher annual-equivalent).
  - $9-for-first-month offer at /deal: EXCLUDED from candidacy under 7.2 eligibility rule 3
    ("a standing plan rather than a limited-time promotional plan") -- the page itself calls
    it "special deal" / "50% OFF FIRST MONTH" / "Get this special deal for the first month."
    Not used for headline_price_usd or first_charge_amount_usd.

  A-012: shortsfaceless sells a paid, non-zero, time-limited intro price ($9 for the first
  month against a standard $19/mo) at shortsfaceless.com/deal. No document anywhere states
  what happens after the first month (no stated auto-conversion to $19/mo, no stated
  one-time/non-recurring framing). Flagged per the open adjudication question; trial_exists
  coded "no" per the frozen codebook's free-trial-only definition (this offer is paid, not
  free), consistent with the rule that trial_card_required's absence-is-unknown clause bars
  inferring anything from the existence of a charge.

  CREDIT_SYSTEM_PRESENT JUDGMENT CALL: the pricing page states the entry-tier allowance
  directly in output units ("Generate up to 30 videos", never using the word "credit"
  anywhere on that page), which reads like codebook rule 1 ("not a credit system"). But the
  ToS's Services Description independently and explicitly defines the underlying mechanism
  as credits ("users receive a number of credits per month, where each credit allows for the
  generation of one video") -- codebook rule 2's intermediate-currency case, and textually
  identical in structure to the credit_unit_defined worked example (Vendor J). Coded
  credit_system_present=yes / credit_unit_defined=yes / credit_to_output_rate_published=yes
  from the ToS, all at a 1:1 conversion ratio. This is not a conflict between the two pages
  (the pricing page never denies a credit system, it simply doesn't use the term) so no
  conflicting value or conflict_note entry was coded; treated as the higher-detail ToS
  elaborating on what the pricing page presents in simplified form.

  COST_PER_OUTPUT_UNIT: none of the codebook's enumerated units (per_video_minute, per_image,
  per_1k_words, per_audio_minute, per_page, per_headshot, per_document, per_presentation,
  per_seat_month, per_api_call) fits a discrete short-form video billed by count rather than
  duration. Coded "other"; unit is "per video" (one discrete AI-generated short video, no
  stated duration/resolution basis for the credit charge).

  OUTPUT_OWNERSHIP_STATEMENT nuance: ToS "Ownership and Rights" clause covers INPUT content
  ownership plus the processing license granted to Shorts Faceless; it does not separately
  address ownership of the generated OUTPUT video. Only the homepage FAQ speaks to output
  ownership directly ("Once you generate a video, you own it"). Read as silence-on-one-side
  rather than a genuine two-source disagreement, so coded user_owns from the FAQ rather than
  conflicting; conflict_note left empty since the ToS does not state an incompatible position,
  it simply does not reach the question.

  REFUND evidence is thin and single-sourced: the only refund statement in any official
  document is the four-word "100% money-back guarantee." on the /deal promotional landing
  page, directly under that page's own Buy Now button. ToS, homepage, and Privacy Policy are
  completely silent on refunds (zero keyword hits, full-text checked). Coded
  refund_policy_exists=yes and refund_conditions=unconditional from that line since it is a
  determinate (if terse) statement with no attached condition, but its scope -- whether it
  covers the standard $19/$29 subscriptions or only the discounted first-month purchase -- is
  not stated. refund_policy_location coded pricing_page as the closest available value in the
  codebook's list; the true location is the /deal offer page specifically, not the standing
  #pricing section on the homepage. An adjudicator may reasonably prefer unknown on
  refund_conditions and/or a different refund_policy_location reading given how thin this
  evidence is; flagged here for that review.

  WATERMARK_REMOVAL_TIER: "No watermark" is listed as an included feature on both Essential
  and Professional, i.e. on 100% of the published paid offering, with no free tier to compare
  against. Coded no_watermark (no tier, among those that exist, ever applies a watermark)
  rather than lowest_paid.

  SECOND-REPRESENTATION / MAGNITUDE CHECK (binding rule): $19 and $29 were confirmed as plain
  leaf-node text via JS DOM query (document.querySelectorAll leaf elements matching /\$\s*\d/),
  ruling out a superscript-cents split misread. Magnitude sanity check: entry tier $19/mo is
  in-range for the category, first charge ($19.00) equals headline with basis ratio 1x (no
  annual-multiplication error possible since no annual option exists). $9 first-month figure
  on /deal cross-checked against the struck-through "$19" shown on the same page, confirming
  both prices refer to the same Essential tier.

  CURRENCY CHECK (D-003): prices render as plain "$" figures; the /deal page explicitly labels
  the amount "$9 / USD" (separate text node). This is the vendor's own currency disclosure
  (protocol currency-check arm 1) confirming USD is what a reader in Turkey was served, not a
  localization artifact requiring non_usd or unknown. No currency selector or country picker
  exists on the site.

  ARCHIVAL: web.archive.org/save succeeded for /tos and /privacy-policy (static text pages)
  but both attempts on the homepage and both attempts on /deal returned Wayback snapshots that
  throw a client-side hydration exception and contain no price/offer text in the captured DOM
  (verified programmatically, not just visually) -- consistent with deviation D-005's warning
  that JS-rendered pricing pages commonly archive empty. Local copies with headers (URL, date,
  method) saved under shortsfaceless-sources/ for both per protocol 6.4; archive_status coded
  local_copy_only for those two sources.

  No other product's record was opened at any point, before or during this coding pass, for
  any reason (values, formatting, or example). No file under site/content/reviews/ and no
  aitoolspolice.com URL was opened. Only the files listed as permitted in the agent
  instructions were read: this agent definition, protocol-v1.md, codebook-v1.md,
  sampling-rules.md, record-template.yaml, the frame CSV, and this product's own sources.

  blindness: no other record, no review page, no pass-2 material was opened.
