  D-009 re-read 2026-08-10: not arithmetic-flagged (3.33 x 12 = 39.96, within tolerance of 39.99).
  This page turned out to need the two-representation rule more than most: a first live-DOM pass
  today (javascript_tool, origin confirmed https://fotor.com) found NO leaf node matching the
  price at all -- Fotor Pro's current price is rendered by a "ScrollNumber" odometer/slot-counter
  React component (class ScrollNumber_digitList__3TySW) whose DOM contains all ten digits 0-9 for
  EVERY digit position as sibling spans, with CSS transform:translateY() clipping all but one into
  view. Plain text extraction (innerText/body text) over this component returns the nonsense
  string "0123456789.0123456789 0123456789 / Month" -- exactly the class of failure the
  two-representation rule exists to catch, just a different technical mechanism (odometer widget)
  than the superscript-cents bug that prompted the rule. Representation 1 (CSS transform decode,
  today): read each digitList's inline `style="transform: translateY(-N%)"` and computed the
  visible digit as `digits[round(-N/10)]` (10 stacked digit items, each 10% of the list's own
  height) -- decoded Fotor Basic=0, Fotor Pro=3.33, Fotor Pro+=5.24, Fotor Max=11.19, in that DOM
  order, confirming both the figure and the plan-grid row mapping (Fotor Pro is the second card,
  the cheapest paid one). Representation 2 (plain text, reliable here because this specific string
  is NOT part of the animated widget): the "billed yearly" captions extracted cleanly via
  innerText -- "US$39.99 billed yearly." immediately follows the Fotor Pro digit block, "US$62.99
  billed yearly." follows Pro+, "US$134.32 billed yearly." follows Max. Both representations agree
  with each other (3.33 x 12 = 39.96 =~ 39.99) and with the coded values. The Yearly toggle carries
  class "...PricingToggle_active__ih9zs" (vs. Monthly's plain class), confirming the annual default
  from the DOM's own active-state class, matching the coded default_display_state. Today's figures
  match the original 2026-08-07 collection exactly -- no final-day change. NO CORRECTION. All four
  target variables CONFIRMED, values unchanged. Evidence saved to fotor-sources/d009-reread-2026-
  08-10.md, including the raw decode script output.

