coder_note: |
  All 37 coded variables complete.

  Acquisition relationship (per assignment note): Leonardo AI was acquired by Canva (2024).
  As of this collection (2026-08-09), Leonardo continues to operate its own official
  documents under its own entity, Leonardo Interactive Pty Ltd (ACN 662 209 485) -- the
  Terms of Service (last updated 19 Jan 2026) and the dedicated Refund Policy are both
  branded to Leonardo Interactive Pty Ltd, not Canva Pty Ltd. No Canva-operated terms or
  billing page was found governing the Solo/Essential consumer plan coded here; the only
  Canva touchpoint found is a cross-sell note on the pricing page ("Included with Canva
  Business") granting Canva Business/Enterprise subscribers free Essential-tier access,
  which does not change which document governs the Essential tier itself. Coded from
  Leonardo's own ToS/refund-policy/help-center throughout, per the assignment instruction
  to use whichever official document actually governs the product.

  Entry-tier selection (sampling-rules.md 7.2), default Pay-Monthly display state,
  annual-equivalent cost: Essential $12/mo x12 = $144.00/yr (WINNER, lowest) | Premium
  $30/mo x12 = $360.00/yr | Ultimate $60/mo x12 = $720.00/yr | Team Starter -- seat-stepper
  input has min="3" (verified via DOM, Number-of-seats field), i.e. Team plans sell a
  3-seat MINIMUM BLOCK, not a free per-seat purchase, so the minimum block's total is
  annualized per sampling-rules.md 7.2 rule 3: $72/mo (3 seats) x12 = $864.00/yr | Team
  Growth, same 3-seat minimum: $144/mo x12 = $1,728.00/yr. Excluded from comparison: FREE
  ($0, not a paid tier, scored under domain 3);
  Team "Custom" and "API Custom" (sales-gated, no published price); API Pay-As-You-Go
  (usage-based only, starts with a one-time non-expiring $5 credit, no recurring
  seat/annual-equivalent subscription figure to compare against the seat-priced plans --
  excluded as non-comparable rather than treated as a losing numeric candidate).

  Judgment call, flagged for reviewer: "Quality settings: Basic" (free plan) / "Quality
  settings: Enhanced" (Essential/Premium/Ultimate) is treated as an unquantified limit
  (affecting free_plan_cap_documented = some_quantified and usage_cap_quantified =
  some_quantified, rather than all_quantified/all_caps_quantified), on the analogy that
  codebook-v1.md section 5.1's own "does not qualify" example "basic storage" is
  structurally identical (a quality/capacity label with no number+dimension). No official
  document was found that quantifies what "Basic" vs "Enhanced" quality concretely means
  (resolution, model access, etc.). If a reviewer judges "Quality settings" to be a
  feature-access label rather than a limit (like the excluded "Creations access:
  Public/Private" toggle), both variables would instead read all_quantified /
  all_caps_quantified -- this is the only variable in this record I would flag as
  genuinely contestable.

  cost_per_output_unit coded as per_image on the frame's fixed category ("AI image
  generator") and on the Token Usage rate table's base unit ("Default Image"); the
  vendor's own pricing page frames output more broadly across image/video/design/motion
  and does not itself rank one as principal, so this is a category-driven tie-break, not a
  vendor statement, and is noted here rather than in the variable's evidence field.

  blindness: no other record, no review page, no pass-2 material was opened.

  D-009 re-read 2026-08-10: re-opened https://leonardo.ai/pricing live and confirmed
  entry_tier_name (Essential), headline_price_usd ($12), headline_billing_basis
  (per_month_billed_monthly) and first_charge_amount_usd ($12) in a SECOND representation
  independent of the original innerText transcript: a card-by-card structural DOM query on
  .o-pricing-cards__card containers, reading each card's own textContent directly. Confirmed the
  "Pay Monthly" toggle button carries the active style class before interaction. Confirmed every
  losing-candidate figure the original coder_note lists (Premium $30, Ultimate $60, Team Starter
  $72, Team Growth $144) still matches. A structurally separate feature-comparison table further
  down the same page independently names the same four tier columns (FREE/ESSENTIAL/PREMIUM/
  ULTIMATE), a second confirmation of the tier-name set. Confirmed 0 <sup>/<sub> elements exist
  anywhere on the page. Evidence saved to
  leonardo-ai-sources/d009-second-representation-2026-08-10.txt. No correction; all four scoped
  values confirmed as coded.
