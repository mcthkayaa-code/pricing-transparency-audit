48%, #00C4CC 99.96%)"}},"J":{"A":{"A?":"D","A":"Learn more","E":"C","Bk":"https://web.archive.org/web/20260805125923/https://www.canva.com/ai-pass/"}},"N":[{"A":"Add-on","B":{"A":"7"}}]}],"D":1}},{"A?":"E","DL":"B","A":{"A":"Frequently Asked Questions","B":[{"A":"Can I use Canva for free?","B":"\x3cp>Canva Free is available to anyone. If you want to unlock more premium tools, Canva Pro is perfect for solo creators who want to design like a pro, with premium templates, and AI-powered features that make it easy to create standout content.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>For individuals, marketers, and growing teams ready to scale their brand, Canva Business builds on Pro with even more powerful tools - smarter ad performance insights, enhanced brand management, more AI access, and more. Everything is designed to help you stay on brand, collaborate seamlessly, and grow your business with ease.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>Want to see for yourself? You can start a free trial of Canva Pro or Canva Business.\x3c/p>","C":{"B":false}},{"A":"How does AI usage work across Canva plans?","B":"\x3cp>Canva\'s AI tools work in two ways, depending on how they\'re included in your plan.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>\x3cstrong>AI Design tools:\x3c/strong> Features like Canva AI (text), Translate, Magic Write, and on-device ML tools in Affinity are included based on your plan and don\'t count toward your monthly AI allowance. Fair use limits may apply.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>\x3cstrong>Standard, Premium, and Ultra AI tools:\x3c/strong> These draw from a shared monthly allowance that varies by plan and resets each month. \x3cstrong>Affinity Premium AI tools aren’t available to Free users.\x3c/strong>\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>Your total number of uses depends on:\x3c/p>\x3cul>\x3cli data-list=\\"bullet\\">\x3cspan class=\\"ql-ui\\" contenteditable=\\"false\\">\x3c/span>The type of AI tools you use (higher-tier tools use more of your allowance)\x3c/li>\x3cli data-list=\\"bullet\\">\x3cspan class=\\"ql-ui\\" contenteditable=\\"false\\">\x3c/span>How complex your task is\x3c/li>\x3cli data-list=\\"bullet\\">\x3cspan class=\\"ql-ui\\" contenteditable=\\"false\\">\x3c/span>Whether you use a mix of different AI tools\x3c/li>\x3c/ul>\x3cp>\x3cbr>\x3c/p>\x3cp>\x3cstrong>Estimated AI allowance by plan\x3c/strong>\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>The ranges below show what’s possible if you use one type of AI tool (either Standard, or Premium, or Ultra - not a mix). Completing more complex tasks with a single tool or using a mix of tools may reduce your total uses to the lower end of the range.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>\x3cstrong>Your estimated allowance by plan:\x3c/strong> AI usage is pooled across all AI tools listed below, and resets monthly:\x3c/p>\x3cul>\x3cli data-list=\\"bullet\\">\x3cspan class=\\"ql-ui\\" contenteditable=\\"false\\">\x3c/span>\x3cstrong>Canva Free:\x3c/strong> Up to 200 uses of Standard AI tools, or up to 20 uses of Premium AI tools. \x3cstrong>No access to Ultra AI tools.\x3c/strong>\x3c/li>\x3cli data-list=\\"bullet\\">\x3cspan class=\\"ql-ui\\" contenteditable=\\"false\\">\x3c/span>\x3cstrong>Canva Pro:\x3c/strong> Up to 2,000 uses of Standard AI tools, or up to 200 uses of Premium AI tools, or up to 20 uses of Ultra AI tools\x3c/li>\x3cli data-list=\\"bullet\\">\x3cspan class=\\"ql-ui\\" contenteditable=\\"false\\">\x3c/span>\x3cstrong>Canva Business:\x3c/strong> Up to 4,000 uses of Standard AI tools, or up to 400 uses of Premium AI tools, or up to 40 uses of Ultra AI tools\x3c/li>\x3cli data-list=\\"bullet\\">\x3cspan class=\\"ql-ui\\" contenteditable=\\"false\\">\x3c/span>\x3cstrong>Canva Enterprise:\x3c/strong> Up to 4,000 uses of Standard AI tools, or up to 400 uses of Premium AI tools, or up to 40 uses of Ultra AI tools\x3c/li>\x3c/ul>\x3cp>\x3cbr>\x3c/p>\x3cp>If you need more AI allowance, you can expand your creativity with AI Pass, a recurring add-on to your Canva Pro or Canva Business subscription. Learn more about AI Pass \x3ca href=\\"https://www.canva.com/ai-pass/\\" rel=\\"noopener noreferrer\\" target=\\"_blank\\" data-url-before-localization=\\"https://www.canva.com/ai-pass/\\">here\x3c/a>.\x3c/p>","C":{"A":["audienceFlagPricingPageM3Content & !audienceFlagPricingPageCanvaAi21Content"],"B":false}},{"A":"How can I get more AI on my plan?","B":"\x3cp>There are a few ways to get more AI allowance:\x3c/p>\x3cul>\x3cli data-list=\\"bullet\\">\x3cspan class=\\"ql-ui\\" contenteditable=\\"false\\">\x3c/span>Upgrade your plan for a higher monthly AI allowance.\x3c/li>\x3cli data-list=\\"bullet\\">\x3cspan class=\\"ql-ui\\" contenteditable=\\"false\\">\x3c/span>\x3cstrong>AI Pass\x3c/strong> - a monthly add-on for Pro and Business users who subscribe online. Get Canva\'s largest AI allowance, refreshing every month. \x3ca href=\\"https://www.canva.com/help/ai-pass/\\" rel=\\"noopener noreferrer\\" target=\\"_blank\\" class=\\"V6c1Zg\\" data-url-before-localization=\\"https://www.canva.com/help/ai-pass/\\">Learn more\x3c/a>.\x3c/li>\x3cli data-list=\\"bullet\\">\x3cspan class=\\"ql-ui\\" contenteditable=\\"false\\">\x3c/span>\x3cstrong>AI top-ups\x3c/strong> - a one-time purchase for Business users who subscribe online. Get the same amount of AI as your monthly allowance, valid for 30 days. \x3ca href=\\"https://www.canva.com/help/ai-top-ups/\\" rel=\\"noopener noreferrer\\" target=\\"_blank\\" data-url-before-localization=\\"https://www.canva.com/help/ai-top-ups/\\">Learn more\x3c/a>.\x3c/li>\x3c/ul>","C":{"A":["audienceFlagPricingPageAiTopUpContent"],"B":false}},{"A":"Is Canva Pro available for teams?","B":"\x3cp>Canva Pro is the best plan for solo creators who want to design like a pro and create visually stunning content with ease. Only one person can use a Canva Pro account.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>If you need more advanced tools to grow your business, Canva Business is the right choice. It’s designed for both individuals and small teams, offering smarter ad performance insights, enhanced brand management, more powerful AI access, and streamlined team workflows - all in one single plan.\x3c/p>","C":{"B":false}},{"A":"What is the difference between Canva Business and Canva Pro?","B":"\x3cp>\x3cstrong>Canva Pro\x3c/strong> is the perfect plan for solo creators who want premium editing tools and templates to create faster and design like a pro.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>\x3cstrong>Canva Business\x3c/strong> is built for individuals, and growing teams who need more AI access, enhanced brand management, smarter marketing with ad analytics, and a shared workspace for seamless collaboration to scale and grow their business. Discover how \x3ca href=\\"https://www.canva.com/canva-business/\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/canva-business\\">Canva Business\x3c/a> can support your needs.\x3c/p>","C":{"B":false}},{"A":"Can I invite other team members during my trial?","B":"\x3cp>If you\'re using Canva Business, you can invite other team members to join your team. You won\'t be billed at all during your trial period.\x3c/p>","C":{"B":false}},{"A":"What is the difference between Canva Business and Canva Enterprise?","B":"\x3cp>\x3cstrong>Canva Business\x3c/strong> is designed for individuals, marketers, and small to medium-sized businesses who want to grow their business. It includes all the premium content and features in Pro, plus advanced tools like ad performance insights, higher AI access, up to stronger brand control, collaboration features, and more. Discover how \x3ca href=\\"https://www.canva.com/canva-business/\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/canva-business\\">Canva Business\x3c/a> can power your business growth.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>\x3cstrong>Canva Enterprise\x3c/strong> is built for large or multi-team organizations that need more control at scale. It includes everything in Business, plus enterprise-level features like advanced brand governance, security with SSO and SCIM, custom apps and integrations, and admin controls.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>\x3ca href=\\"https://www.canva.com/contact-sales/?cta_source=pricing_difference_faq\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/contact-sales/?cta_source=pricing_difference_faq\\">Contact our sales team\x3c/a> to learn how Canva Enterprise can support your business needs.\x3c/p>","C":{"B":false}},{"A":"How can I request a trial of Canva Enterprise?","B":"\x3cp>While we don’t offer a free trial for Canva Enterprise, you can \x3ca href=\\"https://www.canva.com/contact-sales/?cta_source=pricing_difference_faq\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/contact-sales/?cta_source=pricing_difference_faq\\">get in touch\x3c/a> with our sales team to see a demo of Canva Enterprise and discuss your specific needs.\x3c/p>","C":{"B":false}},{"A":"What if I work for a nonprofit?","B":"\x3cp>Nonprofits can get a free subscription with all the premium features of Canva Pro, plus team and collaboration tools, for one team of up to 50 users. Additional seats are 50% off on Canva Enterprise. \x3ca href=\\"https://www.canva.com/canva-for-nonprofits/?cta_source=pricing_faq_nonprofit\\" rel=\\"noopener noreferrer\\" target=\\"_self\\">Apply today.\x3c/a>\x3c/p>","C":{"B":false}},{"A":"What if I am a student or teacher?","B":"\x3cp>Canva Education is available for K-12 (primary and secondary) educators, their students, and qualified school districts and institutions. Check out our full \x3ca href=\\"https://www.canva.com/education/eligibility-guidelines/?cta_source=pricing_faq_student_or_teacher\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/education/eligibility-guidelines/?cta_source=pricing_faq_student_or_teacher\\">eligibility requirements.\x3c/a>\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>\x3ca href=\\"https://www.canva.com/for-campus/?cta_source=pricing_faq_student_or_teacher\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/for-campus/?cta_source=pricing_faq_student_or_teacher\\">Canva Campus\x3c/a> empowers higher education students, faculty staff, plus campus administrators and marketers to communicate visually and collaborate seamlessly with Canva’s suite of tools.\x3c/p>","C":{"B":false}},{"A":"What payment methods can I use?","B":"\x3cp>We accept Paypal and credit cards by major providers such as Visa, Mastercard, and American Express. We also support other online payment systems in some countries. Take a look at this help article to learn more about \x3ca href=\\"https://www.canva.com/help/payment-options/?cta_source=pricing_faq_payment_options\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/help/payment-options/?cta_source=pricing_faq_payment_options\\">payment options.\x3c/a>\x3c/p>","C":{"B":false}},{"A":"Will I be charged tax with my subscription?","B":"\x3cp>The prices on this page don’t include tax. If tax applies in your region, we’ll calculate it based on your billing details and the applicable rate at the time of your subscription charge.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>You’ll see the total amount, including the current tax amount, before you confirm your purchase.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>Here\'s how it works if you\'re in the US or Canada:\x3c/p>\x3cp>\x3cstrong>• In the US:\x3c/strong> We apply sales tax where required, based on your billing address.\x3c/p>\x3cp>\x3cstrong>• In Canada:\x3c/strong> GST and any applicable provincial taxes are added based on your postal code.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>If you are tax-exempt, learn how to submit a valid exemption certificate via the \x3ca href=\\"https://www.canva.com/help/tax-exempt-invoice/\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/help/tax-exempt-invoice/\\">Help Center\x3c/a>.\x3c/p>","C":{"A":["audienceTaxExclusive"],"B":false}},{"A":"How does the billing work when I add new members to my team?","B":"\x3cp>Canva Business operates on pay-as-you-grow model. This means you only pay for the team members who accept your invitation. There’s no immediate charge; billing is adjusted monthly, or quarterly if you’re on an annual subscription.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>If you\'re on a monthly billing cycle, you can adjust your team size at any time. You’ll only be charged for the members you have in your team at the next monthly renewal. For those on annual billing cycles, we\'ll email the team admin to let them know about any upcoming charges and give them a notice period to update their team size.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>Canva Enterprise offers great flexibility for your billing needs, including the option to set up regular invoicing. To learn more about your billing options with Canva Enterprise, \x3ca href=\\"https://www.canva.com/contact-sales/?cta_source=pricing_billing_faq\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-anchor-id=\\"phoenixContactSalesPage\\" data-url-before-localization=\\"https://www.canva.com/contact-sales/?cta_source=pricing_billing_faq\\">reach out\x3c/a> to our sales team.\x3c/p>","C":{"B":false}},{"A":"If I add a team member, will they be able to see all my designs?","B":"\x3cp>Your designs are always private, unless you explicitly choose to share them or save them as templates for your team.\x3c/p>","C":{"B":false}},{"A":"How can I contact the sales team?","B":"\x3cp>For inquiries about choosing the right plan or creating a personalized package for your organization, please reach out to our Sales team via the \x3ca href=\\"https://www.canva.com/contact-sales/?cta_source=pricing_billing_faq\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/contact-sales/?cta_source=pricing_billing_faq\\">Contact Sales form.\x3c/a>\x3c/p>","C":{"B":false}},{"A":"Is Canva AI available in my country?","B":"\x3cp>Canva AI currently supports these languages: English, Spanish, Portuguese, French, German, Italian, Dutch, Polish, Turkish, Arabic, Japanese, Korean, Chinese (Simplified &amp; Traditional), Indonesian, Thai, Vietnamese, and Hindi.\x3c/p>","C":{"B":false}},{"A":"What happened to Canva Teams?","B":"\x3cp>Canva Teams is no longer available for new sign-ups or upgrades. If you\'re already on Canva Teams, you\'ll remain on your current plan unless you switch or cancel.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>Any new paid features exclusive to Canva Business won’t be included in Canva Teams. If you’re looking for more ways to grow, Canva Business offers more powerful tools like smarter ad performance insights, higher AI access, interactive data visualization, advanced AI image and video generation, and more.\x3c/p>","C":{"B":false}},{"A":"How do I get access to Flourish and Leonardo.Ai subscriptions that are included in Canva Business?","B":"\x3cp>To access the Leonardo.Ai Essential and Flourish Presenter plans, make sure you sign up for \x3ca href=\\"https://app.flourish.studio/canva/connect\\" rel=\\"noopener noreferrer\\" target=\\"_self\\">Flourish\x3c/a> or \x3ca href=\\"https://app.leonardo.ai/auth/login\\" rel=\\"noopener noreferrer\\" target=\\"_self\\">Leonardo.Ai\x3c/a>\x3cstrong> \x3c/strong>using your Canva Business account.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>If you’re part of a team and experience any access issues, please reach out to your Canva account admin or owner. Access to Flourish and Leonardo.Ai may have been restricted for your organization.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>If you’re not currently on Canva Business, you’ll need to upgrade to a Business plan to unlock the Leonardo.Ai Essential and Flourish Presenter plans. \x3ca href=\\"https://www.canva.com/canva-business/\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/canva-business\\">Learn more about Canva Business.\x3c/a>\x3c/p>","C":{"B":false}},{"A":"I started a Canva Business trial, but I don\'t have access to Leonardo.Ai Essential plan features. Why is that?","B":"\x3cp>During your Canva Business free trial, you\'ll have access to all the features included in Leonardo.Ai\'s Free plan so you can explore the experience. Access to Leonardo.Ai Essential plan features is automatically enabled after your trial ends and your Canva Business subscription payment is successfully processed.\x3c/p>","C":{"B":false}},{"A":"Where can I see the price of my subscription?","B":"\x3cp>You can view your current plan and pricing anytime in your Billing settings. From the Canva homepage, open your account menu, go to Settings, then select Billing.\x3c/p>","C":{"A":["audienceFlagPricingPageBusinessPriceIncrease"],"B":false}}]}}],"D":{"A?":"B","A":{"A":"E"}}},{"A":"education","B":"Education","C":[{"A?":"A","DL":"B","A":{"B":[{"A":"teachers_card","B":"B","C":"C","D":{"A":"For K-12 education","N":{"A":"K-12 educators"},"O":{"A":{"A":"z","B":"0E1318"}},"P":{},"B":"Teachers","C":"100% free, easy-to-use learning platform for every K‑12 classroom.","R":{"B":[{"A":"100% free, easy-to-use learning platform for every K‑12 classroom.","B":{"A":["audienceThatMatches"],"B":false}}]},"D":{"A?":"C","A":"Get verified","Bk":"https://web.archive.org/web/20260805125923/https://www.canva.com/edu-signup/"},"M":{},"K":{},"L":{}},"E":{"A":[{"A":"With Canva Education, unlock:","C":[{"A":"100M+ copyright-free images, videos, audio, animations, and more "},{"A":"Thousands of templates, lessons, and resources for every subject and grade"},{"A":"AI tools to boost creativity, productivity, and engagement^"},{"A":"Access premium features, like Magic Resize™"},{"A":"Build interactive experiences with AI^"},{"A":"Assignment hub to mana tion of a template being edited","C":{"A":{"A":"https://web.archive.org/web/20260805125923/https://content-management-files.canva.com/ae8591bd-a789-4cf3-a6d1-2bda710e3209/Templates4_3x2.png","B":167,"C":146}}},"B":"\x3cp>Start inspired - choose from a library of copyright-free templates for your next lesson, presentation or class assignment.\x3c/p>","C":"Ready-to-use templates","F":{"A?":"B","DJ":{"A":"linear-gradient(90deg, rgba(224,239,255,1) 0%, rgba(224,239,255,1) 100%)"}},"K":{"A":{"A?":"D","A":"View templates","Bk":"https://web.archive.org/web/20260805125923/https://www.canva.com/templates/?query=education&cta_source=pricing_resource_templates","Bl":"B"}}}],"D":1}},{"A?":"E","DL":"B","A":{"A":"Frequently Asked Questions","B":[{"A":"Is Canva Education really free?","B":"\x3cp>Yes - it’s 100% free, with no paywalls or nasty surprises. It’s our commitment that Canva Education will remain 100% free for K-12 (primary and secondary) educators, their students, as well as qualified school districts and institutions.\x3c/p>","C":{"B":false}},{"A":"What\'s included in Canva Education?","B":"\x3cp>Most of Canva’s premium features are included in Canva Education, as well as dedicated features for educators, such as LMS integrations, the ability to share work and assignments with students, thousands of high quality educational templates, and more.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>School districts and institutions can also enjoy enterprise-level security features, deployment via SSO, onboarding support, and professional development training - all for free.\x3c/p>","C":{"B":false}},{"A":"Who can access Canva Education?","B":"\x3cp>Canva Education is available for K-12 (primary and secondary) educators, their students, and qualified school districts and institutions. Check out our full \x3ca href=\\"https://www.canva.com/education/eligibility-guidelines/?cta_source=pricing_faq_who\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/education/eligibility-guidelines/?cta_source=pricing_faq_who\\">eligibility requirements.\x3c/a>\x3c/p>","C":{"B":false}},{"A":"What if I already have a Canva account?","B":"\x3cp>No problem. If you already have a Canva account, log in to your account, go to our \x3ca href=\\"https://www.canva.com/edu-signup/?cta_source=pricing_faq_have_account\\" rel=\\"noopener noreferrer\\" target=\\"_self\\">signup\x3c/a> page, and follow the verification process to upgrade your account to Canva Education. All of your existing designs will transfer over.\x3c/p>","C":{"B":false}},{"A":"Is Canva Education safe to use?","B":"\x3cp>Our dedicated education and district offerings are FERPA and COPPA compliant, and we are also a signatory of the National Data Privacy Agreement. We are committed to GDPR compliance, and offer safe-for-school content.\x3c/p>","C":{"B":false}},{"A":"I’m a student. Can I access Canva Education?","B":"\x3cp>Currently, Canva Education is available for K-12 (primary and secondary) students. If you’re a primary or secondary student, your teacher needs to invite you to join Canva Education. They can do this from their Canva Education account, \x3ca href=\\"https://www.canva.com/en/help/invite-teachers-and-students/?cta_source=pricing_faq_student\\" rel=\\"noopener noreferrer\\" target=\\"_self\\">here’s how.\x3c/a>\x3c/p>","C":{"B":false}},{"A":"How does Canva ensure that its content libraries are safe for schools?","B":"\x3cp>We’re committed to doing everything we can to ensure that students can harness the full potential of Canva while remaining completely safe in the content they are able to access within Canva’s libraries.\x3c/p>\x3cp>\x3cbr>\x3c/p>\x3cp>Canva uses a multi-layered set of safeguards to ensure that the content within our Canva Education platform is safe for school and safe for students. As well as a set of blocked search terms, we also leverage a best-in-class machine learning platform, which scans our existing collection of millions of photos and graphics to identify, flag, and remove access to “not safe for school” content for Canva Education users. Our collections are reviewed by a human content moderator to check compliance with our “not safe for school” definitions.\x3c/p>","C":{"B":false}},{"A":"Who qualifies for a Canva Campus plan?","B":"\x3cp>Accredited public or private universities or colleges (including community, junior, or vocational colleges) that grant degrees requiring not less than the equivalent of two years of full-time study. Higher education research laboratories, training centers or schools granting certificates for courses such as computer software training, museums, libraries or military schools do not qualify for Canva Campus.\x3c/p>","C":{"B":false}},{"A":"What’s the difference between the Canva Education and Canva Campus plans?","B":"\x3cp>Canva Education is available for free for K-12 (primary and secondary) educators, their students, and qualified school districts and institutions. Check out our full \x3ca href=\\"https://www.canva.com/education/eligibility-guidelines/?cta_source=pricing_faq_student_or_teacher\\" rel=\\"noopener noreferrer\\" target=\\"_self\\" data-url-before-localization=\\"https://www.canva.com/education/eligibility-guidelines/?cta_source=pricing_faq_student_or_teacher\\">eligibility requirements.\x3c/a> Canva Campus is our paid offering designed for full campus-wide rollouts at higher education institutions.\x3c/p>","C":{"B":false}},{"A":"Can Higher Education students access Canva Campus?","B":"\x3cp>Right now, Canva Campus is managed at the institution level, including the student team rollout. If you’re a student at a Canva Campus institution, you can simply log-in with your university email, however if not you can still access Canva Free or Pro at log-in.\x3c/p>","C":{"B":false}},{"A":"How much does Canva Campus cost? Is there a minimum number of licenses to purchase?","B":"\x3cp>Canva Campus is based on Canva Enterprise pricing. Institutions must purchase a minimum number of staff licenses, which varies depending on student enrollment size. Once this threshold is met, all students at the university receive premium Canva access at no additional cost.\x3c/p>","C":{"B":false}},{"A":"How does Canva ensure the secure application of AI by university students?","B":"\x3cp>We believe in the transformative power of AI in education, and our Magic tools put AI into the hands of millions of university students in a safe, practical, and relevant way. We’ve built a variety of safeguards in our product and have a very intentional focus on Trust and Safety, which means that university admins have the ability to turn on/off AI features for staff and students.\x3c/p>","C":{"B":false}},{"A":"Can we purchase Canva Campus via AWS Marketplace and other partners?","B":"\x3cp>Yes. Universities can purchase Canva Campus through AWS Marketplace or authorized resellers such as CDW. These channels help streamline procurement, leverage existing agreements, and support tax-exempt purchasing. Our team can also provide offers aligned to your institution’s needs.\x3c/p>","C":{"B":false}}]}}],"D":{"A?":"B","A":{"A":"F"}}}],"D":{"A":{"A?":"A","A":{"A":"C","B":"f0eafe"}},"B":"\x3cp>Fast-track your creative vision with AI Pass, available as an add-on to any Canva Pro or Business plan.\x3c/p>","D":{"A":{"A?":"D","A":"Learn more","E":"C","Bk":"https://web.archive.org/web/20260805125923/https://www.canva.com/ai-pass/"},"B":false,"C":false},"E":"I","H":false,"I":{"A?":"B","E":"B","DJ":{"A":"linear-gradient(90.97deg, #5434EF -0.43%, #7730F7 32.45%, #992BFF 65.34%, #7330DF 113.31%)"}}},"E":{},"F":"Plans and pricing"}},"y":false},"ui":{"N":false,"A":true,"B":"A","C":false,"D":true,"H":false,"K":"A","J":false,"P":false}}'); window['flags'] = JSON.parse('{"46c373b5":true,"acc589c6":true,"818a696f":true,"5d270ad5":false,"7226c17e":true,"8471bc3":true,"564145ba":true,"b2dc39bb":true,"d827c65":true,"2560e0ae":true,"33db456e":true,"a02313d4":true,"cd2
