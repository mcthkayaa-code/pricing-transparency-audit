variables:
  # --- Domain 1: headline price vs price actually charged ---
  headline_price_usd:
    value: 6.00
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Entry tier Starter card reads "$6 per month" in the page's default (Monthly
      billing) display state, confirmed both in the SSR FAQPage data ("Starter $6
      (30,000 credits)") and live screenshot 2026-08-06. Free ($0/mo) is not a paid
      tier. Entry-tier selection and losing candidates recorded in coder_note.

  headline_billing_basis:
    value: per_month_billed_monthly
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Default display state is "Monthly billing" (combobox value="monthly"); Starter
      card shows "$6 per month" with no "billed annually" qualifier attached in this
      state. Localization keys confirm the alternate label used only when the
      annual toggle is active: "per_month_yearly":"per month, billed yearly".

  first_charge_amount_usd:
    value: 6.00
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Default state is monthly (not annual), so codebook rule 2's annual-multiplication
      case does not apply; the page states a single monthly figure charged monthly,
      "$6 per month" for Starter, with no mandatory add-on found (see
      mandatory_addon_present). No checkout was opened; figure taken from the
      pricing page and cross-checked against the billing FAQ ("Subscriptions are
      billed on a monthly or yearly basis starting from the day you subscribe.").

  mandatory_addon_present:
    value: 'no'
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Starter's advertised features (Commercial License, Instant Voice Cloning, 20
      Projects in Studio, Dubbing Studio, Music commercial use, Image & Video) carry
      no separate required charge in the pricing page or docs-billing.md. Voice
      cloning, which is free-plan-gated on some competitors, is included in the
      Starter price itself (docs-billing.md: "Cloning is only available on the
      Starter tier and above" — no extra fee stated). Usage-based billing / Pay As
      You Go top-ups are optional overage products, not a mandatory addition to use
      the plan as advertised, per rule 3.

  # --- Domain 2: annual-billing condition visibility ---
  annual_condition_disclosure:
    value: not_applicable
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Rule 1: the headline figure coded above ($6/mo, Starter) does not depend on
      annual prepayment — the page's default display state is monthly billing, a
      standard month-to-month charge. An annual option exists elsewhere on the page
      (billing-period dropdown) but the coded headline figure itself carries no
      annual-prepayment condition, so the disclosure-proximity question this
      variable measures does not arise for the state actually read.

  annual_default_toggle:
    value: monthly_preselected
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Live accessibility-tree read of https://elevenlabs.io/pricing on 2026-08-06,
      before any interaction: `combobox "Monthly billing" [ref_14] / option "Monthly
      billing" (selected) value="monthly" / option "Yearly billing" value="yearly"`.
      Screenshot of the same load shows the dropdown reading "Monthly billing" and
      plan cards in monthly figures ("$6 per month", "$99 per month", etc.). No
      second read of this URL was taken, so no display-variant comparison applies.

  # --- Domain 3: real usability of the free plan ---
  free_plan_exists:
    value: 'yes'
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Standing "Free" plan card, "$0 per month", listed alongside paid tiers with
      no expiry; docs-billing.md: "When signing up, you will be automatically
      assigned to the free tier." Not a time-limited trial (see trial_exists).

  free_plan_cap_documented:
    value: some_quantified
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Quantified: "10,000 credits" per month (FAQ: "Free $0 (10,000 credits)");
      3 custom voice slots and "55" monthly voice operations
      (voice-slots-article.md); "3 Projects in Studio"; audio quality "128 kbps,
      44.1kHz" (standing spec, attributed to Free specifically in the plan-card
      data). Not quantified: pricing-page FAQ "Is there a limit on how many
      credits I can use in a single request? Yes... The limit depends on whether
      you are on the Free tier or a paid subscription" — states a per-request cap
      exists but gives no number for either tier. At least one quantified and at
      least one unquantified limit => some_quantified.

  free_plan_cap_value:
    value: "10000 credits per month | 3 voice slots | 55 voice operations per month | 3 projects in Studio | 128 kbps maximum audio bitrate"
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      See free_plan_cap_documented sources. Voice-slot and voice-operation figures
      additionally sourced from
      https://elevenlabs.io/docs/help-center/account/general/how-many-voice-slots-do-i-get-per-tier-and-how-can-i-increase-it
      ("Free: 3" custom voice slots; monthly voice-operations quota "Free: 55").
      Per-output-type minute breakdowns (10 min TTS, 5 min Music, 250 sec Sound
      Effects) are the same 10,000-credit pool re-expressed in other units and are
      not listed separately to avoid double-counting one limit.

  free_plan_watermark:
    value: 'yes'
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Pricing-page tooltip data: "Free plan users receive video dubs with a
      watermark; paid plans do not." A second tooltip on the same page scopes
      this precisely: "Watermarks are only available for video dubs." Scope note:
      this documents watermarking on the Dubbing feature's video output for free
      users; plain Text-to-Speech audio output is not documented as watermarked
      anywhere in the reviewed sources. Coded 'yes' per the codebook's own
      pricing-table-row example (a documented watermark on any free-plan output
      is sufficient), with the Dubbing-specific scope stated here rather than in
      the value itself.

  free_plan_duration:
    value: perpetual
    source: https://elevenlabs.io/docs/overview/administration/billing
    access_date: '2026-08-06'
    archive_url: https://web.archive.org/web/20260806073223/https://elevenlabs.io/docs/overview/administration/billing
    evidence: >
      "When signing up, you will be automatically assigned to the free tier."
      Free is presented as a standing tier alongside paid tiers on the pricing
      page with no expiry stated in any reviewed document; downgrading a paid plan
      also lands the account on Free indefinitely ("your account will be
      transferred onto our free plan" on cancellation, docs-billing.md), which is
      only coherent if Free itself does not expire.

  # --- Domain 4: whether a trial requires a payment card ---
  trial_exists:
    value: 'no'
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      No time-limited trial is described anywhere in the pricing page, docs-billing.md,
      or the help-center articles reviewed; ElevenLabs uses a standing $0 Free plan
      instead (see free_plan_exists). The only "trial" occurrences in the Terms of
      Service are jury-trial-waiver/arbitration boilerplate and one general
      reservation-of-rights clause ("ElevenLabs may issue Prepaid Credits without
      charge as part of a promotional, marketing, or trial program") that describes
      no current, standing trial offer with defined terms — it is a permission
      ElevenLabs reserves, not a documented trial a buyer can rely on today.

  trial_card_required:
    value: not_applicable
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: "No trial exists (trial_exists = no)."

  trial_length_days:
    value: not_applicable
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: "No trial exists (trial_exists = no)."

  trial_auto_converts:
    value: not_applicable
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: "No trial exists (trial_exists = no)."

  # --- Domain 5: comprehensibility of the credit system ---
  credit_system_present:
    value: 'yes'
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      "Credits" are an intermediate currency shared across all products and
      converted into outputs at published per-product rates (see
      credit_to_output_rate_published): "All products draw from one shared monthly
      credit pool... Approximate credit costs are: Text to Speech 1 credit per
      character; Speech to Text 330 credits per minute; Eleven Music 900 credits
      per minute..." — textbook intermediate-currency credit system, rule 2.

  credit_unit_defined:
    value: 'yes'
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Pricing-page tooltip: "For V2 Multilingual models, 1 text character equals 1
      credit." A document ties the unit to a recognizable output (a character of
      generated text), satisfying rule 3 directly.

  credit_to_output_rate_published:
    value: 'yes'
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Principal output (Text to Speech, per_audio_minute): "1 credit per
      character"; page also states "One minute of audio costs approximately 1000
      characters" (highest-quality/V2 Multilingual model), giving an exact,
      unambiguous rate for the flagship model. Every other advertised output type
      also carries a published rate on the same page: "Speech to Text 330 credits
      per minute; Eleven Music 900 credits per minute; Sound Effects 200 credits
      per generation; Voice Changer and Voice Isolator 1,000 credits per minute;
      and Dubbing 2,000 credits per minute (automatic with watermark), 3,000
      (automatic without watermark), 5,000 (Dubbing Studio with watermark) or
      10,000 (Dubbing Studio without watermark)." Full coverage across principal
      and secondary outputs => yes, not partial. (Note: the API-specific
      Flash/Turbo model rate is separately given as a range, "0.5 and 1 credit per
      character" — that range applies to a discounted alternate model, not to the
      flagship rate used here, and does not by itself reduce this to partial since
      an exact, complete rate is published for the standard model.)

  credit_rate_location:
    value: pricing_page
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      All credit-to-output rates found (character/minute rates, per-product credit
      costs) are on the pricing page's FAQ/tooltip data. docs-models.html (the
      Models documentation page) contains no mention of "credit" at all (checked in
      full); docs-billing.md describes credits qualitatively without repeating the
      numeric rates. Rate is therefore published in one class only: pricing_page.

  # --- Domain 6: computability of cost per output ---
  cost_per_output_unit:
    value: per_audio_minute
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      ElevenLabs is sold principally as a text-to-speech / AI voice generator
      (category: AI voice); the pricing page frames Text to Speech as the lead
      product and counts it in credits-per-character convertible to audio minutes.

  cost_per_output_computable:
    value: 'yes'
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      All required figures are published for the entry tier and the principal
      output; see computation_assumptions for the full calculation
      (result: $0.20 per audio minute).

  computation_assumptions:
    value: >
      Entry tier Starter, $6.00/mo billed monthly per default display state
      (2026-08-06 live read). Included allowance: 30,000 credits/month (pricing
      page FAQ: "Starter $6 (30,000 credits)"). Conversion: highest-quality model
      rate is 1 credit = 1 character, and "one minute of audio costs approximately
      1000 characters" (pricing page tooltip), i.e. ~1,000 credits per audio
      minute. Price and allowance are already both monthly, so no period
      conversion is needed (rule 3 n/a). 30000 credits / 1000 credits-per-minute =
      30 minutes/month — this independently matches the plan's own stated
      allowance "30 minutes of Text to Speech" for Starter, cross-validating the
      arithmetic. 6.00 / 30 = 0.20 USD per audio minute.
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: "Coder's own arithmetic; not a vendor statement (section 2.3 exception)."

  # --- Domain 7: rollover of unused credits ---
  credit_rollover_policy:
    value: partial_rollover
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      "Unused credits roll over for up to two months — up to 2x your monthly quota
      — so your balance can reach at most 3x your monthly quota... as long as you
      maintain an active paid subscription and do not downgrade or cancel."
      Capped, stated rollover => partial_rollover per the codebook's own "rolls
      over for up to 3 months" example. Also confirmed in docs-billing.md ("Up to
      two months' worth of unused credits can roll over to the next month") and
      end-of-month-article.md. Note: rollover does not apply to the Free plan
      ("Rollover does not apply to the Free plan").

  # --- Domain 8: charging for failed generations ---
  failed_generation_charge_policy:
    value: unknown
    source: https://elevenlabs.io/pricing
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/pricing.html; live-observed 2026-08-06"
    evidence: >
      Pricing-page FAQ: "Credits are charged per generation request, not per
      download. If you are not satisfied with the output, a limited number of
      free regenerations may be available..." — this addresses a buyer disliking
      an output (Studio regeneration credits, see regenerate-cost-article.md), not
      a technical failure or empty result, which the codebook explicitly
      distinguishes. No reviewed document (pricing page, terms-of-use.html,
      docs-billing.md) states what happens to credits when a generation
      technically fails or errors. Searched "fail", "error", "unsuccessful" across
      all reviewed sources; no on-point statement found. Silence, per the
      codebook's own worked example for this exact variable.

  # --- Domain 9: auto-renewal ---
  auto_renewal_default:
    value: 'on'
    source: https://elevenlabs.io/terms-of-use
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/terms-of-use.html"
    evidence: >
      Terms of Service section "6. Subscription Services; Payment", (a)
      Subscriptions: "Your Recurring Subscription will automatically renew until
      you cancel it or your Recurring Subscription is otherwise terminated."
      Elsewhere in the same section, emphasis-cased: "THEN YOUR SUBSCRIPTION WILL
      BE AUTOMATICALLY RENEWED FOR ADDITIONAL PERIODS OF THE SAME DURATION AS THE
      INITIAL TERM." ToS ranks first for this contractual variable per protocol
      6.2 and is unambiguous; consistent with the help center (annual-plans-article.md:
      "Annual plans are billed on an annual cycle and will renew automatically
      unless cancelled").

  auto_renewal_disclosure_location:
    value: multiple
    source: https://elevenlabs.io/terms-of-use
    access_date: '2026-08-06'
    archive_url: "local_copy:elevenlabs-sources/terms-of-use.html"
    evidence: >
      Stated explicitly in the Terms of Service (section 6(a), see
      auto_renewal_default) AND in the official documentation/help center
