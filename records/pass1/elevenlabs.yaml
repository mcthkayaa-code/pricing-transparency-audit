coder_note: >
  Entry-tier selection (sampling-rules.md 7.2), all figures read in the default
  monthly display state, annualized at figure x 12: Free $0/mo is not a paid
  tier and is not a candidate. Enterprise is excluded from candidacy entirely
  (sales-gated, fails eligibility rule 2 — "purchasable without contacting
  sales"; headline_price_usd for Enterprise would be no_public_price if it were
  the entry tier, but it is not reached since cheaper self-serve tiers exist).
  Eligible candidates and their annual-equivalent single-seat cost: Starter
  $6/mo -> 72.00 (WINNER, entry_tier_name); Creator standing rate $22/mo ->
  264.00 (lost) — Creator's card shows a first-month-only promotional price of
  $11/mo, which is not used for this comparison since it is not the standing
  rate; Pro $99/mo -> 1,188.00 (lost); Scale $299/mo -> 3,588.00 (lost; bundles
  3 workspace seats as its base offering rather than selling a single-seat
  variant, per sampling-rules 7.2 rule 3, recorded here rather than treated as
  disqualifying); Business $990/mo -> 11,880.00 (lost; bundles 10 seats,
  same note).

  Methodology notes for reproduction: (1) Two direct Zendesk help-center fetches
  saved by the prior run (cancel-subscription.html, refund-policy.html, both
  under help.elevenlabs.io) returned a Cloudflare "Just a moment..." challenge
  page with no usable content; not used as sources. The equivalent content was
  obtained instead from the elevenlabs.io/docs help-center mirror (llms.txt-indexed,
  same underlying articles, no Cloudflare gate), which is what source_urls
  reflects. (2) web.archive.org/save returned HTTP 520 on repeated attempts for
  https://elevenlabs.io/pricing (4 attempts) and https://elevenlabs.io/terms-of-use
  (3 attempts) specifically, while 10 smaller docs/help-center pages archived
  successfully in the same run within minutes — consistent with an archive.org-side
  timeout on large JS-rendered pages rather than a block; local copies used per
  protocol 6.4 fallback (archive_status: local_copy_only for these two). (3) The
  Terms of Service reviewed is explicitly the *non-EEA* version
  ("ElevenLabs Terms of Service (non-EEA)" — "These ElevenLabs Terms of Service
  apply if you reside outside of the European Economic Area (EEA), Switzerland,
  or UK. If you live in the EEA, Switzerland, or UK, these other ElevenLabs
  Terms of Service apply to you."). The EEA/UK/Switzerland-specific ToS was not
  fetched or reviewed (out of scope for this pass) and may state different
  refund terms (e.g. statutory withdrawal rights); this record describes only
  the non-EEA document. (4) docs-models.html was fetched by the prior run but
  contains no pricing/credit content (checked in full, zero "credit" mentions)
  and was not used as a source for any coded value.

computation_assumptions: >
  cost_per_output_computable (C3): Starter tier, $6.00/mo billed monthly per
  default display state; 30,000 credits/mo included; highest-quality model rate
  1 credit = 1 character, ~1,000 characters ~= 1 minute of audio (pricing-page
  tooltip); both price and allowance already monthly, no period conversion
  needed. 30000 / 1000 = 30 minutes/month (cross-validated against the plan's
  own stated "30 minutes of Text to Speech" allowance). 6.00 / 30 =
  cost_per_output_value_usd 0.20 USD per audio minute. Full detail and sources
  in variables.computation_assumptions above.

conflict_note: >
  refund_policy_exists / refund_window_days / refund_conditions /
  refund_policy_location: the Terms of Service (protocol 6.2 rank 1 for
  contractual variables) and the Help Center (rank 2) state incompatible refund
  positions for the same Recurring Subscriptions. Terms of Service,
  https://elevenlabs.io/terms-of-use, section "6. Subscription Services;
  Payment", (e) Refunds and Exchanges: "All sales are final. We may offer
  refunds at our sole discretion." — a general no-standing-refund position.
  Help Center,
  https://elevenlabs.io/docs/help-center/account/cancellation-refunds/what-is-your-refund-policy
  and
  https://elevenlabs.io/docs/help-center/account/cancellation-refunds/how-can-i-request-a-refund
  (both accessed 2026-08-06): "You are eligible for a refund if a request is
  filed within 14 days of payment and no credit quota was used in the period
  for which you are seeking the refund." — a specific, actionable 14-day
  conditional entitlement, request by emailing team@elevenlabs.io. These are not
  reconcilable readings of the same policy: one is "no standing refund right,
  discretionary only," the other is "a standing conditional right with a
  14-day window." Per codebook section 2.1 step 3, the source hierarchy ranks
  the Terms of Service above the Help Center for this contractual-variable
  class, so all four variables above are coded from the Terms of Service
  (no_refunds_stated / 0 / not_applicable / terms) rather than coded
  'conflicting' (which is reserved for sources of *equal* authority). This
  disagreement between what ElevenLabs' contract says and what its own support
  documentation tells buyers is recorded here as a finding in its own right per
  codebook section 3, independent of how the hierarchy resolves the coded
  value. No other cross-source conflicts were found in this record (auto-renewal,
  cancellation self-serve, and commercial-use gating all agree across every
  document reviewed).

