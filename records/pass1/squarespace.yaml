coder_note: |
  ENTRY TIER SELECTION (sampling-rules 7.2): default display state = 'Pay annually' toggle
  checked. Eligible candidates (generally available, no sales contact, standing, single-site)
  and annual-equivalent cost: Basic 12 x 12 = 144.00 (SELECTED, lowest); Core 17 x 12 = 204.00
  (lost); Advanced 25 x 12 = 300.00 (lost). Enterprise tier is sales-gated (CONTACT SALES,
  no published price) and excluded per eligibility rule 2. Student-program pricing excluded
  per eligibility rule 1 (named program, not generally available).

  LEGACY / DISCONTINUED PLAN CHECK: a help-center article ("Squarespace website platform
  plans") documents older Personal/Professional/Premium plans and states verbatim "We no
  longer offer website platform plans on our pricing page" -- confirms there is no cheaper
  plan hiding in help docs that is still standing/purchasable; only Basic/Core/Advanced are
  current. Checked specifically because a sibling product in this study had exactly that
  pattern (a cheaper plan documented only in help pages, absent from the pricing page).

  STALE JSON-LD ON THE PRICING PAGE (not used to code any value): the page's own
  schema.org/OfferCatalog JSON-LD lists FOUR plans (basic, core, plus, advanced) including a
  "Plus" tier that does not appear anywhere in the live-rendered page (which shows only three:
  Basic/Core/Advanced). Its USD/US-region Basic offers are "Monthly $25.00" and "Annually
  $228.00" (=$19/mo) -- neither figure matches the live-rendered Basic card in either toggle
  state ($12/mo annual, $19/mo monthly). The live page's own "save up to 36%" banner is
  internally consistent with the RENDERED figures (12/19=0.632, ~37% off; matches "up to 36%")
  but not with the JSON-LD pair (19/25=0.76, ~24% off). The "Using Squarespace AI" help
  article independently corroborates a "Plus" plan exists/existed ("Core, Plus, Advanced
  plans"), so this is not a parsing error on my part -- the vendor's own schema markup on this
  page is stale relative to its live pricing widget. headline_price_usd/first_charge_amount_usd
  were coded from the rendered, prominently-displayed widget per the codebook's decision rule
  ("take the price figure the vendor displays most prominently... in the page's default state
  as it loads"), not from the JSON-LD.

  HIDDEN "SAVE 10% AT CHECKOUT" ELEMENT (not applied to any coded value): the Basic plan
  card's DOM contains a badge element reading "Save 10% at checkout"
  (class pricing-card-basic__badge), present in BOTH the annual and monthly toggle states,
  but rendered with computed style visibility:hidden; opacity:0 by default -- it is not part
  of what a visitor sees without some further trigger (hovering the heading/price area did not
  reveal it; no aria-describedby or tooltip-trigger link to it was found in the DOM). No
  official document states what triggers it, whether it is Basic-specific permanently, or
  what the resulting total would be. Third-party coupon-aggregator pages (uncoded, discovery
  only) show Squarespace runs recurring first-payment-only ~10% promo codes (e.g. "GIMME10"),
  consistent with this being a dormant promo/referral-triggered UI element, but this is not
  confirmed by any official source and was not used to code headline_price_usd or
  first_charge_amount_usd, both of which reflect only the plainly-displayed $12/mo. No
  checkout was opened (prohibited).

  RENEWAL-PRICE GAP (the category-specific finding this study asks for): no official document
  -- not the pricing page, not the ToS, not the "Automatic subscription renewals" help
  article -- states whether the annual renewal charge equals the current $12/mo ($144/yr)
  rate or increases at renewal. The renewal article confirms THAT a charge recurs and gives
  15 days' notice, but is silent on the AMOUNT. $12/mo is presented as Squarespace's standing,
  generally-applicable "Pay annually" price (not marked anywhere as a time-limited new-customer
  rate), so first_charge_amount_usd = 144.00 is coded as the stated current price x 12; the
  absence of a distinct published renewal-rate confirmation is itself recorded here as the
  gap the study is designed to surface, per the task brief for this category.

  DOMAIN: free custom domain is included only on ANNUAL billing and only for the first year
  (FAQPage JSON-LD: "If you purchase an annual plan, you'll receive a free custom domain for
  one year."); the same FAQ is silent on monthly plans receiving any free domain.

  D-003 CURRENCY CHECK (arm 1, vendor's own currency disclosure -- PASSED, non_usd does not
  apply): footer currency control reads "$ USD"; the page's own first-party cookie
  ss_i18n = {"language":"en-US","currency":"USD"} despite the browser's locale being tr-TR
  (Turkey collection point); pricing-page JSON-LD explicitly lists a USD-priced offer
  eligibleRegion:"US" among 27 currencies. All three agree the served/coded figures are USD.

  AI CREDITS vs AI VISIBILITY: the full feature comparison table names two textually distinct
  metered AI allowances -- "AI Credits" (10 one-time / 20 per mo / 120 per mo, Basic/Core/
  Advanced) and "AI Visibility" ("Up to 10 prompt runs (one-time)" / 20/mo / 120/mo). Both are
  quantified in the comparison table but neither has a published per-output conversion rate
  (see credit_unit_defined / credit_to_output_rate_published); the help center points to a
  live in-product-only "Run Cost" field instead of publishing a table.

  blindness: CANNOT truthfully write the clean attestation, disclosing instead. Before
  squarespace-specific coding began, in the course of consulting available tooling, I opened
  records/pass1/nicepage.yaml -- another product's pass-1 record -- to check the
  check_price_arithmetic.py tool's expected record shape. This was against the explicit
  instruction not to open another product's record; record-template.yaml alone should have
  been used, and was sufficient. No squarespace value was copied or influenced by
  nicepage.yaml's content (a different vendor, different figures); no other product's record
  was opened after this was caught, no aitoolspolice.com page or site/content/reviews/ file
  was opened at any point, and no pass-2 material was opened.
conflict_note: "REFUND (resolved as complementary, not incompatible; both are tier-1 authority for contractual variables): https://www.squarespace.com/terms-of-service 9.4 states 'While you may cancel any Paid Services at any time, you won't be issued a refund except in our sole discretion, or if legally required' (generic, applies to all Paid Services) vs the dedicated https://support.squarespace.com/hc/en-us/articles/46051001586701-Website-refund-policy states 'You can request a full refund for annual website subscriptions canceled within 14 days of purchase' (specific, website subscriptions only). Read as the dedicated policy being Squarespace's published exercise of the discretion ToS 9.4 reserves, not a contradiction of it -- a buyer reading both is not given two incompatible answers to the same question. Coded refund_policy_exists=yes / refund_window_days=14 / refund_conditions=conditional from the more specific document rather than coding `conflicting`, since the two are not stating incompatible positions; both URLs recorded here for a reader who weighs this differently. PRICING-PAGE-INTERNAL: the same pricing page's rendered widget and its own embedded JSON-LD schema.org data disagree on Basic's price (see coder_note 'STALE JSON-LD' -- rendered $12/mo annual & $19/mo monthly vs JSON-LD $228/yr & $25/mo); not two distinct official sources of equal authority in the section 6.2 sense (one document, two internal representations), so not coded `conflicting`, but flagged here for transparency since it is a genuine inconsistency in the vendor's own official page."
