coder_note: |
  ENTRY TIER SELECTION (sampling-rules 7.2): three eligible standing, generally-available,
  sales-ungated, single-seat candidates on the live pricing page's default (Monthly) state --
  Hobby $39/mo (annual-equiv $468.00), Growth $99->$39/mo "Best Value"/"Discount locked in
  forever" (annual-equiv $468.00, TIED with Hobby), Ultra $199/mo (annual-equiv $2,388.00,
  eliminated, highest price). Hobby and Growth are genuinely tied at $39/mo. Neither card is
  visually marked as "first paid step" specifically (Growth's "Best Value" is a recommendation
  ribbon, not an entry-tier marker), so the tie goes to the second sampling-rules criterion,
  leftmost/topmost on the page: Hobby is the first (leftmost) card in both visual layout and DOM
  order, Growth is the second/middle card. Hobby wins. Growth is recorded here as the losing
  tied candidate with its annual-equivalent figure per sampling-rules 7.2.

  CURRENCY (protocol D-003/D-007): live read from this Turkey-egress environment served EUR
  (confirmed via /api/stripe/checkout-currency -> {"currency":"eur"}, i.e. geolocation-driven,
  not a vendor USD-absence policy). No vendor currency selector or currency statement exists on
  the pricing page itself (arm 1 empty). Arm 2 (US-crawled archive capture) succeeded clearly:
  a fresh https://web.archive.org/save/ submission of the live pricing page, made during this
  session, returned a same-day snapshot (web.archive.org/web/20260813150947) showing the
  identical plan grid in USD ($39/$99->$39/$199), and an independent prior capture from
  2026-08-07 shows the same USD figures under an older headline. Per D-003/D-007, the USD figure
  is coded as headline_price_usd / first_charge_amount_usd, and the EUR state is logged as a
  display_variant register event, not as non_usd.

  CONFLICT -- see conflict_note for the full comparison. In short: the official FAQ (dated
  "Last updated: June 2026") names a Growth/Elite/Ultra plan structure with no "Hobby" tier at
  all, while the live pricing page (accessed 2026-08-13) names a Hobby/Growth/Ultra structure
  with no "Elite" tier. Growth and Ultra's price/credit figures agree across both documents.
  Coded from the live pricing page per protocol 6.2 (pricing variables: live page ranks first).
  One consequence: Hobby's usage allowance is unpublished not just on the pricing page but in
  every official document located, because the FAQ and the features page's plan descriptions
  both predate/exclude Hobby entirely -- this is the basis for usage_cap_quantified = unknown
  and cost_per_output_computable = no on the entry tier.

  TOGGLE INTERACTION LIMIT: the "Annually" pill did not visibly change the active-class
  highlighting or the displayed prices across three attempted clicks (via ref and via
  coordinate, including one immediately re-verified with no wait). annual_default_toggle is
  nonetheless soundly established from the page's LOAD state per protocol 6.8 rule 1 (that is
  what the variable requires), which does not depend on the toggle being clickable. The FAQ
  independently states "Yearly billing is roughly 17% cheaper," confirming an annual option
  exists and is cheaper, even though this coder could not get the live control to visibly
  respond; not used as a coded figure since it is a docs-class approximation, not the pricing
  page's own annual-state display.

  BROWSER TAB HYGIENE DISCLOSURE: while looking for a vendor blog post on credit costs, this
  coder mistakenly issued one `navigate` call against tab-3, a shared-pane tab this coder did
  not open (it was showing wix.com, presumably another concurrent collector's tab), sending it
  to https://www.revid.ai/blog. Caught immediately after the one call; tab-3 was not read,
  clicked, or navigated again, and no value in this record was coded from anything seen in that
  tab. Disclosed per the instruction to report tab-hygiene incidents plainly. All substantive
  work used tab-10, opened by this coder via tabs_create.

  Every non-`unknown`, non-`not_applicable` value above traces to an explicit quoted statement
  in one of the four sources listed. No calculation was performed (cost_per_output_computable
  is no), so no arithmetic appears here beyond the annual-equivalent tie comparison above.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Official FAQ (https://www.revid.ai/faq, page states 'Last updated: June 2026') vs live pricing page (https://www.revid.ai/pricing, accessed 2026-08-13), both official sources. FAQ: 'Growth: $39/month (2,000 credits) -- the most popular. Elite: $89/month (5,000 credits, voice cloning, 5 Auto-Mode workers). Ultra: $199/month (12,000 credits, 10 Auto-Mode workers).' -- no Hobby tier named anywhere in the FAQ (also references an 'Elite plan' for voice design and '5 on Elite' for Auto-Mode workers, so this is not an isolated typo). Live pricing page: HOBBY $39/mo (credits unstated) + GROWTH $99 struck through to $39/mo, Best Value, Discount locked in forever (2,000 credits) + ULTRA $199/mo (12,000 credits) -- no Elite tier named anywhere. Growth and Ultra figures agree across both documents (same $39/2,000cr and $199/12,000cr respectively); Hobby and Elite each appear in only one of the two documents. Per protocol 6.2, pricing variables are coded from the live pricing page (higher-ranked for this variable class); this record's entry tier (Hobby) and its variables are coded accordingly, and this disagreement is reported per codebook 2.1/section 3 even though the hierarchy resolves it cleanly. The features page (https://www.revid.ai/features) independently restates the Growth figure ('Our most popular plan starts at just $39/month and includes 2,000 credits') without naming Hobby either, consistent with the FAQ side of the conflict but not contradicting the live page's addition of a Hobby tier."
