conflict_note: |
  TWO conflicts found, both between Terms of Service and the dedicated Refund Policy page - two
  official sources tied at rank 1 for contractual variables under protocol-v1.md section 6.2.
  (1) refund_policy_exists: Terms of Service, General Payment Terms - "Unless otherwise specifically
  provided for in these Terms, all fees are...non-refundable, except as required by law."
  (https://www.aragon.ai/terms) vs. Refund Policy - "we are more than willing to offer a
  complimentary redo or a 100% refund"; "Full refunds are available for all Aragon subscription
  tiers under the following conditions." (https://www.aragon.ai/refund-policy). The Terms document
  does not itself elaborate a refund section or incorporate the Refund Policy by cross-reference
  (only a footer nav link connects them). Coded conflicting per codebook section 2.1 step 3 (equal
  rank, hierarchy does not resolve).
  (2) cancellation_self_serve: Refund Policy - "You may cancel at any time through your account
  dashboard." (https://www.aragon.ai/refund-policy) vs. Terms of Service - "You may cancel the
  Subscription Service by contacting us at support@aragon.ai. Subscription modification or
  cancellation requests submitted via email must be sent from the email address associated with
  your Aragon Account...you may be asked to verify your identity..." (https://www.aragon.ai/terms).
  Neither document acknowledges the other's route. Coded conflicting on the same equal-rank basis.
  Both conflicts point the same direction: the Terms of Service (last updated 03/17/2026) reads as
  stricter/more defensive boilerplate than the customer-facing Refund Policy and support messaging,
  which is itself a notable disclosure-consistency finding for this product.
coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md 7.2): Default display state = Headshots tab / Individual
  Pricing sub-tab (see default_display_state for full reasoning on why the Subscription and Teams
  Pricing tabs are excluded - they are not part of the default display state, and independently did
  not render via automated interaction in this session, consistent with a console-visible React
  hydration error). Eligible candidates read in that state: Basic $18.00 (winner), Standard $25.00
  (annual-equivalent n/a - one-time purchase, so its own price stands: 25.00), Executive $40.00
  (one-time price: 40.00). All three are standing packages (not limited-time promotional plans in
  themselves; only the "20% off" discount is framed as time-limited, per rule 3's plan-vs-price
  distinction - see headline_price_usd evidence). Even if the (excluded) Subscription tab's lowest
  tier, Aragon Lite at $15.00/month, were included in the comparison, its annual-equivalent
  ($15 x 12 = $180.00) would still exceed Basic's one-time $18.00, so the exclusion is not
  outcome-determinative.
  MIXED COMMERCIAL MODEL: Aragon AI sells three parallel tracks - (a) one-time headshot packages
  (Basic/Standard/Executive, our entry tier, denominated directly in headshot counts, not credits),
  (b) monthly/annual credit-based subscriptions (Aragon Lite/Pro/Ultimate/Creator, discovered via
  the pricing page's own embedded schema.org JSON-LD since the visual "Subscription" tab does not
  render), and (c) a limited, ongoing free tier. Entry-tier-scoped variables (first_charge_amount_usd,
  mandatory_addon_present, usage_cap_quantified, cost_per_output_computable, trial_length_days,
  refund_window_days, per codebook section 5.2) are coded against track (a) only. Product-level,
  non-entry-tier-scoped variables (credit_system_present, credit_unit_defined,
  credit_to_output_rate_published, credit_rollover_policy, auto_renewal_default, free_plan_*, etc.)
  are coded against the product as a whole, which does document a credit system, free tier, and
  auto-renewing subscriptions even though the entry tier itself uses none of those constructs
  directly.
  INSTRUMENT-GAP FLAG: free_plan_cap_value coded unknown as the closest available value where
  free_plan_cap_documented=none_quantified leaves nothing quantified to record; the variable's value
  list has no explicit "no quantified value exists" option distinct from unknown. Flagged for
