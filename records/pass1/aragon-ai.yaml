default_display_state: |
  Pricing page (https://www.aragon.ai/pricing) loads on the "Headshots" top-level tab (one-time
  packages) with "Individual Pricing" sub-tab active, no interaction required: three cards shown,
  Basic $18 (list $35 struck through), Standard $25 (list $45), Executive $40 (list $75), under a
  page-wide "20% off all packages limited time only!" banner. This is the state read for all
  entry-tier and default-state-anchored variables. A second top-level tab "Subscription" and a
  second sub-tab "Teams Pricing" are present but did NOT change rendered content across repeated
  click attempts in this session (ref-based clicks, coordinate clicks, and synthetic DOM events all
  tried; button active-state class never changed from "Headshots"/"Individual Pricing"); browser
  console showed a React hydration error ("Minified React error #418"), consistent with a
  client-side rendering bug leaving these tabs inert. The Subscription tier data (Aragon Lite
  $15/mo, Pro $29/mo, Ultimate $49/mo, Creator $249/mo) was recovered from the SAME page's own
  embedded schema.org JSON-LD (official structured data on the same URL, not a different/third-party
  source) and used only as corroborating product-wide evidence (credits, free-tier references, per
  codebook section 5.2's non-entry-tier variables) - never for entry-tier price selection, per
  sampling-rules.md 7.2 rule 1 ("do not switch the billing toggle to find a cheaper figure"). No
  cookie-consent banner appeared on any page read (home, pricing, terms, refund-policy, support,
  free-headshot-generator, headshots-for-teams). Read at desktop viewport 1440x1000.
  GEOGRAPHY FLAG: the site's home page (https://www.aragon.ai/), as rendered in this browser
  session (screenshotted), displayed a promotional banner reading "Local pricing is live: Aragon AI
  is now priced for your region." and carries a region/language selector (globe icon) in its nav -
  official, vendor-published evidence that pricing may vary by inferred geography, i.e.
  protocol-v1.md section 6.8's geography case. (Note for reproducibility: a plain non-JS curl fetch
  of the same URL, taken separately as a local backup copy, does not contain this banner's text -
  consistent with it being injected client-side after a geo-detection call, i.e. further evidence
  the localization is dynamic/request-dependent rather than static markup, not a contradiction of
  the sighting.) Only one state was observed and archived in this pass (USD figures as recorded
  below); this coder did not witness a second state across repeated reads of the same URL, so no
  section-6.8-rule-3 register_event is logged, but the finding is flagged here for adjudication and
  for comparison against the pass-2 coder's read.
