coder_note: |
  Entry-tier selection (sampling-rules 7.2): eligible paid candidates on the membership-plan
  page (default Monthly display state) were Standard, Pro, Premier, Ultra (Basic is $0, not a
  paid candidate). Annual-equivalent = monthly headline figure x12: Standard 6.99x12=83.88
  (WINNER, lowest); Pro 25.99x12=311.88 (lost); Premier 64.99x12=779.88 (lost); Ultra
  127.99x12=1535.88 (lost). No seat-block or student/nonprofit-restricted plans present.

  cost_per_output_unit = other: unit named is "per 720p video" (a discrete generation, not a
  duration) -- the pricing page states allowances as "N images / M 720p videos" with no stated
  clip length in seconds or minutes in any official document read (pricing page, payment-policy,
  user-policy, point-policy), so per_video_minute could not be applied without an unsourced
  assumption.

  trial_exists / trial_length_days judgment call: the only official documentation of a
  time-limited trial is the Credits Policy (point-policy) row "7-Day Trial Membership Credits:
  Credits are granted immediately upon activation of the Membership subscription ... Valid for
  7 days". This construct is NOT surfaced as a distinct option on the rendered membership-plan
  pricing page (which shows only Basic/Standard/Pro/Premier/Ultra with no "trial" button or
  tier), and no document states which tier it attaches to, whether a card is required, or
  whether/how it converts. Coded trial_exists=yes and trial_length_days=7 because an official
  document affirmatively names and dates the construct (a determinate documented fact per
  codebook section 2.1 step 2); trial_card_required and trial_auto_converts coded unknown
  because no document settles them. A later adjudicator may wish to weigh whether this
  officially-documented-but-not-surfaced-on-the-pricing-page construct should instead be treated
  as unknown; flagging for visibility rather than silently picking one reading.

  unquantified_limit_clause / usage_cap_quantified judgment call: payment-policy 2.6 authorizes
  "restricting login, restricting use, suspending or terminating your use of the Services based
  on your excessive usage" with no number given, introduced in the context of a device-login-count
  limit. Read as a general discretionary usage clause (matching the codebook's "excessive use"
  example verbatim) and applied under usage_cap_quantified rule 3 to mark the Standard tier's
  "Queue unlimited tasks" claim as not fully quantified, consistent with the codebook's own
  Vendor U worked example (a general fair-use clause marks down an unrelated "unlimited"
  feature claim). Flagging the device-login framing for a later reader/adjudicator to review.

  Site selection: klingai.com (frame's vendor_home_url, bare root) auto-redirected on load to
  https://klingai.com/cn/ (Chinese-language regional site) for this Turkey-egress session --
  an inferred-geography default-display-state variant per protocol-v1.md section 6.8. Per the
  assignment instruction, coded from the English global site instead, reached by manually
  navigating to https://klingai.com/global/ (confirmed identical in structure to /cn/ aside
  from language/region). Logged as a register_event below.

  D-003 currency check (mechanical, run before concluding no currency issue applies): plain
  curl with `-H "Accept-Language: en-US,en;q=0.9"` against klingai.com/pricing and
  kling.ai/pricing returned no non-USD figures; the rendered read of the actual English global
  membership-plan page also showed all prices natively in USD with no locale toggle. non_usd
  was never triggered, so no currency variable needed it; recorded here per instruction to log
  the check itself.

  Other context, not used for coding: klingai.com/global/dev/pricing is a separate "API
  Platform" product (developer credit packages sold as "Units", e.g. $700/5000 units for
  video) with its own distinct pricing, unrelated to the consumer membership Credits priced
  here ($1 USD = 66 Credits per point-policy). Opened for orientation only; no coded value
  is sourced from it.

  blindness: no other record, no review page, no pass-2 material was opened.

  D-009 re-read 2026-08-10: re-opened https://app.klingai.com/global/membership/membership-plan
  live and confirmed entry_tier_name (Standard), headline_price_usd ($6.99),
  headline_billing_basis (per_month_billed_monthly) and first_charge_amount_usd ($6.99) in a
  SECOND representation independent of the original innerText transcript: a structural DOM query
  pairing each .membership-plan-sgp card with its own .price div and feature line (Standard's
  card carries "660 Credits per month", matching the original record), plus a screenshot as a
  third, visual representation. Confirmed the Monthly tab carries the "tab-active" class (Yearly
  does not) before any interaction. Confirmed 0 <sup>/<sub> elements exist anywhere on the page.
  Confirmed the $6.99 first-subscription price and the $8.80 ongoing renewal rate are two
  structurally distinct DOM nodes (a "Discount only for the first subscription" span versus a
  separate "Next monthly renewal: $8.8" div), so first_charge_amount_usd=6.99 is not a misread of
  the renewal figure. Evidence saved to
  kling-ai-sources/d009-second-representation-2026-08-10.txt. No correction; all four scoped
  values confirmed as coded.
