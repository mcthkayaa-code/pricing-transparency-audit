      abuse-threshold, or vendor-discretion throttling clause found. §6 lists
      prohibited *conduct* (reverse-engineering, reselling, scanning without
      permission) which per rule 3 does not trigger `present`. §13's
      termination-for-harm clause is conduct-based, not a volume/intensity-of-
      use clause. §7's "rate limits specified in your plan documentation" only
      applies to API access, which is Agency-only and not part of the entry
      tier, and states limits are specified (quantified) elsewhere rather than
      left to discretion.

coder_note: >
  Entry-tier selection (sampling-rules.md 7.2): eligible paid candidates and
  their annual-equivalent single-seat cost, all read in the Monthly default
  display state and annualized ×12 — Starter $29/mo = $348.00/yr (WINNER,
  lowest); Pro $79/mo = $948.00/yr; Business $149/mo = $1,788.00/yr; Agency
  $199/mo (base 5-brand self-serve rate; "Custom" >100 brands is sales-gated
  via a mailto link but the named Agency tier itself is not) = $2,388.00/yr.
  "FOR SOLO FOUNDERS" on the Starter card is audience-framing marketing copy,
  not a verification-gated restriction (no proof of status required, unlike
  the codebook's own "verified students" example), so Starter stayed
  eligible. Free ($0) is not a paid-tier candidate.

  Assignment/frame discrepancy: this task's assignment string gave
  vendor_home_url = https://brandcited.com. That domain resolves to a GoDaddy
  "domain for sale" parking page (title: "brandcited.com is for sale — Buy
  for 2.960,00 $, Lease, or Offer"), unrelated to the product. The frozen
  frame (frame-frozen-2026-08-04.csv, the authoritative source under
  sampling-rules.md §3) lists vendor_home_url = https://www.brandcited.ai for
  product_id brandcited — confirmed via web search as the actual live
  BrandCited product (title "BrandCited — AI Visibility Intelligence for
  Growth Teams"). All coding in this record uses brandcited.ai per the frame;
  brandcited.com was never used as a source.

  Vendor documentation inconsistency (not itself a coded variable): the
  Refund Policy page's "Monthly plans" section names the four paid tiers as
  "Starter, Growth, Pro, Agency" — but the live pricing page's third paid
  tier is named "Business", not "Growth". Reads as a stale rename not fully
  propagated to the refund page. Does not block coding since all four
  current paid tiers are still covered by "every paid plan" / the named list
