conflict_note:
  - id: trial_exists_vs_faq
    variables_affected: [trial_exists]
    summary: >
      Dedicated FAQ page (docs, rank 2 for trial terms) states: "How much does
      BrandCited cost? ... all plans come with a free trial period so you can
      see results before paying." No other document corroborates a trial:
      the pricing page (rank 1, higher authority for trial terms per
      protocol-v1.md 6.2) exhaustively describes try-before-committing via a
      money-back guarantee instead ("100% RISK-FREE / Try BrandCited
      risk-free ... we refund every cent"), a permanent free plan, and direct
      "Get Started" purchase CTAs — never mentioning a trial. ToS §4 and the
      Refund Policy page describe only "purchase", "initial charge", and
      "renewal", with no trial-to-paid conversion mechanic. Coded
      trial_exists = no from the higher-ranked pricing page per
      codebook-v1.md 2.1 step 3 (hierarchy resolves in favor of the higher
      source when ranks are unequal); this note preserves the contradicting
      claim rather than silently discarding it.
    urls:
      - https://www.brandcited.ai/pricing
      - https://www.brandcited.ai/faq

  - id: free_plan_scan_frequency
    variables_affected: [free_plan_cap_documented, free_plan_cap_value]
    summary: >
      Pricing page (rank 1) states, repeatedly (hero stat block, Free plan
      card, and feature-comparison grid row "Scan frequency: Free=Daily"),
      that the Free plan runs a "Daily automated scan". The dedicated FAQ
      page (docs, rank 2) states twice, independently, that the free plan is
      "one monthly scan" / "one brand scan per month". Coded from the
      pricing page (daily) per hierarchy; both figures preserved here.
    urls:
      - https://www.brandcited.ai/pricing
      - https://www.brandcited.ai/faq

  - id: paid_tier_scan_cap_language
    variables_affected: [usage_cap_quantified]
    summary: >
      Pricing page (rank 1) states Starter (entry tier) runs a "Daily
      automated scan" — a quantified rate (1/day). Dedicated FAQ (docs, rank
      2), answering "Can I try BrandCited for free?", states "Paid plans
      unlock unlimited scans" — an unquantified characterization for the same
      tiers. Coded from the pricing page (daily, quantified) per hierarchy.
    urls:
      - https://www.brandcited.ai/pricing
      - https://www.brandcited.ai/faq

  - id: refund_policy_three_way
    variables_affected: [refund_policy_exists, refund_window_days, refund_conditions, refund_policy_location]
    summary: >
      Three official documents state three different refund positions for
      the entry tier's observed billing state (Starter, monthly, default
      display state). (1) ToS §4 (rank 1, contractual): "We don't prorate
      partial periods or issue refunds for unused time on monthly plans. For
      annual plans cancelled within 14 days of initial purchase, contact
      hello@brandcited.ai for a pro-rated refund — this is evaluated case by
      case." — i.e. no refund for monthly; case-by-case pro-rated refund for
      annual only. (2) Dedicated Refund Policy page (rank 1, tied with ToS):
      "Monthly plans (Starter, Growth, Pro, Agency) are refundable in full if
      requested within 14 days of the initial charge ... no questions asked."
      Annual: "the same 14-day no-questions refund. After 14 days, annual
      plans are refundable on a prorated basis minus a 10% administrative
      fee." — i.e. yes, 14 days, unconditional, on every plan including
      monthly. (3) Pricing-page FAQ (rank 3, lower authority, included for
      completeness though not part of the equal-rank determination): "Do you
      offer refunds? Yes. Try BrandCited risk-free — if it does not move your
      AI visibility in the first month, email hello@brandcited.ai and we
      refund every cent." — a ~30-day, performance-conditional framing
      matching neither of the other two. Sources (1) and (2) are of equal
      authority (protocol-v1.md 6.2 names "terms of service OR the dedicated
      policy page" jointly as contractual rank 1) and directly conflict on
      whether a monthly-billed entry-tier buyer gets any refund at all (no
      vs. yes-14-days), so codebook-v1.md 2.1 step 3's equal-rank branch
      applies: coded `conflicting` on refund_policy_exists, refund_window_days
      (0 vs 14), refund_conditions (conditional/none vs. unconditional), and
      refund_policy_location (terms vs. dedicated_refund_page).
    urls:
      - https://www.brandcited.ai/terms
      - https://www.brandcited.ai/refund
      - https://www.brandcited.ai/pricing

computation_assumptions: >
  Starter (entry tier): $29/mo, Monthly default display state (toggle
  preselected, confirmed aria-checked). Allowance: 1 brand tracked (same
  pricing-page source). Same period, no conversion needed. 29.00 / 1 = 29.00
  USD per brand-month (unit=other: brand tracked per month).

