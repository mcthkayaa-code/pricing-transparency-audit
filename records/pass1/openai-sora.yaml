coder_note: |
  ENTRY TIER: no eligible entry-tier candidate could be identified. Three official surfaces
  were checked and each was rejected as a source for headline_price_usd/entry_tier_name:
  (1) sora.com / sora.chatgpt.com, the product's own domain (vendor_home_url) -- never
  displayed a public pricing/plan table; the app itself is login-gated and no crawled
  archive.org snapshot pre-dating the post-shutdown state shows anything but the app shell.
  (2) chatgpt.com/pricing, archived 2026-04-20 (6 days pre-shutdown) -- does not list
  Sora/video generation as a feature of any plan (Free/Go/Plus/Pro/Business/Enterprise) in
  either the plan cards or the full feature-comparison grid. "Sora" appears once only, as an
  unrelated footer nav link to a separate product section.
  (3) openai.com/sora/, the product's own marketing page, archived 2026-04-20 -- pure
  capability marketing (video realism, Characters, remix, sound), zero pricing/plan/credit
  content, no pricing link; only CTAs are "Login" (sora.chatgpt.com) and a research-post link.
  The one document that most plausibly would have stated entry-tier terms, help.openai.com's
  "Sora - Billing FAQ" (found via WebSearch as a discovery lead only, title "Sora - Billing FAQ
  | OpenAI Help Center"), returns HTTP 404 live and its only recoverable archive.org capture
  (2026-06-13) is an empty client-rendered app shell with no article text -- unrecoverable
  within this session's 2-attempt effort cap.
  Given none of the three eligible-candidate-determining surfaces publish a plan/price, and the
  document that would define the credit-based access mechanism cannot be read, the entry-tier
  variables (headline_price_usd, entry_tier_name, headline_billing_basis,
  first_charge_amount_usd, mandatory_addon_present, usage_cap_quantified,
  cost_per_output_computable, trial_length_days, refund_window_days-as-entry-tier-figure) are
  coded per the reasoning in each variable rather than left silently blank. No candidate plan
  is recorded as "losing" because none could be identified as eligible in the first place
  (sampling-rules.md 7.2 default is to list losing candidates; here zero were identifiable, so
  that requirement is satisfied by this statement).
  credit_system_present is coded "yes" on positive evidence (Sora discontinuation FAQ:
  "purchased ChatGPT/Sora credits can still be used for Codex"; corroborated by the Terms of
  Use "Service credits" clause), which is why entry_tier_name/headline_price_usd are coded
  "unknown" rather than "not_applicable": a paid access mechanism is documented to have
  existed; its structure and price are simply not published in any document this session
  could reach.

  API PRICING (context only, per assignment instruction -- NOT used as headline_price_usd):
  OpenAI's developer API prices the Sora 2 model at $0.10/sec (Sora 2 Pro $0.30/sec) at
  720x1280/1280x720, confirmed directly at https://developers.openai.com/api/docs/models/sora-2
  (official first-party source, not the earlier third-party estimate). This is a separate
  developer/B2B surface outside this study's individual/small-team consumer frame
  (sampling-rules.md section 4, I2), and it was not the only generally-available purchase path
  even before the consumer shutdown, since the consumer app had its own separate (if
  undocumented) credit mechanism running in parallel. Not used for headline_price_usd.

  PRODUCT STATUS RE-CHECK (codebook section 6: product_status is "re-checked at collection"):
  this record codes product_status = discontinued, NOT the "active" value carried in the
  frozen frame row (frame-frozen-2026-08-04.csv, frozen 2026-08-04). Two independent official
  first-party sources, both read today, agree: (a) sora.com itself, the frame's own
  vendor_home_url, currently reads only "Sora is no longer available. You can export your data
  at any time."; (b) OpenAI Help Center, "What to know about the Sora discontinuation": "The
  Sora web and app experiences were discontinued on April 26, 2026. The Sora API will be
  discontinued on September 24, 2026." Coded per protocol section 6.2's explicit rule for
  exactly this situation: "A product discovered to have shut down during the window is moved
  to discontinued and the move is dated." recheck_date is left not_applicable because that
  field is reserved for protocol section 6.6's later final-day mid-window re-check mechanism, a
  different step than this initial discovery; this note plus the two source citations are the
  record of the discovery and its date (2026-08-10), for the responsible human to action the
  frame-file update under sampling-rules.md section 10 item 3. All entry-tier and pricing
  variables are coded from archived materials reflecting Sora's last reachable pre-shutdown
  state, per the discontinued-stratum procedure, not from a current offering that no longer
  exists.

  THIRD-PARTY LEADS NOT USED AS EVIDENCE: early WebSearch results (SEO/blog aggregator sites --
  laozhang.ai, eesel.ai, glbgpt.com, aipricing.guru) claimed "ChatGPT Plus subscribers get Sora
  access with monthly limits" and gave mutually inconsistent discontinuation narratives. These
  were used only to locate official URLs and as a rough magnitude check on the API rate, never
  to justify a coded value, per protocol section 6.3(7). The chatgpt.com/pricing archived
  capture directly contradicts the "bundled into Plus" claim for the last pre-shutdown state,
  which is exactly why third-party pages are treated as discovery aids only.

  LOCALE OBSERVATION: our network egresses from Turkey. openai.com/policies/terms-of-use/
  auto-redirected to /tr-TR/ (Turkish) by default; read instead via the page's own language
  selector to /en-US/, a same-document, permitted action (equivalent to switching a billing
  toggle). help.openai.com article "Updated" timestamps rendered in Turkish ("... once"). The
  D-003 currency check was not triggered because no USD or non-USD price figure was ever
  located on any surface for this product to compare across locales -- headline_price_usd is
  "unknown" outright, not "non_usd", so there is no currency figure for D-003 to check.

  UNIT NOTE: cost_per_output_unit is coded per_video_minute as the closest fit among the fixed
  value list for a video-generation product; Sora's actual metering (credits per generation,
  duration/resolution-dependent per the discontinuation FAQ and Terms of Use "service credits"
  clause) does not cleanly reduce to a minute rate on the evidence available, but no other
  listed unit fits better and "other" would discard the category information the fixed list
  exists to carry.

  A-012: not applicable to this record. No official document found described a paid,
  time-limited introductory price for Sora (e.g. a low-cost N-day intro that auto-converts to a
  higher recurring rate); the documented credit-purchase mechanism is not described as
  time-limited or introductory in any recoverable source.

  blindness: no other record, no review page, no pass-2 material was opened.

  D-009 re-read 2026-08-10 (discontinued-stratum procedure: confirm against the archived
  materials already cited, do not hunt a live page): re-fetched both archive.org captures this
  record's entry-tier variables rest on. chatgpt.com/pricing (2026-04-20 capture): "Sora"
  confirmed to appear exactly once, only as a footer nav link, in a fresh read today. openai.com/
  sora/ (2026-04-20 capture): confirmed zero "$" characters and zero pricing/plan/credit keywords
  anywhere in its 976-character body, in a fresh read today. Both reproduce the original coder's
  finding independently. A one-shot status probe of the previously-404 Sora Billing & Credits FAQ
  now returns HTTP 403 rather than 404 (likely a bot-protection artifact of a headerless request,
  not the article reappearing); noted for transparency only, not acted on, per the instruction
  not to hunt a live page for this product. Evidence saved to
  openai-sora-sources/d009-second-representation-2026-08-10.txt. No correction; all four scoped
  values (entry_tier_name, headline_price_usd, headline_billing_basis,
  first_charge_amount_usd, all `unknown`) confirmed as the correct reading.

conflict_note: >
  Refund position conflicts between two official sources of unequal rank for the contractual
  class (Terms of Use ranks first, help center second, per protocol section 6.2). Terms of Use
  (https://openai.com/policies/terms-of-use/): "Payments are non-refundable, except where
  required by law." ChatGPT billing help center
  (https://help.openai.com/en/articles/7232895-how-do-i-request-a-refund-for-my-chatgpt-subscription),
  which OpenAI's own Sora discontinuation FAQ explicitly points buyers to for refund questions:
  "Accidental purchases are generally eligible for a refund if you contact us within 14 days of
  the charge," plus stated regional rights ("If you live in the EU, UK, or Turkey, you are
  eligible for a prorated refund if you cancel your subscription within 14 days of purchase";
  Korea: full refund within 7 days). Coded from the higher-ranked Terms of Use per codebook
  section 2.1 step 3 (refund_policy_exists = no_refunds_stated, refund_window_days = 0); the
  help-center figures are what would apply in practice for most buyers and are preserved here
  in full so the disagreement is not lost.

