coder_note: |
  ENTRY TIER: Pro ($25/month billed monthly, default display state; $12/mo shown only via a
  separate "Annual" link, not a toggle). Losing/excluded candidates -- Free: $0/mo, not a paid
  tier, not a candidate. Enterprise: sales-gated ("Contact Us" / "Get started"->/teams,
  "Contact Us"->/contact?enterpriseplan=True; no direct Subscribe button) AND "Starts at 10
  seats" so no single-seat variant exists -- excluded on both eligibility grounds
  (sampling-rules 7.2 criteria 2 and 4); published rate $15/seat/month x 10-seat minimum was
  not usable as an entry-tier figure for either reason. API: "Metered"/usage-based, no flat
  seat price on the pricing page to annualize; sampling-rules 7.2 item 5 reserves usage-based
  comparison for when it is the ONLY paid option, which it is not here since Pro is a standing
  eligible seat plan -- excluded, not separately priced out.

  SCOPING JUDGMENT (product is "Sapling AI Detector" per the frame, category AI detector):
  free_plan_exists / free_plan_cap_* are coded from the detector's own free public checker
  (2000 chars/query, no account or sign-in required per a full-page keyword search finding
  zero occurrences of "account" or "sign in"), NOT the suite's separate $0/mo "Free" plan
  (whose feature column does not list detector access at all -- only Pro+ show "AI detector
  (longer queries)"). cost_per_output_unit / credit_system_present are scoped to the consumer
  Free/Pro/Enterprise plans; the separate "Metered" API plan (docs/api/pricing) was not
  independently fetched since it is not the entry tier and does not change the entry-tier
  determination.

  E1/E2/E3 (commercial_use_lowest_tier, watermark_removal_tier, output_ownership_statement)
  coded not_applicable: the detector's principal output is a probability score (e.g. "Fake:
  73.6%") plus a shareable certificate, not a media/creative artifact. watermark_removal_tier's
  own codebook definition names "a detection score" as its not_applicable example verbatim, and
  the ToS has no defined "Output" term or clause addressing detection results (only Service-IP
  ownership and a license over the user's INPUT content, which is a different question).

  usage_cap_quantified = some_quantified: Pro's detector cap (100,000 characters/query) is a
  specific quantified number; Pro's "Unlimited" snippets and "Unlimited use on premium domains"
  (pricing-page comparison table) are qualified by the ToS Acceptable Use Policy's discretionary
  clause (quoted under unquantified_limit_clause), which per codebook 5.1/rule 3 means an
  "unlimited" claim does not count as quantified.

  TOOLING-MISREAD CAUGHT (our reader error, not a vendor display_variant): an initial WebFetch
  pass on /ai-content-detector fabricated a "Pro=50,000 / Enterprise=100,000" character-limit
  split. Corrected against verbatim document.body.innerText: "Pro and Enterprise Sapling
  subscribers can paste texts of up to 100,000 characters" -- both tiers share the SAME 100,000
  figure; no 50,000 figure exists anywhere in the source. Every money/cap value in this record
  was confirmed in a second representation: accessibility-tree heading text + full-page
  screenshot for the $25/$12 prices, the Subscribe payment-dialog text for the $25/month first
  charge, and document.body.innerText keyword-context search for the detector caps and the ToS
  clauses.

  ARCHIVAL: web.archive.org/save returned a stale capture (not today's date) on both attempts
  for /pricing (redirected to a 2026-07-16 capture) and /ai-content-detector (redirected to a
  2026-07-20 capture); local copies saved to sapling-sources/ instead (archive_status =
  local_copy_only for both). /tos and /billing_faq archived successfully today (2026-08-12);
  see sources list for both snapshot URLs.

  Frame row spot-checked against https://sapling.ai at collection: category "AI detector" and
  product_status "active" both still accurate; no correction needed.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "cancellation_self_serve: ToS Section 3.3 (https://sapling.ai/tos) states \"You may cancel the Subscription Service by contacting us at: support@sapling.ai\" (contact_required). The billing FAQ (https://sapling.ai/billing_faq, help center -- second-ranked source for contractual variables) states \"Please sign in and visit https://sapling.ai/dashboard-billing and click Manage billing. There you can manage your billing information and subscription\" -- describing a self-serve dashboard/Stripe-portal route with no mention of contacting support. Coded contact_required from the ToS per protocol 6.2's hierarchy (terms of service ranks above the help center for contractual variables); both URLs and quotes recorded here per codebook section 3."
