coder_note: |
  ENTRY TIER SELECTION (sampling-rules 7.2): default display state on page load is the
  "Subscription" toggle (not "License"), all four paid tiers billed annually only. Eligible
  candidates and annual-equivalent cost: Personal 6.75 x 12 = 81.00 (SELECTED, lowest);
  Business 12.75 x 12 = 153.00 (lost); Pro 18.75 x 12 = 225.00 (lost); Ultimate 31.75 x 12
  = 381.00 (lost). All four are generally available, purchasable without contacting sales,
  standing (non-promotional), single-seat. Business carries a "Popular" ribbon but that is
  irrelevant here since the tiebreak rule only applies when annual-equivalent costs are
  equal, which they are not.

  ONE-TIME "LICENSE" OPTION (assignment note - not used for entry-tier selection because
  it is not the page's default-loaded state, per protocol 6.8/sampling-rules 7.2 rule 1
  "do not switch the billing toggle to find a cheaper figure"): Nicepage also sells a
  one-time "License" via the same toggle: Personal $89, Business $169, Pro $269, Ultimate
  $439 (embedded JSON baseLicensePrices, cross-checked against FAQ3's prose description).
  License = lifetime desktop-app access + one year of updates + one year of the online
  Subscription services (hosting, forms, domains); after year one, the app stays usable
  for life but online services drop to the free Starter Plan (FAQ3/FAQ4). This is a
  materially different product shape (one-time vs recurring) from the Subscription entry
  tier coded above.

  PROMO VS LIST PRICE (assignment note): the page's JS contains a dormant "Last Sale Day!"
  discount template and hidden ".discount-price" elements (display:none by default) plus a
  live "Enter promo code" coupon field, but none were active/applied on this read (no
  coupon entered, per the documents-only rule - entering one would not be reading a
  document). The $6.75/$12.75/$18.75/$31.75 figures recorded above are the vendor's
  undiscounted default list prices, not a promotional price.

  PRICE-READING METHODOLOGY FINDING: a naive WebFetch summary AND a raw DOM
  .innerText read both flatten this page's "$6<sup>75</sup>/mo" (dollars-big,
  cents-superscript, no decimal point) markup into "$675/mo" - a 100x misread. Verified
  via (a) the embedded JS JSON (baseSubscriptionPrices.personal = "6.75"), (b) the raw
  server-rendered HTML markup itself, and (c) a visual screenshot. This is NOT a
  currency/geo artifact: the page's JS was grepped for currency/country/exchange-rate
  logic and none exists; a US-Accept-Language curl fetch (D-003) returned byte-identical
  markup to the default fetch. No non_usd finding applies. Full detail in
  nicepage-sources/premium-rendered-and-raw.txt.

  COOKIE BANNER: presented only an "Accept" button (no visible "decline"/"manage
  preferences" control). Clicked Accept during the browser session, but only after all
  coded pricing/feature-grid values had already been captured via a cookie-agnostic
  static curl fetch and a pre-click DOM read, so no coded value depends on post-consent
  page state.

  REFUND CONFLICT (judgment call): /terms and /agreement are both nominally "terms of
  service or dedicated policy page" class documents (protocol 6.2) with no codebook
  tiebreak between a "Terms of Use" page and a "License Agreement" page, and they state
  incompatible refund positions (14-day conditional window vs "no obligation ... under
  any circumstances"). Coded refund_policy_exists/refund_window_days/refund_conditions as
  `conflicting` per codebook 2.1 step 3 (equal-authority sources, hierarchy does not
  resolve) rather than picking one document to prefer by inference. refund_policy_location
  was coded "terms" rather than "conflicting" because both disagreeing sources are
  terms-class documents - the document CLASS is not in doubt, only its substance.
  /agreement's own scope is somewhat ambiguous (it is titled/structured as a template/Work
  EULA, likely shared boilerplate across the vendor's other template-marketplace sites),
  but it repeatedly uses "Subscription"/"subscription fee" without excluding the Nicepage
  Premium plans, so this was not resolved by inference either.

  CREDIT/GENERATION VARIABLES: credit_system_present=no because every allowance found
  is stated directly in a real-world output unit (projects, Mb, visits, submissions,
  appointments, stock-image downloads); no credits/tokens/points currency exists anywhere
  in the three documents read. failed_generation_charge_policy coded not_applicable on the
  same evidence (flat seat-based tool, no per-generation accounting despite FAQ mentioning
  "AI Services to generate sites, pages, and blocks" as an included, unmetered feature).

  FIRST-CHARGE EXCLUSIONS: no tax figure is published (varies by jurisdiction, excluded
  per rule); no usage-overage charge is documented for Personal.

  blindness: no other product's record, no aitoolspolice.com review page, and no pass-2
  material was opened during this collection.
conflict_note: "REFUND: https://nicepage.com/terms states 'You can request a refund within 14 days of the purchase date. Please be prepared to describe why you requested a refund via Microsoft Teams or phone and explain the actual reasons, and we will review your request.' vs https://nicepage.com/agreement (Miscellaneous item 1) states 'The Nicepage.com website is under no obligation to refund your subscription fee under any circumstances. In case Nicepage.com determines that you are entitled to a refund of all or part of your subscription fee, such refund shall only be made to the credit card account originally used...' Both are equal-authority terms-class documents; hierarchy in protocol 6.2 does not distinguish between them, so refund_policy_exists / refund_window_days / refund_conditions are coded `conflicting` rather than resolved by preference."
