coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md Sec 7.2): full reasoning saved to
  originality-ai-sources/entry-tier-decision-payg-vs-pro.txt. Summary: this vendor sells three
  paid options -- Pro subscription ($12.95/mo annual-equiv $155.40/yr; $14.95/mo monthly-only,
  $179.40/yr), Enterprise subscription ($136.58/mo annual-equiv $1,638.96/yr; $179/mo
  monthly-only), and a one-time Pay-as-you-go credit pack ($30.00 for 3,000 credits, confirmed
  via pricing-page JSON-LD Offer "Pay-as-you-go (3000 credits)"). Selected Pro as entry_tier_name
  because sampling-rules 7.2's price-basis rule (annualize a monthly or annual figure) has no
  defined mechanics for a one-time, non-recurring purchase like PAYG -- multiplying $30 by 12
  would fabricate a $360/yr figure no document states, and taking $30 "as an annual figure" would
  mislabel a one-time charge as recurring. Pro is the cheapest candidate for which the rule's
  actual mechanics resolve to a number ($155.40/yr < Enterprise's $1,638.96/yr). LOSING CANDIDATE:
  Enterprise, annual-equivalent $1,638.96, excluded on price alone. ALTERNATIVE RECORDED FOR
  TRANSPARENCY: PAYG's raw one-time price ($30.00) is lower than Pro's annual-equivalent
  ($155.40) and even lower than one month of Pro ($12.95-$14.95); a buyer needing only occasional
  scans could spend less via PAYG than via any subscription. Not A-012 (PAYG is a standing
  one-time purchase, not a cheap time-limited intro period that auto-converts to a higher
  recurring rate -- no such intro mechanic was found anywhere in the documents).

  PRICE READ TWICE, TWO REPRESENTATIONS (binding rule): headline/first-charge figures confirmed
  against both the visible price-card text ("$12.95/month", tooltip "$155.4") and the page's
  embedded JSON-LD structured data (Offer "Pro Plan (Annual)", price "155.40"). No superscript-
  cents markup was present; plain "$12.95/month" text. Magnitude sanity check passes (entry tier
  in the low tens of dollars/month, first charge = 12x monthly as stated by the vendor itself for
  an annual plan, not a reading artifact).

  CURRENCY (D-003, per updated agent instructions): arm 1 satisfied directly -- the pricing page
  states "All prices are in USD" on its face and JSON-LD carries priceCurrency:"USD" for every
  offer; this is the vendor's own currency disclosure, read on this session (network egress
  Turkey). No non-USD figure was ever served; non_usd does not apply and no archive.org
  cross-check was needed since arm 1 already returned readable, explicit evidence.

  CREDIT DOMAIN (assignment-specific note): credit unit IS defined ("1 credit = 100 words" for
  AI-detection-only) and the credit-to-output rate for the principal output (AI detection) IS
  published, on the pricing page itself (credit_rate_location = pricing_page, and also repeated
  in the help center, hence coded multiple). See help-credit-scan-rate.txt for the close call on
  credit_to_output_rate_published (yes vs partial) given Grammar/Readability/Fact-Checker lack a
  separately published per-credit rate.

  ENTRY-TIER LOSING CANDIDATES (sampling-rules 7.2 formal requirement): Enterprise, annual-
  equivalent $1,638.96, excluded (higher price than Pro on every basis). Pay-as-you-go is not a
  recurring "plan" the annualization rule can evaluate on the same axis; see entry-tier note
  above and the saved file for full reasoning -- treated as a documented alternative rather than
  a losing same-axis candidate.

  CONFLICT/TENSION NOTES (recorded here per codebook Sec 3 even though neither was coded
  `conflicting`; see conflict_note field for the formal register): (1) ToS Sec 7.1's generic,
  contingent "we may offer trials... at any time" clause vs. the homepage FAQ's direct "we don't
  offer a free trial" -- read as reconcilable (general reservation of rights vs. a specific
  current-state statement), coded from the more specific/direct source. (2) ToS Sec 7.2's "fees
  are non-refundable once paid" vs. the dedicated Refund Policy page's discretionary case-by-case
  refunds -- read as reconcilable by the ToS's own express cross-reference to a "supplemental
  refund policy," not a genuine disagreement.

  blindness: no other record, no review page, no pass-2 material was opened.

  D-009 slice-3 re-read 2026-08-10 (independent live re-verification, since this record was
  assigned to the slice despite already carrying its own same-day two-representation check
  above): re-opened https://originality.ai/pricing fresh and re-confirmed entry_tier_name (Pro),
  headline_price_usd ($12.95), headline_billing_basis (per_month_billed_annually) and
  first_charge_amount_usd ($155.40) in three independent representations -- a freshly re-fetched
  JSON-LD payload, a structural DOM query of the Pro card header block (Pro name and $12.95/month
  price share one <div class="grid-div is-header">), and the toggle's own tooltip DOM node
  ("You will be billed yearly for an amount of: $155.4 ($12.95 x 12 months)..."). Confirmed 0
  <sup>/<sub> elements exist anywhere on the page. Provenance check (coordinator addendum):
  first_charge_amount_usd is a DIRECT vendor statement (the tooltip prose above), not a coder
  computation; rule 2's once-for-twelve-months requirement is independently satisfied by that
  same vendor sentence. Evidence saved to
  originality-ai-sources/d009-second-representation-2026-08-10.txt. No correction; all four
  scoped values confirmed as coded.

conflict_note: "ToS Sec 7.1 (\"We may offer trials, promotional pricing, beta access, limited free scans, free word limits, or similar offers... Trials may convert to paid subscriptions unless cancelled before the trial ends, where this is disclosed at signup.\") sits in tension with the homepage FAQ's direct \"We don't offer a free trial of Originality.ai.\" (https://originality.ai/terms-and-conditions vs https://originality.ai/). Not coded `conflicting`: the ToS clause is a generic, contingent reservation of rights that does not itself assert a trial is currently offered and explicitly defers actual terms to signup-time disclosure, so it does not state a value incompatible with the FAQ's specific, direct, current-state denial; trial_exists is coded `no` from the more specific source. Separately, ToS Sec 7.2 (\"fees are non-refundable once paid\") sits alongside the dedicated Refund Policy page's discretionary case-by-case refunds (https://originality.ai/refund-policy); not coded `conflicting` because the ToS clause itself carves out \"[u]nless... expressly stated in an order form or supplemental refund policy,\" which the Refund Policy page satisfies -- a designed cross-reference, not a disagreement."

