coder_note: |
  ENTRY-TIER SELECTION (sampling-rules 7.2): Eligible candidates were Basic, Pro, Pro+
  (all generally available, purchasable without sales contact, standing plans). Enterprise
  EXCLUDED (fails eligibility rule 2: "Contact Sales", no purchasable-without-sales price).
  Annual-equivalent costs in the page's default (Yearly) display state: Basic $288.00/yr
  (direct read: "Billed US$288 annually"); Pro $288.00/yr (also directly stated "Billed
  US$288 annually" - its displayed $24/mo is a "1st Year 50% OFF" promotional price off a
  $48/mo standing rate, but rule 2 of headline_price_usd uses the most-prominently-displayed
  figure regardless, so the promo price is what's compared); Pro+ $900.00/yr (not competitive).
  Basic and Pro TIE at $288.00/yr. Tie-break per sampling-rules 7.2: neither card carries a
  "first paid step" badge (Pro carries "Most Popular", a different marketing signal, not a
  first-step designation), so the tie falls to the second rule, leftmost/topmost on the page:
  Basic is the first (leftmost) card in both the plan-card row and the feature-comparison
  table's column order (Basic, Pro, Pro+, Enterprise throughout). Basic wins -> entry_tier_name
  = Basic. Pro ($288.00/yr, lost on position tie-break) and Pro+ ($900.00/yr, lost on price)
  both recorded per sampling-rules 7.2.

  NOT USED AS A CANDIDATE: the pricing page's embedded JSON also contains a "Subtitles
  (Yearly)" price object (~US$12/mo, 30 Voice Generation Minutes/mo) that is not rendered as
  a selectable card anywhere in the visible page (only Basic/Pro/Pro+/Enterprise are offered
  as choices). Treated as a non-displayed/legacy SKU, not a published entry-tier candidate,
  per the same "what a buyer can actually determine from the page" standard the whole
  instrument applies. Noted here for transparency only.

  RENEWAL-PRICE CAVEAT (not a coded variable, flagged for context only): Basic's own Stripe-
  style coupon object in the pricing-page JSON shows the 17.24%-off discount on its $348.00/yr
  underlying price has duration:"once", i.e. first-year only, same mechanic as Pro/Pro+'s
  explicit "1st Year 50% OFF" badge - but Basic's card shows no such badge on-page. This does
  not change first_charge_amount_usd (correctly the first-year figure, $288.00), but a buyer
  reading only the Basic card has no on-page signal that year two likely renews higher (~$348).
  No codebook variable captures this specifically; flagged as an observation only.

  INTERNAL TENSION FLAGGED (see conflict_note): pricing-page general FAQ states unqualified
  "You own all rights to the content created via LOVO, in perpetuity, including commercial
  rights", while the same page's structured per-plan data shows commercial-rights:false on
  the FREE tier specifically. Coded output_ownership_statement from the FAQ (on-point for
  ownership) and commercial_use_lowest_tier from the tier-differentiated plan data (on-point
  for tier-gating), per codebook's per-variable specificity; the gap itself is the finding.

  DOCUMENT-SPLIT PER PRODUCT NOTE (voice product): output/commercial-rights terms split
  across the pricing page's own FAQ (ownership, "own_content_created") + structured plan data
  (commercial-rights flag per tier) rather than the ToS, which addresses only user-SUBMITTED
  content (3.1) and general commercial/resale use rights (3.5), not generated-output ownership.
  Voice-cloning CONSENT terms live in ToS section 4 "Custom Voice Cloning" specifically (not
  coded to any single variable here, since no codebook variable targets cloning-consent text
  directly, but recorded per the task note: ToS 4 requires "written consent, release, and/or
  permission of each and every identifiable individual person" in files submitted for voice
  cloning - this governs voice-cloning consent; ToS 3.1/3.5 governs input-content licensing and
  commercial/resale use; the pricing-page FAQ governs output ownership; ToS 2.2/2.3 governs
  billing/renewal/refund/cancellation).

  METHOD NOTE: credit-system determination (credit_system_present=no) rests on the pricing
  page's own featurePolicy JSON showing every plan (Free/Basic/Pro/Pro+) metering allowance
  directly in Hrs/Mins of Voice Generation, not an abstracted credit currency. A help-center
  FAQ article title, "What happens if I hit my credit limit?", uses the word "credit"
  colloquially; its body was not accessed (Cloudflare-blocked live, no archive fetched given
  the effort cap) since the structural evidence across all four tiers was already conclusive
  and consistent; noted for auditability, not treated as contradicting evidence.

  D-003 currency check: not triggered. USD confirmed directly from the vendor's own page
  config ("currency":"US$","monetary_unit":"USD") plus $ figures throughout; no variable in
  this record was coded non_usd, so there is nothing for the US-locale cross-check to test
  against.

  D-005 rendered-read note: the pricing page's price/plan/feature data was NOT missing due to
  client-side rendering (a browser render would not have helped) - the entire lovo.ai domain
  returned HTTP 402 DEPLOYMENT_DISABLED at the infrastructure level (Vercel deployment
  disabled), confirmed via two independent fetch paths (curl, WebFetch). This is a genuine
  vendor-side outage a real visitor would also have met, not a "fetcher couldn't see it" gap,
  so no browser-render attempt was made against the live 402 response; archived captures of
  the previously-live, fully-rendered page were used instead (themselves already-rendered
  documentary HTML/JSON, satisfying D-005's underlying concern).

  Cloudflare note: help.lovo.ai's live pages returned a Cloudflare managed JS challenge
  ("Just a moment...", HTTP 403). No challenge was solved, clicked, or otherwise completed;
  archive.org captures were used instead in every case that mattered to a coded value.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Internal tension on the SAME page (lovo.ai/pricing, archived 2026-04-03), not a cross-document conflict: the general-purpose FAQ entry 'own_content_created' states unqualified \"You own all rights to the content created via LOVO, in perpetuity, including commercial rights\" (no tier qualifier), while the structured per-plan featurePolicy data on the identical page states \"commercial-rights\":false for the FREE tier and true from Basic upward. Not coded as `conflicting` (codebook reserves that for two SEPARATE official sources of equal authority; this is one page, two sections of differing specificity) - resolved by using the more specific, tier-differentiated data for commercial_use_lowest_tier and the ownership-specific FAQ line for output_ownership_statement. Both URLs are the same: http://web.archive.org/web/20260403154336/https://lovo.ai/pricing."
