coder_note: |
  Entry-tier selection (sampling-rules 7.2): eligible paid candidates were Creator, Pro, and
  Business (Enterprise excluded, sales-gated / not purchasable without contacting sales; Free
  excluded, $0 is not a paid tier). Annualizing each candidate's default-state (Monthly) headline
  price at a single seat: Creator 29.00 x 12 = 348.00 (WINNER, lowest); Pro 49.00 x 12 = 588.00
  (losing candidate, cheapest of its many credit tiers); Business 149.00 x 12 = 1,788.00, base
  price covers the first seat per the vendor's own help article ("$149/month for the first seat,
  with additional seats available for $20 per seat/month") (losing candidate). Enterprise: no
  published price, contact-sales only, ineligible under sampling-rules 7.2 criterion 2.

  Cost-per-output range (Creator, $29/mo / 600 credits/mo), by generation mode per
  help.heygen.com/en/articles/15126059-how-to-use-credits-on-heygen: Avatar III 3 cr/min ->
  200 min/mo -> $0.145/min; Avatar IV/V 20 cr/min -> 30 min/mo -> $0.967/min; Video Translation
  5 cr/min -> 120 min/mo -> $0.242/min; Custom Expressive Motion 40 cr/min -> 15 min/mo ->
  $1.933/min. Range: roughly $0.15-$1.93 per video-minute depending on engine/feature selected.
  No single figure is derivable because no document designates a default mode; the derived
  cost_per_output_value_usd is therefore not_computable, per section 8's instruction for the
  partial/range case.

  unquantified_limit_clause is coded present on a clause explicitly scoped to Free Plan users
  only (see the variable's own evidence field for the full quote and the scope caveat); no
  equivalent discretionary clause was found attached to Creator or any other paid tier.

  blindness: no other record, no review page, no pass-2 material was opened. Only this record's
  own sources were read: the HeyGen pricing page, HeyGen's terms of service, five official
  help.heygen.com articles (refund policy, cancellation, two credit/pricing explainers, billing),
  and the developers.heygen.com API-pricing docs page (checked, not cited; see its source note).
  aitoolspolice.com, site/content/reviews/, and every file under records/ other than this one
  (heygen.yaml) were left unopened for the duration of this coding pass.
conflict_note: >
  Free-plan video quota: the pricing page (rank 1 for pricing-class variables) states a flat
  "3 videos per month"; help article 15125761 (rank 2) states "1-3 free videos, depending on
  your region." Coded from the pricing page per the source hierarchy; free_plan_cap_value does
  not reflect the region-dependent variant. URLs: https://www.heygen.com/pricing |
  https://help.heygen.com/en/articles/15125761-heygen-credit-based-pricing-plans-explained.


  Refund policy: the terms of service (rank 1 for contractual-class variables), section 7d,
  states "Payments are non-refundable, except where required by law," with no discretionary
  exception and no stated day-window -- this governs refund_policy_exists (no_refunds_stated),
  refund_window_days (0), and refund_conditions (not_applicable). Two help-center articles
  (rank 2) describe an actual discretionary refund practice going beyond that: "reimbursements
  are granted only under specific circumstances and at our discretion," with "HeyGen and Google
  Play purchases may be refunded within 15 days, while Apple App Store purchases may be refunded
  within 14 days," reviewed case-by-case and possibly denied "if a significant amount of credits
  has already been created." URLs: https://www.heygen.com/terms |
  https://help.heygen.com/en/articles/8304807-refund-process-and-policy |
  https://help.heygen.com/en/articles/8304328-how-to-cancel-or-pause-your-heygen-subscription.
