coder_note: |
  Product identification: GoDaddy currently runs two distinct site-builder product
  lines. (1) "Airo Builder" / "Airo AI Builder" (godaddy.com/airo/ai-builder) -- a
  conversational/"vibe coding" AI app builder with tiers Free/Starter/Professional/
  Ultimate and a credits-based meter. (2) "GoDaddy Website Builder" / "Websites +
  Marketing" (godaddy.com/websites/website-builder) -- the older template-based
  builder with tiers Basic/Premium/Commerce ($9.99/$14.99/$20.99 per mo billed
  annually) and no credit system. The frame's product_name "GoDaddy Airo" and
  category "AI website builder" match product (1). The frame-suggested URL
  godaddy.com/websites/ai-website-builder now 302-redirects to /airo/ai-builder
  (confirmed via a fresh web.archive.org save on 2026-08-07), corroborating that
  (1) is the current canonical page for the reviewed product. This record codes
  exclusively from product (1); product (2)'s figures were read only to confirm
  they are a separate line and are not used for any coded value here.

  Entry-tier selection (sampling-rules 7.2): among PAID, standing, sales-contact-free,
  single-seat candidates, annual-equivalent cost = price/mo (default annual display
  state) x 12. Starter 9.99x12=119.88 (winner) | Professional 24.99x12=299.88 (lost)
  | Ultimate 99.99x12=1199.88 (lost). "Free" ($0) is not a paid-tier candidate under
  7.2 and is coded separately under domain 3 (free_plan_*).

  Refund window, billing-basis alternative: the same "AI Credits" refund clause gives
  Monthly-billed plans 48 hours (vs. the 30 days / 720 hours coded above for the
  Starter tier's annual default display state). Recorded here per codebook rule
  ("where the window varies by plan, record the entry paid tier's window").

  mandatory_addon_present / cost_per_output_computable: no mandatory purchase found
  beyond the plan price; optional add-on credit packs exist but are explicitly
  optional ("purchase more or wait for your monthly limit to reset").

  cost_per_output_unit named per codebook rule 3 (no listed unit fits): "AI credit /
  published-app capacity" -- the product is metered by a credits/mo allowance (150 on
  Starter) that never converts to a specific output, plus a separate published-app-or-
  site capacity cap (1 on Starter); neither is a countable production artifact like an
  image or video minute, so none of the enumerated units apply.

  Live-site access: www.godaddy.com returned HTTP 403 to every direct curl/WebFetch
  request from this session (all paths tested) and our browser session was
  geo-redirected to the tr-tr / TRY locale. All coded values instead come from
  web.archive.org's independent same-day (2026-08-07) crawl of each official page,
  each fetched via web.archive.org/save/<url> immediately before reading it, per
  archival policy. See register_events for the D-003 currency-check detail.

  D-009 re-read 2026-08-10: not arithmetic-flagged (9.99 x 12 = 119.88 exact -- this is the
  coder's own computation, see PROVENANCE below). Re-confirmed entry_tier_name/headline_price_usd/
  headline_billing_basis in two representations; first_charge_amount_usd's provenance is a
  disclosed computation, addressed separately below per the orchestrator's added instruction.
  Live re-access attempted first: www.godaddy.com still geo-redirects this session (Turkey egress)
  to a Turkish-locale page (TRY currency, no USD figures reachable) -- same obstruction the
  original coder hit, unchanged. Fell to the same fallback the original coder used:
  web.archive.org. The interactive Browser pane's navigate tool refused web.archive.org on both
  attempts ("navigation ... denied or failed"), and WebFetch also could not reach it
  ("unable to fetch from web.archive.org") -- both attempts logged per the two-attempt cap. Bash
  curl reached it fine (HTTP 200), so representation 2 below was obtained that way instead.
  Representation 1 (already on file): the saved local copy godaddy-sources/
  godaddy-pricing-archive-id.html carries the embedded JSON `"entryTitle":"abn_gdexp_14016 - AAB
  Price Lockup","align":"start","price":"$9.99","priceDetail":"/mo","items":[{...,"text":"Billed
  annually"}]`. Representation 2 (fresh independent fetch, today, curl of the same archive.org
  snapshot URL https://web.archive.org/web/20260807050414/https://www.godaddy.com/airo/ai-builder):
  byte-identical JSON fragment re-obtained independently -- `"price":"$9.99","priceDetail":"/mo",
  "items":[{"entryId":"5tBQ4M6GQ3iAeMdJWNbVrT","entryTitle":"Airo Builder Renews Text","text":
  "Billed annually"}]`. Both reads agree exactly: $9.99/mo, "Billed annually", no adjacent
  cents/superscript structure (a plain JSON string), confirming this is not a misread. Limitation
  disclosed: both representations are the same underlying JSON-payload TYPE (archive.org's frozen
  2026-08-07 snapshot, not a live independent render), because the live DOM route is blocked by
  the geo-redirect and the interactive browser/WebFetch tools would not reach web.archive.org in
  this session -- recorded honestly rather than papered over. NO CORRECTION to headline_price_usd/
  headline_billing_basis/entry_tier_name.

  PROVENANCE of first_charge_amount_usd (per orchestrator request, applies to this record):
  119.88 is COMPUTED (9.99 x 12), not read off a stated annual total -- no document found in this
  re-read (pricing page JSON, refund policy, AI Terms of Use, Universal ToS, credits FAQ) states an
  explicit "$119.88" or "pricePerYear"-style annual total anywhere for Starter; confirmed by a
  fresh full-text keyword search of every saved source document for "annual", "once a year", "12
  months", "twelve months" today -- the only hits are the pricing card's own "Billed annually" tag
  (already coded) and the Refund Policy's "Standard Refund Terms" section, which was NOT quoted in
  the original record and is added here: "Annual Plans+ - Within 30 days (720 hours) of the date of
  the transaction. Monthly Plans*+ - Within 48 hours... * Monthly Plans include all plans with less
  than a 1-year term (e.g., 6 mos., 9 mos., etc.)" (godaddy-sources/godaddy-refund-policy-
  20260807.html, byte offset ~46195, re-confirmed today). This is the original coder's own stated
  basis, already disclosed (not silent) via the existing computation_assumptions field ("annual
  state is the default display and refund policy treats the annual plan as one transaction"). This
  coder's own assessment: "Billed annually" is a direct billing-frequency statement (distinct from
  no statement at all, which is what rule 3's "do not assume twelve months" targets), and the
  Refund Policy's own definition of "Monthly Plans" as "all plans with less than a 1-year term"
  frames "Annual Plans" as a genuinely different, full-year billing arrangement -- together a
  reasonable, disclosed basis for the multiplication, though neither document uses codebook rule
  2's exact "charged once for twelve months" phrasing. This is a codebook-application judgment
  call, not a confirmed misread: NOT changed to unknown, since the multiplication rests on an
  actual, quoted billing-frequency statement rather than silence or coder assumption, and this
  coder cannot certify the ORIGINAL coder's interpretation is wrong, only that it is not
  air-tight. Flagged here explicitly for adjudicator review, distinct from the three records
  (hostinger, humbot, humanizemy-ai-detector) the orchestrator separately asked about, where no
  computation was disclosed at all.

  blindness: no other record, no review page, no pass-2 material was opened.
