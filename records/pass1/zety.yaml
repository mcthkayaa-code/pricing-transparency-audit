coder_note: |
  ENTRY TIER SELECTION (sampling-rules 7.2): two paid-tier candidates appear on the pricing
  page -- Pro Package and Annual Package (Basic Package is the free tier, coded separately
  under domain 3). Pro Package's headline is a 14-day, $1.70 intro price that auto-renews at
  $23.95 billed every 4 weeks ("After 14 days, auto-renews at $23.95 billed every 4 weeks.").
  Annualizing the $1.70 teaser itself would be a reading error consistent with the A-012
  warning (the teaser is a time-limited intro price, not an ongoing rate); the RECURRING
  post-trial rate was annualized instead for the entry-tier price comparison only:
  $23.95 x (365/28) = approx $312.20/yr (approx $311.35/yr on a flat 13-cycle convention) --
  decisively higher than Annual Package's stated $71.40/yr. Annual Package is therefore coded
  as the entry tier. Losing candidate: Pro Package, annual-equivalent approx $311-312 on its
  recurring rate; feature sets are otherwise identical between Pro and Annual per the DOM
  check-active/check-inactive comparison.

  A-012: Zety's Pro Package sells a paid (non-free), time-limited intro period ($1.70 / 14
  days) that auto-converts to a materially higher recurring charge ($23.95/4wk). trial_exists
  is defined as a FREE trial; this intro period is not free, so the instrument does not
  cleanly cover it. trial_exists / trial_length_days / trial_auto_converts are coded "yes" /
  14 / "yes" because the vendor's own pricing page explicitly labels this a "trial", and
  trial_exists rule 3 (code "no" where documents "mention no trial") does not fit since a
  trial plainly IS mentioned, just a paid one. trial_card_required is coded unknown per the
  explicit rule barring inference from the existence of a charge. Separately: trial_length_days
  is listed as an entry-tier variable (codebook 5.2), and the chosen entry tier (Annual
  Package) itself carries no trial at all -- only Pro Package does. Coding
  trial_length_days = not_applicable in strict entry-tier terms would create protocol 8.3.3's
  B3 "impossible pair" against trial_exists = yes. Since the product documents exactly one
  trial, with no tier-by-tier length variation to choose between, trial_length_days is coded
  from Pro Package's trial (the only trial documented anywhere) rather than not_applicable, to
  avoid an unreachable combination. Flagging for adjudication alongside other A-012 records.

  Conversion-rate vs. straight-subscription comparison (per the A-012 instruction to record
  both): the intro period converts to $23.95/4wk (approx $311-312/yr, approx $25.95/mo
  equivalent), against the straight, no-trial Annual Package subscription at $71.40/yr
  ($5.95/mo) -- a ratio of approximately 4.4x. Both figures sourced from
  https://zety.com/pricing, read 2026-08-13.

  MANDATORY_ADDON: Terms of Service Section 9 names optional premium upsells (Resume Review,
  Resume Writing, Premium Career Report, Cover Letter Writing) "which may not be included in
  the cost of Provider's basic subscription services" -- these are optional add-ons, not
  required to use the Annual Package's advertised features, so mandatory_addon_present = no.

  FREE_PLAN_CAP_VALUE: free_plan_cap_documented = none_quantified because the feature grid
  documents that Basic (free) lacks three features relative to the paid tiers (unlimited
  downloads/prints/edits, resume check, instant job matches) but no document gives a number
  for any of these restrictions. With nothing quantified to record, free_plan_cap_value is
  coded not_applicable as the closest fit -- the codebook does not name a distinct value for
  "restrictions described, none quantified" on this specific field, so this is a judgment
  call, flagged here per instruction rather than silently picked.

  REFUND POLICY: Terms of Service Section 10 states a refund is available if cancellation
  notice is given "before the end of the initial period, if the initial period is offered"
  without naming a day count; the official FAQ blog gives the operative figure: "the first 7
  days of purchase, you can receive a full refund, no questions asked". The two documents are
  read as complementary (ToS states the general rule, the FAQ states the number), not
  conflicting -- no incompatible figures were found between them. A second, narrower
  conditional path exists after the 7-day window ("after 7 days of purchase, you may receive
  a refund if you haven't downloaded any files while your account was active"), noted here but
  not folded into refund_window_days/refund_conditions, which record the clearer, primary
  7-day / no-questions-asked terms.

  CURRENCY: the pricing page rendered in USD ($) directly from the Turkey-based collection
  network, with no localization observed at any point. No D-003/D-007 currency-check arms
  were needed since the page never showed a non-USD figure to check against.

  FETCH METHOD: static WebFetch (two attempts) and curl (two attempts, both --http1.1 and
  default) all failed to connect to zety.com on every path tried (pricing, terms-of-service),
  timing out or returning a connect error; every pricing-page-sourced value here is coded from
  a rendered browser read instead, per the D-005 rule. Price figures were confirmed in a
  second representation beyond the tool's own text extraction: raw document.body.innerText
  and DOM className inspection (check-active/check-inactive per feature row) via
  javascript_tool, both matching the get_page_text extraction exactly -- no superscript-cents
  or duplicated-row misread risk found (D-009 check).

  COOKIE CONSENT: the page presented a layered cookie-consent widget; non-essential
  categories (Analytics, Performance and Personalization, Advertising) were left unchecked and
  "Save Preferences" was selected, plus Escape and the widget's own "Got it!" control were
  tried -- the modal's visual dismissal was unreliable (apparent rendering glitch; background
  content kept updating live behind it, confirming the page itself was not hung) but page
  content was read via DOM text extraction, unaffected by the overlay. The page was read in
  the declined-non-essential-cookies condition per protocol 6.8 rule 5.

  https://zety.com/pricing serves/redirects to https://zety.com (page title reads "Zety
  Pricing: Affordable Plans for Professional Resumes"); recorded as the pricing source per the
  frame's vendor domain and archived under the /pricing URL.

  Bold.Pro ("Premium Tools" row) shows check-active on ALL THREE tiers including the free
  Basic Package -- noted for transparency though it does not affect any coded value here (not
  a mandatory add-on; appears to be an always-included networking/profile feature independent
  of subscription tier).

  Parent company context (not used to code any value): the Terms of Service name "BOLD LLC" as
  the contracting party, with "Auxiliant S.a.r.l" as a possible merchant of record; the site
  footer copyright reads "(c) 2026 Works Limited."

  blindness: no other record, no review page, no pass-2 material was opened.
