coder_note: |
  BLINDNESS: no other product's record was opened, no aitoolspolice.com page or
  site/content/reviews/ file was opened, no pass-2 material was opened. This attestation is true.

  ENTRY-TIER SELECTION (sampling-rules 7.2): candidates were Pro and Ultra (no student/nonprofit/
  promo-only plans found; both are standing, generally-available, single-seat-eligible plans).
  Pro: TRY 83.25/mo, billed annually = annual-equivalent TRY 999.00/yr. Ultra: TWO different
  figures appear on the SAME page load for the same nominal tier - the plan card's default
  credit-slider position shows TRY 2822/mo per seat (annual-equiv TRY 33,864/yr), while the
  lower feature-comparison table shows TRY 1763.75/mo (annual-equiv TRY 21,165/yr), most likely
  because Ultra's price depends on an interactive credit-volume slider (1,500/2,500/5,000/10,000/
  10,000+ credits) that defaults differently in the two UI locations. This internal Ultra
  inconsistency does not affect entry-tier selection: Pro's TRY 999/yr is far below Ultra under
  EITHER Ultra figure, so Pro = entry_tier_name regardless. Only one candidate (Pro) was
  therefore realistically eligible on price; Ultra is recorded here as the losing candidate per
  sampling-rules 7.2's "record every eligible candidate that lost."

  CURRENCY (D-007): this is exactly the scenario D-007 was written for. The pricing page renders
  only in Turkish Lira (collection network is Turkey-egressed). Checks performed, in the D-007
  order: (1) vendor's own currency disclosure - no currency/region selector on the pricing page,
  no hreflang alternates, no vendor-supported currency URL parameter (?currency=USD tested, no
  effect), no explicit currency statement located in the Terms of Use, the GenAI Terms, or the
  6 support articles read. (2) US-crawled archive capture - the most recent Wayback capture of
  picsart.com/pricing/ (2026-08-02, id_/raw mode) contains zero occurrences of "$", "TRY", "USD"
  or any other currency marker; it is a pre-hydration empty shell, the exact failure mode D-005/
  D-007 describe for JS-rendered pricing pages. Neither arm returned readable USD evidence, so
  headline_price_usd, first_charge_amount_usd and cost_per_output_computable are coded unknown,
  NOT non_usd (non_usd would require positive evidence the vendor publishes only a non-USD
  price, which was not established - we simply could not verify what a US reader is shown).
  Sanity check only, NOT used to code any value: Apple's US App Store IAP listing (non-qualifying
  source per codebook section 4) shows "Picsart Pro Annual $83.99" (~$7.00/mo equivalent) and
  "Picsart Pro Monthly $13.99" - a plausible USD magnitude for the web "Pro" plan, and a useful
  check against a reading-error (per the "read a price twice" rule) even though the App Store's
  plan structure (Plus/Gold/Pro, three tiers) differs from the web page's (Pro/Ultra, two tiers).
  See conflict_note.

  PRICE READ TWICE (binding instruction): TRY 83.25/mo for Pro was confirmed in two independent
  representations - (a) plain-text extraction (document.body.innerText) and (b) the separate
  feature-comparison table further down the same page, which restates "Pro TRY 83.25/mo" outside
  the animated plan-card widget. Both agree, so this is not a text-extraction misread. The
  PRO CREDIT COUNT specifically (the number of credits/month) is rendered by a CSS digit-roller
  animation that both innerText and textContent report as the literal string
  "012345678901234567890123456789" (all ten digits repeated three times, a decoy/placeholder
  artifact of the odometer widget) rather than the true number; no data-attribute, aria-label or
  network response carrying the real figure was found despite three inspection attempts. This is
  a coder-tooling misread, not a display_variant. The exact digit is NOT coded anywhere in this
  record; usage_cap_quantified relies instead on the plan's OTHER quantified limits (all present
  and numeric) plus the fact that the credit allowance is explicitly "Fixed credits/mo" with
  visible derived conversions (~50 generations, ~27 videos), which is sufficient to establish
  that the limit carries a number even though the coder could not personally transcribe it.

  COST_PER_OUTPUT_UNIT judgment call: Picsart is a general photo/video editing app (most of its
  advertised feature list - editing tools, templates, stock library, storage, brand kits - is
  flat/unmetered access) that has added a credit-metered generative-AI layer on top. The pricing
  page's OWN current framing foregrounds AI generation heavily (page title "AI Video and Image
  Generation", hero copy about Seedance/Veo/Nano Banana, plan subtitles keyed to AI usage
  volume), which could support per_image or "other" (multi-modal) instead. per_seat_month was
  chosen because (a) Ultra explicitly bills "per seat" with "Add team seats", (b) the bulk of
  each plan's feature list is unmetered software access rather than a countable artifact, (c)
  the published credit-to-output rates are wide, multi-tier RANGES (three quality tiers per
  output type) that would require assuming which AI model a "typical" buyer picks to compute a
  single cost-per-image figure, which the cost_per_output_computable rule 7 explicitly forbids.
  A different reasonable coder could pick per_image or other; flagged here per instructions for
  a judgment call on ambiguous vendor terminology.

  APP-STORE / PLATFORM DIVERGENCE (assignment note): the web pricing page (picsart.com/pricing/)
  sells a TWO-tier structure, Pro and Ultra. A Picsart support article states iTunes sells a
  DIFFERENT structure ("Plus and Pro plans... every Pro option offers the same tools, just as
  every Plus option offers the same benefits" - support.picsart.com/hc/.../35102132133149), and
  Apple's US App Store IAP listing (apps.apple.com/us/app/picsart-photo-video-editor/id587366035,
  a non-qualifying source, checked for this note only) shows a THREE-tier structure: Plus
  ($11.99/mo, $64.99/yr), Gold ($4.99/wk, $12.99/mo, $57.00/yr), Pro ($13.99/mo, $83.99/yr,
  $11.99/wk). A separate support-article title ("Picsart Gold to Pro") indicates "Gold" is a
  legacy tier name being phased into "Pro" branding. The web page's entry tier (Pro) and the
  app-store "Pro" tier are not verified to be the identical product/allowance - this record
  codes ONLY from the web pricing page per the assignment instruction and sampling-rules 7.2,
  and records this divergence here rather than silently picking one.

  Full local copies of every rendered read are saved under picsart-sources/ alongside this
  record, each with its own URL/date/method/network-note header, per operational guidance.

conflict_note: "Refund policy: the Terms of Use states an unqualified, determinate policy (\"ALL PAYMENTS ARE NONREFUNDABLE... you will not receive a refund or credit\" - https://picsart.com/terms-of-use/#subscription-and-billing) while the dedicated Refund Policy help-center page describes only a request-submission MECHANISM without confirming approval or denial (\"If you subscribed via the Picsart.com website, you can submit a request here... For more information, check out our Terms of Use\" - https://support.picsart.com/hc/en-us/articles/360002231937-Refund-Policy). Read together these are not strictly incompatible (the help page describes HOW to ask; the ToS states that the answer is no) and the help page itself points back to the ToS as the governing document, so refund_policy_exists is coded no_refunds_stated from the ToS rather than conflicting, and refund_policy_location is coded multiple. Recorded here per codebook section 3's instruction that a gap between a softer-worded page and the contract is reported even where the hierarchy settles the value cleanly. || Plan pricing across platforms: the web pricing page shows a two-tier Pro/Ultra structure (https://picsart.com/pricing/, TRY 83.25/mo for Pro) while Apple's US App Store IAP listing shows a three-tier Plus/Gold/Pro structure with Pro at $13.99/mo or $83.99/yr (https://apps.apple.com/us/app/picsart-photo-video-editor/id587366035, non-qualifying source, referenced for this note only, not for any coded value). Not scored as `conflicting` on any variable because the app-store listing does not qualify as a coding source per codebook section 4; recorded here per the assignment's explicit instruction to log web-vs-app-store divergence rather than silently picking one."
