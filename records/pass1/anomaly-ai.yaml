product_id: anomaly-ai
product_name: Anomaly AI
category: AI data analysis
product_status: active
paid_submission: "no"
vendor_home_url_assigned: https://tryanomaly.ai
vendor_home_url_official: https://www.findanomaly.ai
coder_pass: 1
coder_role: primary
collection_date: 2026-08-06
recheck_date: not_applicable
entry_tier_name: Pro
entry_tier_selection_note: >
  Per sampling-rules.md 7.2, basis = lowest annual-equivalent single-seat cost,
  computed in the default display state (Monthly, see default_display_state).
  Eligible candidates (generally available, no sales contact, standing plan):
  Pro $25/mo -> annual-equivalent $300.00; Analyst $90/mo -> annual-equivalent
  $1,080.00; Team $45/seat/mo but pricing page states "minimum 2 seats
  ($90/month)" so the seat is not purchasable alone -- per price-basis rule 3
  the minimum purchasable block is used: $90/mo minimum x 12 = annual-equivalent
  $1,080.00 (nominal single-seat rate $45/mo = $540.00/yr recorded for reference
  only, not used, since it cannot actually be bought alone). Free ($0/mo) is not
  a paid tier and is excluded from this comparison (covered under domain 3).
  Enterprise is "Custom" / "Contact Sales" -- excluded under eligibility rule 2
  (not purchasable without contacting sales), so it is not a losing candidate,
  it is simply not a candidate. Lowest annual-equivalent among eligible
  candidates = Pro at $300.00. entry_tier_name = Pro.
status: complete

domain_note: >
  Assignment gave vendor_home_url = https://tryanomaly.ai. This domain does not
  resolve (DNS NXDOMAIN, confirmed via curl and WebFetch on 2026-08-06). WebSearch
  shows tryanomaly.ai / tryanomaly.in belongs to an unrelated company, "TryAnomaly
  Technologies" (AI competitive-intelligence platform, India, incorporated 2026-03-25)
  -- not the AI-data-analysis product "Anomaly AI" assigned here. Followed to the
  official product domain https://www.findanomaly.ai per instruction. This is also
  the vendor_home_url already on file in ../frame-frozen-2026-08-04.csv (the frozen
  sampling frame, opened per codebook section 6 "Copied from the frozen frame" --
  not a per-product record, so not a blindness violation), which independently
  confirms www.findanomaly.ai is correct. Confirmed as the right product via ToS
  self-identification ("Mindlake Ltd, trading as Anomaly AI... www.findanomaly.ai...
  app.findanomaly.ai") and category match.

default_display_state: >
  Pricing page loads with the "Monthly" billing tab pre-selected (styled active/dark).
  "Yearly" tab is unselected, with a "Save 20%" badge beside it. Prices shown in this
  state: Free $0/month, Pro $25/month, Analyst $90/month, Team $45/seat/month (minimum
  2 seats, i.e. $90/month minimum). Confirmed by three independent, mutually consistent
  observations on 2026-08-06: (1) static server-rendered HTML fetched via curl
  (no JS executed) shows $25/$90/$45 in the primary text flow, with the $20/$72/$36
  annual-equivalent figures present only inside an embedded Astro/React JSON data
  payload (yearlyPrice fields), not in rendered text; (2) live browser render at
  1280x720 (Claude Browser pane, JS-hydrated) screenshotted before any interaction,
  cookie banner accepted only to the extent of clicking "Reject non-essential" per
  the study's cookie-decline rule -- Monthly tab visibly active both before and after
  that click; (3) get_page_text of the live render matches the static HTML text.
  No reload-hunting was performed; the toggle was never clicked to view Yearly.

