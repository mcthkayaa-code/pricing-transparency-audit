  commercial_use_lowest_tier: { value: free, source: "https://10web.io/legal/terms-of-service/", evidence: "ToS, 10WEB AI Builder Service section, stated generally (no tier gate): 'Subject to Your compliance with these Terms...if you choose to use, publish or display an Output in any manner, it shall be considered Your Content. 10Web does not claim any ownership in the Output, so long as the Output does not contain 10Web intellectual property.' No separate 'commercial use' restriction or tier-gated commercial-license clause was found anywhere (pricing page, ToS, PUP, AI Starter Plan doc); full-text search for 'commercial' across the help-center corpus returned no tier-gating result. The free tier also produces Output (a generated website), so the ungated rights statement applies from the free tier up." }
  watermark_removal_tier: { value: unknown, source: "https://10web.io/legal/terms-of-service/", evidence: "Same search/finding as free_plan_watermark: no document anywhere states that any tier's generated websites carry, or are free of, 10Web branding/watermarking. Principal output (a full website) plainly could carry such branding (e.g. a footer badge), so not_applicable does not fit; documented silence codes unknown." }
  output_ownership_statement: { value: user_owns, source: "https://10web.io/legal/terms-of-service/", evidence: "ToS, 10WEB AI Builder Service section: '10Web does not claim any ownership in the Output, so long as the Output does not contain 10Web intellectual property.' A disclaimer-of-ownership-claim over AI-generated Output, the best fit among available values (not vendor_license_retained, since ownership is explicitly disclaimed; the 'so long as...' clause is a standard carve-out excluding 10Web's own proprietary platform elements from the grant, not a tier/use/subscription-active condition of the kind conditional is defined for). Separately, general uploaded 'Your Content' is addressed by the Content section: 'You retain all the rights to Your Content or intellectual property.'" }
  usage_cap_quantified: { value: all_caps_quantified, source: "https://help.10web.io/hc/en-us/articles/22592225897490-AI-Starter-Plan", evidence: "Every limit documented for the entry tier (AI Starter) carries a number: 'Websites...1' (standing), 'Monthly visitors: The plan supports up to 10,000 visitors per month. For every 10K extra visitors, you'll be charged an extra $2' (quantified rate + quantified automated overage), 'SSD storage: Includes 10GB scalable storage...extra $2 at the end of the billing month for each extra 5GB' (quantified standing + quantified overage), 'AI credits: 100 AI credits per month' (quantified rate), 'Free custom domain...for 1 year, up to $30' (quantified). No unlimited or bare-word ('generous', 'limited') claim was found for this tier." }
  unquantified_limit_clause: { value: absent, source: "https://10web.io/legal/terms-of-service/", evidence: "ToS (346-line cleaned extract) and the Prohibited Use Policy (224-line cleaned extract, explicitly incorporated into the ToS by reference) were both read in full end to end. No fair-use/reasonable-use/excessive-use discretionary clause conditioning ordinary product usage volume was found. ToS's suspension/limitation language is conduct/violation-based ('if we...believe that You have violated the terms...or otherwise objectionable conduct'), not usage-volume-based. PUP is entirely content/conduct-prohibition-based (illegal content, abuse categories, security); its one infrastructure-adjacent clause - 'Spams or floods 10Web's infrastructure, including excessive API requests, brute-force attacks...that degrade service performance' - is framed as a prohibited ATTACK/abuse activity (anti-abuse/security), not a discretionary throttle on a buyer's normal, legitimate usage, so it does not trigger present per rule 3's conduct-vs-volume distinction." }
computation_assumptions: "AI Starter tier (entry tier), $10.00/mo billed annually per default display state (12-months toggle active; card states $120 total/yr). Includes 1 website (pricing page + AI Starter Plan doc, direct allowance, not credit-mediated). Both price and allowance already on a monthly basis (10.00/mo per 1 website), so rule 3's period-matching needs no conversion. 10.00 / 1 = 10.00 per website per month; equivalently 120.00/yr per website on the annual figure. AI Credits (100/mo) are a separate, secondary in-product resource - not the unit this computation uses."
conflict_note: |
  THREE conflicts found, each between same-rank or hierarchy-resolvable official sources.

  (1) refund_policy_exists / refund_window_days / refund_conditions - RESOLVED BY HIERARCHY.
  Rank-1 contractual sources agree with each other: ToS REFUND section
  (https://10web.io/legal/terms-of-service/) - "At 10Web we do not offer refunds for
  Platform subscriptions. All payments are final." Dedicated Refund Policy article
  (https://help.10web.io/hc/en-us/articles/360027773851-10Web-s-Refund-Policy) - "10Web
  does not offer refunds." Against this, TWO lower-ranked official sources state the
  opposite: pricing page (https://10web.io/pricing-platform/) - "30-day money back
  guarantee", "Cancel anytime", and per-card "The 30-day money-back guarantee applies
  until you claim your free domain."; and the official coupons page
  (https://10web.io/coupons/) - "every plan carries a 30-day money-back guarantee...request
  a refund within 30 days. That is the real risk-remover, not a code." Per protocol-v1.md
  6.2 and codebook-v1.md 2.1 step 3, the rank-1 sources govern the coded values
  (no_refunds_stated / 0 / not_applicable), and this disagreement is recorded here per the
  rule that a marketing-vs-contract gap is reported "even where the hierarchy settles the
  coded value cleanly." This is a stark, repeated (2 marketing-side pages, both explicit
  and specific) gap between what a buyer sees on the page she buys from and what the
  contract she is bound by actually says.

  (2) trial_auto_converts - UNRESOLVED, coded conflicting (three same-rank sources).
  "Why Have I Been Charged?"
  (https://help.10web.io/hc/en-us/articles/6136064762770-Why-Have-I-Been-Charged) - "The
  7-day free trial automatically upgrades to a paid subscription unless cancelled within
  the trial period." "How to Upgrade to 10Web Pro Plans"
  (https://help.10web.io/hc/en-us/articles/360021395600-How-to-Upgrade-to-10Web-Pro-Plans)
  - "If you do not cancel when the 7 day free trial expires, you will be charged for the
  chosen platform plan." Both state auto-charge/convert on inaction. Against this, "What
  Happens if I Fail to Upgrade My Plan Before the Free Trial Ends?"
  (https://help.10web.io/hc/en-us/articles/360030873012-What-Happens-if-I-Fail-to-Upgrade-My-Plan-Before-the-Free-Trial-Ends)
  - "If you don't upgrade before the free trial ends, your website will be deleted after
  the trial expires" - stating deletion instead of a charge, with no mention of billing.
  All three are docs/help-center class (equal rank); the source hierarchy does not resolve
  which governs, so coded conflicting per codebook 2.1 step 3.

  (3) free_plan_cap_value (page-count figure only) - same-rank docs disagree on a number.
  "Free Plan: How to Convert/Recreate a Website With AI" (updated 2025-01-23,
  https://help.10web.io/hc/en-us/articles/360018862340-Free-Plan-How-to-Convert-Recreate-a-Website-With-AI)
  - "up to 10 pages for free users." "AI Website Builder: Fully Automated WordPress
  Website Creation in a Few Minutes" (updated 2024-11-01,
  https://help.10web.io/hc/en-us/articles/7952757255186-AI-Website-Builder-Fully-Automated-WordPress-Website-Creation-in-a-Few-Minutes)
  - "The free plan is limited to 5 pages only." Both docs/help-center class (equal rank).
  Minor relative to (1) and (2): both figures are quantified, so free_plan_cap_documented
  (all_quantified) is unaffected either way; only the specific descriptive figure in
  free_plan_cap_value is uncertain. Recorded the more recent/specific article's figure (10
  pages) in the value field per pragmatic reproducibility, with this note carrying the
  full disagreement rather than silently discarding the older figure.
coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md 7.2): Default display state = Business tab / 12
  months (annual) period (see default_display_state for the two-way verification that this
  is a genuine server-rendered default, not a client-side/geo/cookie variant). Eligible
  candidates in that state: AI Starter $10.00/mo -> stated annual total $120.00 (winner),
  AI Premium $15.00/mo -> stated annual total $180.00, AI Ultimate $23.00/mo -> stated
  annual total $270.00 (note: 23 x 12 = 276, not 270; the card's own displayed "$23/mo"
  headline is a rounded-up display of the exact $22.50/mo = $270/12 rate - a rounding
  artifact in the vendor's own display, not a two-source conflict, and not
  outcome-determinative either way since both figures exceed Starter's $120). All three are
  standing, generally-available, no-sales-contact plans (single "seat"-equivalent = 1
  website for Starter; plans are not literally seat-scaled but the sampling-rules.md 7.2
  "single-seat variant" principle is satisfied since each card is already the base/smallest
  purchase unit for that tier, with "Additional Website" priced as a separate, explicit
  per-unit upsell).
  EXCLUDED FROM COMPARISON (not part of default display state, recorded for transparency
  per Aragon-record precedent): the "Agency + White Label" top-level tab was not active by
  default and required a click. Its plans, read after that click: Agency Core $112.00/mo ->
  stated annual total $1,344.00 (far above Starter's $120.00; not outcome-determinative even
  if included) and Agency Pro (price "Custom", "Talk to sales" - not eligible under rule 2,
  purchasable-without-contacting-sales, regardless of tab).
  COST_PER_OUTPUT_UNIT REASONING: coded "other" / "per_website" rather than "per_seat_month"
  because the product is not sold as unmetered flat-rate software access - the pricing
  page's own primary framing counts and prices by number of WEBSITES (1/2/4/20 across
  tiers, with "Additional Website" as the plan's own named upsell unit), which is a
  countable-artifact-like dimension closer to the "countable artifact" pole of the
  per_seat_month test than to "unmetered access."
  CREDIT_TO_OUTPUT_RATE_PUBLISHED = partial REASONING: "Each AI request costs 1 credit" (AI
  Editor doc) is stated in the specific context of AI-chat editing requests inside the
  post-generation editor. No document states the credit cost of the INITIAL
  website-generation action itself (the principal output), and the doc's own "Regenerate
  website" action (explicitly "rebuild the entire website with AI") is described with no
  credit cost at all - suggesting the confirmed 1-credit rate may not uniformly cover
  generation-scale actions. Flagged for adjudicator attention in case a broader reading
  (crediting the "1 credit = 1 AI request" statement as covering generation too, i.e. "yes"
  instead of "partial") is preferred; this coder chose the more conservative reading given
  the textual scoping and the unpriced Regenerate counterexample.
  ARCHIVAL: 6 of 19 sources (all 10web.io-domain pages: pricing-platform, home, ToS, PUP,
  coupons) archived successfully to web.archive.org on first attempt. The remaining 13
  sources (all help.10web.io Zendesk articles) could not be archived: help.10web.io throws
  a Cloudflare challenge on direct fetch (known obstacle per task briefing, confirmed:
  direct curl fetch of a help.10web.io HTML page returns a Cloudflare challenge page rather
  than the article), AND web.archive.org's own save crawler independently failed on the
  same representative URL twice in a row (HTTP 520 both attempts, i.e. Cloudflare/origin
  error, tested on the Refund Policy article and treated as representative of the whole
  help.10web.io domain rather than separately burning two failed attempts per URL) - so
  archive_status is local_copy_only for all 13, per protocol-v1.md 6.4's fallback (which
  permits coding to continue, unlike archive_failed). All 13 were instead read via the
  official Zendesk Help Center public API (help.10web.io/api/v2/help_center/en-us/articles/<id>.json),
  which returns the same official article body as JSON and bypasses the challenge - the
  task briefing pre-authorized this as legitimate. Local copies of the full official JSON
  response for every cited article, plus the complete 836-article corpus (all 9 listing
  pages) used for full-text search, are retained under 10web-sources/ (article-<id>.json
  per cited article; zendesk-articles-p1.json..p9.json for the full corpus;
  zendesk-titles.txt as a title/URL index; terms-clean.txt, pup-clean.txt,
  pricing-clean.txt, all-articles-clean.txt as human-readable extracts).
  INSTRUMENT/PROCESS NOTES: (a) free_plan_cap_value's format (a single formatted-caps
  string, or the whole field unknown/not_applicable/conflicting) does not cleanly
  accommodate a conflict on only ONE of several compound sub-figures (1 website
  undisputed; page-count disputed 5 vs 10) - resolved pragmatically per the note on that
  variable and in conflict_note (3), without marking the whole field conflicting since
  quantified-ness itself is not in dispute. (b) No account was created, no sign-up flow was
  entered, no trial was started, and no checkout was opened at any point; all findings rest
  on public pricing/legal/help-center pages only.

  D-009 re-read 2026-08-10: re-confirmed entry_tier_name, headline_price_usd,
  headline_billing_basis and first_charge_amount_usd via a fresh live browser session,
  independent of the 2026-08-06 collection. Two representations: (1) a live DOM query of
  `.tab`/`.period-item` classes reproduced the same default-state markers (Business tab
  active, 12-months/Annually period active/selected) and `.plan_price_el`/
  `.price-month-info` returned "$10" and "Get 12 months for $120 (regular price $240)."
  for the first (AI Starter) card, read as raw textContent; (2) a screenshot of the
  rendered plan grid (desktop viewport) shows the same figures as rendered pixels -- AI
  Starter card reads "$10 /mo" / "$10 per website" / "Get 12 months for $120 (regular
  price $240)." -- with no digit-animation widget in play (unlike krea-ai), so DOM text
  and rendered pixels cannot diverge the way they did there. Plan-grid row mapping
  confirmed: three cards (AI Starter, AI Premium, AI Ultimate), no free-tier card
  interleaved, AI Starter unambiguously leftmost/cheapest -- no duplicated-row risk.
  Verdict: CONFIRMED, no correction on any of the four variables. Side observation (NOT
  one of the four scope variables, NOT corrected): this re-read's DOM query and screenshot
  both show AI Ultimate's own on-screen price as "$22.5/mo" directly, not the "$23/mo"
  this coder_note's entry-tier-selection paragraph above describes; that aside concerns a
  losing candidate's figure only and does not change entry_tier_name (AI Starter still
  wins by a wide margin under either reading) or any of the four D-009 variables, so it is
  left as originally written per this sweep's bounded scope -- see
  10web-sources/d009-reread-2026-08-10.md for the full figures. Evidence saved to
  10web-sources/d009-reread-2026-08-10.md. Blindness maintained: no other product's record
  was opened during this re-read.
