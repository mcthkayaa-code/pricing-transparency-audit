  refund_conditions: { value: not_applicable, source: "https://10web.io/legal/terms-of-service/", evidence: "'No refund available' per the governing rank-1 sources (refund_policy_exists = no_refunds_stated), so no qualifying conditions construct applies." }
  cancellation_self_serve: { value: self_serve_documented, source: "https://help.10web.io/hc/en-us/articles/360027492652-How-Can-I-Cancel-My-10Web-Subscription", evidence: "Complete, unambiguous self-serve procedure entirely within the dashboard: 'Click the workspace dropdown menu...Click Subscription Plans...To cancel your subscription, use the button click here. Choose the reason for cancellation and click Submit & Cancel.' No email/contact required. Corroborated by ToS: 'You can cancel your subscription at any time before the next billing cycle from your account's settings section in Dashboard console' (this general statement carries an unspecified carve-out, 'In some cases, depending on your subscription plan, we may ask You to contact us to cancel', but no document identifies AI Starter/any named plan as falling under that carve-out, and the concrete, currently-documented procedure available today is self-serve)." }
