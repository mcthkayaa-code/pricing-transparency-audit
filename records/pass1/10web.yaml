  refund_policy_exists: { value: no_refunds_stated, source: "https://10web.io/legal/terms-of-service/", evidence: "CONFLICT, resolved by source hierarchy. Rank-1 contractual sources (ToS + the dedicated Refund Policy help-center article, tied at rank 1 per protocol-v1.md 6.2) agree with each other: ToS REFUND section: 'At 10Web we do not offer refunds for Platform subscriptions. All payments are final.' Dedicated Refund Policy article: '10Web does not offer refunds' (explaining the 7-day trial and pre-charge notice as the substitute mechanism). Against this, TWO lower-ranked but still-official sources say the opposite: the pricing page itself ('30-day money back guarantee', 'Cancel anytime', and per-card 'The 30-day money-back guarantee applies until you claim your free domain.') and the official https://10web.io/coupons/ page ('every plan carries a 30-day money-back guarantee...request a refund within 30 days'). Per codebook section 2.1 step 3, the rank-1 sources govern: no_refunds_stated. Full four-URL conflict in conflict_note." }
