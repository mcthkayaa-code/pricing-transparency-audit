default_display_state: |
  Pricing page (canonical URL https://10web.io/pricing-platform/; https://10web.io/pricing/
  301-redirects to it, confirmed via curl -I and via the archive.org save response's
  Link: rel="original" header) loads with the "Business" top-level tab active (DOM class
  "tab business active" on that tab, "tab agency " with no active class on "Agency + White
  Label") and the "12 months" billing-period tab active (DOM class "tab 12 active" /
  "period-item 12 selected", carrying a "50% off" badge; "Monthly" tab carries class
  "tab 1 " with no active/selected marker). This is the ANNUAL period, not Monthly - i.e.
  the page defaults to the annual/discounted display, not the plain monthly price. Verified
  two independent ways: (1) a plain, no-JS curl fetch of the page (Mozilla UA, no cookies,
  no JS execution) already contains class="tab business active" and class="tab 12 active"
  baked into the server-rendered HTML - i.e. this is 10Web's own WordPress/PHP server-side
  default, not something a client-side script or A/B test injects after load; (2)
  independently re-confirmed via a live JS-rendered browser session (viewport 1440x1000)
  reading the same classes off the live DOM. No cookie-consent banner interfered with
  either read. No geography-based pricing banner or region selector was observed anywhere
  on the site (contrast: a prior product's pass-1 record on this study flagged such a
  banner; none exists here), so this default is treated as a single, non-geo-gated,
  non-cookie-gated state rather than a display-variant candidate under protocol-v1.md 6.8.
  In this default state, each entry-tier-candidate plan card (AI Starter/Premium/Ultimate)
  shows one prominent price (e.g. Starter: plan_price_el "$10" + month_sign "/mo") which is
  the ANNUAL-billed monthly-equivalent rate, with a same-card line reading "Get 12 months
  for $120 (regular price $240)." beneath the CTA buttons. This is the state read for all
  entry-tier and default-state-anchored variables below. The "Agency + White Label" tab
  (containing Agency Core $112/mo and Agency Pro, custom/contact-sales) was NOT part of the
  default display state and required a click to view; per the sampling-rules.md 7.2 rule 1
  principle ("do not switch... to find a cheaper figure") and the precedent set by this
  study's aragon-ai pass-1 record (excluding a non-default top-level tab from entry-tier
  eligibility), Agency-tab plans are excluded from entry-tier comparison, though recorded
  in coder_note for transparency since they are not outcome-determinative regardless.
  Read at desktop viewport 1440x1000, non-essential cookies declined (no banner appeared
  to decline in this session; page has no visible consent prompt).
