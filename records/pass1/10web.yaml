  headline_price_usd: { value: 10.00, source: "https://10web.io/pricing-platform/", evidence: "AI Starter card, default display state (Business tab, 12-months/annual period tab active): <span class=\"plan_price_el\">$10</span><span class=\"month_sign\">/mo</span>. The 'price delete' (strikethrough) element beside it is empty in this view - no competing struck price shown inline. Most prominent figure for the entry tier in the default display state, per rule 2." }
  headline_billing_basis: { value: per_month_billed_annually, source: "https://10web.io/pricing-platform/", evidence: "Default state's billing-period tab is '12 months' (class 'tab 12 active'/'period-item 12 selected', '50% off' badge), not 'Monthly' (class 'tab 1 ', no active marker). $10/mo is therefore the monthly-equivalent figure under a 12-month prepaid commitment, confirmed by the same card's own line 'Get 12 months for $120 (regular price $240).' Matches 'A monthly figure charged as one annual payment.'" }
  first_charge_amount_usd: { value: 120.00, source: "https://10web.io/pricing-platform/", evidence: "Read directly, not computed: DOM element <div class=\"price-month-info\">Get 12 months for $120 (regular price $240).</div>, inside the same plan_header/pricing_buttons_parent card as the $10/mo headline, directly beneath the 'or buy now' checkout link. No mandatory add-on to add (see mandatory_addon_present). Taxes and usage overages excluded per rule 5 (overages are billed separately per Visitors and Storage Overages doc, not part of the first charge)." }
  mandatory_addon_present: { value: "no", source: "https://10web.io/pricing-platform/", evidence: "Pricing page, AI Starter Plan doc, Visitors and Storage Overages doc, and ToS (read in full) show no required additional charge, minimum credit purchase, platform fee, or compulsory onboarding fee for the AI Starter plan as advertised (1 website, 100 AI credits/mo, 10GB storage, 10K visitors/mo, free domain up to $30/yr all included in the $10/mo|$120/yr price). Additional websites ($10/site), CDN, a costlier-than-$30 domain, and usage overages ($2/10K extra visitors, $2/5GB extra storage) are all optional/usage-conditional upsells, not mandatory per rule 3." }
  annual_condition_disclosure: { value: adjacent, source: "https://10web.io/pricing-platform/", evidence: "The annual-prepayment condition is disclosed twice inside the SAME visual price card as the $10/mo headline: (1) the governing billing-period toggle's own label reads '12 months' + '50% off' directly attached to the price; (2) the card's own price-month-info line, 'Get 12 months for $120 (regular price $240).', sits directly beneath the CTA buttons inside the same plan_header block, not in a separate footnote/accordion elsewhere on the page. Matches 'the same card... or in the label of the toggle attached to it.'" }
  annual_default_toggle: { value: annual_preselected, source: "https://10web.io/pricing-platform/", evidence: "DOM classes 'tab 12 active' and 'period-item 12 selected' on the '12 months' billing-period control; 'Monthly' control carries no active/selected class. Confirmed present in the server-rendered HTML from a plain no-JS curl fetch (not merely client-injected), and independently re-confirmed via live browser DOM inspection. No A/B-test or geography signal observed (see default_display_state); single state read and archived, so no register_event logged for this pass." }
  free_plan_exists: { value: "yes", source: "https://help.10web.io/hc/en-us/articles/36515422635922-How-to-Generate-a-Website-with-10Web-s-Agentic-Website-Builder", evidence: "'You can create one website using the free version of the Agentic Website Builder. To generate additional websites, you will need to upgrade to a paid plan.' Corroborated by 'Get Started for Free on 10Web': 'Free platform users are limited to generating one website, and full editing requires enabling the 7-day free trial'; and by https://10web.io/coupons/: 'You can generate a website before paying.' This base access (account + 1 website) is distinct from, and not itself time-limited by, the separate 7-day card-required trial of 'Pro' features (domain 4) - see free_plan_duration." }
  free_plan_cap_documented: { value: all_quantified, source: "https://help.10web.io/hc/en-us/articles/360018862340-Free-Plan-How-to-Convert-Recreate-a-Website-With-AI", evidence: "Free-plan limits found: '1 website' (generation cap, quantified standing limit, per the Agentic Website Builder doc) and a page-count cap stated as 'up to 10 pages for free users' (this doc, updated 2025-01-23) - both carry numbers. NOTE: an older doc ('AI Website Builder: Fully Automated...', updated 2024-11-01) states 'The free plan is limited to 5 pages only' instead of 10 - a same-rank (docs/help-center) source conflict on the exact figure; both numbers are nonetheless quantified, so all_quantified holds regardless of which governs. Full conflict in conflict_note. No unquantified free-plan limit (e.g. a bare 'limited' with no number) was found anywhere." }
  free_plan_cap_value: { value: "1 website | 10 pages", source: "https://help.10web.io/hc/en-us/articles/360018862340-Free-Plan-How-to-Convert-Recreate-a-Website-With-AI", evidence: "'1 website' per the Agentic Website Builder generation-limit doc; 'up to 10 pages for free users' per this (more recent, 2025-01-23) dedicated Free Plan doc. An older (2024-11-01) doc states 5 pages instead of 10 for the same construct - see conflict_note; the 10-page figure is recorded here as the value read from the more specific, more recently-updated dedicated article, without treating the whole field as conflicting since only the page-count sub-figure (not the website-count figure) is in dispute." }
  free_plan_watermark: { value: unknown, source: "https://10web.io/legal/terms-of-service/", evidence: "'watermark' does not appear anywhere in the ToS, PUP, pricing page, AI Starter Plan doc, or Get Started for Free doc in the sense of vendor branding on outputs (full-text search across all sources). The only 'watermark' hits anywhere in the 836-article help-center corpus concern a Photo Gallery image-watermarking FEATURE for the site owner's own photos - an unrelated construct. Principal output is a full website, a media artifact that plainly could carry a footer badge/branding, so not_applicable does not fit; documented silence codes unknown." }
  free_plan_duration: { value: perpetual, source: "https://help.10web.io/hc/en-us/articles/360021420139-Get-Started-for-Free-on-10Web", evidence: "The base free tier (account + 1 website generation, up to 10 pages, no SSH/SFTP) is framed as an ongoing access level with no expiry date or countdown stated anywhere; only 'full editing capabilities' require separately starting the time-limited (7-day) trial of Pro features. 'Free platform users are limited to generating one website' is a feature/quantity restriction, not a time restriction." }
  trial_exists: { value: "yes", source: "https://10web.io/legal/terms-of-service/", evidence: "ToS, REFUND section: '1. Free 7-Day Trial: We provide a 7-day free trial* to help you evaluate our services without any charges.' Repeated consistently across the Refund Policy article, Get Started for Free doc, Why Have I Been Charged doc, and How to Upgrade to Pro Plans doc: a time-limited (7-day) trial of paid/'Pro' tier features, distinct from the ongoing free plan in domain 3." }
  trial_card_required: { value: "yes", source: "https://help.10web.io/hc/en-us/articles/360021420139-Get-Started-for-Free-on-10Web", evidence: "'To unlock full editing capabilities, start a 7-day free trial of the Pro version by attaching your credit card.' / (informational-website flow) 'activate a 7-day free trial of the Pro version by adding your credit card information.' Consistent across both flows in this doc." }
  trial_length_days: { value: 7, source: "https://10web.io/legal/terms-of-service/", evidence: "'We provide a 7-day free trial' - stated identically across ToS, Refund Policy article, Get Started for Free doc, Why Have I Been Charged doc, and How to Upgrade to Pro Plans doc. No variation by tier found; used for the entry paid tier per rule." }
  trial_auto_converts: { value: conflicting, source: "https://help.10web.io/hc/en-us/articles/6136064762770-Why-Have-I-Been-Charged", evidence: "CONFLICT between three same-rank (docs/help-center) official sources on what happens if the buyer takes no action by day 7. 'Why Have I Been Charged?': 'The 7-day free trial automatically upgrades to a paid subscription unless cancelled within the trial period.' 'How to Upgrade to 10Web Pro Plans': 'If you do not cancel when the 7 day free trial expires, you will be charged for the chosen platform plan.' Both state auto-charge/convert. Against this, 'What Happens if I Fail to Upgrade My Plan Before the Free Trial Ends?': 'If you don't upgrade before the free trial ends, your website will be deleted after the trial expires' - stating deletion, not a charge. All three are help-center articles (equal rank); the hierarchy does not resolve which governs. Coded conflicting per codebook section 2.1 step 3. Full quotes and all three URLs in conflict_note." }
  credit_system_present: { value: "yes", source: "https://help.10web.io/hc/en-us/articles/22592225897490-AI-Starter-Plan", evidence: "'AI credits: The AI Starter plan includes 100 AI credits per month. These credits are used for AI-powered website generation and editing actions available in the platform.' Also shown as a plan line item ('AI Credits: 100/mo') on the pricing page itself. An intermediate currency (credits) that meters AI actions, not an allowance stated directly in output units." }
  credit_unit_defined: { value: "yes", source: "https://help.10web.io/hc/en-us/articles/36411956830738-10Web-AI-Editor", evidence: "'AI credit usage: The AI credit usage section shows how many AI credits have been used from your subscription plan. Each AI request costs 1 credit.' This ties the credit unit to a recognizable action (1 AI request = 1 credit), satisfying rule 3 - the AI Starter Plan doc's '100 AI credits per month...used for AI-powered website generation and editing actions' alone would not suffice (states a quantity and purpose, not a conversion; rule 5), but this AI Editor doc supplies the actual conversion." }
  credit_to_output_rate_published: { value: partial, source: "https://help.10web.io/hc/en-us/articles/36411956830738-10Web-AI-Editor", evidence: "The 'Each AI request costs 1 credit' rate is stated specifically in the context of 'AI editing requests sent through the AI chat' inside the AI Editor (post-generation editing workspace). No document explicitly confirms this same 1-credit rate governs the INITIAL website-GENERATION action (the principal output-producing step, which occurs before/upon first entering the editor) - the same doc's 'Regenerate website' action ('rebuild the entire website with AI') is described with no stated credit cost at all. Principal output is a generated website; the confirmed rate covers a secondary/ongoing action (chat-based edits) rather than clearly covering generation itself, matching the codebook's partial case (rate published for a secondary output/action, not clearly for the principal one)." }
  credit_rate_location: { value: docs_help_center, source: "https://help.10web.io/hc/en-us/articles/36411956830738-10Web-AI-Editor", evidence: "The '1 credit = 1 AI request' rate appears only in the 10Web AI Editor help-center article; not found on the pricing page, in the ToS, or in the AI Starter Plan doc (which states the credit quantity and general purpose but not the per-action rate)." }
  cost_per_output_unit: { value: other, source: "https://10web.io/pricing-platform/", evidence: "10Web's own pricing page frames each plan primarily by number of WEBSITES included (Starter 1, Premium 2, Ultimate 4, Agency Core 20), with 'Additional Website' as the plan's own literal upsell unit ($10/site for Starter). AI Credits (100/mo) is a secondary, bundled resource metering one in-product feature (AI generation/editing actions), not the dimension the product is sold by. No listed enumerated unit (per_video_minute, per_image, per_1k_words, per_audio_minute, per_page, per_headshot, per_document, per_presentation, per_seat_month, per_api_call) fits 'per website'; coded other, named 'per_website' (equivalently 'per_website_month' given the subscription's monthly/annual billing) per rule 3." }
  cost_per_output_computable: { value: "yes", source: "https://10web.io/pricing-platform/", evidence: "Entry tier (AI Starter) price ($10.00/mo, default annual-billed display state) and its website allowance (1 website, stated directly on the pricing page and in the AI Starter Plan doc - a direct plan allowance, not credit-mediated) are both published; the calculation needs no assumption about typical use. See computation_assumptions. (This is independent of the credit_to_output_rate_published ambiguity above, since 'websites included' is a directly stated plan quantity, not something requiring the AI-credit conversion.)" }
  computation_assumptions: { value: "AI Starter tier (entry tier), $10.00/mo billed annually per default display state (12-months toggle active; card states $120 total/yr). Includes 1 website (pricing page + AI Starter Plan doc, direct allowance, not credit-mediated). Both price and allowance already on a monthly basis (10.00/mo per 1 website), so rule 3's period-matching needs no conversion. 10.00 / 1 = 10.00 per website per month; equivalently 120.00/yr per website on the annual figure. AI Credits (100/mo) are a separate, secondary in-product resource - not the unit this computation uses." }
