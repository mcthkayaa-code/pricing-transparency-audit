default_display_state: >
  Canonical read used for coding (observed on 4 independent fresh loads of
  https://www.adobe.com/express/pricing in this session, 2 of them screenshotted):
  Individuals tab active by default, USD currency, no cookie-consent banner
  rendered. Two cards: "Adobe Express Free" US$0.00, and "Acrobat Express"
  US$10.99/mo (purple/blue "Best value" banner), described as "Includes Adobe
  Express Premium and Acrobat AI Assistant", subtext "No annual commitment,
  billed monthly." — no monthly/annual toggle is present for the Individual
  tier. Outbound commerce links on this read carry co=US&lang=en&locale=en-US
  &contentRegion=us. This page's plan-card prices are injected client-side by
  a script fragment (main--da-express-milo--adobecom.aem.page/express/
  fragments/pricing-table/individuals-ff-bundle); a plain web.archive.org
  crawl captures the page shell but not the injected price fragment (protocol
  section 9, limitation 8), so archive_status above is local_copy_only and the
  authoritative capture is the local text copy saved alongside this record
  plus the in-session screenshots described in register_events. See
  register_events for two other display states observed and not used for
  coding: a TRY/geography variant and an Adobe-Firefly-branded redirect
  variant.

