variables:
  # --- Domain 1: headline price vs. price actually charged ---
  headline_price_usd:
    value: 10.99
    source: https://www.adobe.com/express/pricing
    evidence: >
      Entry paid tier selected per sampling-rules.md 7.2: eligible candidates
      on the default-state pricing page were "Acrobat Express" (Individual,
      US$10.99/mo) and "Acrobat Express for Teams" (US$11.99/mo per license,
      single-seat). "Acrobat Express for Enterprise" is sales-gated
      ("Contact Sales") and ineligible under eligibility rule 2. Annual
      equivalents: Individual 10.99x12=131.88 (winner, lowest); Teams
      11.99x12=143.88 (loses). Card reads "US$10.99/mo" most prominently, no
      billing-toggle interaction before reading.
  headline_billing_basis:
    value: per_month_billed_monthly
    source: https://www.adobe.com/express/pricing
    evidence: "Card shows 'US$10.99/mo' with subtext 'No annual commitment, billed monthly.' No annual option/toggle exists for the Individual tier — it is monthly-billed only."
  first_charge_amount_usd:
    value: 10.99
    source: https://www.adobe.com/express/pricing
    evidence: "Default state is monthly (not annual) — 'No annual commitment, billed monthly' — so the first charge equals the published monthly figure; no annualization applies (codebook rule 2 only multiplies where the default is annual). See computation_assumptions."
  mandatory_addon_present:
    value: "no"
    source: https://www.adobe.com/express/pricing
    evidence: >
      Pricing page lists Acrobat Express's features (generative credits,
      premium templates, Acrobat AI Assistant, PDF Spaces, storage, etc.) as
      included in the US$10.99/mo price ("Includes Adobe Express Premium and
      Acrobat AI Assistant"). No separate required charge, minimum credit
      purchase, platform fee, or onboarding fee found on the pricing page, in
      the Subscription and Cancellation Terms, in the General Terms of Use, or
      in the generative-credits FAQ.

  # --- Domain 2: visibility of the annual-billing condition ---
  annual_condition_disclosure:
    value: not_applicable
    source: https://www.adobe.com/express/pricing
    evidence: "The entry tier's headline figure does not depend on annual prepayment — the Individual 'Acrobat Express' plan has no annual billing option at all ('No annual commitment, billed monthly')."
  annual_default_toggle:
    value: no_toggle
    source: https://www.adobe.com/express/pricing
    evidence: "The Individuals-tab pricing card offers one billing period only (monthly); no monthly/annual switch is rendered for this tier. (The separate Businesses > Teams card is a fixed 'Annual subscription, billed monthly' — a structural commitment, not a toggle — and is not the entry tier.)"

  # --- Domain 3: real usability of the free plan ---
  free_plan_exists:
    value: "yes"
    source: https://www.adobe.com/express/pricing
    evidence: "'Adobe Express Free — US$0.00 — Free to use. No credit card required.' presented as a standing plan alongside the paid tier, corroborated by the dedicated helpx.adobe.com Adobe Express Free plan page."
  free_plan_cap_documented:
    value: some_quantified
    source: https://www.adobe.com/express/pricing
    evidence: >
      Quantified: 5GB storage (standing); 10 days version history (standing);
      1 account per social network (standing); 'Generate Presentations: 5 free
      lifetime uses' (standing); 'Generate 5-second videos: 2 free lifetime
      uses' (standing); 'Import PDF free; 10 PDF Quick Actions per month'
      (rate). Not quantified: 'Generate images, text effects, templates &
      more — Free daily generations' and 'Insert & Remove Objects — Free
      daily generations' carry no number for the free tier (rate-type claim
      with no figure). At least one of each => some_quantified.
  free_plan_cap_value:
    value: "5GB storage | 10 days version history | 1 account per social network | 5 lifetime generate-presentation uses | 2 lifetime 5-second-video generations | 10 PDF Quick Actions per month"
    source: https://www.adobe.com/express/pricing
    evidence: "Verbatim quantified limits transcribed from the pricing-page feature comparison table and top-features panel, Free column. Unquantified 'Free daily generations' claims (image/text-effect/template generation, object insert & remove) are excluded per section 5.1."
  free_plan_watermark:
    value: unknown
    source: https://www.adobe.com/express/pricing
    evidence: >
      No 'watermark' row or statement found in the pricing-page feature
      comparison table (no watermark line item for either tier), the General
      Terms of Use, the Subscription and Cancellation Terms, the
      generative-credits FAQ, or the Adobe Express Free plan help page. The
      dedicated "Watermarks for Generative AI content FAQ" help page
      (helpx.adobe.com/creative-cloud/apps/generative-ai/ai-content-watermarks-faq.html)
      was opened but its rendered content is about optional user-applied
      Content Credentials labeling, not Adobe's own free-tier output
      watermarking, and did not state a position either way.
  free_plan_duration:
    value: perpetual
    source: https://www.adobe.com/express/pricing
    evidence: "Presented as a standing plan alongside the paid tier ('Free to use. No credit card required.') with no expiry or 'first month'/'to start' language anywhere in the documents reviewed."

  # --- Domain 4: whether a trial requires a payment card ---
  trial_exists:
    value: "yes"
    source: https://www.adobe.com/express/pricing
    evidence: "Entry tier card's call to action reads 'Start 7-day free trial' (distinct from the separate $0 'Adobe Express Free' plan)."
  trial_card_required:
    value: unknown
    source: https://www.adobe.com/express/pricing
    evidence: >
      Neither the pricing page nor the Subscription and Cancellation Terms
      states whether a payment card is required to START the 7-day trial.
      The pricing-page footnote states 'billing begins when free trial ends.
      Cancel before free trial ends and you won't be charged. Subscription
      automatically renews until you cancel' — this implies a payment method
      is on file for the auto-charge at trial end, but implication is not a
      statement (matches the codebook's own worked example for this
      variable). No 'no credit card required' statement is attached to the
      trial CTA (that phrase appears only on the separate $0 Free plan card).
  trial_length_days:
    value: 7
    source: https://www.adobe.com/express/pricing
    evidence: "Entry tier (Individual 'Acrobat Express') CTA: 'Start 7-day free trial'. (The non-entry Teams tier separately shows a 14-day trial; not used, per codebook rule to record the entry paid tier's trial.)"
  trial_auto_converts:
    value: "yes"
    source: https://www.adobe.com/express/pricing
    evidence: "Footnote on the pricing card: 'If you have signed up for a free trial, billing begins when free trial ends. Cancel before free trial ends and you won't be charged. Subscription automatically renews until you cancel.'"

  # --- Domain 5: comprehensibility of the credit system ---
  credit_system_present:
    value: "yes"
    source: https://helpx.adobe.com/firefly/using/generative-credits-faq.html
    evidence: "'Generative credits are like tokens you can use to generate high-quality image, vector, video, and audio outputs.' An intermediate currency that converts into outputs, per codebook rule 2. Entry tier includes '250 generative credits per month per user' (pricing page)."
  credit_unit_defined:
    value: "yes"
    source: https://helpx.adobe.com/firefly/using/generative-credits-faq.html
    evidence: >
      Multiple explicit conversions published, e.g. 'Most standard generative
      AI features... use 1 credit per generation'; detailed premium-feature
      table gives named-output rates such as 'Firefly Image 4 Ultra model:
      20 credits per generation, 1 image per generation', 'Generate Video,
      1080p at 24 FPS: 100 credits per second', 'Generate Sound Effects: 10
      credits per generation'. A document converts credits into recognizable
      output units, satisfying the rule regardless of which specific output
      Adobe Express's own principal offering is (see credit_to_output_rate_published).
  credit_to_output_rate_published:
    value: partial
    source: https://helpx.adobe.com/firefly/using/generative-credits-faq.html
    evidence: >
      Adobe Express's principal output is unmetered per-seat software access
      (cost_per_output_unit = per_seat_month, see domain 6) — the product is
      sold as a general design/content/PDF tool (templates, photo/video
      editing, brand kits, PDF tools, scheduling), with credit-metered
      generative AI as one feature category among several, and most Express
      tools/quick actions are not credit-metered at all. Because the
      principal output itself is not a creditable unit, no rate is or could
      be published "for" it; what IS published is a comprehensive rate table
      for every secondary, credit-metered output type Express's generative
      features touch (image, video, audio, translation, etc. — see
      credit_unit_defined). Coded literally under codebook rule 4 ("rates
      published for secondary features but not the principal output are
      partial"): partial, not yes, since the principal output categorically
      lacks a rate. Flagged in coder_note as a structural edge case (per-seat
      product with a fully-documented secondary credit layer) for
      adjudication.
  credit_rate_location:
    value: docs_help_center
    source: https://helpx.adobe.com/firefly/using/generative-credits-faq.html
    evidence: "Per-output credit rates (credits per image/video-second/etc.) appear only on this Adobe Help Center page. The pricing page states only the total monthly allowance (250 credits/month), not conversion rates; the Subscription and Cancellation Terms states rates 'will vary' without publishing figures."

  # --- Domain 6: computability of cost per output ---
  cost_per_output_unit:
    value: per_seat_month
    source: https://www.adobe.com/express/pricing
    evidence: "Adobe Express is sold as per-seat access to a general design/content-creation tool (templates, photo/video/PDF editing, brand kits, scheduling), not a single countable artifact type; per codebook rule 2, unmetered software access is per_seat_month. Matches the codebook's own Vendor L example (flat monthly price per user)."
  cost_per_output_computable:
    value: "yes"
    source: https://www.adobe.com/express/pricing
    evidence: "Unit is per_seat_month (see cost_per_output_unit), so the published entry-tier price directly is the cost per unit; no further figures or assumptions are needed. See computation_assumptions."
  credit_rollover_policy:
    value: expires_at_period_end
    source: https://www.adobe.com/legal/subscription-terms.html
    evidence: >
      Subscription and Cancellation Terms (Creative Cloud for Individuals >
      Month to month): "The number of generative credits reflected in the
      subscription you have purchased expire each month. Each month, your
      account will be reset at the same number of generative credits for the
      duration of your subscription. Unused generative credits do not
      rollover." Corroborated (agreement, same document class rank) by the
      Generative Credits FAQ: "No, generative credits do not roll over to the
      next month. Your generative credit balance will reset to your allocated
      amount on a monthly basis."

  # --- Domain 8: charging for failed generations ---
  failed_generation_charge_policy:
    value: unknown
    source: https://helpx.adobe.com/firefly/using/generative-credits-faq.html
    evidence: >
      Not addressed in the Subscription and Cancellation Terms, the General
      Terms of Use, or the Generative Credits FAQ. The FAQ states credits are
      "consumed when using features powered by Firefly or our partner models
      upon generation" but does not address failed/errored/empty-result
      generations specifically. Confirmed via full in-page text search: no
      occurrence of 'fail' anywhere on the Generative Credits FAQ page
      (39,014 characters).

  # --- Domain 9: auto-renewal ---
  auto_renewal_default:
    value: "on"
    source: https://www.adobe.com/legal/subscription-terms.html
    evidence: "Subscription and Cancellation Terms (Creative Cloud for Individuals > Month to month): 'Your subscription will automatically renew each month without notice until you cancel. You authorize us to store your payment method(s) and to automatically charge your payment method(s) every month until you cancel.' Corroborated by the pricing-page footnote: 'Subscription automatically renews until you cancel.'"
  auto_renewal_disclosure_location:
    value: multiple
    source: https://www.adobe.com/express/pricing
    evidence: "Stated on the pricing page itself (footnote to the plan card and trial CTA: 'Subscription automatically renews until you cancel') AND in the dedicated Subscription and Cancellation Terms (quoted above) — two document classes in agreement."
  renewal_notice_commitment:
    value: no_notice_stated
    source: https://www.adobe.com/legal/subscription-terms.html
    evidence: >
      Subscription and Cancellation Terms: renewal at the existing rate is
      explicitly "without notice" ("Your subscription will automatically
      renew each month without notice until you cancel... We will
      automatically charge you the then-current rate for your plan, plus
      applicable taxes, every month upon renewal until you cancel"). A
      separate, narrower commitment exists only for a RATE CHANGE ("We may
      change your plan's rate each monthly renewal term, and we will notify
      you of any rate change with the option to cancel") — that is notice of
      a price increase, not advance notice of the renewal charge itself, so
      it does not meet the advance_notice_stated bar; noted here for
      completeness.

  # --- Domain 10: refund and cancellation terms ---
  refund_policy_exists:
    value: "yes"
    source: https://www.adobe.com/legal/subscription-terms.html
    evidence: "Subscription and Cancellation Terms: 'If you cancel within 14 days of your initial order, you'll be fully refunded. Should you cancel after 14 days, your payment is non-refundable, and your service will continue until the end of that month's billing period.'"
  refund_window_days:
    value: 14
    source: https://www.adobe.com/legal/subscription-terms.html
    evidence: "'If you cancel within 14 days of your initial order, you'll be fully refunded.' (Creative Cloud for Individuals > Month to month section, which governs this entry tier — see sources[] note.)"
  refund_conditions:
    value: unconditional
    source: https://www.adobe.com/legal/subscription-terms.html
    evidence: "Within the 14-day window, refund follows from cancellation alone — no usage threshold, stated reason, or approval step is attached ('If you cancel within 14 days of your initial order, you'll be fully refunded')."
  cancellation_self_serve:
    value: self_serve_documented
    source: https://www.adobe.com/legal/subscription-terms.html
    evidence: "'You can cancel your subscription anytime via your Adobe Account or by contacting Customer Support.' Self-serve via account settings is explicitly documented as available (contacting support is offered as an alternative, not the only route)."
  refund_policy_location:
    value: dedicated_refund_page
    source: https://www.adobe.com/legal/subscription-terms.html
    evidence: "The 14-day refund window and conditions appear only in the dedicated 'Adobe Subscription and Cancellation Terms' document. Confirmed absent from the General Terms of Use by full-text search ('refund' occurs once, in an unrelated Behance Talent Search clause; no occurrence of '14 day', '14-day', 'money back', or 'money-back'). Not stated on the pricing page."

  # --- Domain 11: commercial-use rights ---
  commercial_use_lowest_tier:
    value: free
    source: https://www.adobe.com/express/pricing
    evidence: >
      Pricing-page FAQ (official Adobe Express page): "Can customers make
      commercial use of the images generated with AI tools powered by
      Firefly? In general, you may use outputs from generative AI features
      commercially. However, if Adobe designates in the product or elsewhere
      that a beta version of a generative AI feature cannot be used
      commercially, then the generated outputs from that beta feature are for
      personal use only and cannot be used commercially." Not tier-gated (no
      "paid plans only" language); the carve-out is for specific beta
      features, not for the free plan generally. General Terms of Use is
      silent on "commercial use" (searched, not found), so per codebook
      Domain-11 authority order the pricing page is the operative source.
  watermark_removal_tier:
    value: unknown
    source: https://www.adobe.com/express/pricing
    evidence: "No document reviewed (pricing page feature grid, General Terms of Use, Subscription and Cancellation Terms, Generative Credits FAQ, Express Free-plan help page, Watermarks FAQ) states which tier(s) carry vendor watermarks or branding on outputs, or that none do. Same search as free_plan_watermark; see that variable's evidence."
  output_ownership_statement:
    value: user_owns
    source: https://www.adobe.com/legal/terms.html
    evidence: >
      General Terms of Use, section 4.2 Ownership: "As between you and Adobe,
      you (as a Business User or a Personal User, as applicable) retain all
      rights and ownership of your Content. We do not claim any ownership
      rights to your Content." Section 4.1 defines "Content" to include
      material "you upload, import into, embed for use by, or CREATE USING
      the Services and Software" — covering AI-generated outputs, not only
      uploads. Section 4.3 describes only a limited operational license Adobe
      needs back from the user (to host/display/share content), not a
      retained ownership claim.

  # --- Domain 12: undisclosed or unverifiable limits ---
  usage_cap_quantified:
    value: all_caps_quantified
    source: https://www.adobe.com/express/pricing
    evidence: >
      Every limit the documents attribute to the entry paid tier (Acrobat
      Express, Individual) carries a number: 250 generative credits per month
      (rate); 100GB storage (standing); 30 days version history (standing);
      3 accounts per social network (standing). The one "Unlimited" claim
      found for this tier — "Unlimited Quick Actions" (vs. the free tier's
      "10 PDF Quick Actions per month") — counts as quantified under rule 3
      because no qualifying fair-use/discretionary clause was found anywhere
      in the documents reviewed (see unquantified_limit_clause = absent).
  unquantified_limit_clause:
    value: absent
    source: https://www.adobe.com/legal/terms.html
    evidence: >
      General Terms of Use and Subscription and Cancellation Terms both read
      for this variable (full document read for the latter; comprehensive
      keyword sweep of section headings and terms — fair use, reasonable use,
      excessive use, throttle, abuse, rate limit, disproportionate, high
      volume, discretion, suspend — for the former, 74,656 characters). No
      discretionary volume/intensity-of-use clause found. The only
      discretion/suspension language located is unrelated to usage volume:
      termination for Terms violations (General Terms 11.2), discretionary
      termination of free/trial/complimentary access "to prevent abuse"
      (General Terms 3.7, about ending free access, not throttling a paid
      plan's stated allowances), payment-failure suspension (Subscription
      Terms), and content-moderation screening for illegal/abusive CONTENT
      (General Terms 2.2, conduct not volume — excluded by rule 3). No
      "acceptable use policy" distinct from these two documents was located.

conflict_note: not_applicable

computation_assumptions: >
  first_charge_amount_usd: entry tier Acrobat Express (Individual), default
  display state is monthly billing with no annual option ("No annual
  commitment, billed monthly"), so first charge = published monthly figure =
  $10.99; no annualization performed (codebook rule 2 applies only when the
  default state is annual). cost_per_output_computable: cost_per_output_unit
  = per_seat_month (unmetered per-seat software access, not a countable
  artifact type — see credit_to_output_rate_published for why the product's
  secondary generative-AI credit layer does not change this); the entry
  tier's published monthly price already equals the cost per seat-month, so
  cost_per_output_value_usd = 10.99 with no division required. Billing basis:
  monthly (per_month_billed_monthly). Included allowance: N/A (unit is the
  seat-month itself, not a consumable allowance).

coder_note: >
  Entry-tier selection (sampling-rules.md 7.2): eligible candidates were
  "Acrobat Express" (Individual, US$10.99/mo, annual-equivalent $131.88) —
  WINNER — and "Acrobat Express for Teams" (Businesses tab, US$11.99/mo per
  license, single-seat per rule 4, "Annual subscription, billed monthly",
  annual-equivalent $143.88) — LOSES, higher annual-equivalent. "Acrobat
  Express for Enterprise" is excluded under eligibility rule 2
  (sales-gated: "Contact Sales for more information"). Plans under the
  Students and Educators tabs were not priced/read because eligibility rule 1
  excludes them categorically (restricted to a named program) regardless of
  price. "Adobe Express Free" ($0.00) is not a paid-tier candidate.

  Product-boundary note for reproducibility: Adobe markets Express and
  Firefly heavily intertwined. The Adobe Express pricing page's own feature
  comparison table upsells "Adobe Firefly Pro" as a mentioned feature/perk,
  and adobe.com/express/ site navigation ("Plans" / "Compare all plans",
  href /express/pricing) sometimes surfaces an Adobe-Firefly-branded plans
  comparison (Firefly Standard/Pro/Pro Plus/Premium) instead of the
  Express-native comparison — see register_events. This record deliberately
  scoped every coded value to the Express-branded plan cards only ("Adobe
  Express Free" / "Acrobat Express" / "Acrobat Express for Teams" /
  "Acrobat Express for Enterprise"), never to Firefly-branded plans, since
  Adobe Firefly is a separate product_id already in this study's frame.

  credit_to_output_rate_published is coded `partial` on a structural edge
  case, argued in that variable's own evidence field: Express's principal
  output is unmetered per-seat access (not any single creditable output
