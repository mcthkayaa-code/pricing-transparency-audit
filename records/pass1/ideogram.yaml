coder_note: |
  Entry-tier candidates (sampling-rules 7.2): eligible = Plus, Pro, Team (Enterprise excluded,
  "Contact sales", fails eligibility rule 2 -- no publishable price). Annual-equivalent
  single-seat costs in default display state: Plus $15/mo x12 = $180.00/yr (WINNER,
  entry_tier_name); Team $20/user/mo x12 = $240.00/yr (single-seat basis, lost); Pro $42/mo
  x12 = $504.00/yr (lost).

  cost_per_output_value_usd range (cost_per_output_computable = partial, range case, per
  derived-variable table): at Plus tier ($15/mo, 1,000 credits/mo), per-image cost spans
  approximately $0.0019/image (Model 2a, Turbo, 0.125 credits/image) to $0.09/image (Model
  4.0 (2K), Quality, 6 credits/image), computed as 1000/credits-per-image, then 15/images.
  Not a single figure -> cost_per_output_value_usd stays not_computable.

  credit_rollover_policy nuance: the coded value (expires_at_period_end) describes the
  plan-included "subscription priority credits" pool, which is what backs the entry-tier
  price and the cost-per-output figures above. A separate, optionally-purchased "top-up
  credits" pool behaves differently and carries over unused ("will carry over to the next
  period if unused" -- pricing-page FAQ). The instrument's value list does not have a
  compound state for two credit pools with different policies, so the plan-included pool
  governs the coded value.

  refund_conditions nuance: docs.ideogram.ai/.../refunds names one exception path -- a
  duplicate charge for the same billing period may be corrected via support@ideogram.ai.
  This is coded as a billing-error correction, not a discretionary refund, so
  refund_conditions is not_applicable (no refund available) rather than conditional; the
  distinction is a judgment call, disclosed here for a reader who might weigh it differently.

  Judgment calls on product scope: (1) ideogram.ai/pricing has a second tab, "Ideogram API",
  a usage-based developer billing surface separate from the "Platform" (app) subscriptions
  coded here; not used for entry-tier selection since the reviewed product is the hosted
  image-generation app, not the developer API. (2) A distinct page, ideogram.ai/licensing/,
  sells commercial rights to SELF-HOST Ideogram's open model weights (e.g. a $300/mo
  "Self-Serve Commercial License", 10,000 images/mo) -- a different offering (self-hosting
  model weights) from the SaaS subscriptions on the main pricing page, and was not used for
  entry-tier selection, commercial-use, or ownership coding, which are drawn from the main
  Terms of Service governing the hosted app.

  usage_cap_quantified judgment call: "Larger generation queue" / "The largest generation
  queue" (Plus/Pro respectively) carry no number. Coded as an unquantified limit dimension
  by analogy to section 5.1's shared test and the free_plan_cap_documented rule's explicit
  listing of "queue priority" among limit dimensions to inventory; a coder who treats queue
  size as a pure quality descriptor rather than a "limit" would instead reach
  all_caps_quantified for this tier (1,000 credits/mo + unlimited slow credits + unlimited
  character consistency, all quantified per rule 3 since unquantified_limit_clause = absent).

  Administrative note: product_name recorded as "Ideogram AI" per the frozen frame row
  (frame-frozen-2026-08-04.csv), matching codebook section 6's "copied from the frozen
  frame" instruction.

  blindness: no other record, no review page, no pass-2 material was opened.
