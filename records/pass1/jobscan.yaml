variables:
  headline_price_usd: { value: 29.98, source: "https://app.jobscan.co/plan", evidence: "Quarterly card: \"$29.98 / per month\" (large, most-prominent figure on the card)" }
  headline_billing_basis: { value: per_month_billed_annually, source: "https://app.jobscan.co/plan", evidence: "\"Billed as $89.95 every 3 months\" -- CODEBOOK GAP: actual cadence is QUARTERLY (3-month prepay), not 12-month annual. The value list offers only *_billed_annually / *_billed_monthly with no quarterly option. Coded per_month_billed_annually as the nearest functional match (a monthly-equivalent headline figure that is actually charged as one lump prepayment for a multi-month term) because per_month_billed_monthly would falsely assert the charge recurs every single month, which the same card contradicts. Flagging for adjudication / a future codebook value (e.g. per_month_billed_quarterly)." }
  first_charge_amount_usd: { value: 89.95, source: "https://app.jobscan.co/plan", evidence: "\"Billed as $89.95 every 3 months\" -- stated directly, no multiplication assumption required. A 7-day free trial precedes this charge (see trial_exists); FAQ: \"Once your trial ends, you will be billed for the next quarter of your subscription if you selected a quarterly plan.\" No mandatory add-on added (see mandatory_addon_present); sales tax excluded per rule 5 (FAQ: \"We will apply state and local sales tax based on your billing address\")." }
  mandatory_addon_present: { value: "no", source: "https://app.jobscan.co/plan", evidence: "Quarterly tier's full advertised feature list (Unlimited Resume Scans, AI Optimizations, Cover Letter Generator, etc.) carries no separate required charge. \"Auto Apply Credits\" exist (see auto-apply page) but are an optional, separately-purchased, pay-as-you-go add-on (\"Pay only for what you submit\"), not a required charge to use the tier as advertised -- excluded under rule 3 (optional add-ons are not mandatory add-ons)." }
  annual_condition_disclosure: { value: adjacent, source: "https://app.jobscan.co/plan", evidence: "\"Billed as $89.95 every 3 months\" is printed in bold directly beneath the \"$29.98 / per month\" figure, inside the same plan card (confirmed via screenshot). NOTE: the construct here is a quarterly, not annual, prepayment condition -- see headline_billing_basis note on the codebook's annual-only framing; the adjacent/same_page/one_click_away/absent positional test applies identically regardless of the term length, and the condition is unambiguously inside the same visual price block." }
  annual_default_toggle: { value: no_toggle, source: "https://app.jobscan.co/plan", evidence: "No toggle control exists on the page. Free, Quarterly and Monthly render as three permanently simultaneous cards (confirmed via screenshot); there is no annual option and no interactive switch that changes which price displays, so nothing is \"preselected\" in the sense the variable measures. Coded no_toggle as the closest available value (page offers no billing-period switch to record a state for), not literally \"one billing period only\" since two paid periods are shown at once without a toggle." }
  free_plan_exists: { value: "yes", source: "https://app.jobscan.co/plan", evidence: "\"Free / $0 / forever\" plan card with a feature list and a \"Select\" button" }
  free_plan_cap_documented: { value: all_quantified, source: "https://app.jobscan.co/plan", evidence: "\"5 Free Resume Scans monthly\" (quantified rate: number+dimension+period) and \"5 ATS & Recruiter Findings\" (quantified standing limit: number+dimension). The plan's other listed items -- Job Tracker, Post Interview Thank You Notes, Resume Builder, Resume Manager, Chrome Extension, Jobscan Learning Center -- are unqualified feature inclusions, not limits, so they are not counted in this test." }
  free_plan_cap_value: { value: "5 resume scans per month | 5 ATS & Recruiter Findings", source: "https://app.jobscan.co/plan", evidence: "verbatim structure per section 5.1 format: quantity+unit+period for the rate, quantity+unit for the standing limit" }
  free_plan_watermark: { value: unknown, source: "https://app.jobscan.co/plan", evidence: "Silent on both the plan page and the dedicated resume-builder page (see jobscan-sources/resume-builder-check.txt). A third-party (non-official) summary claimed \"no watermarks\" but no official document states this, so per the documents-only rule it is not coded from it; unknown stands." }
  free_plan_duration: { value: perpetual, source: "https://app.jobscan.co/plan", evidence: "\"Free / $0 / forever\" -- standing tier alongside the paid tiers, no expiry stated anywhere in the documents" }
  trial_exists: { value: "yes", source: "https://app.jobscan.co/plan", evidence: "Quarterly card CTA \"Try 7 Days Free\"; FAQ \"How long will my free trial last? You will have 7 days from the time you start your trial.\"; corroborated in ToS §6: \"We offer a 7-day free trial to new users who register with the Services.\"" }
  trial_card_required: { value: unknown, source: "https://app.jobscan.co/plan", evidence: "No document states whether payment details are required to start the trial. The billing FAQ (\"Once your trial ends, you will be billed for the next quarter...\") implies a card is on file by the time the trial converts, but implication is not a statement -- this matches the codebook's own Vendor I worked example exactly (automatic conversion implies stored payment details, but that is not the same as a card-required statement)." }
  trial_length_days: { value: 7, source: "https://app.jobscan.co/plan", evidence: "\"You will have 7 days from the time you start your trial.\"; ToS §6 \"7-day free trial\" (agrees)" }
  trial_auto_converts: { value: "yes", source: "https://app.jobscan.co/plan", evidence: "\"Once your trial ends, you will be billed for the next quarter of your subscription if you selected a quarterly plan.\"; ToS §6 Free Trial: \"The account will be charged according to the user's chosen subscription at the end of the free trial.\" (agrees, no further buyer action stated as required)" }
  credit_system_present: { value: "yes", source: "https://www.jobscan.co/auto-apply", evidence: "\"Auto Apply uses a simple credit-based system.\" -- an intermediate currency (\"Auto Apply Credits\", also named on the plan page: \"20% off Auto Apply Credits\") distinct from the plan's core scan/optimization allowance, which is stated directly in output units (not credits)." }
  credit_unit_defined: { value: "yes", source: "https://www.jobscan.co/auto-apply", evidence: "\"One credit is used for each job you choose to Auto Apply to.\" -- defines the unit against an output (one submitted application)." }
  credit_to_output_rate_published: { value: partial, source: "https://www.jobscan.co/auto-apply", evidence: "Rate is published for a secondary output (Auto Apply submissions: 1 credit = 1 application) but the product's principal output (resume scans / AI optimizations, per cost_per_output_unit) is not credit-metered at all -- it is stated directly in output units (\"Unlimited\" / \"5 ... monthly\"). Matches the codebook's own Vendor J2 pattern: unit defined = yes, rate published = partial because the rate covers only a secondary output." }
  credit_rate_location: { value: pricing_page, source: "https://www.jobscan.co/auto-apply", evidence: "Credit pack prices (\"5 credits $8.50\", \"10 credits $15.00\", \"25 credits $35.00\") and the 1-credit-per-application rate are both on this one official page; coded pricing_page as the closest fit (the page functions as the price list for this feature), not app.jobscan.co/plan itself." }
  cost_per_output_unit: { value: per_seat_month, source: "https://app.jobscan.co/plan", evidence: "Entry tier sells unmetered access (\"Unlimited Resume Scans\", \"Unlimited AI Optimizations\") for a flat recurring fee per single-seat account, matching decision rule 2 (\"Where a product sells unmetered access to software rather than a countable artifact, the unit is per_seat_month\"); this is the principal output -- Auto Apply credits (see credit_* variables) meter a separate, secondary feature." }
  cost_per_output_computable: { value: "yes", source: "https://app.jobscan.co/plan", evidence: "Because the unit is per_seat_month, the entry tier's own published price directly is the cost per output unit -- no allowance figure to divide by, no assumption needed. See computation_assumptions." }
  computation_assumptions: { value: "Plan: Quarterly (entry tier). Billing basis: $29.98/mo default display ($89.95/3mo). Allowance: unmetered per-seat-month access (unlimited scans/optimizations). No period conversion needed; cost per output unit = $29.98, the seat-month price itself.", source: "https://app.jobscan.co/plan", evidence: "supports cost_per_output_computable = yes" }
  credit_rollover_policy: { value: unknown, source: "https://www.jobscan.co/auto-apply", evidence: "\"Premium users get 2 free Auto Apply credits, and their balance is topped up to 2 credits each month.\" -- addresses only the size of the monthly free allotment, not stated whether unused free credits or unused purchased-pack credits carry over or expire. Per rule 4, silence is unknown; not inferring from the reset-suggestive \"topped up to\" wording without an explicit statement." }
  failed_generation_charge_policy: { value: unknown, source: "https://www.jobscan.co/terms-of-service", evidence: "No document (ToS read in full, cancellation-policy, plan page, auto-apply page) states what happens to a free-tier scan or an Auto Apply credit if the underlying action fails or errors out. Silent, per rule 3 this is the expected/common finding." }
  auto_renewal_default: { value: "on", source: "https://www.jobscan.co/terms-of-service", evidence: "ToS §6 Billing and Renewal: \"Your subscription will continue and automatically renew unless canceled. You consent to our charging your payment method on a recurring basis without requiring your prior approval for each recurring charge, until such time as you cancel...\" (terms ranks first for this variable class; agrees with the cancellation-policy page)." }
  auto_renewal_disclosure_location: { value: multiple, source: "https://www.jobscan.co/terms-of-service", evidence: "Stated in ToS §6 (\"will continue and automatically renew unless canceled\") AND independently in the dedicated cancellation-policy page (\"Until you cancel, billing will continue according to the cycle stated at the time of subscription\") -- two document classes in agreement, per the rule that repetition across classes codes multiple." }
  renewal_notice_commitment: { value: unknown, source: "https://www.jobscan.co/terms-of-service", evidence: "ToS §6 and the cancellation-policy page both describe the renewal/billing mechanism in some detail but neither commits to (nor explicitly disclaims) notifying the buyer in advance of a renewal charge; the \"Fee Changes\" clause only promises notice of PRICE changes (\"in accordance with applicable law\"), not of routine renewal charges at the existing price. Coded unknown rather than inferring an absence from silence." }
  refund_policy_exists: { value: "yes", source: "https://www.jobscan.co/cancellation-policy", evidence: "\"Refunds will only be granted to Jobscan Premium members who refute their charges within 2 calendar days of the billing period start and have not used the service within the said billing period.\" (a conditional refund position; ToS itself is silent on refunds -- zero occurrences of \"refund\" in the full ToS text -- so this dedicated page governs)." }
  refund_window_days: { value: 2, source: "https://www.jobscan.co/cancellation-policy", evidence: "\"...within 2 calendar days of the billing period start...\"" }
  refund_conditions: { value: conditional, source: "https://www.jobscan.co/cancellation-policy", evidence: "Conditions beyond the request itself: window of 2 calendar days, \"have not used the service within the said billing period\", a 3.5% processing fee, must email support@jobscan.co with subject line \"Refund Request\", and \"We will grant/deny refund requests on a case by case basis.\"" }
  cancellation_self_serve: { value: self_serve_documented, source: "https://www.jobscan.co/cancellation-policy", evidence: "\"Cancel Membership instructions within your Account page\" -- cancellation itself needs no contact (corroborated by ToS §6: \"You can cancel your subscription at any time by logging into your account.\"). Note: a REFUND specifically (as opposed to plain cancellation) does require emailing support -- captured in refund_conditions, not this variable." }
  refund_policy_location: { value: dedicated_refund_page, source: "https://www.jobscan.co/cancellation-policy", evidence: "The refund position appears only on the dedicated \"Cancellation Policy\" page; the general ToS contains zero mentions of \"refund\"." }
  commercial_use_lowest_tier: { value: unknown, source: "https://www.jobscan.co/terms-of-service", evidence: "ToS §2 (Intellectual Property Rights) grants a limited license to Jobscan's OWN content/software for personal, non-commercial use; §7 (Prohibited Activities) bars using the Services for competing or \"revenue-generating endeavors\". Neither of these addresses commercial use of the AI-generated outputs (optimized resume text, AI-written cover letters/bullet points) the product produces for the buyer. No document found anywhere (ToS in full, SaaS Agreement -- which governs a separate enterprise/Order-Form customer track, not the entry tier -- cancellation-policy, plan page) states a commercial-use position for these outputs specifically. Since the product does generate artifacts (AI Cover Letter Generator, AI Bullet Point Generator, AI Resume Builder), the not_applicable case (no output a commercial-use right could attach to) does not apply per this variable's own cross-reference to output_ownership_statement's rule; coded unknown." }
  watermark_removal_tier: { value: unknown, source: "https://www.jobscan.co/plan", evidence: "No document states that any tier's outputs (downloadable resumes/cover letters, or scan reports) do or do not carry a watermark or Jobscan branding (see also free_plan_watermark and jobscan-sources/resume-builder-check.txt). Coded unknown rather than not_applicable: the product's outputs include downloadable documents (resume/cover-letter files), a media-artifact type a watermark could in principle mark, so documented absence cannot be presumed without a statement." }
  output_ownership_statement: { value: unknown, source: "https://www.jobscan.co/terms-of-service", evidence: "ToS §8-9 (\"User Generated Contributions\" / \"Contribution License\") address content a user posts PUBLICLY to Jobscan (forums, comments) -- \"We do not assert any ownership over your Contributions. You retain full ownership...\" -- which is the opposite direction from, and a different construct than, ownership of the outputs Jobscan GENERATES FOR the user (optimized resume text, AI cover letters). No clause addresses that. The SaaS Agreement's IP section covers a separate enterprise/Order-Form customer track and \"Customer Content\" (data the customer uploads), not generated output either. Product plainly generates artifacts (AI Resume Builder, AI Cover Letter Generator), so per this variable's own rule the silence codes unknown, not not_applicable." }
  usage_cap_quantified: { value: all_caps_quantified, source: "https://app.jobscan.co/plan", evidence: "Entry tier (Quarterly) limits: \"Unlimited Resume Scans\", \"Unlimited AI Optimizations\", \"Unlimited keyword comparisons\", \"Unlimited ATS & Recruiter Findings\" -- explicit no-limit statements. Per rule 3, unlimited counts as quantified unless a clause elsewhere qualifies it; a full read of the ToS and the (not-applicable-to-this-tier) SaaS Agreement found no fair-use/discretionary clause qualifying these (see unquantified_limit_clause = absent), so all stated limits are quantified." }
  unquantified_limit_clause: { value: absent, source: "https://www.jobscan.co/terms-of-service", evidence: "ToS read in full (all 29 numbered sections, including §7 Prohibited Activities and §13 Services Management) and the SaaS Agreement (enterprise track) read in full: every \"sole discretion\" clause found concerns content moderation, account termination for ToS violations, or security/abuse response -- none conditions the VOLUME or INTENSITY of ordinary product use (scans, optimizations, Auto Apply) on an unquantified standard such as fair use, reasonable use, or throttling. Coded absent (the determinate, full-points finding under rule G0), not unknown, since the documents were located and read to the end." }

coder_note: |
  Entry-tier selection (sampling-rules 7.2): two paid candidates were eligible (Free is $0, not a
  paid tier, and is excluded from this comparison entirely -- it is coded separately under the
  free_plan_* variables). Quarterly: $89.95 billed every 3 months = annual-equivalent $359.80
  (4 x 89.95); also matches the page's own per-month figure, $29.98 x 12 = $359.76 (rounding).
  Monthly: $49.95/mo = annual-equivalent $599.40 (12 x 49.95). Quarterly wins on lowest
  annual-equivalent single-seat cost and is entry_tier_name. Both candidates were generally
  available, self-serve, standing (not promotional/time-limited), single-seat -- both eligible,
  only the price basis decided it.

  CODEBOOK GAP (flagging for adjudication, not resolving unilaterally): Jobscan's entry tier bills
  quarterly (every 3 months), a cadence codebook-v1.2 does not enumerate. headline_billing_basis's
  value list only offers per_month_billed_annually / per_month_billed_monthly (no quarterly
  option); annual_condition_disclosure and annual_default_toggle are likewise named and defined
  around an annual/monthly binary. Coded the nearest functional match on each (see each variable's
  own evidence field for the specific reasoning) and flagged every instance individually rather
  than silently forcing an exact-sounding but inaccurate label. This is a genuine instrument gap
  found during collection, in the spirit of D-002/D-003/D-005 in the deviations log, not a
  by-the-book application of an existing rule; I have not edited deviations-log.md myself (out of
  a single-product coder's scope and shared with concurrent coders) and am surfacing it here for
  the orchestrator to log formally if warranted.

  SaaS Agreement (https://www.jobscan.co/saas-agreement) was read in full and is NOT used as a
  source for any coded value: it is a separate enterprise contract for an organizational "Customer"
  under a signed Order Form (Jobscan Coach / recruiters-and-career-coaches track), not the
  individual Free/Quarterly/Monthly consumer product our entry tier is drawn from. Mentioned here
  for transparency since it was consulted.

  Currency: D-003 mechanical check -- entry-tier prices rendered in USD directly on this
  Turkey-egressed read, no non_usd value was ever in play, so the non_usd-specific US-locale
  re-check was not separately required (its trigger condition never fired). A related but distinct
  localization WAS observed and logged as a display_variant register event: the Termly-hosted ToS
  iframe rendered in Turkish by default; the underlying content API's English original (locale:en)
  was fetched directly and used for coding instead.

  blindness: no other product's record, no review page, no pass-2 material was opened.

  D-009 re-read 2026-08-10: re-opened https://app.jobscan.co/plan live (rendered browser,
  non-essential cookies declined) and confirmed entry_tier_name (Quarterly), headline_price_usd
  ($29.98) and first_charge_amount_usd ($89.95) in a SECOND representation independent of the
  original innerText transcript: a structural DOM query (querySelectorAll on leaf nodes / direct
  textContent + outerHTML search) rather than a text-extraction transcript. Card order in the DOM
  confirms $29.98 maps to the Quarterly card (Free $0 / Quarterly $29.98 / Monthly $49.95, in
  that order), not a shifted row. Checked specifically for the nicepage-class error: zero <sup>/
  <sub> elements exist anywhere on the page, so no superscript-cents split is possible here. No
  pricing JSON API call was found in the network log to serve as a third representation; prices
  appear compiled into the Vue bundle rather than fetched at runtime. Evidence saved to
  jobscan-sources/d009-second-representation-2026-08-10.txt. Per the assignment's explicit
  instruction, headline_billing_basis is left as coded (per_month_billed_annually, the
  already-queued A-011 quarterly-billing case) — not re-litigated here. No correction; all four
  scoped values confirmed as coded.
