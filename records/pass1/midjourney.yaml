coder_note: |
  SOURCE LANDSCAPE. midjourney.com/pricing and /plans both 404 as of 2026-08-09 — Midjourney's
  marketing site was redesigned around a "research lab" homepage with no standalone pricing
  page. The only official price disclosure is the Zendesk help-center article "Comparing
  Midjourney Plans" at docs.midjourney.com; this record treats it as the pricing-class source
  (highest-ranking source that exists), and treats it as "help center" (not "pricing_page") for
  the document-class variables that distinguish the two, since it is hosted under docs.
  midjourney.com's /hc/ path. Reused prior run's local sources: pricing-archive-20260403.html (a
  web.archive.org capture of the OLD /pricing page shell — client-rendered React app, static
  HTML carries no price figures, kept only as evidence the old URL once existed, not used as a
  coded source) and tos-github-mirror.md (third-party GitHub mirror of a 2022-08-18 ToS version,
  used only to locate clauses per instructions — every clause taken from it was re-verified
  against the live docs.midjourney.com ToS, Version Effective Date 2026-05-27, which differs
  materially from the 2022 mirror: the 2022 version gated full ownership on paid-member status
  via a CC BY-NC license for non-paid users; the 2026 version grants "You own all Assets ... to
  the fullest extent possible" to everyone, with a narrower revenue-based carve-out instead).

  ENTRY TIER (sampling-rules 7.2). All four published tiers (Basic, Standard, Pro, Mega) are
  eligible: generally available, self-serve (no sales contact), standing plans, single-seat
  (ToS: "Only one user may use the Services per registered account"). Basic wins on the vendor's
  own directly-stated annual price (rule 2, "an annual figure is taken as it stands"): Basic
  $96/yr, Standard $288/yr, Pro $576/yr, Mega $1,152/yr — Basic lowest on every candidate.
  entry_tier_name = "Basic Plan".

  JUDGMENT CALLS (page has no toggle, no marketing "cards" — a plain two-row static table with
  Monthly Price and Annual Price shown simultaneously; computed CSS confirms both rows render at
  identical 15px/font-weight 400, no visual emphasis on either):
  1. headline_price_usd/headline_billing_basis/first_charge_amount_usd read the Monthly Price row
     ($10, billed monthly, no annual commitment) rather than the Annual Price row ($96/yr, "$8/
     month" equivalent) because it is listed first and requires no prepayment commitment. The
     annual figure is the alternate reading; a second coder choosing it would get headline=8.00,
     basis=per_month_billed_annually, first_charge=96.00 instead. Flagging for adjudication if
     contested.
  2. annual_default_toggle = no_toggle is a best-fit, not a clean match: the value's own text
     ("offers one billing period only") does not describe this page, which offers both
     simultaneously without a toggle mechanism; no_toggle is the closest available value.
  3. annual_condition_disclosure = adjacent: even though the chosen monthly headline doesn't
     itself require annual prepayment, the annual option is real, documented, and its condition
     ("20% discount ... committing to an annual plan, where the full year fee is paid upfront")
     sits in the paragraph immediately preceding the page's one and only price table — the
     closest this non-card layout gets to "inside the same visual price block." Coded on the
     value table's own not_applicable test ("no annual billing option exists") rather than
     rule 1's shorthand, since an annual option clearly does exist here.
  4. refund_window_days = unknown, not not_applicable or 0: Requesting a Refund states eligibility
     turns on lifetime USAGE ("less than 20 GPU minutes throughout the lifetime of your account"),
     never on a day-count. No document states a number of days either way.

  OWNERSHIP PROVISIONS (per assignment note). Two distinct tier-linked clauses govern outputs:
  (a) revenue threshold — ToS section 4: general rule is unconditional ownership ("You own all
  Assets ... to the fullest extent possible under applicable law"), EXCEPT a company or employee
  of a company grossing more than $1,000,000 USD/year must hold a Pro or Mega subscription to own
  its Assets; this is the clause output_ownership_statement=conditional keys on. Ownership itself
  does NOT lapse if the account is later downgraded or cancelled ("persists even if in subsequent
  months You downgrade or cancel"). (b) public-gallery default — ToS section 4 and the Keeping
  Your Creations Private article: outputs are public/remixable by default for every tier
  ("Midjourney thrives as an open-by-default community... every image and video ... can
  potentially be found on the Explore page"); Stealth (private) mode that overrides this default
  is available only on Pro and Mega. Basic/Standard subscribers own their images per (a) but
  cannot make them private on midjourney.com. commercial_use_lowest_tier is coded lowest_paid
  (Basic) for the general population per the docs/plans "General Commercial Terms**" grant to all
  four tiers; the same revenue-threshold clause (a) is the exception, quoted in that variable's
  evidence.

  ARCHIVAL. archive.org/save was attempted for the primary pricing page (2 attempts, both HTTP
  520) and the ToS (1 attempt, HTTP 520); a control save of https://example.com also failed
  (HTTP 429). This indicates the save endpoint was rate-limited/degraded network-wide at
  collection time (consistent with heavy same-day use across this study's other pass-1 records),
  not a problem specific to any one URL, so per-URL retries were not repeated for the remaining
  11 sources. All 13 sources actually coded from carry local copies instead (protocol 6.4):
  midjourney-sources/plans-page-rendered-20260809.txt, tos-live-20260809.txt, and
  billing-support-docs-rendered-20260809.txt (the other 11 articles, combined). archive_status =
  local_copy_only throughout; no value in this record is coded from an unsaved page.

  blindness: no other record, no review page, no pass-2 material was opened.

  D-009 re-read 2026-08-10: re-opened the Comparing Midjourney Plans help-center article live
  and confirmed entry_tier_name ("Basic Plan"), headline_price_usd ($10), headline_billing_basis
  (per_month_billed_monthly) and first_charge_amount_usd ($10) in a SECOND representation
  independent of the original innerText transcript: a raw structural DOM query of the page's
  <table> element (row/column cell text read directly, not linearized text). Confirmed the
  Monthly Price row for the Basic Plan column reads exactly "$10", correctly mapped to that
  column and not shifted. This re-read does NOT relitigate the original coder's flagged judgment
  call (reading the Monthly Price row rather than the Annual Price row, since the table has no
  toggle and shows both simultaneously at identical weight, re-confirmed on this read) -- it
  only confirms $10 is genuinely the figure printed in that cell. Confirmed 0 <sup>/<sub>
  elements exist anywhere on the page. Evidence saved to
  midjourney-sources/d009-second-representation-2026-08-10.txt. No correction; all four scoped
  values confirmed as coded.
