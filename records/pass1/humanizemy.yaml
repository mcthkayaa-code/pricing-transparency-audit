coder_note: |
  Entry-tier selection (sampling-rules.md §7.2): three eligible candidates (Basic, Pro, Ultra —
  all generally available, no sales contact, standing plans, single flat-rate tiers, not
  seat-scaled, not usage-based-only). Annual-equivalent single-seat cost: Basic $144/yr (WINNER,
  = entry_tier_name), Pro $216/yr (lost), Ultra $432/yr (lost). Free tier excluded from this
  comparison as $0/not a paid tier.
  Judgment calls made:
  - cost_per_output_unit coded `other`: the product meters by "requests" (vendor's own term,
    1 request = 1 humanized output), which fits none of the enumerated units cleanly; named as
    "per humanization request" rather than force-fit to per_document or per_1k_words.
  - free_plan_watermark and watermark_removal_tier both coded `not_applicable`: the documented
    principal output is rewritten text/prose, not an image/video/audio export; each variable's
    own value table carves out "output type cannot carry a watermark", and "watermark" does not
    appear anywhere across pricing, terms, refund-policy, or homepage (site-wide sweep).
  - credit_system_present coded `no`, not `unknown`: documents affirmatively state usage is
    metered directly in output units ("80 requests / month" etc.), which is documentary evidence
    of the metering mechanism itself (codebook §Domain 5 rule 1), distinct from the silent-vendor
    trap codebook §2.2 warns against (silence alone would require `unknown`, not `no`).
  - renewal_notice_commitment coded `no_notice_stated`: Terms §3's only notice commitment is
    scoped to price CHANGES ("we will email you before any price change takes effect"), not to
    ordinary same-price renewal charges, so it does not satisfy this variable's construct.
  - commercial_use_lowest_tier coded `unknown` despite output_ownership_statement = user_owns:
    kept as a distinct construct per instructions not to infer; no document anywhere uses the
    words "commercial use" or grants/restricts commercial exploitation of outputs specifically.
  No correction to the frozen frame row was needed (product_name, category, product_status,
  paid_submission all matched the live site at read time).
  Archival: web.archive.org saves succeeded for terms and refund-policy (both within 2 attempts)
  but failed for the pricing page after 3 attempts (2x curl to /save/, 1x browser navigation;
  CDX search confirms no capture exists) and for a fresh homepage save (used a pre-existing
  2026-07-26 capture instead); archive_status = local_copy_only for the pricing page, with a
  full rendered-text copy and a raw-HTML copy saved under humanizemy-sources/.
  D-003 currency check: not triggered — the vendor's own rendered pricing page displayed USD
  figures directly on every read from this Turkey-egress network, with no currency redirect or
  localization observed, and the page's own boilerplate states "All prices are in US dollars
  (USD)" as vendor-authored copy independent of visitor geography. No non_usd value was coded on
  this record, so no display_variant register event applies.
  blindness: no other record, no review page, no pass-2 material was opened.
