coder_note: |
  ENTRY-TIER CANDIDATES (sampling-rules.md 7.2). Eligible (generally available, no sales contact,
  standing plans): Plus $200.00/yr annual-equivalent (WINNER, single seat) | Max $1000.00/yr
  (stated directly, "Billed $1000 yearly") | Generative $2000.00/yr (stated) | Elite $10800.00/yr
  (stated) | Team Standard: sold in a minimum 2-seat block ("for teams of 2 to 30"), $40/mo/seat
  annual price x 12 x 2 = $960.00/yr minimum block | Team Premium: minimum 2-seat block, $400/mo/
  seat x 12 x 2 = $9600.00/yr minimum block. Excluded as ineligible: Enterprise ("Book a demo",
  "Custom pricing", "Minimum 10 seats" -- requires contacting sales, fails eligibility rule 2; this
  is not the sampling-rules 7.2 sales-gated SPECIAL case since Plus etc. are independently priced
  and eligible, so headline_price_usd is a normal money value, not no_public_price).

  PROMOTIONAL VS. STANDARD PRICING (per assignment note -- InVideo is known to run frequent
  promotional pricing). At read time (2026-08-09, pricing-rendered.txt) no promotional banner,
  strikethrough price, countdown timer, or "limited time" indicator was present anywhere on the
  pricing page (checked raw HTML for strikethrough/line-through/was-price/original-price/
  limited-time/sale-/countdown/flash-sale/offer-ends/expires -- zero matches; computed-style scan
  for line-through text -- zero matches). The only discount framing present is the standing
  15%/10% annual-vs-monthly toggle discount ("Annual 15% off" on Plus/Max/Generative, "10% off" on
  Elite), which reads as InVideo's standard default pricing structure, not a time-limited
  promotion. This is what was coded. A later re-check may find a different (promotional) state; if
  so protocol 6.6/6.8 governs and it becomes a register event, not a silent overwrite.

  COMPOSITE-UNIT PRICING (per assignment note). InVideo's principal composite unit is "credits", a
  currency-like unit (credit_system_present=yes) that converts to actual outputs (video, image,
  audio generations) at a DIFFERENT rate per third-party AI model, further varying by resolution/
  duration/audio within each model (video-model-pricing.txt: ~65 models, e.g. VEO 3.1 Fast
  1.28-9.60 credits per 4-8s generation, Kling 3.0 Video 1.01-25.20 credits per 3-15s generation).
  This composite structure is precisely why credit_to_output_rate_published=partial (rates exist
  only as per-model ranges) and cost_per_output_computable=no (no single model is named as
  canonical/typical, so computing one figure requires an assumption the codebook's rule 7
  forbids). This is a genuine, well-documented disclosure structure, not a gap in our search --
  the vendor publishes extremely granular rate tables, they simply don't collapse to one number.

  JUDGMENT CALLS.
  - commercial_use_lowest_tier=free: Terms Sec.4(h) grants the commercialisation licence for
    "Outputs you generate through the Services" with no tier carve-out found anywhere in the
    Terms, the AUP, or the pricing page; Sec.3(a) frames the Free Plan as one of the "Plans" the
    document covers. Coded free on the plain text; flagged here since it is the more consequential
    of the two readings a reviewer might reach.
  - output_ownership_statement=user_owns despite a Licensed-Content (stock-asset) carve-out in the
    same clause: treated the carve-out as a scope clarification (you don't own a stock clip merely
    by using it) rather than a tier/use-type condition on ownership of the buyer's own outputs,
    since the license explicitly "survives any cancellation" (the codebook's own `conditional`
    example turns on rights lapsing when a subscription ends, which is the opposite of what is
    documented here).
  - renewal_notice_commitment=advance_notice_stated: the commitment is conditional on the buyer's
    jurisdiction legally requiring it ("if you live in a jurisdiction that requires advance
    notice..."), not universal. The codebook offers no third "conditional" value for this
    variable; coded to the closer determinate value with the condition quoted verbatim in the
    variable's own evidence field so the nuance is not lost.
  - cost_per_output_computable=no rather than partial: see COMPOSITE-UNIT PRICING above and the
    reasoning recorded in video-model-pricing.txt. This is the single hardest call in this record;
    an adjudicator re-reading codebook Domain 6 rules 7 and 8 in sequence should reach the same
    conclusion, but the underlying situation (60+ interchangeable sub-priced models, not one
    output with one range) is not explicitly anticipated by the codebook's worked examples.
  - free_plan_cap_documented=none_quantified / free_plan_cap_value=unknown: a WebSearch AI-overview
    surfaced specific free-plan figures (4 exports/week, 10 video-min/week, 10GB storage, InVideo
    logo on exports) attributed loosely to invideo.io; NONE of those figures appear on the actual
    current official free-plan article (help.invideo.io/en/articles/9380226, read directly and in
    full, see free-plan-article.txt) or any other official page opened this session. Per protocol
    6.3 prohibition 7, no value is coded from a third-party/search-synthesis source; this is
    recorded so a re-check knows to look for those figures specifically if InVideo republishes them
    on an official page.

  CORRECTIONS TO THE FRAME ROW: none. category is copied verbatim from
  frame-frozen-2026-08-04.csv ("Faceless video"); the assignment brief's shorthand "AI video
  generator" describes the same product and is not a frame discrepancy requiring correction.

