coder_note: |
  ENTRY TIER: Standard selected (annual-equivalent $96.00/yr) vs losing candidate Pro
  ($288.00/yr = $24/mo x 12). Free excluded (not a paid tier). Both Standard and Pro are
  generally available, no sales gate, standing plans, single-seat (no seat-scaling found on
  this product).

  FIRST CHARGE PROVENANCE: $96.00 is the vendor's own published annual total ("$96 billed
  annually" printed in the price card), read directly, not a coder multiplication of $8 x 12
  (that identity holds only because the vendor's own numbers agree; recorded so a reviewer
  does not mistake this for a computed figure needing the x12-only-if-documented rule).

  CURRENCY CHECK (D-003/D-007): pricing page carries its own currency selector (USD/GBP/EUR)
  defaulting to USD; this satisfies arm 1 (vendor's own currency disclosure) directly, even
  though this collection ran from Turkey network egress (confirmed via archive.org response
  header x-nid: Turk Telekom on the save requests). No non_usd concern; all money values coded
  in USD as displayed.

  TWO-REPRESENTATION PRICE CHECK: $8/month, $96/year (Standard) and $24/month, $288/year (Pro)
  confirmed in THREE representations of the rendered pricing page: accessibility tree
  (read_page), raw DOM text (get_page_text), and a visual screenshot showing "$10" struck
  through / "$8" bold / "$96 billed annually" beneath for Standard, and equivalently "$30"
  struck / "$24" / "$288 billed annually" for Pro. No superscript-cents or toggle-state misread.

  A-012: no paid time-limited intro period found. Udio's trial (7 days) is a genuine FREE
  trial per ToS §3.5 and the help center; A-012 does not apply to this record.

  WATERMARK (free_plan_watermark, watermark_removal_tier -> both coded unknown): ToS §6.4
  requires non-subscribers (incl. free-plan users) to self-attribute Udio in track metadata
  when publicly sharing output, waived for paid subscribers. This is a contractual duty on the
  USER's future conduct, not a mark the vendor applies to the output file itself, so it was
  NOT treated as satisfying "watermark or branding" (the codebook's own worked example frames
  a watermark as a mark ON the output, e.g. a feature-grid row "Watermark-free exports").
  Flagging this as a judgment call for review; the underlying attribution fact is fully
  evidenced above regardless of which variable it best fits.

  COMMERCIAL USE (commercial_use_lowest_tier -> not_granted): a genuinely surprising,
  well-evidenced finding that contradicts general market assumption and several non-official
  (disregarded) third-party pages claiming paid tiers unlock commercial use. The CURRENT ToS
  (Last Revised November 12, 2025) restricts Output to personal/non-commercial use at §6.3 and
  separately prohibits commercial exploitation at §5.2, with no tier carve-out anywhere in the
  document for either clause. Only the ATTRIBUTION duty (§6.4) differs by tier. A WebSearch
  result summarizing help.udio.com claimed an official article states "you can use Udio content
  for commercial purposes" -- opened that exact article (answers-to-common-usage-questions)
  directly and read its raw DOM: the word "commercial" does not appear in it at all. Treated as
  a search-summary fabrication, not evidence, per the fabrication-avoidance instruction; verify
  structured/quoted claims against raw DOM before coding from them.

  TRIAL CARD REQUIREMENT: deliberately coded unknown despite ToS §3.5's auto-charge language,
  per the frozen rule barring inference from the existence of a charge.

  ARCHIVAL: all 9 sources archived successfully on first or second attempt (D-012 rate-limiting
  did not materialize this run); no local_copy_only fallback was needed.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "(1) OUTPUT OWNERSHIP: help.udio.com/en/articles/10739216-answers-to-common-usage-questions (dated 2025-03-26) states 'We don't claim any ownership over the content you generate' and 'You own the output' -- directly incompatible with udio.com/terms-of-service (Last Revised 2025-11-12) §6.1: 'the Company and/or its licensors own all right, title and interest in...the Output.' The help article pre-dates the ToS's current revision and appears stale/unupdated. Coded from the ToS: contractual variable, terms of service ranks first per protocol §6.2, and it is also the later document. (2) STANDARD/PRO MONTHLY CREDIT LIMITS: help.udio.com/en/articles/10739180-do-credits-roll-over (dated 2026-02-20) states 'Standard accounts come with a 1200 credit limit' and 'Pro accounts come with a 4800 credit limit' -- incompatible with udio.com/pricing (live: 2400/6000) and help.udio.com/en/articles/10739134-credits-and-credit-limits (2400/6000). Resolved, not merely hierarchy-ranked: help.udio.com/en/articles/12683565 (UMG partnership changelog, dated 2026-02-18) states 'The Standard subscription monthly credit limit has been increased from 1200 to 2400...Pro...from 4800 to 6000' -- the rollover article is simply stale by two days and was never updated. Coded 2400/6000 (pricing page ranks first for this pricing-class variable; independently corroborated and dated-explained by the changelog)."
