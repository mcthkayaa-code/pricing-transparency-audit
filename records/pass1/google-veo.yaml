default_display_state: >
  one.google.com/about/plans loads with the Monthly billing toggle preselected
  (tab labels "Aylik"/"Yillik", i.e. Monthly/Annual; Monthly is active on load,
  Annual shows "save up to 17%"). Non-essential cookie notice dismissed via
  Google's single "Anladim" (Got it) acknowledgement button -- no granular
  accept/decline choice is offered on this notice. Read live from this
  collection's Turkey network location, the page renders prices in TRY. Per
  protocol deviation D-003, an Accept-Language:en-US curl of the same URL and
  a US-crawled web.archive.org capture (2026-08-01, 6 days prior) of the same
  URL both show the vendor's own USD figures; those USD figures are coded
  (see register_events). A second official page, one.google.com/intl/en_us/
  about/google-ai-plans/, is explicitly US-locale (no toggle observed; shows
  monthly-only USD figures) and is used as a second independent pricing
  source; it names the entry tier "Google AI Plus" at a different price than
  one.google.com/about/plans -- both are recorded, see conflict_note.
