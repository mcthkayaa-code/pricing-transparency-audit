      $4.99, see headline_price_usd) while the allowance (200 Flow
      credits/month) and the per-generation rate (20 credits for Veo 3.1
      Fast, non-Ultra) are both published and agree across sources. Because
      the price input has two incompatible published figures, the computed
      cost-per-output likewise has two incompatible values -- codebook's own
