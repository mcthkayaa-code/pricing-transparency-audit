  output_ownership_statement:
    value: user_owns
    source: "https://policies.google.com/terms?hl=en-US"
    evidence: >
      Google Terms of Service, "Content in Google services" > "Your
      content": "Some of our services allow you to generate original
      content. Google won't claim ownership over that content." Directly
