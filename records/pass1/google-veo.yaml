  computation_assumptions:
    value: not_applicable
    source: "https://one.google.com/about/plans"
    evidence: >
      Per codebook 2.3, this field is required only when
      cost_per_output_computable is yes or partial; the coded value here is
      conflicting, so the field is not_applicable. The arithmetic attempted
      under both price readings is preserved in coder_note for a reader who
