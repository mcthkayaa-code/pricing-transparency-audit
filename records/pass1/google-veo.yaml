      the dimension it counts"). At least one quantified and one
      unquantified limit -> some_quantified.
  unquantified_limit_clause:
    value: present
    source: "https://support.google.com/flow/answer/16353333?hl=en"
    evidence: >
      "Why do I see 'You're requesting generations too quickly'? To balance
