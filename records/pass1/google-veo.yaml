variables:
  headline_price_usd:
    value: conflicting
    source: "https://one.google.com/about/plans | https://one.google.com/intl/en_us/about/google-ai-plans/"
    evidence: >
      Entry tier is Google AI Plus (cheapest Veo-inclusive plan; see
      coder_note). one.google.com/about/plans (US-crawled archive capture,
      2026-08-01): plan card "Google AI Plus (2 TB)", data-formatted-price
      "$9.99 / month" (sku g1.2tb). one.google.com/intl/en_us/about/
      google-ai-plans/ (live, 2026-08-07, explicit US locale): plan card
      "Google AI Plus1 $4.99/mo 400 GB storage". Same vendor, same plan name,
      two live official pages, incompatible prices -- both rank as "live
      pricing page" (protocol 6.2), hierarchy does not resolve which
      governs, coded conflicting per codebook 2.1 step 3.
  headline_billing_basis:
    value: per_month_billed_monthly
    source: "https://one.google.com/about/plans"
    evidence: >
      Both candidate prices ($9.99 and $4.99) are quoted "/ month" /"/mo" as
      recurring monthly charges in the page's default (Monthly-preselected)
      state; neither requires annual prepayment to show. Not per-seat
      (Google One is account-level, shareable with up to 5 people at no
      extra charge, not sold by seat count).
  first_charge_amount_usd:
    value: conflicting
    source: "https://one.google.com/about/plans | https://one.google.com/intl/en_us/about/google-ai-plans/"
    evidence: >
      Default display state is Monthly (not annual), so per codebook rule 3
      no annualization is performed; first charge = the displayed monthly
      figure itself. Inherits the same $9.99 vs $4.99 disagreement as
      headline_price_usd, for the same two URLs.
  mandatory_addon_present:
    value: "no"
    source: "https://one.google.com/about/plans"
    evidence: >
      Reviewed the Google AI Plus plan card/feature list (both pricing
      pages), the Flow credits help article, and the Flow get-started FAQ:
      no required separate charge, minimum credit purchase, platform fee,
      or onboarding fee is documented to use Google AI Plus (incl. Flow) as
      advertised. Additional AI-credit purchases exist but are optional
      top-ups, not mandatory.
  annual_condition_disclosure:
    value: not_applicable
    source: "https://one.google.com/about/plans"
    evidence: >
      The headline figure is read in the Monthly default state and does not
      depend on annual prepayment (an annual toggle exists and shows a
      discount, but it is not the state being coded), so per rule 1 this
      variable is not_applicable.
  annual_default_toggle:
    value: monthly_preselected
    source: "https://one.google.com/about/plans"
    evidence: >
      Page loads with the "Aylik" (Monthly) tab active/highlighted and
      "Yillik" (Annual) "%17 oranina varan indirim" (up to 17% off) shown as
      the unselected alternative. Recorded before any interaction, then the
      toggle was read (not clicked) for this determination.
  free_plan_exists:
    value: "yes"
    source: "https://support.google.com/flow/answer/16526234?hl=en"
    evidence: >
      "About free-of-charge Google Flow credits -- Who can receive
      free-of-charge Google Flow credits: All users who are not Google AI
      Plus, Pro, or Ultra subscribers receive 50 Google Flow credits per day
      free of charge to try Google Flow." Recurring daily allowance, no
      subscription and no time limit stated (distinct from the Google
      Account's free 15GB storage tier, which has no Veo/Flow access at
      all and so does not itself satisfy this variable).
  free_plan_cap_documented:
    value: all_quantified
    source: "https://support.google.com/flow/answer/16526234?hl=en"
    evidence: >
      The one limit documented for the free (no-subscription) allowance,
      "50 Google Flow credits per day," carries a number, a dimension
      (Flow credits), and a period (per day) -- a quantified rate per
      codebook 5.1. No other free-tier-specific limit is stated in
      unquantified terms.
  free_plan_cap_value:
    value: "50 Google Flow credits per day"
    source: "https://support.google.com/flow/answer/16526234?hl=en"
    evidence: "Same quote as free_plan_cap_documented."
  free_plan_watermark:
    value: unknown
    source: "https://support.google.com/flow/answer/16353333?hl=en"
    evidence: >
      The only official watermark statement found is tier-agnostic: "All
      outputs generated in Google Flow using Veo, Omni, or Nano Banana
      include invisible SynthID watermarks... a visible watermark can be
      added to generated images and videos. You can control this with the
      'Visible watermarking' toggle... A visible watermark will be applied
      automatically if you reside in India, South Korea, or Vietnam." This
      ties visible-watermark behavior to a user toggle and to residence,
      not explicitly to free vs. paid status, and the free (no-subscription)
      allowance is not called out separately anywhere in this FAQ. Cannot
      determine the free tier's specific watermark default from documents.
  free_plan_duration:
    value: perpetual
    source: "https://support.google.com/flow/answer/16526234?hl=en"
    evidence: >
      The free 50-credits/day allowance is documented as an ongoing,
      recurring daily grant for "all users who are not ... subscribers,"
      with no stated end date or expiry -- a standing offer, not a
      time-limited trial (trials are coded separately under domain 4).
  trial_exists:
    value: "no"
    source: "https://support.google.com/googleone/answer/16548195?hl=en"
    evidence: >
      Entry tier is Google AI Plus. Its dedicated official sign-up article,
      "Get a Google AI Plus membership," contains zero mentions of "trial"
      anywhere in its full text (checked raw HTML, not just a rendered
      summary). Both AI Plus plan cards on the two pricing pages use a plain
      "Get started"/"Get Plus" call to action, not trial language. This
      contrasts with the parallel Pro-tier article (support.google.com/
      googleone/answer/16476811), which explicitly refers to "the free
      trial of Google AI Pro or AI Pro Student" -- confirming trials are
      documented where they exist and their absence for Plus is a
      documented gap, not an unchecked one.
  trial_card_required:
    value: not_applicable
    source: "https://support.google.com/googleone/answer/16548195?hl=en"
    evidence: "No trial exists for the entry tier (trial_exists = no)."
  trial_length_days:
    value: not_applicable
    source: "https://support.google.com/googleone/answer/16548195?hl=en"
    evidence: "No trial exists for the entry tier (trial_exists = no)."
  trial_auto_converts:
    value: not_applicable
    source: "https://support.google.com/googleone/answer/16548195?hl=en"
    evidence: "No trial exists for the entry tier (trial_exists = no)."
  credit_system_present:
    value: "yes"
    source: "https://support.google.com/flow/answer/16526234?hl=en"
    evidence: >
      Output is metered through "Google Flow credits," an intermediate unit
      that converts into video (and image/music) generations at published
      per-model rates -- not an allowance stated directly in output units.
  credit_unit_defined:
    value: "yes"
    source: "https://support.google.com/flow/answer/16526234?hl=en"
    evidence: >
      Official per-model credit costs are published, e.g. "Veo 3.1 Fast: 20"
      credits per generation (non-Ultra), "10" for Ultra subscribers; "Veo
      3.1 Lite: 10" (non-Ultra) / "5" (Ultra); "Veo 3.1 Quality: 100" for
      all users. Each ties the credit unit to a specific video-generation
      output, satisfying credit_unit_defined regardless of tier.
  credit_to_output_rate_published:
    value: "yes"
    source: "https://support.google.com/flow/answer/16526234?hl=en"
    evidence: >
      Video is the principal output (Google Veo is a video generator).
      Exact credit costs are published per model for video generation
      (Veo 3.1 Lite/Fast/Quality, see credit_unit_defined evidence) -- not a
      range and not limited to a secondary output.
  credit_rate_location:
    value: docs_help_center
    source: "https://support.google.com/flow/answer/16526234?hl=en"
    evidence: >
      Per-model credit costs appear on this Google Flow help-center article;
      not stated on either pricing page (which show only the monthly credit
      allowance per plan, not the per-generation conversion rate).
  cost_per_output_unit:
    value: other
    source: "https://support.google.com/flow/answer/16526234?hl=en"
    evidence: >
      Veo generations are sold as discrete, fixed-length clips (8-second
      generations per the product's own marketing copy), charged per
      generation/model, not as a continuous per-minute rate a buyer could
