  refund_policy_location:
    value: multiple
    source: "https://support.google.com/googleone/answer/2736362?hl=en | https://one.google.com/terms-of-service"
    evidence: >
      Refund position is stated on a page dedicated to purchase/
      cancellation/refund policy, and the Terms of Service Section 4 also
