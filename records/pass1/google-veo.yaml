      to "balance resources" / "abuse," with no number given -- present.
conflict_note: >
  Two live, official Google pages disagree on the price of the entry tier
  ("Google AI Plus"), the plan that includes Google Flow/Veo access at the
  lowest cost. one.google.com/about/plans (Google One's classic plan
  selector; verified both live from Turkey with USD figures in its embedded
  schema.org offers, and via a US-crawled web.archive.org capture dated
  2026-08-01) shows "Google AI Plus (2 TB)" at $9.99/month. one.google.com/
  intl/en_us/about/google-ai-plans/ (a dedicated, explicitly US-locale
  Google AI plans marketing/comparison page, live 2026-08-07, carrying a
  schema.org dateModified of 2026-03-06 on one of its components) shows
  "Google AI Plus" at $4.99/month with 400 GB storage. Both pages agree
  exactly on Google AI Pro ($19.99/month, both sources) and on Google Flow
  credit allocations per tier (200/mo Plus, 1,000/mo Pro, 10,000/mo and
  25,000/mo for the two Ultra tiers -- corroborated independently by the
  Flow credits help article). Only the AI Plus price/storage figure
  disagrees. Both pages are "live pricing page" class (protocol 6.2 top
  rank for pricing variables); the hierarchy does not distinguish between
  two pages of the same class, so headline_price_usd, first_charge_amount_
  usd, and cost_per_output_computable are coded conflicting rather than
  picking one page unilaterally. Separately (not a coded-variable conflict,
  noted for the record only): the about/plans page's own embedded
  schema.org description text for its "Google AI Pro" offer still calls the
  $9.99 tier "Google One Premium" (a superseded name) and states the Pro
  tier's storage as "2 TB," while the same page's visible, rendered card
  title reads "Google AI Pro (5 TB)" -- the visible UI and the page's own
  invisible SEO metadata disagree with each other on Pro's storage figure.
  This does not affect any coded variable (storage is not itself coded) but
  is documented here as it may be relevant to adjudication or to a reader
  auditing this record.
coder_note: |
  COST_PER_OUTPUT_UNIT NAMED (codebook 7, rule 3, since none of the listed
  units fit and "other" was coded): unit is "per video generation
  (fixed-length clip, e.g. 8 seconds), billed in Google Flow credits" --
  Veo/Flow sells discrete per-generation credit costs by model, not a
  continuous per-minute rate.

  ENTRY TIER SELECTION (sampling-rules.md 7.2, per the orchestrator's
  product-specific framing: cheapest generally-available consumer plan
  that includes Veo generation). Candidates considered, all read in each
  page's Monthly-default display state, annualized at x12:
    - Google One "Basic" (100 GB), $1.99/mo, annual-equiv $23.88 --
      EXCLUDED as a candidate: no Gemini/Flow/Veo access documented on
      either pricing page (pure storage tier).
    - Google AI Plus (Veo via Google Flow, 200 Flow credits/mo), CONFLICTING
      price: $9.99/mo (annual-equiv $119.88, one.google.com/about/plans) vs
