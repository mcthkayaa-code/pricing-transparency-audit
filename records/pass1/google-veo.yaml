      cleanly; coded other. Unit name for coder_note: "per video generation
      (fixed-length clip, e.g. 8 seconds), billed in Google Flow credits."
  cost_per_output_computable:
    value: conflicting
    source: "https://one.google.com/about/plans | https://one.google.com/intl/en_us/about/google-ai-plans/"
    evidence: >
      The required price input (entry tier's price in the default display
