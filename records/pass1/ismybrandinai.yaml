coder_note: |
  Entry-tier candidates: zero eligible candidates existed; no paid tier is published anywhere (tool FAQ, tools index, about, and terms all document the product as free; /pricing returns HTTP 404). This is the sampling-rules section 7.3 free-only case, so entry_tier_name = not_applicable and the free-tier variables carry the record.
  cost_per_output_unit = other: unit is one robots.txt crawler-access check per submitted domain.
  Instrument tension flagged for adjudication: codebook section 5.2 lists cost_per_output_computable among the entry-tier variables and sampling-rules section 7.3 codes entry-tier variables not_applicable for free-only products, but codebook section 2.3 makes not_applicable unavailable on this variable and protocol 8.3.4 says C3 never leaves the denominator. Coded yes at 0.00 per the section 2.3 register, which governs the value list.
  auto_renewal_default: no billing of any kind is documented; with not_applicable unavailable, no_recurring_billing is the determinate value carrying the billing-does-not-recur state.
  E-domain split: E2 not_applicable on the principal-output test (analysis result, not watermarkable); E1/E3 unknown, not not_applicable, because the toolset does generate artifacts (llms.txt generator; terms' 'anything you generate') and the documents are silent on rights in them.
  Taxes/overages exclusion note per first_charge rule 5: moot, nothing is charged.
  Archival: /tools SPN save returned 404 at snapshot 20260805193941 after the initial attempt plus two retries; local copy retained (ismybrandinai-snapshots/tools.html). All five other sources publicly archived and verified 200. Local HTML copies of all six pages retained under ismybrandinai-snapshots/ for audit.
  Third-party caution: a web search for a pricing page surfaced brandinai.com ('BrandInAI', a paid AI-visibility tracker); that is a different vendor and no value here draws on it.

  D-009 re-read 2026-08-10: re-confirmed entry_tier_name, headline_price_usd,
  headline_billing_basis and first_charge_amount_usd (all not_applicable) in a representation
  independent of the original coding. Bash curl HTTP-status check (a different tool entirely,
  not a page-content read) on /pricing, /plans and /checkout all returned 404 today, same as at
  original collection. Live re-render of /tools/ai-bot-checker found zero "$" figures anywhere
  in the page text and structurally confirmed the free-tool FAQ answer via outerHTML (not just
  the innerText transcript): "<p><strong>Is this tool really free?</strong><br>Yes. It reads a
  public text file and analyzes it in your browser. No signup, no account, nothing stored.</p>".
  This remains a genuine free-only product (sampling-rules 7.3) with no pricing surface at all.
  Evidence saved to ismybrandinai-snapshots/d009-second-representation-2026-08-10.txt. No
  correction; all four scoped values confirmed as coded.
