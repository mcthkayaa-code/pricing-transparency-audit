coder_note: |
  Entry-tier candidates (sampling-rules.md 7.2), all standing / generally-available / single-
  seat, compared at lowest annual-equivalent cost in the pricing page's TRUE default display
  state (monthly — see DEFAULT-STATE CORRECTION below): Plus $2.49/mo => $29.88/yr (WINNER,
  entry_tier_name=Plus); Premium $9.99/mo => $119.88/yr (lost); Ultra $24.99/mo =>
  $299.88/yr (lost); Ultra MAX $49.99/mo => $599.88/yr (lost). A third-party aggregator
  (not an official source, not used for coding) also named a "Team" plan at $12.99/mo for
  5 seats; not found on the official pricing page after two independent representations
  (WebFetch + raw HTML), so not incorporated anywhere in this record.

  DEFAULT-STATE CORRECTION (binding "read a price twice, in two representations" rule): the
  first WebFetch pass on /pricing/ reported "Annual selected by default," which would have
  produced headline=$1.99, basis=per_month_billed_annually, first_charge=$23.88. A raw curl
  of the same URL shows three independent, mutually agreeing, mechanical signals for MONTHLY
  as the true default instead: the toggle checkbox carries a `checked` attribute in the
  server-rendered HTML, the page's own CSS rule pairs `:checked` with the highlighted/active
  Monthly tab styling, and the plan-grid container's own class is "pricing-grid monthley"
  (not "yearly"). Trusted the raw HTML/CSS over the WebFetch summary and coded
  headline_price_usd=2.49, headline_billing_basis=per_month_billed_monthly,
  first_charge_amount_usd=2.49, annual_default_toggle=monthly_preselected, and
  annual_condition_disclosure=not_applicable accordingly. This is a coder-tooling misread,
  not a vendor-served variant, so per the binding instruction it is NOT logged as a
  display_variant register_event — documented here instead. Full detail in
  pixlr-sources/pricing-page-2026-08-10.md.

  Browser rendering was attempted for DOM/check-icon inspection per operational guidance
  (mcp__Claude_Browser__preview_start, then tabs_create) but the shared browser pane was at
  its tab cap from concurrent sibling coder sessions (nicepage/originality.ai/phrasly/
  picsart/framer tabs observed) on both attempts, so no tab could be opened. Proceeded on
  raw HTML/CSS forensics instead, which for the default-toggle-state question is arguably
  stronger evidence than a single screenshot would have been (mechanical checked-attribute +
  CSS-selector + container-class agreement vs. one visual snapshot).

  JUDGMENT CALLS flagged for adjudication:
  - trial_length_days=7: the only documented trial is Premium's ("Try Pixlr Premium free for
    7 days"); no source ties a trial to Plus specifically. Coded 7 anyway because protocol
    8.3.3's B3 matrix marks trial_exists=yes plus trial_length_days=not_applicable an
    "impossible pair" returned for re-coding, so not_applicable was unavailable; used the
    only stated trial length in the documents.
  - commercial_use_lowest_tier=free: the License Agreement's commercial-use grant carries no
    tier qualifier anywhere in either legal document, so coded on the text as written.
    Caveat: whether a true non-paying user can generate ANY AI Content on a standing basis
    (as opposed to the one-time "20 credits new user" perk / 7-day Premium trial, neither of
    which was counted as a standing free-plan feature for free_plan_cap_documented) is not
    itself stated anywhere found. Flagging the tension between these two codings for the
    adjudicator rather than silently picking a resolution.
  - output_ownership_statement=unknown: both legal documents describe an extensive AI
    Input/Output LICENSE (user grants Pixlr broad rights), but neither makes an affirmative
    OWNERSHIP/TITLE statement about generated output specifically.
  - renewal_notice_commitment=unknown, not no_notice_stated: the nearest Terms of Use clause
    reserves the right to change "price, package and/or features... at any time, with or
    without notice," but that is about plan/price changes generally, not specifically about
    notice before a renewal charge; treated as adjacent rather than on-point to avoid
    over-reading a different clause.
  - free_plan_cap_value=unknown: free_plan_cap_documented=none_quantified because the only
    identified free-plan limit ("daily free saves," referenced repeatedly in bounce/upsell
    copy) never carries a number in any official document found. unknown here means "no
    quantified figure exists to record," not "unclear whether a cap exists."
  - credit_to_output_rate_published=partial / cost_per_output_computable=partial: the
    pricing page's own "Estimated monthly usage" panel gives credit-to-output figures only
    as "~" approximations across three image-quality tiers (fast/pro/ultra), with no single
    stated exact rate for the principal output (image). Treated the vendor's own
    approximation as equivalent in kind to a published range under the codebook's range rule
    (cost_per_output_computable rule 8 / credit_to_output_rate_published's range clause).
  - Two "new user" credit mentions ("enjoy the freedom of generating 20 images using 20
    credits" as a new-user perk, separately "our free trial to experience 250 credits") were
    read as one-time/promotional offers rather than a standing free-plan feature or the
    entry tier's own trial, and excluded from free_plan_cap_documented and from
    usage_cap_quantified accordingly.

  Currency (D-003/D-007): Terms of Use states "All Fees are quoted in United States Dollar
  (USD) unless otherwise specified by Pixlr" — the vendor's own currency disclosure, the
  strongest arm in the currency-check hierarchy. No currency selector, country picker, or
  non-USD figure was encountered on any official page fetched. All money values in this
  record are coded as plain USD figures; none is `non_usd`. Accept-Language was not used as
  a locale signal for this determination, per the D-007 rule.

  blindness: no other record, no review page, no pass-2 material was opened.

