coder_note: |
  BUNDLE: the entry tier (Essential) is a bundle in the vendor's own wording. One
  subscription/credit pool covers "AI Content detection", "Advanced plagiarism detection",
  "AI Image & deepfake detection", OCR document scanning, and PDF report generation
  together; the pricing page never sells AI detection alone.

  ENTRY TIER: eligible candidates were Essential ($120.00/yr annual-equivalent, winner),
  Advanced ($192.00/yr), Elite ($312.00/yr); all generally available, no seats/sales gate.
  Free ($0) is not a paid-tier candidate. Enterprise/Custom is sales-gated and excluded
  under sampling-rules 7.2 eligibility rule 2.

  CREDIT POOL: AI-detection and plagiarism scans draw from the SAME shared monthly credit
  pool, at different per-word rates (AI detector 1 credit/word, plagiarism 2 credits/word,
  fact-checker/writing-feedback/essay-grader 1 credit/word each; image Basic Scan 200
  credits, Advanced Scan 500 credits) -- not separate allowances. Source: help center
  text-analysis and image-analysis articles, "credit estimator updates immediately as you
  toggle features on and off".

  CHARACTER CAP: "up to 200,000" characters per scan is the SAME figure for Essential,
  Advanced and Elite in the comparison table (one shared cap across paid tiers, not a
  per-tier split). Free plan's per-scan character cap is not stated in extractable text
  (table cell renders blank, likely an icon); not asserted either way.

  E1/E2/E3 (commercial use, watermark, output ownership): coded not_applicable on all
  three, following the codebook's own worked example for a detection-score output
  (watermark_removal_tier's "detection score or analysis table" case). Checked rather than
  assumed: the ToS "revenue-generating"/"compete with us" clause was read in full and is a
  general anti-scraping/anti-competition prohibited-use clause about the Site, not a
  commercial-use-of-output grant. One caveat considered and rejected: Winston does generate
  a distinct PDF report artifact ("Generate shareable PDF reports"), so an argument exists
  for output_ownership_statement = unknown instead of not_applicable (a report is closer to
  "an artifact" than a bare score). Coded not_applicable for consistency with E1's test,
  which the codebook states output_ownership_statement shares; flagging for adjudication.

  FREE-PLAN DURATION: genuine unresolved ambiguity, not a cross-source conflict (both
  readings come from the same single pricing-page document) -- see free_plan_duration
  evidence. trial_exists coded yes on the HUMN-1-certification trial specifically (a
  paid-tier-exclusive feature given free for 14 days), which is a narrower and more
  literal reading than treating the whole Free plan as a trial.

  USAGE_CAP_QUANTIFIED judgment call: the ToS fair-use/rate-limit clause is headed
  "API Users" and its operative sentence says "continued use of the API", narrower than
  the codebook's worked example (a fair-use clause stated to apply to "all plans"). Coded
  some_quantified (buyer-protective: API access is bundled into the Essential tier, and
  the "unlimited" scans-per-hour claim is not demonstrably clean of this clause) rather
  than all_quantified; flagging the scope question for adjudication.

  CONFLICT (not tied to a single coded variable): the pricing page lists "Top-up Credits"
  as a feature bullet under all four tier cards equally, but two help-center pages
  (text-analysis article and how-much-does-it-cost) both state credit top-ups are an
  Elite-only capability. No coded variable in this instrument covers top-up availability
  directly, so no value was changed, but the divergence is recorded per protocol 6.2.
  Both URLs: https://gowinston.ai/pricing/ and
  https://help.gowinston.ai/getting-started/how-to-use-winston-ai-for-text-analysis and
  https://help.gowinston.ai/pricing/how-much-does-it-cost.

  NOT USED: https://getwinstonai.com/terms.html (different domain than the frame's
  vendor_home_url; could not confirm same-company official status, so not opened).

  REPRESENTATIONS CONFIRMED: money/credit figures on the pricing page were confirmed in
  two independent extractions (browser get_page_text raw rendered text, DOM-level
  javascript_tool read of the billing toggle, and a separately-run WebFetch extraction of
  the same URL) that agreed on every figure; no superscript-cents or digit-concatenation
  pattern present (all prices are whole dollars). Archive.org saves failed for every
  source with "Claude Code is unable to fetch from web.archive.org" (tool-level failure
  matching deviation D-012's pattern); two attempts made on the primary pricing page URL,
  then treated as systemic and not retried per source; all sources are local_copy_only,
  dated verbatim captures saved under winston-ai-sources/.

  blindness: no other record, no review page, no pass-2 material was opened.
