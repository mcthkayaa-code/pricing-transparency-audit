coder_note: |
  PRODUCT-IDENTITY DISAMBIGUATION: Hostinger operates two distinct "AI website builder" surfaces.
  (1) Hostinger Horizons (hostinger.com/horizons), a standalone AI "vibe coding" app/website
  builder with its own dedicated pricing table (Free/Explorer/Starter/Hobbyist) - this is what was
  coded, matching the frame's exact product_name "Hostinger Horizons". (2) the general Hostinger
  Website Builder hosting plans (hostinger.com/website-builder: Premium/Business, $2.99-3.79/mo
  promo vs $10.99-16.99/mo regular), which bundle unrelated AI text/image tools as features of a
  hosting plan. These two pages were opened only to disambiguate the product before coding and no
  coded value was taken from hostinger.com or hostinger.com/website-builder.

  ENTRY-TIER SELECTION (sampling-rules.md 7.2): three eligible paid candidates on
  https://www.hostinger.com/horizons, all standing/generally-available/no-sales-contact/single-seat:
  Explorer $6.99/mo = $83.88/yr (WINNER, lowest annual-equivalent), Starter $13.99/mo = $167.88/yr
  (lost), Hobbyist $39.99/mo = $479.88/yr (lost). The $0 "Free" card was excluded as a candidate
  because it is coded as a trial, not a paid tier (see JUDGMENT CALL below).

  RENEWAL / HOSTING-BUNDLING FINDING (the promo-vs-renewal gap this study targets, and it cuts
  differently than Hostinger's general reputation for post-promo hosting hikes): official sources
  state the Explorer SUBSCRIPTION price itself does NOT increase on renewal - pricing page:
  "Renews at $6.99/mo" (https://www.hostinger.com/horizons); help-center Subscription Management
  article: "We offer renewals for the same price as the first charge, following the same period of
  the plan purchased." (https://www.hostinger.com/support/10683662-hostinger-horizons-subscription-management/).
  However, HOSTING is bundled free only for the plan's initial term: the pricing page labels
  hosting "Free for 1 year" inside the Explorer/Starter/Hobbyist cards, and the official
  hosting-requirements article confirms: "If you do not have an active hosting plan, hosting is
  included with your Hostinger Horizons purchase for the duration of that plan. After this period,
  hosting and Hostinger Horizons are billed separately." (https://www.hostinger.com/support/hostinger-horizons-hosting-requirements/).
  No official document located states the dollar amount charged for hosting once it is billed
  separately, so that renewal-year hosting add-on cost could not be coded as a value (it is
  distinct from first_charge_amount_usd, which is what the pricing page states is charged at
  signup and already correctly includes free-for-year-1 hosting). This is a real cost component
  with no published renewal price - a transparency finding worth flagging to the adjudicator even
  though no single codebook variable captures it directly.

  JUDGMENT CALL (free_plan_exists vs trial_exists): the $0 card sits in the same pricing-table
  position as the three paid tiers and is labeled "Free", which could read as a standing free plan
  (domain 3). It was coded as a trial (domain 4) instead because: (1) its own feature-list heading
  is the vendor's literal words "With your free trial:", not a plan-features heading; (2) its
  data-qa control id is "...horizons:freetrial"; (3) its help-center article is titled "How to
  start a free trial" (https://www.hostinger.com/support/11131062-hostinger-horizons-how-to-try-it-for-free/);
  (4) its 5-credit grant is a one-time allotment, not a recurring monthly allowance like every paid
  tier; (5) it is explicitly gated from publishing ("No free hosting", "Upgrade anytime to go
  live"). Per codebook-v1.md Domain 3 rule 1, "A time-limited free trial is not a free plan" -
  applied here on the vendor's own trial framing even though no explicit day-length is stated (see
  trial_length_days = unknown). A reviewer who reads this differently should flip free_plan_exists
  to yes and re-code B1/B2 accordingly.

  NOTE on cost_per_output_unit/credit_unit_defined: Horizons' principal output is a generated
  website/web app, but the vendor's own pricing cards foreground "AI credits/mo" (not website
  count) as the headline metered resource, and per-plan website-count caps are a secondary bullet
  further down each card. No codebook unit (per_video_minute/per_image/per_1k_words/
  per_audio_minute/per_page/per_headshot/per_document/per_presentation/per_seat_month/per_api_call)
  fits a vibe-coded website/app, so this is coded "other" / "AI generation credit". A reviewer
  could instead treat "website" as the output unit (price-divided-by-website-cap would then be
  technically computable, e.g. Explorer $83.88/yr / 1 website); not coded that way here because
  the vendor's own framing and the actual metering mechanism is credits, at an admittedly variable
  per-request rate, not website-count, and website-count computability would not reflect real
  determinability of cost.

  CURRENCY (D-003): checked via curl with Accept-Language: en-US,en;q=0.9 (US locale) directly
  against https://www.hostinger.com/horizons; server-rendered HTML shows USD figures throughout
  ($6.99, $13.99, $39.99, etc.), so non_usd does not apply and no display_variant was logged.

  D-009 PROVENANCE CHECK (2026-08-12): first_charge_amount_usd (83.88) is exactly 12x
  headline_price_usd (6.99), the pattern the D-009 sweep report flagged for a provenance check
  across five records including this one. Re-examined independently against this record's own
  local capture (hostinger-sources/horizons-pricing-page.html.txt): the Explorer card prints "Get
  12 months for $83.88 (regular price $119.88). Renews at $6.99/mo." verbatim - the annual total
  is a vendor-published figure printed directly on the page, not a coder computation (6.99 x 12 =
  83.88 exactly, but no multiplication was needed to arrive at the coded value). Case 1 (vendor
  published the annual total; no computation happened). Verdict: SUPPORTED. 83.88 stands,
  unchanged; see computation_assumptions for the added source note.

  blindness: no other record, no review page, no pass-2 material was opened.
