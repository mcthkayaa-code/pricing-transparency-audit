coder_note: |
  ENTRY TIER SELECTION (sampling-rules.md 7.2): four standing, generally-available,
  self-serve, single-seat candidates on the pricing page — Basic $10/user/mo, Pro $20,
  Team $30, Max $200, all "billed annually" in the default display state. Annual-equivalent
  single-seat cost: Basic 10x12=120.00 (winner), Pro 20x12=240.00, Team 30x12=360.00,
  Max 200x12=2400.00 (all lost). "Plus AI for Enterprise" is excluded as a candidate under
  sampling-rules.md 7.2 eligibility rule 2 (contact-sales only, no published price).

  PRODUCT SCOPE / BUNDLING: Plus AI is sold as an add-in inside Google Slides and
  PowerPoint, not a standalone web app (per assignment). The Basic/Pro/Team/Max plans
  coded here grant AI presentation generation in both host apps under one subscription
  ("your Plus AI subscription includes access to the Plus AI extension in both Google
  Slides and PowerPoint" — pricing-page FAQ). The vendor's site also nav-links an
  adjacent "AI for Google Docs" product and a separate "Live Snapshots" product; the
  pricing page's own plan cards do not mention Google Docs at all, so no bundling claim
  is made either way for it. Live Snapshots is confirmed a DISTINCT product with its own
  separate free/paid plan (5 vs 25 snapshots/org, guide.plusai.com/other/live-snapshots/
  free-and-paid-plans) entirely outside the Basic/Pro/Team/Max structure coded here —
  not used as evidence for any variable on this record.

  FREE-PLAN JUDGMENT CALL: pricing-page FAQ ("What limitations are there for the free
  trial?") contains a backward-looking clause — "If you previously signed up for the Plus
  free plan or upgraded to a paid plan, you will not be able to start a new free trial" —
  that references "the Plus free plan" without affirmatively claiming one currently
  exists. Read against guide.plusai.com/plus-ai/plans-and-billing's current, present-tense
  "You need a paid plan to use Plus AI" (and no Free card on the current pricing page),
  coded free_plan_exists = no rather than conflicting; see conflict_note.

  COST-PER-OUTPUT RANGE (secondary to the coded partial/not_computable): using Basic's
  $10/user/mo (annual default) and 1,500 credits/mo against the published 40-170
  credits/task range: 1500/170 = 8.8 tasks/mo (floor) to 1500/40 = 37.5 tasks/mo
  (ceiling) => $10/37.5 = $0.27 to $10/8.8 = $1.14 per task. This is a range across an
  undefined "task" unit, not confirmed to equal one full presentation, so it is NOT
  published as cost_per_output_value_usd (stays not_computable per the derived-variable
  rule for the range case).

  CURRENCY CHECK (deviation D-007): pricing page rendered in USD on both the static
  WebFetch pass and the live browser render from this session's Turkey network path; no
  currency selector, country picker, or non-USD figure was observed anywhere on the
  page. Arm 1 (vendor's own served currency) returned readable USD prices directly, so
  the check stopped there per the binding rule; non_usd was not applicable. (No
  Accept-Language reasoning was used or needed.)

  A-012: not applicable to this product. The trial is a genuinely free 7-day trial
  (1,000 AI credits at no charge, card on file for auto-conversion afterward), not a
  paid time-limited intro period.

  READ TWICE (binding rule): headline figures for all four tiers were confirmed in two
  representations — static WebFetch HTML->text extraction and live-rendered
  document.body.innerText via headless browser — both returned identical figures
  ($10/$15, $20/$25, $30/$40, $200/$240). No superscript-cents artefact; magnitudes are
  monotonic and consistent with tier ordering and naming.

  ARCHIVAL: all three primary sources hit the two-attempt cap without producing a
  same-day, content-showing public archive capture (pricing and terms both returned
  stale existing captures on both attempts; the plans-and-billing capture got a same-day
  timestamp but its payload is a non-readable RSC streaming fragment). All three are
  coded archive_status = local_copy_only with dated local copies retained in
  plus-ai-sources/ (see sources[].note for specifics per URL).

  GITBOOK "ASK" QUERIES: guide.plusai.com's docs platform (GitBook) exposes an
  AI-query feature via a documented `?ask=` URL parameter, and its response text
  includes a boilerplate block addressed to "AI agents" inviting further such queries.
  This was recognized as vendor-published platform documentation, not an instruction
  from this study's operator, and was not treated as one. It was used twice, narrowly,
  to locate real published pages (confirming no separate free plan existed beyond
  Live Snapshots, and probing for an explicit annual lump-sum billing statement); its
  own generated answer text was never cited as the source of a coded value — only the
  underlying documents it pointed to (plans-and-billing.md, free-and-paid-plans.md,
  both already opened and cited directly) were used as evidence.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Not scored as a hierarchy-resolved conflict, recorded for transparency: the pricing-page trial-limitations FAQ references \"the Plus free plan\" (https://plusai.com/pricing) in a backward-looking eligibility clause that does not affirmatively state a free plan currently exists, while guide.plusai.com/plus-ai/plans-and-billing (https://guide.plusai.com/plus-ai/plans-and-billing) currently and explicitly states \"You need a paid plan to use Plus AI.\" Coded free_plan_exists = no from the latter; see coder_note."
