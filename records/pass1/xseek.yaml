coder_note: |
  ENTRY TIER SELECTION (sampling-rules 7.2). Eligible candidates: Starter ($249.99/mo, annual-
  equivalent $2,999.88) and Growth ($499.99/mo, annual-equivalent $5,999.88) -- both generally
  available, purchasable without contacting sales, standing (non-promotional) plans, not seat-
  scaled (unlimited users on every tier). Starter wins on lowest annual-equivalent cost; Growth
  is the losing candidate, recorded here with its figure. Scale is NOT an eligible candidate:
  its price is "Custom" and its only call to action is "Book a 30-min call", failing eligibility
  criterion 2 (purchasable without contacting sales). An unrendered embedded string elsewhere on
  the site ("agencyNote":"For agencies managing multiple clients, ask about our Agency Partner
  pricing -- starting at $250/month") was found in the page's JSON payload but never displayed
  on this read and is sales-gated ("ask about"); it was not treated as a pricing-page figure and
  did not enter the entry-tier comparison.

  FREE-TOOLS-VS-FREE-PLAN JUDGMENT CALL. xSeek publishes a set of separate, no-account utilities
  ("Agent-Ready Scan", "AI Robots.txt Checker", "AI LLMs.txt Generator", a page-weight checker)
  explicitly labelled "Free tools - no account" and explicitly contrasted against the priced
  product on the tools index page itself: "These tools scratch the surface. xSeek gives you
  Share of Voice, content gaps, competitor tracking, and a clear action plan -- continuously"
  [paid]. They are one-shot diagnostics ("paste a URL, get a file... run them, copy the output,
  close the tab"), not an ongoing-allowance tier of the priced tracking/content product, so they
  were not coded as a free plan of THIS product (free_plan_exists = no, coded from the pricing
  page, which lists three paid tiers only). "xSeek Desktop" is also not a free plan: its own docs
  page states a prerequisite of "An xSeek account with an active plan -- Starter, Growth, or
  Scale. Desktop is free with any tier", i.e. it requires an existing paid subscription. A one-
  time "Run a free analysis of your AI visibility" lead-magnet CTA on the AI-visibility-tracking
  landing page was treated the same way (a one-off freebie, not an ongoing plan or a trial of a
  paid tier). Recorded as a judgment call per the agent brief's instruction to write uncertainty
  into coder_note rather than resolve it silently.

  E1/E2/E3 (commercial_use_lowest_tier, watermark_removal_tier, output_ownership_statement) --
  NOT_APPLICABLE WAS CHECKED AND REJECTED, NOT ASSUMED. The task brief flagged that a sibling
  detector-type product coded all three not_applicable because its output is a score rather than
  a media artifact, and asked whether the same reasoning holds here from xSeek's own documents.
  It does not, cleanly. xSeek's pricing tiers are framed around tracking capacity (prompts
  tracked / websites / opportunities), which reads like the "detection score / analysis table"
  case -- but the vendor's own how-it-works page and its xSeek Desktop page document a real,
  separate content-generation feature ("Content Studio", "AI content generation -- articles from
  real visibility data + your brand voice... You review, you publish", a demo draft shown as
  "1,240 words... Publish"). That is a genuine publishable text artifact the codebook's
  not_applicable test ("no output [a right] could attach to") does not cleanly cover, since an
  output plainly exists. No official document (ToS, pricing page, docs, privacy policy) states
  who owns that generated content, whether commercial use of it is granted, or whether it (or
  any dashboard/report export) carries a watermark or attribution mark at any tier -- so all
  three are coded unknown (a real disclosure gap, evidenced by silence on a construct that does
  apply) rather than not_applicable (which requires positive evidence the construct does not
  exist, per codebook 2.2, and no such evidence was found).

  No frame-row correction needed: vendor_home_url resolved cleanly, and "AI bot checker" as a
  category fits -- the vendor's own free-tools suite includes an "AI Robots.txt Checker" for AI
  crawler access, alongside the priced AI-visibility/citation-tracking product.

  Second representation checks performed per the two-representation rule: headline and first-
  charge figures were confirmed in (1) the accessibility tree, (2) a live DOM innerText regex
  query showing aria-pressed="true" on the USD toggle, and (3) the static (unrendered, curl-
  fetched) HTML body text, which already contained "$249.99" and "$499.99" in plain text -- this
  page is server-rendered, so no D-005 rendered-read escalation was strictly required, though a
  full browser render was performed anyway and matched exactly.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: >
  Three related disagreements between the live pricing page (highest authority for pricing-class
  variables: trial terms, free-tier limits, plan composition, per protocol 6.2) and the Terms of
  Service (https://www.xseek.io/terms, "Last updated: January 31, 2026"), all coded from the
  pricing page per the hierarchy, with the ToS's conflicting language recorded here rather than
  silently discarded:
  (1) TRIAL. Pricing-page FAQ (https://www.xseek.io/pricing): "We prefer an advice-first
  approach: book a 30-minute call with a strategist... No generic demo" -- no self-serve trial.
  ToS: "We offer a 7-day free trial with full access to all features. No credit card is required
  to start your trial. At the end of the trial, you may choose to subscribe to a paid plan or
  your account will be limited to free tier features." Coded trial_exists = no from the pricing
  page (higher authority for trial terms); the ToS's 7-day-trial language is not reflected in any
  sub-variable.
  (2) FREE TIER. Same ToS trial clause also references "free tier features" as a fallback state,
  which the pricing page's three-paid-tiers-only display does not show anywhere. Coded
  free_plan_exists = no from the pricing page; the ToS mention is logged, not coded.
  (3) ANNUAL BILLING. ToS: "Paid plans are billed monthly or annually as selected." The live
  pricing page shows no annual option and no billing-period toggle at all -- "Billed monthly -
  cancel anytime" only, confirmed across repeated loads. Corroborating (not decisive) evidence:
  the page's own embedded JSON payload contains an untranslated i18n string set --
  "monthly":"Monthly","yearly":"Yearly","save20":"Save 20%","year":"year","month":"month" --
  indicating the pricing component supports a yearly/save-20% toggle that was not rendered on
  this read. Coded annual_default_toggle = no_toggle and annual_condition_disclosure =
  not_applicable from the observed (rendered) state per protocol 6.8, which fixes the coded value
  to what a real visitor was shown, not to unrendered code.
  All three read as one underlying pattern: a ToS that describes a self-serve, trial-then-
  freemium-or-paid signup flow with a monthly/annual choice, against a current live pricing page
  built around a sales-assisted, monthly-only, three-tier model with no self-serve trial -- i.e.
  documents that look like they belong to two different go-to-market motions from the same
  vendor. Both URLs are archived (see sources) so this is independently checkable.
