coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md 7.2) - one eligible candidate on the live pricing page, two
  losing candidates found elsewhere, one genuine judgment call:

  - Pro, $29/month, billed monthly, no toggle -> annual-equivalent $348.00. SELECTED. Only recurring,
    non-sales-gated, single-seat plan that actually appears on https://www.rezi.ai/pricing in any state.
  - Lifetime, $149 one-time -> NOT a candidate per this task's explicit framing: sampling-rules 7.2's
    annualisation mechanic (rule 2, "annualize whatever [the default display state] shows") does not
    cover a non-recurring purchase, and the entry tier is defined as the cheapest generally-available
    RECURRING plan. Recorded here per instruction rather than selected.
  - Enterprise, $99/month per 200-user minimum block -> annual-equivalent $1,188.00 for the block (which
    would itself be a candidate under rule 3's minimum-seat-block provision), but FAILS eligibility
    criterion 2 ("purchasable without contacting sales"): its only call to action is "Book a demo" ->
    /contact-sales. Excluded as sales-gated, not compared further.
  - Quarterly, "$19/month (billed quarterly)" -> annual-equivalent $228.00, CHEAPER than Pro Monthly.
    Documented in TWO independent official sources: https://intercom.help/rezihelp/en/articles/8383549-subscription-plans
    ("Plans start at: Monthly: $29/month, Quarterly: $19/month (billed quarterly)") and
    https://www.rezi.ai/rezi-docs/rezi-subscription-plans-explained ("choose monthly, quarterly, or
    lifetime billing" in the account dashboard's Upgrade flow). The Cancellation Policy page also treats
    "Quarterly Plans" as a real, currently-administered billing category with its own refund windows.
    NOT SELECTED as entry_tier_name despite being cheaper, because it never appears on
    https://www.rezi.ai/pricing in any display state (no toggle exists there at all) - sampling-rules
    7.2's price-basis mechanism is explicitly anchored to "the pricing page's default display state" and
    instructs the coder not to hunt for a cheaper figure; Quarterly's price is only ever stated in help
    documentation, and per that same help doc, the exact price "may vary by region" and is only
    authoritatively shown after logging into the account dashboard, which the documents-only rule
    prohibits accessing. This is a genuine judgment call, flagged for adjudication: an argument exists
    that Quarterly is the more literally correct "cheapest generally-available recurring plan." Flagging
    rather than silently resolving per this study's own stated preference for surfaced judgment calls.
    Every other entry-tier variable (usage_cap_quantified, cost_per_output_computable) would code
    identically under either Monthly or Quarterly, since Quarterly is billing-cadence-only and the Pro
    feature set is otherwise identical; only headline_price_usd, first_charge_amount_usd,
    headline_billing_basis, entry_tier_name, and computation_assumptions would change if Quarterly were
    selected instead (Quarterly figures: headline 19.00, first_charge = 19 x 3 = 57.00 per quarter per
    the help doc's own "billed quarterly" framing, billing_basis would need a value not on the current
    list since quarterly billing has no matching enumerated basis - itself worth flagging to adjudication).

  CURRENCY CHECK (deviation D-003/D-007): collection run from Turkey network location. The live pricing
  page served USD ($) directly with no locale/region toggle and no currency selector - satisfies arm 1 of
  the D-003 checklist without needing the archive fallback. Separately, https://www.rezi.ai/rezi-docs/rezi-subscription-plans-explained
  restates the same three figures (29/149/99) with a GBP symbol (£) in its closing "Summary" bullet list
  only, while using $ throughout the rest of the same page and matching the pricing page exactly. Because
  the numerals are identical (not a converted amount) this reads as an isolated copy/symbol error in one
  secondary marketing-style doc rather than a genuine dual-currency offering, so it was NOT coded
  non_usd - see conflict_note.

  FAILED_GENERATION_CHARGE_POLICY judgment call: coded not_applicable because Pro (the entry tier) is
  flat-rate/unlimited with no per-output accounting, which is the codebook's own stated not_applicable
  case. Flagged because the Free tier's whole-deliverable caps (1 resume, 1 interview, 3 downloads)
  are a form of metering, even though nothing in any document describes a failed-generation charge layer
  on top of those caps; unknown would also have been defensible.

  COMMERCIAL_USE_LOWEST_TIER judgment call: the only on-point clause found restricts commercial use of
  the SERVICE on behalf of third parties (agencies/career coaches using Rezi to serve clients), not an
  output-licensing clause of the kind common for image/video generators. Coded enterprise_only as the
  closest available, explicitly documented answer for this product category rather than unknown; flagged
  for adjudication.

  A-012: does not apply. No cheap non-zero time-limited paid intro period was found anywhere (Quarterly
  is a standing discounted recurring cadence, not a short intro period that converts to a higher rate).

  ARCHIVAL: two rezi.ai URLs (pricing, legal) returned an existing archive.org capture dated 2026-08-07
  (5 days before this 2026-08-12 access) on both submission attempts rather than a fresh same-day crawl;
  content was visually verified identical between the 2026-08-07 capture and today's live read (same
  figures, same layout, same copy). Two intercom.help URLs (cancellation-policy, subscription-plans)
  returned HTTP 404 from archive.org's crawler on submission (confirmed systematic: same failure
  signature on both, likely an Intercom SPA routing/User-Agent quirk on the origin server) - local text
  copies of both were saved under rezi-sources/ as the evidence trail for those two. The rezi.ai/rezi-docs
  page archived fresh, same-day.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Not a strict propositional conflict (the pricing page never states quarterly billing doesn't exist), but a material gap worth recording: https://www.rezi.ai/pricing shows Pro at a single $29/month price with no toggle and no mention of a Quarterly option, while https://intercom.help/rezihelp/en/articles/8383549-subscription-plans states 'Quarterly: $19/month (billed quarterly)' and https://www.rezi.ai/rezi-docs/rezi-subscription-plans-explained confirms quarterly billing is offered in the account dashboard's Upgrade flow - a cheaper recurring option is documented but not shown on the primary marketing pricing page. Separately, https://www.rezi.ai/rezi-docs/rezi-subscription-plans-explained states the same Pro/Lifetime/Enterprise figures twice within itself: '$29/month', '$149', '$99/month per 200 users' throughout its body, then '(£29/month)', '(£149 one-off payment)', '(£99/month per 200 users)' in its closing Summary bullet - identical numerals, inconsistent currency symbol within one document. The live pricing page (rank-1 authority for pricing variables, https://www.rezi.ai/pricing) is unambiguous and USD-only in both representations read (rendered DOM and embedded JSON-LD), and governs the coded values."
