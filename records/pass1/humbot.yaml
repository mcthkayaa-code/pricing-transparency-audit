  watermark_removal_tier: { value: unknown, source: "https://humbot.ai/pricing", evidence: "ADJUDICATION QUEUE A-018, resolved 2026-08-17 (orchestrator/A-018-resolution.md). WAS not_applicable on the reasoning below; corrected to unknown, kind = VENDOR SILENCE. Decided on documentary evidence rather than on precedent: a direct competitor in this same category with the same rewritten-text output answers the watermark question outright in its own pricing FAQ ('Will my texts be watermarked in the future? No.'), and a construct a competitor resolves in standard category vocabulary is not one incapable of existing for the output type. Note also that the two governing documents word the test differently -- codebook rule 3 says 'not a MEDIA artifact', protocol section 8.3 item E2 says 'not AN ARTIFACT a watermark could mark' -- and the original coding rested entirely on that adjective (D-046). Codebook 2.2 makes silence unknown, not not_applicable. Original coder reasoning, preserved: 'Principal output is plain rewritten text (AI Text Humanizer), not a visual/audio media artifact of the kind this variable's media-artifact test targets; codebook's own carve-out example is a detection score or an analysis table. Confirmed silent in every document read (pricing page, feature-comparison table, ToS, refund policy) -- the word watermark appears nowhere.' The silence finding itself is unchanged and was re-verified across all four local captures for brand/logo/powered-by/attribution/white-label." }
