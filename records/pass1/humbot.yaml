  computation_assumptions: "Basic (entry tier), Yearly default: $95.88/yr÷12=$7.99/mo; includes 3,000 Basic Words/mo (usage_list period=month on both monthly and annual SKUs). Credit guide: AI Text Humanizer=1 Basic Word per output word, so 3,000/1=3,000 output words/mo. 7.99/3000=$0.00266/word=$2.66 per 1,000 words. first_charge_amount_usd (95.88) required no computation either: the vendor's own embedded productsList JSON carries the Basic annual SKU (price_id price_1OceZgDTBvGUnRQvGweFDLE9) as price:9588 (cents) / duration:12 (months) -- a fixed field in the vendor's own pricing/billing data, read directly, not derived by multiplying the $7.99/mo figure by 12 (that figure was itself obtained by dividing 95.88/12, the reverse direction). Re-verified 2026-08-12 against humbot-sources/productslist-2026-08-09.json. See coder_note's D-009 provenance check entry."
  credit_rollover_policy: { value: unknown, source: "https://humbot.ai/pricing", evidence: "Pricing page, Credit Usage Guide modal, Terms of Service, and Refund Policy all read; none states what happens to unused Basic/Advanced Words at period end. Programmatic full-text search for 'rollover'/'roll over'/'expire'/'unused'/'carry over' across the pricing page and open modal returned no matches." }
  failed_generation_charge_policy: { value: unknown, source: "https://humbot.ai/pricing", evidence: "Not addressed in any document read. ToS states only 'Each subscription plan includes specific usage limits, and exceeding these may result in additional charges or temporary suspension' -- about exceeding quantified limits, not about failed/erroring generations specifically." }
