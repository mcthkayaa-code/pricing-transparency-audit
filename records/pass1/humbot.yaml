coder_note: |
  Entry-tier candidates (sampling-rules.md 7.2), annual-equivalent cost of the DEFAULT
  dropdown/toggle selection on each card, Yearly toggle preselected:
    - Basic: $95.88/yr (no dropdown, single SKU) -- WINNER, lowest annual-equivalent cost.
    - Pro: $119.88/yr at its default-selected 5,000 Advanced-words dropdown option.
    - Unlimited: $119.88/yr at its default-selected 10,000 Advanced-words dropdown option
      (tied with Pro on price; both lose to Basic regardless).
    - A "One-time" SKU ($9.99, 2,000 words, price_id price_1R4YuaDTBvGUnRQv0NsFMbyE) exists
      in the vendor's backend product catalog but was never displayed on the /pricing plan
      grid in any read (only Basic/Unlimited/Pro cards render); excluded as not a shown
      candidate rather than evaluated on price.
    - "Advanced Words" top-up SKUs (5k/10k/20k/40k/50k/60k/80k credit packs) are consumable
      add-on purchases, not standing plans; excluded.

  Judgment calls flagged for review:
    1. headline_price_usd / first_charge_amount_usd were read from the pricing page's own
       embedded __NEXT_DATA__ productsList JSON (currency:USD on every SKU) rather than from
       legible on-screen text, because this TR-geolocated session's FIRST page load rendered
       all three prices as blank "-" (a client hydration bug, React errors #418/#425/#423).
       A later same-session load of the same URL, unprompted, rendered fully in TRY and
       matched the USD-derived figures exactly to the cent (Basic ₺339/mo = try_cents
       406800/12/100). D-003 additionally confirmed via a stale (2025-09-10) web.archive.org
       capture that the vendor's normal rendering path is USD-denominated. Logged as a
       display_variant register event, not coded as non_usd.
    2. credit_to_output_rate_published coded `partial` rather than `yes`: the PRINCIPAL
       output (AI Text Humanizer) carries an exact numeric rate (1 word per output word),
       but several other bundled tools are rated only "Based on token usage" with no number.
       A reasonable alternate reading could call this `yes` since the principal output's own
       rate is exact; flagged for adjudication.
    3. free_plan_cap_documented / _cap_value / _watermark / _duration coded `unknown` rather
       than using the backend catalog's Free SKU (200 words/mo, 100-word input): no visible
       card, table row, or FAQ text ever displayed these numbers to a reader across three
       separate page loads (unlike Basic/Pro/Unlimited, confirmed twice by visual re-render).
       free_plan_exists alone is `yes`, from an explicit FAQ sentence naming the plan without
       figures.
    4. watermark_removal_tier coded `not_applicable`: principal output is plain text, not a
       visual/audio artifact; treated as analogous to the codebook's own "detection score or
       analysis table" not_applicable example. Silent everywhere checked either way.
    5. commercial_use_lowest_tier coded `not_granted` on an unqualified ToS clause ("you will
       not use the Website and/or Services for a commercial activity"). Notable, surprising
       finding for a paid writing/study tool with no tier-based exception found anywhere.
    6. renewal_notice_commitment coded `no_notice_stated`: the only advance-notice commitment
       in the ToS is scoped to price changes, not to ordinary renewal charges, and a
       post-charge receipt is explicitly excluded from counting as advance notice by the
       codebook.

  Archival: web.archive.org Save Page Now (`/save/<url>`) was attempted twice per source URL
  (pricing, terms-of-service, refund-policy) on 2026-08-09; every attempt returned HTTP 520,
  a systemic failure across the whole domain rather than a per-page issue (CDX search for
  2026 captures of humbot.ai/pricing also returned empty). archive_status=local_copy_only
  throughout; local evidence retained in records/pass1/humbot-sources/.

  D-009 PROVENANCE CHECK (2026-08-12): first_charge_amount_usd (95.88) is exactly 12x
  headline_price_usd (7.99), the pattern the D-009 sweep report flagged for a provenance check
  across five records including this one. Re-examined independently against this record's own
  local capture (humbot-sources/productslist-2026-08-09.json): the Basic annual SKU (price_id
  price_1OceZgDTBvGUnRQvGweFDLE9) carries price:9588 (cents) at duration:12 (months) as a fixed
  field in the vendor's own embedded product catalog -- the same structured data this record's
  headline_price_usd evidence already draws on. The $7.99/mo headline figure is the DERIVED
  value here (95.88÷12), not the other way around: no coder multiplication of a monthly figure
  by 12 produced 95.88. Case 1 (vendor published the annual total, in its own structured
  pricing data; no computation happened). Verdict: SUPPORTED. 95.88 stands, unchanged; see
  computation_assumptions for the added source note.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Pricing page (https://humbot.ai/pricing, 'Security & Support' feature-grid section) states '30-Day money back guarantee'. The Terms of Service (https://humbot.ai/terms-of-service) and the dedicated Refund Policy (https://humbot.ai/refund-policy) both state a 7-day window conditioned on word usage not exceeding 1,000 words, in full agreement with each other. Per protocol §6.2 the two contractual-class sources outrank the pricing page for refund variables; refund_window_days is coded 7 from them, and this pricing-page/contract gap is recorded here per protocol §6.2's instruction to log it even where the hierarchy resolves the value cleanly. All three pages accessed 2026-08-09."
