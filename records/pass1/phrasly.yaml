coder_note: |
  ENTRY-TIER SELECTION (sampling-rules 7.2): the pricing page shows exactly two paid
  cards in its default (annual-preselected) state: "3 Day Access" (TRY 95.44 upfront,
  "then TRY 953.90 per month, billed annually") and "Unlimited" (TRY 524.43/mo billed
  annually, struck-through reference TRY 1,192.49/mo). "3 Day Access" is coded as the
  product's paid trial mechanism (ToS section 6, "TRIAL", $2.00 USD/3-day, domain-4
  territory) rather than a competing standing plan, excluded from entry-tier candidacy
  under 7.2 criterion 3 (time-limited, not a standing plan). "Unlimited" is therefore
  the only eligible candidate and is entry_tier_name. Robustness check: even under the
  alternative reading that treats "3 Day Access" as an eligible standing candidate, its
  own annual-equivalent cost (953.90 x 12 = TRY 11,446.80, using the figure the card
  itself presents "per month, billed annually") is HIGHER than Unlimited's (524.43 x 12
  = TRY 6,293.16), so Unlimited still wins on lowest annual-equivalent cost either way.
  Both readings are recorded here so adjudication can pick either without recoding.

  A-012: Phrasly sells a paid, time-limited intro period ("3 Day Access" / Trial
  Period): $2.00 USD (ToS section 6, tax inclusive) / TRY 95.44 as locally rendered,
  for 3 days, auto-converting to TRY 953.90/month billed annually (TRY 11,446.80/yr)
  if not canceled -- a materially HIGHER recurring rate than the "Unlimited" tier's own
  direct-purchase price of TRY 524.43/mo (TRY 6,293.16/yr). The vendor discloses the
  promotional intro figure prominently (pricing page, TOS) but the only "renewal" rate
  disclosed for the trial path (953.90/mo) is itself higher than what a buyer would pay
  by skipping the trial and purchasing "Unlimited" directly -- i.e. the cheap-looking
  entry point leads to a worse recurring price than the direct-purchase alternative
  shown one card over. This gap (promo-vs-renewal, and trial-path-vs-direct-path) is
  itself a central finding for this record. trial_exists/trial_length_days/
  trial_auto_converts are coded yes/3/yes from explicit ToS language; trial_card_required
  is coded unknown per the non-inference rule (see variable evidence) even though a $2
  charge is required to start.

  CURRENCY (D-003): full mechanical check in phrasly-sources/currency-check-d003.txt.
  Neither a curl with Accept-Language:en-US on the live pricing URL (blocked by a
  Cloudflare bot-check, no content returned) nor the most recent web.archive.org
  capture (pre-hydration JS shell, no price content of any kind) surfaced a USD figure,
  so non_usd stands for headline_price_usd/first_charge_amount_usd per protocol. Note
  ToS section 6 separately states the TRIAL fee explicitly as "$2.00 USD...or the
  equivalent amount converted to the user's local currency at the time of checkout" --
  this IS an official-document USD figure, but it prices the trial/3-Day-Access offer,
  not the Unlimited entry tier, so it does not change headline_price_usd's non_usd
  coding for Unlimited (no USD figure was found for Unlimited specifically). Logged in
  conflict_note.

  FREE PLAN: phrasly.ai/pricing (top authority for pricing-class variables) does not
  display a free-tier card at all -- only the two paid cards above. phrasly.ai/ai-humanizer
  (official product documentation, second-ranked for this variable class) explicitly
  markets and FAQs a $0 account tier ("Is Phrasly's AI humanizer free? Yes..."). Per
  codebook free_plan_exists rule 3, "no free option anywhere in the documents" is the
  trigger for coding "no" -- since a free option IS documented elsewhere, free_plan_exists
  = yes, sourced from the product page. The pricing page's omission of its own free tier
  is itself logged as a transparency finding in conflict_note.

  OUT OF SCOPE, NOTED NOT USED: business.phrasly.ai is a separate Business/API product
  (enterprise, contact-sales) with its own distinct Privacy Policy and Refund Policy
  pages (found via search, e.g. business.phrasly.ai/terms/refund-policy, which describes
  an "unused subscription credits" refund model different from the consumer product's
  zero-usage/14-day rule). Not used anywhere in this record, which codes only the
  consumer phrasly.ai product matching the frame's vendor_home_url.

  ARCHIVAL: web.archive.org's /save/ endpoint returned HTTP 520 on every attempt made
  this session (2 attempts each on the pricing and terms URLs; root web.archive.org
  itself returned 200, so this reads as a systemic Save-Page-Now outage rather than a
  per-URL block). archive_status is local_copy_only for all sources; detailed rendered-text
  and raw-DOM-HTML local copies are retained under phrasly-sources/ for audit.

  FRAME CHECK: frame-frozen-2026-08-04.csv row for phrasly matches what was observed
  (vendor_home_url https://phrasly.ai, category AI humanizer, product_status active,
  paid_submission no); no correction needed.

  blindness: no other record, no review page, no pass-2 material was opened.

  D-007 re-check 2026-08-10: this record is one of the two direct triggers for
  D-007 (with gptzero) -- this record's own honest D-003 check (both arms
  genuinely failed: the Accept-Language request hit a Cloudflare block, and the
  most recent archive capture was a pre-hydration shell) is what exposed D-003's
  closing clause as unsound, since it forced non_usd from a check that had not
  actually answered the question. This is that record's own re-check under the
  amended rule. Arms attempted, in order: (1) vendor's own currency disclosure
  -- re-scanned the live pricing page (still TRY-priced today, minor FX drift
  from the original reading, unrelated) for a currency/country selector (0
  matches) and tried a ?currency=USD URL parameter (no effect) -- both
  negative. Re-confirmed the general ToS clause already flagged in this
  record's own conflict_note, "All payments shall be in US dollars" -- genuine
  Arm-1 evidence, but naming a currency, not a figure, for the Unlimited tier.
  (2) A US-crawled archive capture that actually contains price figures --
  re-verified the original D-003 finding (34,722-byte pre-hydration shell, zero
  price content) via a fresh direct fetch, THEN queried the Wayback CDX API for
  anything newer and found a same-day (2026-08-10) capture the original check
  never had access to -- fetched it directly and confirmed it is Cloudflare's
  own bot-challenge page, not the pricing page; archive.org's crawler was
  blocked too, on the freshest attempt possible. Full log:
  phrasly-sources/d007-currency-recheck-2026-08-10.txt.
  OUTCOME: value CHANGED, but not to a money figure, mirroring gptzero's outcome
  earlier in this same sweep. headline_price_usd moves from non_usd to unknown:
  the amended rule requires positive evidence the vendor publishes only a
  non-USD price, and here the vendor's own ToS argues the opposite, while no
  arm supplies a number for the Unlimited tier specifically (the ToS's only
  actual USD figure, $2.00, prices the separate "3 Day Access" trial offer, not
  this entry tier). first_charge_amount_usd moves from non_usd to unknown on
  the same basis (no figure to annualize). Dependent variable:
  cost_per_output_computable is unaffected in value ("yes") or in its
  TRY-denominated arithmetic, since that variable's rule never gated on
  headline_price_usd's specific value; only its stray cross-reference to the
  old non_usd value is corrected. No register_events change: this record never
  had a display_variant entry for currency (correctly -- neither state ever
  showed a USD figure to log a variant against, under the old rule or the new
  one).
conflict_note: "(1) Currency: phrasly.ai/pricing renders both plan cards in TRY only (no USD figure shown, confirmed by the D-003 check); phrasly.ai/terms section 5 states 'All payments shall be in US dollars' as a generic payment clause with no plan-specific digits attached. ORIGINALLY (D-003) coded non_usd per protocol since no document publishes an actual USD number for the Unlimited tier's price (see coder_note for the trial's separate $2.00 USD figure, which prices a different offer). SUPERSEDED under the D-007 re-check (2026-08-10): the amended currency rule holds that a ToS statement like this one is positive evidence AGAINST 'the vendor publishes only a non-USD price' (the necessary condition for coding non_usd), while it supplies no figure to code as money -- so headline_price_usd and first_charge_amount_usd both now read unknown instead of non_usd. Full re-check: phrasly-sources/d007-currency-recheck-2026-08-10.txt. (2) Free-tier disclosure: phrasly.ai/pricing (higher authority for pricing-class variables) shows no free-tier card at all; phrasly.ai/ai-humanizer (product documentation, lower authority for this variable class) explicitly markets and FAQs a free $0 account tier. Coded free_plan_exists=yes per codebook rule (a free option is documented somewhere in the documents), with the dedicated pricing page's non-disclosure of its own free tier recorded here as a transparency finding in its own right."
