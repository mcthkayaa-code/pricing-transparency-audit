coder_note: |
  ENTRY-TIER SELECTION. Eligible candidates (generally available, no sales contact, standing,
  not seat-restricted, not usage-based-only): Basic, Pro, Ultra -- the only paid plans on the
  site. Annual-equivalent costs read in the pricing page's default (Yearly) display state:
  Basic $144.00/yr (WINNER, $12/mo shown; $18/mo if toggled Monthly, per /detect's footer
  mention and /pricing's own meta description -- both figures reconcile exactly with the
  $12/mo x 12 - $144 = $72/yr "Save" badge shown, confirming internal consistency, not a
  conflict). Losing candidates: Pro $216.00/yr ($18/mo default Yearly / $27/mo Monthly); Ultra
  $432.00/yr ($36/mo default Yearly / $48/mo Monthly).

  SHARED-DOCUMENT SITUATION (per assignment note). humanizemy-ai-detector (this product,
  category "AI detector") and humanizemy (sibling product, category "AI humanizer") are sold
  by the same vendor (Mihci AI Studios LLC) under ONE shared pricing page (/pricing), ONE
  shared Terms of Service (/terms), and ONE shared Refund & Cancellation Policy
  (/refund-policy). There is no detector-only paid plan and no humanizer-only paid plan;
  Basic/Pro/Ultra are marketed as "HumanizeMyAI plans" and the pricing page's own subheading
  reads "Every plan includes the full humanizer." /detect itself states: "The humanizer tool
  and the paid HumanizeMyAI plans (Basic $18/mo, Pro $27/mo, Ultra $48/mo) are the only
  commercial product surface on this site. The detector is free as a product decision... it
  costs us nothing to run: the trained model is a few thousand numbers evaluated locally, with
  no GPU and no API call."

  JUDGMENT CALL -- does the detector have an entry paid tier at all? Coded YES (Basic), because
  all three paid plans list "AI detection checks" as its own separate, checked (included)
  feature line, distinct from "Access to enhanced model" and from the humanizer's "N requests /
  month" / "words per request" lines (raw HTML confirms five independently-marked <li> bullets
  per card; "AI detection checks" is checked on Basic, Pro, and Ultra alike, while e.g.
  "Priority support" is crossed out on Basic only -- proving these are genuine
  tier-differentiating feature grants, not decorative recaps of the free tier). A construct
  (paid AI-detection benefit) is therefore affirmatively documented, so not_applicable (which
  requires documented ABSENCE of a paid tier) would misstate the evidence. Basic is the lowest
  annual-equivalent eligible candidate, so it is coded as this product's entry tier too, same
  plan the sibling humanizer product's coder would independently arrive at.

  WHAT THE SHARED PLANS DO NOT SETTLE FOR THE DETECTOR SPECIFICALLY. No document publishes a
  NUMBER for what "AI detection checks" grants under a paid plan (no "X scans/month" or "X
  scans/day" figure tied to that bullet). The "N requests / month" and "up to N words per
  request" figures on the same cards are read as governing the HUMANIZER, not the detector, on
  internal vocabulary evidence: /detect and /cookies consistently call detector usage "scans"
  ("four scans a day... 20 a day once you sign up... Paid plans raise that ceiling" -- /detect;
  "Tracks your 4-free-runs-per-day quota for the humanizer (and the same for the detector)" --
  /cookies, humanize_quota cookie), while /pricing and /terms consistently call the metered
  unit "requests" / "humanizations" / "runs" in a context that traces to the FREE humanizer
  tier's own documented numbers ("4 humanizations per day, up to 125 words per run" -- /terms
  section 2 and /pricing FAQ), which scale proportionately into the paid "N requests/month"
  figures. /pricing's own FAQ on detection ("What patterns does your AI detector check?")
  further distinguishes an internal "pattern scanner" the humanizer runs on its own rewrites
  from "The free /detect page adds a trained model on top, which is what produces the verdict
  there" -- suggesting the plan-bundled "AI detection checks" feature may not even be the
  identical /detect tool. Given this, variables asking for a DETECTOR-specific quantified
  paid-tier limit or a computable cost-per-scan are coded unknown/no/none_quantified rather
  than borrowing the humanizer's "requests" numbers -- see usage_cap_quantified and
  cost_per_output_computable evidence fields for the exact quote relied on ("Paid plans raise
  that ceiling," unquantified). This whole area is this record's central judgment call; a
  pass-2 coder or adjudicator reading the same two documents (/pricing, /detect) could
  reasonably land on a different reading of which bullets attach to which product, and it is
  flagged to adjudication-queue.md (item A-010) for that reason.

  Contractual variables (auto-renewal, refund, cancellation, disclosure location) are coded
  from the same shared ToS/refund-policy page and DO apply to this product's paid tier as
  coded, since a buyer purchasing Basic/Pro/Ultra for the detector benefit is bound by the same
  single subscription contract as a buyer purchasing for the humanizer -- there is only one
  contract on this site, not two.

  Domain 11 (commercial_use_lowest_tier, watermark_removal_tier, output_ownership_statement)
  coded not_applicable: this product's documented output is a numeric AI-detection score plus a
  named-pattern breakdown/table ("Scan Report," "Overall AI Score," "Per-Pattern Breakdown" --
  /detect), which matches the codebook's own worked not_applicable example under
  watermark_removal_tier ("a detection score or an analysis table"), applied consistently
  across all three domain-11 variables per output_ownership's own cross-reference to the
  commercial_use_lowest_tier test. Flagged for the record: /terms section 6 contains a general
  "You retain ownership of all text you submit... We claim no ownership over your inputs or
  outputs" clause that is not restricted to one product by its wording; it is read here as
  directed at the humanizer's rewritten-text output (the paradigm case the surrounding clause
  discusses) rather than at the detector's score/report, consistent with the codebook's own
  category, but this is a second judgment call a pass-2 coder or adjudicator may reasonably
  weigh differently.

  refund_policy_exists coded yes (not no_refunds_stated) despite the "generally non-refundable"
  headline language, because the dedicated refund-policy page states three concrete conditions
  under which a refund IS given (legally required; duplicate/incorrect charge; documented
  material service failure) -- more than the codebook's own no_refunds_stated worked example
  (Vendor Q: "non-refundable except where required by law," ONE legal-only exception). The
  extra, vendor-controlled "duplicate or incorrect charge" and "documented material service
  failure" conditions were read as substantive stated terms, not merely a concession to law.
  Third judgment call worth a second look at adjudication.

  Archival: web.archive.org/save/ failed twice for /pricing (HTTP 404 from the save endpoint
  both times; CDX search confirms zero existing captures of this URL); local copies saved in
  humanizemy-ai-detector-sources/ (pricing-page-raw.html, pricing-page-clean.txt,
  pricing-page-enus.html, pricing-rendered-2026-08-09.txt). /detect, /terms, and /refund-policy
  archived successfully on the first attempt.

  D-003 currency check: performed mechanically (Accept-Language: en-US,en;q=0.9 curl fetch)
  even though no non_usd value was ever in play -- the vendor states "All prices are in US
  dollars (USD)" and $ figures rendered identically under the default Turkey-egressing network
  fetch, the en-US fetch, and a live browser render (mcp__Claude_Browser__preview_start +
  javascript_tool). No localization observed at any point; no display_variant logged because
  nothing local/different was ever seen to log.

  Other documents checked and found not relevant to any coded variable: /methodology (editorial
  evidence-labeling method only, no pricing/commercial content) and /api-docs (redirects to
  "/", page does not exist).

  D-009 PROVENANCE CHECK (2026-08-12): first_charge_amount_usd (144.00) is exactly 12x
  headline_price_usd (12.00), the pattern the D-009 sweep report flagged for a provenance check
  across five records including this one. The sweep report separately notes that the sibling
  humanizemy record (same vendor, same /pricing page) already carries a computation note; per
  the assignment, this detector record is checked independently against the live page, and the
  sibling's record and finding were not opened or copied (consistent with this coder_note's own
  blindness discipline below). Re-verified via this record's own local capture
  (humanizemy-ai-detector-sources/pricing-page-clean.txt) and a fresh live render of
  https://humanizemy.ai/pricing today: the Basic card states "$12 /mo" / "$144 billed yearly" /
  "Save $72/yr" and, directly beneath the CTA, "Renews automatically at $144 USD every 12 months
  until cancelled." Both figures are vendor-published verbatim; no multiplication by a coder was
  needed or performed. Case 1 (vendor published the annual total; no computation happened).
  Verdict: SUPPORTED. 144.00 stands, unchanged; see computation_assumptions for the added source
  note.

  blindness: no other product's record was opened. records/pass1/humanizemy.yaml and
  records/pass1/humanizemy-sources/ (the sibling humanizer product's record and evidence
  directory, visible in the same records/pass1/ folder and, per the assignment note, being
  coded concurrently by another coder) were deliberately NOT opened or read at any point; every
  source cited in this record was fetched independently by this coder from the live vendor
  site. No review page, no aitoolspolice.com page, and no pass-2 material was opened.
