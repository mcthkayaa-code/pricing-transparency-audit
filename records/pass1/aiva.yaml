  cost_per_output_unit:
    value: other
    source: https://www.aiva.ai/
    evidence: >-
      AIVA sells metered access to a countable artifact (a generated
      music composition/track, downloaded up to N times per month), not
      unmetered seat-based software access, so rule 2's per_seat_month
      carve-out does not apply. None of the enumerated units
      (per_video_minute, per_image, per_1k_words, per_audio_minute,
      per_page, per_headshot, per_document, per_presentation,
      per_seat_month, per_api_call) precisely names "a track/composition
      download", which is the unit the plan allowances actually scale on
      (3 -> 15 -> 300 downloads/month); track duration is a quality cap,
      not a purchased quantity. Coded other; unit named in coder_note per
      rule 3. Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  cost_per_output_computable:
    value: "yes"
    source: https://www.aiva.ai/
    evidence: >-
      Entry tier (Standard Annually) price, EUR 11/month in the default
      display state, and its published allowance, 15 downloads/month, are
      both stated in official documents and both already on the same
      (monthly) period, so no conversion is needed and no assumption
      about typical use is required. EUR 11 / 15 downloads = EUR 0.73 per
      download (per composition/track, the principal output). Computable
      for the principal output itself (not a secondary output), so yes,
      not partial. See computation_assumptions for the full arithmetic.
      Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  credit_rollover_policy:
    value: not_applicable
    source: not_applicable
