      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  free_plan_exists:
    value: "yes"
    source: https://www.aiva.ai/
    evidence: >-
      Pricing page shows a standing "Free, Forever" plan card at "€0", "No
      credit card required", alongside the paid tiers, with no expiry
      stated. Not a time-limited trial (domain 4 covers trials
      separately). Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  free_plan_cap_documented:
    value: all_quantified
    source: https://www.aiva.ai/
    evidence: >-
      Free plan lists two volume-type limits: "3 downloads per month"
      (quantified rate -- number + dimension + period) and "Track
      durations up to 3 minutes" (quantified standing limit -- number +
      dimension, no period required). "Download MP3 & MIDI formats" is a
      format restriction, not a quantifiable usage limit, and is not
      counted. Both actual limits are quantified, so all_quantified.
      Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  free_plan_cap_value:
    value: 3 downloads per month | 3 minutes maximum track duration
    source: https://www.aiva.ai/
    evidence: >-
      Verbatim from the Free plan card: "3 downloads per month" (rate)
      and "Track durations up to 3 minutes" (standing limit, formatted
      per codebook-v1.md section 5.1's own "720p maximum resolution"
      style). Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  free_plan_watermark:
    value: unknown
    source: https://www.aiva.ai/
    evidence: >-
      No document read for this record (pricing page, EULA, or the
      licensing/cancellation FAQs) states whether Free-plan audio/MIDI
      output files themselves carry an embedded watermark or vendor
      branding. The Free plan does carry a mandatory attribution
      obligation ("Credit must be given to AIVA" on the pricing card; EULA
      licensing FAQ: "You MUST give credit to AIVA when using the track")
      -- this is a usage/crediting condition on how the buyer publishes
      the track elsewhere, a distinct construct from an embedded
      audio watermark, and is not treated as satisfying this variable.
      No pricing-grid row analogous to the codebook's "No watermark"
      example exists on this page. Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  free_plan_duration:
    value: perpetual
    source: https://www.aiva.ai/
    evidence: >-
      Plan is named "Free, Forever" and is presented as a standing tier
      alongside the paid tiers with no expiry stated in any document read.
      Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  trial_exists:
    value: "no"
    source: https://www.aiva.ai/
    evidence: >-
      No time-limited trial of a paid tier is mentioned anywhere in the
