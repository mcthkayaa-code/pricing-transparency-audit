  failed_generation_charge_policy:
    value: unknown
    source: https://www.aiva.ai/legal/1
    evidence: >-
      Checked and found silent: pricing page (plan cards state only the
      monthly download allowance), EULA section 6 "Technology &
      Limitations" (states generation-rate ceilings but nothing about a
      failed/errored attempt's effect on the download allowance), and
      the licensing/cancellation FAQs. The product does meter output
      (downloads/month), so not_applicable's "no per-output accounting
      at all" condition is not met either; the documents are simply
      silent on the failure case specifically, which is the Vendor O
      pattern in codebook-v1.md ("credits are deducted when a job is
      submitted" and says nothing about failures -> unknown). Access
      date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132231/https://www.aiva.ai/legal/1

  auto_renewal_default:
    value: "on"
    source: https://www.aiva.ai/legal/1
    evidence: >-
      EULA section 9 (Refunds): "Licensee is responsible for downgrading
      to the free plan and / or disabling auto-renewal of their
      subscription when Licensee no longer wishes to continue paying for
      the Services. No refund will be made if Licensee forgets to cancel
