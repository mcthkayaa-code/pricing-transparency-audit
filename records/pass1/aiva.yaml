    evidence: >-
      No document read for this record (pricing page, EULA, licensing
      FAQ, cancellation FAQ) states whether any tier's audio/MIDI output
      carries an embedded watermark or vendor branding, or names a tier
      at which such a mark is removed. The principal output (a music
      composition/audio file) is a media artifact that could in principle
      carry a watermark, so not_applicable's "not a media artifact a
      watermark could mark" carve-out does not apply. Access date
      2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  output_ownership_statement:
    value: conditional
    source: https://www.aiva.ai/legal/1
    evidence: >-
      EULA section 3 grants one of three license types depending on the
      subscribed plan: "Non-Commercial License" (Free; AIVA-owned,
      user licensed), "Limited Commercial License" (Standard;
      AIVA-owned, user licensed for monetization on 4 named platforms),
      or "Full Copyright" (Pro; "Licensor hereby assigns, grants and
      conveys all copyrights... to Licensee"). Matches the codebook's
      Vendor T "conditional" pattern (rights depend on tier) exactly;
      corroborated by the licensing FAQ's per-plan "Copyright owned by
      AIVA" / "Copyright owned by YOU" language and by the
      copyright-on-upgrade/cancel FAQ. Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132231/https://www.aiva.ai/legal/1

  usage_cap_quantified:
    value: all_caps_quantified
    source: https://www.aiva.ai/
    evidence: >-
      Entry paid tier (Standard Annually) limits per the pricing card:
      "15 downloads per month" (quantified rate) and "Track durations up
      to 5 minutes" (quantified standing limit). "Download MP3 & MIDI
      formats" is a format list, not a quantifiable usage limit. The
      EULA's service-wide generation-rate limits also attach to this
      tier's user and are all quantified ("cannot create more than 5
      Compositions at one time... cannot create more than 100
      Compositions per hour... cannot create more than 400 Compositions
      every 24 hours... cannot store more than 4,000 Compositions at one
      time") -- these reinforce, and do not weaken, all_caps_quantified.
      No unlimited claim is made for this tier. Access date 2026-08-06.
      Archived (pricing):
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/
      Archived (EULA):
      https://web.archive.org/web/20260806132231/https://www.aiva.ai/legal/1

  unquantified_limit_clause:
    value: absent
    source: https://www.aiva.ai/legal/1
    evidence: >-
      EULA read in full (section 6, "Technology & Limitations", is the
      only clause governing usage volume/intensity). Every stated
      restriction carries an explicit number: 5 compositions at once, 100
      per hour, 400 per 24 hours, 4,000 stored. The one discretionary
      clause found ("AIVA reserves the right, at its sole discretion, to
      modify, discontinue or terminate the Services") governs the
      service generally, not a volume/intensity standard applied to an
      individual user's usage, and the bot-abuse clause governs conduct,
      not volume, per rule 3. No fair-use, reasonable-use, excessive-use,
      or vendor-discretion usage-throttling clause with no figure was
      found. No separate Acceptable Use Policy exists on this site (the
      EULA is the vendor's only ToS-equivalent document; see sources
      note). Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132231/https://www.aiva.ai/legal/1

coder_note: >-
  Entry-tier selection (sampling-rules.md 7.2): eligible and
  default-state-visible paid candidates were Standard Annually (EUR
  11/mo billed annually, annual-equivalent EUR 132.00) and Pro Annually
  (EUR 33/mo billed annually, annual-equivalent EUR 396.00); Standard
  Annually wins on lowest annual-equivalent cost. Pro Annually is the
  sole losing candidate. Excluded before the price comparison: Free (EUR
  0, not a paid tier); Standard Monthly / Pro Monthly (exist per EULA
  section 2 -- "Individuals are elligible for the Free, Standard
  Monthly, Standard Annually, Pro Monthly and Pro Annually plans" -- but
  not shown in the page's default annual-preselected state, so outside
  the default-state comparison pool per section 7.2 rule 1); "For
  Enterprises" (sales-gated -- EULA section 2: "If you are an
  Enterprise, please contact us... to establish a custom plan");
  "Students & Schools" (named-program discount, contact-gated --
  pricing page footer: "please reach out with our contact form or
  using the live chat"). --
  cost_per_output_unit coded "other": no enumerated unit names a
  discrete track/composition download, which is what AIVA's plan
  allowances actually meter (3/15/300 downloads per month); named unit
  = "per composition/track download". --
  free_plan_watermark and watermark_removal_tier are both unknown:
  AIVA's mandatory "credit must be given to AIVA" clause on the Free
  plan is a usage-attribution obligation (how the buyer credits AIVA
  when publishing a track elsewhere), a distinct construct from an
  embedded audio watermark on the output file itself; no document
  addresses the latter, at any tier. --
  All prices are EUR-only; no USD figure or currency selector was found
  anywhere on the pricing page (headline_price_usd and
  first_charge_amount_usd are both non_usd). --
  The EULA (https://www.aiva.ai/legal/1) is the vendor's sole
  ToS-equivalent document; no separate Terms of Use or Acceptable Use
  Policy exists on this site; a companion Privacy Policy tab at the
  same route was checked and contains no pricing/contractual terms
  (data collection only; Stripe named as payment processor). --
  product_status re-check: site is fully live and operational as of
  2026-08-06 (EULA copyright footer reads "2016-2026"; the cancellation
  FAQ shows "Updated on: 23/06/2026"), confirming "active". --
  blindness: no other record, no review page, no pass-2 material was
  opened. Disclosure: "git log --name-only" was run once against the
  pricing-transparency directory before starting, to discover the
  repo's existing "<product_id>-sources/" folder naming convention;
  this printed other products' committed file paths and commit-message
  text only, never file contents, and no other product's coded values
  were viewed at any point. --
  D-007 re-check 2026-08-10: this record was one of six flagged for
  re-verification under the amended currency rule (deviations-log.md
  D-007), which supersedes D-003's Accept-Language check. Arms attempted,
  in order: (1) vendor's own currency disclosure -- rendered DOM scan of
  https://www.aiva.ai/ for a currency/country selector (zero matches
  against a broad selector query), a trial ?currency=USD URL parameter
  (no effect, page unchanged), and a full-text currency-word search of the
  EULA (https://www.aiva.ai/legal/1) and of the billing help article
  "What am I charged for when I upgrade from one subscription to
  another?" (zero hits in both) -- returned nothing. (2) A US-crawled
  archive capture that actually contains price figures --
  https://web.archive.org/web/20260806132059/https://www.aiva.ai/,
  re-opened fresh, confirmed content-bearing (2,333-char body, real plan
  cards, not a pre-hydration shell) and showing EUR throughout with zero
  "$" occurrences -- returned positive non-USD evidence. Full log:
  aiva-sources/d007-currency-recheck-2026-08-10.txt. Outcome: value
  UNCHANGED. headline_price_usd and first_charge_amount_usd both remain
  non_usd, now resting on Arm 2's positive, content-bearing evidence
  rather than on an absence-only same-network read. No dependent variable
  required updating (cost_per_output_computable was already computed in
  EUR per protocol-v1.md 6.5, which forbids inventing an exchange rate;
  its value and arithmetic are unaffected).
computation_assumptions: >-
  first_charge_amount_usd: Standard Annually (entry tier), default display
  state shows "€11 / month + VAT, Billed Annually"; billing basis =
  annual, charged once for the year per the "Billed Annually" label;
  11 x 12 = EUR 132.00; VAT excluded (tax, varies by jurisdiction).
  cost_per_output_computable: Standard Annually (entry tier), price EUR
  11/month per default display state, allowance 15 downloads/month per
  pricing page; price and allowance already both monthly, no period
  conversion needed; 11 / 15 = EUR 0.73 per download (per
  composition/track, coded as cost_per_output_unit = other).
