default_display_state: >-
  Annual ("yearly") billing preselected on load. Confirmed visually (plan
  cards render as "Standard Annually" / "Pro Annually" with "Billed
  Annually" + discount badges shown before any interaction) and via DOM
  inspection (the "Billed yearly" toggle label carries class
  "selected-slider-difficulty-title" on load; "Billed monthly" does not).
  Currency displayed is EUR throughout ("+ VAT" noted on paid plans); no
  USD or other-currency option was found anywhere on the page. No
  cookie-consent banner was presented during this read.

variables:
  entry_tier_name:
    value: Standard Annually
    source: https://www.aiva.ai/
    evidence: >-
      Pricing page, default (annual-preselected) state, lists exactly two
      paid, generally-available, no-sales-contact plans: "Standard
      Annually" at "€11 / month + VAT, Billed Annually" (annual-equivalent
      EUR 132.00 = 11 x 12) and "Pro Annually" at "€33 / month + VAT,
      Billed Annually" (annual-equivalent EUR 396.00 = 33 x 12). Standard
      Annually carries the lower annual-equivalent cost, so it is the
      entry paid tier per sampling-rules.md section 7.2. Monthly variants
      (Standard Monthly, Pro Monthly) exist per the EULA ("Individuals are
      elligible for the Free, Standard Monthly, Standard Annually, Pro
      Monthly and Pro Annually plans") but are not shown in the page's
      default (yearly-preselected) display state, so per section 7.2 rule
      1 they are not part of the default-state comparison pool. The Free
      plan (EUR 0) is not a paid tier and is not a candidate. "For
      Enterprises" requires contacting sales (EULA section 2: "If you are
      an Enterprise, please contact us... to establish a custom plan") and
      "Students & Schools" requires contacting a named program (pricing
      page: "For Student & School discounts, please reach out with our
      contact form or using the live chat") -- both excluded under
      section 7.2 eligibility rules 1-2 before the price comparison. Full
      loser bookkeeping in coder_note per section 7.2's recording rule.
      Archived: https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  headline_price_usd:
    value: non_usd
    source: https://www.aiva.ai/
    evidence: >-
      Entry paid tier (Standard Annually) card reads "€11 / month + VAT"
      with "Billed Annually" beneath it, in the page's default
      (annual-preselected) state. No USD figure or currency selector is
      published anywhere on the page. Currency EUR, verbatim figure
      "€11 / month + VAT" (Standard Annually, billed annually). Per
      codebook-v1.md section 6, currency and verbatim figure also
      recorded in coder_note. Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/
      D-007 re-check (2026-08-10): confirmed under the amended currency rule.
      Arm 1 (rendered DOM scan for a currency/country selector, a
      ?currency=USD URL parameter, and a full-text search of the EULA and a
      billing help article) returned no evidence of any kind. Arm 2 (the
      same web.archive.org capture cited above, US-crawled, re-opened fresh)
      is content-bearing (2,333-char body, real plan cards) and shows EUR
      throughout with zero "$" occurrences — positive non-USD evidence per
      the amended rule. See aiva-sources/d007-currency-recheck-2026-08-10.txt.

  headline_billing_basis:
    value: per_month_billed_annually
    source: https://www.aiva.ai/
    evidence: >-
      The qualifier printed directly with the headline "€11 / month"
      figure is "Billed Annually" (a monthly figure charged as one annual
      payment). No "per seat" / "per user" wording is used anywhere on the
      plan card, so rule 2 (per_seat_per_month) does not trigger. Access
      date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  first_charge_amount_usd:
    value: non_usd
    source: https://www.aiva.ai/
    evidence: >-
      Default display state is annual and the headline is a monthly
      figure ("€11 / month ... Billed Annually"), so the first charge is
      the annual total. No USD figure is published anywhere, so the value
      is non_usd; currency EUR, computed verbatim figure "EUR 132.00"
      (11 x 12) recorded in coder_note per section 5.2/domain-1 rules.
      Basis for the x12 multiplication: the "Billed Annually" label
      itself states a once-per-year billing cadence, corroborated by the
      billing FAQ's references to a single "Standard Yearly Price" (see
      https://aiva.crisp.help/en/article/what-am-i-charged-for-when-i-upgrade-from-one-subscription-to-another-1dxazun/,
      not separately archived as it produced no other coded value: "The
      Price you Pay = Standard Yearly Price - 50% of Standard Monthly
      Price"). No explicit sentence states "charged once for twelve
      months" verbatim, so this rests on the "Billed Annually" / "Yearly
      Price" wording rather than a single unambiguous statement -- flagged
      for transparency. VAT excluded per rule 5 (tax). Arithmetic in
      computation_assumptions. Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/
      D-007 re-check (2026-08-10): same amended-rule check as
      headline_price_usd (see that field's evidence and
      aiva-sources/d007-currency-recheck-2026-08-10.txt) applies here too —
      Arm 1 found no selector/parameter/documentary statement of any
      currency; Arm 2's content-bearing US-crawled capture shows only the
      EUR figure this computation is based on. non_usd stands; the
      EUR 132.00 verbatim figure is unchanged.

  mandatory_addon_present:
    value: "no"
    source: https://www.aiva.ai/
    evidence: >-
      Domain 1 is a pricing-class variable (plan composition), so the
      live pricing page ranks first. It lists Standard Annually's full
      feature set (copyright terms, monetization scope, download count,
      track duration, file formats) with no separate required charge.
      EULA section 8 ("Payment of local taxes") only mentions VAT/sales
      tax, which is excluded as a tax, not an add-on, per rule 3. No
      mandatory credit pack, platform fee, or onboarding fee is stated
      anywhere in the pricing page, the EULA, or the licensing/
      cancellation FAQs read for this record. Access date 2026-08-06.
      Archived (pricing):
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/
      Archived (EULA):
      https://web.archive.org/web/20260806132231/https://www.aiva.ai/legal/1

  annual_condition_disclosure:
    value: adjacent
    source: https://www.aiva.ai/
    evidence: >-
      Within the Standard Annually plan card itself, the sequence reads
      "Standard Annually" / "€11 / month + VAT" / "Billed Annually" /
      "26% OFF!" -- the annual-prepayment condition sits directly beneath
      the price figure, inside the same visual price block, satisfying
      the "adjacent" definition. Access date 2026-08-06. Archived:
      https://web.archive.org/web/20260806132059/https://www.aiva.ai/

  annual_default_toggle:
    value: annual_preselected
    source: https://www.aiva.ai/
    evidence: >-
      DOM inspection at page load: the "Billed yearly" toggle element
      carries class "slider-difficulty-title selected-slider-difficulty-title"
      while "Billed monthly" carries only "slider-difficulty-title" (no
      "selected-" modifier). Plan cards simultaneously render their
      annual names/prices ("Standard Annually", "Pro Annually", "Billed
