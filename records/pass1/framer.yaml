      confirmed ($10/mo, see headline_price_usd): $10 x 12 = $120.00.
      Verbatim USD figure: $120.00/yr. See computation_assumptions.

  mandatory_addon_present:
    value: "no"
    source: https://www.framer.com/pricing
    evidence: >
      Every feature that carries a separate charge on the Basic card is
      explicitly labeled "(add-on)" (e.g. "Localization (add-on)") or is an
      optional extra (additional editors, locales). Nothing required to use
      Basic as advertised (1 site, included credits, custom domain, CMS,
