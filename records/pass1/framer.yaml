  # --- Checkpoint group 6: credit system + cost-per-output (domains 5-8, items C1-C5) ---
  credit_system_present:
    value: "yes"
    source: https://www.framer.com/help/articles/how-ai-credits-and-agents-pricing-work/
    evidence: >
      "AI credits power Framer's AI features through a shared monthly
      allowance at the workspace level ... The number of credits a prompt
      uses depends on the complexity of the request." An intermediate
      currency (credits) exists and converts into AI-feature usage, even
      though the core site-building/hosting product itself is flat-rate
      (see cost_per_output_unit).

  credit_unit_defined:
    value: "no"
    source: https://www.framer.com/help/articles/how-ai-credits-and-agents-pricing-work/
    evidence: >
      Read in full: the article explicitly states consumption is variable —
      "The number of credits a prompt uses depends on the complexity of the
      request and the amount of work required to complete it" — and never
      states a fixed conversion such as "1 credit = [unit]" for any output.
      Stating plan allowances (e.g. "2,000 AI credits per month") is not a
      unit definition per codebook rule 5.

  credit_to_output_rate_published:
    value: "no"
    source: https://www.framer.com/help/articles/how-ai-credits-and-agents-pricing-work/
    evidence: "Same document, read in full: no per-output credit rate (fixed or ranged) is published for any feature; only qualitative complexity-dependence."

  credit_rate_location:
    value: absent
    source: https://www.framer.com/help/articles/how-ai-credits-and-agents-pricing-work/
    evidence: "No rate is published in any document class read (pricing page, this dedicated credits article, ToS, AUP)."

  cost_per_output_unit:
    value: per_seat_month
    source: https://www.framer.com/pricing
    evidence: >
      Framer's own pricing page frames its principal, sold output as
      unmetered site-building/hosting access billed per plan (Free/Basic/
      Pro/Enterprise), not as a countable per-generation artifact. AI credits
      meter a secondary feature layer (Agents/localization), not the
      principal output, so the per_seat_month fallback for "unmetered access
      to software" applies.

  cost_per_output_computable:
    value: "yes"
    source: https://www.framer.com/pricing
    evidence: >
      For a per_seat_month unit the per-unit cost is the plan price itself:
      Basic = $10/mo (default display state). CHANGED under D-007 re-check
      (2026-08-10): the figure is now the USD price Arm 2 confirmed (was
      TRY 231/mo; see headline_price_usd), still no missing figures and no
      usage assumption required. See computation_assumptions.

  computation_assumptions:
    value: >-
      Basic(entry),$10/mo,Yearly-toggle-ON default,USD (D-007 re-check
      2026-08-10: web.archive.org Arm-2 capture; was TRY231/mo/non-USD).
      C3: unit=per_seat_month (flat site plan; credits meter a secondary AI
      feature, not principal output) so price=per-unit cost, no division.
      1st charge=10x12=120.00 USD (subs-and-charges: annual billed upfront
      for the year; was 231x12=2772 TRY).
    source: "https://www.framer.com/pricing | https://www.framer.com/help/articles/subscriptions-and-charges/"
    evidence: "Arithmetic and basis as stated; see headline_price_usd, first_charge_amount_usd, cost_per_output_computable, and framer-sources/d007-currency-recheck-2026-08-10.txt for the currency re-check that changed the denomination."

  credit_rollover_policy:
    value: expires_at_period_end
    source: https://www.framer.com/help/articles/how-ai-credits-and-agents-pricing-work/
    evidence: >
      FAQ: "Do unused credits roll over to the next month? No. Your
