  first_charge_amount_usd:
    value: 120.00
    source: https://www.framer.com/help/articles/subscriptions-and-charges/
    evidence: >
      CHANGED under D-007 re-check (2026-08-10) -- same basis as
      headline_price_usd (see that field and framer-sources/d007-currency
      -recheck-2026-08-10.txt). Documents state annual plans are "billed
      upfront for the entire year" (charged once for twelve months) --
      currency-independent contractual language, unaffected by this
