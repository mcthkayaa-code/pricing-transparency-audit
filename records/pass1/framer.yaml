recheck_date: not_applicable

default_display_state: >
  Pricing page loaded with the "Yearly billing" toggle already ON (DOM
  inspection: toggle component data-framer-name="On", variant="On", before
  any interaction) and no separate "Monthly billing" label exists elsewhere
  on the page. Currency rendered as TRY (Turkish Lira: "TRY 0" Free / "TRY
  231" Basic / "TRY 693" Pro / "TRY 462" per additional editor), not USD, with
  no on-page currency or region selector present anywhere (full DOM scan of
  interactive and text nodes found none). navigator.language="tr",
  navigator.languages=["tr","tr-TR"]; archive.org's own save-request response
  headers show x-nid: "Turk Telekom", confirming the browsing session's
  network egress geolocates to Turkey. Per protocol-v1.md section 6.8 this is
  treated as a locale/geography display variant, not a vendor edit: the
  observed state is recorded and coded from as-is, with no reload/spoof
  attempted to find a USD state (see register_events). A cookie-consent
  banner ("We use cookies...") offered only an "Ok" (accept) button, no
  granular reject control; it was left un-interacted with throughout (per
  privacy practice of not accepting non-essential-cookie banners without
  need) and did not block reading any page content via text/DOM extraction.

