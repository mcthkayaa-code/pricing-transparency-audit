conflict_note: >-
  Refund position is stated with varying scope across Framer's own official
  documents. Highest-ranked/most specific: the dedicated Refund Policy help
  article (https://www.framer.com/help/articles/refund-policy/) states a
  general "Worldwide: within 7 days of the initial purchase" window plus an
  extended "European Union and Turkey: within 14 days" window. ToS 13.1
  (https://www.framer.com/legal/terms-of-service) states "all Fees are
  non-cancellable and non-refundable" but prefaces this "Unless otherwise
  specified" -- read as deferring to the dedicated Refund Policy's specific
  terms rather than conflicting with them. However, two lower-authority
  pages narrow this further and omit the worldwide window entirely: the
  pricing-page FAQ (https://www.framer.com/pricing) states only "If you live
  in the EU or Turkey, you are legally eligible for a refund ... within the
  last 14 days" with no worldwide provision, and the help article
  https://www.framer.com/help/articles/subscriptions-and-charges/
  self-contradicts on this exact point WITHIN one page: its own refund-
  window table (mid-article) matches the dedicated policy (worldwide 7-day +
  EU/Turkey 14-day), but a later prose paragraph on the same page says
  "Refunds are generally not provided, except for users in the EU or
  Turkey ... within 14 days," dropping the worldwide window it stated
  earlier. refund_policy_exists / refund_window_days / refund_conditions /
  refund_policy_location are all coded from the dedicated Refund Policy
  article per protocol-v1.md section 6.2 (highest-ranked, most specific,
  single-topic document; every other page defers/links to it).

