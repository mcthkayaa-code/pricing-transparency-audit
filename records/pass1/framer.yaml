# --- Checkpoint group 9: notes + attestation ---
coder_note: >-
  Entry-tier selection (sampling-rules.md 7.2): eligible candidates were
  Basic (TRY231/mo x12 = TRY2,772 annual-equiv) and Pro (TRY693/mo x12 =
  TRY8,316 annual-equiv); Basic wins on lowest annual-equivalent cost. Losing
  candidate: Pro, TRY8,316 annual-equiv. Enterprise excluded as ineligible
  (sales-gated, "Custom" price, no self-serve purchase path). Free is not a
  paid-tier candidate. -- trial_exists=yes rests solely on the Enterprise
  card's "Request Trial" CTA; this is a sales-contact gate with zero
