coder_note: |
  D-005 RE-COLLECTION of a record superseded for coding headline_price_usd = unknown (and, as a
  consequence, headline_billing_basis / first_charge_amount_usd / annual_condition_disclosure /
  annual_default_toggle / cost_per_output_computable = unknown too) because gamma.app is
  Cloudflare-blocked to static fetchers and every tested archive capture is a pre-hydration
  Next.js shell with no injected price. Per the D-005 rule clarification, an ordinary rendered
  browser load is documentary reading, not a prohibited action: this pass loaded
  https://gamma.app/pricing in a real browser, let the page's own Cloudflare JS challenge
  resolve with zero interaction (~5s, no click, no CAPTCHA), and read the resulting DOM. All six
  previously-unknown variables are now coded from that render, cross-confirmed via a second
  English-locale load and a DOM read of each toggle's aria-pressed state. The entry-tier
  decision is now made on hard, DOM-verified numbers instead of the superseded record's
  "documented tier ordering alone" placeholder reasoning.

  Currency (D-003): the render itself displayed USD ("$" sign) directly, in both the Turkish
  default-locale view and an English cross-check -- this was never a non_usd case, so the
  D-003 fallback (non_usd -> US-locale check) was not triggered. One corroborating
  web.archive.org check was still run (curl -m 45, https://web.archive.org/web/2026/...) as
  extra diligence; it resolved to the same 20260804092026 capture already on file and, as
  before, carries no price data at all (pre-hydration shell) -- consistent with, and not
  contradicting, the direct USD evidence from the render. Only the UI language and Turkish
  numeral formatting (period as thousands separator, e.g. "$1.080" = $1,080.00, confirmed by
  90 x 12) were localized to this network's Turkey egress; the price figures themselves were
  not.

  Entry-tier selection (sampling-rules 7.2), Individual tab, all figures DOM/render-confirmed
  2026-08-09: Free $0 (not a paid candidate). Eligible paid candidates: Plus $9/seat/mo =
  $108/yr annual-equivalent [WINNER, lowest], Pro $18/seat/mo = $216/yr, Ultra $90/seat/mo =
  $1,080/yr (pricing page prints this as "$1.080", Gamma's own thousands-separator formatting,
  not a $1.08 typo -- confirmed by 90 x 12). Team $20/seat/mo = $240/seat listed, but the seat
  selector input DOM-confirmed defaults to value "2" (2-seat minimum block) -> $480/yr minimum
  purchasable; Business $40/seat/mo = $480/seat, seat selector DOM-confirmed defaults to "10"
  (10-seat minimum) -> $4,800/yr minimum. Both fail on cost even at their minimum block, and
  are seat-scaled rather than single-seat individual plans. Enterprise-scale option is "Contact
  sales" -- sales-gated, ineligible under sampling-rules 7.2 criterion 2. Plus wins by a wide,
  now-confirmed margin.

  Free-plan credit figures, reconciled rather than conflicting: the pricing page (rendered)
  states "400 credits at signup" with no "monthly" qualifier (unlike Plus/Pro/Ultra, each
  explicitly "X monthly credits"), i.e. a one-time grant, not a recurring rate. The help center
  upgrade article independently confirms the same baseline elsewhere in its text ("Your credits
  will reset at 400, as per our free plan allowance") and separately states "50k input tokens
  for initial generation" -- a narrower, compatible technical sub-limit on prompt size, not a
  competing figure for the same construct. Both are recorded in free_plan_cap_value; this is
  not logged as a conflict.

  cost_per_output_computable reasoning: with price and allowance now known, the calculation for
  the PRINCIPAL output (a presentation) still cannot be completed without an unpublished
  assumption -- the vendor states a maximum of 75 slides per prompt but no typical/fixed card
  count per presentation (codebook rule 7 forbids assuming typical use). A SECONDARY,
  well-defined unit -- cost per card/slide -- is directly computable from published figures
  alone, but only as a range, because the vendor's own credit-per-card rate is itself a
  published range (1-3 credits/card) with no rule for which figure applies. Both codebook rule
  5 (secondary-output case) and rule 8 (range case) independently return partial; see
  computation_assumptions for the arithmetic. cost_per_output_value_usd (derived, not coded
  here) is therefore not_computable, and the range ($0.009-$0.027 per card) is recorded above
  rather than as a single figure, per the derived-variable rule for the range case.

  Archival (protocol 6.4): gamma.app apex-domain pages (pricing, terms, acceptable-use-policy)
  still Cloudflare-block archive.org's own crawler today -- two web.archive.org/save/ attempts
  each returned HTTP 520/520, 520/520, and 520/429 respectively, matching the superseded
  record's documented pattern exactly. Per protocol 6.4's two-strikes rule, local rendered-text
  copies were saved instead (gamma-sources/pricing-rendered-2026-08-09.txt,
  gamma-terms-rendered-2026-08-09.txt, gamma-aup-rendered-2026-08-09.txt) and archive_status is
  coded local_copy_only for these three. help.gamma.app is not behind the same block: the
  refund-policy and cancellation articles both got fresh same-day (2026-08-09) public archive
  captures; the upgrade, per-member-billing, and developers.gamma.app articles returned
  archive.org's pre-existing 2026-08-07 captures (a dedup response, not a failure) -- live text
  for all three was re-read today and matches those captures word-for-word, so no vendor edit
  occurred on any contractual or documentation page since the superseded pass.

  Register event (protocol 6.8 rule 3, display_variant, logged in register_events below): the
  SAME canonical URL, https://gamma.app/pricing, produced two different states within this
  pass. The true, un-interacted first load auto-redirected to /tr/pricing (Turkish UI) based on
  this network's Turkey egress -- this is the state coded as default_display_state and archived
  locally. The coder then deliberately visited /en/pricing once, to verify the Turkish text
  translated accurately (it did, word-for-word on every figure). After that, reloading the bare
  /pricing URL in the same browser session no longer redirected to /tr/pricing -- it persisted
  the English locale instead, a client-side locale-preference cookie/localStorage effect from
  the coder's own prior navigation, not a vendor A/B test or a geography change. Every price,
  toggle state, and allowance figure was identical across both states; only UI language and
  numeral formatting differed. Reported here per protocol 6.6/6.8 rather than silently
  resolved, though it carries no coded-value consequence.

  Non-price variables carried into this pass (free-tier structure, trial absence, credit
  system, rollover, auto-renewal, refund conflict, cancellation, ownership, watermark removal,
  unquantified-limit absence) were not blocked by the Cloudflare/rendering issue in the
  superseded pass -- they were already coded from accessible documents. Per this task's explicit
