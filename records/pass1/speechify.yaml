coder_note: |
  Product-line scope: the entry tier coded in this record is Premium ($29/mo), part of Speechify's
  flagship text-to-speech reader / voice-AI-assistant product at www.speechify.com/pricing/. Speechify
  Studio (voice-over/dubbing, own pricing, own "Studio credits" system) and Speechify API are separate
  product lines with their own pricing pages and are explicitly out of scope for every value in this
  record.
  Entry-tier selection (sampling-rules 7.2): only one paid tier is published (Premium); Free is not a
  paid-tier candidate. Only one candidate was eligible, so there are no losing candidates to record.
  Trial is a $0 free trial (3 days, ToS 2.3(a)(iii)), not a cheap non-zero paid intro period, so the
  paid-time-limited-intro-period open question does not apply to this record.
  Disclosure-thinness findings (free-tier limits and commercial-use rights, flagged as thin for this
  category): the free plan's only documented limits are 10 voices and 1.5x max speed (both quantified);
  no free-tier word/character volume limit is documented anywhere. Commercial use of this product's
  output is explicitly NOT granted at any tier coded here (ToS 4.4 carves out only the separate Studio
  product). Output ownership of AI-generated audio (TTS, AI Podcasts, AI Summaries) is nowhere addressed
  in the full Terms of Service -- coded unknown, not not_applicable, since the product plainly generates
  such output.
  refund_window_days judgment call: the refund policy states a conditional 7-day/500-HD-word refund
  right for the ANNUAL configuration of Premium, but explicitly lists "Subscriptions purchased on a
  Monthly, Quarterly, or Discounted basis" as non-refundable. This record's entry tier is coded in the
  pricing page's default MONTHLY state (sampling-rules 7.2, protocol 6.8), so refund_window_days = 0 for
  the tier as coded, not 7. This creates an unresolved internal tension against the policy's earlier
  general fraud/billing-error 7-day clause, which is not explicitly limited to annual -- flagged here
  rather than resolved by inference, since the specific "Monthly...non-refundable" clause names our exact
  configuration. refund_policy_exists/refund_conditions are coded at the document level (yes/conditional)
  since they are not among the six entry-tier variables and a refund right does exist somewhere in the
  policy.
  trial_card_required="yes" judgment call: ToS 2.3(a)(iii) states "We will charge the payment method you
  provided at sign-up when the Free Trial converts" -- this ties payment-method provision to the sign-up
  moment specifically, which is a stronger statement than the codebook's own "converts automatically
  unless canceled" example (coded unknown there for lack of an at-sign-up clause).
  usage-limits page's own text is internally inconsistent: states the 1,000,000-words/month 2026
  guarantee is active "through December 31, 2026" in one sentence, then "Expires automatically on
  January 1, 2026" (sic) in the next -- read as a vendor drafting error (probably means Jan 1, 2027),
  quoted verbatim, not corrected, and not relied on for any coded value since the guarantee is
  unambiguously active as of this record's 2026-08-12 collection date either way.
  Archival: pricing page and terms archived fresh same-day. usage-limits and refund-policy pages
  returned a stale 2026-07-21 dedup capture on both save attempts (2 of 2 used); coded as
  local_copy_only for those two sources per protocol 6.4, from same-day local evidence copies each
  cross-checked by two independent extraction methods.
  Read-a-price-twice: $29/$139 confirmed in a second representation (embedded SSR JSON payload,
  self.__next_f RSC stream) independent of rendered DOM text; zero sup/sub elements on the page, ruling
  out a superscript-cents misread. SAVE 60% badge arithmetic ($29x12=$348; ($348-$139)/$348=60.06%) is
  internally consistent, confirming $139 is a genuine annual total, not a mislabeled monthly-equivalent
  figure.
  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "No conflict between official sources of equal authority was found on any coded variable. Cross-channel divergence (per assignment instruction): no PRICE divergence could be confirmed from official App Store/Play Store listings -- neither surfaces an itemized price on its current page layout (checked 2026-08-12: https://apps.apple.com/us/app/speechify-text-to-speech/id1209815023 and https://play.google.com/store/apps/details?id=com.cliffweitzman.speechify2&hl=en). A REFUND-RIGHTS divergence by purchase channel IS confirmed by official sources: purchases via Apple App Store or Google Play are final sale, non-refundable through Speechify regardless of the web refund policy's conditional 7-day terms (ToS 2.3(a)(ii): 'if you purchase a subscription through the Apple App Store or our iPhone application, the sale is final, and we will not provide a refund... subject to Apple's applicable payment policy'; same statement for Google Play; restated at the refund-policy page). Web purchasers use https://speechify.com/refund-policy/; store purchasers must use Apple's/Google's own refund mechanisms instead."
