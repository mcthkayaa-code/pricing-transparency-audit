coder_note: |
  Entry tier: Plus, $40.00/mo (default Monthly display state), annual-equivalent $480.00.
  Losing candidates (both eligible: self-serve, generally available, standing plans, not
  per-seat): Pro $100/mo -> annual-equivalent $1,200.00; Max $200/mo -> annual-equivalent
  $2,400.00.

  Frame correction: the assignment brief given to this coder said category "AI humanizer",
  but this product's row in frame-frozen-2026-08-04.csv actually lists category
  "AI bot checker" for product_id hyperleap. Coded from the frame (authoritative per
  codebook section 6: category is "copied from the frozen frame"). vendor_home_url
  (https://hyperleap.ai) is live and correct, not dead/moved. Hyperleap AI's core paid
  product is a customer-service AI chatbot platform (Plus/Pro/Max, $40-200/mo); the site's
  "AI bot checker" placement matches Hyperleap's free lead-gen tools
  (hyperleap.ai/llm-bot-checker, hyperleap.ai/robots-txt-validator — checking whether
  GPTBot/ClaudeBot/PerplexityBot/etc. can crawl a given site), which sit alongside
  category-mates AIclicks/BrandCited/xSeek/Is My Brand In AI in the frame. Those free
  tools carry no pricing page of their own, so this record codes the vendor's one and only
  pricing page (the chatbot plans), consistent with sampling-rules 7.1 (unit = product,
  one vendor_home_url).

  Judgment calls (recorded so a second coder can independently agree or disagree):
  (1) credit_system_present = no despite an add-on literally named "Credit Packs"
  ($12/1,000, "top up AI responses") — 1 credit = 1 AI response at a fixed 1:1, no
  abstracted conversion, and the vendor explicitly markets against competitors' credit
  systems ("A response is a response. Not a credit that shrinks").
  (2) output_ownership_statement drawn from TOS 8.2's general "User Content" ownership
  clause (broadly defined: data/text/graphics/message/audio/video "upload, use, create or
  develop on the Platform", explicitly including content "that is generated"); no clause
  specific to AI-generated chatbot conversation output exists separately.
  (3) commercial_use_lowest_tier coded unknown rather than inferred from TOS 10.1/11.1's
  "non-commercial" platform-access license language, which reads as anti-resale/
  anti-sublicense boilerplate (reinforced by 10.2 "solely for Your own benefit, not for
  resale" and 10.3's list of resale/impersonation/scraping prohibitions), not an
  outputs-commercial-use gate; no pricing-page feature-grid row addresses commercial use
  either, unlike watermark_removal_tier which does have an on-point grid row.
  (4) cancellation_self_serve: TOS 5.8 offers "cancelling Your subscription" as an option
  worded distinctly from "writing to Us"; read as documenting a self-serve route even
  though the clause does not name a specific account-settings location, and Payment Terms
  7 separately confirms upgrade/downgrade self-serve "through Your account dashboard".

  Documentation-quality finding: Terms of Use (v1.0, eff. 2023-06-01) and Payment Terms
  (v1.0, eff. 2025-01-01) both reference plan-naming schemes ("Startup/Growth/Enterprise
  Model" in ToS 4.4, 16.2, 19.1; "Launch/Scale/Enterprise Plan" in Payment Terms section 2)
  that match neither each other nor the live pricing page's Plus/Pro/Max naming. Legal
  documents appear stale relative to the actively-maintained pricing page and refund
  policy (v1.1, eff. 2026-07-17). Billing-cycle mechanics in Payment Terms section 3 are
  stated generically (not tied to a specific plan name) and were treated as currently
  applicable for auto_renewal_default. archive.org's /save/ deduplicated both stale
  documents to earlier-2026 captures rather than minting new ones (see
  hyperleap-sources/archive-log.txt), consistent with them being unchanged since those
  dates. This staleness did not create a same-variable conflict between two equal-authority
  sources for any coded value, so it is recorded here rather than in conflict_note.

  Currency: all reads (curl with an Accept-Language: en-US header, WebFetch, rendered
  browser, and the vendor's own pricing.md stating "All prices in USD") showed USD
  consistently; D-003 escalation (web.archive.org US-crawl cross-check) was not triggered
  because no non-USD figure was ever observed (see hyperleap-sources/archive-log.txt).
  Payment Terms section 9 notes regional/local-currency pricing MAY be shown to some
  visitors ("Pricing is displayed in USD by default but may be shown in local currency"),
  but no such variant was observed this session, so no register_events entry was logged.

  blindness: no other record, no review page, no pass-2 material was opened.
