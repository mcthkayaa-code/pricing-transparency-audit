coder_note: |
  Entry paid tier selection (sampling-rules 7.2): eligible candidates are Pro ($11.99/mo),
  Studio ($29.99/mo), Max ($89.99/mo) - all generally available, self-serve, standing plans,
  not seat-scaled. Annual-equivalent: Pro 11.99*12=143.88 (LOWEST, selected), Studio
  29.99*12=359.88 (losing candidate), Max 89.99*12=1079.88 (losing candidate). Free plan is
  not a paid tier and is not a candidate for entry_tier_name.
  Rendered-read method: WebFetch on https://stableaudio.com/pricing returned only the page
  title with no pricing content (client-side-rendered SPA). Used browser tools (rendered DOM
  read) per protocol D-005. Confirmed price figures in a second representation: raw
  document.body.innerHTML around each price shows plain text e.g.
  '<span class="text-xl font-bold">$11.99</span> a month' - no superscript-cents markup, no
  discrepancy with rendered innerText.
  No embedded __NEXT_DATA__ or script-tag JSON payload found containing price figures (checked
  and confirmed absent - prices are server-rendered directly into HTML, not injected from a JS
  data blob).
  FAQ accordion on the pricing page only keeps one item open at a time and renders answer text
  into the DOM asynchronously after click (React state update); read by clicking each question
  via dispatched click() and reading after a short delay.

  Domain 5-8 (credit/cost/rollover/failed-gen): product meters "track generations" and upload
  "minutes" directly (not an abstracted credit/token currency), so credit_system_present=no per
  rule 1 and C1/C2/C4 are not_applicable. Bonus non-coded finding: FAQs explicitly state
  "No, your unused generations don't roll over" (monthly reset) - not coded to
  credit_rollover_policy because that variable's construct is specifically "credits" and this
  product has no credit system, but recorded here so the finding is not lost. Also found:
  uploaded audio that fails a copyright scan is deleted and its duration IS deducted from the
  monthly upload allowance regardless - this is about upload-allowance consumption on
  copyright grounds, not about a failed/erroring GENERATION, so not coded to
  failed_generation_charge_policy (which stays unknown; no document addresses generation
  failure/error specifically).

  Domain 11 nuance (commercial_use_lowest_tier=lowest_paid): the license grid grants "In
  commercial projects" and "In commercial music releases" from Creator license (Pro/Studio/Max)
  upward, but reserves "In commercial products above 100,000 MAU", "Film, TV, advertisement",
  and "Apps & games" for Enterprise license only (sales-gated, excluded from entry-tier
  eligibility). Personal license (Free plan) is crossed out on every commercial row without
  exception. Recorded as lowest_paid because some commercial right is granted starting at the
  entry paid tier; the narrower Enterprise-only carve-outs are this note, not a separate coded
  value (no "conditional" option exists on this variable).

  Domain 10 refund conflict: see conflict_note for the full disagreement between the governing
  ToS (no refunds stated) and the pricing-page/FAQs discretionary refund policy. This is the
  record's single most consequential finding and is why refund_policy_exists,
  refund_window_days, refund_conditions, and refund_policy_location are all coded from the ToS
  side of that conflict rather than the FAQ side.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Contractual-class hierarchy conflict on refund policy (protocol 6.2 / codebook 2.1 step 3), resolved in favor of the higher-ranked source: stability.ai/terms-of-service (Section 7a, 'Fees and billing') states 'All payments are non-refundable, except where required by law.' - a general no-refunds position matching the codebook's own no_refunds_stated example verbatim. Stable Audio's own pricing-page FAQ and dedicated FAQs page (https://stableaudio.com/pricing and https://stableaudio.com/faqs, identical text) instead publish a discretionary refund PROCESS: 'Stable Audio may give refunds on subscription charges in our discretion, depending on the circumstances below. If a purchase is accidentally made by a friend or family member. If you find a stable Audio subscription charge on your card... that you didn't make... Your refund request is made within submitted within 48 hours of the subscription charge and your usage is below 2% of the allotted monthly generations.' with a stated 2-3 business day response time and Stripe-mediated 5-10 business day credit. These two official documents state incompatible refund positions. Per codebook section 3 / protocol 6.2, the terms of service ranks first for contractual variables (refund is explicitly listed), above the pricing page and above documentation/help center, so refund_policy_exists, refund_window_days, refund_conditions, and refund_policy_location are all coded from the ToS side (no_refunds_stated / 0 / not_applicable / terms). Noted for adjudication: ToS section 12c states supplemental/product-specific terms posted on a Service govern that Service where they conflict with the general Terms ('If those supplemental terms conflict with these Terms, the supplemental terms will govern the applicable Service.') - if the FAQ's refund process is judged to be such a supplemental term, the resolution above would reverse; this coder applied the codebook's document-CLASS hierarchy (ToS above pricing-page/FAQ) mechanically rather than adjudicating that clause, per the instrument's design ('the codebook decides, not the coder's judgment')."
