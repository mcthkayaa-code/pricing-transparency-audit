coder_note: |
  Entry-tier selection (sampling-rules.md 7.2), annual-equivalent cost of eligible candidates in the
  pricing page's default (Yearly) display state: Basic $63.00/yr (WINNER) | Pro $252.00/yr | Max
  $756.00/yr at its default slider position (creator_max_2 of 4 selectable compute levels 40k/60k/
  80k/100k; even the cheapest Max level, creator_max_1, is $504.00/yr, still far above Basic) |
  Business $1,920.00/yr at its default slider position (business_3 of 10 levels; Business is a flat
  team price for "up to 50 seats included...at no extra cost per seat", not per-seat scaling, so the
  whole flat price is the comparable figure) | Enterprise excluded, sales-gated, no published price |
  Free excluded, $0, not a paid tier. Basic wins uncontested (next-cheapest is 4x higher).

  Judgment calls: (1) headline_price_usd coded as the fully-hydrated ON-SCREEN DIGIT ($5, no cents
  shown) rather than the SSR-only aria-label/screen-reader text ($5.25/mo) -- both are part of the
  same served document, but $5 is what a sighted visitor with JS enabled (virtually every real buyer)
  actually reads as the prominent figure; DOM-inspected via the <number-flow-svelte> shadow root,
  confirming the fraction slot renders empty. first_charge_amount_usd and computation_assumptions use
  the precise $63/yr and $5.25/mo figures (also directly stated in the page's own served JSON), since
  those variables ask what is actually charged / computable, not what is displayed most prominently.
  This $5-vs-$5.25 gap is itself a small transparency artifact worth flagging even though no single
  variable name captures it directly. (2) annual_condition_disclosure coded adjacent on the "toggle
  attached to it" clause: Krea's Yearly/Monthly toggle sits directly above the plan grid (not inside
  each card) but is the toggle governing every displayed price, with "Save 40% on yearly plans" beside
  it, visible in the same viewport with no scrolling. (3) credit_rollover_policy coded from the
  Basic/Pro/Max ("do not roll over") behavior since that is what the entry tier itself gets; Business
  and Enterprise plans roll over unused credits per the same source -- a genuine tier-based difference,
  not a source conflict. (4) failed_generation_charge_policy's only source is in the API/developer
  documentation section (job-lifecycle.md) rather than a consumer-facing help article; coded anyway
  because it is an official Krea document describing the same job-state/compute-unit system the
  consumer compute-units.md guide references, and no other official document addresses the question
  at all. (5) credit_to_output_rate_published and credit_rate_location coded from the pricing page
  per the pricing-class source hierarchy even though the docs site publishes a more granular explicit
  per-model rate table, because the two numerically conflict for the one overlapping model (Nano
  Banana 2) -- see conflict_note for both figures and both URLs.

  Frame check: frame row's vendor_home_url (https://www.krea.ai) resolved correctly to the live
  product; no correction needed.

  D-009 re-read 2026-08-10: this record is one of the four coded before the two-representation
  rule was formalized, and was also the arithmetic-flagged case (headline 5.00 x 12 = 60.00 vs
  first charge 63.00). Re-confirmed entry_tier_name, headline_price_usd, headline_billing_basis
  and first_charge_amount_usd independently via a fresh live browser session (separate from the
  2026-08-09 collection), in two further representations: (1) a fresh same-origin fetch of the
  page's embedded SvelteKit JS data payload reproduced plansAndPrices.creator_basic.yearly =
  {amount:63,currency:"usd"} byte-for-byte, confirming first_charge_amount_usd=63.00 and that
  63/12=5.25 exactly; (2) a screenshot of the rendered price card, taken after confirming the
  Yearly/annual toggle carries aria-checked="true" (the default state) via the DOM, shows the
  Basic card's on-screen digit as "$9" struck through "$5" "/month" -- no cents rendered -- as
  the most prominent figure, with Free/Basic/Pro/Max in that left-to-right order and no
  duplicated or mis-mapped row. Both representations match the 2026-08-09 original reading
  exactly. Verdict: CONFIRMED, no correction. This is the "legitimate vendor rounding" case
  named in the D-009 assignment, not a misread: the vendor's own rendered card genuinely shows
  the rounded digit $5 while its own served data genuinely states the true annual charge is
  $63.00 (=$5.25/mo). The check_price_arithmetic.py flag stands and will keep flagging this
  record; it is a correct flag pointing at a real but non-erroneous vendor display quirk, per
  the screen's own documented purpose ("a mismatch is a place to look", not a verdict). Evidence
  saved to krea-ai-sources/d009-reread-2026-08-10.md. Blindness maintained: no other product's
  record was opened during this re-read.

  D-009 re-read 2026-08-10 (addendum, second pass): the coordinator separately flagged an
  apparent self-contradiction between headline_price_usd (5.0) and this record's own
  computation_assumptions text ("$63/yr=$5.25/mo per page JSON"), asking which is right and
  naming this the likely real misread behind the arithmetic screen's flag on this record.
  Re-examined with the most rigorous check in this entire sweep: a raw shadow-DOM inspection
  of the Basic card's price component's internal digit-slot structure (not text serialization).
  Finding: the component's fraction section is `<span part="fraction" ...></span>` -- a
  completely empty element, zero child nodes -- while the integer section's one non-inert
  digit node reads "5". The component's template supports a fraction slot (used elsewhere on
  the page for prices that do carry one), but this price was handed no fraction value to
  render at all: there is no hidden or superscript ".25" a text extractor could have missed,
  which rules out the nicepage/pixlr/pika failure mode specifically. Re-reading
  computation_assumptions in full (not in isolation) shows it already draws this exact
  distinction -- "per page JSON" ($5.25, the precise annual/12 figure, used only for the
  cost-per-output arithmetic) versus "displayed digit" ($5, explicitly cross-referenced to
  headline_price_usd) -- both independently correct for what each represents, not a
  contradiction. Verdict unchanged: headline_price_usd CONFIRMED at 5.00, now in three
  independent representations (embedded JS payload, screenshot, raw shadow-DOM digit-slot
  structure). This re-examination respectfully disagrees that krea-ai is the arithmetic
  screen's "real misread" -- the flag is fully explained by the vendor's own rounded-display-
  vs-precise-charge gap. Full detail in krea-ai-sources/d009-reread-2026-08-10.md addendum.

  Archival: 6 of 9 sources archived cleanly on web.archive.org (pricing, terms, model-overview,
  video, job-lifecycle, llms.txt -- the latter three redirect to a snapshot a few days older than
  the save request but the content is reachable and unchanged). 3 sources under
  /docs/user-guide/help-and-support/ (compute-units, manage-subscriptions, refunds-and-billing)
  returned a 302 from web.archive.org/save on both attempts but the resulting snapshot URL 404s;
  coded per protocol 6.4 as archive: local_copy_only, with the full page text saved under
  krea-ai-sources/. This does not block coding from them (a same-day local copy exists).

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "REFUND: Terms of Use ('KREA WILL NOT REFUND ANY FEES', https://krea-ai.notion.site/Terms-of-Use-4e1e697fb25f491d81e751e74f5fab1c) vs docs/refunds-and-billing.md ('eligible for a refund...below 650 compute units and...less than 20 generations', https://www.krea.ai/docs/user-guide/help-and-support/refunds-and-billing) -- coded from Terms per contractual hierarchy. PRICING: live pricing page (Basic $9/mo|$63/yr, 5,000 units/mo, https://www.krea.ai/pricing) vs docs/manage-subscriptions.md (stale: 'Starting at $10/month', '20% off for annual', Basic '4000/mo', also internally inconsistent free-tier figure '50/day' vs its own '100/day', https://www.krea.ai/docs/user-guide/help-and-support/manage-subscriptions) -- coded from the pricing page per pricing-class hierarchy. CREDIT RATE: pricing page implies ~78 credits per Nano Banana 2 image (5000/64) vs docs/model-overview.md stating Nano Banana 2 = '~50' credits (https://www.krea.ai/docs/user-guide/features/model-overview) -- coded from the pricing page per hierarchy."
register_events:
