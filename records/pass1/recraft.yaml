coder_note: |
  Entry-tier selection (sampling-rules 7.2): eligible candidates were Basic, Pro, and Teams
  (single-seat). Annual-equivalent costs from the default (annual-preselected) display state:
  Basic = 10 x 12 = 120.00 (WINNER, lowest); Pro = 16 x 12 = 192.00 (losing candidate); Teams
  = 18 x 12 = 211.00 per seat, minimum 3 paid seats per terms' "Group Workspace Subscription"
  clause (losing candidate, also not single-seat-purchasable below 3 seats, recorded regardless
  per the price-only comparison rule). Free ($0) is not a paid-tier candidate.

  Price read twice in two representations per binding rule: (1) rendered document.body.innerText,
  (2) raw DOM query for text nodes matching /\$\d/, which returned single un-split "$10"/"$16"/
  "$18"/"$0" spans (class text-headline-1) - no superscript-cents split found. Magnitudes sane
  against tier names and per-month billing basis. See recraft-sources/pricing-rendered-2026-08-10.txt.

  D-005: initial static WebFetch of the pricing page returned no plan prices; rendered read
  (browser render) used instead per binding rule, non-essential cookies declined first.

  D-003/D-007: session network location is Turkey. The vendor's own page (arm 1) rendered
  readable USD ($) figures directly with no currency selector, no country picker, and no
  redirect to a localized-price variant - stopped at arm 1, no non_usd concern arises, nothing
  coded non_usd or unknown-for-currency on this record. Pricing page footnote "prices displayed
  are exclusive of Value Added Tax (VAT)" is a tax-exclusion note, not a non-USD currency signal;
  first_charge_amount_usd excludes tax per codebook rule 5, consistent with the vendor's own
  VAT-exclusive framing.

  free_plan_cap_documented judgment call: the Free card also lists "No commercial use" and "No
  parallel generation" among its bullets. Neither was counted toward the quantified/unquantified
  cap tally: "No commercial use" is a rights restriction (coded under commercial_use_lowest_tier,
  domain 11), not a usage-volume cap; "No parallel generation" carries no printed number and does
  not fit the codebook 5.1 outputs/minutes/exports/seats/storage/resolution/queue-priority list
  of limit dimensions, so it was treated as a feature-availability statement rather than a cap
  to be scored quantified/unquantified. A different reading that treats it as an implicit "0
  concurrent generations" standing limit would not change free_plan_cap_documented (already
  all_quantified via the other three caps) but is flagged here for reproducibility.

  credit_to_output_rate_published / cost_per_output_computable: the current docs table
  (recraft.ai/docs/plans-and-billing/credits) gives "Generate image from prompt: 1* equals the
  model price" with no public table resolving "the model price" for Studio's native V2-V4.1
  models (only external third-party models get a published range, e.g. "OpenAI 2-30 credits",
  and even those say "exact number ... displayed in the product"). This differs from the
  2024-09-09 blog post (recraft.ai/blog/pricing-update, STALE - superseded plan lineup, see
  sources note), which stated a flat "raster image = 1 credit, vector image = 2 credits" split.
  Coded from the current, higher-ranked docs page per protocol 6.2 (documentation outranks a
  blog post; the blog is also dated and describes a discontinued plan structure). The API
  pricing page (docs/api-reference/pricing) is a SEPARATE metering system (API Units, USD,
  prepaid) from Studio "credits" and was not mixed into the Studio-credit computation; it is
  cited only as corroborating evidence that Recraft does price vector output above raster
  output where a resolved number is published at all (consistently ~2x-2.3x per model tier).

  usage_cap_quantified for Basic: "Unlimited image uploads" / "Unlimited styles usage" treated
  as NOT quantified because the terms' discretionary limits clause ("we may impose limits ...
  without notice") qualifies an unlimited claim per codebook 5.1's unlimited carve-out
  (usage_cap_quantified rule 3), matching the codebook's own Vendor U worked example.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Refund position: terms of service (https://recraft.ai/terms, 'Fees and Payments') states 'If you cancel your subscription ... you will not receive a refund or credit for any amounts that have already been billed or paid' (no stated exception). Billing docs (https://www.recraft.ai/docs/plans-and-billing/billing) and the pricing-page FAQ (https://www.recraft.ai/pricing) both state 'If you have used fewer than 30 credits over the lifetime of your account and your most recent payment was made within the past 30 days, you may request a refund.' Coded refund_policy_exists / refund_window_days / refund_conditions / refund_policy_location from the terms per protocol 6.2 (terms rank first for contractual variables); the documented conditional exception is real and reproducible but sits in a lower-ranked document class. Separately: credit-rate figures conflict between the current docs table (recraft.ai/docs/plans-and-billing/credits, 'Generate image from prompt: 1x model price', no raster/vector split at that table) and the dated 2024-09-09 blog post (recraft.ai/blog/pricing-update, 'raster=1 credit, vector=2 credits') describing a since-superseded plan lineup; coded from the current docs page as the higher-ranked, current source, per codebook credit_to_output_rate_published / cost_per_output_computable notes above."
