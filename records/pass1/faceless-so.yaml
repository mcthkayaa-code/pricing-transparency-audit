default_display_state: |
  Pricing page (https://faceless.so/pricing) loads with the Monthly/Yearly billing toggle
  defaulting to "Yearly" (confirmed via live browser render: screenshot + read_page +
  get_page_text, desktop viewport 1440x1000, no interaction before recording). Four plan cards
  shown left to right: Starter $24/mo billed $290 yearly (no struck-through comparison price);
  Growth $32/mo billed $390 yearly, struck-through "$49", badge "BEST FOR STARTING OUT"; Influencer
  $57/mo billed $690 yearly, struck-through "$107", badge "MOST POPULAR"; Ultra $82/mo billed $990
  yearly, struck-through "$166". A fifth, sales-gated "Enterprise" tile follows ("Contact Sales", no
  figure). A sixth tier, "Free" ($0), exists in the vendor's own subscription-plan data (see METHOD
  NOTE) but is NOT rendered as a card on this page in this or any state: the page component's own
  code sets a hideFreePlan prop to true by default, confirmed in the page's JS bundle and matching
  the live render (no Free card visible). No cookie-consent banner appeared on any page read. This
  is the state used for entry-tier selection and every default-state-anchored variable below.
  METHOD NOTE (applies to headline_price_usd, headline_billing_basis, first_charge_amount_usd,
  annual_condition_disclosure, annual_default_toggle, entry_tier_name, and the FAQ-sourced contractual/
  credit facts below): this Next.js app renders its pricing-card figures and its FAQ accordion answers
  client-side from data embedded in its own JS bundle, not in the server-delivered HTML - confirmed
  by plain curl of / and /pricing returning the FAQ questions and a generic meta-description price
  mention ("Plans start at $29/month") but NOT the FAQ answer text or any plan-card price/credit
  figure. Per this study's established practice for this product (carried over instruction: pricing
  FAQ answers rendering from JS chunks are part of the public page, and downloading the chunks to
  read them verbatim is legitimate documentary reading, source = the page URL), this coder downloaded
  every JS chunk referenced by a <script src> tag on the live / and /pricing pages and read the
  plan-price/credit data and FAQ question+answer text directly from them, verbatim, via plain-text
  search (no execution). The pricing-card figures extracted this way (chunk 584c5016af948b8b.js,
  object key "6" - the version index the pricing page's own code selects via "subscriptionPlans[6]",
  confirmed by reading that selection line in the page's component chunk) were cross-checked against,
  and exactly match, the live-rendered annual-toggle figures independently captured via browser
  screenshot/get_page_text: $24/$32/$57/$82 current, struck $49/$107/$166, "billed $X yearly" totals
  $290/$390/$690/$990 - four-for-four exact matches on every figure the browser could confirm. This
  coder treats the same chunk's Monthly-toggle figures (price 29/39/69/99, struck 59/129/199) as
  reliable on that basis, since the browser tool could not be made to visibly toggle to Monthly in
  this session (Monthly-button click attempts via element ref and via screenshot coordinate did not
  change the rendered state, tried twice with fresh page reads); this is immaterial to scoring since
  the default state is Yearly and sampling-rules.md 7.2 rule 1 forbids toggling for a cheaper figure
  regardless of which state is being sought. Each JS chunk this record cites as a source was itself
  separately submitted to web.archive.org and the archived copy was spot-checked against the local
  download (byte-identical apart from trivial wayback-injected whitespace/variable-rename noise);
  archive.org captures a chunk's raw JS text unmodified, unlike the human-facing HTML pages, which
  archive.org captures pre-render, same limitation as this coder's own curl fetch (spot-checked: the
  archived /pricing snapshot contains no "$24" or "billed $290" text, confirming the chunk archives
  are the operative evidence for the rendered figures, not the page-URL archives, which are retained
  for document-identity/discovery purposes per protocol-v1.md 6.4).
