  - { url: "https://faceless.so/developers/docs/series", kind: docs, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806101856/https://faceless.so/developers/docs/series", note: "Official developer documentation, server-rendered, read in full. Confirms per-episode credit cost 'exactly like a single video' and the model-cost range framed in the vendor's own words as '20 to 100 credits'." }
  - { url: "https://faceless.so/developers/docs/errors-and-rate-limits", kind: docs, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806101915/https://faceless.so/developers/docs/errors-and-rate-limits", note: "Official developer documentation, server-rendered, read in full. States 'usage_limit_reached (403): the team's plan caps its number of video projects and the cap is hit' with no number stated for any plan. Describes generation failures as reported via polling (status: 'failed'), not as HTTP errors; says nothing about whether credits are kept or returned on a technical failure." }
  - { url: "https://faceless.so/developers/docs/getting-started", kind: docs, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806102011/https://faceless.so/developers/docs/getting-started", note: "Official developer documentation. Read for completeness; contributed no additional coded facts beyond what credits-and-limits/videos/series/errors already stated." }
  - { url: "https://faceless.so/developers", kind: docs, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806102030/https://faceless.so/developers", note: "Developer hub/landing page. Read for document discovery (found the guide link list). Contributed no additional coded facts." }
  - { url: "https://faceless.so/warmed-accounts", kind: other, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806102128/https://faceless.so/warmed-accounts", note: "Separate, optional add-on product (buy warmed TikTok/Instagram accounts, 'from $49.90 per account / month', 'Now taking orders'). Read to verify mandatory_addon_present: nothing on the entry tier's own feature list requires purchasing this: auto-posting to the buyer's OWN connected accounts is included per the pricing-page FAQ ('Which platforms are supported for auto-posting? ... Connect once'). Confirms optional, not mandatory." }
  - { url: "https://faceless.so/billing", kind: other, accessed: 2026-08-06, archive: not_applicable, note: "NOT USED AS A SOURCE. Listed in the public sitemap but the URL itself redirects (curl -L, HTTP 200 final) to /login - it is the authenticated in-app billing-management page, not a public document. Not opened further, not logged in, per the documents-only/no-login hard rule. Excluded from source_urls below." }
  - { url: "https://faceless.so/_next/static/chunks/19a6e122735da195.js", kind: js_chunk, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806102219/https://faceless.so/_next/static/chunks/19a6e122735da195.js", note: "JS chunk referenced by <script src> on the live home page (/). Contains the home page's full 'Billing & Pricing'-and-general FAQ array (17 question/answer pairs) verbatim as plain-text JS object literals, including the product's only refund-policy statement, its cancellation statement, and 'Each video generation costs 20 credits'. See default_display_state METHOD NOTE." }
  - { url: "https://faceless.so/_next/static/chunks/43c08182ba11fb82.js", kind: js_chunk, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806102227/https://faceless.so/_next/static/chunks/43c08182ba11fb82.js", note: "JS chunk referenced by <script src> on the live /pricing page. Contains (a) the pricing-card React component, including the plan-name/description/badge mapping and the line 'let E=y.subscriptionPlans[6]' that selects data-object version 6 as live, and (b) the /pricing page's own 9-question FAQ array verbatim, including 'Do you offer a free trial?' -> 'We don't offer a traditional free trial at the moment, but we have competitive pricing and a satisfaction guarantee.'" }
