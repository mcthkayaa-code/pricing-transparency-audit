  # --- domain 1: headline price vs first charge (index A1, A3) ---
  headline_price_usd: { value: 24.00, source: "https://faceless.so/_next/static/chunks/584c5016af948b8b.js", evidence: "Starter card, default (Yearly) display state, live-rendered figure verified by browser screenshot/get_page_text: '$24' shown large/bold with '/mo' smaller beneath it, and 'billed $290 yearly' as a smaller caption below that (no struck-through comparison price on this card). Chunk data (subscriptionPlans[6].starterSubscription.annual = {price:24, pricePerYear:290}) matches exactly. Most prominent figure for the entry tier in the default display state, per headline_price_usd rule 2." }
  headline_billing_basis: { value: per_month_billed_annually, source: "https://faceless.so/pricing", evidence: "'$24' is qualified '/mo' with 'billed $290 yearly' directly beneath it in the same card, in the default (Yearly-toggle-active) state - a monthly figure charged as one annual payment. Matches codebook's own Vendor C worked example structure exactly." }
  first_charge_amount_usd: { value: 290.00, source: "https://faceless.so/_next/static/chunks/584c5016af948b8b.js", evidence: "Read directly from the card's own 'billed $290 yearly' text (live-rendered, browser-verified), not computed by multiplying the monthly figure - the annual total is stated outright, so no 'charged once for twelve months' assumption is needed (rule 2's multiply-by-12 clause does not apply; the total is simply read). Chunk data confirms: starterSubscription.annual.pricePerYear = 290. No mandatory add-on to add (see mandatory_addon_present). Taxes and overages excluded per rule 5 (no jurisdiction-specific tax or overage-billing text found in any source)." }
  mandatory_addon_present: { value: "no", source: "https://faceless.so/pricing", evidence: "Starter card's full feature list (Unlimited Series, 500 Credits/month, Auto-Post Videos, Voiceovers, AI generated content, Script & Hook Generation, Background music, AI effects/zooms/transitions, Cinematic Captions, No watermark, Download Videos, Unlimited Exports, Unlimited Custom Templates, 3 Team Members, Premium Live Chat Support) plus Terms of Service (read in full, silent on all charges), privacy policy, and developer docs (credits-and-limits, videos, series, errors-and-rate-limits, all read in full) show no required additional charge, minimum credit purchase, platform fee, or compulsory onboarding fee to use Starter as advertised. The separate 'Warmed Accounts' service (from $49.90/account/month, https://faceless.so/warmed-accounts) is an optional add-on - buyers can auto-post to their own connected accounts, which is included - and top-up credit packs (mentioned in developer docs, $10/100 credits) are an elective option beyond the included 500 credits/month, not a required purchase to use the plan as advertised." }
