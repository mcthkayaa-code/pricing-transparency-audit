  annual_condition_disclosure: { value: adjacent, source: "https://faceless.so/pricing", evidence: "'billed $290 yearly' is printed directly beneath the '$24 /mo' figure, inside the same Starter price block/card - same visual unit as the figure itself, matching the 'adjacent' definition ('the same card, the same line, directly beneath the figure') exactly." }
  annual_default_toggle: { value: annual_preselected, source: "https://faceless.so/pricing", evidence: "Live browser render (screenshot + read_page, no interaction before recording): the 'Yearly' pill of the Monthly/Yearly toggle is visibly highlighted/active on page load, and all four plan cards show annual ('billed $X yearly') figures as their current, non-struck price. Archived at https://web.archive.org/web/20260806101148/https://faceless.so/pricing (page-URL archive; per default_display_state METHOD NOTE this snapshot does not itself render the client-side toggle state, so the state-of-record rests on this coder's own live-browser observation, screenshotted, at the access date/time above - no second state was observed on any read in this pass, so no display-variant register event applies)." }
