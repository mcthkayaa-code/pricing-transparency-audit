  credit_rate_location: { value: multiple, source: "https://faceless.so/developers/docs/videos", evidence: "Rate is published in the developer documentation (docs_help_center class: credits-and-limits, videos, series pages) AND on the live /pricing page's own FAQ ('How many videos can I create per day? ... Each video generation costs approximately 20 credits', pricing_page class, chunk 43c08182ba11fb82.js) - two different document classes both state it." }
  # --- domain 6: computability of cost per output (index C3) ---
  cost_per_output_unit: { value: other, source: "https://faceless.so/pricing", evidence: "Product is sold to produce discrete short-form videos, charged flatly per generation event by model tier, not metered by duration/minute (no document anywhere ties credit cost to video length; a 'duration' field appears as a creation parameter in the API docs but credits charged depend only on the chosen model, per the videos-doc table). None of the codebook's enumerated units (per_video_minute, per_image, per_1k_words, per_audio_minute, per_page, per_headshot, per_document, per_presentation, per_seat_month, per_api_call) fits a flat per-video charge; coded other, unit named in coder_note as 'per video (per generation event)'." }
