  free_plan_exists: { value: "yes", source: "https://faceless.so/_next/static/chunks/19a6e122735da195.js", evidence: "Home-page FAQ (client-rendered, read verbatim from JS chunk): 'Signing up is free and lets you explore the platform before paying, and you can cancel a paid plan anytime.' A no-cost 'Free' plan object (price 0) also exists by name in the vendor's own subscription-plan data (chunk 584c5016af948b8b.js, subscriptionPlans[6].freeSubscription, price:0 for both monthly and annual). Not a time-limited trial (domain 4 covers that separately; see trial_exists=no) - framed as a standing pre-payment account state, not a countdown. NOTE: this 'Free' tier is never shown as a card on the live /pricing page (hideFreePlan defaults to true in the page's own component code, confirmed and matching the live render) - the only evidence for it is the FAQ sentence above plus the named $0 object in the data layer; flagged in coder_note as a thinly-evidenced 'yes'." }
  free_plan_cap_documented: { value: unknown, source: "https://faceless.so/_next/static/chunks/19a6e122735da195.js", evidence: "No document read (home FAQ, pricing-page FAQ, Terms of Service, Privacy Policy, or any developer-docs page) states any specific limit, credit allowance, or restriction for the Free tier. The vendor's own data object for the Free tier (chunk 584c5016af948b8b.js) carries a 'price' field only (0) and no 'credits' field (unlike every paid tier, which explicitly carries one, e.g. starterSubscription credits:500) - this coder treats that structural absence as inconclusive/not a prose statement of a limit, not as a documented '0 credits' finding, per the instruction to code from documents rather than from inference. free_plan_exists is established by an explicit FAQ sentence, but no document anywhere describes what the free plan does or does not include; 'the free plan's limits are not described at all' is the exact fit for unknown." }
  free_plan_cap_value: { value: unknown, source: "https://faceless.so/_next/static/chunks/19a6e122735da195.js", evidence: "free_plan_cap_documented=unknown (no limits described at all): there is no quantified figure to record. codebook's value list for this field has no distinct 'nothing was quantified because nothing was described' option separate from unknown; used as the closest fit, flagged in coder_note for adjudicator attention (same instrument-gap noted in this study's aragon-ai record)." }
  free_plan_watermark: { value: unknown, source: "https://faceless.so/pricing", evidence: "The Starter/Growth/Influencer/Ultra cards all list 'No watermark' as an included feature, but the Free tier is not shown on the pricing page at all (see free_plan_exists note), so there is no feature-grid row to read a cross/check against for Free specifically. No other document (home FAQ, pricing FAQ, ToS, privacy, developer docs) mentions watermarks. Principal output (a video) plainly could carry a watermark, so not_applicable does not fit; total silence on the free tier specifically codes unknown." }
  free_plan_duration: { value: perpetual, source: "https://faceless.so/_next/static/chunks/19a6e122735da195.js", evidence: "Home FAQ: 'Signing up is free and lets you explore the platform before paying' - framed as a standing pre-payment account state, not a time-boxed offer ('free for 7 days', 'free trial period', etc.), and no document anywhere states an expiry for it. Applying the decision rule's plain test (no expiry stated anywhere in the documents = perpetual) mechanically yields perpetual; evidence for this specific tier is thin (only the one FAQ sentence, plus the un-rendered $0 data-layer object), flagged in coder_note alongside the free_plan_exists flag." }
