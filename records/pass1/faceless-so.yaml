  https://faceless.so): leaf-node exact-text search found "Billed $290 yearly" printed once (Starter
  card only, not duplicated across other cards), plan-name leaf nodes in page order Starter/Growth/
  Influencer/Ultra, price leaf nodes $24/$32/$57/$82 respectively (Starter lowest), and the billing
  toggle carrying aria-selected="true" on "Yearly" / aria-selected="false" on "Monthly" -- confirms
  the default state is annual, from the DOM's own selected-state attribute, not from extractor order.
  Representation 2 (embedded JSON payload, re-grepped fresh from the saved chunk file faceless-so-
  sources/chunks/584c5016af948b8b.js): starterSubscription.annual = {name:"Starter (annual)",
  price:24, pricePerYear:290} -- matches the original record's own chunk citation exactly. Today's
  live DOM figures match this saved chunk's figures exactly, so no final-day change occurred. Both
  representations agree with every coded value; the plan-grid row mapping is confirmed (Starter is
  the single leftmost/lowest card, its price and its "billed" caption sit in the same card, no
  duplicate or shifted row). Verdict: the arithmetic flag is vendor rounding, not a misread -- the
  vendor states the annual total ($290) directly rather than deriving it from the monthly figure,
  and 290/12=24.17 rounds to the displayed $24/mo, which is exactly the "documents state the annual
  total directly" case codebook rules headline_price_usd-2 and first_charge_amount_usd-2 both
  describe; neither rule requires the two to multiply out evenly, only that the annual figure be
  read rather than computed, which is what happened here. NO CORRECTION. A third screenshot
