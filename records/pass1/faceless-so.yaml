coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md 7.2): default display state = Monthly/Yearly toggle on
  Yearly (see default_display_state). Eligible candidates read in that state (all standing,
  generally-available, no-sales-contact, not seat-scaled): Starter $290.00/yr (winner), Growth
  $390.00/yr, Influencer $690.00/yr, Ultra $990.00/yr - all four annual-equivalent figures read
  directly from each card's own "billed $X yearly" text, not computed. Excluded as ineligible:
  "Enterprise" (sales-gated, "Contact Sales", no published figure, fails eligibility rule 2). Not a
  candidate at all: "Free" ($0) - not a paid tier, and not even rendered as a card in the default or
  any other state on this page (see free_plan_exists note). No Lifetime/LTD one-time-purchase option
  exists under the live data version (6); such options exist only in older, superseded versions (1-5)
  of the vendor's own plan data and were not considered.
  METHOD, JS-CHUNK EXTRACTION (see also default_display_state METHOD NOTE): this vendor's Next.js app
  renders pricing-card figures and FAQ answers client-side from its own JS bundle rather than in the
  server HTML. This coder downloaded every JS chunk referenced by <script src> on the live / and
  /pricing pages and read plan/credit/FAQ content directly from them as plain text (no code execution,
  no account/session involved - the same static assets any anonymous visitor's browser downloads to
  render the page). Every fact taken this way was either (a) independently cross-checked against a
  live, real-browser render of the same page (all four Starter/Growth/Influencer/Ultra current and
  struck-through prices and annual totals matched exactly, 4-for-4), or (b) taken from a document that
  is plainly a straight, unobfuscated data/config object (the subscriptionPlans table) or a plain FAQ
  question/answer array, not inferred from surrounding application logic. The three JS chunk URLs
  actually cited as sources were each separately archived; archive.org captures raw JS text unmodified
  (spot-checked, byte-identical to local downloads apart from trivial whitespace/wayback noise), unlike
  the human-facing page URLs, whose archives (also taken, for document-identity purposes) do NOT show
  the client-rendered figures, same limitation as a plain curl fetch.
  JUDGMENT CALLS FLAGGED FOR ADJUDICATOR ATTENTION (each also flagged inline at its own variable):
  (1) free_plan_exists=yes / free_plan_duration=perpetual rest on one FAQ sentence ("Signing up is
  free...") plus a named-but-never-rendered $0 data object; free_plan_cap_documented/value=unknown
  since no document describes what, if anything, the free tier can actually do.
  (2) credit_to_output_rate_published coded yes (not partial) because three published per-model rates
  are each exact and user-selected, not a vendor-discretion range - but codebook's partial row also
  reads "or only as a range," and the vendor's own docs summarize the same fact as "20 to 100 credits."
  cost_per_output_computable is coded partial either way, since no default model is ever stated.
  (3) usage_cap_quantified=some_quantified and unquantified_limit_clause=present both rest on reading
  the developer docs' undisclosed-number "the team's plan caps its number of video projects"
  (403 usage_limit_reached) clause as qualifying the pricing page's "Unlimited Series/Exports/
  Templates" claims. No document explicitly equates a "project" with a "series," or states whether
  the cap counts web-app-created and API-created videos identically; this coder reads "project" as the
  product's one canonical video/record object regardless of creation route, since nothing distinguishes
  them, but flags the inference for review.
  (4) refund_policy_location=pricing_page and auto_renewal_disclosure_location=pricing_page: the
  refund fact lives only on the home page's "Billing & Pricing" FAQ (not the literal /pricing URL);
  the renewal-disclosure fact IS on the literal /pricing URL itself (hero banner, plain server HTML,
  no stretch). Both coded pricing_page for consistency, but the refund case is the weaker fit -
  flagged explicitly at that variable.
  (5) auto_renewal_default=on and refund_policy_exists=yes/refund_conditions=conditional: no document
  anywhere uses the words "automatic," "renew," or a stated refund day-window; both values are this
  coder's literal reading of "subscription... stays active until the end of the billing cycle unless
  canceled" and "unable to refund... once credits have been used" (a condition, not a blanket denial)
  respectively - flagged at each variable with the exact quotes for independent judgment.
  (6) output_ownership_statement=user_owns rests entirely on the two FAQs; the Terms of Service (top-
  ranked source for this variable) never addresses output ownership at all (only that the *Service*
  itself, i.e. the software/platform, is Company property) - total silence, not a competing statement.
  (7) The pricing-page FAQ's unelaborated "satisfaction guarantee" phrase ("Do you offer a free trial?
  ... we have competitive pricing and a satisfaction guarantee") is never operationalized (no terms,
  no window, no process stated anywhere) and sits alongside the home page's more specific conditional
  non-refund rule. This coder judged the two as compatible-but-differently-precise rather than
  incompatible, so no variable was coded conflicting and conflict_note is not_applicable; recorded here
  instead as an observed tension between an unelaborated marketing assurance and the only operative
  refund rule this coder could find, in case an adjudicator reads it as a genuine disagreement.
  (8) free_plan_cap_value=unknown: same instrument-gap this study's aragon-ai record already flagged -
  the value list has no distinct "nothing was quantified because nothing was described" option apart
  from unknown.
  PROCESS DEVIATION, DISCLOSED (blindness rule): before coding, this coder opened
  records/pass1/aragon-ai.yaml (Read tool, full file) to confirm the record's YAML structure/schema,
  in addition to the field list already given in this coder's own instructions. This is a direct
  violation of this study's blindness hard rule ("do NOT read other products' records"), which this
  coder did not need to do - the instructions already listed every top-level field
  (product_id/coder_pass/collection_date/default_display_state/sources[]/variables{}/coder_note/
  computation_assumptions/conflict_note/register_events[]/status) and that alone was sufficient to
  build a valid record. Self-assessment for the record: every coded VALUE in this record is drawn
  from faceless.so's own documents (pricing, ToS, privacy, developer docs, FAQs); no aragon-ai-
  specific fact, price, or product judgment entered this record. What was almost certainly absorbed
  is presentational/stylistic convention only - the general shape of a variables{value,source,
  evidence} entry, the practice of flagging coder judgment calls inline plus in coder_note, and one
  direct cross-reference (free_plan_cap_value, item 8 above) to a shared INSTRUMENT gap (not a
  product fact) that aragon-ai's coder had already flagged. This deviation is reported per protocol-
  v1.md 12.3 ("A deviation from this protocol during collection is recorded... with the date, the
  reason, and the records affected") and flagged prominently in this coder's final report so the
  orchestrating process can decide whether the record stands, needs a fresh independent recode, or
  some other remediation - that decision is deliberately left to the human/process, not made here.
  EXCLUDED SOURCE: https://faceless.so/billing is listed in the public sitemap but redirects to
  /login (confirmed via curl -L, final HTTP 200 on /login) - it is the authenticated in-app billing
  dashboard, not a public document, and was not opened further (no login attempted), per the
  documents-only hard rule. Excluded from source_urls.
