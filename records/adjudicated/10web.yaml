variables:
  headline_price_usd: { value: "10.00", source: "https://10web.io/pricing-platform/", evidence: "AGREED by both passes. AI Starter card, default display state (Business/Annually): '$10 /mo'. Re-confirmed by pass 1's own D-009 second-representation re-read and by pass 2's raw-outerHTML second representation." }
  headline_billing_basis: { value: per_month_billed_annually, source: "https://10web.io/pricing-platform/", evidence: "AGREED by both passes. Default toggle is 'Annually'/'12 months' (50% off badge); $10/mo is the monthly-equivalent figure under a 12-month prepaid commitment, per the same card's own 'Get 12 months for $120 (regular price $240).'" }
  first_charge_amount_usd: { value: "120.00", source: "https://10web.io/pricing-platform/", evidence: "AGREED by both passes. Read directly from the AI Starter card: 'Get 12 months for $120 (regular price $240).' Vendor-stated, not a coder multiplication." }
  mandatory_addon_present: { value: "no", source: "https://10web.io/pricing-platform/", evidence: "AGREED by both passes. No required additional charge for the AI Starter plan as advertised; additional websites, CDN, and usage overages are optional/usage-conditional upsells (pass 2 corroborates from the 'Why Have I Been Charged' article: extra site slots and CDN are billed as add-ons, not required to use the plan)." }
  annual_condition_disclosure: { value: adjacent, source: "https://10web.io/pricing-platform/", evidence: "AGREED by both passes. The annual-prepayment condition is disclosed in the same visual price card as the $10/mo headline: the billing-toggle's own '12 months'/'Annually' + '50% off' label, and the card's own 'Get 12 months for $120 (regular price $240).' line." }
  annual_default_toggle: { value: annual_preselected, source: "https://10web.io/pricing-platform/", evidence: "AGREED by both passes. DOM class 'tab 12 active'/'period-item 12 selected' on the Annually control; 'Monthly' carries no active class. Pass 1 confirmed this is server-rendered (no-JS curl fetch), not a client-side/geo/cookie variant; no register_event logged by either pass." }
  free_plan_exists: { value: "yes", source: "https://help.10web.io/hc/en-us/articles/360021420139-Get-Started-for-Free-on-10Web", evidence: "AGREED by both passes. 'Free platform users are limited to generating one website, and full editing requires enabling the 7-day free trial.' Corroborated by the pricing page's own H1 'Start free. Scale with every site.' and every plan card's 'Get started for free' CTA. Pass 2 flagged a tension against ToS 'To be able to use the Platform... you have to have an active subscription' and correctly resolved it: free-tier variables are pricing-class, where docs/pricing rank above the ToS (protocol 6.2), and multiple pricing/help-center sources specifically describe free access. Carried into conflict_note below since a contract sentence that reads as contradicting the free plan's own existence is a gap worth preserving even though the hierarchy settles it cleanly." }
  free_plan_cap_documented:
    value: all_quantified
    source: "https://help.10web.io/hc/en-us/articles/360021420139-Get-Started-for-Free-on-10Web"
    evidence: >-
      DISPUTED, resolved by rule. Codebook 5.1's quantified-limit test and its own enumerated
      dimensions (outputs, minutes, exports, seats, storage, resolution, queue priority) are all
      volume/capacity dimensions with a number that could attach to them, contrasted against vague
      adjectives (limited, basic, reduced...) that soften an otherwise-numeric dimension. The free
      plan's only two documented limits of THAT kind are '1 website' (standing limit, agreed by
      both passes and by the Agentic Website Builder doc) and a page-recreation cap stated as
      quantified in BOTH of two conflicting official docs (10 pages per one article, 5 per another
      -- see free_plan_cap_value; both numbers are quantified regardless of which governs, so this
      variable is unaffected by which figure wins). Pass 2's two additional citations -- 'full
      editing requires enabling the 7-day free trial' and 'SSH and SFTP credentials are not
      available on free plans' -- are feature-availability gates, not limits with a quantifiable
      dimension: there is no number 'SSH access' or 'full editing' could carry, unlike a softened
      volume word such as 'limited resolution'. They describe the boundary between the free plan and
      the separate, already-domain-4-coded Pro trial (auto_renewal/trial_* variables), not an
      unquantified CAP on the free plan's own allowance. Notably, pass 1's own record quotes both
      of these same two facts almost verbatim in its free_plan_exists and free_plan_duration
      evidence fields, so this is a considered exclusion, not a coverage miss. Since both dimensions
      that ARE volume-type limits are quantified numbers, all_quantified holds. Prior values: pass 1
      = all_quantified; pass 2 = some_quantified (counted the two feature gates as unquantified
      limits).
  free_plan_cap_value:
    value: "conflicting"
    source: "https://help.10web.io/hc/en-us/articles/360018862340-Free-Plan-How-to-Convert-Recreate-a-Website-With-AI | https://help.10web.io/hc/en-us/articles/7952757255186-AI-Website-Builder-Fully-Automated-WordPress-Website-Creation-in-a-Few-Minutes"
    evidence: >-
      DISPUTED, resolved by rule -- and reached a value neither pass coded. This variable's own
      decision rule is explicit and was not discretionary: 'Where two official sources of equal
      authority publish incompatible caps, code conflicting and record both figures with both URLs
      in conflict_note.' Two DIFFERENT official help-center articles (same rank: docs/help-center
      class, protocol 6.2), both live and neither marked outdated by Zendesk's own metadata, state
      incompatible page-recreation caps for free users: 'up to 10 pages for free users'
      (360018862340, updated 2025-01-23) versus 'The free plan is limited to 5 pages only'
      (7952757255186, updated 2024-11-01). Both re-verified unchanged live by this adjudicator on
      2026-08-16 (the 5-page article via the Zendesk API; the 10-page article's live re-check
      returned a transient 401 twice, so it rests on pass 1's saved capture, read directly from the
      JSON by this adjudicator). The '1 website' figure is NOT in dispute -- both docs and both
      passes agree on it -- only the page-count sub-figure conflicts; the instrument's format has no
      clean way to mark one sub-figure of a compound cap conflicting while stating the rest (pass 1
      flagged this exact instrument gap in its own coder_note), so per the rule's literal
      instruction the field is coded conflicting and both page-count figures plus the undisputed
      website figure are preserved in conflict_note with all URLs and quotes. Prior values: pass 1 =
      "1 website | 10 pages" (identified the conflict but picked the newer article's figure rather
      than coding the field conflicting -- an inference the rule does not authorize, since nothing
      in this instrument treats a more-recent update date as a tiebreaker between two live,
      contemporaneously-published, equal-rank documents); pass 2 = "1 website" (did not locate
      either page-count article -- a coverage gap, not a considered exclusion).
  free_plan_watermark: { value: unknown, source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. 'watermark' does not appear anywhere in the ToS, PUP, pricing page, or the free-plan help articles in the sense of vendor branding on outputs. Principal output (a website) plainly could carry a footer badge, so not_applicable does not fit; documented silence codes unknown." }
  free_plan_duration:
    value: perpetual
    source: "https://help.10web.io/hc/en-us/articles/360021420139-Get-Started-for-Free-on-10Web"
    evidence: >-
      DISPUTED, resolved by rule. This variable's own decision rule, not merely its value-table
      wording, is the operative test: 'A plan the pricing page presents as a standing tier alongside
      paid tiers, with no expiry stated anywhere in the documents, is perpetual.' That is a
      deliberate, variable-specific exception to the instrument's general silence-equals-unknown
      default (parallel to usage_cap_quantified rule 3's unlimited carve-out), and it is satisfied
      here: the pricing page frames free access as a standing, ongoing entry point ('Start free.
      Scale with every site.'; every plan card's own CTA is 'Get started for free', not a
      time-boxed promo), and no document -- across either pass's full-text search of the entire
      help-center corpus -- states an expiry, countdown, or end date for the base free-generation
      capability. The one document that describes deletion, 'What Happens if I Fail to Upgrade My
      Plan Before the Free Trial Ends', is titled and worded entirely around the separate,
      card-gated 7-day Pro TRIAL ('If you don't upgrade before the free trial ends, your website
      will be deleted after the trial expires') -- domain 4's construct, not the base free plan a
      user who never starts a trial occupies. Pass 2's own coder_note already draws this same
      distinction ('describes deletion tied to trial usage specifically, not to the never-trialed
      free path') but then still coded unknown, applying the instrument's general default rather
      than this variable's own stated silence-plus-standing-tier exception. Re-verified live by this
      adjudicator 2026-08-16: source content unchanged. Prior values: pass 1 = perpetual; pass 2 =
      unknown.
  trial_exists: { value: "yes", source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. ToS REFUND section: '1. Free 7-Day Trial: We provide a 7-day free trial* to help you evaluate our services without any charges.'" }
  trial_card_required: { value: "yes", source: "https://help.10web.io/hc/en-us/articles/360021420139-Get-Started-for-Free-on-10Web", evidence: "AGREED by both passes. 'To unlock full editing capabilities, start a 7-day free trial of the Pro version by attaching your credit card.'" }
  trial_length_days: { value: "7", source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. 'We provide a 7-day free trial', stated identically across ToS, the dedicated Refund Policy article, and two other help-center articles." }
  trial_auto_converts: { value: conflicting, source: "https://help.10web.io/hc/en-us/articles/6136064762770-Why-Have-I-Been-Charged", evidence: "AGREED by both passes -- genuinely two (in fact three) equal-authority help-center articles in conflict, per this study's own scope note for this construct. FOR auto-charge: 'Why Have I Been Charged?' ('automatically upgrades to a paid subscription unless cancelled') and 'How to Upgrade to 10Web Pro Plans' ('you will be charged for the chosen platform plan'); also ToS ('your trial will end immediately and you will be upgraded to the paid plan'). AGAINST (deletion, not a charge): 'What Happens if I Fail to Upgrade My Plan Before the Free Trial Ends' ('your website will be deleted after the trial expires'). All docs/help-center class, equal rank; the source hierarchy does not resolve which governs. This is exactly the case where two rank-1 (equal-authority) sources genuinely disagree and conflicting is the designed value, not a failure to choose -- confirmed rather than re-litigated by this adjudicator." }
  credit_system_present: { value: "yes", source: "https://help.10web.io/hc/en-us/articles/22592225897490-AI-Starter-Plan", evidence: "AGREED by both passes. 'The AI Starter plan includes 100 AI credits per month.' Also shown on the pricing page itself ('AI Credits: 100/mo')." }
  credit_unit_defined: { value: "yes", source: "https://help.10web.io/hc/en-us/articles/36411956830738-10Web-AI-Editor", evidence: "AGREED by both passes. 'Each AI request costs 1 credit' ties the credit unit to a recognizable action." }
  credit_to_output_rate_published: { value: partial, source: "https://help.10web.io/hc/en-us/articles/36411956830738-10Web-AI-Editor", evidence: "AGREED by both passes. 'Each AI request costs 1 credit' is stated specifically for AI-chat editing requests inside the post-generation editor; no document states the credit cost of the initial website-GENERATION action (the principal output), and the same doc's 'Regenerate website' action is described with no credit cost at all." }
  credit_rate_location: { value: docs_help_center, source: "https://help.10web.io/hc/en-us/articles/36411956830738-10Web-AI-Editor", evidence: "AGREED by both passes. The '1 credit = 1 AI request' rate appears only in the AI Editor help article; the pricing page states only the monthly credit allowance, never the per-action rate." }
  cost_per_output_unit: { value: other, source: "https://10web.io/pricing-platform/", evidence: "AGREED by both passes. The pricing page frames and prices the product primarily by number of websites (1/2/4 across tiers), with a per-website unit figure on each card ('$10 per website'). No enumerated codebook unit matches; coded other, named 'per_website'." }
  cost_per_output_computable: { value: "yes", source: "https://10web.io/pricing-platform/", evidence: "AGREED by both passes. Entry-tier price ($10.00/mo) and website allowance (1 website) are both directly published, non-credit-mediated figures; the vendor's own card even states '$10 per website' directly." }
  computation_assumptions:
    value: "AI Starter (entry tier), default display state (Business tab / Annually toggle): $10.00/mo includes 1 website, both already on a monthly basis so no period conversion is needed. 10.00 / 1 = 10.00 per website per month, matching the vendor's own card text '$10 per website'. First charge $120.00/yr is the vendor's own stated annual total ('Get 12 months for $120'), not a coder multiplication (it happens to equal 10 x 12). AI Credits (100/mo) are a separate, secondary in-product resource, not the unit this computation uses."
    source: "https://10web.io/pricing-platform/"
    evidence: "PROSE, not a measurement (disagreements.py tag) -- not adjudicated as a disagreement. Both passes independently reached the identical arithmetic (10.00/1=10.00 per website/month) from the same entry-tier price and website allowance; this is a light synthesis of both passes' wording, not a reconciliation of conflicting figures."
  credit_rollover_policy: { value: unknown, source: "https://help.10web.io/hc/en-us/articles/36411956830738-10Web-AI-Editor", evidence: "AGREED by both passes. No document among those read states whether unused AI Credits roll over, expire, or cap-and-expire; both passes searched the help center directly for rollover/expire language near 'credit' and found nothing." }
  failed_generation_charge_policy: { value: unknown, source: "https://help.10web.io/hc/en-us/articles/36411956830738-10Web-AI-Editor", evidence: "AGREED by both passes. No document states whether a failed or errored AI request still consumes its 1 credit." }
  auto_renewal_default: { value: "on", source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. ToS SUBSCRIPTION section: 'Subscription fees are charged/automatically renewed at the beginning of each billing cycle without notifications to you.'" }
  auto_renewal_disclosure_location: { value: multiple, source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. Stated in the ToS (terms class) AND in at least two Zendesk help-center articles ('Why Have I Been Charged?', 'Canceling, Downgrading, or Changing 10Web Subscriptions') -- agreement across two document classes, not found on the pricing page itself." }
  renewal_notice_commitment: { value: no_notice_stated, source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. ToS: 'automatically renewed at the beginning of each billing cycle without notifications to you' governs ongoing renewals. Two narrower, different-purpose notices exist (72-hour notice for fee-AMOUNT changes; 24-hour notice before the FIRST charge/trial conversion) and do not extend to ordinary per-renewal notice; both passes recorded this distinction in coder_note rather than treating it as a conflict." }
  refund_policy_exists: { value: no_refunds_stated, source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. ToS REFUND section: 'At 10Web we do not offer refunds for Platform subscriptions. All payments are final.' ToS ranks first for this contractual variable per protocol 6.2. Conflicts with the pricing page's '30-day money back guarantee' badge and the coupons page's restatement of it; per this study's scope note for this construct, protocol 6.2's authority hierarchy for contractual variables governs over which claim is more prominent, and the hierarchy resolves cleanly to the ToS/dedicated-refund-page position -- see conflict_note." }
  refund_window_days: { value: "0", source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. No refunds are given per the governing (rank-1) sources, coded 0 per the variable's own 'or 0 where no refunds are given' option." }
  refund_conditions: { value: not_applicable, source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. No refund is available under the governing sources, so no qualifying-conditions construct applies." }
  cancellation_self_serve: { value: self_serve_documented, source: "https://help.10web.io/hc/en-us/articles/360027492652-How-Can-I-Cancel-My-10Web-Subscription", evidence: "AGREED by both passes. Complete self-serve procedure documented entirely within the dashboard/account settings; both passes note a ToS carve-out ('In some cases... we may ask You to contact us to cancel') but treat it as a documented caveat on the general self-serve rule, not a second equal-authority source stating a different rule." }
  refund_policy_location:
    value: multiple
    source: "https://10web.io/legal/terms-of-service/ | https://help.10web.io/hc/en-us/articles/360027773851-10Web-s-Refund-Policy"
    evidence: >-
      DISPUTED, resolved by rule -- and reached a value neither pass's own REASONING supports,
      though it matches pass 1's coded value. This variable's decision rule is explicit: 'multiple
      is for agreement across two or more classes.' Pass 2 correctly identified that test (rejecting
      pass 1's broader 'any class that mentions refunds counts, agreeing or not' reading, under
      which the conflicting pricing-page/coupons claims would wrongly count as additional
      locations) but applied it to an incomplete source set: pass 2's sources never include 10Web's
      dedicated 'Refund Policy' Zendesk article (360027773851), a page solely about refunds --
      tied at rank 1 with the ToS for contractual variables under protocol 6.2 -- which
      independently states '10Web does not offer refunds', the SAME governing position as the ToS
      REFUND section, quoted in pass 1's own record and re-verified unchanged by this adjudicator
      live on 2026-08-16. Two different, equal-rank classes (terms and dedicated_refund_page)
      therefore DO agree with each other on the governing position, which is exactly what
      'agreement across two or more classes' requires. The pricing page and the coupons page state
      a DIFFERENT, conflicting, lower-rank position (30-day money back) and correctly do not count
      as agreeing classes under pass 2's own (correct) test -- they remain in conflict_note per
      protocol 6.2's instruction to report a marketing/contract gap even where the hierarchy
      settles the coded value. Prior values: pass 1 = multiple (right value, wrong test -- counted
      disagreeing classes too); pass 2 = terms (right test, incomplete source coverage -- never
      located the dedicated refund-policy article).
  commercial_use_lowest_tier:
    value: unknown
    source: "https://10web.io/legal/terms-of-service/"
    evidence: >-
      DISPUTED, resolved by rule. This variable's definition asks specifically whether documents
      grant 'the right to use outputs commercially' -- a construct the codebook keeps distinct from
      output_ownership_statement ('what the documents say about who holds rights in generated
      outputs', agreed by both passes as user_owns from the same clause). The word 'commercial' does
      not appear anywhere in 10Web's ToS, its Prohibited Use Policy, its pricing page, or (per a
      full-text search of the entire ~836-article help-center corpus, run by pass 1 and
      re-confirmed by this adjudicator) any help-center article, in the sense of a commercial-use
      permission or restriction -- pass 1's own evidence field says as much ('No separate
      "commercial use" restriction... was found anywhere; full-text search for "commercial"...
      returned no tier-gating result'). The only clause either pass found is the general ownership
      disclaimer: 'if you choose to use, publish or display an Output in any manner, it shall be
      considered Your Content. 10Web does not claim any ownership in the Output...' -- 'in any
      manner' modifies HOW the output is used (published, displayed, modified), not FOR WHAT PURPOSE
      (personal versus commercial/business), and the clause never addresses purpose or context of
      use at all. Pass 1 coded free by inferring a commercial-use grant from this ownership-only
      clause, despite its own evidence field documenting that no commercial-specific language
      exists -- exactly the kind of inference the codebook's separate E1/E3 variables are built to
      avoid collapsing into each other. Re-verified live 2026-08-16: ToS content unchanged, still no
      occurrence of 'commercial'. Codebook 2.1 step 2 fails (no document states a determinate
      value for THIS construct); step 4 applies: unknown. Prior values: pass 1 = free; pass 2 =
      unknown.
  watermark_removal_tier: { value: unknown, source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. No document states whether any tier's generated websites carry, or are free of, 10Web branding. Principal output could plainly carry such branding, so not_applicable does not fit; documented silence codes unknown." }
  output_ownership_statement: { value: user_owns, source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. ToS 10WEB AI Builder Service section: '10Web does not claim any ownership in the Output, so long as the Output does not contain 10Web intellectual property.' Content section: 'You retain all the rights to Your Content or intellectual property.' No tier- or subscription-status-dependent qualifier found; the 'so long as...' clause is a standard carve-out excluding 10Web's own platform IP, not a conditional-use trigger of the kind `conditional` is defined for." }
  usage_cap_quantified: { value: all_caps_quantified, source: "https://help.10web.io/hc/en-us/articles/22592225897490-AI-Starter-Plan", evidence: "AGREED by both passes. Every limit documented for the entry tier (AI Starter) carries a number and dimension, with a period where it is a rate: 1 website (standing), 10,000 visitors/month + quantified overage (rate), 10GB storage + quantified overage (standing), 100 AI credits/month (rate). No unquantified or bare-word limit found for this tier." }
  unquantified_limit_clause: { value: absent, source: "https://10web.io/legal/terms-of-service/", evidence: "AGREED by both passes. ToS and the Prohibited Use Policy (incorporated by reference) were both read in full end to end by both passes. No fair-use/reasonable-use/excessive-use discretionary clause conditioning ordinary usage volume was found; the PUP's 'excessive API requests, brute-force attacks' language sits under network-abuse/security prohibitions (conduct, not a volume throttle on legitimate use), and the visitor/storage overage system is explicitly automated and quantified ($2 per unit), not discretionary." }

