conflict_note: |
  FOUR conflicts stand in the record, three carried from the two passes (partly
  re-scoped above) and one newly documented by this adjudication:

  (1) refund_policy_exists / refund_window_days / refund_conditions /
  refund_policy_location -- RESOLVED BY HIERARCHY (protocol 6.2). Rank-1
  contractual sources agree with each other: ToS REFUND section
  (https://10web.io/legal/terms-of-service/) -- "At 10Web we do not offer
  refunds for Platform subscriptions. All payments are final." Dedicated Refund
  Policy article (https://help.10web.io/hc/en-us/articles/360027773851-10Web-s-Refund-Policy)
  -- "10Web does not offer refunds." Against this, two lower-ranked official
  sources state the opposite: the pricing page
  (https://10web.io/pricing-platform/) -- "30-day money back guarantee",
  "Cancel anytime", per-card "The 30-day money-back guarantee applies until you
  claim your free domain."; and https://10web.io/coupons/ -- "every plan
  carries a 30-day money-back guarantee...request a refund within 30 days."
  Per protocol 6.2 and codebook 2.1 step 3, the rank-1 sources govern the coded
  values (no_refunds_stated / 0 / not_applicable), and the same two rank-1
  sources' AGREEMENT with each other is what makes refund_policy_location
  "multiple" (terms + dedicated_refund_page), not "terms" alone. Recorded per
  the rule that a marketing-vs-contract gap is reported even where the hierarchy
  settles the coded value cleanly.

  (2) trial_auto_converts -- UNRESOLVED, coded conflicting (agreed by both
  passes; confirmed on adjudication, not re-opened). "Why Have I Been Charged?"
  (https://help.10web.io/hc/en-us/articles/6136064762770-Why-Have-I-Been-Charged)
  -- "The 7-day free trial automatically upgrades to a paid subscription unless
  cancelled within the trial period." "How to Upgrade to 10Web Pro Plans"
  (https://help.10web.io/hc/en-us/articles/360021395600-How-to-Upgrade-to-10Web-Pro-Plans)
  -- "If you do not cancel when the 7 day free trial expires, you will be
  charged for the chosen platform plan." Against this, "What Happens if I Fail
  to Upgrade My Plan Before the Free Trial Ends?"
  (https://help.10web.io/hc/en-us/articles/360030873012-What-Happens-if-I-Fail-to-Upgrade-My-Plan-Before-the-Free-Trial-Ends)
  -- "If you don't upgrade before the free trial ends, your website will be
  deleted after the trial expires" -- deletion, not a charge. All three
  docs/help-center class (equal rank); hierarchy does not resolve which
  governs.

  (3) free_plan_cap_value (page-count sub-figure) -- UNRESOLVED, coded
  conflicting on adjudication (neither pass's coded value). "Free Plan: How to
  Convert/Recreate a Website With AI" (updated 2025-01-23, not marked outdated;
  https://help.10web.io/hc/en-us/articles/360018862340-Free-Plan-How-to-Convert-Recreate-a-Website-With-AI)
