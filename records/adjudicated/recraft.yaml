  substantive disagreements plus 1 prose disagreement (computation_assumptions) across the 37 coded
  variables. All 11 were resolved by applying the codebook decision rule to the evidence, re-verified
  in every case where a quoted phrase was load-bearing. ZERO were coded unknown: this product's
  disagreements were fully rule-resolvable, so step 5's "documents do not determine the answer"
  finding does not apply here, unlike some other products in this study.

  REGISTER CHECK, done before classifying anything, per instruction. records/pass1/recraft.yaml and
  records/pass2/recraft.yaml both carry `register_events: []` -- empty in both. Per §7.4.1,
  date_explained requires an existing vendor_edit entry in the register; per §7.4.2, variant_explained
  requires two archive snapshots of the same URL showing two display states, with no vendor_edit
  explaining it. Neither classification is reachable for ANY of the 11 disagreements below, because
  neither record supplies the register evidence either classification depends on -- checked first,
  and not reached for on any item even where it might have been tempting (see the external-models
  credit-range note in sources[] above: the raw numbers differ between the two passes' captures of
  the same URL, which looks like it could be a vendor edit, but no register entry documents it, so it
  is disclosed as a transparency note and left unclassified rather than adjudicated into
  date_explained on this adjudicator's own say-so). All 11 disagreements below are ordinary
  disagreements, resolved on the merits.

  DISPOSITION. Two clusters plus one isolated item plus the prose field:
  - REFUND CLUSTER (4 items: refund_policy_exists, refund_window_days, refund_conditions,
    refund_policy_location) -- all cascade from one decision, refund_policy_exists. Adjudicated
    "yes" under codebook rule 3 (jurisdiction-limited statutory right), distinguished from this
    variable's own Vendor Q contrast example by the concreteness of ToS §5.4-5.6 (named
    jurisdictions, a 14-day window, explicit lapse/reduction conditions) against Vendor Q's bare
    "except where required by law". This is the closest call in the record and is written up in full
    in refund_policy_exists's own evidence field, including why `conflicting` does not apply (one
    document's general-rule-plus-exception structure, not two equal-authority sources disagreeing).
  - USAGE-LIMIT CLUSTER (2 items: usage_cap_quantified, unquantified_limit_clause) -- cascade from
    one decision, unquantified_limit_clause, decided the OPPOSITE direction from the refund cluster:
    pass 1's "present" is correct and pass 2's "absent" rested on a keyword search that did not
    include the actual words the ToS uses ("impose limits", "restrict ... access"). Verified by three
    independent live re-fetches of the ToS on 2026-08-16, confirming pass 1's quotation verbatim.
    This is the one place in this record where a prior coder's value is simply wrong against the
    primary source, not a case of two defensible readings.
  - THREE INDEPENDENT ITEMS, each verified by live re-fetch of ToS §5.2 / §5 respectively on
    2026-08-16: failed_generation_charge_policy (pass 2's "charged" confirmed verbatim, pass 1's
    "unknown" reflects a search that did not reach the ToS on this question) and
    renewal_notice_commitment (pass 2's "advance_notice_stated" confirmed verbatim, pass 1's
    "no_notice_stated" reflects the same kind of gap). free_plan_cap_documented is independent of the
    ToS entirely -- resolved from the pricing page's own text plus codebook section 5.1's own worked
    example (Vendor G), pass 2's "some_quantified" correct.
  - CREDIT-RATE PAIR (credit_rate_location, disputed; credit_to_output_rate_published and
    cost_per_output_computable, NOT disputed but flagged in this adjudication's brief because this
    vendor meters in credits and publishes rates as ranges). All three were checked against the
    codebook's specific range rules (credit_to_output_rate_published rule 3; cost_per_output_computable
    rule 8) rather than against what "seems reasonable": a rate published only as a range (Recraft's
    actual pattern -- pricing-page tooltip "usually 1-2 credits"; external-model provider ranges) is
    explicitly `partial`, not `no` and not `unknown`, on the codebook's own worked example ("3 to 12
    credits depending on complexity ... partial"). Both passes already had the categorical values
    right (partial / partial); credit_rate_location=multiple is adjudicated because pass 1 never
    found the pricing page's own embedded tooltip data (deviations-for-coders.md directs checking a
    page's embedded JSON payload, and pass 2's dated local capture of that payload was independently
