variables:
  headline_price_usd:
    value: 10.00
    source: https://www.recraft.ai/pricing
    evidence: >-
      Basic (entry tier) card: "$10 / per month" under the annual-preselected default state. Both
      passes agree.

  headline_billing_basis:
    value: per_month_billed_annually
    source: https://www.recraft.ai/pricing
    evidence: >-
      "$10 per month" with "billed annually $120" printed beneath it, under the default annual
      toggle state. Both passes agree.

  first_charge_amount_usd:
    value: 120.00
    source: https://www.recraft.ai/pricing
    evidence: >-
      "billed annually $120" is printed directly on the Basic card as the vendor's own annual
      total -- read directly, not computed (10 x 12 = 120 happens to match). Both passes confirmed
      this in a second representation (screenshot / DOM text-node query) independently. Both passes
      agree.

  mandatory_addon_present:
    value: "no"
    source: https://www.recraft.ai/pricing
    evidence: >-
      Basic's advertised feature list carries no required further charge; "Credit top-ups" are
      documented elsewhere (docs/plans-and-billing/credits) as an optional, separately-purchased
      add-on, not a requirement to use the plan as advertised. VAT-exclusivity note is a tax, not an
      add-on (rule 3). Both passes agree.

  annual_condition_disclosure:
    value: adjacent
    source: https://www.recraft.ai/pricing
    evidence: >-
      "billed annually $120" sits inside the same plan-card price block as the "$10 per month"
      headline figure. Both passes agree.

  annual_default_toggle:
    value: annual_preselected
    source: https://www.recraft.ai/pricing
    evidence: >-
      Toggle loads with "Pay annually (save 20%)" active (DOM aria-checked/data-state per pass 1;
      toggle-thumb position and bold/purple label per pass 2's screenshot) before any interaction, on
      both dates. Both passes agree.

  free_plan_exists:
    value: "yes"
    source: https://www.recraft.ai/pricing
    evidence: >-
      Standing "Free" card at "$0", "Limited free credits", alongside the paid tiers, no expiry
      stated. Both passes agree.

  free_plan_cap_documented:
    value: some_quantified
    source: https://www.recraft.ai/pricing
    evidence: >-
      ADJUDICATED. Pass 1: all_quantified. Pass 2: some_quantified. Both passes captured
      byte-identical free-plan text (verified directly by this adjudicator against both passes' raw
      captures), so this is a rule-application disagreement, not a factual one. Resolved by codebook
      section 5.1 plus the free_plan_cap_documented decision rule's own worked example: "Vendor G's
      free plan states '10 images per month', '1 seat', and 'limited resolution' ... some_quantified"
      -- Recraft's Free card is the same pattern. The card shows "$0 / Limited free credits" as its
      own headline allowance line -- structurally the SAME position the paid tiers use for their
      quantified "1,000 credits per month" line (both are the plan's stated credit allowance) -- and
      "Limited free credits" carries no number. Section 5.1 is explicit that "limited" is one of the
      words that "never qualify, whatever the limit type." This is a DISTINCT, unquantified limit
      statement, additional to and not subsumed by the three specific bulleted caps ("3 generations
      per style per day", "3 image uploads daily", "Up to 2 images per generation"), which ARE
      quantified. At least one quantified + at least one not quantified = some_quantified. Pass 1's
      all_quantified did not tally the credits headline as a limit in its own right; both passes DO
      treat the parallel "N credits per month" line as its own tallied item on the sibling variable
      usage_cap_quantified for the paid tier, which is the consistent treatment applied here.

  free_plan_cap_value:
    value: 3 generations per style per day | 3 image uploads per day | 2 images per generation
    source: https://www.recraft.ai/pricing
    evidence: >-
      Verbatim bullet list under the Free plan card; identical in both passes' captures. Records
      only the quantified limits per this variable's own rule -- "Limited free credits" is correctly
      excluded here even though it is tallied as an unquantified item in free_plan_cap_documented
      above; the two variables measure different things. Both passes agree on this value.

  free_plan_watermark:
    value: unknown
    source: https://www.recraft.ai/pricing
    evidence: >-
      No watermark/branding statement for free-tier outputs specifically in the pricing page, free-
      plan docs, or terms, in either pass's reading. Both passes agree.

  free_plan_duration:
    value: perpetual
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      "Free Tier" is an ongoing membership status alongside paid subscriptions; no expiry stated in
      any document either pass read. Both passes agree.

  trial_exists:
    value: "no"
    source: https://www.recraft.ai/pricing
    evidence: >-
      No trial mentioned in the pricing page, terms, or billing/credits docs; pass 2 additionally
      confirms the ToS's only use of "trial" is in the arbitration clause ("a trial attorney..."),
      unrelated to product trials. Both passes agree.

  trial_card_required:
    value: not_applicable
    source: not_applicable
    evidence: "No trial exists (trial_exists = \"no\"). Both passes agree."

  trial_length_days:
    value: not_applicable
    source: not_applicable
    evidence: "No trial exists (trial_exists = \"no\"). Both passes agree."

  trial_auto_converts:
    value: not_applicable
    source: not_applicable
    evidence: "No trial exists (trial_exists = \"no\"). Both passes agree."

  credit_system_present:
    value: "yes"
    source: https://www.recraft.ai/docs/plans-and-billing/credits
    evidence: >-
      Plans are denominated in an intermediate "credits" unit that converts into generations at a
      per-model rate, rather than the allowance being stated directly in output units. Both passes
      agree.

  credit_unit_defined:
    value: "yes"
    source: https://www.recraft.ai/docs/plans-and-billing/credits
    evidence: >-
      The docs operation table ties credits to named outputs (e.g. "Remove background | 1",
      "Vectorization | 1", "Generate a mockup | 2"), and the pricing page's own embedded tooltip
      separately ties the unit to image generation generically ("usually worth 1-2 credits"). Either
      source alone satisfies this variable's "yes where ANY official document converts credits into
      ANY output unit" rule. Both passes agree on the coded value.

  credit_to_output_rate_published:
    value: partial
    source: https://www.recraft.ai/docs/recraft-models/external-models
    evidence: >-
      Not disputed (both passes coded partial) but flagged for adjudicator attention per this
      product's credit-metering-in-ranges profile; independently re-verified against codebook rule 3
      ("a rate published as a range ... with no rule for which applies, is partial") and confirmed
      correct. The principal output (image) has a published rate on the live pricing page itself
      (creditsTooltip: "usually worth 1-2 credits") and on the docs external-models table
      (per-provider ranges, e.g. "2-24 credits", "1-18 credits"), in both cases a range with no
      stated rule for resolving within it beyond "shown in the interface when you select it" --
      structurally identical to the codebook's own worked example ("3 to 12 credits depending on
      complexity ... partial"). Both passes agree on the value; this adjudicator confirms it is the
      rule-correct value, not merely the agreed one.

  credit_rate_location:
    value: multiple
    source: https://www.recraft.ai/pricing
    evidence: >-
      ADJUDICATED. Pass 1: docs_help_center. Pass 2: multiple. Pass 1 did not open the pricing page's
      embedded __NEXT_DATA__ payload and coded from the docs table alone. Pass 2 found and this
      adjudicator independently re-read (in pass 2's own dated local capture,
      records/pass2/recraft-sources/pricing-page-rendered-2026-08-15.txt, line 144) the pricing
      page's own shipped tooltip string, "subscriptions.features.creditsTooltip = 'Generation or
      modification of an image is usually worth 1-2 credits'". Checking a page's embedded JSON
      payload as well as its rendered text is affirmatively directed by deviations-for-coders.md
      ("Check the page's embedded JSON payload as well as its rendered text. Prices and plan data
      routinely live in a payload that never becomes visible text."), so this is in-bounds
      documentary evidence, not fabrication. With a rate published on the live pricing page itself
      AND on the docs pages (credits table + external-models table), the rate "appears in more than
      one document class" -- this variable's own rule for `multiple`. Pass 1's docs_help_center
      reflects an incomplete search, not a different but defensible reading of the same evidence.

  cost_per_output_unit:
    value: per_image
    source: https://www.recraft.ai/pricing
    evidence: >-
      Category is AI image generator; the entry tier (Basic) offers image generation/editing only
      (video generation is a Pro/Teams addition). Both passes agree.

  cost_per_output_computable:
    value: partial
    source: https://www.recraft.ai/docs/recraft-models/external-models
    evidence: >-
      Not disputed (both passes coded partial) but flagged for adjudicator attention alongside
      credit_to_output_rate_published, for the same reason. Re-verified against codebook rule 8 ("if
      it yields a range because the vendor publishes a range, code partial") and confirmed correct:
      price ($10/mo) and allowance (1,000 credits/mo) are published for the entry tier, but the
      credit-to-image rate is published only as a range (native "usually 1-2 credits" per the
      pricing-page tooltip; wider ranges for external models), so the calculation yields a range
      ($0.01-$0.02/image for native models) rather than one figure. See computation_assumptions for
      which of the two possible partial-justifying readings (rule 5, secondary-output-only, vs rule
      8, range) governs -- both passes agree on the value "partial" but their computation_assumptions
      prose rests on different readings, which is adjudicated below as the prose disagreement.

  computation_assumptions:
    value: >-
      Basic (entry), annual display: $10/mo = $120/yr, 1,000 credits/mo, same period (no conversion
      needed). Pricing-page tooltip: native image gen "usually 1-2 credits" -> $10/1000=$0.01/credit
      -> $0.01-$0.02/image. Range, not a single figure; external-model rates range wider still.
    source: https://www.recraft.ai/pricing
    evidence: >-
      ADJUDICATED (prose, protocol 7.4 / tools/disagreements.py PROSE set -- "the arithmetic itself
      may still need reconciling"). cost_per_output_computable=partial is undisputed, but the two
      prose accounts rest on different, non-equivalent readings of which codebook clause makes it
      partial. Pass 1's reading applies rule 5 (secondary-output-only): the docs credits table gives
      "Generate image from prompt | 1* equals the model price (see Recraft Studio)" with the
      multiplier unresolved on that page, so pass 1 treated the principal output as wholly
      uncomputed and fell back to a SECONDARY output (mockup, 2 credits flat, $0.02/mockup) as the
      only computable figure. Pass 2's reading applies rule 8 (range): the pricing page's own
      embedded tooltip (creditsTooltip, confirmed above under credit_rate_location) states a range
      for the PRINCIPAL output itself, "usually worth 1-2 credits", yielding $0.01-$0.02/image.
      Both passes accurately read their own source; the disagreement is which official document
      governs. credit_to_output_rate_published and credit_rate_location are pricing variables, and
      protocol 6.2 ranks the live pricing page first, documentation second, for that class -- the
      tooltip (on the pricing page) outranks the docs table's unresolved cross-reference. The range
      reading therefore governs, per codebook section 8's derived-variable rule: "in the range case
      the range goes in coder_note; in the secondary-output case there is no range to record ... A
      range is recorded only in the range case, since a secondary-output figure is a single number
      for the wrong output rather than a spread for the right one, and publishing it as this
      product's cost per output would misstate what was computed." The adjudicated value states the
      range, not the mockup figure. Pass 1's mockup finding is genuine and is preserved in coder_note
      as corroborating evidence of the docs table's own unresolved "(see Recraft Studio)" reference,
      not discarded -- it is simply not what cost_per_output_value_usd should be built from once the
      range on the higher-ranked source is accounted for. Neither pass fabricated or misread its own
      source; this is a source-hierarchy application, not a correction of an error.

  credit_rollover_policy:
    value: expires_at_period_end
    source: https://www.recraft.ai/pricing
    evidence: >-
      "Subscription credits are included in your plan and reset at the start of each billing cycle
      -- unused credits don't roll over." (Separately, purchased top-up credits never expire -- a
      different pool from the one this variable measures.) Both passes agree.

  failed_generation_charge_policy:
    value: charged
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      ADJUDICATED. Pass 1: unknown (read the credits docs page and pricing FAQ in full, found neither
      addressed failure; did not check the ToS for this specific question). Pass 2: charged, citing
      ToS Section 5.2. This adjudicator independently re-fetched Section 5.2 live on 2026-08-16 and
      confirmed the quotation verbatim: "Credits are deducted at the then-current rate for each
      chargeable operation performed, including each generation of an Asset..." and "Credits already
      consumed are not returned, including where the request does not complete or the output does
      not meet your expectations." This directly and unambiguously states that a failed/non-completing
      generation still consumes credits. Pass 1's unknown reflects a document search that did not
      reach the ToS on this question, not genuine vendor silence -- the documents are not silent.

  auto_renewal_default:
    value: "on"
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      Section 5: "You can sign up for a monthly subscription ... that will automatically renew on a
      monthly basis, or for a yearly subscription ... that will automatically renew on a yearly
      basis." Both passes agree; verbatim confirmed live 2026-08-16.

  auto_renewal_disclosure_location:
    value: multiple
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      Stated in the terms (Section 5, "will automatically renew") and in the billing docs help
      article ("your plan will renew on a monthly basis" after a cycle-switch walkthrough), in
      agreement. The pricing-page FAQ never uses the word "renew". Both passes agree.

  renewal_notice_commitment:
    value: advance_notice_stated
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      ADJUDICATED. Pass 1: no_notice_stated (found only the price-change notice clause). Pass 2:
      advance_notice_stated, citing an additional sentence in Section 5. This adjudicator
      independently re-fetched the full text of Section 5 live on 2026-08-16 and confirmed the
      sentence verbatim, immediately following the price-change clause: "Recraft will comply with
      minimum annual subscription notice requirements where applicable, providing notice to the
      email address associated with your account before the given automatic renewal date." This is a
      stated commitment to notice before an automatic renewal, distinct from the price-change notice
      clause both passes found. Pass 1's no_notice_stated reflects an incomplete read of Section 5,
      not a different defensible reading of the same sentence -- pass 1's own record does not quote
      or reference this sentence at all.

  refund_policy_exists:
    value: "yes"
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      ADJUDICATED, the closest call in this record. Pass 1: no_refunds_stated (Section 5's general
      cancellation clause, "you will not receive a refund or credit for any amounts that have already
      been billed or paid", ranks first for contractual variables and states no exception). Pass 2:
      yes, citing Section 5.4-5.6's EU/EEA/UK 14-day withdrawal right plus a discretionary policy in
      the pricing FAQ/billing docs. This adjudicator independently re-fetched Sections 5, 5.4, 5.5,
      5.6 and 14 live on 2026-08-16 and confirmed every quotation verbatim, including the general
      non-refundable statements in Section 5 ("you will not receive a refund...") and Section 14
      ("Any Fees paid hereunder are non-refundable") that pass 1 relied on. Both a general
      non-refundable default AND a concrete statutory carve-out are genuinely, simultaneously stated
      in the SAME document. Decided by rule 3: "A statutory right mentioned for one jurisdiction
      only ... is coded yes with the restriction recorded in coder_note" -- distinguished from this
      variable's own contrasting worked example (Vendor Q, "non-refundable except where required by
      law" -> no_refunds_stated) by concreteness. Vendor Q's clause is a bare legal hedge with no
      elaboration anywhere in the example: it tells a buyer nothing determinate. Recraft's Section
      5.4-5.6 is the opposite -- three dedicated subsections naming the jurisdictions (EU/EEA/UK), a
      specific window (14 calendar days), and the exact conditions under which the right lapses
      (express consent to instant credit allocation) or reduces (proportional refund for unused
      credits). An EU/EEA/UK buyer can determine her refund position from this document before
      paying, which is precisely what this variable measures and precisely what distinguishes rule 3
      from the Vendor Q example. A general default coexisting with the carve-out does not defeat rule
      3 -- if it did, rule 3 would have virtually no application, since an EU-law-driven withdrawal
      right coexisting with a general non-refundable default is the standard, not the exception, for
      vendors selling into the EU. `conflicting` does not apply: this is one document's own
      general-rule-plus-specific-exception structure, not two sources of equal authority disagreeing.
      Restriction recorded in coder_note per rule 3.

  refund_window_days:
    value: 14
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      Follows from refund_policy_exists = yes. Section 5.4: "You have the right to withdraw from a
      new paid subscription contract without giving any reason within fourteen (14) calendar days of
      the date of your purchase" -- confirmed verbatim live 2026-08-16. The only concrete day-count
      figure stated anywhere in the documents; applies to EU/EEA/UK new-subscription purchases only
      (Section 5.4: "This right applies only to new subscription contracts and not to subsequent
      automatic renewals"). The general-population discretionary policy (pricing FAQ/billing docs)
      states no fixed window, only a 30-day-since-payment eligibility test -- recorded in coder_note,
      not coded here as a second window.

  refund_conditions:
    value: conditional
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      Follows from refund_policy_exists = yes. Section 5.5 (confirmed verbatim live 2026-08-16): the
      EU withdrawal right lapses entirely on express checkout consent to instant credit allocation,
      and reduces to "a proportional refund in respect of any unused credits" where some but not all
      credits were used without that consent. Separately, the general discretionary policy requires
      payment within the past 30 days AND fewer than 30 lifetime credits used, and is granted "at our
      discretion". Both are usage-threshold / approval-step conditions under this variable's
      definition.

  cancellation_self_serve:
    value: self_serve_documented
    source: https://www.recraft.ai/pricing
    evidence: >-
      "Click your profile in the upper right and select 'Manage subscription' -- Click 'Cancel plan'
      and confirm." Both passes agree.

  refund_policy_location:
    value: multiple
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      Follows from refund_policy_exists = yes. The refund position is stated in three document
      classes -- the terms (Section 5 general position, 5.4-5.6 EU carve-out, 14 non-refundable
      restatement), the pricing-page FAQ ("Can I get a refund?"), and the billing docs help-center
      page -- and, on the adjudicated reading above, all three are addressing one coherent overall
      policy (default non-refundable, with a statutory and a discretionary exception) rather than
      contradicting each other, which is this variable's own test for `multiple` ("agreement across
      two or more classes") rather than `conflicting`.

  commercial_use_lowest_tier:
    value: lowest_paid
    source: https://www.recraft.ai/pricing
    evidence: >-
      Basic tier feature list: "Commercial rights and private generations"; Free tier: "No commercial
      use". Corroborated by the ownership-and-commercial-use-faq blog post pass 2 read. Both passes
      agree.

  watermark_removal_tier:
    value: unknown
    source: https://www.recraft.ai/pricing
    evidence: >-
      No document either pass read (pricing page, free-plan docs, terms, commercial-use FAQ) states a
      tier-differentiated watermark position; ToS Section 8.2 describes a general capability to embed
      watermarks/metadata, not a per-tier rule. Both passes agree.

  output_ownership_statement:
    value: conditional
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      Section 7.1 (Free Tier): Recraft owns free-tier assets. Section 7.2 (Paid Subscription): "You
      own all Assets you create with the Services..." Rights depend on which tier generated the
      asset. Both passes agree.

  usage_cap_quantified:
    value: some_quantified
    source: https://www.recraft.ai/pricing
    evidence: >-
      ADJUDICATED, follows directly from unquantified_limit_clause below. Pass 1: some_quantified.
      Pass 2: all_caps_quantified, premised on unquantified_limit_clause = absent. Basic tier limits:
      "1,000 credits per month" (quantified rate), "Up to 4 images per generation" and "Up to 5
      parallel generations" (quantified standing limits) -- both passes agree these three are
      quantified. "Unlimited image uploads" and "Unlimited styles usage" turn on rule 3: unlimited
      counts as quantified ONLY where no clause elsewhere qualifies it. Since this adjudicator
      confirms below that a qualifying discretionary-limits clause IS present in the ToS (contrary to
      pass 2's search), the two "Unlimited" claims are NOT quantified. At least one quantified (three
      items) + at least one not quantified (two items) = some_quantified. Pass 1's value is correct;
      pass 2's all_caps_quantified inherits the same search gap as its unquantified_limit_clause=absent.

  unquantified_limit_clause:
    value: present
    source: https://www.recraft.ai/legal/terms
    evidence: >-
      ADJUDICATED. Pass 1: present, quoting ToS Section 1: "We may also impose limits on certain
      features and services or restrict your access to parts or all of the Services without notice or
      liability." Pass 2: absent, stating a full-text search for the keywords "fair use", "reasonable
      use", "throttle"/"throttling", "discretion", "abuse", "excessive", "unlimited", and "rate limit"
      found no discretionary usage-limiting clause. This adjudicator independently re-fetched the live
      ToS on 2026-08-16 and confirmed pass 1's quotation verbatim, in Section 1, word for word,
      including the capitalization the source renders it in. The clause is a genuine, present,
      unquantified, vendor-discretion usage-limiting clause squarely matching this variable's
      `present` definition. Pass 2's search methodology, by its own stated word list, could not have
      found this clause: it contains none of the eight searched terms ("impose limits" and "restrict
      ... access" were not among them). This is a search-completeness gap in pass 2, not a genuine
      rule-application disagreement and not a vendor edit -- neither record's register_events carries
      a vendor_edit entry for this document, so date_explained is not reachable regardless (protocol
      7.4.1), and there is in any case no reason to think the clause was added between the two
      collection dates: it reads identically on pass 1's 2026-08-10 capture and this adjudicator's
      2026-08-16 live re-check, five and eleven days apart respectively from pass 2's 2026-08-15 read
      that missed it.

coder_note: |
