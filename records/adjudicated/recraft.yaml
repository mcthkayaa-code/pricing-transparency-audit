conflict_note: >-
  Refund framing: the pricing-page FAQ and billing docs present refunds in a discretionary-but-
  available frame ("We may offer a refund at our discretion where..."), while the Terms of Service
  states a general non-refundable default (§5: no refund on ordinary cancellation; §14: "Any Fees
  paid hereunder are non-refundable"). Adjudicated as complementary rather than contradictory: the
  ToS's own §5.4-5.6 EU/EEA/UK statutory carve-out and the FAQ/billing-docs discretionary policy are
  both stated exceptions to one coherent general-default-plus-exceptions policy, not two sources
  disagreeing about one fact -- see refund_policy_exists's evidence field for the full reasoning.
  Both URLs: https://www.recraft.ai/legal/terms ; https://www.recraft.ai/pricing (FAQ) ;
  https://www.recraft.ai/docs/plans-and-billing/billing.
