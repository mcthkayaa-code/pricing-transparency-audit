  auto_renewal_disclosure_location: { value: multiple, source: "https://copyleaks.com/termsofuse", evidence: "Stated in ToS §14.1 and, in agreement, in the pricing-page FAQ (\"All plans renew automatically unless canceled before the next billing cycle\"). Agreed both passes." }

  renewal_notice_commitment:
    value: unknown
    source: "https://copyleaks.com/termsofuse"
    evidence: >
      RESOLVED to unknown (disputed: pass1=unknown, pass2=no_notice_stated). Kind:
      vendor_silence. ToS §14 read in full: §14.1's 14-day notice period runs FROM
      the buyer TO Copyleaks (the opt-out-of-renewal obligation), not a vendor
