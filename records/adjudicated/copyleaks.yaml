  usage_cap_quantified: { value: all_caps_quantified, source: "https://copyleaks.com/pricing", evidence: "The only limit the documents attach to Personal is the credit allowance — \"1,200 unified credits: Scan up to 300,000 words OR 1,200 images\" — a number, a dimension, and (per the pricing FAQ's \"monthly credit allowance\" / \"resets at the start of each new billing cycle\") a period. No unlimited claim is made for Personal. Agreed both passes." }

  unquantified_limit_clause:
    value: present
    source: "https://copyleaks.com/termsofuse"
    evidence: >
      RESOLVED to present (disputed: pass1=present, pass2=absent). ToS §5
      ("RESTRICTIONS") (vi) prohibits using the Services "in a manner that
      overburdens, or that threatens the integrity, performance, or availability
      of, our Services" — a usage-intensity standard carrying no number, matching
      the value's own "excessive use"/"abuse thresholds" family, and not a
      conduct/content prohibition (rule 3's carve-out is for illegal or abusive
      CONTENT, not volume/intensity of use). Pass 2's absent rests on a full-text
      keyword sweep that never included "overburden"/"overburdens" (its swept list:
      fair use, throttle, discretion, abnormal, unusual, excessive, abuse,
      irregular, reasonable/typical/normal use, rate limit, overload) — a search
      gap, not a reading of the clause, and exactly the failure mode this study has
      flagged before (a clause present under different words than the search used).
      Pass 2's own capture independently corroborates that §5 exists, is titled
      "Restrictions," and contains a separate "sole discretion" enforcement phrase
      in the same section — consistent with pass 1's account of a multi-clause §5
      whose sub-item (vi) is the one this variable turns on. See coder_note.

coder_note: |
  2026-08-17 ADJUDICATION SUMMARY. tools/disagreements.py copyleaks reported 4
  substantive disagreements plus 1 prose field. All 4 resolved by applying the
  codebook's own decision rule to the evidence (protocol §7.4 step 3) — none by
  majority, and none left as a tie-break. 2 resolved to a determinate value:
  cost_per_output_unit -> per_1k_words (rule 1, whole-page framing) and
  unquantified_limit_clause -> present (the value's own definition applied to ToS
  §5(vi), which pass 2's keyword sweep did not search for). 2 resolved to unknown,
  both kind vendor_silence: failed_generation_charge_policy (the product's own
  documents are silent; pass 2's source addresses a different, separately-priced
  product) and renewal_notice_commitment (silence under the codebook's general
  decision tree, since the variable's own rule never defines no_notice_stated's
  trigger, and no document affirmatively denies giving notice). The prose field,
  computation_assumptions, is resolved together with cost_per_output_unit: both
  turn on the same underlying credit-cadence question, resolved toward the monthly
  reading (see that field's evidence for the full chain).

  REGISTER EVENTS / §7.4.7-7.4.8 CHECK. Pass 1 logged none. Pass 2 logged one
  display_variant (a pricing-page first-fold cookie-gated A/B test, control vs
  treatment). Per §7.4.1 a display_variant entry never supplies date_explained,
  and neither pass logged a vendor_edit entry, so date_explained is unavailable to
  all 4 disagreements regardless. Checked for variant_explained (§7.4.2) as well:
  pass 2's own investigation (same-origin-fetching the treatment fragment) found
  both arms carry IDENTICAL headline price, billing basis, and credit allowances,
  differing only in marketing layout (a strikethrough anchor price) and one
  plan-metadata label ("1 seat" spelled out for Personal in the treatment only).
  None of that touches credit cadence, ToS clauses, or the API-vs-Personal/Pro
  documentation question the 4 disputed variables actually turn on, so none of the
  4 qualifies as variant_explained either. All 4 are ordinary disagreements,
  resolved (or left unknown) on the documents.

  CITATION VERIFICATION. Both copyleaks.com (Cloudflare) and web.archive.org
  (systemic 503s confirmed against its own homepage and an unrelated long-stable
  capture, not just the URLs cited here) were unreachable for direct re-verification
  throughout this adjudication session. Where I could not fetch a citation live, I
  used the corpus's own prior mechanical check instead of taking either pass on
  faith: orchestrator/archive-verification.csv (written 2026-08-17, the same day,
  before the outage) shows pass 1's ToS archive URL
  (web/20260807015006/.../termsofuse) verified "ok" — served the cited timestamp
  exactly, not a redirect to a different capture. Pass 1's help-center archive URL
  is logged "throttled" (503), i.e. not yet answered either way, not missing. No
  citation in either record for this product was found to point at a capture that
  does not exist.

  cost_per_output_unit / computation_assumptions, additional detail beyond each
  field's own evidence: the toggle-invariance argument (same "1,200 unified
  credits" figure shown under both Yearly and Monthly display, and ToS §8.3 fixes
  Monthly billing unambiguously at 1,200/month, so the identically-displayed
  Yearly-toggle figure should carry the same period) and pass 1's own
  self-contradiction (credit_rollover_policy = expires_at_period_end, an AGREED,
  undisputed value, rests on a Help Center statement illustrated with a one-month
  example, which is incompatible with pass 1's own annual-pool computation basis)
  were both found independently during this adjudication, not copied from either
  pass. Pass 2's conflict_note had already flagged the underlying pricing-page-vs-
  ToS tension and reasoned to the monthly reading before this adjudication reached
  it; that independent, pre-existing analysis is additional support, not the basis
  the resolution rests on.

  failed_generation_charge_policy: confirmed via WebSearch (discovery aid only, not
  a coding source) that api.copyleaks.com carries its own, separate "/pricing"
  page distinct from copyleaks.com/pricing, supporting the reading that the API is
  a separately-priced product line rather than simply a developer wrapper around
  the same Personal/Pro credit ledger.

  ENTRY-TIER SELECTION (sampling-rules §7.2, agreed both passes): eligible
  candidates were Personal ($13.99/mo billed annually = $167.88/yr
  annual-equivalent, WINNER) and Pro ($74.99/mo billed annually = $899.88/yr).
  Enterprise and Education are not eligible candidates (sales-gated, no published
  price; Education additionally restricted to institutions).

  TOOLING/CODEBOOK GAPS SURFACED BY THIS ADJUDICATION, for the study's attention:
  (1) `renewal_notice_commitment`'s decision rule never states what triggers
  `no_notice_stated` — only `advance_notice_stated` and `conflicting` are defined —
  which plausibly caused this disagreement by itself; the codebook should either
  state the affirmative-statement requirement explicitly (as D3 does for
  no_refunds_stated) or state that mere silence qualifies, so two careful coders
  stop landing on opposite values without knowing which reading is intended. (2)
  The `computation_assumptions` 300-character cap is confirmed unenforced by any
  tool: pass 1's own text on this product is 920 characters (over 3x budget), not
  the 416-character overrun already on file elsewhere in the study — a second,
  worse instance of the same gap. (3) Domain 6 (`cost_per_output_unit` /
  `cost_per_output_computable`) is worded and exampled entirely around generative
  products (video/image/audio minutes) plus one flat-rate seat case; it has no
  worked example for a detection/analysis product whose credits meter INPUT
  scanned rather than output generated, and whose two scannable input types share
  one fungible credit. That gap is plausibly why two careful coders read the same
  allowance line to opposite conclusions (other vs. per_1k_words); a worked example
  for this shape of product would remove the ambiguity for future coders. (4) The
  source-hierarchy rule (protocol §6.2) ranks "official product documentation"
  without an explicit test for whether a document actually pertains to the SPECIFIC
  product/tier being coded when a vendor runs multiple, separately-priced product
  lines (here: consumer web app vs. developer API) — worth a stated rule, since any
  vendor with both a consumer product and a developer API can raise the same
  question.

  blindness: this record is the third (adjudication) pass under protocol §7.4 and
  is expressly NOT blind — it reads both prior records and both source sets, per
  its own procedure. No other product's record, no review page, and no other
  restricted material (orchestrator/adjudication-queue.md,
  orchestrator/interim-signals.md, orchestrator/deviations-log.md, another
  product's adjudicated record) was opened; deviations-for-adjudicators.md was
  read as directed.

conflict_note: >
  (1) Credit-cycle framing tension, load-bearing for this record's
  cost_per_output_unit/computation_assumptions resolution: the pricing-page FAQ
  ("a monthly credit allowance", "your monthly scan limit", "resets at the start
  of each new billing cycle") and a Help Center article ("credits expire at the
  end of each billing cycle", worked with a 1-month example) both describe a
