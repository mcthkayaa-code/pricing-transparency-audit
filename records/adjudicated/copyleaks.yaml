      defines only advance_notice_stated's trigger and conflicting; it never states
      what triggers no_notice_stated. By analogy to no_refunds_stated (domain 10,
      D3 rule 2), which the codebook explicitly requires an affirmative vendor
      statement for ("a buyer who reads 'all sales are final' knows exactly where
      they stand") and treats mere silence as unknown, no_notice_stated should
      likewise require an affirmative "no notice will be given"-type statement, not
      silence. No document makes that statement — including on pass 2's own
      evidence, which describes a search that found "no such commitment ... in the
      document," i.e. silence, not a denial. Falling through the variable's own
      rule to the general decision tree (codebook §2.1 step 4), the value is
      unknown. See coder_note.

