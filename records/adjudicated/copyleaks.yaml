  cost_per_output_unit:
    value: per_1k_words
    source: "https://copyleaks.com/pricing"
    evidence: >
      RESOLVED (disputed: pass1=other, pass2=per_1k_words). Domain-6 rule 1 — "the
      principal output is what the product is sold to produce, as its own pricing
      page frames it" — applied to the WHOLE page's framing, not only the entry
      tier's allowance line. Signals on the pricing page itself, none of them the
      allowance line: the Personal card tags image detection "NEW!" (text detection
      is the established, undifferentiated capability); the "What are my plan
      options?" FAQ states both plans give "full access to our AI detection and
      plagiarism detection features for text scanning and AI detection for image
      scanning" — text scanning carries two detection types, image scanning only
      one; "Plagiarism detection in 100+ languages" is inherently text-only. Words
      is the fuller, established output, and the vendor quantifies it precisely
      (300,000 / 25,000 / 3,000,000 words), so per_1k_words fits per rule 3 ("where
      none of the listed units fits, code other" — one does fit here). Pass 1's
      other rested on the allowance line's "OR" framing alone ("1,200 unified
      credits: Scan up to 300,000 words OR 1,200 images"), which is a domain-5
      credit-fungibility fact and does not by itself settle the domain-6 question
      of which output the page frames as principal.

  cost_per_output_computable: { value: "yes", source: "https://copyleaks.com/pricing", evidence: "Price, credit allowance, and credit-to-word rate are all published; no usage assumption is required. Agreed both passes (both also agree on the categorical value; only the arithmetic basis feeding computation_assumptions was disputed, resolved below)." }

  computation_assumptions:
    value: >
      Personal (entry tier), $13.99/mo, default annual-billed display (already
      monthly, no conversion). Pricing FAQ: plans include "a monthly credit
      allowance"; 1,200 credits/mo = up to 300,000 words/mo (250 words/credit).
      300000/1000=300; 13.99/300=0.0466/1k words.
    source: "https://copyleaks.com/pricing"
    evidence: >
      RESOLVED (disputed: pass1 used $167.88/yr over 1,200 credits/yr = 0.5596/1k
      words; pass2 used $13.99/mo over 1,200 credits/mo = 0.0466/1k words). The
      dispute is entirely about credit CADENCE: does the Personal-Annual tier's
      "1,200 unified credits" reset monthly, or pool once for the full 12 months?
      Resolved toward the monthly reading by protocol §6.2's source hierarchy for
      pricing/credit-rate variables (live pricing page ranks 1st, above ToS): the
      pricing-page FAQ states in three separate places that "Personal and Pro plans
      ... include a monthly credit allowance," that a buyer's "monthly credit
      allowance" / "monthly scan limit" is what the 250-words/1-image rate is
      denominated against, and that "your allowance resets at the start of each new
      billing cycle" — none of it qualified by billing frequency. ToS §8.2's "loaded
      ... and valid for a 12-months period" describes the ANNUAL ACCOUNT's
      subscription-term validity, not a claim of a single non-resetting pool, and it
      is outranked by the pricing page for this variable class regardless. Two
      further checks confirm the monthly reading: (1) neither pass reports the
      "1,200 unified credits" figure changing when the billing toggle is switched
      from Yearly to Monthly, even though ToS §8.3 (Monthly Account) unambiguously
      fixes Monthly billing at 1,200 credits EVERY month — the same displayed figure
      under both toggle states can only mean the same period both ways; (2) pass 1's
      OWN agreed credit_rollover_policy = expires_at_period_end rests on a Help
      Center statement ("credits expire at the end of each billing cycle")
      illustrated with a 1-month example — a value pass 1 itself accepted that is
      incompatible with pass 1's own annual-pool computation basis. Pass 2's
      conflict_note independently flagged this exact tension and reasoned to the
      same conclusion before this adjudication reached it. See coder_note.

  credit_rollover_policy: { value: expires_at_period_end, source: "https://help.copyleaks.com/hc/en-us/articles/23768714188173-Do-my-credits-expire-if-I-don-t-use-them-at-the-end-of-each-billing-cycle", evidence: "\"Yes, credits expire at the end of each billing cycle... the unused 100 credits will not roll over to the next month.\" Corroborated by ToS §8.3 for Monthly Accounts. Agreed both passes, and — per this record's computation_assumptions resolution above — now internally consistent with the monthly credit cadence used there (it was in tension with pass 1's own annual-pool computation)." }

