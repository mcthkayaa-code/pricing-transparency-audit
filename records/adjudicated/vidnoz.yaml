conflict_note: |
  ai-terms-of-service.html vs. terms.html (domain 10, refund/cancellation; found by pass 1, resolved
  in substance by this adjudication -- see refund_policy_exists). ai-terms-of-service.html states
  "Generally, all charges for purchases are non-refundable, and there are no refunds or credits for
  partially used periods," which is flatly incompatible with refundpolicy.html's 7-day money-back
  guarantee and partial-refund-for-unused-months provisions if both governed the same purchase. This
  adjudicator determined ai-terms-of-service.html does not govern the web, directly card-billed
  subscription this record prices (see sources note and coder_note "THE THIRD DOCUMENT QUESTION"):
  not linked from pricing.html, terms.html, or refundpolicy.html on any capture checked; 17 uses of
  "Application" vs 3 of "Website"; copyright-dated 2024 against terms.html's "Last Update: July
  2026"; its own refund-REQUEST mechanism is Apple's iTunes/Apple-ID flow for iOS users, a purchase
  surface this product's payment-methods FAQ does not offer (Visa/Mastercard/Amex/Discover/JCB only).
  Recorded here, per protocol 6.2, because the divergence stays in conflict_note "even where the
  hierarchy settles the coded value cleanly."

  Renewal-notice scope (domain 9; agreed substance, disputed classification -- see
  renewal_notice_commitment). terms.html and ai-terms-of-service.html each commit to notice only
  before a PRICE INCREASE ("at least 7 days' notice," "notice of changes in the pricing... and an
  opportunity to cancel"); neither commits to notice before an ordinary same-price renewal charge.
  Both documents agree with each other on this scope, so there is no source conflict here, only a
  disagreement about how the codebook's `advance_notice_stated` / `no_notice_stated` pair should
  classify a conditional commitment -- flagged in renewal_notice_commitment's own evidence field as a
  possible Wave-2 instrument gap.

