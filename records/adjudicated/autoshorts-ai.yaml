  output_ownership_statement: { value: user_owns, source: "https://autoshorts.ai/faq | https://autoshorts.ai/terms | https://autoshorts.ai/#pricing", evidence: "AGREED. FAQ: \"Yes, the videos are yours to do with as you please. You can download them and use them on other platforms, or even sell them to clients.\" Terms & Conditions (rank 1) is silent on generated-video ownership -- its only copyright clause concerns images a USER UPLOADS as input, a different subject -- so it neither confirms nor contradicts the FAQ; the homepage's own \"Your videos are yours\" line corroborates without overriding." }

  # --- Domain 12: Undisclosed or unverifiable limits ---
  usage_cap_quantified: { value: some_quantified, source: "https://autoshorts.ai/#pricing | https://autoshorts.ai/faq", evidence: "ADJUDICATED 2026-08-16 under decision rule 1 (\"list every limit the documents attribute to the entry paid tier\" -- not limited to the pricing card; the FAQ is a qualifying official document under section 4's source hierarchy) and section 5.1's quantified test (a number and the dimension it counts, plus a period for a rate). The Starter tier carries four limits across the two documents, not three: \"Posts 3 Times A Week\" (quantified rate), \"1 Series\" (quantified standing), \"27 Motion Credits\" (quantified rate, resets each billing cycle per FAQ), and Image Credits, which the FAQ attributes to \"your plan\" (every paid plan, including Starter) and describes only as \"a certain number of image credits that refill on a 30 day rolling basis\" -- a period is stated but no number is, for any tier, anywhere in either document. \"A certain number\" supplies no figure and fails section 5.1's test exactly as \"generous\"/\"reasonable\" do. One of four limits unquantified makes this some_quantified, not all_caps_quantified. Pass 2's all_caps_quantified evidence cites only the pricing-page card's three limits and does not mention Image Credits -- yet pass 2's OWN coder_note, in its \"TWO CREDIT SYSTEMS\" paragraph, states the Image Credit system has \"no per-tier count published anywhere,\" directly contradicting its own all_caps_quantified value. A record contradicting itself is evidence of the error, not a second reading to weigh against pass 1's: pass 2 had already located and described the same unquantified limit pass 1 flagged, and simply left it out of this one field. Prior values: pass1=some_quantified, pass2=all_caps_quantified." }
  unquantified_limit_clause: { value: absent, source: "https://autoshorts.ai/terms | https://autoshorts.ai/faq", evidence: "AGREED. Terms & Conditions read to the end in full by both passes (warranty disclaimer, liability limits, cookies, iframes, third-party links, content liability, link removal -- no fair-use/reasonable-use/excessive-use/discretionary-throttling clause of any kind); FAQ read in full, all 27 questions, same finding. The closest adjacent FAQ topic (\"Will I get banned?\") describes TikTok/YouTube's own third-party spam policy, not a discretion AutoShorts reserves over usage volume -- a different topic under rule 3, does not count." }

coder_note: |
  ADJUDICATION SUMMARY (2026-08-16). tools/disagreements.py autoshorts-ai finds 3 substantive
  disagreements (credit_rate_location, cost_per_output_computable, usage_cap_quantified) plus 1
  non-substantive prose mismatch (computation_assumptions -- differing arithmetic supporting the
  cost_per_output_computable split). All 3 substantive disagreements resolved BY RULE; 0 became
  unknown as a new adjudicated value; 0 date_explained; 0 variant_explained. No disagreement here
  needed unknown -- the documents determine an answer once the correct codebook clause is applied,
  which is not the same as every low-agreement construct in this study resolving that way, and
  should not be read as a general claim about this variable class.

  VENDOR DOMAIN CHECK. Both source records independently confirm product_id/product_name/
  vendor_home_url/category/product_status/paid_submission against frame-for-pass2.csv row
  "autoshorts-ai,AutoShorts.ai,https://autoshorts.ai,Faceless video,active,no" with no discrepancy.
  This adjudicator re-confirmed the same row directly. orchestrator/deviations-log.md's only
  autoshorts-ai-specific entry (D-015 addendum) is the pass-2 coder_role assignment-brief typo
  ("secondary" vs the enum's "second"), already caught and correctly handled by the pass-2 coder
  itself (coded "second", logged the mismatch) -- nothing left to fix here. autoshorts-ai sits in
  D-014's Tier B (named in required reading by pass-1 status/process only, no coded value
  disclosed) and is absent from records/pass2-contaminated/ -- no blinding defect affects this
  product's pass 2.

  REGISTER EVENTS. Both pass1.yaml and pass2.yaml carry register_events: []. date_explained
  (7.4.1) requires a matching vendor_edit register entry; none exists for any of the 3
  disagreements. variant_explained (7.4.2) requires two archive snapshots showing two DIFFERENT
  default display states; both passes independently read the identical Monthly-default state,
  same prices, same feature grids, 7 days apart, and this adjudicator's own 2026-08-16 fetch
  confirms the state is still unchanged 9 days after pass 1. All 3 are ordinary disagreements
  resolved on the documents, not date or display effects.

  CREDIT_RATE_LOCATION, resolution. pricing_page (pass 1's value). Full reasoning is in the
  variable's own evidence field above. In short: pass 2's coded "multiple" rests on a claim
  ("the 15-20 figure appears ... in the FAQ's 'What are motion credits?' answer") that pass 2's
  OWN saved verbatim capture of that exact answer contradicts -- the figure is not in it. This is
  the same family of finding as another product adjudicated today (a citation that does not
  support the value coded from it), though the mechanism differs: there the cited archive capture
  did not exist at all (a phantom redirect); here the cited capture is entirely genuine and
  verified, it simply does not contain what the evidence field claims. Both are reasons not to
  resolve a disagreement in favour of a quotation that cannot be located where it is said to be.

  COST_PER_OUTPUT_COMPUTABLE / COMPUTATION_ASSUMPTIONS, resolution. yes, via the posting-frequency
  calculation (pass 1's value and arithmetic). Full reasoning is in the variables' own evidence
  fields above. The load-bearing point: Motion Credits meter motion applied to ONE IMAGE, not a
  video, and applying motion is an optional, buyer-configured choice (proven optional by the Free
  tier: 1 video for 0 credits) -- so using credits to price "a video" requires assuming the buyer
  fully animates every scene of every video, an assumption rule 7 excludes, whereas the FAQ
  directly and explicitly names the posting-frequency figure as the answer to "how many videos,"
  needing no assumption. This was the harder of the three disagreements and the one this
  assignment specifically flagged for care as a historically low-agreement construct; the
  resolution rests on rules 2 and 7 read together, not on preferring one coder's arithmetic, and a
  human reviewer should feel free to re-open it if section 5.2/domain 6 is revised.

  USAGE_CAP_QUANTIFIED, resolution. some_quantified (pass 1's value). Full reasoning is in the
  variable's own evidence field above. The load-bearing point: pass 2's own coder_note ("TWO
  CREDIT SYSTEMS" paragraph) independently states that Image Credits carry "no per-tier count
  published anywhere" -- the same fact pass 1 used to code some_quantified -- while pass 2's coded
  value for this variable (all_caps_quantified) omits Image Credits from consideration entirely.
  The record argues against its own headline value, the pattern this role is specifically primed
  to check for.

  UNKNOWN-KIND ATTRIBUTION for agreed unknowns carried into this record (failed_generation_charge_
  policy, auto_renewal_default, renewal_notice_commitment) -- not newly adjudicated, but named per
  this assignment's standing rule since they publish in this record. All three are vendor_silence:
  both passes independently read Terms & Conditions and all 27 FAQ questions to completion (pass 1
  and pass 2's evidence fields both state this explicitly, not a partial or abandoned search), and
  neither document addresses failed-generation charging, default renewal behaviour, or advance
  renewal notice. Two independent completed reads, same conclusion, is a stronger finding than an
  unknown left after one search -- this is silence about the vendor, not a gap in this instrument's
  reach. No access_failure applies (all four document classes archived successfully on both
