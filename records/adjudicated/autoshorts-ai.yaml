default_display_state: |
  Single-page site (Next.js SPA); pricing lives in a #pricing section on the homepage, no
  separate pricing URL. Billing toggle defaults to MONTHLY on load, confirmed by DOM class
  inspection on both independent reads (the "Monthly" option carries the component's own
  "..._selected_..." class before any interaction; "Yearly", badged "2 MONTHS FREE!", does
  not) and by this adjudicator's own fresh fetch. Plan cards in this state: FREE $0/mo,
  STARTER $19/mo, DAILY $39/mo, HARDCORE $69/mo, all USD, no currency selector. The FREE
  card shows a "Temporarily paused" signup notice (FAQ: paused for bot/spam abuse, to be
  re-enabled). No cookie-consent banner was presented on any read. Confirmed unchanged as of
  2026-08-16: this adjudicator fetched the live homepage directly and the embedded plan JSON
  ({"price":19,"frequency":3,"maxSeries":1,"watermark":0,...} for Starter) is byte-identical
  to both passes' captures. A Wayback "save now" request for both the homepage and /faq on
  2026-08-16 resolved (302) to pass 2's own 2026-08-14 captures, confirming those remain the
  current archived state and are not stale.

