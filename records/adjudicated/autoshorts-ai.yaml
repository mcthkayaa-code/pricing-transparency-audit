  # --- Domain 5: Comprehensibility of the credit system ---
  credit_system_present: { value: "yes", source: "https://autoshorts.ai/#pricing | https://autoshorts.ai/faq", evidence: "AGREED. Two named intermediate currencies distinct from raw output counts: \"Motion Credits\" (quantified per tier: 0/27/62/124) and \"Image Credits\" (FAQ, named and functionally described though never quantified per tier); both convert into an output rather than stating a plan allowance directly in output units." }
