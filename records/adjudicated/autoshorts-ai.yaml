  credit_rate_location: { value: pricing_page, source: "https://autoshorts.ai/#pricing", evidence: "ADJUDICATED 2026-08-16 under this variable's own decision rule (\"where the rate appears in more than one document class, code multiple ... multiple is for agreement across classes, not disagreement\"), applied to verified content. Pass 2's multiple rested on the claim that the 15-20-credits-per-video figure \"appears both in the pricing-page tooltip and in the FAQ's 'What are motion credits?' answer\" -- but pass 2's OWN saved verbatim local capture of that exact FAQ answer (records/pass2/autoshorts-ai-sources/faq-rendered-2026-08-14.txt, lines 38-45) reads in full: \"By default, our AI creates still images for each scene in your video. Motion credits can animate those images. When setting up your series (or in your series settings), you can specify how many motion credits you are okay using per video... Each plan comes with motion credits that reset each billing cycle, but you can also purchase 'top off' credits that never expire...\" -- no \"15\", \"20\", or any numeric range appears anywhere in it. Pass 1 independently reported the identical finding (\"the FAQ answer ... does not repeat the 15-20 figure\"). This adjudicator additionally verified: (a) both passes' cited archive URLs are genuine, non-redirected captures at their claimed timestamps (HTTP 200, memento-datetime matching exactly; neither carries an x-archive-redirect-reason header, ruling out a phantom/misdirected citation); (b) a fresh 2026-08-16 live fetch of the FAQ page's raw HTML plus every JS bundle it loads (page bundle + 4 shared chunks) contains zero occurrences of \"15-20\"/\"15 to 20\" anywhere in static form -- the tooltip sentence is delivered by a runtime call neither Wayback's crawler nor a plain fetch can reach, so verification here rests on the coders' own independently rendered captures, which agree with each other on the FAQ's actual content and disagree only with pass 2's coded conclusion about it. The rate is published in exactly one document class. Prior values: pass1=pricing_page, pass2=multiple." }
  cost_per_output_unit: { value: other, source: "https://autoshorts.ai/#pricing | https://autoshorts.ai/faq", evidence: "AGREED under domain-6 rule 3. Principal output is one complete short-form video (FAQ: length chosen as \"30 to 60 seconds\" or \"60 to 90 seconds\", not metered by minute); none of the enumerated units fit a discrete whole-video count. Named unit: per_video." }
  cost_per_output_computable: { value: "yes", source: "https://autoshorts.ai/#pricing | https://autoshorts.ai/faq", evidence: "ADJUDICATED 2026-08-16 under rule 2 (\"the included allowance is the quantity of credits OR OUTPUTS that price buys\" -- an output-denominated allowance is explicitly within the rule's contemplation, not only a credit-denominated one) read together with rule 7 (a calculation needing \"an assumption about how a typical buyer uses the product\" is coded no, since \"the reader's job is arithmetic, not estimation\"). Two candidate allowances are published for Starter: \"Posts 3 Times A Week\" (frequency, JSON field frequency:3) and \"27 Motion Credits\". The FAQ's \"How many videos can I create per day?\" answers with exactly the first: \"The number of videos created by each series can be seen on our pricing page ... you set up a Series that automatically generates videos on a schedule\" -- the vendor's own direct mapping of \"videos created\" to the pricing page's posting-frequency figure, needing no further assumption once put on a monthly basis via the codebook's own day-count convention (trial_length_days's decision rule: 7 days/week, 30 days/month). The second candidate, Motion Credits, does not meter videos at all -- \"1 credit adds motion to ONE IMAGE\" (a video has multiple scenes/images) -- and applying motion is optional and buyer-configured (\"you can specify how many motion credits you are okay using per video\"), proven optional by the Free tier itself (1 video produced on 0 Motion Credits). The only stated credit-to-video conversion -- \"typical video may consume 15-20 credits IF motion is applied to all scenes\" -- requires assuming the buyer fully animates every scene of every video, precisely the usage assumption rule 7 excludes, and is a range even under that assumption. Rule 5 (secondary-output partial) does not govern: both candidates target the same principal output (video), so this is a choice between two allowances for one output, not a principal-vs-secondary split. The frequency path satisfies rules 1-4 without needing rule 7's excluded assumption; the credit path does not qualify as an admissible basis, so its range is not \"a range the vendor publishes\" in the sense rule 8 credits toward the coded value -- it is a range reachable only through a disallowed assumption. See computation_assumptions. Prior values: pass1=yes (via frequency, matching this reasoning), pass2=partial (via Motion Credits' range)." }
  computation_assumptions: { value: "Starter $19.00/mo, default Monthly display state, entry paid tier. FAQ ties video output directly to posting frequency (\"the number of videos created by each series can be seen on our pricing page\"); Starter's published rate is 3 posts/week (JSON frequency:3). Videos/mo = 3 x (30/7 days-per-week, per the codebook's own day-conversion convention) = 12.857. $19.00 / 12.857 = $1.48 per video. Not used as the basis: Motion Credits (27/mo; tooltip: a fully-animated video \"typically\" costs 15-20 credits \"if motion is applied to all scenes\") -- credits meter motion applied to an image, not a video, are optional (Free tier: 1 video, 0 credits), and computing from them requires assuming full-motion use on every scene of every video, which rule 7 excludes. That alternate path, if taken anyway, gives a range of $19.00/1.35=$14.07 to $19.00/1.80=$10.56 per fully-animated video (27/20=1.35 to 27/15=1.8 videos/mo) -- recorded here for transparency, not the coded basis.", source: "https://autoshorts.ai/#pricing | https://autoshorts.ai/faq", evidence: "ADJUDICATED 2026-08-16, same rule basis as cost_per_output_computable above. Both coders performed correct arithmetic on their own chosen inputs; the reconciliation is which input rules 2/7 admit, not a math error in either. Pass 1's framing and figure are preserved as the primary computation; pass 2's credit-based range is preserved as the noted alternative, consistent with how pass 1 itself already treated it." }

