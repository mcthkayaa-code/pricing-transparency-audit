  commercial_use_lowest_tier: { value: free, source: "https://autoshorts.ai/faq", evidence: "AGREED. FAQ \"Do I own the videos?\": \"Yes, the videos are yours to do with as you please ... or even sell them to clients.\" Unqualified by tier -- no \"commercial use\" row gates this to a paid plan on the feature grid, and the FAQ answer sits in the general Series & Videos section. Extends to the lowest tier able to produce a video at all (free) on the most literal reading of an unrestricted statement; both passes flag this as a judgment call since the vendor's answer does not name which tier it was contemplating." }
