  credit_rollover_policy: { value: expires_at_period_end, source: "https://autoshorts.ai/#pricing | https://autoshorts.ai/faq", evidence: "AGREED. Pricing-page tooltip and FAQ both state plan-included Motion Credits reset each billing cycle and plan-included Image Credits refill on a 30-day rolling basis; only separately PURCHASED \"top off\" credits (a distinct pool from the plan's included allowance) are stated not to expire. expires_at_period_end answers what happens to the plan's own included, unused credits at period end." }

