  first_charge_amount_usd: { value: 25.00, source: "https://sapling.ai/pricing", evidence: "Default billing config is monthly, so the first charge equals the headline figure; ToS 3.3 confirms periodic charging \"on the Subscription Billing Date all applicable fees for the next subscription period.\" No multiplication performed. Not disputed." }
