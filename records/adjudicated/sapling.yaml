  credit_system_present: { value: "no", source: "https://sapling.ai/pricing", evidence: "Pro grants detector access for a flat $25/month gated only by a per-check character cap (100,000 chars) and the unquantified AUP clause, not by a purchased/converted credit balance. No mention of credits/tokens/points/coins/generations as a metering unit for the consumer Free/Pro/Enterprise plans. Not disputed." }
