  cost_per_output_unit: { value: per_seat_month, source: "https://sapling.ai/pricing", evidence: "Pro is a flat, unmetered monthly subscription per individual user, not a pay-per-check/pay-per-scan product (codebook rule 2: unmetered software access defaults to per_seat_month). Not disputed." }
