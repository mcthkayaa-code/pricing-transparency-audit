  annual_condition_disclosure: { value: not_applicable, source: "https://sapling.ai/pricing", evidence: "Rule 1: the default headline figure ($25/month) does not depend on annual prepayment -- monthly billing is the default, annual a separate non-default link. Not disputed." }
  annual_default_toggle: { value: monthly_preselected, source: "https://sapling.ai/pricing", evidence: "Page loads showing \"$25 / month\" with \"Annual ($12 / mon)\" as a separate action link, not a pre-selected toggle state; pass 2 confirmed no toggle/switch input controls billing period anywhere in the DOM (explicit querySelector search). Not disputed." }
  free_plan_exists: { value: "yes", source: "https://sapling.ai/ai-content-detector", evidence: "The public AI-detector checker is usable at no cost with no account or sign-in (pass 1: full-page keyword search found zero occurrences of \"account\"/\"sign in\"; pass 2: a score renders on page load with none performed) -- a standing free tool distinct from the suite's separate $0/mo \"Free\" plan, whose own feature column does not list detector access at all. Not disputed." }

  free_plan_cap_documented:
    value: all_quantified
    source: "https://sapling.ai/ai-content-detector"
    evidence: >-
      DISPUTED, RESOLVED BY RULE. Pass 1: all_quantified (the 2000-character truncation is the
      only limit the documents attribute to free-tier detector use). Pass 2: some_quantified,
      treating the ToS Acceptable Use Policy's unquantified query-volume clause ("not... more
      than a reasonable number of searches, requests, or queries, determined in Sapling's sole
      discretion... under your subscribed level of Service") as a second, unquantified limit
      reaching the free tier. Both readings agree the clause exists and is unquantified (neither
      disputes unquantified_limit_clause = present) -- the dispute is only whether codebook
      `free_plan_cap_documented` counts it against THIS variable.
      Resolved by the variable's own rule 3, which is the ONLY stated mechanism for a
      discretionary clause to affect this variable: "Where the documents describe the free plan
      as unlimited in some respect, apply the test in usage_cap_quantified rule 3... unless a
      clause elsewhere qualifies it... and unquantified_limit_clause records the clause." That
      precondition -- an affirmative "unlimited" claim ABOUT THE FREE PLAN -- is not met anywhere
      in the documents. Verified directly, not taken on either coder's word: the detector page
      contains zero occurrences of "unlimited" (confirmed again live 2026-08-16), and the general
      suite's own Free ($0) column -- captured by pass 2's own DOM extraction,
      pricing-feature-grid-dom.txt -- shows "Snippets: 20" (a number, not "Unlimited") and an
      EMPTY cell for "AI detector (longer queries)"; nothing in either scoping of "free plan" is
      ever called unlimited. Contrast Pro: its grid row for "Snippets" and "Unlimited use on
      premium domains" IS marked "Unlimited", which is exactly why the same clause correctly
      un-quantifies usage_cap_quantified (agreed some_quantified by both passes, not disputed) --
      rule 3 fired there because its precondition was met there. The AUP clause itself sits among
      anti-virus/anti-hacking/anti-scraping/anti-multiple-account/anti-harassment prohibitions
      (ToS Sec. 4.3(ii)-(viii)) -- a Service-wide anti-abuse provision, which is exactly what the
      codebook's OWN dedicated, ungated variable (unquantified_limit_clause, F2) exists to record
      once; rule 3 does not additionally re-apply it to every tier-specific cap variable absent an
      "unlimited" claim on that tier, or F1/F2's deliberate "double count... on an unlimited
      allowance a fair-use clause qualifies" (protocol 8.3.10) would instead be an unbounded
      N-count with no textual anchor. With rule 3's carve-out not triggered, the free plan's only
      documented, tier-specific limit is the 2000-character standing cap: quantified under
      section 5.1 (number + dimension; a standing limit needs no period, per "1 seat"/"50 MB per
      file"). 1 of 1 listed limits quantified -> all_quantified. Both cited captures verified
      genuine against the Wayback CDX index (no redirect); live-reconfirmed 2026-08-16.

  free_plan_cap_value:
    value: "2000 characters per query"
    source: "https://sapling.ai/ai-content-detector"
    evidence: >-
      DISPUTED, RESOLVED. Pass 1: "2000 characters per query". Pass 2: "2000 characters" (same
      underlying quote, "The free version is currently truncated to 2000 characters (roughly 400
      to 500 tokens)."). Both cite the identical sentence; the only difference is whether the
      per-instance qualifier is retained. Resolved toward pass 1's fuller form on the codebook's
      own section 5.1 precedent for a quantified STANDING limit -- "50 MB per file" is the
      codebook's own worked example of a correctly quantified standing limit, and it retains the
      instance qualifier ("per file") rather than dropping it. "Per query" plays the identical
      role here (this is unambiguously a per-submission ceiling, not a monthly/lifetime
      allowance -- the source sentence answers "how do I run the detector on LONGER TEXTS",
      i.e. per-submission length): omitting it risks a reader misreading "2000 characters" as a
      cumulative allowance. Directly tied to the free_plan_cap_documented resolution above (the
      same single limit). Quote verified against the live page and against the CDX-confirmed
      archive capture, unchanged 2026-08-16.

  free_plan_watermark: { value: not_applicable, source: "https://sapling.ai/ai-content-detector", evidence: "Detector output is a probability score (e.g. \"Fake: 73.6%\") plus a per-sentence breakdown and a time-limited share certificate, not a media artifact -- matches codebook `watermark_removal_tier` rule 3's own worked example verbatim (\"a detection score or an analysis table\"), which this record's sibling variables below also rest on. Zero mentions of \"watermark\" anywhere on the detector page or in the full ToS (confirmed independently by this adjudicator's own full-text search of all three ToS captures). Not disputed. See coder_note for this adjudicator's check of the not_applicable/unknown boundary on this and the three domain-11 variables below." }
