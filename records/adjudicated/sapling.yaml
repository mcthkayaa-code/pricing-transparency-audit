  failed_generation_charge_policy: { value: not_applicable, source: "https://sapling.ai/ai-content-detector", evidence: "Pro is flat-rate/seat-based with no per-check accounting or credit deduction (a character-per-query cap only, not a consumed allowance) -- matches the codebook's not_applicable case, \"a flat-rate seat-based tool with no per-output accounting\". No document describes a failure/error policy for detector checks. Not disputed." }

  auto_renewal_default: { value: "on", source: "https://sapling.ai/tos", evidence: "ToS 3.3: \"Your account will be charged automatically on the Subscription Billing Date all applicable fees for the next subscription period\" / \"...until cancellation of either the recurring payments or your account\". Not disputed." }
  auto_renewal_disclosure_location: { value: terms_only, source: "https://sapling.ai/tos", evidence: "Auto-renewal language located only in ToS 3.3. Pricing page and billing FAQ both read by at least one pass; neither states subscriptions renew automatically (pass 2: regex over the full /pricing HTML for \"renew\" returns zero matches). Not disputed." }

  renewal_notice_commitment:
    value: unknown
    source: "https://sapling.ai/tos"
    evidence: >-
      DISPUTED, RESOLVED. Pass 1: unknown. Pass 2: no_notice_stated. Both passes' own evidence
      agrees on the underlying document: the ~31.8k-character ToS, read to the end by both, states
      a conditional FEE-CHANGE notice ("Sapling may change the fees for any feature of the
      Service... if Sapling gives you advance notice of changes before they apply") and a 30-day
      TERMS-CHANGE notice ("Any changes to these Terms will be effective upon the earlier of
      thirty (30) calendar days following our dispatch of an e-mail notice..."), and states
      neither a commitment to, nor a denial of, notice before an ordinary RENEWAL charge
      specifically. This adjudicator independently re-read the full document (live 2026-08-16, and
      the three archived captures listed under sources -- all byte-identical in body text) and
      confirms no such clause exists in any version across the window. The disagreement is a
      codebook-application question, not a documentary one, and is resolved by the codebook's own
      internal structure rather than by picking a side: `renewal_notice_commitment`'s decision
      rule states a test only for `advance_notice_stated` ("requires a stated commitment") and for
      `conflicting"; it says nothing about the no_notice_stated/unknown boundary. Its only
      structural analog in the instrument is `refund_policy_exists`, whose `no_refunds_stated` is
      explicit that the value "is a determinate value, not a gap" and REQUIRES an affirmative
      vendor quote (worked example: "Subscription fees are non-refundable except where required by
      law") -- not mere silence. `renewal_notice_commitment` also carries no `absent` value, so
      section 2.2's carve-out (which lets full-search-silence stand as a determinate value on
      variables that DO carry that token, e.g. sibling `auto_renewal_disclosure_location`'s own
      table: `absent` = "All four document classes were read and none states it" vs `unknown` =
      "documents could not be located") does not extend to it by name. Section 2.1's general
      default therefore governs: "Do official documents state a determinate value? ... Otherwise,
      code unknown" -- and protocol non-claim 4 ("An undocumented term is coded as undocumented,
      never as concealment") plus protocol 6.3 ("never close a gap by inference") both caution
      against reading true silence as an affirmative no-notice position. `unknown`, kind VENDOR
      SILENCE: not access failure (the ToS was fully retrieved and read to completion, repeatedly,
      by both passes and by this adjudicator, with zero retrieval barrier of any kind at any
      capture date) and not instrument gap (the vendor did not document renewal notice in a form
      the codebook lacks a slot for -- it never addressed the construct at all, in any form). No
      vendor_edit occurred in this document across the window (see sources), so date_explained does
      not apply; no display-state variance exists on this contractual document, so
      variant_explained does not apply either.

  refund_policy_exists: { value: no_refunds_stated, source: "https://sapling.ai/tos", evidence: "ToS 3.1: \"All fees are in U.S. Dollars and are non-refundable, and Sapling will not prorate any fees paid for a subscription that is terminated before the end of its term.\" Not disputed." }
  refund_window_days: { value: 0, source: "https://sapling.ai/tos", evidence: "\"All fees are... non-refundable\" -- no refund window exists. Not disputed." }
  refund_conditions: { value: not_applicable, source: "https://sapling.ai/tos", evidence: "No refund is available (refund_policy_exists = no_refunds_stated). Not disputed." }
  cancellation_self_serve: { value: contact_required, source: "https://sapling.ai/tos", evidence: "ToS 3.3: \"You may cancel the Subscription Service by contacting us at: support@sapling.ai\". See conflict_note: billing FAQ (help center, second-ranked source) describes a self-serve dashboard route instead; ToS governs per protocol 6.2's hierarchy for contractual variables. Not disputed between passes -- both coded contact_required and both logged the same conflict." }
  refund_policy_location: { value: terms, source: "https://sapling.ai/tos", evidence: "Refund position stated only in ToS 3.1; the billing FAQ contains no mention of \"refund\" anywhere. Not disputed." }

  commercial_use_lowest_tier: { value: not_applicable, source: "https://sapling.ai/tos", evidence: "Principal output is a probability score plus a shareable certificate, not an artifact a commercial-use right would attach to. ToS has no defined term for detection \"Output\" and no clause addressing commercial use of detection results (only a restriction on commercially exploiting the Service/platform itself). Not disputed. See coder_note for this adjudicator's not_applicable/unknown boundary check." }
  watermark_removal_tier: { value: not_applicable, source: "https://sapling.ai/ai-content-detector", evidence: "Matches codebook rule 3's own worked example verbatim: \"the principal output is not a media artifact a watermark could mark, for example a detection score or an analysis table.\" Zero mentions of \"watermark\" anywhere in the detector page or the full ToS. Not disputed. See coder_note." }
  output_ownership_statement: { value: not_applicable, source: "https://sapling.ai/tos", evidence: "Same no-output-to-attach-to finding as commercial_use_lowest_tier. ToS \"Ownership\" clause covers IP in the Service/platform; the User Content license covers the user's INPUT text; no clause anywhere addresses ownership of generated detection results. Keyword search for the defined term \"Output\" returns zero matches. Not disputed. See coder_note." }

  usage_cap_quantified: { value: some_quantified, source: "https://sapling.ai/ai-content-detector", evidence: "Pro's detector cap is a specific quantified standing limit (100,000 characters/query), but the SAME tier's \"Unlimited\" Snippets and \"Unlimited use on premium domains\" grid entries ARE qualified by the ToS AUP's unquantified discretionary clause (rule 3's precondition is met here, unlike on the free tier -- see free_plan_cap_documented). At least one quantified and at least one not -> some_quantified. Not disputed." }
  unquantified_limit_clause: { value: present, source: "https://sapling.ai/tos", evidence: "ToS 4.3(i): \"you agree not to: (i) submit or generate more than a reasonable number of searches, requests, or queries, determined in Sapling's sole discretion, and in no event more than the number allowed under your subscribed level of Service\" -- an unquantified fair/reasonable-use standard at the vendor's sole discretion, no figure given. This adjudicator confirmed by a full re-read of the ToS that this is the ONLY discretionary/fair-use/limits clause in the document (no separate business/Enterprise-specific rate-limit or quota clause exists anywhere). Not disputed." }

coder_note: |
  ADJUDICATION SUMMARY, 2026-08-16. tools/disagreements.py reported 3 substantive disagreements
  plus one prose field for sapling. All 3 resolved by rule; none left unresolved as "the documents
  don't determine this" in the sense protocol 7.4 step 5 anticipates -- each disagreement turned on
  which codebook rule governs, not on genuinely ambiguous vendor documents, though the RESOLVING
  rule was, in one case, thinner than it should be (flagged below).

  1. free_plan_cap_documented (pass 1 all_quantified / pass 2 some_quantified) -> ADJUDICATED
     all_quantified, decided by free_plan_cap_documented rule 3's explicit "unlimited"
     precondition, which is not met anywhere in the documents attributable to the free plan
     (verified directly, not taken on either coder's word -- see the variable's own evidence
     field for the full chain).
  2. free_plan_cap_value (pass 1 "2000 characters per query" / pass 2 "2000 characters") ->
     ADJUDICATED "2000 characters per query", the fuller form, on the codebook's own section 5.1
     "50 MB per file" precedent for a quantified standing limit and directly tied to (1).
  3. renewal_notice_commitment (pass 1 unknown / pass 2 no_notice_stated) -> ADJUDICATED unknown,
     kind VENDOR SILENCE, decided by cross-referencing this variable's decision rule (which
     defines only advance_notice_stated and conflicting) against its one structural analog in the
     instrument, refund_policy_exists, whose no_refunds_stated explicitly requires an affirmative
     vendor quote rather than silence -- see the variable's own evidence field.
  Net: 2 of 3 disagreements resolved to a determinate value (both toward pass 1's reading); 1 of 3
  resolved to `unknown` (also pass 1's reading, but reached independently through the codebook's
  own no_X_stated/absent structure, not by deferring to pass 1 -- see below). Zero
  date_explained or variant_explained classifications: this adjudicator independently verified
  that neither document behind any of the three disputes changed across the collection window
  (ToS: three archive timestamps spanning 2026-08-12 to 2026-08-15, plus a live 2026-08-16 fetch,
  all byte-identical in body text; ai-content-detector: live-reconfirmed unchanged 2026-08-16), so
  no register_events entry was available to support either classification and none is claimed.

  ON NOT DEFERRING TO PASS 1 BY DEFAULT. All three of pass 1's readings are adopted, which risks
  looking like a tie-break toward whichever pass went first. It is not: for (1)/(2), pass 2's own
  captured evidence (the pricing-feature-grid-dom.txt DOM extraction) is what disproves pass 2's
  own conclusion -- pass 2's argument requires an "unlimited" claim on the free tier that pass 2's
  own source file shows does not exist. For (3), pass 1's `unknown` is adopted not because pass 1
  wrote it first but because the codebook's OWN naming convention (no_refunds_stated's explicit
  affirmative-statement requirement) resolves the ambiguity pass 2's reading otherwise has no
  textual anchor against. Protocol 7.4 step 3 is explicit that agreement between two prior records
  is not evidence and that both can be wrong; here both passes' underlying document-reading was
  careful and accurate on all three, and the disagreement was entirely about which codebook rule
  governs a value neither disputed as a fact.

  CITATION VERIFICATION (the "verify a cited capture exists" duty, confirmed live and material on
  another product today). Every citation behind a disputed value was checked against the Wayback
  CDX index and refetched: ToS at pass 1's 2026-08-12 08:29:27 timestamp, pass 2's cited
  2026-08-12 20:31:56 timestamp, and a third capture neither pass cited (2026-08-15 12:52:26,
  found while checking the CDX index for drift) -- all three exist, none redirects
  (no x-archive-redirect-reason header), and all three are byte-identical in body text. The
  ai-content-detector capture pass 2 cites (2026-08-15 12:52:06) likewise exists, does not
  redirect, and its body contains both quoted figures ("2000 characters", "100,000 characters")
  verbatim, with "unlimited" appearing nowhere. No citation in this record pointed at a capture
  that does not exist or does not carry its quoted figure.

  NOT_APPLICABLE/UNKNOWN BOUNDARY CHECK (flagged in the brief as an open question elsewhere in the
  adjudication queue: A-018 ruled that `not_applicable` on the watermark/ownership/commercial-use
