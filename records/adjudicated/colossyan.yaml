coder_note: |
  ADJUDICATION SUMMARY, 2026-08-16. 6 substantive disagreements (a 7th item,
  computation_assumptions, is prose that follows mechanically from cost_per_output_computable
  and is not counted separately). All 6 resolved by rule; none coded unknown. Zero
  date_explained and zero variant_explained: both source records carry empty register_events,
  so no vendor_edit or display_variant entry exists to classify any disagreement either way --
  every one traces either to differential document coverage between the two passes or to a
  genuine rule-application question over facts both coders already had identically.

  Resolution shapes, by variable:
  - free_plan_cap_value (adds "1 Cora storyboard/mo") and trial_card_required ("no"): coverage
    gaps, pass-2 direction. In each case pass 1 found and used an official Zendesk article
    (Cora-usage-limitations; Free-Trial) that pass 2's own source list never captured at all.
  - auto_renewal_disclosure_location ("multiple"): a hybrid -- half coverage-inside-a-document
