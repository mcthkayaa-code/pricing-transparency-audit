conflict_note: "OUTPUT OWNERSHIP: Help Center 'Video rights' article (https://colossyan.zendesk.com/hc/en-us/articles/31601551901841-Video-rights, '1 year ago Updated') states an unconditional 'full-commercial license for all user-generated content with all paid plans... users are the sole owners of the video content they create'; this conflicts with the governing Terms of Service (https://www.colossyan.com/terms/), whose Standard-tier clause (Section 5.5) grants only a revocable license and whose Section 8.1 reserves ownership generally. Terms ranks first for this contractual variable per protocol 6.2; the Help Center's unconditional claim is the overridden lower-ranked source -- both passes agree, and this is separate from the tier/use-type dependence output_ownership_statement=conditional is now coded from (Standard license-only vs Enterprise ownership vs Instant-Avatar vendor-ownership, all within the governing Terms itself). | TRIAL_AUTO_CONVERTS: Terms Section 3.4 ('Colossyan may charge automatically at the end of the trial... unless you notify us in advance') implies the trial auto-charges; the Free-Trial and Pricing & Packaging FAQ Help Center articles both state the account simply reverts to the Free plan and generation stops, with no charge, since no card was ever collected at trial start. Trial terms are pricing-class under protocol 6.2, where the help center (rank 2) outranks the Terms (rank 3); both passes independently coded trial_auto_converts=no from the help center and logged this identical conflict, so it is not a disagreement to adjudicate. | MINUTE-ALLOWANCE STALENESS: the Pricing & Packaging FAQ's worked example ('12*40=480 minutes... annual Pro subscription', i.e. 40 min/mo) conflicts with the live pricing page's current 30 min/mo NEO figure for Professional; the pricing page governs as the rank-1 source for this pricing-class figure and is also the more current document -- both passes agree and used the pricing-page figure throughout, including in the cost_per_output_computable resolution above. | ADDITIONAL-MINUTES PURCHASE: the live pricing-page FAQ states a Professional-yearly NEO2 add-on pack is purchasable ('600 extra NEO2 minutes for $1,500/year'), while the Pricing & Packaging FAQ states 'there is no way to purchase additional minutes.' Does not change any coded value (both describe an optional, non-mandatory purchase); recorded per protocol 6.2's rule that a marketing-vs-documentation gap is reported even where it does not change a coded value."
