default_display_state: |
  Pricing page (https://www.aragon.ai/pricing) loads on the "Headshots" top-level tab with
  "Individual Pricing" sub-tab active, before any interaction: three one-time package cards (Basic
  $18, list $35 struck through; Standard $25, list $45; Executive $40, list $75) under a "20% off all
  packages, limited time only!" banner. No monthly/annual toggle appears in this default view. A
  second top-level tab, "Subscription" (recurring credit plans: Lite $15/mo, Pro $29/mo, Ultimate
  $49/mo, Creator $249/mo, with its own Monthly/Annual toggle defaulting to Monthly), is one click
  away and is NOT part of the default display state (sampling-rules.md 7.2 rule 1: do not switch to
  find a different figure; protocol 6.8). Confirmed independently on three reads: pass 1
  (2026-08-06), pass 2 (2026-08-14, DOM/screenshot on two fresh loads), and this adjudicator
  (2026-08-16, live, cookie banner declined via "Reject All", both tabs read after recording the
  default). Pass 1's session could not render the Subscription tab at all ("Minified React error
  #418" in console, tab clicks inert) and used only the page's own embedded schema.org JSON-LD for
  Subscription-tier corroboration; pass 2 and this adjudicator both rendered it normally with a plain
  click, matching each other verbatim. This is a session-side tooling failure on pass 1's part
  (deviations-for-coders.md: "A coder-tooling misread is never a display_variant. The vendor served
  one state and our reader mangled it."), not a vendor A/B state or geography state — see coder_note
  for how this drove six of the nine disagreements. Currency: plain "$" figures, no currency/country
  selector (globe icon opens a language picker only: English/Deutsch/Français/Português); ToS states
  "all fees are in U.S. Dollars." Pass 1 additionally flagged a geography banner on the vendor's HOME
  page ("Local pricing is live... priced for your region"); not observed on the pricing page itself
  by any of the three reads and not present on any archived pricing-page snapshot, so it is noted but
  not treated as affecting the entry-tier price read here.

