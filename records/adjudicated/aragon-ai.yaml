  credit_rate_location: { value: "pricing_page", source: "https://www.aragon.ai/pricing", evidence: "ADJUDICATED 2026-08-16, follows from credit_to_output_rate_published=partial (a rate is published, so absent cannot stand). The credit/image/edit figures appear only on the Subscription tab of the pricing page; confirmed absent from ToS's Credits section (conceptual only — redemption, expiry, 'Aragon may change... the value of services obtainable with Credits', no number given — grepped in full by this adjudicator) and from the free-headshot-generator page. One document class = pricing_page, not multiple. Prior values: pass1=absent, pass2=pricing_page." }

