  auto_renewal_disclosure_location: { value: "multiple", source: "https://www.aragon.ai/terms", evidence: "AGREED. Stated in the Terms of Service (banner + Subscription Service clause) AND the dedicated Refund Policy page ('All subscription plans renew automatically unless canceled before the renewal date') — two of four document classes, in agreement. Not found stated explicitly on the pricing page itself." }
  renewal_notice_commitment: { value: "no_notice_stated", source: "https://www.aragon.ai/terms", evidence: "AGREED. No advance-notice-before-charge commitment found; ToS commits only to notifying on FAILED payment attempts. Support page's 'Invoices are automatically sent after each payment' is a post-charge receipt, which the codebook rule excludes." }

  # --- Domain 10 ---
  refund_policy_exists: { value: "conflicting", source: "https://www.aragon.ai/terms", evidence: "AGREED (both passes independently reached conflicting; not a disagreement between them). Tied rank-1 contractual sources (protocol 6.2) state incompatible positions: ToS General Payment Terms — 'all fees are...non-refundable, except as required by law' (confirmed by this adjudicator's grep: a general fees clause, not subscription-limited, and none of the ToS's refund mentions cross-reference the dedicated Refund Policy). Refund Policy page — 'we are more than willing to offer a complimentary redo or a 100% refund' under stated conditions. See conflict_note." }
  refund_window_days: { value: "conflicting", source: "https://www.aragon.ai/refund-policy", evidence: "ADJUDICATED 2026-08-16 under the variable's own rule ('where two official sources of equal authority state incompatible windows, code conflicting') and protocol 6.2 (ToS and the dedicated refund-policy page are TIED at rank 1 for contractual variables — confirmed no source outranks the other). Refund Policy's Headshot Refund Policy section (the entry tier's own section): 'Refund requests must be submitted within 14 calendar days of purchase.' ToS: 'all fees are...non-refundable, except as required by law' — a general clause covering Basic's $18 fee, not subscription-limited. This variable's own value list carries a dedicated `0` for 'no refunds are given' as a determinate stated position, not silence, so the ToS's non-refundable clause IS a stated window (0) that competes with the Refund Policy's 14 — two tied-rank sources, incompatible windows, per the variable's own rule. Prior values: pass1=14 (treated the ToS's absence of a day-COUNT as not a competing claim, which the variable's own 0-value convention does not support), pass2=conflicting." }
  refund_conditions: { value: "conflicting", source: "https://www.aragon.ai/refund-policy", evidence: "ADJUDICATED 2026-08-16, same two tied-rank documents as refund_window_days and the agreed refund_policy_exists. Refund Policy page states specific conditions (didn't download, followed upload instructions, within 14 days). ToS states no buyer-initiated refund right exists at all for ordinary dissatisfaction — an incompatible answer to 'what conditions attach' from an equal-authority source on the same purchase, not silence. Prior values: pass1=conditional (read only the Refund Policy's stated conditions, without weighing the ToS's competing non-refundable position on the same purchase into this variable), pass2=conflicting." }
  cancellation_self_serve: { value: "conflicting", source: "https://www.aragon.ai/terms", evidence: "AGREED (both passes independently reached conflicting; not a disagreement between them). Internal split within the ToS itself (renewal 'stops unless you cancel...from within your Account' vs. the operative mechanism in the same paragraph, 'contacting us at support@aragon.ai... before the renewal date'), corroborated on the self-serve side by the pricing-page Subscription FAQ ('pause or cancel anytime from your billing page'). See conflict_note." }
  refund_policy_location: { value: "conflicting", source: "https://www.aragon.ai/terms", evidence: "ADJUDICATED 2026-08-16 under the variable's own explicit rule: 'multiple is for agreement across two or more classes... conflicting is for disagreement between two of equal authority, which leaves the governing class undeterminable.' The dedicated_refund_page and terms classes both state a refund position, but they disagree in substance (refund_policy_exists=conflicting, agreed by both passes) — disagreement, not agreement, between two equal-authority classes, so the rule's own text calls for conflicting. Prior values: pass1=multiple (counted classes that mention a refund position without applying the rule's stated agreement/disagreement distinction), pass2=conflicting." }

  # --- Domain 11 ---
  commercial_use_lowest_tier: { value: "free", source: "https://www.aragon.ai/terms", evidence: "AGREED. ToS Output clause, stated generally, not tier-gated: 'Aragon hereby assigns to you all of its rights, title, and interest (if any) in and to the Output...You may use such Outputs for your own personal or commercial purposes.' No tier restriction found anywhere; the free tier also produces Output, so the grant applies from the free tier up." }
  watermark_removal_tier: { value: "unknown", source: "https://www.aragon.ai/pricing", evidence: "ADJUDICATED 2026-08-16 under codebook 2.1's decision tree, applied after the entry-tier finding above. Verified live 2026-08-16: 'No watermarks' is listed as an included feature on all 4 Subscription-tab tiers (Lite $15/mo up). But the entry paid tier is Basic (one-time, $18, Headshots > Individual Pricing — the default display state; sampling-rules 7.2), and no document states the watermark status of Basic, Standard, Executive, or the free tier. This variable's lowest_paid/mid_tier/highest_tier values are tier-ladder constructs anchored to the entry paid tier (parallel to commercial_use_lowest_tier's explicit 'lowest_paid = granted from the entry paid tier'); Aragon runs two parallel, non-cross-referencing ladders (one-time packages vs. subscriptions), and only the non-entry ladder carries a statement. Coding lowest_paid would assert Basic is watermark-free, which no document states; mid_tier or highest_tier would equally presume a single ladder the documents do not describe. No document states a determinate answer to 'the lowest tier' across the product as sold (2.1 step 2 fails); this is not two sources naming different tiers for the same construct (step 3 does not apply either); step 4 applies: unknown. Prior values: pass1=unknown (reached because the word 'watermark' did not appear anywhere in that session's evidence — a tooling-access gap: the word does appear, on the Subscription tab, which that session could not render), pass2=lowest_paid (reached by reading Lite, the Subscription ladder's own bottom rung, as if it were the entry tier; Lite is not the entry tier — Basic is, per both passes' own entry-tier selection — pass2's own coder_note flags this exact reading as a judgment call). Net: same value as pass1, reached by different and more complete reasoning; pass2's Subscription-ladder evidence is preserved above rather than discarded." }
  output_ownership_statement: { value: "user_owns", source: "https://www.aragon.ai/terms", evidence: "AGREED. ToS: 'Aragon hereby assigns to you all of its rights, title, and interest (if any) in and to the Output...' Reinforced under Ownership: 'Materials excludes Outputs...which...are owned by you.' No tier- or subscription-status-dependent qualifier found." }

  # --- Domain 12 ---
  usage_cap_quantified: { value: "all_caps_quantified", source: "https://www.aragon.ai/pricing", evidence: "AGREED. Every limit the documents attribute to the entry tier (Basic) carries a number: '40 headshots', 'Choice of 1 attire', 'Choice of 1 background', '896 x 1088 pixels' resolution (FAQ). '45 mins generation time' is a turnaround-speed figure, not a usage limit, and is not counted either way." }
  unquantified_limit_clause: { value: "present", source: "https://www.aragon.ai/terms", evidence: "AGREED. ToS Prohibited Conduct clause bars 'an unreasonable or disproportionate load...through automated scripts, bots, or other tools that send requests at a volume no human user could generate' — a discretionary, unquantified standard. The free-tools clause separately reserves the right to 'impose usage limits, queue times, or indefinite wait periods' at Aragon's sole discretion, no figures given." }

coder_note: |
  ADJUDICATION SUMMARY (2026-08-16). tools/disagreements.py aragon-ai and an independent field-by-
  field diff of all 37 CODED variables both find 9 substantive disagreements (free_plan_cap_documented,
  free_plan_cap_value, credit_unit_defined, credit_to_output_rate_published, credit_rate_location,
  refund_window_days, refund_conditions, refund_policy_location, watermark_removal_tier) plus 1
  non-substantive prose mismatch (computation_assumptions — same arithmetic, different wording). My
  assignment brief stated eleven substantive disagreements; I can account for nine. Likely
  explanation, stated for the record rather than silently adjudicating a count I could not reproduce:
  refund_policy_exists and cancellation_self_serve are ALSO `conflicting` in the published value, but
  pass 1 and pass 2 independently AGREE on both — they are not disagreements between the two records.
  9 real disagreements + those 2 agreed-but-conflicting variables = 11, which fits exactly, so I
  suspect the brief counted every conflicting-valued variable rather than every variable where the
  two passes actually differed.

  REGISTER EVENTS. Both pass1.yaml and pass2.yaml carry `register_events: []`. No vendor_edit entry
  exists for this product, so no disagreement qualifies for `date_explained` (protocol 7.4.1)
  regardless of the 8-day gap between collection dates (2026-08-06 / 2026-08-14): no vendor edit
  occurred in that window — pass1's own archived pricing-page snapshot (2026-08-06) already contains
  the Subscription-tier names and prices in its embedded schema.org JSON-LD, and the Subscription-tab
  FAQ text, credit/image/edit figures, and "No watermarks" bullets are verbatim identical between
  pass 2's 2026-08-14 local capture and this adjudicator's live re-read on 2026-08-16. No disagreement
  qualifies for `variant_explained` (7.4.2) either: both passes agree on the DEFAULT display state
  itself (Headshots tab / Individual Pricing sub-tab), confirmed on three independent reads now
  including this one — there are not two archive snapshots of two different DEFAULT states to compare,
  only one pass's inability to render a secondary (one-click-away) tab. All 9 disagreements resolved
  by rule; 0 by date_explained; 0 by variant_explained.

  THE STRUCTURAL QUESTION, RESOLVED FIRST. Aragon's pricing page carries two purchase models behind
  one in-page control: a one-time headshot-package ladder (Basic/Standard/Executive) on the tab that
  loads by default, and a recurring credit-subscription ladder (Lite/Pro/Ultimate/Creator) one click
  away on the "Subscription" tab. sampling-rules 7.2 rule 1 and protocol 6.8 anchor the entry paid
  tier to the DEFAULT display state only ("do not switch...to find a different figure");
  headline_price_usd's own rule 1 repeats the same anchor. Both passes independently read the default
  state as Headshots > Individual Pricing and both picked Basic ($18 one-time, 40 headshots) as
  entry_tier_name — this was NOT itself in dispute, and I verified it independently rather than
  deferring to their agreement (agreement between two records is not evidence of correctness, 7.4
  step 3): confirmed live 2026-08-16 (cookie banner declined via "Reject All") that the page still
  loads on Headshots > Individual Pricing by default, Basic still $18/Standard $25/Executive $40.
  Losing candidates in the default state: Standard $25.00 one-time, Executive $40.00 one-time. The
  Subscription tab's tiers were never eligible candidates because they are not part of the default
  display state — Lite's $180.00 annual-equivalent would not have won regardless (both source
  records independently note this), so the entry-tier PRICE pick was never close.

  HOW THE STRUCTURAL FACT DROVE THE NINE DISAGREEMENTS — two different mechanisms, not one:
  (a) SIX of nine (free_plan_cap_documented, free_plan_cap_value, credit_unit_defined,
  credit_to_output_rate_published, credit_rate_location, watermark_removal_tier) split because pass
  1's session could not render the Subscription tab at all ("Minified React error #418" per pass 1's
  own note) and so never saw the credit/image/edit figures or the "16 credits per active day" /
  "No watermarks" FAQ text living there. Confirmed independently: pass 1's own saved pricing-clean.txt
  (1,479 bytes) is nav/footer only and contains none of the page's actual pricing or FAQ content; its
  pricing-raw.html (a non-JS backup fetch, by pass 1's own description) has no "$18", "40 headshots",
  "16 credits", or "No watermarks" either. Per deviations-for-coders.md: "A coder-tooling misread is
  never a display_variant. The vendor served one state and our reader mangled it." That governs here.
  I loaded the live Subscription tab myself 2026-08-16 (explicit click, cookie banner declined) and it
  renders normally, matching pass 2's 2026-08-14 local capture verbatim, including "16 credits per
  active day" and all four tiers' credit/image/edit triples. Five of these six resolve to pass 2's
  fuller-access value once the rule is applied to the now-confirmed evidence
  (free_plan_cap_documented=some_quantified, free_plan_cap_value="16 credits per active day",
  credit_unit_defined=yes, credit_to_output_rate_published=partial, credit_rate_location=pricing_page)
  — full per-variable rule citations are in each variable's evidence field above.
  (b) watermark_removal_tier is the exception, and this is where "resolve the structural fact first"
  changes the answer pass2 gave rather than confirming it. "No watermarks" is stated only for the
  Subscription ladder (Lite and up) — NOT the entry tier, which is Basic, established in the paragraph
  above — and no document states Basic's, Standard's, Executive's, or the free tier's watermark
  status. lowest_paid/mid_tier/highest_tier all presume one tier ladder anchored at the entry paid
  tier; Aragon runs two non-cross-referencing ladders and only the non-entry one carries a statement.
  Coding lowest_paid, as pass2 did, asserts the entry tier (Basic) is watermark-free — no document
  says that. Codebook 2.1's decision tree finds no determinate value once Basic's own silence is
  weighed in, and this is not two sources naming different tiers for the same construct, so it lands
  on unknown — the same value pass1 held, but for a different and complete reason (pass1 did not know
  the Subscription evidence existed; this record weighs that evidence against the entry-tier finding
  and finds it does not transfer to the entry tier). The Subscription-ladder evidence itself is not
  discarded — it is recorded in the variable's evidence field above.

  REFUND CLUSTER (refund_window_days, refund_conditions, refund_policy_location) — three, not driven
  by the entry-tier tab question, but by the same "apply each variable's own rule text, not a
  parent's value" discipline. Both passes read the identical two documents and both already AGREE
  refund_policy_exists=conflicting and cancellation_self_serve=conflicting between the same pair
  (Refund Policy's Headshot Refund Policy section — the entry tier's own section — promises a
  conditional 100% refund within 14 calendar days of purchase; ToS's General Payment Terms clause,
  "all fees are...non-refundable, except as required by law," is general, not subscription-limited,
  and is not cross-referenced to the Refund Policy anywhere in ToS — confirmed by this adjudicator's
  own grep of pass 1's full terms-clean.txt, ~90,000 characters, 4 "refund" hits total, none pointing
  to the dedicated page). Protocol 6.2 ties ToS and the dedicated refund page at rank 1 for
  contractual variables — neither outranks the other, so codebook 2.1 step 3 requires `conflicting`,
  not a pick between them, on ANY variable where the two give incompatible answers for the same tier.
  Applied each variable's OWN rule text rather than propagating a parent value: refund_window_days's
  value list carries a dedicated `0` for "no refunds are given," so the ToS's blanket clause is itself
  a stated window (0) competing with the Refund Policy's 14 — "two sources...incompatible windows" per
  the variable's own rule. refund_policy_location's rule states outright, "multiple is for agreement
  across two or more classes...conflicting is for disagreement between two of equal authority" — these
  two classes disagree in substance, so the rule's own text calls for conflicting, not multiple (pass
  1's multiple counted classes that mention a position without checking whether they agreed).
  refund_conditions follows the same logic: the ToS denies any refund right exists for ordinary
  dissatisfaction, an incompatible answer to "what conditions attach" from an equal-authority source,
  not silence. All three: pass 1 read the Refund Policy's number/conditions/location correctly but did
  not weigh the ToS's competing position on the SAME entry-tier purchase into these three variables;
  pass 2's `conflicting` values are confirmed correct, though pass 2's own stated reasoning ("for
  consistency with the underlying conflict") is not quite the rule-text basis given here.

  ENTRY-TIER LOSING CANDIDATES (codebook 5, entry_tier_name evidence): Standard $25.00 one-time,
  Executive $40.00 one-time. Subscription-tab tiers (Lite $15/mo = $180.00 annual-equivalent, Pro
  $29/mo, Ultimate $49/mo, Creator $249/mo) were not eligible candidates — not part of the default
  display state (sampling-rules 7.2 rule 1) — and would not have won on price even if they had been.

