coder_note: |
  2026-08-17 ADJUDICATION SUMMARY (queue item A-022, gptzero, coder_pass 3).

  SCOPE. Compared records/pass1/gptzero.yaml (primary, collected 2026-08-09,
  itself a D-005 re-collection superseding a 2026-08-07 version) against
  records/for-cause/gptzero.yaml (for-cause second coding under D-004, collected
  2026-08-17, explicitly instructed to use records/pass1/gptzero-sources/ as its
  evidence base rather than collecting fresh captures). Both source sets resolve,
  via tools/source_paths.py, to the single directory records/pass1/gptzero-sources/
  (11 files) -- no separate for-cause-sources or gptzero-sources-at-root directory
  exists for this product.

  DISAGREEMENT COUNT. A full variable-by-variable diff (all 37) found 9
  disagreeing, not 5. A-022's named question is exactly 5: credit_system_present
  and its four dependents (credit_unit_defined, credit_to_output_rate_published,
  credit_rate_location, credit_rollover_policy). All 5 were resolved by rule; none
  left `unknown`. The remaining 4 disagreements (free_plan_cap_documented,
  free_plan_cap_value [a cascade of the former], commercial_use_lowest_tier,
  usage_cap_quantified) are OUTSIDE this queue item's stated scope. I did not give
  them A-022-level scrutiny; I flagged each in its own variable's evidence field,
  gave a light-touch, disclosed reason for the value carried, and recommend they
  receive their own adjudication pass if one is not already in progress elsewhere
  -- this is disclosed here precisely so a human reviewer can decide whether that
  is needed, per deviations-for-adjudicators.md's instruction to disclose rather
  than silently expand scope.

  CREDIT_SYSTEM_PRESENT AND ITS FOUR DEPENDENTS (the assigned question). Resolved
  credit_system_present = "no" under codebook rule 1 (a plan allowance stated
  directly in output units is not a credit system), reversing pass 1's "yes"
  (rule 3) and matching for-cause's "no". Full reasoning, both prior values, and
  the render-status verification are in that variable's own evidence field. In
  brief: the decisive check this task required -- whether the 300,000/500,000-word
  figures for-cause relies on are rendered or come from the same unrendered JS
  payload behind this product's D-065 error -- resolved in for-cause's favor. The
  D-005 orchestrator's rendered capture (document.body.innerText, a genuine
  browser-executed read) shows these figures directly on the plan cards; the
  pre-hydration raw HTML shows only "$0" placeholders where they belong, proving
  hydration is what supplies them, not dead markup a page never shows. The
  competing evidence -- "Shared team credits," the only "credit" occurrence in the
  11-file set relevant to product metering -- is also genuinely rendered (present
  in the same innerText capture, in raw HTML, and as the literal JS array that
  renders it), so this was never a rendered-vs-unrendered contest on either side;
  it was a rule-1-vs-rule-3 reading of two facts that are both real. Rule 1 is
  checked first, is satisfied by direct and pervasive evidence, and the single
  three-word marketing bullet on a sales-gated, non-self-serve tier is too thin to
  displace it. The four dependents (credit_unit_defined,
  credit_to_output_rate_published, credit_rate_location, credit_rollover_policy)
  follow mechanically to not_applicable ("No credit system") and are not re-argued
  beyond noting both prior values in each one's own evidence field.

  RENDER-STATUS FINDING GENERALIZES WITHIN THIS RECORD. The same unrendered-JS-
  payload defect named in this product's D-065 (for-cause reading a feature table
  out of 3sm69kou41dgv.js / pricing-raw.html's embedded JSON that this /pricing
  page never displays) also underlies for-cause's free_plan_cap_documented,
  free_plan_cap_value, and usage_cap_quantified values -- confirmed directly by
  this adjudicator, not merely asserted: I checked the D-005 rendered capture and
  the static visible markup for the specific figures for-cause cites (the
  free-tier "10,000 words"/"10,000 characters"/"5 advanced AI scans" and the paid
  tier's "Character limit per scan"=50,000) and found none of them anywhere a
  reader would actually see. Pass 1's values on those three are better supported
  for the same reason credit_system_present's "no" is: they rest on sources
  independently confirmed rendered (support articles, the D-005 capture itself),
  not on the JS-internal feature table. I carried pass 1's values for these three
  (see each variable's own flagged, out-of-scope note) precisely because the
  identical verification this task required me to run for credit_system_present
  applies to them without further work, not because I re-adjudicated them from
  scratch.

  COMMERCIAL_USE_LOWEST_TIER is a DIFFERENT kind of disagreement from the D-065
  three -- not a rendering question. for-cause's record does not engage with ToS
  Sec.8's "commercial endeavors" clause at all (independently re-verified present
  and genuine today), citing only Sec.2 and a marketing string instead. I carried
  pass 1's not_granted because a real, on-point ToS clause outranks treating the
  document as silent, while flagging a genuine, unresolved textual question (does
  a general "don't use the Site for commercial endeavors" clause, embedded among
  anti-scraping/anti-competition prohibitions, reach a subscriber's downstream use
  of the outputs they receive, or only unauthorized exploitation of the Site
  itself) that I did not have the assigned scope to fully resolve.

  ENTRY-TIER SELECTION (sampling-rules.md 7.2), carried from pass 1 and independently
  confirmed by for-cause: Premium wins (TRY 549/mo x 12 = 6,588/yr, single-seat,
  self-serve). Losing candidate: Professional (TRY 1,049/mo x 12 = 12,588/yr,
  single-seat, self-serve). "Enterprise and Team Plans" is not an eligible
  candidate (sales-gated / not a distinct priced tier; its own copy reads
  "Everything you get with a Professional plan, for everyone"). The "API for
  developers" section is a separate product line, not a plan tier.

  CURRENCY (D-003/D-007 lineage, carried forward, independently re-verified rather
  than re-litigated). The vendor's pricing page renders exclusively in TRY for
  this study's Turkey-egressing collection network; no USD figure exists anywhere
  in the 11-file capture set including both JS bundles, despite ToS Sec.5's "All
  payments shall be in U.S. dollars." I re-fetched the live page today (2026-08-17)
  and re-checked the cited web.archive.org capture: both confirm the same
  pre-hydration/TRY-only pattern pass 1 documented, with no drift since the
  collection window. headline_price_usd and first_charge_amount_usd stay
  `unknown` (not `non_usd`), per the reasoning already in each variable's own
  evidence field, now with an explicit unknown_kind attribution each.

  CITATION VERIFICATION PERFORMED (this adjudicator's own duty, not inherited from
  either pass): independently re-fetched and confirmed genuine (HTTP 200, matching
  memento-datetime, no x-archive-redirect-reason header) the archived captures of
  the ToS and of the rate-limit, overage, and free-vs-paid support articles, and
  found the exact quoted language each record relies on present in every one of
  them. No cited capture in this record's disputed-value chain pointed at a
  timestamp that does not exist or redirected to a different one.

  SCOPE OF READING (adjudicator, not blind): records/pass1/gptzero.yaml,
  records/for-cause/gptzero.yaml, records/pass1/gptzero-sources/ in full,
  codebook-v1.md, protocol-v1.md, sampling-rules.md, record-template.yaml,
  deviations-for-adjudicators.md, tools/source_paths.py,
  tools/validate_records.py, tools/check_value_enums.py,
  tools/check_price_arithmetic.py, and gptzero.me's own live pricing page, terms
  of use, and three support articles (fetched fresh today). Not opened: any other
  product's record in any pass, orchestrator/adjudication-queue.md,
  orchestrator/interim-signals.md, orchestrator/deviations-log.md,
  aitoolspolice.com, site/content/reviews/. No account was created, no login
  attempted, no checkout started, no trial started, no payment details entered, no
  CAPTCHA encountered.

conflict_note:
  - id: annual_billing_help_article_stale
    variables_affected: [annual_default_toggle, headline_billing_basis, annual_condition_disclosure]
    summary: >
      Carried from pass 1, unaffected by this adjudication. The official support
      article "Do you have an annual billing option?" still states "Not yet... we
      hope to release the feature within a few weeks to come," directly contradicted
      by the rendered pricing page's live annual Billing Cycle control. Per
      protocol-v1.md 6.2 the pricing page ranks first for pricing-class variables, so
      all three variables are coded from the pricing page and the help article is read
      as stale rather than as evidence annual billing is unavailable.
    urls:
      - https://gptzero.me/pricing
      - https://support.gptzero.me/articles/9783812961-do-you-have-an-annual-billing-option

  - id: commercial_use_vs_marketing
    variables_affected: [commercial_use_lowest_tier]
    summary: >
      Carried from pass 1. Not a two-official-source value conflict in the codebook's
      technical sense, but a marketing-vs-contract gap protocol-v1.md 6.2 requires
      recording regardless. ToS Sec.8 restricts commercial use of the Site by default
      "except those that are specifically endorsed or approved by us," while the
      pricing page simultaneously markets "Enterprise and Team Plans... for your
      organization," institutional trust badges, and an API section aimed at platform
      integration -- audience-and-scale positioning in tension with a page that never
      states a commercial-use grant. See also this record's out-of-scope note on
      commercial_use_lowest_tier above.
    urls:
      - https://gptzero.me/terms-of-use.html
      - https://gptzero.me/pricing

  - id: tos_usd_vs_pricing_page_try
    variables_affected: [headline_price_usd, first_charge_amount_usd]
    summary: >
      Carried from pass 1, independently re-verified genuine by this adjudicator
      today. ToS Sec.5: "All payments shall be in U.S. dollars." The rendered pricing
      page shows every price in TRY, with no USD figure anywhere in the 11-file
      capture set or in this adjudicator's fresh live check. Not `conflicting` under
      codebook 2.1 (the pricing page's own displayed currency governs pricing-class
      variables under protocol-v1.md 6.2), but a genuine documentary tension recorded
      on its own terms -- and the basis for coding both variables `unknown` with
      unknown_kind=access_failure / unknown_kind=vendor_silence respectively rather
      than `non_usd`.
    urls:
      - https://gptzero.me/terms-of-use.html
      - https://gptzero.me/pricing

