      rendered capture, 7 support articles including the overage and rate-limit
      articles) states what happens to the metered allowance when a scan technically
      fails or errors, as distinct from exceeding the allowance or from completing but
      disappointing the buyer. unknown_kind=vendor_silence: every plausible document
      is reachable and was read; none of them makes this statement — the codebook's
      own rule 3 predicts this variable is "silent often. That is the finding."

  auto_renewal_default:
    value: "on"
    source: {url: "https://gptzero.me/terms-of-use.html", access_date: 2026-08-07, archive_url: "https://web.archive.org/web/20260807100908/https://gptzero.me/terms-of-use.html"}
    evidence: 'AGREED by both passes. ToS Sec.5: "...you consent to our charging your payment method on a recurring basis without requiring your prior approval for each recurring charge, until you notify us of your cancellation." Independently re-verified genuine by this adjudicator today.'

  auto_renewal_disclosure_location:
    value: terms_only
    source: {url: "https://gptzero.me/terms-of-use.html", access_date: 2026-08-07, archive_url: "https://web.archive.org/web/20260807100908/https://gptzero.me/terms-of-use.html"}
