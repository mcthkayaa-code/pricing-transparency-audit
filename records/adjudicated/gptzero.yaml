      for-cause = "not_applicable". Value table: not_applicable = "No credit system" —
      once credit_system_present is no, item C4's construct (rollover of unused
      CREDITS) does not exist for this product; whether unused WORDS roll over is a
      question this variable's construct does not reach, and no document in the
      capture set answers it either way regardless. Not re-argued.

  # ============================================================================================
  # AGREED VARIABLES, continued.
  # ============================================================================================

  failed_generation_charge_policy:
    value: unknown
    source: {url: "https://gptzero.me/terms-of-use.html", access_date: 2026-08-07, archive_url: "https://web.archive.org/web/20260807100908/https://gptzero.me/terms-of-use.html"}
