      computation (protocol 6.5 forbids inventing an exchange rate to restate it in
      USD).

  computation_assumptions:
    value: "Premium (entry tier): TRY 549/mo billed annually, default display state; 300,000 words/mo included, same card, same period (no conversion needed). 549/300,000=0.00183 TRY/word = TRY 1.83 per 1,000 words. TRY-denominated; headline_price_usd=unknown, no USD figure published anywhere; no exchange rate invented (protocol 6.5)."
    source: {url: "https://gptzero.me/pricing", access_date: 2026-08-08, archive_url: "local_copy: gptzero-sources/pricing-rendered-2026-08-08.txt"}
