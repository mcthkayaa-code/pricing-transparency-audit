    source: {url: "https://gptzero.me/pricing", access_date: 2026-08-08, archive_url: "local_copy: gptzero-sources/pricing-rendered-2026-08-08.txt"}
    evidence: >
      AGREED by both passes. Premium's price (TRY 549/mo billed annually) and its
      included allowance (300,000 words/mo) are both published in the default display
