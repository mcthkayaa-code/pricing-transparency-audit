default_display_state: >-
  Annual ("Billed yearly") billing preselected on load in every read (pass 1,
  2026-08-06; pass 2, 2026-08-14; live re-check for this adjudication,
  2026-08-15): plan cards render "Standard Annually" / "Pro Annually" with
  "Billed Annually" + discount badges before any interaction, and the "Billed
  yearly" toggle carries DOM class "selected-slider-difficulty-title" while
  "Billed monthly" does not. Currency is EUR throughout ("+ VAT" on paid
  plans); no USD figure, currency selector, or country/locale selector exists
  anywhere on the page (DOM scan under deviation D-007 returned zero matches).
  "For Individuals" tab active by default (vs. Students & Schools / For
  Enterprises). No cookie-consent banner was presented in any of the three
  reads.

