variables:
  headline_price_usd:
    value: non_usd
    source: https://www.aiva.ai/
    evidence: >-
      Standard Annually (entry tier) card reads "€11 / month + VAT" with
      "Billed Annually" beneath it, default (annual-preselected) display
      state. No USD figure or currency/country selector exists anywhere on
      the page (DOM scan, deviation D-007: zero matches for
      select/currency/locale/country selectors). Both passes agree;
      reconfirmed live 2026-08-15. Archived:
      https://web.archive.org/web/20260814172042/https://www.aiva.ai/

  headline_billing_basis:
    value: per_month_billed_annually
    source: https://www.aiva.ai/
    evidence: >-
      The qualifier printed with the headline "€11 / month" figure is
      "Billed Annually" (a monthly figure charged as one annual payment),
      rendered in the same price-block DOM node
      (div.option-price-subtitle-billing-cycle). No "per seat" / "per user"
      wording appears anywhere on the plan card, so the per_seat_per_month
      rule does not trigger. Both passes agree.

  first_charge_amount_usd:
    value: non_usd
    source: https://www.aiva.ai/
    evidence: >-
      Default display state is annual and the headline is a monthly figure
      ("€11 / month ... Billed Annually"), so the first charge is the annual
      total; no USD figure is published anywhere, so non_usd. "Billed
      Annually" states a once-per-12-months cadence; no document publishes
      the annual total outright, so 11 x 12 = EUR 132.00 is computed per
      first_charge_amount_usd rule 2 (full arithmetic in
      computation_assumptions). VAT excluded (tax, rule 5). Both passes
      agree, independently computing the identical EUR 132.00 figure.

  mandatory_addon_present:
    value: "no"
    source: https://www.aiva.ai/legal/1
    evidence: >-
      Pricing page and EULA list Standard Annually's full feature set
      (copyright terms, monetization scope, download count, track duration,
      file formats) with no separate required charge. EULA section 8
      ("Payment of local taxes") addresses only VAT/sales tax, excluded as a
      tax rather than an add-on (rule 3). No mandatory credit pack, platform
      fee, or onboarding fee is stated in the pricing page, the EULA, or any
      FAQ read. Both passes agree.

  annual_condition_disclosure:
    value: adjacent
    source: https://www.aiva.ai/
    evidence: >-
      Within the Standard Annually plan card, "Standard Annually" / "€11 /
      month + VAT" / "Billed Annually" / "26% OFF!" render in sequence
      inside the same price-block DOM node family
      (div.option-price-subtitle-billing-cycle) -- the annual-prepayment
      condition sits directly beneath the price figure, inside the same
      visual price block. Both passes agree.

  annual_default_toggle:
    value: annual_preselected
    source: https://www.aiva.ai/
    evidence: >-
      DOM inspection at load: "Billed yearly" carries class
      "slider-difficulty-title selected-slider-difficulty-title"; "Billed
      monthly" carries only "slider-difficulty-title" (no "selected-"
      modifier). Plan cards simultaneously render their annual names/prices
      without any click. Both passes agree; the toggle's own CSS class
      establishes the default, not which figure rendered first.

  free_plan_exists:
    value: "yes"
    source: https://www.aiva.ai/
    evidence: >-
      Standing "Free, Forever" card at "€0", "No credit card required",
      shown alongside the paid tiers with no expiry stated -- not a
      time-limited trial (domain 4 covers trials separately). Both passes
      agree.

  free_plan_cap_documented:
    value: all_quantified
    source: https://www.aiva.ai/
    evidence: >-
      Free plan lists two limits, both quantified: "3 downloads per month"
      (rate -- number + dimension + period) and "Track durations up to 3
      minutes" (standing limit -- number + dimension, no period required,
      per codebook section 5.1). "Download MP3 & MIDI formats" is a format
      restriction, not a quantifiable usage limit, and is not counted. Both
      passes agree.

  free_plan_cap_value:
    value: 3 downloads per month | 3 minutes maximum track duration
    source: https://www.aiva.ai/
    evidence: >-
      ADJUDICATED (protocol §7.4) -- the study's one substantive
      disagreement on this product. Pass 1: "3 downloads per month | 3
      minutes maximum track duration". Pass 2: "3 downloads per month | 3
      minutes max track duration". register_events is empty ([]) in BOTH
      records/pass1/aiva.yaml and records/pass2/aiva.yaml -- no vendor_edit,
      no display_variant entry in either -- so neither date_explained
      (§7.4.1) nor variant_explained (§7.4.2) is reachable regardless of
      what the dates or snapshots show; both classifications require a
      register entry that does not exist here, checked before any
      classification was considered. This is also independently consistent
      with the evidence: pass 1's archive (2026-08-06), pass 2's local raw
      HTML capture (2026-08-14, grepped directly:
      "<li>3 downloads per month</li><li>Track durations up to 3
      minutes</li>"), and a fresh live fetch for this adjudication
      (2026-08-15) all show byte-identical Free-plan text -- no vendor edit,
      no display variance, only a coder wording choice. The two coders
      extracted IDENTICAL quantified facts (rate: 3 downloads/month;
      standing limit: 3 minutes on track duration) from the identical
      source sentence and differ only in which word renders the ceiling in
      the codebook's "quantity unit" standing-limit structure -- "maximum"
      (pass 1) vs "max" (pass 2). The deciding clause: free_plan_cap_value's
      decision rule points to section 5.1, and section 5.1's own Standing
      row supplies the one worked example of a per-item "up to N" ceiling
      needing a disambiguating qualifier word -- "720p maximum
      resolution" -- structurally identical to AIVA's "up to 3 minutes"
      track-duration cap, and spelled in full, not abbreviated. Applying
      that reference phrasing (not a preference between the two passes)
      yields "maximum"; had pass 1 also written "max", the same clause
      would still require "maximum" here. Both prior values were
      substantively correct and non-conflicting -- this is a resolution by
      rule of a wording choice the rule leaves less free than it first
      appears, not a correction of an error by either coder. Archived:
      https://web.archive.org/web/20260814172042/https://www.aiva.ai/

  free_plan_watermark:
    value: unknown
    source: https://www.aiva.ai/
    evidence: >-
      No document read (pricing page, EULA, all 8 help-center FAQ articles,
      General User Manual) states whether Free-plan audio/MIDI output files
      carry an embedded watermark or vendor branding, or states that they do
      not. The Free plan's "Credit must be given to AIVA" clause is a
      usage/attribution obligation on how the buyer credits AIVA when
      publishing a track elsewhere -- a distinct construct from an embedded
      audio watermark on the output file itself -- and does not satisfy this
      variable. Third-party review pages claim a 3-second audio watermark on
      free downloads; per protocol this is not used as evidence, since no
      official AIVA document confirms it. Both passes agree.

  free_plan_duration:
    value: perpetual
    source: https://www.aiva.ai/
    evidence: >-
      Plan is named "Free, Forever" and presented as a standing tier
      alongside the paid tiers with no expiry stated in any document read.
      Both passes agree.

  trial_exists:
    value: "no"
    source: https://www.aiva.ai/legal/1
    evidence: >-
      No time-limited trial of a paid tier is mentioned anywhere in the
      pricing page, the EULA (which names exactly five plans: Free, Standard
      Monthly, Standard Annually, Pro Monthly, Pro Annually), the 8
      help-center FAQ articles, or the General User Manual; none use the
      word "trial". AIVA's no-cost option is the perpetual "Free, Forever"
      plan (domain 3), not a trial of Standard or Pro. Both passes agree.

  trial_card_required:
    value: not_applicable
    source: not_applicable
    evidence: "No trial exists (trial_exists = \"no\")."

  trial_length_days:
    value: not_applicable
    source: not_applicable
    evidence: "No trial exists (trial_exists = \"no\")."

  trial_auto_converts:
    value: not_applicable
    source: not_applicable
    evidence: "No trial exists (trial_exists = \"no\")."

  credit_system_present:
    value: "no"
    source: https://www.aiva.ai/
    evidence: >-
      Plan allowances are stated directly in output units ("3 / 15 / 300
      downloads per month") with no intermediate currency; no credits,
      tokens, points, or coins are mentioned in the pricing page, EULA, or
      any FAQ read. The only use of "credit" on AIVA's official pages is the
      attribution sense ("Credit must be given to AIVA"), unrelated to a
      metering currency -- the codebook's own "100 images per month is not a
      credit system" case. Both passes agree.

  credit_unit_defined:
    value: not_applicable
    source: not_applicable
    evidence: "No credit system exists (credit_system_present = \"no\")."

  credit_to_output_rate_published:
    value: not_applicable
    source: not_applicable
    evidence: "No credit system exists (credit_system_present = \"no\")."

  credit_rate_location:
    value: not_applicable
    source: not_applicable
    evidence: "No credit system exists (credit_system_present = \"no\")."

  cost_per_output_unit:
    value: other
    source: https://www.aiva.ai/
    evidence: >-
      AIVA sells metered access to a countable artifact (a generated music
      composition/track, downloaded up to N times per month), not unmetered
      seat-based access, so the per_seat_month carve-out does not apply.
      None of the enumerated units names a discrete track/composition
      download, which is what the plan allowances actually meter (3 -> 15
      -> 300 downloads/month); track duration is a quality cap on that unit,
      not a purchased quantity. Coded other; named unit "per track
      download" (pass 2) / "per composition/track download" (pass 1) -- same
      construct, both passes agree on the coded value.

  cost_per_output_computable:
    value: "yes"
    source: https://www.aiva.ai/
    evidence: >-
      Entry tier (Standard Annually) publishes both required figures in the
      same default display state: "€11 / month + VAT" and "15 downloads per
      month" -- both already on the monthly period, so no conversion or
      use-pattern assumption is needed. Computable for the principal output
      itself, so "yes", not partial. See computation_assumptions. Both
      passes agree.

  computation_assumptions:
    value: >-
      Standard Annually (entry tier), default display state "€11 / month +
      VAT, Billed Annually". First charge: billing is once per 12 months per
      the "Billed Annually" label; no document states the annual total
      outright, so 11 x 12 = EUR 132.00 (VAT excluded, a tax, per rule 5).
      Cost per output: price and allowance are both already monthly (EUR
      11/month; 15 downloads/month per the pricing page), so no period
      conversion is needed; 11 / 15 = EUR 0.73 per download (per
      composition/track, cost_per_output_unit = other).
    source: https://www.aiva.ai/
    evidence: >-
      Free prose describing the coder's own arithmetic (disagrees on every
      product by construction -- tools/disagreements.py's PROSE set -- and
      is not a measurement, per protocol). Not adjudicated as a
      disagreement: both passes computed this arithmetic independently and
      reached identical figures (EUR 132.00 annual first charge; EUR 0.73
      per download); this is that reconciled statement.

  credit_rollover_policy:
    value: not_applicable
    source: not_applicable
    evidence: "No credit system exists (credit_system_present = \"no\")."

  failed_generation_charge_policy:
    value: unknown
    source: https://www.aiva.ai/legal/1
    evidence: >-
      Checked and found silent: pricing page (states only the monthly
      download allowance), EULA section 6 "Technology & Limitations" (states
      generation-rate ceilings -- 100 Compositions/hour, 400/24h, 5 at once
      -- but nothing about a failed/errored attempt's effect on the download
      allowance or the generation quota), the 8 help-center FAQ articles,
      and the General User Manual. The product does meter output, so
      not_applicable's "no per-output accounting at all" condition is not
      met either; the documents are simply silent on the failure case
      specifically. Both passes agree.

  auto_renewal_default:
    value: "on"
    source: https://www.aiva.ai/legal/1
    evidence: >-
      EULA section 9 (Refunds): "Licensee is responsible for downgrading to
      the free plan and / or disabling auto-renewal of their subscription
      when Licensee no longer wishes to continue paying for the Services. No
      refund will be made if Licensee forgets to cancel their subscription."
      The requirement to actively disable auto-renewal / cancel establishes
      renewal is automatic by default. Both passes agree.

  auto_renewal_disclosure_location:
    value: terms_only
    source: https://www.aiva.ai/legal/1
    evidence: >-
      Auto-renewal is stated only in EULA section 9. The pricing page never
      uses the word "renew"; the downgrade/cancel FAQ describes what happens
      after a downgrade is initiated but does not itself assert that
      subscriptions auto-renew by default, so it does not count as a second
      disclosure location. Both passes agree.

  renewal_notice_commitment:
    value: unknown
    source: https://www.aiva.ai/legal/1
    evidence: >-
      Checked and found silent: EULA (including section 9), pricing page,
      all 8 FAQ articles, and the General User Manual. No document commits
      to advance notice before a renewal charge, and none explicitly
      disclaims it either. Both passes agree.

  refund_policy_exists:
    value: "yes"
    source: https://www.aiva.ai/legal/1
    evidence: >-
      EULA section 9: "Customers are elligible for refunds if, and only if,
      they have not used any of the premium features of the plan they
      subscribed to." A refund is available under stated terms. Both passes
      agree.

  refund_window_days:
    value: unknown
    source: https://www.aiva.ai/legal/1
    evidence: >-
      EULA section 9 conditions refund eligibility on non-use of premium
      features ("if, and only if, they have not used any of the premium
      features"), not on a stated number of days; no document read (EULA,
      pricing page, or FAQs) publishes a day-count refund window. Not 0,
      because refunds are available (refund_policy_exists = "yes"); the day
      figure itself is simply not published. Both passes agree.

  refund_conditions:
    value: conditional
    source: https://www.aiva.ai/legal/1
    evidence: >-
      EULA section 9: refund eligibility is conditioned on a usage threshold
      -- "if, and only if, they have not used any of the premium features of
      the plan they subscribed to. If Licensee has already started using
      premium features, Licensee understands that they are no longer
      elligible for a refund." Both passes agree.

  cancellation_self_serve:
    value: self_serve_documented
    source: https://aiva.crisp.help/en/article/how-can-i-downgradecancel-my-subscription-1crq9uf/
    evidence: >-
      FAQ: "To downgrade, go to https://creators.aiva.ai/billing, and then
      click on \"Downgrade\" under the plan you want to downgrade to. You
      can downgrade to a free plan at any time." Cancellation is documented
      as done from account/billing settings without contacting anyone. Both
      passes agree.

  refund_policy_location:
    value: multiple
    source: https://www.aiva.ai/legal/1
    evidence: >-
      Refund position is stated in two document classes in agreement: the
      terms (EULA section 9, general conditional-refund rule) and the help
      center (downgrade FAQ: "Any costs already paid out (for a yearly or
      monthly membership) will not be refunded... in case of downgrading
      prior to current plan's expiration date no refund will be possible").
      Both sources agree in substance (no refund once premium
      features/the term has been used). Both passes agree on the coded
      value.

  commercial_use_lowest_tier:
    value: lowest_paid
    source: https://www.aiva.ai/legal/1
    evidence: >-
      Free plan: "No monetization" (pricing card) / non-commercial-use-only
      language (licensing FAQ) -- no commercial use. Standard Annually, the
      entry paid tier: "Limited monetization" (pricing card); EULA section 3
      grants a "Limited Commercial License ... to monetize the MIDI and
      Audio Composition on a limited set of third-party websites: Youtube,
      Twitch, Tik Tok and Instagram" -- commercial use is first granted
      here, so lowest_paid. Both passes agree.

  watermark_removal_tier:
    value: unknown
    source: https://www.aiva.ai/
    evidence: >-
      No document read (pricing page, EULA, licensing FAQ, cancellation
      FAQ, General User Manual) uses the word "watermark" for any tier, so
      neither a watermark's existence nor a removal tier can be determined
      from official sources. The principal output (a music
      composition/audio file) is a media artifact that could in principle
      carry a watermark, so the not_applicable carve-out does not apply.
      Both passes agree; see free_plan_watermark for the same finding.

  output_ownership_statement:
    value: conditional
    source: https://www.aiva.ai/legal/1
    evidence: >-
      EULA section 3 grants one of three license types depending on the
      subscribed plan: "Non-Commercial License" (Free; AIVA-owned, user
      licensed), "Limited Commercial License" (Standard; AIVA-owned, user
      licensed for monetization on 4 named platforms), or "Full Copyright"
      (Pro; "Licensor hereby assigns, grants and conveys all copyrights...
      to Licensee"), and on cancelling Pro the user retains copyright of
      compositions already owned before cancelling. Matches the codebook's
      "conditional" pattern (rights depend on tier); corroborated by the
      licensing FAQ's per-plan "Copyright owned by AIVA" / "Copyright owned
      by YOU" language and by the copyright-on-upgrade/cancel FAQ. Both
      passes agree.

  usage_cap_quantified:
    value: all_caps_quantified
    source: https://www.aiva.ai/
    evidence: >-
      Entry paid tier (Standard Annually) limits per the pricing card: "15
      downloads per month" (quantified rate) and "Track durations up to 5
      minutes" (quantified standing limit). "Download MP3 & MIDI formats" is
      a format list, not a quantifiable usage limit. The EULA's service-wide
      generation-rate limits (5 Compositions at one time, 100 per hour, 400
      every 24 hours, 4,000 stored) are all quantified and reinforce, not
      weaken, all_caps_quantified. No unlimited claim is made for this tier.
      Both passes agree.

  unquantified_limit_clause:
    value: absent
    source: https://www.aiva.ai/legal/1
    evidence: >-
      EULA read in full; section 6 "Technology & Limitations" is the only
      clause governing usage volume/intensity, and every stated restriction
      carries an explicit number (5 at once, 100/hour, 400/24h, 4,000
      stored). The one discretionary clause found ("AIVA reserves the right,
      at its sole discretion, to modify, discontinue or terminate the
      Services") governs the service generally, not a volume/intensity
      standard on an individual user's usage; conduct-based compliance
      clauses are not volume clauses either (rule 3). No fair-use,
      reasonable-use, excessive-use, or vendor-discretion throttling clause
      without a number was found; no separate Acceptable Use Policy exists
      on this site. Both passes agree.

coder_note: >-
  ADJUDICATION SUMMARY, 2026-08-15 (protocol §7.4). tools/disagreements.py
  aiva compared both records variable by variable: 36 of the 37 coded
  variables agree exactly, byte for byte. One is prose
  (computation_assumptions -- excluded from "substantive" by the tool's own
  PROSE set, since a coder's own arithmetic narrative disagrees on every
  product by construction) and is reconciled rather than adjudicated: both
  passes computed identical figures (EUR 132.00 annual first charge; EUR
  0.73 per download), so the field carries that shared arithmetic. ONE
  substantive disagreement: free_plan_cap_value. Resolved by rule, not by
  choosing a pass -- see that variable's evidence field for the operative
  clause (codebook section 5.1's standing-limit worked example, "720p
  maximum resolution," which fixes "maximum" over "max" for this exact
  construct, a per-item ceiling needing a qualifier). Zero variables coded
  unknown as a result of this adjudication: the disagreement was fully
  rule-resolvable, so step 5's "documents do not determine the answer"
  finding does not apply to this product. Zero date_explained, zero
  variant_explained classifications: register_events is empty ([]) in BOTH
  records/pass1/aiva.yaml and records/pass2/aiva.yaml, so neither
  classification is reachable under §7.4.1 / §7.4.2 regardless of what the
  collection dates or archive snapshots show -- both require a register
  entry that does not exist here, checked before any classification was
  considered, per instruction. Independently consistent with the evidence
  too: pass 1 (2026-08-06), pass 2 (2026-08-14), and a live re-fetch done
  for this adjudication (2026-08-15) all show byte-identical Free-plan text
  -- no vendor edit occurred and no display variance was served; the
  disagreement was a coder wording choice inside a free-text field, nothing
  more, and is recorded as an ordinary disagreement resolved under §7.4
  steps 3-4.

  free_plan_cap_value in full: pass 1 ("3 downloads per month | 3 minutes
  maximum track duration") and pass 2 ("3 downloads per month | 3 minutes
  max track duration") extracted IDENTICAL quantified facts from the
  identical verbatim sentence ("3 downloads per month", "Track durations up
  to 3 minutes" -- confirmed in pass 2's raw local HTML capture and in a
  fresh live fetch today). The only difference is "maximum" vs "max" as the
  standing-limit's qualifying word. The adjudicated value uses "maximum"
