  free_plan_exists:
    value: "yes"
    source: "https://undetectable.ai/ai-humanizer"
    evidence: >-
      ADJUDICATED. Pass 1: "no" (read only /pricing, /terms, /help; found paid tiers plus a
      signup-gated "Free Trial", concluded no free plan). Pass 2: "yes", citing /ai-humanizer, a page
      pass 1 never opened. This adjudicator independently re-fetched /ai-humanizer live on 2026-08-16
      and confirmed verbatim: "Is the AI Humanizer Free? Yes. There's a free version, but it uses a
      basic model and may be flagged by detectors. Sign up for a free trial to bypass detectors with
      99% confidence and use the Undetectable model" -- and the page's own title, "Free AI Humanizer
      (Unlimited, No Signup)". This states two distinct constructs: (1) an ongoing, no-signup "free
      version" on "a basic model" (domain 3, this variable), and (2) the already-agreed signup-gated
      "Free Trial" of the better "Undetectable model" (domain 4, trial_exists, unaffected and
      unchanged). free_plan_exists decision rule step 3 codes "no" only where no free option exists
      "anywhere in the documents" -- false here: an official vendor page (source-hierarchy class 4 for
      pricing variables, protocol 6.2) documents one. Section 2.2 requires positive documentary
      evidence of absence for a determinate "no"; pass 1's "no" instead reflects an incomplete
      document set, since it never had the chance to find or exclude this page.

  free_plan_cap_documented:
    value: none_quantified
    source: "https://undetectable.ai/ai-humanizer"
    evidence: >-
      ADJUDICATED, follows from free_plan_exists=yes. Pass 1: not_applicable (no free plan, now
      superseded). Pass 2: none_quantified. The free/"Basic" version's only documented restriction is
      qualitative -- "uses a basic model and may be flagged by detectors" -- carrying no number. The
      page title's "Unlimited" is never restated with a figure in the visible FAQ/body copy, and even
      read as an explicit unlimited claim under rule 3, it is qualified by the same discretionary ToS
      clause (Section 12 item 4) that qualifies the paid entry tier's "Unlimited" claims below, so it
      would not count as quantified either way. The page's "10,000 characters" line is a general tool
      description, not attributed to the free tier specifically -- both passes agree it does not
      count. No quantified free-plan-specific limit exists in any document located.

  free_plan_cap_value:
    value: unknown
    source: "https://undetectable.ai/ai-humanizer"
    evidence: >-
      ADJUDICATED, follows from free_plan_cap_documented=none_quantified. Pass 1: not_applicable (no
      free plan, now superseded). Pass 2: unknown. No quantified limit is attributable to the free
      plan, so there is nothing to record in this field's quantity/unit/period format. "unknown" also
      matches this study's dominant convention elsewhere for a none_quantified free plan (e.g.
      adobe-firefly, aragon-ai, invideo-ai, pixlr pass-1 records).

  free_plan_watermark:
    value: unknown
    source: "https://undetectable.ai/ai-humanizer"
    evidence: >-
      ADJUDICATED, follows from free_plan_exists=yes. Pass 1: not_applicable (no free plan, now
