      08-16). Decision rule 2 applies directly: "No credit card required" stated on the trial FAQ is a
      documented "no".

  trial_length_days:
    value: unknown
    source: "https://undetectable.ai/pricing"
    evidence: >-
      Not disputed (both passes coded unknown), evidence merged for completeness. The pricing page's
      persistent footnote states a USAGE cap only ("Free Trial is limited to 250 words"), no day-count.
      Pass 1 additionally found a separate on-load interstitial popup claiming "Sign up for a FREE
      3-day trial!" -- a day-based figure in a different, non-comparable unit, uncorroborated by the
      FAQ, Terms, Help, or /ai-humanizer. A word-cap and a day-count are not the same-unit conflict the
      `conflicting` rule contemplates, so unknown is correct with both published figures disclosed here
      rather than either being invented into a day count.

  trial_auto_converts:
    value: "no"
