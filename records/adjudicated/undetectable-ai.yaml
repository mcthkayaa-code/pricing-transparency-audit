  failed_generation_charge_policy:
    value: unknown
    source: "https://undetectable.ai/terms"
    evidence: >-
      Terms and Help both read in full by both passes; neither states whether a technically failed or
      empty humanization attempt consumes the word allowance. The refund clause covers post-hoc
      AI-detector flagging of a delivered output, not a processing failure. Both passes agree.

  auto_renewal_default:
    value: "on"
    source: "https://undetectable.ai/terms"
    evidence: >-
      Section 6.5, AUTOMATIC RENEWAL COMPLIANCE: "By subscribing, you expressly consent to recurring
      billing at the disclosed price and frequency until you cancel..."; Section 5: "If your order is
      subject to recurring charges, then you consent to our charging your payment method on a
      recurring basis without requiring your prior approval for each recurring charge, until such time
      as you cancel...". Both passes agree; confirmed verbatim live 2026-08-16.

  auto_renewal_disclosure_location:
    value: terms_only
    source: "https://undetectable.ai/terms"
    evidence: >-
      ADJUDICATED. Pass 1: multiple, adding the pricing page's FAQPage answer to "Can I cancel my
      subscription at any time?": "Yes, you can cancel your subscription at any time. Your access will
      continue until the end of your current billing period, and you won't be charged again." Pass 2:
      terms_only, reading that same line as describing cancellation mechanics, not stating renewal.
      This adjudicator confirmed the quotation verbatim (live 2026-08-16, unchanged from pass 1's
      08-13 capture) and reads it as pass 2 did: it states what happens AFTER a buyer cancels, never
      asserts the subscription renews or is charged automatically absent cancellation, and is equally
      consistent with an auto-renewing or a manually-renewed billing model -- it does not use "renew",
      "recurring", or "automatic" anywhere. This codebook's own worked example for the neighboring
      variable trial_card_required draws exactly this line for exactly this kind of sentence:
      "Automatic conversion implies stored payment details, but implication is not a statement.
      unknown." The same principle governs here: an implication is not a disclosure. /help was
      independently re-checked live 2026-08-16 and contains no renewal/recurring/"charged again"
      language at all, confirming pass 2's fourth-class check. Only the Terms (Sections 5 and 6.5,
      confirmed live) explicitly state recurring/automatic billing, so terms_only is the rule-correct
      value; pass 1's "multiple" credits an implication as if it were a second, independent statement,
      which -- per the reasoning this variable's own rule gives for why `multiple` matters, proximity
      to the price and repetition of a genuine disclosure -- would overstate how close to checkout this
      vendor actually discloses auto-renewal.

  renewal_notice_commitment:
    value: no_notice_stated
    source: "https://undetectable.ai/terms"
    evidence: >-
      Section 6.5 lists exactly what is disclosed (existence of recurring charges, amount/frequency,
      how to cancel before being charged again) with no commitment to notify before each renewal
      charge. Both passes agree.

  refund_policy_exists:
    value: "yes"
    source: "https://undetectable.ai/terms"
