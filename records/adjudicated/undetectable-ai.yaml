      runs from the flagged incident, not the purchase date. Both passes agree.

  refund_conditions:
    value: conditional
    source: "https://undetectable.ai/terms"
    evidence: >-
      Refund conditioned on a submission "provably flag[ging] as less than 75% human on a reputable AI
      detector" and on requesting within 30 days of that incident. Both passes agree.

  cancellation_self_serve:
    value: contact_required
    source: "https://undetectable.ai/terms"
    evidence: >-
      Section 6.3 (general/default rule, non-California/non-New-York residents): "All other users may
      cancel by emailing us." Section 6.4 gives California and New York residents a dashboard
      self-serve route instead; the codebook has no distinct value for a jurisdiction-split policy, so
      both passes coded the general/default case, consistent with how refund_policy_exists rule 3
      treats a jurisdiction-restricted right elsewhere in this instrument. Both passes agree; this
      adjudicator confirms the split verbatim live 2026-08-16 and finds contact_required the correct
      default-case reading.

  refund_policy_location:
    value: multiple
    source: "https://undetectable.ai/terms"
    evidence: >-
      Refund position appears in the Terms (Sections 6.1 and 27), the Help FAQ ("What is the
      UNDETECTABLE guarantee?"), and the pricing page (banner + embedded FAQ) -- three document
      classes. Both passes agree. See conflict_note: the three classes state the guarantee on
      different terms, which is itself disclosed there per protocol 6.2.

  commercial_use_lowest_tier:
    value: unknown
    source: "https://undetectable.ai/terms"
    evidence: >-
      Terms' IP section addresses only the site's own Content/Marks ("personal, non-commercial use...
      of the Services"), not the user's humanized output; no feature-grid "commercial use" row exists
      for the entry tier, and the /ethics page (pass 2) states an ethical-use policy, not a legal
      rights grant. Both passes agree.

  watermark_removal_tier:
    value: unknown
    source: "https://undetectable.ai/pricing"
    evidence: >-
      Every paid tier's feature list repeats "Watermark and future proof", ambiguous between "carries
      a watermark" and "watermark-free". The vendor separately sells an unrelated "AI Text Watermark
      Remover" product, which pass 2 notes could mean this phrase concerns removing OTHER tools'
      AI-detection watermarks rather than the codebook's construct (the vendor's own output branding).
      No document resolves the ambiguity either way. Both passes agree on unknown.

  output_ownership_statement:
    value: unknown
    source: "https://undetectable.ai/terms"
    evidence: >-
      Terms defines ownership only for the site's own Content/Marks and for forum-style
      "Contributions"; no clause addresses who holds rights in the humanized text output returned to
      the user. Both passes agree.

  usage_cap_quantified:
    value: some_quantified
    source: "https://undetectable.ai/pricing"
    evidence: >-
      ADJUDICATED, follows directly from unquantified_limit_clause=present below. Pass 1:
      all_caps_quantified (premised on unquantified_limit_clause=absent). Pass 2: some_quantified.
      Entry tier ("10K words/month", the only candidate that exists under the default annual display
      state -- see coder_note) limits: "10K words/month" is a quantified rate, agreed by both passes.
      "Unlimited Human Auto Typer" and "Unlimited AI Detecting" turn on this variable's rule 3:
      unlimited counts as quantified only where no clause elsewhere qualifies it. Since this
      adjudicator confirms below that a qualifying discretionary clause IS present in the Terms, and it
      is a general, platform-wide clause not scoped away from any particular tier or feature, both
      "Unlimited" claims are qualified and so not quantified. At least one quantified item (the word
      rate) plus at least one not (the two "Unlimited" claims) = some_quantified. Pass 1's value
      inherits the same search gap as its unquantified_limit_clause=absent.

  unquantified_limit_clause:
    value: present
    source: "https://undetectable.ai/terms"
    evidence: >-
      ADJUDICATED. Pass 1: absent, stating the Terms were "read in full" and that "excessive use"
      appears only in the capital-letters/spam prohibition. Pass 2: present, quoting Terms Section 12
      item 4. This adjudicator independently re-fetched the live ToS on 2026-08-16 and confirmed pass
      2's quotation verbatim: "...in our sole discretion and without limitation, notice, or liability,
      to remove from the Services or otherwise disable all files and content that are excessive in
      size or are in any way burdensome to our systems..." (Section 12, SERVICES MANAGEMENT, item 4).
      Critically, this clause is ALSO present in pass 1's OWN archived 2026-08-13 local capture
      (undetectable-ai-sources/2026-08-13-terms-static.html: the word "excessive" occurs 6 times in
      that file, including this exact clause) -- confirmed by direct text search of pass 1's own saved
      source, so pass 1's "absent" is a search gap against its own evidence (it stopped at the
      capital-letters/spam occurrence), not a document that changed or a defensible alternative
      reading. The clause squarely matches this variable's `present` definition: vendor "sole
      discretion", the word "excessive" (one of the definition's own listed examples), and "burdensome
      to our systems" (a discretionary, unquantified system-load standard, functionally the
      "throttling at the vendor's discretion" the same definition also lists). Rule 3's conduct
      carve-out does not apply: the clause sits under "SERVICES MANAGEMENT" item 4, addressing
      resource size/burden, not under the separate "PROHIBITED ACTIVITIES" conduct list (Section 7)
      that covers illegal/abusive content; "files and content" is undefined and broader than the
      separately-defined "Contributions" term used by item 3 of the same section, so it is not limited
      to community posts. Present, not absent.

coder_note: |
  ADJUDICATION SUMMARY, 2026-08-16 (protocol §7.4). tools/disagreements.py undetectable-ai found 9
  substantive disagreements plus 1 prose disagreement (computation_assumptions) across the 37 coded
  variables. All 9 were resolved by applying the codebook decision rule to the evidence, re-verified
  by this adjudicator against the vendor's live pages (and, for unquantified_limit_clause, against
  pass 1's OWN archived source) rather than trusted from either coder's transcription. ZERO were coded
  unknown: every disagreement in this record was rule-resolvable once the missing or misread document
  was actually read, so step 5's "documents do not determine the answer" finding does not apply to
  this product.

  REGISTER CHECK, done before classifying anything, per instruction. records/pass1/undetectable-ai.yaml
  and records/pass2/undetectable-ai.yaml both carry `register_events: []` -- empty in both. Per §7.4.1,
  date_explained requires an existing vendor_edit entry in the register; per §7.4.2, variant_explained
  requires two archive snapshots of the same URL showing two display states, with no vendor_edit
  explaining it. Neither classification is reachable for ANY of the 9 disagreements below, because
  neither record supplies the register evidence either classification depends on. This adjudicator's
  own live 2026-08-16 re-checks additionally found every load-bearing passage byte-identical to
  whichever pass first captured it (pricing FAQPage JSON-LD unchanged 08-13 through 08-16; ToS Section
  12 item 4 unchanged 08-13 through 08-16; /ai-humanizer unchanged 08-15 to 08-16), so there is
  affirmative evidence against a vendor edit, not merely an absent register entry. All 9 disagreements
  below are ordinary disagreements -- misreads or incomplete document sets -- resolved on the merits.

  ENTRY-TIER / TOGGLE STRUCTURAL FACT, resolved first per assignment instructions, because
  usage_cap_quantified is one of the six entry-tier variables (codebook §5.2) and several other
  variables anchor to the default display state (protocol §6.8). Both passes independently selected
  the same entry tier by sampling-rules §7.2: "10K words/month" at $5.00/mo / $60.00/yr, the lowest
  annual-equivalent cost among eligible candidates in the default (Yearly) display state (losing
  candidates, both passes agree: 20K/mo $114.00/yr, 35K/mo $189.00/yr, 50K-380K slider tier
  $255.00/yr-equivalent; Business/Enterprise excluded, sales-gated). This part was never in dispute
  and is unaffected by anything below.

  What the two passes DISAGREED on, in an uncoded coder_note observation rather than a coded variable,
  is whether the billing toggle changes the SET of tiers or only their prices. Pass 1 (2026-08-13)
  actually clicked the Monthly toggle in a rendered browser and read the re-rendered cards: a
  DIFFERENT ladder -- 20K/$19.00, 35K/$31.00, 50K/$42.00, 80K-unlimited/$64.00 -- with NO 10K option
  at all under Monthly. Pass 2 (2026-08-15) did not click the toggle; it inferred tier-set equivalence
  from a static, pre-hydration WebFetch of the page's DEFAULT (annual) render, which happens to embed
  a struck-through "compare-at" figure ($9.99, $19.00, etc.) inside each annual card for marketing
  contrast, and read those numbers as proof that "the same four tiers... exist under both bases."
  This adjudicator did not have interactive browser tooling available and could not re-click the
  toggle directly; however, pass 2's own method is the less reliable of the two on its own terms --
  pass 2's sources note independently flags this same page as a "JS-rendered SPA" where a static
  pre-hydration fetch is unreliable (exactly why pass 2 used a rendered browser read for its PRIMARY
