  trial_card_required:
    value: "no"
    source: "https://undetectable.ai/pricing"
    evidence: >-
      ADJUDICATED. Pass 1: "no", quoting the pricing page's embedded FAQPage JSON-LD: "Yes, we offer a
      free trial so you can test our AI humanization technology before committing to a paid plan. No
      credit card required to start." Pass 2: unknown, stating neither /pricing nor /help addresses
