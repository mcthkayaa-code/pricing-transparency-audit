rrect)." }

coder_note: |
  ADJUDICATION SUMMARY (2026-08-16). tools/disagreements.py pika reports 2 substantive
  disagreements (cost_per_output_computable, unquantified_limit_clause) plus 1 non-substantive
  prose mismatch (computation_assumptions, an effect of the first disagreement rather than an
  independent one). Independently re-diffed all 37 coded variables directly against both YAML
  records (not just the tool's report) to confirm completeness: the other 35 are byte-identical
  after numeric canonicalisation, and no variable was silently skipped for a missing/None value.
  Both disagreements RESOLVED BY RULE. 0 became unknown. 0 date_explained and 0 variant_explained:
  both pass1.yaml and pass2.yaml carry `register_events: []`, so no vendor_edit entry exists to
  found a date_explained classification (7.4.1 requires one regardless of what the dates show),
  and no second snapshot showing a DIFFERENT default display state was found for either page, so
  variant_explained (7.4.2) is equally unavailable. Both disagreements are ordinary disagreements,
  decided on the documents.

  COST PER OUTPUT -- A GENUINE RANGE, NOT A SINGLE FIGURE (cost_per_output_computable: partial,
  reversing nothing -- pass 1 was correct; pass 2's yes is the one corrected). Both coders agree
  on every input figure: Standard $8/mo billed yearly, 700 credits/mo, and an exact Model-2.5
  credit rate at each of three resolutions (480p/720p/1080p). The dispute is purely whether that
  is ONE computable figure or a RANGE. It is a range: nothing on the pricing page or in the FAQ
  designates a "default" or "principal" resolution for Model 2.5 -- re-checked specifically, since
  this is exactly the kind of vendor-stated anchor that would flip the answer. The FAQ's only
  "What is the resolution of the videos?" entry describes the Pika 2.2 and 2.1 models, not the
  Model 2.5 table this record uses, and says nothing about a default. The three resolution columns
  sit as equal peers in one table. Pass 2's own computation_assumptions is explicit that 480p was
  "chosen as base/lowest tier" by the coder, not read off a vendor statement -- which is precisely
  the "assumption about how a typical buyer uses the product" that the codebook's own decision
  rule 7 disqualifies, and precisely what the yes value's own definition excludes ("needs no
  assumption about typical use"). Rule 1's discipline against picking "the cheapest plan on the
  page" governs which TIER's price to use, not which resolution's rate to use, but its underlying
  principle -- two coders must start from the same number -- argues the same way here: reporting
  the full range is the non-arbitrary answer; picking the cheapest resolution is not. The range
  itself, both coders' arithmetic re-derived and confirmed identical: 480p $1.65/min, 720p
  $2.74/min, 1080p $5.49/min -- more than a 3x spread depending on a choice the vendor leaves
  entirely to the buyer at generation time. Per the domain-8 derived-variable rule, this range
  belongs in coder_note (here) rather than in computation_assumptions, and cost_per_output_value_usd
  (derived) = not_computable.

  ARCHIVE VERIFICATION -- pass 2's pricing-page citation is a phantom capture, discovered while
  re-verifying the figures above. Pass 2's top-level archive_url and its sources[] entry for
  https://pika.art/pricing both cite
  https://web.archive.org/web/20260815122726/https://pika.art/pricing. Requesting that exact URL
  returns HTTP 302 with header `x-archive-redirect-reason: found capture at 20260810104835` --
  it silently resolves to PASS 1's own 2026-08-10 capture, not a distinct 2026-08-15 one. The
  Wayback CDX index for pika.art/pricing (`cdx/search/cdx?url=pika.art/pricing&from=20260801&to=
  20260817`) lists captures only at 20260802100334, 20260804172134, 20260809100456, and
  20260810104835 -- nothing between 2026-08-10 and this adjudicator's own submission on
  2026-08-16 (20260816123040, verified genuine: HTTP 200, memento-datetime matches exactly, no
  redirect). So pass 2's `archive_status: archived` for the pricing page overstates what actually
  happened -- the archive submission for that specific read did not produce a retrievable distinct
  snapshot, and protocol 6.4 would have wanted `local_copy_only` (pass 2 does have a local capture,
  pricing-page-2026-08-15.txt) or a retry. This is the SAME failure class as D-023
  (orchestrator/deviations-log.md, found the same day on anomaly-ai): a citation pointing at a
  capture that does not exist. It is NOT the same outcome, though, and that difference matters:
  D-023's quoted figure appeared nowhere on any date. Here, pass 2's local capture transcribes
  figures that DO independently verify -- against pass 1's own genuinely-archived 2026-08-10 HTML
  (byte-level extraction performed by this adjudicator), and against a direct live fetch and fresh
  archive submission by this adjudicator on 2026-08-16 -- all three agree exactly on every figure
  used above (Standard $8/700 credits, and the full 480p/720p/1080p x 5s/10s credit table). So the
  citation is unsupported, but the underlying reading was not fabricated, unlike D-023. Flagged
  for the study's pre-freeze archive-existence sweep (D-023's own recommendation) as a second
  occurrence of the same defect class, on a different product. This did not change the archive_url
  or sources[] entries pass 2 itself would carry (this record is not pass 2's to edit), but it does
  govern which capture this adjudicated record cites: pass 1's verified-genuine 2026-08-10 capture,
  corroborated by this adjudicator's own fresh 2026-08-16 capture, per protocol 7.4 step 3
  ("prefer the window-dated captures... a page may have changed: say so if it has" -- it had not;
  the CDX digest for 2026-08-09 and 2026-08-10 is identical, and this adjudicator's live 2026-08-16
  read is identical in substance to both).

  UNQUANTIFIED LIMIT CLAUSE -- PRESENT, AND THE CLAUSE WAS ALREADY IN PASS 1'S OWN SOURCE FILE
  (unquantified_limit_clause: present, pass 2 correct). This is the failure mode this assignment
  specifically asked to be checked for: a coder's account of "read in full, nothing found" resting
  on a search that missed a real clause. Pass 1's evidence states "ToS and Acceptable Use Policy
  read in full; all discretion/abuse/excessive language found governs content and conduct
  moderation... No fair-use, reasonable-use, or throttling clause was found." That is not what
  pass 1's own capture contains. tos-rendered.txt (pass 1's own local file, lines 244-246, under
  the ToS's own header "General Practices Regarding Use and Storage") reads: "Pika may establish
  general practices and limits concerning use of the Service, including limits on storage
  capacity, data retention periods, and account inactivity. These practices may vary by
  subscription Plan and may be modified on one or more occasions at Pika's sole discretion." This
  is an unquantified, discretionary, use-limiting clause -- structurally the codebook's own present
  example almost exactly ("we may limit... usage... at our discretion... no figure"). It is not
  conduct/content moderation (rule 3's carve-out): the ToS's actual conduct-moderation clause sits
  under a different header entirely ("Account Suspension and Termination" -- illegal, abusive,
  fraudulent activity). Verified against both archived captures directly (not just the local text
  files): pass 1's (2026-08-10) and pass 2's (2026-08-15) ToS archive URLs are both genuine (HTTP
  200, matching memento-datetime, no redirect) and carry DIFFERENT CDX digests -- confirming two
  real, independent reads of the document, not one capture cited twice -- and the clause is
  present verbatim on both dates. That rules out date_explained (nothing changed between the
  reads) as well as ruling out a citation-integrity problem of the kind found above: this citation
  checks out completely: the words are exactly where pass 2 said they were.

  ENTRY-TIER SELECTION (sampling-rules.md 7.2; AGREED identically by both passes, re-verified
  here): Standard $8/mo billed yearly = $96.00/yr annual-equivalent -- SELECTED. Losing candidates:
  Pro $28/mo billed yearly = $336.00/yr; Fancy $76/mo billed yearly = $912.00/yr. Basic ($0) is the
  free plan, not a paid-tier candidate.

  CONFLICT_NOTE MERGE. Not an adjudicated disagreement (neither variable's coded value differs
  between passes), but the two records' conflict_note fields differ in completeness and are
  merged below rather than picking one. Both flag the free-tier credit conflict (pricing page "80
  monthly video credits" vs. FAQ "150 credits per month"), independently re-verified in pass 2's
  own local FAQ capture, line 15. Pass 2 additionally logs the FAQ's separate, older-model credit
  table (Turbo/Pro Mode/1.0/1.5/2.1/2.2) as a second conflict against the pricing page's Model-2.5
  table; pass 1 discusses the same table in coder_note but declined to log it as a conflict,
  reasoning the two tables name different model versions rather than restating one claim two ways.
  Both readings are defensible and neither changes a coded value (credit_to_output_rate_published
  and credit_rate_location are agreed yes/pricing_page either way); protocol 6.2's instruction that
  "every such divergence stays in conflict_note... even where the hierarchy settles the coded value
  cleanly" favors completeness, so pass 2's fuller two-conflict version is kept, re-verified
  accurate against pass 2's own local capture (faq-2026-08-15.txt lines 20-25) before inclusion.

  SOURCES RE-READ FOR THIS ADJUDICATION: both full records (pass1/pika.yaml, pass2/pika.yaml) and
  both -sources/ directories in full, including pass 1's raw HTML (pricing-raw.html, tos-raw.html,
  faq-raw.html, aup-raw.html) and rendered captures, and pass 2's local text captures; the Wayback
  CDX index for pika.art/pricing and pika.art/terms-of-service; direct HEAD requests against every
  archive URL cited by either pass (pricing, ToS, FAQ, AUP -- all four document classes, both
  passes, 8 URLs total) to check for `x-archive-redirect-reason` and memento-datetime agreement;
