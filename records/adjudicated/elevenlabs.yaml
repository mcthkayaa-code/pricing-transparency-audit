conflict_note: >
  REFUND POLICY. Terms of Service (https://elevenlabs.io/terms-of-use), section "6.
  Subscription Services; Payment", (e) Refunds and Exchanges: "All sales are final. We may
  offer refunds at our sole discretion." Contradicted by the Help Center
  (https://elevenlabs.io/docs/help-center/account/cancellation-refunds/what-is-your-refund-policy
  and its Zendesk mirror
  https://help.elevenlabs.io/hc/en-us/articles/14315426883345-What-is-your-refund-policy):
  "You are eligible for a refund if a request is filed within 14 days of payment and no
  credit quota was used in the period for which you are seeking the refund." Both quotes
  verified verbatim by this adjudication against both passes' independently-saved captures,
  8 days apart, unchanged. Per protocol 6.2, the Terms of Service ranks first for contractual
  variables (refund is named explicitly); refund_policy_exists / refund_window_days /
  refund_conditions / refund_policy_location are coded from the Terms of Service accordingly.
  A buyer relying on the Help Center rather than the Terms of Service would expect a standing
  14-day conditional refund right the governing contract does not grant as a matter of right
  -- recorded here as a finding in its own right per codebook section 3, independent of how
  the hierarchy resolves the coded value.

