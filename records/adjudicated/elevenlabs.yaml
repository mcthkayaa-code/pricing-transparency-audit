  reads: pass 1 (2026-08-06, live browser + accessibility-tree read, combobox
  value="monthly" selected), pass 2 (2026-08-14, server-rendered HTML <option value="monthly"
  selected> plus client DOM combobox), and this adjudication's own fresh re-check
  (2026-08-16, live WebFetch plus a freshly submitted archive snapshot verified to contain
  "Starter $6 (30,000 credits)" and "(10,000 credits)" for Free). USD throughout, no
  currency selector, no cookie-consent gate blocked any read. All three reads show the same
  headline figures ($0 Free / $6 Starter / $22-with-"First month 50% off"-$11 Creator / $99
  Pro / $299 Scale / $990 Business) and the same per-request-credit-cap FAQ text with no
  number attached to it on the pricing page itself. No vendor edit and no display variant
  found on any variable in this record -- see coder_note.

