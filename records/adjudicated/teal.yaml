  credit_unit_defined: { value: "no", source: "https://help.tealhq.com/en/articles/9535168-is-there-a-teal-free-trial", evidence: "DISPUTED, RESOLVED against pass 2's \"yes\" (confirms pass 1). Codebook rule 5: \"Stating how many credits a plan includes is not a definition ... A plan allowance is a quantity, not a unit definition, whatever the output it is attached to.\" Every document found -- pricing page (\"10 Credits\"/\"2 Credits\"/\"2 Credits\"), trial-FAQ (\"you have 10 credits to use for AI Bullet Generation\"), Using AI: Bullets (\"5 credits to use for AI bullet generation\"), and Using AI: Professional Summary (\"2 credits to use for Professional Summary AI generation\" -- a document NEITHER pass opened, found and read live by this adjudicator 2026-08-16) -- states only a total allowance per named feature. None states a conversion (\"1 credit = 1 bullet\" or equivalent). Using AI: Bullets and Using AI: Professional Summary both additionally describe ONE generation action returning THREE output options (\"you will see three options appear\"), so even an inferred 1:1 rate has no textual basis -- only \"N credits per named feature\" is stated. Pass 2's \"yes\" read the feature-earmarking itself (credits labeled \"for Resume Bullets\") as if earmarking supplied the definition; rule 5's closing clause (\"whatever the output it is attached to\") forecloses exactly that reading." }
  credit_to_output_rate_published: { value: "no", source: "https://www.tealhq.com/pricing", evidence: "DISPUTED, RESOLVED against pass 2's \"yes\" (confirms pass 1), following directly from credit_unit_defined: if no document states a rate for ANY output, not even a secondary one, no rate is published for the principal output either, which is all this variable tests. Pass 2's \"yes\" rested on the same allowance-as-rate misreading corrected on credit_unit_defined." }
  credit_rate_location: { value: absent, source: "https://www.tealhq.com/pricing", evidence: "DISPUTED, RESOLVED against pass 2's \"multiple\" (confirms pass 1). Variable's own rule: \"Where no rate is published, code absent ... multiple is for agreement across classes [of a published rate], not disagreement.\" credit_to_output_rate_published establishes no rate is published anywhere, so there is no rate whose location could be \"multiple\"; pass 2's \"multiple\" counted credit ALLOWANCES appearing in several documents as if that were a published RATE appearing in several documents." }
  cost_per_output_unit: { value: per_seat_month, source: "https://www.tealhq.com/pricing", evidence: "Teal+ sells unmetered access -- every AI-credit row and every platform feature reads \"Unlimited\" at the entry tier -- rather than a countable artifact; codebook rule 2: unmetered software prices per_seat_month. Not disputed." }
  cost_per_output_computable: { value: "yes", source: "https://www.tealhq.com/pricing", evidence: "Entry tier price ($79/90 days) converts to a monthly seat price with no usage assumption, since the paid tier is flat-fee/unmetered. Not disputed; both passes flagged the same judgment call (no codebook worked example covers an unmetered per_seat_month entry tier specifically) -- flag carried through since it does not change the coded value either coder reached." }
  computation_assumptions: { value: "Entry tier Teal+ Quarterly, $79 billed every 90 days (default display state, no toggle). Teal+ is unmetered -- every AI-credit and platform-feature row reads \"Unlimited\" -- so there is no per-output allowance to divide by; unit = per_seat_month and the monthly-equivalent subscription price is itself the cost-per-output figure (codebook's unmetered-access rule). Conversion: 90 days treated as 3 x 30-day months, 79 / 3 = 26.33/mo (equivalently 79 x 30/90 = 26.33). Pure period arithmetic on the vendor's own published $79/90-day figure; no usage assumption required. Both passes performed the identical arithmetic and reached the identical $26.33/mo figure by equivalent routes (divide by 3 vs. multiply by 30/90); reconciled into one statement here, not a substantive disagreement -- disagreements.py tags this field PROSE because free-text arithmetic write-ups never match verbatim, not because the numbers differed.", source: "https://www.tealhq.com/pricing", evidence: "not_applicable" }
