coder_note: |
  ADJUDICATION SUMMARY, 2026-08-16 (protocol §7.4). tools/disagreements.py reports 4 substantive
  disagreements for teal (free_plan_cap_value, credit_unit_defined, credit_to_output_rate_published,
  credit_rate_location) plus 1 prose-only difference (computation_assumptions -- not a scored
  disagreement; both passes did the same arithmetic and reached the identical $26.33/mo figure by
  equivalent routes, reconciled into one statement above). All 4 substantive disagreements were
  resolved by applying the codebook decision rule to the evidence in both passes' own saved source
  captures, independently re-verified live on 2026-08-16. 3 of the 4 resolved to pass 1's value over
  pass 2's. The 4th, free_plan_cap_value, resolved to a value textually closest to pass 1's but not
  identical to what either coder wrote verbatim in the adjacent free_plan_cap_documented evidence.
  Majority was not used to decide anything, per protocol -- each item below is decided by the rule,
  not by which pass agreed with which.

  REGISTER CHECK, done before classifying anything, per instruction. Both records carry
  register_events: [] -- no vendor_edit, no display_variant, in either pass. This adjudicator's own
  live re-read (2026-08-16) of the pricing page found it unchanged in every relevant figure from pass
  2's 2026-08-15 capture, so no edit occurred between pass 2 and today either. Section 7.4.1 requires
  a vendor_edit register entry for date_explained; section 7.4.2 requires two archive snapshots of
  two DISPLAY states for variant_explained. Neither exists for any of the 4 disagreements below --
  all four are ORDINARY disagreements, resolved on the merits, not classified as date_explained or
  variant_explained.

  1. free_plan_cap_value -- RESOLVED to "10 resume templates | top 5 keywords per job description |
     1 email template per job stage | 10 AI bullet-generation credits | 2 AI professional-summary
     credits | 2 AI cover-letter credits" (full reasoning in the variable's own evidence field
     above). In short: pass 1's fuller list is correct. Pass 2's own saved source captured the same
     "10 resume templates" figure on the rank-1 pricing page and even flagged it in a bracketed note,
     but pass 2's composed value dropped it anyway -- a coverage-inside-a-document lapse, not a
     documents-disagree case, so it is restored rather than treated as a genuine disagreement to
     split the difference on. The separate 10-vs-5 Resume-Bullets-credit split is NOT part of this
     disagreement: both passes already, independently and correctly, resolved it by codebook §3 (the
     pricing page ranks first for free-tier/credit variables and states 10; two lower-ranked
     help-center articles state 5 and are logged in conflict_note). That is a hierarchy-resolved case
     under the decision tree's step 3, not two equal-authority sources, so `conflicting` does not
     apply -- the pricing page's rank is dispositive regardless of how the lower-ranked documents
     split among themselves (2 of 4 total documents say 10, 2 say 5, but one of the "10" documents
     outranks all four "5"/"10" help-center documents combined).

  2. credit_unit_defined -- RESOLVED "no" against pass 2's "yes" (confirms pass 1). Codebook rule 5:
     stating a total credit allowance per feature is not a definition, "whatever the output it is
     attached to." No Teal document -- not the pricing page, not the trial-FAQ, not Using AI:
     Bullets, not Using AI: Professional Summary (the last found only by this adjudicator, unopened
     by either pass) -- states a conversion rate; all four state only "N credits for [named
     feature]." Two of the four documents additionally describe one credit-consuming action
     returning THREE output options, which forecloses even an inferred 1:1 reading. Full reasoning
     and quotations in the variable's own evidence field above.

  3. credit_to_output_rate_published -- RESOLVED "no" against pass 2's "yes" (confirms pass 1), as a
     direct consequence of item 2: no rate published for any output means no rate published for the
     principal output specifically, which is all this variable tests.

  4. credit_rate_location -- RESOLVED "absent" against pass 2's "multiple" (confirms pass 1), as a
     direct consequence of item 3: with no rate published anywhere, there is no rate location to be
     "multiple" -- pass 2 counted allowance figures appearing in several documents as if that were a
