  - { url: "https://one.google.com/about/plans", kind: pricing, accessed: "2026-08-07", archive: "https://web.archive.org/web/20260807100413/https://one.google.com/about/plans", note: "Second official Surface-A page. States Google AI Plus at $9.99/mo (2 TB) against the /intl/en_us/ page's $4.99/mo (400 GB) for the same plan name -- an internal conflict within Surface A, independent of the entry-tier question. Pass 1's own D-009 re-read (google-veo-sources/d009-reread-2026-08-10.md) reconfirmed both figures in three representations each on 2026-08-10." }
