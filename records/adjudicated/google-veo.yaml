default_display_state: >
  Google Veo has no dedicated pricing page of its own, which is the finding this record turns on
  (see coder_note). Two distinct, non-equivalent, official, self-serve, non-sales-gated surfaces
  exist. Surface A, one.google.com/intl/en_us/about/google-ai-plans/ (US-locale, USD): a
  Google AI Plus/Pro/Ultra subscription-card ladder, Monthly preselected on load, that bundles
  storage/Gemini chat/Docs-Gmail AI/YouTube perks/image-music generation/coding agents with shared
  "Flow credits" partly spendable on Veo generation via the separate Google Flow app. A second
  official page for the same ladder, one.google.com/about/plans, geo-localizes to TRY by default
  from a Turkey network location -- a display_variant under D-003, resolved to the page's own USD
  figures per that rule -- and states a different price for the same-named "Google AI Plus" plan
  than the /intl/en_us/ page does (see conflict_note). Surface B, ai.google.dev/gemini-api/docs/pricing:
  the Gemini Developer API's Veo rate card, no monthly/annual toggle, per-second USD metering only,
  auto-translated UI shell (Turkey geolocation) with prices always printed in USD regardless. Both
  re-verified live 2026-08-15; both match what pass 1 (2026-08-07) and pass 2 (2026-08-15) recorded,
  no material vendor change found.
