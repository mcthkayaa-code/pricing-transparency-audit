default_display_state: |
  Pricing page loads with the Monthly/Yearly toggle defaulting to Yearly (both prior passes
  confirm independently: pass 1 via live browser render, for-cause via the DOM's active-class
  attribute on the Yearly button). Starter card (entry tier): "$24" "/mo" with "billed $290
  yearly" beneath, in the same price block, no struck-through comparison price. Growth/
  Influencer/Ultra show their own current+struck annual figures. A fifth, sales-gated
  "Enterprise" tile follows ("Contact Sales", no figure). No $0/Free tier card renders in this
  or any observed state (the page's own component code sets hideFreePlan=true; confirmed
  structurally by both passes and not disputed). USD throughout; no region/currency selector
  observed.

sources:
  - { url: "https://faceless.so/pricing", kind: pricing, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806101148/https://faceless.so/pricing", note: "PRIMARY SOURCE. Rendered plan cards (script-hydrated, cross-checked below) plus a 9-item native <details> FAQ whose answer text sits in the DOM regardless of open/closed state -- confirmed directly in pricing-raw.html, no JS execution required. None of its 9 items mentions refunds. Item 4: 'Can I cancel my subscription anytime? Yes, you can cancel your subscription at any time. There are no long-term commitments.' Item 6: 'Do you offer a free trial? We don't offer a traditional free trial at the moment, but we have competitive pricing and a satisfaction guarantee.' Item 5 names the billing page as the route to view usage. Hero banner, plain server HTML: 'Get 2 months free on yearly pricing. You can cancel your subscription at anytime.'" }
  - { url: "https://faceless.so/", kind: other, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806101044/https://faceless.so/", note: "Home page. Duplicates the pricing grid and carries a 17-item FAQ accordion (categories Getting Started/Monetization & Ownership/Features/Billing & Pricing) built by a component the chunk below exports as FAQAccordion. In this window capture the 17 questions render as visible <button aria-expanded=\"false\"> labels (server-rendered, present in home-raw.html with no JS needed) but the ANSWER text is absent from this document entirely -- confirmed by exhaustive substring search for known answers, all misses. See the js-chunk source below for why this still counts as disclosed. Every 'free' mention on this page (checked exhaustively) is either 'Sign up free, no credit card' (account signup) or 'Get 2 months free on yearly pricing' (annual-discount framing); none describes an ongoing no-cost product allowance." }
  - { url: "https://faceless.so/terms", kind: tos, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806101418/https://faceless.so/terms", note: "Terms of Service, 9 short sections, read in full by this adjudicator directly (not just by the prior passes' account of it). Zero occurrences of refund/cancel/renew/subscription/billing/credit/watermark/commercial/payment anywhere (grep-confirmed against the full text). Section 3 lists prohibited conduct only (illegal use, hacking, impersonation) -- no discretionary usage-volume clause. Section 4 (IP) covers the Service's own platform content, not user-generated video output." }
  - { url: "https://faceless.so/developers/docs/credits-and-limits", kind: docs, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806101721/https://faceless.so/developers/docs/credits-and-limits", note: "Read in full by this adjudicator. Every video generation is charged from credits obtained either from 'a plan's monthly grant or a one-time top-up' (both paid); 'teams without a subscription have no project cap; they are metered purely by credits' -- i.e. usable ONLY once credits exist, and no free/bonus credit grant is described anywhere for a non-paying signup. States the 402/403 error semantics; ledger records 'purchases, subscription grants, spends and refunds' with no rollover/expiry statement and no failed-generation charge statement." }
  - { url: "https://faceless.so/developers/docs/videos", kind: docs, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806101741/https://faceless.so/developers/docs/videos", note: "Read in full. Model/credit table: storyboard 20, motion_lite 50, motion_pro 100 credits, user-selected via the model field. Failures reported via status polling ('failed', errorMessages); 'DELETE /videos/{id}: permanent, no credit refund' covers user-initiated deletion, not a technical failure." }
  - { url: "https://faceless.so/developers/docs/series", kind: docs, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806101856/https://faceless.so/developers/docs/series", note: "Confirms per-episode credit cost matches a single video; frames the model-cost span as '20 to 100 credits'." }
  - { url: "https://faceless.so/developers/docs/errors-and-rate-limits", kind: docs, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806101915/https://faceless.so/developers/docs/errors-and-rate-limits", note: "'usage_limit_reached (403): the team's plan caps its number of video projects and the cap is hit', no figure given for any plan -- the discretionary clause used for unquantified_limit_clause and to qualify the pricing page's 'Unlimited' claims." }
  - { url: "https://faceless.so/developers/docs/getting-started", kind: docs, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806102011/https://faceless.so/developers/docs/getting-started", note: "Read for completeness; no additional coded facts beyond the other developer-docs pages." }
  - { url: "https://faceless.so/developers", kind: docs, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806102030/https://faceless.so/developers", note: "Developer hub/landing page; discovery only." }
  - { url: "https://faceless.so/warmed-accounts", kind: other, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260806102128/https://faceless.so/warmed-accounts", note: "Separate, distinctly-priced optional add-on (managed social accounts, from $49.90/account/month). Not required for the Starter tier as advertised; confirms mandatory_addon_present=no (agreed value, not disputed)." }
  - { url: "https://faceless.so/billing", kind: other, accessed: 2026-08-17, archive: archive_failed, note: "307-redirects to /login (NextAuth). Authenticated in-app billing dashboard, not a public document -- not opened, per protocol 6.3. CDX query against the public index (run 2026-08-17) returns an EMPTY result set for this path at any date: confirmed independently by this adjudicator, not merely asserted by either prior pass. This page has never been publicly archivable, consistent with being a structurally login-gated route rather than an uncaptured one." }
