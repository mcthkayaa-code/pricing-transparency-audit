  auto_renewal_default: { value: unknown, source: "https://faceless.so/terms", evidence: "DECIDED. Disputed: pass1=on (flagged by pass1 itself as a judgment call), for-cause=unknown. Rule applied: decision rule 1 (terms rank first) + rule 2, read against rule 4's own distinction between a document that STATES automatic renewal and one that merely IMPLIES a fixed term. This adjudicator read the full Terms of Service directly: zero occurrences of renew/cancel/subscription/billing/recurring anywhere (confirmed by grep against the complete text, independently of either prior pass's account). The only billing-continuity language anywhere is cancellation-framed: pricing-page FAQ 'you can cancel your subscription at any time; there are no long-term commitments'; home-FAQ 'you can cancel anytime... your plan stays active until the end of the billing cycle.' This describes what happens on CANCELLATION, not an affirmative statement that the subscription renews automatically absent cancellation -- rule 2's example phrase ('will automatically renew unless canceled') is not matched or closely paraphrased anywhere. Protocol 6.3 instructs coders never to close a gap by inference; reading 'subscription + cancel anytime' as necessarily meaning auto-renewal is exactly that inference, not a stated position. unknown_kind=vendor_silence (the decisive documents -- terms, pricing page, home FAQ -- were all read; none states the renewal mechanism explicitly; the account/billing dashboard that might operationally confirm it is login-gated and not part of the primary basis for this value). Value matches for-cause; reasoning is this adjudicator's own, not for-cause's access-failure framing." }
  auto_renewal_disclosure_location: { value: absent, source: "https://faceless.so/terms", evidence: "DECIDED, follows from auto_renewal_default above rather than a fresh argument. Disputed: pass1=pricing_page, for-cause=unknown. Neither prior value is used. Rule applied: the variable's own 'absent' definition -- 'all four document classes were read and none states it.' Because auto_renewal_default resolved to unknown precisely because no document STATES automatic renewal (only implies it), the same reading supports absent here: terms (terms_only class) read in full and silent; pricing page (pricing_page class) read and only implies via cancellation language; home-page FAQ and developer docs (the closest thing to a help_center_only class this vendor has) read and silent on the specific mechanism; no dedicated purchase_terms_doc page exists at all (the only candidate, the login-gated /billing dashboard, is a functional account UI, not a published policy document, and CDX-confirmed to carry no public capture of any kind -- so its absence from the readable set does not leave a class unchecked). All reachable classes were read; none states it. Matches neither prior coding." }
  renewal_notice_commitment: { value: unknown, source: "https://faceless.so/terms", evidence: "AGREED. No document (terms, pricing page, either FAQ, developer docs) makes any statement about notifying the buyer before or after a renewal charge. unknown_kind=vendor_silence. Note for the record: this evidence is phrased as an enumerated-term search ('no mention of receipts, emails, or advance-notice periods') in both prior records; this adjudicator's own full read of the 597-word Terms of Service (9 short sections, confirmed to address none of billing/renewal/cancellation/refund at all) independently corroborates the silence, so the value is not resting on the search phrasing alone." }
  refund_policy_exists: { value: "yes", source: "https://faceless.so/", evidence: "DECIDED. Disputed: pass1=yes, for-cause=unknown. Rule applied: deviations-for-adjudicators.md's caveat -- 'an embedded payload the page RENDERS still counts... the test is whether a reader sees the figure, not how the datum is stored' -- established by reading the component's own render logic in chunks/19a6e122735da195.js (verified directly by this adjudicator, not assumed): the FAQ's onClick handler sets the open-item state, and the answer panel is conditionally rendered as {n && <div>{a.answer}</div>} -- i.e. clicking the question (a plain, permitted read action under protocol 6.3, 'may... expand an accordion') DOES insert a.answer into the visible DOM, drawing on the SAME array already loaded via the page's own <script src>. This is a working, functioning FAQ (the 17 questions are server-rendered as visible buttons in the window capture; only the click-revealed answer text is deferred), not 'a feature table no page ever displayed.' For-cause's unknown rested on applying the mid-task rule (A-019) without this caveat, which the deviations doc names as one of the two failure modes this exact rule produces. The rendered answer, verified in the window-dated chunk: 'What is the refund policy? Signing up is free and lets you explore the platform before paying, and you can cancel a paid plan anytime. Because each video consumes paid GPU generation the moment it's created, we're unable to refund plans once credits have been used; your subscription simply remains active until the end of the billing period.' Decision rule 2: this is a determinate statement, not a gap. Not no_refunds_stated (rule 2's own test, 'all sales are final' language): the denial is explicitly conditioned on credit usage, implying availability before that condition is met. Matches pass1." }
  refund_window_days: { value: unknown, source: "https://faceless.so/", evidence: "AGREED (not disputed; both passes reached unknown, though for-cause's route there was structural rather than substantive). Now resting on refund_policy_exists=yes above: the refund answer conditions eligibility on credit usage, not on a stated day-count, and no document anywhere publishes a numeric refund window for Starter or any tier. unknown_kind=vendor_silence." }
  refund_conditions: { value: conditional, source: "https://faceless.so/", evidence: "DEPENDENT on refund_policy_exists=yes above; not re-argued. Disputed: pass1=conditional, for-cause=unknown. 'we're unable to refund plans once credits have been used' is a stated usage-based condition, directly matching the codebook's own Vendor R example ('provided fewer than 20 credits have been used' -> conditional). Matches pass1." }
  cancellation_self_serve: { value: self_serve_documented, source: "https://faceless.so/", evidence: "DECIDED on the same mechanism finding as refund_policy_exists above (the home-page FAQ's answer text is disclosed once the accordion is clicked). Disputed: pass1=self_serve_documented, for-cause=unknown. Home-FAQ answer to 'Can I cancel my subscription anytime?', verified directly in the window-dated chunk: 'Yes, you can cancel anytime with two clicks from the billing page. There are no long-term commitments, and your plan stays active until the end of the billing cycle.' This names a specific self-serve route (the account's own billing page, no email/ticket/call), corroborated by developer docs: 'top up or upgrade in the dashboard at https://faceless.so/billing.' The uncontroversially-rendered pricing-page <details> FAQ confirms cancellation is possible ('Yes, you can cancel your subscription at any time') but, alone, does not name the route -- the home-FAQ text is what actually decides this variable. Matches pass1." }
  refund_policy_location: { value: help_center, source: "https://faceless.so/", evidence: "DECIDED. This is the JUDGMENT CALL pass1 itself flagged: the refund statement sits on the home page, not the literal /pricing URL, and the value list has no 'other official vendor page' class distinct from the four named ones. Disputed: pass1=pricing_page (its own flagged best-fit), for-cause=unknown (cascading from its refund_policy_exists=unknown, now resolved above). Neither prior value is used. Rule applied: protocol 6.2's contractual-variable authority table, which folds 'billing and order help articles' into the documentation/help-center class (rank 2), distinct from the live pricing page (rank 3) and from 'other official vendor pages' (rank 4, which the value list does not separately offer). The home-page FAQ is a categorized Q&A resource (Getting Started/Monetization & Ownership/Features/Billing & Pricing) answering support-style questions -- textbook help-center content in form and function, even though hosted on the home page rather than a separate /help URL. Coding it pricing_page would also be internally inconsistent with how this SAME record uses pricing_page elsewhere (credit_rate_location, annual_condition_disclosure) to mean strictly the literal /pricing URL, where this content does not in fact appear -- confirmed directly: pricing-raw.html's own 9-item <details> FAQ contains zero occurrences of 'refund'. help_center is the closest fit that does not overstate proximity to the price the buyer is looking at. Only one document states a refund position at all (no 'multiple'). Matches neither prior coding; flagged as a genuine instrument gap worth a named 'other vendor page' value in a future codebook version." }
  commercial_use_lowest_tier: { value: lowest_paid, source: "https://faceless.so/pricing", evidence: "DEPENDENT on free_plan_exists=no above; not re-argued. Disputed: pass1=free, for-cause=lowest_paid. Home FAQ and pricing-page <details> FAQ both state unqualified, tier-independent grants ('you fully own the rights to all videos, including commercial use' / 'Yes. You fully own the rights to all videos.'). With no free tier to attach 'free' to, the grant applies from the lowest tier that exists, which is the entry paid tier, Starter. Matches for-cause." }
  watermark_removal_tier: { value: no_watermark, source: "https://faceless.so/pricing", evidence: "DEPENDENT on free_plan_exists=no above; not re-argued. Disputed: pass1=lowest_paid, for-cause=no_watermark. Rule applied: decision rule 1, 'no_watermark means documents state that no tier applies a watermark.' 'No watermark' is listed as an included feature on all four published, generally-available tiers (Starter/Growth/Influencer/Ultra); with no free tier to leave unstated, every tier the documents publish a feature list for says no watermark. (Enterprise is sales-gated with no published feature list either way and is not treated as a tier for this purpose, consistent with how it is excluded from entry-tier selection.) Matches for-cause." }
  output_ownership_statement: { value: user_owns, source: "https://faceless.so/pricing", evidence: "AGREED. Home FAQ, pricing FAQ, and pricing-page benefits list ('100% content ownership') all state unqualified ownership. Terms of Service Section 4 (independently read in full by this adjudicator) covers the Service's own platform IP, not user-generated output -- silence, not a competing statement, so no override scenario applies." }
  usage_cap_quantified: { value: some_quantified, source: "https://faceless.so/pricing", evidence: "AGREED. '500 Credits /month' (quantified rate) and '3 Team Members' (quantified standing limit) are numbered; 'Unlimited Series/Exports/Custom Templates' are qualified by the developer docs' unquantified project-cap clause (rule 3 of usage_cap_quantified), so the unlimited claims do not count as quantified." }
  unquantified_limit_clause: { value: present, source: "https://faceless.so/developers/docs/errors-and-rate-limits", evidence: "AGREED, and both passes read (not merely searched) the terms in full per the variable's own rule 1: the ToS itself carries no discretionary-use clause, but the developer docs do -- 'usage_limit_reached (403): the team's plan caps its number of video projects and the cap is hit' (errors-and-rate-limits, corroborated verbatim in videos and credits-and-limits) -- no figure given for any plan. This is the exact failure mode the study's own guidance warns adjudicators to check for (a keyword search missing a clause under different words); both passes instead found it, correctly, by reading the developer docs even after the ToS came up empty." }

coder_note: |
  ADJUDICATION SUMMARY, dated 2026-08-17. Read protocol 7.4/7.4.1/7.4.2 and the full
  deviations-for-adjudicators.md (including its FAQ-rendering caveat, which bears directly on
  this product) before starting. 13 of 36 comparable variables were disputed between
  records/pass1/faceless-so.yaml and records/for-cause/faceless-so.yaml. All 13 were resolved by
  applying a codebook decision rule to the evidence (none left as an adjudicator "cannot
  determine" punt); one of the 13 resolves TO the value unknown (auto_renewal_default) as the
  correct SUBSTANTIVE finding under the rule, which is different from an unresolved disagreement.
  Zero of the 13 qualify for date_explained (no vendor_edit register entry; both passes worked
  from the same window-dated document set with no page change between them) or variant_explained
  (no two archive snapshots showing two different display states -- this was a
  reading/interpretation dispute, not a display-state dispute). Neither classification was reached
  for to improve a figure; both were checked and ruled out explicitly.

  UPSTREAM JUDGMENTS VS CASCADES: of the 13, only 4 were genuinely independent judgments; the
  other 9 are mechanical dependents that followed once the upstream question was decided, and are
  marked DEPENDENT in their own evidence rather than re-argued.
    (1) free_plan_exists (independent) -> drives free_plan_cap_documented, free_plan_cap_value,
        free_plan_watermark, free_plan_duration (4 direct dependents under the B1/B2 matrices)
        AND commercial_use_lowest_tier, watermark_removal_tier (2 indirect dependents, since
        both variables' lowest-tier answer changes once there is no free tier to attach "free"
        to). 7 variables total from one decision.
    (2) auto_renewal_default (independent) -> drives auto_renewal_disclosure_location (1
        dependent). 2 variables from one decision.
    (3) whether the home-page FAQ (JS-chunk-sourced, answers absent from the window capture,
        present only via a directly-loaded, separately-fetched chunk) counts as disclosure
        (independent, the deviations-doc caveat) -> drives refund_policy_exists, which in turn
        drives refund_conditions (dependent) and contributes to cancellation_self_serve (parallel
        dependent, same mechanism, different quoted text). 4 variables from one decision.
    (4) refund_policy_location's own classification among pricing_page/dedicated_refund_page/
        terms/help_center (independent judgment even once (3) is resolved, since resolving (3)
        only established THAT the home page carries the statement, not WHICH of the four listed
        classes it belongs to). 1 variable.
  4 independent judgments account for all 13 disputed values (7+2+4 dependents = 13).

  MECHANISM FINDING, verified directly by this adjudicator rather than taken on trust: the home
  page's FAQ accordion (chunks/19a6e122735da195.js, component exported as "FAQAccordion") holds
  17 {question,answer} pairs across 4 categories (Getting Started 5 / Monetization & Ownership 5 /
  Features 3 / Billing & Pricing 4). In the window capture the 17 questions render as visible,
  server-rendered <button aria-expanded="false"> labels; the answer text is absent from the
  served document in any form (confirmed by exhaustive substring search, zero hits for any known
  answer). Reading the component's own render logic (not merely its data) shows the answer is
  conditionally mounted -- {n && <div>{a.answer}</div>} -- on the SAME click handler that toggles
  aria-expanded, drawing on the array already loaded via the page's own <script src> (not a
  lazy/on-click network fetch). A reader who clicks a question, a plainly permitted action under
  protocol 6.3, sees the answer. This is the "working FAQ whose answers a capture had not
  expanded" case the deviations doc names, not the "feature table no page ever displayed" case --
  and both cases turned out to be live on this one product, on the SAME rule, in opposite
  directions (see below). Confirmed independently and out of caution: a plain curl of the live
  page TODAY (2026-08-17, well after the window) now returns the same answer text directly in
  static markup with no JS -- the vendor re-implemented the component to server-render after the
  window closed. This is evidence about today, not about the window, and no coded value here
  rests on it; it is recorded only because it corroborates, from the opposite direction, that the
  window-dated mechanism genuinely gated on rendering rather than on account-side content that
  was never going to appear at all.

  TWO TRAPS IN THE SOURCE SET, both checked directly rather than taken on either prior record's
  word: faq_home_raw_segment.txt is a saved copy of the SAME array found directly in the chunk,
  in unquoted-key object-literal form -- it is not itself evidence of rendering, and this
  adjudicator's conclusion above rests on reading the component's render LOGIC in the chunk, not
  on this segment file's mere existence. chunks/584c5016af948b8b.js holds several stale/historical
  "Starter" pricing objects at unrelated prices ($390/yr, $264/yr x2, $168/yr) alongside the live
  version-6 object (24/290/500 credits, name suffixed "(annual)"); both prior passes and this
  adjudicator independently confirm the live object is the one actually rendered, and none of my
  disputed-variable resolutions rest on a stale object.

  CITATION VERIFICATION (deviations-for-adjudicators.md's standing duty): all archive URLs cited
  by pass1 for the three JS chunks 302-redirect to a capture at a different (but real, CDX-listed,
  content-matching) timestamp -- verified via curl and the CDX API, not assumed. This is NOT the
  "fabricated provenance" failure mode (a capture that does not exist and a quote that appears
  nowhere): a genuine capture exists in every case and its content matches what both records
  quote. It is a citation-precision issue (submission/completion timestamp logged instead of the
  timestamp archive.org actually assigned), corrected in this record's sources list to the
  CDX-verified timestamps. Also corrected: for-cause's archive_failed flag on /privacy, which
  reflects a transient archive.org 503 on for-cause's own 2026-08-17 access attempt -- two real,
  working, window-dated captures of /privacy exist (CDX-confirmed) and pass1's original archive
  reference for it resolves directly with no redirect. /billing itself is confirmed, via CDX, to
  have never had any public capture at all (empty result set), consistent with being a genuinely
  login-gated route rather than merely an uncaptured one.

  DIRECTION OF ERROR: the two passes' errors ran in OPPOSITE directions on different clusters, not
  a single consistent bias. Pass1 over-credited disclosure on 9 of the 13 (the free-plan family
  and its 2 domain-11 dependents, plus the auto-renewal pair): it read a never-rendered, explicitly
  suppressed data object and a refund-FAQ's incidental opening clause as establishing a free plan,
  and read implication as if it were a stated renewal position. For-cause under-credited disclosure
  on 4 of the 13 (refund_policy_exists and its dependents/parallel, refund_conditions,
  cancellation_self_serve): it applied the mid-task anti-unrendered-markup rule (A-019) literally,
  without the caveat that a component which DOES render its payload on a permitted click is not
  the same as one that never displays it, on content that this adjudicator's reading of the actual
  component logic shows does render. Of the 13, this record matches pass1's value on 3
  (refund_policy_exists, refund_conditions, cancellation_self_serve), matches for-cause's value on
  8 (the free-plan family x5, both domain-11 dependents, auto_renewal_default), and matches
  NEITHER prior value on 2 (auto_renewal_disclosure_location=absent,
  refund_policy_location=help_center) -- both explained above rather than split the difference.

  KEYWORD-SEARCH-VS-READING AUDIT (requested mid-task by the coordinator, covering agreed values
  too, not only the 13 disputed): this adjudicator independently re-read, in full, terms-clean.txt,
  credits-limits-clean.txt, docs-videos-clean.txt, and pricing-raw.html's <details> FAQ, rather
  than relying on either prior record's account of them. unquantified_limit_clause (agreed,
  present) and usage_cap_quantified (agreed, some_quantified) are the two variables this study
  flags as highest-risk for a keyword-search miss; both passes correctly found the discretionary
  clause in the developer docs by reading them, after the ToS itself (also read, not skimmed) came
  up genuinely empty -- confirmed independently, no reversal needed. renewal_notice_commitment
  (agreed, unknown) is evidenced in both prior records as an enumerated-term search ("no mention
  of receipts, emails, or advance-notice periods") rather than a description of a reading; this
  adjudicator's own full read of the short, silent Terms of Service independently corroborates the
  same silence across the whole billing/renewal domain, so the value stands, but the phrasing
  itself is the weaker kind of evidence and is flagged as such in that variable's own evidence
  field above. credit_rollover_policy and failed_generation_charge_policy (both agreed, unknown)
  are similarly phrased around "zero mentions of X" but both records also quote and reason about
  what the ledger documentation DOES say (the surrounding context), which this adjudicator
  independently re-confirmed by reading credits-limits-clean.txt and docs-videos-clean.txt in
  full; no reversal warranted. No agreed value in this record was found resting on search evidence
  this adjudicator judges insufficient to reverse.

  ADMINISTRATIVE FIELDS: category, product_status, and paid_submission are confirmed against
  frame-for-pass2.csv directly by this adjudicator (Faceless video / active / no), which for-cause
  could not do under its own assignment's scope restriction and correctly declined to guess.

  blindness: no other product's record was opened at any point in this adjudication, in any
  folder. Only record-template.yaml was used for record shape.
