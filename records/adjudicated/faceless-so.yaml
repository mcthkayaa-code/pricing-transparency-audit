  - { url: "https://faceless.so/_next/static/chunks/43c08182ba11fb82.js", kind: other, accessed: 2026-08-06, archive: "https://web.archive.org/web/20260805195137/https://faceless.so/_next/static/chunks/43c08182ba11fb82.js", note: "Pricing-page chunk: plan-card component (selects subscriptionPlans[6] as live) and the /pricing page's own FAQ text. CITATION CORRECTION as above: pass 1's cited .../20260806102227/... 302-redirects to this timestamp (one day earlier; content is byte-identical across both of the CDX-listed captures of this hash-named file, digest WALCLBTTFCZEDFN5IH75MWYHGSBIVM3O -- Next.js chunk filenames are content hashes, so any capture of this exact filename is guaranteed the same bytes). Verified directly: contains 'subscriptionPlans[6]' and the 'We don't offer a traditional free trial' text." }
