  free_plan_cap_documented: { value: all_quantified, source: "https://www.udio.com/pricing", evidence: "AGREED. '10 credits per day and 100 credits per month (no rollovers)'; 'Generate up to 4 songs at the same time' (Compare Plans table: '2 (4 songs)'); 'Limit of 3 full length (2:10s) song generations per day' -- all carry a number, a dimension, and a period where rate-type, per codebook 5.1." }
  free_plan_cap_value: { value: "10 credits per day | 100 credits per month | 2 simultaneous generations (4 songs) | 3 full length (2:10s) song generations per day", source: "https://www.udio.com/pricing", evidence: "ADJUDICATED 2026-08-16 under this variable's own definition ('verbatim in structure') and decision rule ('record only quantified limits'). The Free plan's simultaneous-generation cap is stated in two places on the same page, confirmed CONSISTENT rather than conflicting once read together: the Free card's own bullet ('Generate up to 4 songs at the same time') and the Compare Plans table's row ('Simultaneous song generation limit: 2 (4 songs)'). The credits-and-credit-limits article's mechanism reconciles them -- 'Every time you click Create...two new songs are created' -- so 2 concurrent generations x 2 songs/generation = 4 songs, the same fact at two levels of granularity, not two competing figures. Verified directly: pass 2's local capture (records/pass2/udio-sources/pricing-page-2026-08-15.txt) contains BOTH figures exactly as quoted, including pass 1's own '4 songs at the same time' text, confirming pass 1's number is accurate but incomplete rather than wrong. Pass 1's transcription ('4 songs simultaneous generation') keeps only the card's number, drops the table's '2' entirely, and is verbatim to neither source's actual wording; pass 2's transcription is verbatim to the table cell it cites and loses nothing. The fourth clause is not a substantive difference -- '130-second (2:10)' and 'full-length (2:10s)' name the same limit -- carried through in the card's own exact wording. Prior values: pass1='10 credits per day | 100 credits per month | 4 songs simultaneous generation | 3 130-second (2:10) songs per day', pass2='10 credits per day | 100 credits per month | 2 simultaneous generations (4 songs) | 3 full-length (2:10s) songs per day'." }
  free_plan_watermark: { value: unknown, source: "https://www.udio.com/pricing", evidence: "AGREED. No document (pricing page, ToS, help center) states that free-plan audio output carries an embedded watermark or vendor mark. ToS 6.4's non-subscriber self-attribution requirement (crediting Udio in track metadata when publicly sharing) is a contractual duty on the user's future conduct, not a mark applied to the output file, so it is not treated as satisfying the construct (both passes agree on this distinction)." }
  free_plan_duration: { value: perpetual, source: "https://www.udio.com/pricing", evidence: "AGREED. Free is presented as a standing plan alongside Standard/Pro with a recurring daily/monthly credit cycle; no expiry stated anywhere in the documents." }

  # --- Domain 4 ---
  trial_exists: { value: "yes", source: "https://help.udio.com/en/articles/13338649-the-subscription-trial", evidence: "AGREED. 'All creators have the one-time option to initiate a free trial of Udio's Standard subscription.' Also a trial CTA on the pricing page's Standard card." }
