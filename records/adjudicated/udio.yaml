coder_note: |
  ADJUDICATION SUMMARY (2026-08-16). tools/disagreements.py udio finds 3 substantive disagreements
  (free_plan_cap_value, cost_per_output_unit, auto_renewal_disclosure_location) plus 1
  non-substantive prose mismatch (computation_assumptions -- both passes agree
  cost_per_output_computable=yes but wrote different arithmetic, downstream of the
  cost_per_output_unit split). All 3 resolved by rule; 0 became unknown; 0 date_explained; 0
  variant_explained; not_applicable was not reachable on any of the 3 disputed variables for this
  product, so the not_applicable/unknown boundary did not come into play here. Two of the three
  (free_plan_cap_value, cost_per_output_unit) needed a live-document check beyond what either
  coder's own evidence field quoted, because pass 1 saved no local source captures at all
  (records/pass1/udio-sources/ is empty) and this assignment's own instructions require verifying a
  cited capture before resolving a disagreement in its favour.

  REGISTER EVENTS. Both pass1.yaml and pass2.yaml carry register_events: []. No vendor_edit entry
  exists, so no disagreement qualifies for date_explained (7.4.1) regardless of the 2-day gap
  between collection dates (2026-08-13 / 2026-08-15): this adjudicator fetched pass 1's own archived
  2026-08-13 snapshots of every document the three disagreements turn on and found the same content
  pass 2 read two days later (see CITATION VERIFICATION below), so no vendor edit occurred inside
  the window. No disagreement qualifies for variant_explained (7.4.2) either: both passes agree on
  the pricing page's default display state (Annually + USD preselected), and neither disputed
  variable turns on a different display state being served -- both coders read the same numbers off
  the same page and disagreed only in how to transcribe or classify them.

  CITATION VERIFICATION, done first because pass 1 saved zero local source captures. Fetched all of
  the following directly, 2026-08-16 (curl, since the WebFetch tool itself refuses
  web.archive.org): pass 1's archived pricing page (20260813085541) -- confirmed SHELL-ONLY, 53
  characters of visible text, title only, the SAME limitation pass 2 separately disclosed for its
  own 20260815133306 snapshot of the identical URL; pass 1's archived credits-and-credit-limits
  article (20260813085657) -- confirmed full text matches pass 1's quotations exactly and matches
  pass 2's own 2026-08-15 local capture of the same article verbatim; pass 1's archived
  changing-or-canceling-your-subscription article (20260813085734) -- confirmed the quoted phrase
  ("subscription renews every 1st of the month") is genuine, appearing twice, inside two proration
  worked EXAMPLES, never as a general renewal statement; pass 1's archived do-credits-roll-over
  article (20260813085713) -- confirmed "Standard accounts come with a 1200 credit limit which
  resets monthly"; pass 1's archived UMG-partnership changelog (20260813090446) -- confirmed "The
  Standard subscription monthly credit limit has been increased from 1200 to 2400"; pass 2's
  archived subscription-trial article (20260815134602) -- confirmed "Their subscription will be
  renewed on Feb 10, 2027 and their card charged the then-listed-price for an annual subscription"
  is genuine and in context describes the trial's own eventual annual renewal. No citation in
