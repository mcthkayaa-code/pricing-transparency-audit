  auto_renewal_disclosure_location: { value: multiple, source: "https://www.udio.com/terms-of-service", evidence: "ADJUDICATED 2026-08-16 under domain-9's decision rule ('check all four classes...code multiple where two or more state it in agreement'). Both passes agree the Terms of Service states it (3.3). The dispute is whether a help-center article independently states it too. Pass 1 considered ONE candidate -- the changing-or-canceling article's 'subscription renews every 1st of the month' -- and rejected it as 'incidental context for proration examples, without asserting the renewal is automatic/without further action'. This adjudicator verified that citation directly: the phrase is genuine, appearing TWICE, inside upgrade and downgrade proration worked examples illustrating a billing-date calculation, stating only a renewal cadence as scene-setting -- and agrees it does not, standing alone, clear the bar pass 1 itself correctly set. But pass 1 never found or addressed pass 2's DIFFERENT citation: the subscription-trial article's worked example, 'Their subscription will be renewed on Feb 10, 2027 and their card charged the then-listed-price for an annual subscription' -- verified genuine and in context by this adjudicator. That sentence is a stronger, more direct parallel to ToS 3.3's 'automatically renew...automatically be charged': stated as the expected default outcome of the trial-to-paid conversion (contrasted immediately after with 'the edge case: payment issues' as the only other named possibility), with no user action described, it independently states the same renewal-plus-automatic-charge mechanism the ToS states, not merely a date. It clears pass 1's own bar even though pass 1 never reached it -- pass 1's own sources list includes this article (used there for trial_exists/trial_length_days/trial_auto_converts) but its auto_renewal_disclosure_location evidence never cites this sentence from it. Two classes -- terms_only and help_center -- state it in agreement: multiple. Prior values: pass1=terms_only, pass2=multiple." }
