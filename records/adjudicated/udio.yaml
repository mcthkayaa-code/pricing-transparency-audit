  credit_rate_location: { value: multiple, source: "https://www.udio.com/pricing", evidence: "AGREED. The 32-second rate plus a qualitative note on the 130-second rate appear on the pricing page; exact numeric rates for both song lengths appear in the help center -- two document classes in agreement." }
  cost_per_output_unit: { value: other, source: "https://help.udio.com/en/articles/10739134-credits-and-credit-limits", evidence: "ADJUDICATED 2026-08-16 under domain-6 rule 1 (principal output 'as its own pricing page frames it') and rule 3 ('where none of the listed units fits, code other and name the unit in coder_note'). Every official document frames Udio's output as a discrete SONG at exactly one of two fixed preset lengths -- 'Each set of two 32-second songs costs two credits', 'Each set of two 130-second songs costs four credits' (credits-and-credit-limits, re-verified genuine by this adjudicator against pass 1's own archive), 'Generate up to 4/6/10 songs at the same time', '3 full length (2:10s) song generations per day' (pricing page) -- never as a continuously-metered duration purchasable by the minute; no document states or implies a per-minute rate, and there is no third preset length a buyer could choose. Pass 1's own value (per_audio_minute) is inconsistent with pass 1's OWN evidence for the neighboring variable credit_to_output_rate_published, which identifies the principal output as 'the 130-second song', a discrete unit, not a minute-denominated one -- the record's own related values point the other way. Pass 1's stated reasoning concedes the point directly: 'Product's native unit is a discrete song of fixed length...not a continuously-purchased minute; per_audio_minute is the closest codebook unit and is used here via normalization' -- rule 1 asks how the vendor's OWN page frames the output, not which enumerated unit a coder can reach by converting fixed song-lengths into minutes, and rule 3 is the codebook's own provision for exactly this case. Named unit: 'per song (fixed preset length: ~32-second short track or ~130-second full length song)'. Prior values: pass1=per_audio_minute, pass2=other.", coder_note: "per song (fixed preset length: ~32-second short track or ~130-second 'full length' song); no listed unit covers a discrete fixed-preset-length artifact billed per unit rather than per minute of continuous duration" }
  cost_per_output_computable: { value: "yes", source: "https://www.udio.com/pricing", evidence: "AGREED. Entry tier (Standard) price, monthly credit allowance, and principal-output (130-sec song) credit rate are all published; no assumption about typical use is required. See computation_assumptions." }
  computation_assumptions: { value: "Standard tier, $8/mo (default annual display=$96/yr), 2400 credits/mo (pricing page+help center; stale 1200 in 2 places, see conflict_note). Principal output=130s song=2 credits (help center). 2400/2=1200 songs/mo. 8/1200=$0.0067/song.", source: "https://www.udio.com/pricing | https://help.udio.com/en/articles/10739134-credits-and-credit-limits", evidence: "RECONCILED 2026-08-16, downstream of cost_per_output_unit above (not itself a coded disagreement -- cost_per_output_computable is agreed 'yes' -- but tools/disagreements.py flags this field because the arithmetic differed and instructs that 'the arithmetic itself may still need reconciling'). Both passes' arithmetic is the SAME computation expressed in different units and is mutually consistent: pass 1's $0.003/min x 2.1667 min/song = pass 2's $0.0067/song (2400/2=1200 songs/mo; 130s=2.1667min; 1200x2.1667=2600 min/mo; 8/2600=0.00308 =~ 0.003/min). Rewritten in the adjudicated unit (per song) rather than per minute, and enriched to note both independently-verified instances of the stale 1200 figure (see conflict_note) rather than only the single instance each coder separately found." }

