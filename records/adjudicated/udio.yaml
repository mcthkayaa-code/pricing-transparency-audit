default_display_state: |
  Pricing page (https://www.udio.com/pricing) loads with the payment-frequency toggle defaulting to
  "Annually" and the currency toggle defaulting to "USD", confirmed via aria-checked DOM inspection
  and screenshot on both passes (pass 1, 2026-08-13; pass 2, 2026-08-15), both reads taken after
  declining non-essential cookies. No geo/consent prompt altered pricing after cookie decline on
  either read.

  ARCHIVAL LIMITATION, confirmed by this adjudicator and binding on how every price/plan value in
  this record is sourced: BOTH passes' own archive.org snapshots of this URL are pre-hydration
  shells. Pass 2 disclosed this for its own 20260815133306 capture. This adjudicator independently
  fetched pass 1's 20260813085541 capture directly (2026-08-16) and found the identical problem --
  53 characters of visible text total, the page <title> and nothing else, no price or plan content
  at all. This is the protocol's own documented limitation (limitations register item 8: "Pricing
  tables rendered by script resist public archiving"), not a fabricated or redirected citation. Both
  coders correctly performed a RENDERED browser read instead and archived what could be archived,
  per deviations-for-coders.md's D-005 rule ("A rendered read IS a documentary read"). Pass 2's local
  raw-text capture (records/pass2/udio-sources/pricing-page-2026-08-15.txt) independently reproduces
  every card figure pass 1 read two days earlier, which is the cross-check this adjudicator relied on
  for the free_plan_cap_value and cost_per_output_unit disagreements in place of a further live fetch.

