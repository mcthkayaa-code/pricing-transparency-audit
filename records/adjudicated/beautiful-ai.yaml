default_display_state: >
  USD throughout; no country/currency selector on any read (pass 1, pass 2, or this
  adjudication's re-check). Cookies declined (non-essential) in every read. The Pro (entry
  tier) card carries no monthly/annual toggle of its own and prints a static "Billed
  annually" label. The Pro price FIGURE ITSELF is under a live, ongoing, client-side A/B
  test run via a third-party script (app.optibase.io/script.js, a Webflow
  personalization/experimentation tool): the DOM node carries
  data-pricing-exp-false="$12" data-pricing-exp="true" data-pricing-exp-true="$14.50" on
  one element. Pass 1 (2026-08-07, three independent fresh loads) consistently rendered
  the "$12" branch. Pass 2 (2026-08-14, one live rendered read) rendered the "$14.50"
  branch, confirmed by that pass's own get_page_text extraction and a described
  screenshot. THE DECISIVE FACT FOR ADJUDICATION (see headline_price_usd evidence and
  coder_note): the PUBLIC ARCHIVE SNAPSHOT captured at each of three independent
  timestamps -- pass 1's 2026-08-06T23:51:27Z, pass 2's 2026-08-14T17:51:59Z, and this
  adjudication's own fresh 2026-08-16T10:12:53Z submission -- shows the IDENTICAL "$12"
  text in the archived/replayable capture every time, because web.archive.org's capture
  process preserves the raw/pre-script markup rather than executing the third-party
  Optibase script the way a live visitor's browser does. The same rendered page's own FAQ
  prose ("How much does Beautiful.ai cost?") is untouched by the experiment script and
  reads "$12/month (billed annually)" in every read, including today's. The Team card
  carries a real monthly/annual toggle that defaults to annual ($40, not $50) -- not
  disputed between passes.

