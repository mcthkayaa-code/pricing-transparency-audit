coder_note: |
  ADJUDICATION SUMMARY (2026-08-16, coder_pass 3): 4 substantive disagreements between pass 1
  (2026-08-09) and pass 2 (2026-08-14) per tools/disagreements.py. All 4 resolved by applying the
  codebook's decision rule to the documents; 0 became unknown for want of a resolving rule. One
  further field, computation_assumptions, differed in wording only (flagged PROSE by the tool, not
  counted as a disagreement) and was synthesized rather than adjudicated.

  RESOLVED BY RULE:
  - free_plan_watermark: pass 1 not_applicable, pass 2 unknown -> adjudicated unknown. Codebook
    §2.2 (not_applicable needs positive evidence of absence; mere silence is unknown) plus the
    variable's own rule, "a silent pricing table is unknown." Pass 1's "text cannot carry a
    watermark" read stretched the not_applicable carve-out past what it covers.
  - watermark_removal_tier: pass 1 not_applicable, pass 2 unknown -> adjudicated unknown, same
    rule. The variable's own not_applicable clause is scoped to output that is "not a media
    artifact a watermark could mark, for example a detection score or an analysis table" — a
    rewritten essay is not that; it is the product's deliverable.
  - refund_policy_exists: pass 1 yes, pass 2 no_refunds_stated -> adjudicated "yes". Domain 10
    rule 3 (a concrete, narrow, named refund right is still `yes`) plus internal consistency: both
    passes' own refund_conditions=conditional and refund_window_days=unknown-not-0 presuppose an
    available refund, which contradicts pass 2's no_refunds_stated under refund_conditions' own
    table ("not_applicable = No refund available"). Full reasoning in the variable's evidence
    field.
  - free_plan_cap_value: not a substantive disagreement — both passes recorded the same three
    quantified caps, differing only in cosmetic wording. Merged into one value.
  0 variables coded unknown for want of a resolving rule; all 4 disagreements were determinate
  under the codebook once read against the documents.

  DATE-DRIFT / VARIANT CHECK (§7.4 steps 7-8, §7.4.1, §7.4.2): register_events is empty in both
  prior records. A fresh live re-read on 2026-08-16 (2 days after pass 2, 7 after pass 1) found
  pricing, terms and refund-policy byte-for-byte unchanged on every disputed clause, both still
  dated "Last updated: July 29, 2026." No vendor_edit exists to classify any disagreement
  date_explained, and no snapshot pair shows two differing display states, so none qualifies
  variant_explained. All 4 are ordinary disagreements resolved on the documents alone.

  ENTRY TIER: Basic, the lowest annual-equivalent cost among three eligible standing, self-serve,
  non-seat-scaled plans (Basic $144/yr — winner; Pro $216/yr; Ultra $432/yr), per
  sampling-rules.md §7.2. Both passes agree; free tier excluded as $0/not a paid tier.

  BUNDLE DISCLOSURE: this vendor sells the humanizer coded in this record and a separate AI
  detector (frame product humanizemy-ai-detector) from one shared surface — one pricing page, one
  Terms of Service, one Refund & Cancellation Policy. Per the vendor's OWN wording, the
  Basic/Pro/Ultra tiers coded here ARE bundle tiers: the pricing page states "Every plan includes
  the full humanizer," and each of the three tiers separately lists an included "AI detection
  checks" line at the one shared price (confirmed live 2026-08-16). The FAQ distinguishes this
  bundled check from the sibling's own, separately-coded, more capable detector: "The free /detect
  page adds a trained model on top, which is what produces the verdict there." No figure specific
  to /detect, and no value from the sibling product's record, was used anywhere in this record —
  humanizemy-ai-detector.yaml was not opened. Adjudication item A-010 (whether this same shared
  tier is correctly attributed to the DETECTOR record) is a different record's question and is not
  settled here, per assignment.

  BLINDNESS-BREACH HANDLING (orchestrator D-016): pass 2's own coder_note discloses that an overly
  broad grep swept in adjudication-queue.md entry A-010 (which quotes pass-1-equivalent
  entry-tier figures for this shared surface: Basic / $12 mo / $144) and one unrelated line of
  interim-signals.md, before pass 2 coded entry_tier_name, headline_price_usd and
  first_charge_amount_usd. Those three values, plus others A-010 touches by the same reasoning
  (mandatory_addon_present, usage_cap_quantified, cost_per_output_computable,
  output_ownership_statement, commercial_use_lowest_tier), all match pass 1. Per assignment, that
  agreement carries no evidential weight here: every one of those values was re-derived from the
  saved source captures in both records' -sources/ directories and a fresh live read of
  pricing/terms/refund-policy on 2026-08-16, not accepted on the strength of the two passes
  agreeing. All check out independently — see each variable's evidence field above for the
  document-level citation. I read A-010 myself because this record's own assignment named it
  directly (bundle-disclosure note above); I did not read interim-signals.md, any other product's
  record in any pass or in records/adjudicated/, humanizemy-ai-detector.yaml, aitoolspolice.com,
  site/content/reviews/, or repository history.

  OTHER RE-VERIFICATION (agreed values checked rather than passed through on trust, per the two
  highest-risk-construct warnings for this phase): unquantified_limit_clause=absent re-verified by
  a full end-to-end read of the Terms of Service, not a keyword search — the only
  discretionary-sounding language ("refuse service to any request we believe is in bad faith," §5;
  "suspend accounts that violate these Terms," §9) is conduct-based, not a volume/intensity
  standard, so `present` is not triggered. renewal_notice_commitment=no_notice_stated re-verified:
  §3 commits to notice only before a price CHANGE, never before an ordinary renewal.

  blindness: no other product's record in any pass, and no repository history, was read. A-010 was
