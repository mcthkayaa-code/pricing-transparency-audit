  refund_window_days:
    value: 2
    source: "https://www.jobscan.co/cancellation-policy"
    evidence: "\"...within 2 calendar days of the billing period start...\". Both passes agree."

  refund_conditions:
    value: conditional
    source: "https://www.jobscan.co/cancellation-policy"
    evidence: >-
      Window of 2 calendar days, no service use in that billing period, a 3.5% processing fee, and a
