default_display_state: >-
  USD ($), no currency/region selector; three plan cards render simultaneously and permanently --
  Free / Quarterly / Monthly -- with no monthly-vs-annual or any other billing toggle anywhere on
  the page; the Quarterly card carries a "Most popular" ribbon (pass 1's screenshot-derived layout
  note) / highlighted pill (pass 2's screenshot), the same visual fact described in different words.
  No annual billing option exists. Non-essential cookies declined; read from a Turkey-egress network
  on both collection dates (2026-08-09, 2026-08-15), consistent in both. Contrast the Terms of
  Service, hosted on the same domain, which DOES localize by network geography -- see sources below
  and unquantified_limit_clause.

