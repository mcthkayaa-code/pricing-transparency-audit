      "5 Free Resume Scans monthly" (quantified rate) and "5 ATS & Recruiter Findings" (quantified
      standing limit); other listed items are unqualified feature inclusions, not limits. Both
      passes agree.

  free_plan_cap_value:
    value: "5 resume scans per month | 5 ATS & Recruiter Findings"
    source: "https://app.jobscan.co/plan"
    evidence: >-
      Verbatim, quantity+unit+period format per section 5.1. Both passes agree; pass 2 additionally
      flagged (uncoded observation, not a disagreement) that the ATS/Recruiter figure may describe
      output-per-scan rather than an independent allowance -- the page does not disambiguate, so
      both bullets stand as published.

  free_plan_watermark:
    value: unknown
    source: "https://app.jobscan.co/plan"
    evidence: >-
      Silent on the plan page, the dedicated resume-builder page, and (per pass 2's wider sweep) the
      full Jobscan Support Center. Both passes agree. Genuine vendor silence, not an access
      limitation -- both documents this variable could rest on were fully read by both passes.

  free_plan_duration:
    value: perpetual
    source: "https://app.jobscan.co/plan"
    evidence: "\"Free\" / \"$0\" / \"forever\" -- standing tier, no expiry stated anywhere. Both passes agree."

  trial_exists:
    value: "yes"
    source: "https://app.jobscan.co/plan"
    evidence: >-
      "Try 7 Days Free" CTA; FAQ "You will have 7 days from the time you start your trial";
      corroborated by ToS §6 ("We offer a 7-day free trial"). Both passes agree.

  trial_card_required:
    value: "yes"
    source: "https://www.jobscan.co/cancellation-policy"
    evidence: >-
      ADJUDICATED. Pass 1: unknown, citing the codebook's own Vendor I example (auto-conversion
      implies a stored card, but implication is not a statement) -- a correct reading of the
      evidence pass 1 had. Pass 2: yes, quoting the official help center ("When you begin your free
      trial, Jobscan places a temporary $1 authorization hold on your payment method"), corroborated
      by the cancellation-policy page ("There is a pre-authorization charge upon initial sign up to
      ensure the credit card is valid. This amount will be refunded."). The second quotation is from
      a URL pass 1 ALSO fetched and listed as a source -- but pass 1's WebFetch call returned only a
      model-generated summary that extracted the Refund/Cancellation/Auto-Renewal clauses and
      dropped the page's first section, "JOBSCAN PREMIUM -- TRIAL PERIOD POLICY," entirely, which is
      where this sentence lives. This adjudicator independently re-fetched both the cancellation
      policy and the help-center article live on 2026-08-16 and confirmed both quotations verbatim.
      Both statements are direct: a pre-authorization CHARGE that validates the card happens AT
      SIGNUP (which for a trial-eligible plan is trial start), and a $1 hold is explicitly tied to
      "when you begin your free trial." Neither rests on the auto-renewal inference the codebook's
      Vendor I example rejects; decision rule value "yes: documents state a card is required"
      applies directly. Resolved by coverage: the evidence was in pass 1's own fetched document, but
      the extraction method used lost it before pass 1 ever saw it, and independently in a second,
      pass-2-only official document that corroborates the same fact.

  trial_length_days:
    value: 7
    source: "https://app.jobscan.co/plan"
    evidence: "\"You will have 7 days from the time you start your trial\"; ToS §6 agrees. Both passes agree."

  trial_auto_converts:
