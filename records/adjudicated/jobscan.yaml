  refund_policy_location:
    value: dedicated_refund_page
    source: "https://www.jobscan.co/cancellation-policy"
    evidence: >-
      The refund position appears only on the dedicated Cancellation Policy page; the general ToS
      contains zero mentions of "refund" (confirmed by this adjudicator's full read). Both passes
      agree.

  commercial_use_lowest_tier:
    value: unknown
    source: "https://www.jobscan.co/terms-of-service"
    evidence: >-
      ToS §2 grants a limited license to JOBSCAN'S OWN content/software for personal, non-commercial
      use; §7 bars using the Services for competing or revenue-generating endeavors. Neither
      addresses commercial use of the AI-GENERATED OUTPUTS (optimized resume text, cover letters)
      the product produces for the buyer -- a different construct, no clause found addressing it.
      Both passes agree on the VALUE. Pass 2 could not read the ToS in English at all (D-018) and
      reached unknown on an incomplete document set; pass 1 read the full ToS and reached the same
      value on genuine silence. This adjudicator independently re-read the complete document
      (live-reverified 2026-08-16, byte-identical to pass 1's capture) and confirms: this unknown
      records genuine vendor silence, not our inability to access the document -- the access
      barrier that affected pass 2's own collection did not propagate to this published value.

  watermark_removal_tier:
    value: unknown
    source: "https://www.jobscan.co/plan"
    evidence: >-
      No document -- plan page, resume-builder page, or (pass 2's sweep) the support center --
      states that any tier's outputs do or do not carry a watermark or Jobscan branding. Both passes
      agree on the VALUE for the same reason as commercial_use_lowest_tier: pass 2's own ToS access
      failure (D-018) did not prevent this determination, since the ToS was never the plausible
      source for this variable in the first place (both passes correctly sourced it from
      product-facing pages, not the ToS) and this adjudicator's own check of all four candidate
      documents, including a full ToS read, confirms the silence is genuine (zero occurrences of
      "watermark" anywhere in the ToS).

  output_ownership_statement:
    value: unknown
    source: "https://www.jobscan.co/terms-of-service"
    evidence: >-
      ToS §8-9 address content a user posts PUBLICLY to Jobscan (forums/comments) -- "We do not
      assert any ownership over your Contributions. You retain full ownership..." -- the OPPOSITE
      direction from ownership of outputs Jobscan GENERATES FOR the user. The SaaS Agreement's
      "Customer Content" clause (both passes read it) covers a separate enterprise track and
      plausibly means uploaded/input content, not AI-generated output either. No clause addresses
      the actual construct. Both passes agree on the VALUE. As with the two variables above, pass
      2's D-018 access barrier did not determine this published value: this adjudicator's own full
      ToS read (live-reverified 2026-08-16) independently confirms genuine silence on this specific
      construct.

  usage_cap_quantified:
    value: none_quantified
    source: "https://app.jobscan.co/plan"
    evidence: >-
      ADJUDICATED, cascades from unquantified_limit_clause=present below (not itself flagged by
      tools/disagreements.py, since both passes agreed on all_caps_quantified -- but that agreement
      shared one incorrect premise, so it does not survive the clause finding unchanged). The entry
      tier's ONLY stated limits are four "Unlimited" claims (Resume Scans, AI Optimizations, keyword
      comparisons, ATS & Recruiter Findings) -- no other quantified rate or standing limit is
      attributed to this tier. Rule 3: "Unlimited counts as quantified only where no clause
      elsewhere qualifies it." Since a qualifying discretionary clause is present (ToS §13 item 4,
      general and platform-wide, not scoped away from any tier or feature), all four claims are
      qualified and none remain quantified. With zero quantified limits and zero remaining
      unqualified "Unlimited" claims for the entry tier, none_quantified is correct -- not
      some_quantified, which would require at least one limit to survive unqualified.

  unquantified_limit_clause:
    value: present
    source: "https://www.jobscan.co/terms-of-service"
    evidence: >-
      ADJUDICATED, reversed to a value neither prior pass coded. Pass 1: absent, having read ToS §13
      "Services Management" in full but characterizing every "sole discretion" clause in it as
      "content moderation, account termination... or security/abuse response." Pass 2: unknown,
      unable to read the ToS in English at all (D-018). This adjudicator independently re-fetched
      the Termly content-delivery API live via raw curl on 2026-08-16 (bypassing the Turkish-
      localizing iframe and any summarizing tool) and confirmed, byte-identical to pass 1's own
      2026-08-09 capture: ToS §13, item (4): "in our sole discretion and without limitation, notice,
      or liability, to remove from the Services or otherwise disable all files and content that are
      excessive in size or are in any way burdensome to our systems." This clause squarely matches
      the definition: vendor "sole discretion", the word "excessive" (one of the definition's own
      listed examples), and "burdensome to our systems" (an unquantified, discretionary standard --
      no figure defines "excessive" or "burdensome" -- structurally identical to the codebook's own
      Vendor V example, "usage substantially exceeds typical usage. No figure defines typical.
      present."). Rule 3's conduct carve-out does not apply: item (4) sits under "SERVICES
      MANAGEMENT," addressing resource size/burden, not under the separate "PROHIBITED ACTIVITIES"
      list (§7) that covers illegal/abusive conduct; "files and content" is undefined and, by
      contrast with the immediately preceding item (3) in the SAME section ("any of your
      Contributions"), is broader than the separately-defined "Contributions" term and so is not
      limited to community/forum posts -- it plausibly reaches a user's accumulated resume uploads
      and scan-report files, the byproduct of exercising the entry tier's "Unlimited Resume Scans"
      claim. This exact clause, word-for-word, was independently adjudicated `present` elsewhere in
      this same study (records/adjudicated/undetectable-ai.yaml, a different vendor using the same
      Termly template section) under the same codebook, for the same reasoning; this record reaches
      the same conclusion on its own merits, and the two are noted as consistent rather than one
      deferring to the other. Pass 1's absent is a misclassification, not a defensible alternative
      reading: its own evidence text shows it read §13 (it names the section) but folded item (4)
      into a "security/abuse response" bucket rather than testing it against this variable's own
      definition; the pattern matches this study's known failure mode of a search that stops at the
      first matching keyword ("excessive use of capital letters and spamming" in §7, the OTHER
      "excessive" occurrence in this ToS) without checking the remaining occurrences individually.
      Live count confirmed 2026-08-16: "excessive" appears 3 times in the ToS -- the §7 spam/format
      occurrence (correctly not this construct), the §13(4) occurrence (this one), and an unrelated
      arbitration-cost occurrence. Not resolved toward either prior value; the rule and the evidence
      point to a third answer neither coder reached.

coder_note: |
  ADJUDICATION SUMMARY, 2026-08-16 (protocol §7.4). tools/disagreements.py jobscan reports 5
  substantive disagreements (headline_billing_basis, annual_condition_disclosure,
  annual_default_toggle, trial_card_required, unquantified_limit_clause) plus 1 prose-only
  difference (computation_assumptions, not a scored disagreement). All 5 were resolved by applying
  the codebook decision rule to the evidence, re-verified against the vendor's live/current
  documents (a raw curl of the Termly content-delivery API bypassing both the localizing iframe and
  any summarizing tool, plus live WebFetch checks of the cancellation policy and a help-center
  article) rather than trusted from either coder's transcription. A sixth variable,
  usage_cap_quantified, was NOT flagged by the tool (both passes agreed all_caps_quantified) but is
  changed here as a necessary cascade of the unquantified_limit_clause finding -- codebook rule 3
  ties the two together explicitly, and leaving usage_cap_quantified unchanged after reversing its
  premise would publish an internally inconsistent record.

  REGISTER CHECK, done before classifying anything, per instruction. records/pass1/jobscan.yaml
  carries ONE register_event: {type: display_variant, ToS Turkish-vs-English localization}. This
  documents HOW pass 1 obtained the English ToS (a direct Termly content-API query bypassing the
  geo-localizing iframe); it is a real, useful register entry, but it is a display_variant, and
  §7.4.1 is explicit that a display_variant entry never supplies date_explained. records/pass2/
  jobscan.yaml carries register_events: [] -- empty; pass 2's own ToS access failure was never
  logged as an event because pass 2 never obtained a second state to compare (it has only "Turkish,
  every method tried"), not two archived states of one document. Per the task's own framing, checked
  explicitly: no register entry in EITHER record is a vendor_edit, so date_explained is unavailable
  for anything on this record (§7.4.1). variant_explained is also unavailable: it requires TWO
  ARCHIVE SNAPSHOTS showing two DISPLAY states of the same unedited document (§7.4.2), and what
  actually happened here is that one collection method (pass 1's, and this adjudicator's own live
  recheck) successfully retrieved the vendor's single English document while another method (pass
  2's six attempts) did not -- a tooling/coverage gap between coders, not two states the vendor
  served. A tooling failure is a misread, not a variant. Every disagreement below is accordingly an
  ORDINARY disagreement, resolved on the merits.

  ENTRY-TIER SELECTION (sampling-rules §7.2), not disputed. Candidates: Quarterly ($89.95/3mo =
  $359.80/yr annual-equivalent, or 29.98 x 12 = $359.76/yr) and Monthly ($49.95/mo x 12 = $599.40/
  yr). Free ($0) is not a paid tier and was not a candidate. Both generally available, self-serve,
  standing, single-seat. Quarterly wins on lowest annual-equivalent cost; both passes agree
  independently.

  DISPOSITION, four clusters plus the prose field:

  1. BILLING-CADENCE CLUSTER (headline_billing_basis, annual_condition_disclosure,
     annual_default_toggle) -- all three disagreements share one root cause, Jobscan's entry tier
     billing quarterly rather than annually or monthly-only, which the codebook's Domain 1/2
     variables are framed around an annual/monthly binary. The three do NOT resolve the same way,
     because each variable's own rule text responds differently to the same underlying fact:
       - headline_billing_basis: the rule's only fallback for an unenumerable-but-present qualifier
         is unknown. This is adjudication item A-011 (open queue item, four records: canva,
         jobscan, resume-io, teal), independently reproduced by two blind pass-2 coders. Per the
         instrument freeze (codebook §11), coded unknown here; the enum question is left to the
         queue and wave 2, not invented on this record.
       - annual_condition_disclosure: this variable's rule is literally about ANNUAL prepayment
         specifically, and its own not_applicable criterion explicitly covers "no annual billing
         option exists" -- which is Jobscan's exact state. not_applicable is not a fallback here,
         it is the rule's own determinate answer.
       - annual_default_toggle: like headline_billing_basis, this variable's rule provides no
         value-producing step for a no-toggle, no-annual-option, THREE-simultaneous-tier display,
         and its not_applicable criterion ("billing does not recur") does not fit Jobscan
         (billing does recur). Falls to the general unknown fallback, same conclusion as
         headline_billing_basis but reached independently through this variable's own text, and
         flagged as a related-but-distinct instrument gap (not currently part of A-011's own
         scope, which names only headline_billing_basis).
     Reading these three together matters for the paper: one underlying vendor characteristic
     (quarterly cadence, no toggle) produces three different rule outcomes (unknown,
     not_applicable, unknown) because the instrument's variables are not uniformly built around
     the same annual/monthly assumption. That unevenness is itself worth stating in the
     limitations, not smoothed into one answer.

  2. TRIAL-CARD ITEM (trial_card_required) -- adjudicated "yes" against pass 1's "unknown" and
     confirming pass 2's "yes". Pass 1's reasoning was sound applied to what pass 1 saw (correctly
     rejecting an auto-renewal inference, per the codebook's own Vendor I example) -- the miss was
     upstream, in the WebFetch summarization step silently dropping the cancellation-policy page's
     Trial Period Policy section, from a document pass 1 itself had listed as a source. Pass 2 found
     the same underlying fact through the untruncated version of that same document plus an
     independent help-center article pass 1 never opened. Both quotations verified live 2026-08-16.

  3. USAGE-LIMIT CLUSTER (unquantified_limit_clause, usage_cap_quantified) -- adjudicated "present"/
     "none_quantified" against BOTH passes having settled on "absent"/"all_caps_quantified" or
     "unknown"/"all_caps_quantified". This is the single largest finding in this record: neither
     prior coder reached "present" on unquantified_limit_clause, matching this study's standing
     caution that this specific variable carries the lowest inter-coder agreement and the highest
     risk of a keyword search stopping at the first match. Full textual analysis, the live
     verification method, and the parallel with this study's own undetectable-ai.yaml adjudicated
     record (the SAME clause, word for word, from a different vendor's Termly-templated terms) are
     in unquantified_limit_clause's own evidence field above.

  4. PROSE (computation_assumptions) -- reconciled, not adjudicated as a value dispute. Both passes
     reached the identical tier, price, and conclusion; wording merged into one statement.

  D-018 ACCOUNTING (access-limited vs vendor-silent unknowns), done explicitly per instruction,
  since the two are different findings and are reported separately in the paper. This record carries
  9 `unknown` values in total: headline_billing_basis, annual_default_toggle, free_plan_watermark,
  credit_rollover_policy, failed_generation_charge_policy, renewal_notice_commitment,
  commercial_use_lowest_tier, watermark_removal_tier, output_ownership_statement.
    - ZERO of the 9 are access-limited in this PUBLISHED record. D-018 flagged four variables in
      pass 2's OWN collection as blocked by the ToS being unreadable in English
      (commercial_use_lowest_tier, watermark_removal_tier, output_ownership_statement,
      unquantified_limit_clause) -- but this adjudicator obtained and fully read the same English
      document pass 1 had already obtained (independently re-verified live, byte-identical), which
      closes that access barrier for the record this study publishes. Of those four: three
      (commercial_use_lowest_tier, watermark_removal_tier, output_ownership_statement) resolve to
      unknown on GENUINE VENDOR SILENCE, confirmed by a completed full read (their evidence fields
      above say so explicitly) rather than left resting on "pass 2 could not look." The fourth
      (unquantified_limit_clause) resolves off unknown entirely, to a determinate present.
    - 7 of the 9 are genuine vendor silence: the three above, plus free_plan_watermark,
      credit_rollover_policy, failed_generation_charge_policy, and renewal_notice_commitment, none
      of which was ever access-blocked for either pass -- both passes read the relevant documents
      and found them silent, independently confirmed by this adjudicator's own read where the ToS
      was the relevant document.
    - 2 of the 9 (headline_billing_basis, annual_default_toggle) are a THIRD category, distinct
      from both halves of the D-018 dichotomy: the document was read, the underlying fact is fully
      known (quarterly billing, no toggle), and unknown records an INSTRUMENT/ENUM coverage gap,
      not vendor silence and not our inability to access anything. Reporting these as either
      "vendor silent" or "access-limited" would misstate the finding; they are their own thing
      (the A-011 family) and are labeled as such in each variable's evidence field above.
    In short: pass 2's real, well-documented D-018 access barrier explains why PASS 2's OWN record
