      states whether unused free or purchased credits carry over or expire. Both passes agree;
      genuine silence, not an access limitation.

  failed_generation_charge_policy:
    value: unknown
    source: "https://www.jobscan.co/terms-of-service"
    evidence: >-
      No document -- the full ToS (read by pass 1 and, independently, by this adjudicator),
      cancellation-policy, plan page, auto-apply page, or support center (pass 2's sweep) -- states
      what happens to a free-tier scan or an Auto Apply credit if the underlying action fails or
