  cancellation_self_serve:
    value: self_serve_documented
    source: "https://www.jobscan.co/cancellation-policy"
    evidence: >-
      "Cancel Membership instructions within your Account page" -- cancellation itself needs no
      contact (ToS §6 agrees). A REFUND specifically requires emailing support, captured separately
