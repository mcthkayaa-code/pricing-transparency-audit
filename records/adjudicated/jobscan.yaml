variables:
  headline_price_usd:
    value: 29.98
    source: "https://app.jobscan.co/plan"
    evidence: >-
      Quarterly card: "$29.98" / "per month", the largest, most prominent figure on the entry
      tier's card in the default (only) display state. Both passes agree; confirmed in a second,
      structurally independent DOM-query representation by pass 1 (D-009, 2026-08-10).

  headline_billing_basis:
    value: unknown
    source: "https://app.jobscan.co/plan"
    evidence: >-
      ADJUDICATED. Pass 1: per_month_billed_annually. Pass 2: unknown. Both passes read the SAME
      fact identically: "Billed as $89.95 every 3 months" -- a quarterly prepayment cadence. The
      decision rule's only value-producing steps are "where a per-seat figure and a per-month
      figure are both stated, code per_seat_per_month" (does not apply -- no per-seat framing) and,
      failing that, checking whether the qualifier is ABSENT and falling to unknown if so. Neither
      literally covers this case: the qualifier is not absent, it is present and unambiguous, and
      it names a cadence (quarterly) that none of the five substantive enum values (annually,
      monthly, per-seat, one-time, usage-based) describes. Per the general decision tree (codebook
      section 2.1 step 4), where the specific rule provides no value-producing step for the
      observed state, the fallback is unknown. This is adjudication item A-011, independently
      reproduced by two blind pass-2 coders (jobscan and teal) working from nothing but the product
      name and vendor URL, which the queue itself calls "the instrument failing the same way twice
      under independent observation." Per protocol/codebook section 11 (instrument stability), no
      value may be added mid-wave; wave 1 codes unknown and wave 2's codebook extends the enum.
      Pass 1's per_month_billed_annually is not merely an imperfect label -- it affirmatively
      misstates the vendor's actual practice (the charge recurs every 3 months, not every 12), and
      codebook section 1 rule 6 and section 2's own preference for unknown over a confident wrong
      answer both count against carrying it into the published dataset. Not resolved by rule to a
      determinate value; both prior values are retained in the reliability file per protocol §7.4
      step 6.

  first_charge_amount_usd:
    value: 89.95
    source: "https://app.jobscan.co/plan"
    evidence: >-
      "Billed as $89.95 every 3 months" -- stated directly, no multiplication assumed. Both passes
      agree. Excludes sales tax (FAQ: "We will apply state and local sales tax based on your
      billing address") and excludes the separate refundable $1 pre-authorization hold (pass 2's
      help-center source: "This is not an actual charge"), per rule 5. Note for
      tools/check_price_arithmetic.py: with headline_billing_basis=unknown this correctly prints a
      BASIS line, not a FLAG -- the two money figures ARE consistent with a quarterly cadence
      (29.98 x 3 = 89.94, one cent from 89.95, ordinary rounding, per pass 2's own check).

  mandatory_addon_present:
    value: "no"
    source: "https://app.jobscan.co/plan"
    evidence: >-
      Full Quarterly-tier feature list carries no required separate charge; "Auto Apply Credits"
      and "Interview Practice" are optional, separately-purchased add-ons ("20% off ... after
      trial"), excluded under rule 3. Both passes agree.

  annual_condition_disclosure:
    value: not_applicable
    source: "https://app.jobscan.co/plan"
    evidence: >-
      ADJUDICATED. Pass 1: adjacent (applied the positional adjacent/same_page/one_click_away/absent
      test to the QUARTERLY disclosure by analogy). Pass 2: not_applicable. Decision rule step 1 is
      literal and dispositive: "Establish whether the headline figure depends on annual
      prepayment. If it does not, code not_applicable." Jobscan's headline figure depends on
      QUARTERLY prepayment; no annual option exists on the page at all (confirmed independently by
      both passes and unchanged on this adjudicator's review of both captures). The value table's
      own not_applicable row reads "No annual billing option exists, or billing does not recur" --
      the first clause is exactly this product's state. Pass 1's adjacent reads the quarterly
      condition as if it answered a question this variable does not ask; that is a
      misclassification, not a defensible alternative construction of the same rule text, because
      the rule names "annual prepayment" specifically and repeatedly, not "any multi-month
      prepayment condition." Resolved by rule, not by preference between the two prior values.

  annual_default_toggle:
    value: unknown
    source: "https://app.jobscan.co/plan"
    evidence: >-
      ADJUDICATED. Pass 1: no_toggle. Pass 2: unknown. Both passes agree on every underlying fact:
      no interactive toggle exists; three cards (Free/Quarterly/Monthly) render simultaneously and
      permanently; no annual option exists; the Quarterly card carries a "Most popular"
      ribbon/highlighted pill. The dispute is purely which enum value that state maps to, and
      neither fits cleanly. This variable's decision rule contains exactly one value-producing
      step -- step 2, "where the page offers annual AND monthly options, record which is active on
      load" -- which does not fire here (no annual option). The rule's text never actually states
      when to code no_toggle; that value's OWN value-table meaning is "the page offers ONE billing
      period only," which does not describe Jobscan (it offers two recurring paid periods,
      quarterly and monthly, simultaneously). not_applicable is also textually foreclosed: unlike
      annual_condition_disclosure, THIS variable's not_applicable row reads only "Billing does not
      recur" (no "no annual option" disjunct), and Jobscan's billing does recur. With no
      value-producing step reaching a determinate answer and no not_applicable criterion met, the
      general decision tree's fallback governs (codebook section 2.1 step 4: "otherwise, code
      unknown"). This is NOT a claim that the page's state is unobserved -- it is fully observed
      and recorded above -- it is that no codebook value correctly labels a three-simultaneous-tier,
      no-toggle, no-annual-option display. Structurally the same underlying vendor characteristic
      (quarterly cadence, no annual option) that produces the A-011 gap on headline_billing_basis,
      but a distinct rule failure on a distinct variable, not itself part of the A-011 queue item as
      currently scoped -- flagged here for the queue's attention alongside it.

  free_plan_exists:
    value: "yes"
    source: "https://app.jobscan.co/plan"
    evidence: "\"Free\" / \"$0\" / \"forever\" plan card with a feature list and a \"Select\" button. Both passes agree."

  free_plan_cap_documented:
