  auto_renewal_disclosure_location:
    value: multiple
    source: "https://www.jobscan.co/terms-of-service"
    evidence: >-
      Stated in the ToS §6 AND independently on the dedicated cancellation-policy page ("Until you
      cancel, billing will continue according to the cycle stated at the time of subscription") AND
      on the pricing-page FAQ ("If you cancel your plan before the next renewal cycle..."). Both
      passes agree on multiple (citing at least two of the three); this adjudicator's full read adds
