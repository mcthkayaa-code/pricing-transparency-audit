  - { url: "https://www.jobscan.co/terms-of-service", kind: tos, accessed: "2026-08-16", archive: local_copy_only, note: "Embedded via a Termly iframe that auto-localizes by network geography (Turkey-egress collection network renders Turkish). Pass 1 (2026-08-09) obtained the English original by querying Termly's own content-delivery API directly (locale=en, created_locales=[en]) and saved the full 1,137-line document verbatim (jobscan-sources/tos-en-US-plaintext.txt, jobscan-sources/tos-content-enUS.json), logged as a display_variant register event. Pass 2 (2026-08-15) tried six methods -- WebFetch, two browser navigations, a guessed /en/ locale path, a web.archive.org capture, and archive.ph -- all of which returned Turkish body text, a pre-hydration shell, a 404, or a failure; none tried a direct content-API query. This is deviation D-018. This adjudicator independently re-fetched the SAME Termly content-API endpoint live on 2026-08-16 via raw curl (bypassing any summarizing tool): locale=en, content length 157,642 characters, BYTE-IDENTICAL to pass 1's saved 2026-08-09 JSON capture, and the document's own 'Last updated' date (March 16, 2026) predates the entire collection window, so the document was stable throughout. Full text read by this adjudicator start to finish. See unquantified_limit_clause, commercial_use_lowest_tier, watermark_removal_tier, output_ownership_statement." }
  - { url: "https://www.jobscan.co/cancellation-policy", kind: refund, accessed: "2026-08-16", archive: archive_failed, note: "Dedicated cancellation/refund/trial-billing policy page, English, no localization observed by either pass. Pass 1 (2026-08-09) fetched it via WebFetch, whose summarizing model extracted only the Refund/Cancellation/Auto-Renewal clauses and DROPPED the page's first section, 'JOBSCAN PREMIUM -- TRIAL PERIOD POLICY', entirely -- see trial_card_required. Pass 2 (2026-08-15) read the full text via a rendered browser plus an independent WebFetch cross-check, both matching, and captured the dropped section. This adjudicator independently WebFetched the same URL live 2026-08-16 and confirmed pass 2's quotation verbatim. Both passes' archive.org save attempts failed (HTTP 000 / HTTP 520); archive_status=archive_failed on this URL specifically, local captures are the evidentiary copies." }
  - { url: "https://www.jobscan.co/auto-apply", kind: docs, accessed: "2026-08-15", archive: local_copy_only, note: "Official Auto Apply credit-system page. Read independently by both passes; figures agree (1 credit = 1 application; 5/10/25-credit packs)." }
  - { url: "https://www.jobscan.co/saas-agreement", kind: tos, accessed: "2026-08-16", archive: local_copy_only, note: "Separate negotiated B2B/Order-Form contract for the 'Organizations'/Jobscan Coach track, not the individual Free/Quarterly/Monthly consumer product this record's entry tier is drawn from. Read in full by both passes; neither found a fair-use/reasonable-use/excessive-use throttling clause (only a standard anti-resale/anti-reverse-engineering restriction, correctly excluded under unquantified_limit_clause rule 3 by both). Pass 1 read it but deliberately did not add it to sources or use it for any coded value; pass 2 used it as supplementary evidence for output_ownership_statement and unquantified_limit_clause, clearly flagged as out of scope for the entry tier. Cited here for the same supplementary purpose, consistent with pass 2's treatment." }
  - { url: "https://jobscansupport.frontkb.com/en/articles/11537217", kind: docs, accessed: "2026-08-16", archive: local_copy_only, note: "Official help center, 'Why was I charged during my free trial?' Pass 1 never opened any jobscansupport.frontkb.com URL. Found by pass 2 (2026-08-15, records/pass2/jobscan-sources/support-articles-2026-08-15.txt); this adjudicator independently re-fetched it live 2026-08-16 and confirmed the $1-authorization-hold quotation verbatim. See trial_card_required." }
