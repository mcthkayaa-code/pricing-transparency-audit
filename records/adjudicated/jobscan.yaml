conflict_note: >-
  Two Jobscan documents address refunds in incompatible-looking ways for what could be read as the
  same event: the SaaS Agreement grants a 30-day refund of prepaid fees, but only if Jobscan
  modifies the Service in a way that materially diminishes functionality, and that document is
  framed throughout as a negotiated Order-Form/"Customer" contract for the separate "Organizations"
  offering. The Cancellation Policy grants a 2-day, 3.5%-fee refund for the individual self-serve
  Premium plan sold on the pricing page (the entry tier this record codes). Both passes that read
  the SaaS Agreement treated these as two different documents governing two different
  products/contracts rather than a same-variable conflict between equal-authority sources, and this
  adjudicator agrees: refund_policy_exists/refund_window_days/refund_conditions are coded from the
  Cancellation Policy only. URLs: https://www.jobscan.co/saas-agreement and
  https://www.jobscan.co/cancellation-policy.
