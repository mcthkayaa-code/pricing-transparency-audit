  computation_assumptions:
    value: >-
      Quarterly (entry tier), $29.98/mo per default display state (billed $89.95 every 3 months).
      Principal output = per_seat_month, unmetered (Unlimited scans/optimizations). No allowance to
      convert; cost per seat-month = the headline monthly price itself = $29.98.
    source: "https://app.jobscan.co/plan"
    evidence: >-
      PROSE field (tools/disagreements.py flags it, not a substantive disagreement) -- both passes
      reached the identical tier, price and conclusion, differing only in wording. Merged into one
      statement. cost_per_output_computable="yes" is agreed and unaffected.

  credit_rollover_policy:
    value: unknown
    source: "https://www.jobscan.co/auto-apply"
    evidence: >-
