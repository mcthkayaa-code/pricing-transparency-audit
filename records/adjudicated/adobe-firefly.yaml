default_display_state: |
  Individuals tab active by default (aria-selected="true"; confirmed by accessibility-tree read on
  both passes and by this adjudicator). A Turkey-geolocation interstitial ("Bu Adobe sitesi,
  konumunuzla eşleşmiyor") appears first on every fresh load of both the plans page and the
  adobe.com/legal pages; dismissed via its own Close control (declining redirection, not an account
  action) on all three reads, after which the page serves US/USD content throughout -- confirmed by
  this adjudicator's own live network inspection 2026-08-16: every web_commerce_artifact request
  carries country=US&locale=en_US. Default card slots: Firefly Standard "US$9.99/mo" / "Monthly" and
  Firefly Pro "US$19.99/mo" / "Monthly" (both passes, reproduced identically across repeated loads;
  this adjudicator independently re-derived Standard's figure live from the same commerce endpoint,
  matched to the visible "Buy now"/"Free trial" controls via their data-wcs-osi attributes). No
  monthly/annual toggle exists anywhere on the Individuals tab; all four Individual-segment offers
  (Standard/Pro/Pro Plus/Premium) carry commitment:"MONTH" in their own embedded commerce JSON,
  confirmed independently by pass 2 and this adjudicator. Pro Plus and Premium require an extra
  per-card dropdown selection to view and are not in the two default card slots; both carry a
  "Limited-time offer" (30% off first year) promo not applicable to the entry tier. Business/Team-tab
  variants (commitment:"YEAR") are a different, non-default segment reached only by clicking
  "Business".

