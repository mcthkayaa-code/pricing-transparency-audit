  - { url: "https://www.adobe.com/legal/terms.html", kind: tos, accessed: "2026-08-16", archive: "https://web.archive.org/web/20260806120414/https://www.adobe.com/legal/terms.html", note: "Adobe General Terms of Use, published/effective 2025-10-03. This adjudicator full-text-searched the live document for 'renew' and 'automat' 2026-08-16: the only 'renew' hit is an unrelated passing mention of a 'renewal date' in the License section (3.1); the Fees and Payment section (7.2) refers OUT to 'your Subscription and Cancellation Terms' rather than stating a renewal commitment itself. No affirmative auto-renewal statement exists in this document. Confirms section 1.2's own text that the Subscription and Cancellation Terms is a separate, dedicated document merely incorporated by reference." }
