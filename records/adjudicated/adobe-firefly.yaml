conflict_note: |
  Free-plan refresh cadence (protocol 6.2; logged by pass 2, carried forward unchanged in substance).
  The live pricing page (https://www.adobe.com/products/firefly/plans.html) frames the free tier as
  "free daily generations... Limits refresh every day" (no mention of "credits" for free users). The
  official help-center page (https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html)
  states "For free plans, generative credits are allocated upon first use of a Firefly feature...
  These credits expire one month from allocation" -- a monthly, credit-based cadence, not a daily one.
  Both descriptions are of an ongoing, renewing arrangement; they diverge only on cadence, not on
  whether the free tier persists. Protocol 6.2 ranks the live pricing page first for free-tier
  (pricing-class) variables, so free_plan_duration and free_plan_cap_documented are coded from it --
  this adjudication applies that ranking rather than judging which description sounds more precise,
  per the assignment brief's own instruction, and reaches the same values both passes already held.

  Output ownership / free-user license (logged by pass 2). The Gen AI Product Specific Terms version
  actually in effect at all three collection dates (2026-04-23,
  https://www.adobe.com/go/adobe-gen-ai-addl-terms) contains no equivalent of a prior 2024-06-04
  version's clause granting Adobe a broad perpetual/worldwide license over free (non-paying) users'
  text-based Input+Output "for any purpose" unless the user purchased a paid subscription. That clause
  is absent from the current document, re-confirmed still absent by this adjudicator 2026-08-16.
  output_ownership_statement is coded user_owns from the General Terms of Use sec. 4.2, qualified only
  by the still-current Firefly Gallery license (Gen AI terms sec. 4: submitting Output to an
  Adobe-hosted gallery grants Adobe a marketing/reuse license over that specific submission, all tiers
  alike).

