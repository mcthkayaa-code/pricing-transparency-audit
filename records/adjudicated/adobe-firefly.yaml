variables:

  # ---- Domain 1: headline price vs price actually charged ----

  headline_price_usd: { value: 9.99, source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. Firefly Standard card, default Individuals-tab display state: 'US$9.99/mo' / 'Monthly'. Confirmed in a second representation, embedded commerce JSON (productCode FFST, PA-1930): price 9.99, currencyCode USD. Re-confirmed live by this adjudicator 2026-08-16 via direct network-request inspection of the same commerce endpoint, matched to the visible 'Buy now' control via its data-wcs-osi attribute." }
  headline_billing_basis: { value: "per_month_billed_monthly", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. Card reads 'Monthly' (not 'billed annually'); commerce JSON confirms commitment:MONTH, term:MONTHLY. No annual-prepay option exists for any Individual-tab plan -- all four carry commitment:MONTH in their own JSON." }
  first_charge_amount_usd: { value: 9.99, source: "https://www.adobe.com/legal/subscription-terms.html", evidence: "AGREED. Month-to-month Subscription Terms: subscription 'begins as soon as your initial payment is processed' and charges 'the then-current rate for your plan... every month'. No annual commitment applies and no mandatory add-on exists (see mandatory_addon_present), so first charge = the published monthly rate; no arithmetic performed on either pass or this adjudication." }
  mandatory_addon_present: { value: "no", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. Pricing-page FAQ: 'Adobe will not charge you for additional credits unless you choose to purchase them.' Credit add-on packs are explicitly optional; no other required charge found on top of the $9.99/mo price for the plan as advertised." }
  annual_condition_disclosure: { value: "not_applicable", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. No annual-prepay option exists anywhere on the default Individuals tab (see annual_default_toggle); the headline figure does not depend on annual prepayment (rule 1)." }
  annual_default_toggle: { value: "no_toggle", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. Accessibility-tree/DOM inspection (both passes, independently, and this adjudicator) finds no monthly/annual billing-period control on the Individuals tab; all four Individual-segment offers carry commitment:MONTH in their own embedded commerce JSON. An 'Annual, billed monthly' control exists in the DOM but belongs to the Business/Team tab only, not the default view." }

  # ---- Domain 3: real usability of the free plan ----

  free_plan_exists: { value: "yes", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. Plans page: 'You don't need a plan to get free daily generations across image, video, and audio... Limits refresh every day.' Confirmed by the plans-page FAQ: 'Is there a free version of Adobe Firefly? Yes...'. An ongoing allowance, not a time-limited trial (domain 4)." }
  free_plan_cap_documented: { value: "none_quantified", source: "https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html", evidence: "AGREED. Plans page: 'free daily generations... Limits refresh every day' (no figure). Help-center comparison table, 'Firefly Free' column, 'Generative credits' row: 'Limited' (no number; re-confirmed live by this adjudicator 2026-08-16 via full table extraction -- see sources note). No official document publishes a specific quantity for the free tier. NOTE (protocol 6.2): the same help-center page separately states free-plan generative credits are 'allocated upon first use... expire one month from allocation' -- a different CADENCE than the pricing page's 'daily' framing (logged in conflict_note below). Free-tier limits are a pricing-class construct, so protocol 6.2 ranks the live pricing page first regardless of which description reads as more precise, and both passes correctly coded from it." }
  free_plan_cap_value: { value: "unknown", source: "https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html", evidence: "ADJUDICATED 2026-08-16 under the variable's own Format and Decision rule (codebook Domain 3, `free_plan_cap_value`): the only permitted values are a properly-formatted quantified limit ('quantity unit per period' / 'quantity unit') OR the literal tokens unknown / not_applicable / conflicting -- 'Do not paraphrase an unquantified limit into a number.' Both passes independently agree free_plan_cap_documented=none_quantified (no source anywhere -- plans page 'free daily generations... refresh every day', help-center table 'Limited' -- publishes a number), so there is nothing quantified to transcribe. Pass 2's value is a well-researched but non-conforming free-text paraphrase of that same absence, not a value the field's own format allows; its underlying research (the comparison table's 'Limited' cell, re-confirmed live 2026-08-16) is preserved in free_plan_cap_documented's evidence rather than discarded. Prior values: pass1=unknown, pass2='unspecified count, daily-refreshing (no numeric figure published in any official source found)'." }
  free_plan_watermark: { value: "unknown", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. No document read (plans-page feature grid, help-center comparison table, Gen AI Product Specific Terms) states whether free-tier outputs are watermarked. The Gen AI terms' non-removal clause ('must not remove... any watermarks... that MAY be generated') is conditional and does not state whether or for which tier a watermark is actually applied." }
  free_plan_duration: { value: "perpetual", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. Presented as a standing, no-plan-needed option with a refreshing (not one-time) allowance and no expiry date stated anywhere. See conflict_note re: the help-center's differently-cadenced description of the same free allocation ('allocated upon first use... expire one month from allocation, ... again allocated' the next month) -- that description is ALSO of an ongoing, renewing arrangement, so the duration finding is unaffected by the cadence conflict either way." }

  # ---- Domain 4: whether a trial requires a payment card ----

  trial_exists: { value: "yes", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. Firefly Standard and Firefly Pro cards each show a 'Free trial' control alongside 'Buy now'. Confirmed in the embedded commerce JSON: a distinct TRIAL-type offer exists for FFST and FFPO, re-verified live by this adjudicator 2026-08-16." }
  trial_card_required: { value: "unknown", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. No official document (pricing page, General Terms of Use section 3.7, Subscription and Cancellation Terms) states whether payment details are required to start the trial. The Subscription and Cancellation Terms' 'Free Trial Terms' language appears only under 'Annual contract' plan-type subsections, not under the 'Month to month' type that governs this entry tier's confirmed commitment, so it cannot be read across without the inference the instrument bars." }
  trial_length_days: { value: 7, source: "https://www.adobe.com/products/firefly/plans.html", evidence: "ADJUDICATED 2026-08-16 under deviations-for-coders.md's binding 'Reading a page' rule ('A rendered read IS a documentary read... Check the page's embedded JSON payload as well as its rendered text. Prices and plan data routinely live in a payload that never becomes visible text') and the D-005 rendered-read principle it generalizes. Independently re-verified live by this adjudicator, not merely trusted from pass 2's capture: the plans-page DOM's 'Free trial - Firefly Standard' link carries data-wcs-osi='6CvaGeeAH5XUkdTDddYlZcoJa6g7az1dXzD7UwQhDX8'; the matching live network response from adobe.com's own commerce API (web_commerce_artifact, offer_selector_ids=<same id>, productCode FFST) reads offerType:'TRIAL', pricePoint:'TRIAL_7_DAY_TWP_CCI_FIREFLY_STANDARD_FOR_CREATORS_FFST' -- Adobe's own first-party data for this exact entry-tier trial offer, tied to the visible control via the DOM. Pass 1's unknown reflects a session-side tooling gap (no embedded-JSON/network inspection performed; that session's own register_events separately document FAQ-accordion and price-digit rendering struggles on this same page), not vendor silence -- 'a coder-tooling misread is never a display_variant... document it in coder_note and code the true value.' Prior values: pass1=unknown, pass2=7." }
  trial_auto_converts: { value: "unknown", source: "https://www.adobe.com/legal/subscription-terms.html", evidence: "AGREED, same gap as trial_card_required. The Subscription and Cancellation Terms' automatic-conversion language ('At the end of your free trial... Adobe will automatically charge...') is stated only under 'Annual contract' subsections, not the 'Month to month' subsection matching this entry tier. General Terms of Use 3.7 is permissive ('you may continue... in a paid subscription, if available'), not an explicit auto-conversion statement. Coded unknown rather than reading the annual-plan clause across to a month-to-month product." }

  # ---- Domain 5: comprehensibility of the credit system ----

  credit_system_present: { value: "yes", source: "https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html", evidence: "AGREED. 'Generative credits are like tokens you can use to generate... image, vector, video, and audio outputs' -- an intermediate currency the plans page itself sells in units of 'credits per month' rather than directly in one output unit." }
  credit_unit_defined: { value: "yes", source: "https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html", evidence: "AGREED. Generative-credits FAQ ties the unit to specific outputs: 'Most standard generative AI features... use 1 credit per generation'; 'Firefly Image 5... 10 credits per generation'; 'Generate Video... 100 credits per second' (1080p); etc. A document defines the unit against recognizable outputs, which is all this variable (unlike credit_to_output_rate_published) requires." }
  credit_to_output_rate_published: { value: "partial", source: "https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html", evidence: "ADJUDICATED 2026-08-16 under codebook Domain 5 `credit_to_output_rate_published` rule 4 ('Rates published for secondary features but not the principal output are partial'). Independently re-verified live: the generative-credits-faq.html comparison table carries two rows for Firefly Standard -- 'Standard features' = 'Unlimited access / Does not deduct credits', 'Premium features' = 'Deducts credits'. Adobe's own document structure, not either coder's characterisation, draws the principal(standard)/secondary(premium) line, using the word 'features' -- the same word rule 4 uses. Firefly Image 5 (10 credits/generation) and Firefly Image 4 Ultra (20 credits/generation) sit in the premium-features rate table, i.e. the secondary category; the plan's principal, headline-advertised image output (standard/unlimited generation -- 'Unlimited access to standard image features like Generative Fill' on the plans page itself) carries no credit rate at all because none applies to it on a paid Firefly plan. A rate is published for a secondary feature-tier within the principal output TYPE (image), not for that output's own default/principal form -- rule 4's case. Prior values: pass1=yes (read the premium-model rate as satisfying 'a rate for image' without weighing that standard/default image generation carries no rate at all), pass2=partial (reached the same value, on materially the same reasoning, from the per-feature rate table alone -- without the comparison table's explicit 'features' framing this adjudicator additionally verified)." }
  credit_rate_location: { value: "docs_help_center", source: "https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html", evidence: "AGREED. The credit-to-output conversion table (both the premium-features rate table and the Free/Standard/Pro/Pro Plus/Premium comparison table) lives on the helpx generative-credits-faq.html help-center page. The pricing page states only total monthly allowances ('2,000 per month' etc.), not the per-output conversion rate. Unaffected by this adjudication's credit_to_output_rate_published change -- this variable asks only WHERE a published rate lives, not whether it covers the principal output." }

  # ---- Domain 6: computability of cost per output ----

  cost_per_output_unit: { value: "per_image", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. Assigned category is AI image generator; image is the principal output followed throughout domain 6, consistent with credit_to_output_rate_published. (Firefly as currently sold is multi-modal -- image, video, audio, vector -- noted for context, not scored; pass 2's coder_note flags an alternative per_seat_month reading as a judgment call, but the two passes AGREE on per_image, so it is not before this adjudication and is carried through unchanged.)" }
  cost_per_output_computable: { value: "partial", source: "https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html", evidence: "ADJUDICATED 2026-08-16 -- a THIRD value, not either prior coder's. Codebook Domain 6 `cost_per_output_computable` rule 5 directly parallels credit_to_output_rate_published rule 4 immediately above: 'If the calculation is possible for a secondary output but not the principal one, code partial... name the output in computation_assumptions.' A $/image figure IS computable, using only published figures and no usage assumption, for the SECONDARY (premium-model) path: entry tier $9.99/mo, 2,000 credits/month (both already monthly), Firefly Image 5 at 10 credits/generation -> 9.99/2000=0.004995/credit x10=~$0.05/generation. It is NOT computable for the PRINCIPAL, default, headline-advertised path (unlimited standard image generation), which the vendor's own comparison table states plainly 'Does not deduct credits' -- no rate applies, so no figure can be derived for it without inventing one, which rule 7 bars. Both a `yes` and a `no` reading have some textual footing (the codebook's own worked examples for this rule-pair mostly involve different output TYPES, e.g. video vs image, not tiers of the same type); what settles it toward `partial` is Adobe's own table using the word 'features' for exactly this split (matching rule 4's own wording) and explicitly placing the numerically-rated premium image models inside that secondary bucket -- vendor-authored structure, not either coder's gloss. Pass 1 performed the identical arithmetic correctly and its own coder_note already flagged the qualification that supports partial ('this $0.05 figure applies specifically to premium-model (Image 5) generation, not to every image a Firefly Standard subscriber can produce') but filed the categorical value as yes. Pass 2 correctly identified the principal-path gap but over-corrected to no, discounting the fully-computable secondary-output figure rule 5 credits. Prior values: pass1=yes, pass2=no." }
  computation_assumptions: { value: "Firefly Standard entry tier, $9.99/mo, 2,000 generative credits/month, both already monthly (no period conversion needed). Vendor's own Standard/Premium-features comparison table (generative-credits-faq.html) states standard (principal) image generation 'Does not deduct credits' on Firefly Standard -- no rate applies, so no figure is computable for the plan's principal output. A rate IS published for the secondary/premium path: Firefly Image 5 model, 10 credits/generation (premium-features rate table). 9.99/2000=0.004995 USD/credit; x10=0.04995, approximately $0.05 per Firefly Image 5 (premium-model) generation. Does not represent standard/unlimited generation, which the entry tier is actually sold on and for which no credit rate exists.", source: "https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html", evidence: "ADJUDICATED 2026-08-16, follows from cost_per_output_computable=partial above. Pass 1's original arithmetic is correct and is carried through with its output (Firefly Image 5) explicitly named, per the `partial` rule's own requirement -- only the categorical value on cost_per_output_computable changed, not the math. Prior values: pass1 filed the same arithmetic under a `yes` value; pass2='not_applicable' (performed no computation, having concluded none was possible under its own `no`)." }

  # ---- Domain 7-8: rollover and failed generations ----

  credit_rollover_policy: { value: "expires_at_period_end", source: "https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html", evidence: "AGREED. Generative-credits FAQ: 'No, generative credits do not roll over to the next month. Your generative credit balance will reset to your allocated amount on a monthly basis.' Independently confirmed by the Subscription and Cancellation Terms: 'Unused generative credits do not rollover.'" }
  failed_generation_charge_policy: { value: "unknown", source: "https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html", evidence: "AGREED. No document read (pricing page, generative-credits FAQ, General Terms, Subscription and Cancellation Terms, Gen AI Product Specific Terms) states what happens to credit consumption when a generation fails, errors, or produces nothing usable. Silent throughout." }

  # ---- Domain 9: auto-renewal ----

  auto_renewal_default: { value: "on", source: "https://www.adobe.com/legal/subscription-terms.html", evidence: "ADJUDICATED 2026-08-16 under the variable's own value table (codebook Domain 9): the only permitted values are on / off / no_recurring_billing / unknown / conflicting -- 'yes' is not among them. Both passes read the identical clause and agree on the underlying fact; re-confirmed live and unchanged 2026-08-16 via full DOM textContent: 'Your subscription will automatically renew each month without notice until you cancel... We will automatically charge you the then-current rate for your plan, plus applicable taxes, every month upon renewal until you cancel.' A vocabulary correction, not a substantive dispute. Prior values: pass1='yes' (not a valid value on this variable's own table), pass2='on'." }
  auto_renewal_disclosure_location: { value: "purchase_terms_doc", source: "https://www.adobe.com/legal/subscription-terms.html", evidence: "ADJUDICATED 2026-08-16 under the variable's own value table, which lists `terms_only` (stated in the terms of service, i.e. Adobe's General Terms of Use) and `purchase_terms_doc` (stated on a dedicated billing or subscription policy page) as separate values -- protocol 6.2's authority-tier language ('terms of service OR the dedicated policy page') ranks the two together for AUTHORITY, but this disclosure-location variable still asks which class actually states it. The renewal statement lives only on the dedicated 'Adobe Subscription and Cancellation Terms' page (/legal/subscription-terms.html), which the General Terms of Use itself names as a separate document merely incorporated by reference ('If you have agreed to the Subscription and Cancellation Terms..., then such terms are also considered part of the Terms'). Independently re-verified live 2026-08-16: full-text search of the General Terms of Use for 'renew'/'automat' returns only an unrelated passing mention of a 'renewal date' (License, 3.1), and its Fees and Payment section (7.2) refers OUT to 'your Subscription and Cancellation Terms' rather than stating anything itself -- no affirmative renewal statement exists there, ruling out terms_only. Also re-confirmed absent from the fully-expanded pricing-page FAQ and from the help-center cancellation article (fetched live), ruling out pricing_page / help_center_only / multiple. Sole qualifying class = purchase_terms_doc. Prior values: pass1='terms_only' (used 'terms-class' to mean protocol 6.2's authority tier, conflating it with this variable's own terms_only/purchase_terms_doc distinction), pass2='purchase_terms_doc'." }
  renewal_notice_commitment: { value: "no_notice_stated", source: "https://www.adobe.com/legal/subscription-terms.html", evidence: "AGREED (pass 2's evidence text is more precise and is the wording carried through here). Month-to-month Subscription Terms state renewal happens 'without notice'; the document's only advance-notice commitment ('We may change your plan's rate each monthly renewal term, and we will notify you of any rate change with the option to cancel') is specific to RATE CHANGES, not a general pre-renewal-charge notice. No document commits to notifying the buyer before an ordinary same-rate renewal charge. Re-confirmed live 2026-08-16, unchanged." }

  # ---- Domain 10: refund and cancellation terms ----

  refund_policy_exists: { value: "yes", source: "https://www.adobe.com/legal/subscription-terms.html", evidence: "AGREED. Month-to-month Cancellation Terms: 'If you cancel within 14 days of your initial order, you'll be fully refunded.' Independently confirmed by the help-center article 'Cancel Adobe trial or subscription', re-fetched live by this adjudicator 2026-08-16." }
  refund_window_days: { value: 14, source: "https://www.adobe.com/legal/subscription-terms.html", evidence: "AGREED. 'If you cancel within 14 days of your initial order, you'll be fully refunded.' Same figure independently stated in the help-center cancellation article." }
  refund_conditions: { value: "unconditional", source: "https://www.adobe.com/legal/subscription-terms.html", evidence: "AGREED. 'If you cancel within 14 days of your initial order, you'll be fully refunded.' No usage threshold, stated reason, or approval step is attached beyond cancelling within the window." }
  cancellation_self_serve: { value: "self_serve_documented", source: "https://www.adobe.com/legal/subscription-terms.html", evidence: "AGREED. 'You can cancel your subscription anytime via your Adobe Account or by contacting Customer Support.' Self-serve is explicitly documented; corroborated with concrete steps by the help-center cancellation article." }
  refund_policy_location: { value: "multiple", source: "https://www.adobe.com/legal/subscription-terms.html", evidence: "ADJUDICATED 2026-08-16 -- combines coverage rather than picking a side. Under the variable's own rule ('multiple is for agreement across two or more classes'): the dedicated Subscription and Cancellation Terms page (a distinct document from the General Terms of Use, correctly classed dedicated_refund_page by pass 2) states the 14-day full-refund position, AND the official help-center article 'Cancel Adobe trial or subscription' independently states the SAME position in agreement: 'Cancellation fee and refunds: A refund depends on when you cancel and the type of subscription you purchased. For most plans, you get a full refund if you cancel within 14 days of your initial purchase.' Re-fetched live by this adjudicator 2026-08-16 -- verbatim match to pass 1's quote, current and unchanged. Two classes (dedicated_refund_page + help_center) in agreement = multiple, per the rule's own text. Pass 2 never opened this help-center URL -- it is absent from pass 2's `sources` list entirely -- and so classified from the one document it read; pass 1 found this second, corroborating official document but filed subscription-terms.html under an imprecise internal label ('terms-class') rather than the variable's own dedicated_refund_page value. Pass 1's final coded value (multiple) is nonetheless correct once the right two classes are named. Prior values: pass1='multiple', pass2='dedicated_refund_page'." }

  # ---- Domain 11: commercial-use rights ----

  commercial_use_lowest_tier: { value: "free", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. Plans-page FAQ (readable once fully expanded -- pass 2 and this adjudicator both confirm): 'Are Adobe Firefly outputs safe for commercial use? ... Outputs generated with Adobe Firefly AI models can be used for commercial purposes.' Not conditioned on any paid tier. Independently corroborated by the generative-credits FAQ: 'For features without the beta label, you can use Adobe Firefly-generated outputs in your commercial projects.' (Pass 1 sourced the same finding from Adobe Express's pricing-page FAQ because Firefly's own FAQ accordion would not expand in that session -- a tooling gap, not a document gap; both land on the same value.)" }
  watermark_removal_tier: { value: "unknown", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. No document read states which tier(s), if any, apply or remove a watermark on Firefly outputs; neither the plans-page feature grid nor the help-center comparison table carries a watermark row for any tier. The Gen AI Product Specific Terms bar removing watermarks 'that MAY be generated' -- conditional wording, not a statement of when or for whom they are generated." }
  output_ownership_statement: { value: "user_owns", source: "https://www.adobe.com/legal/terms.html", evidence: "AGREED. General Terms of Use sec. 4.2: 'you... retain all rights and ownership of your Content. We do not claim any ownership rights to your Content.' The Gen AI Product Specific Terms sec. 1 ties this directly to Firefly: 'The Input and Output are your Content... and all provisions governing Content in the Terms apply to the Input and Output.' See conflict_note re: a superseded (2024-06-04) version's broader free-user license clause, absent from the version in effect at both collection dates and confirmed still absent today." }

  # ---- Domain 12: undisclosed or unverifiable limits ----

  usage_cap_quantified: { value: "some_quantified", source: "https://www.adobe.com/products/firefly/plans.html", evidence: "AGREED. Firefly Standard's numbered limits: '2,000 [credits] per month', 'Up to 20' 5-second videos/month, 'Up to 6 minutes' translation/month, 'Up to 200' sound effects/month -- all quantified rates. Against these, 'Unlimited access to standard image features' is itself qualified by a discretionary, unquantified clause elsewhere (see unquantified_limit_clause), so per rule 3 it does not count as quantified. At least one of each = some_quantified." }
  unquantified_limit_clause: { value: "present", source: "https://www.adobe.com/go/adobe-gen-ai-addl-terms", evidence: "AGREED. Gen AI Product Specific Terms (current, 2026-04-23 version, confirmed still in effect): 'Adobe reserves the right to throttle, limit, disable, suspend, or terminate your right to use or access the generative AI features at any time in our sole discretion without prior notice to you.' A discretionary, no-figure standard qualifying the advertised-unlimited standard-feature benefit -- read in full, not found via keyword search alone." }

