default_display_state: >
  "Pay annually" toggle carries aria-checked="true" and "Pay monthly" aria-checked="false" on
  load -- this control is genuinely server-rendered (present verbatim in the raw archived HTML,
  not gated behind hydration) and was independently re-verified byte-for-byte against the cited
  20260812101105 capture, plus two further window-dated captures (20260810120031, 20260810211659)
  which are byte-identical on every point checked. Currency is USD: the vendor's ld+json publishes
  an explicit US-region USD Offer for every plan ("Basic -- Annually", price 228.00) and the page
  carries its own currency selector. The on-screen PRICE-CARD NUMERALS require client-side
  hydration that no archived capture performed (raw HTML shows a bare "pricing-cards__loading"
  spinner, --pricing-cards-columns:4, and zero "$" characters anywhere in the document) -- this was
  independently reproduced against a fresh live curl fetch and a WebFetch of the live page today,
  both of which also show the loading placeholder and no rendered prices, so it is a property of
  the page's architecture, not a fluke of one capture. Money figures are therefore read from the
  embedded ld+json Offer data under the deviations-for-adjudicators.md caveat: the archive stored a
  pre-hydration shell, the payload is not the disclosure, it is the route to it. FOUR plan columns
  (Basic/Core/Plus/Advanced) are independently confirmed, not from ld+json alone but from the
  comparison table's row VALUES, which ARE genuinely server-rendered (unlike the price cards) --
  e.g. the "AI Credits" row reads ['10 credits (one-time)', '20 credits per month', '40 credits per
  month', '120 credits per month'], four real, distinct values, verified directly against the raw
  archived HTML.

