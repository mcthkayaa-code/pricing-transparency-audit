coder_note: |
  2026-08-17 ADJUDICATION SUMMARY. A mechanical diff (not the second coding's own summary of what
  it found notable) surfaces SIX disagreements, not three. All six are resolved by rule below: four
  to a determinate value (headline_price_usd, first_charge_amount_usd [dependent], mandatory_addon_
  present, commercial_use_lowest_tier) and two to `unknown` with a stated kind (trial_auto_converts
  = vendor_silence, credit_rollover_policy = instrument_gap). No `date_explained` or `variant_
  explained` classification applies to any of them -- reasoning below. Zero disagreements were left
  as an unresolved "pick a side"; every one was decided by applying a named rule to independently
  re-verified vendor evidence, not by majority or by trusting either prior record's account.

  ENTRY-TIER SELECTION (sampling-rules.md 7.2). Both passes agree the entry tier is named "Basic";
  they disagree about its PRICE. The vendor's pricing page defaults to "Pay annually" (aria-checked
  ="true", independently re-verified server-rendered, undisputed). Under 7.2's price basis (lowest
  annual-equivalent single-seat cost in the default display state), and using prices independently
  re-derived from the vendor's own ld+json Offers -- cross-checked byte-identical across THREE
  window-dated archive captures (20260810120031, 20260810211659, 20260812101105) plus a live re-
  fetch today -- the four eligible candidates are:
    - Basic:    228.00/yr  <- WINNER (entry_tier_name), unchanged from both prior passes
    - Core:     348.00/yr  (losing candidate)
    - Plus:     588.00/yr  (losing candidate; pass 1 MISSED this plan entirely -- see below)
    - Advanced: 1,188.00/yr (losing candidate)
  Basic wins regardless of which headline figure is used (144 or 228), so entry_tier_name itself was
  never in dispute. What was in dispute is BASIC'S OWN PRICE, which the price selection does not by
  itself resolve -- see next section.

  WHICH WAY THE DEPENDENCY RUNS (per this item's brief). headline_price_usd/first_charge_amount_usd
  were resolved FIRST and INDEPENDENTLY of mandatory_addon_present: the ld+json price data is stable
  across 3 separate window captures and does not depend on how the transaction-fee question is
  answered. mandatory_addon_present was THEN resolved independently too, on the definitional
  character of the fee (percentage-based, usage-contingent, genuine $0 floor, not charged to the
  buyer's own card) -- an argument that holds identically whether the headline is 12 or 19. So,
  contrary to this item's working hypothesis, the two do NOT mechanically drive each other in this
  record: both were separately determinable from the vendor's own documents, and both happen to
  resolve toward the for-cause value, but for two unrelated reasons (a verifiable-document reason
  and a construct-definition reason), not because fixing one force-fixes the other.

  WHY THE PRICE DISPUTE IS NOT date_explained OR variant_explained. date_explained requires a
  vendor_edit register entry accounting for the gap between the two collection dates (2026-08-12 vs
  2026-08-17); NO archive.org capture of this URL exists anywhere between 08-12 and today (checked
  the full CDX range), and the ld+json price data is identical on 08-10 and 08-12, so there is no
