coder_note: |
  ADJUDICATION SUMMARY, 2026-08-16. 8 substantive disagreements (a 9th item, computation_assumptions,
  is prose that follows mechanically from cost_per_output_computable and is not counted separately).
  All 8 resolved by rule; none coded unknown. Zero date_explained: neither record carries a
  vendor_edit register event (pass 1 carries one display_variant event only, pass 2 carries none), and
  a display_variant entry can never supply date_explained under protocol 7.4.1. Zero variant_explained:
  none of the 8 disagreements trace to the vendor serving two simultaneous display states with two
  archive snapshots to show it (protocol 7.4.2's bar); every one traces either to differential document
  coverage between the two passes or to a genuine rule-interpretation question over identical facts.

  This vendor renders its pricing figures through an animated digit-roller inside a shadow DOM
  (<number-flow-svelte>), which returns nothing to plain-text extraction. Both passes correctly worked
  around this (screenshots, DOM shadow-root inspection, embedded JSON, ld+json) rather than coding
  unknown from an empty extraction; the adjudicator weighted the page's own structured data and a live
  screenshot/DOM re-check above extracted text throughout, consistent with this study's general
  practice for this vendor.

  Resolution shapes, by variable:
  - first_charge_amount_usd (63.00) and free_plan_cap_value (six caps, adds "up to 20 members"): the
    "neither coder wrong" coverage pattern. The decisive document (embedded hydration JSON; ld+json
    Free-Plan Offer description) was present in BOTH coders' own raw captures, verified by the
    adjudicator via direct grep; only one coder had actually opened/cited it.
  - failed_generation_charge_policy (not_charged): the same coverage pattern, one-sided -- only pass 1
    checked the /docs/developers/ tree at all. Carries a caveat: the adjudicator found (neither coder
    had) that the API bills through a separate USD balance, independent of consumer compute units,
    which leaves genuine but not decisive uncertainty about the exact scope of job-lifecycle's policy
    statement.
  - unquantified_limit_clause (present): a genuine misreading, not a coverage gap -- both coders read
    the identical Terms section; pass 2's topic-keyed reading (fair use / reasonable use / throttling)
    passed over an unreasonable-load clause phrased differently but substantively on point. This is the
    exact failure mode this study's adjudication guidance warns about.
  - annual_condition_disclosure (adjacent): both coders agree on every fact (toggle position, badge
    text, absence of in-card annual language); the disagreement is pure rule-classification, resolved
    to adjacent because the codebook's toggle-label clause would be redundant with its same-card clause
    if it did not cover exactly this common shared-toggle-above-the-grid pattern. Confirmed unchanged
    against a live re-check (2026-08-16, desktop viewport, accessibility-tree DOM inspection).
  - credit_to_output_rate_published (yes), credit_rate_location (pricing_page), and
    cost_per_output_computable (yes): the closest calls in this record, entangled with each other.
    Krea sells access to dozens of interchangeable image models at wildly different credit costs (2 to
    ~400 credits/generation per model-overview.md), a "many models, one is the vendor's own unrated
    flagship" architecture the codebook's domain 5/6 worked examples -- all pitched at output-TYPE
    granularity (image vs. video) -- do not squarely anticipate, exactly as pass 2's own coder_note
    flagged. Resolved on the TYPE-level reading (matching cost_per_output_unit's own agreed per_image
    and its identical rule-1 language) and on codebook section 3's pricing-class source hierarchy. Pass
    2's alternative reading -- that Krea 2, repeatedly and explicitly called Krea's own flagship/"first
    foundation" model in both the docs and the pricing page's own copy, and which carries no published
    rate anywhere on the site -- is a real, good-faith reading of "the principal output" that a
    reasonable adjudicator could resolve the other way; it is preserved here rather than argued away,
    per this study's own instruction not to manufacture certainty the evidence does not support.

  Entry-tier selection (sampling-rules.md 7.2), carried forward unchanged from both passes -- both
  independently confirm Basic wins uncontested: Basic $63.00/yr (WINNER, per the resolved
  first_charge_amount_usd) | Pro $252.00/yr | Max $504-756/yr depending on its default compute-level
  slider position | Business $1,920/yr at its default slider position, flat team price not per-seat |
  Enterprise excluded, sales-gated, no published price | Free excluded, $0, not a paid tier.

  Adjudicator read both pass 1 and pass 2 records in full, both -sources/ directories including saved
  local copies, the codebook (domains 1-12, sections 2-5), protocol sections 6.6-6.8 and 7.4-7.4.2, and
  performed one live re-check of the pricing page and the krea-2 docs page (2026-08-16) plus one raw
  HTML grep against both passes' own static-fetch captures to verify contested quotations before relying
