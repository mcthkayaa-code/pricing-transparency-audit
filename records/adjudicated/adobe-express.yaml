default_display_state: >
  Individuals tab, the page's default segment. The bare URL geo-serves a Türkiye/TRY
  state to a Turkey-network reader (tier "Adobe Express Premium", TRY 238.80/mo incl.
  KDV, 30-day trial) and a US/USD state to others (tier "Acrobat Express", US$10.99/mo,
  7-day trial) -- both billed monthly only, no annual toggle. Per the currency-check
  protocol (deviations-for-coders.md, "Currency" arm 1), every entry-tier value below is
  coded from the US/USD state, reached via the vendor's own footer country selector,
  because the vendor publishes a USD figure and protocol 6.5 requires using it; the
  TRY-geo default is logged as a display_variant, not coded from. Neither pass's
  web.archive.org snapshot of the plain pricing URL preserves the client-side-injected
  plan/price fragment (protocol section 9, limitation 8) -- archive_status above follows
  pass 1's franker framing over pass 2's "archived" label for the identical defect (see
  coder_note, "process notes"). The operative evidence for every pricing-page-sourced
  value is the dated local text captures in both passes' -sources/ directories,
  principally pass2/adobe-express-sources/pricing-us-country-param-2026-08-14.txt (the
  US/USD state actually coded from) and pass1/adobe-express-sources/pricing-page-
  individuals-2026-08-06.txt (an independent, line-by-line transcription of the same
  comparison table taken 8 days earlier).

