  auto_renewal_default: { value: "on", source: "https://tr.wix.com/about/terms-of-use", evidence: "Unchanged value, source upgraded. Codebook rule: \"The terms of service ranks first for this variable, above the pricing page.\" ToS Sec 6.3 (\"Aboneliklerin Otomatik Olarak Yenilenmesi\"/\"Automatische Abonnementverlängerungen\"), now readable via the non-English rule (see coder_note): TR \"bazı Ücretli Hizmetler varsayılan olarak otomatik yenileme seçeneği içerir\" [certain Paid Services include an automatic-renewal option by default]; DE independently \"enthalten bestimmte kostenpflichtige Dienste standardmäßig eine automatische Verlängerungsoption\" -- TR and DE agree verbatim in substance. Corroborates, does not merely duplicate, the help-center statement pass 1 already held (\"Wix plans are set to renew automatically at the end of the subscription period\") -- now confirmed from the higher-ranked document." }
  auto_renewal_disclosure_location: { value: multiple, source: "https://tr.wix.com/about/terms-of-use", evidence: "CHANGED from help_center_only. Pass 1 coded help_center_only specifically because \"the Terms of Use body could not be read...so 'terms' cannot be confirmed\" (pass-1 evidence, this record's history). That blocker is resolved: ToS Sec 6.3, now readable via tr.wix.com/de.wix.com (non-English rule, see coder_note; quoted verbatim under auto_renewal_default above), states auto-renewal plainly, independently agreeing with the help-center article already on this record (support.wix.com/en/article/turning-off-the-auto-renewal-for-a-wix-premium-plan). Codebook rule: \"Code multiple where two or more state it in agreement, since proximity to the price is what this variable measures and repetition is the strongest form of it.\"" }
  renewal_notice_commitment: { value: advance_notice_stated, source: "https://tr.wix.com/about/terms-of-use", evidence: "Unchanged value, source upgraded and strengthened. ToS Sec 6.3 (the post-window retrieval sweep's note said \"Section 6.2\" -- verified directly and corrected: 6.2 is \"Faturalar\"/\"Rechnungen\" [Invoices], the 30-day clause is in 6.3): TR \"Wix, söz konusu Ücretli Hizmetin yenilenmesinden önce, yenileme tarihinden en az otuz (30) gün önce size bir bildirim sunmaya çalışacaktır\" [Wix will attempt to notify you at least thirty (30) days before the renewal date, before renewal of that Paid Service]; DE independently \"wird Sie Wix...mindestens dreißig (30) Tage vor dem Verlängerungsdatum benachrichtigen\" -- TR and DE agree verbatim in substance, both give 30 days, both scoped to annual/multi-year terms. A stated commitment with a stated period, meeting the codebook's advance_notice_stated definition directly. Agrees with (does not merely restate) the help-center reminder-email commitment pass 1 already found (\"Wix sends reminder emails starting 30 days before your payment is due\") -- two different document classes, two related-but-distinct mechanisms (formal contractual notice vs. reminder email), same 30-day figure, same conclusion, now from the first-ranked contractual source." }
  refund_policy_exists: { value: "yes", source: "https://support.wix.com/en/article/requesting-a-refund-for-a-premium-plan", evidence: "Unchanged from pass 1. \"Wix offers a 14-day, money-back guarantee for new Premium or Studio site plans.\" Independently corroborated, not contradicted, by ToS Sec 6.4 (\"Para İade Garantisi\"/\"Geld-zurück-Garantie\"), now readable, which states the same 14-day first-purchase-only guarantee -- checked 2026-08-17, not previously blocked since the dedicated refund page is itself first-rank authority under codebook Domain 10 rule 1." }
  refund_window_days: { value: 14, source: "https://support.wix.com/en/article/requesting-a-refund-for-a-premium-plan", evidence: "Unchanged from pass 1. Applies to both monthly and yearly plans per the dedicated refund page; ToS Sec 6.4 states the same 14-day figure." }
  refund_conditions: { value: conditional, source: "https://support.wix.com/en/article/requesting-a-refund-for-a-premium-plan", evidence: "Unchanged from pass 1. \"The 14-day refund policy only applies to new Premium or Studio plans...does not apply if...requesting a refund for a plan renewal...for the upgrade of an existing plan.\" ToS Sec 6.4 states the same first-purchase-only condition." }
  cancellation_self_serve: { value: self_serve_documented, source: "https://support.wix.com/en/article/canceling-a-wix-premium-plan", evidence: "Unchanged from pass 1. Step-by-step self-serve cancellation via account settings. ToS Sec 7.1, now readable, corroborates without conflict: cancellation is available \"at any time\" per Wix Services' own instructions, with a pointer to the Help Center for details." }
  refund_policy_location: { value: multiple, source: "https://www.wix.com/plans", evidence: "Unchanged from pass 1. Pricing-page banner plus dedicated refund help-center page." }
  commercial_use_lowest_tier: { value: unknown, source: "https://tr.wix.com/about/terms-of-use", evidence: "Unchanged value. unknown_kind=vendor_silence. I independently re-read (2026-08-17, via the non-English rule, not merely trusting the first retrieval sweep's account) ToS Sections 2 (Obligations, incl. the 2.3 prohibited-conduct list), 3 (Content and Ownership, incl. 3.2 Wix's own IP), and 8 (E-Commerce, seller obligations for User Products): no clause grants or restricts, by tier, the right to use outputs/site content commercially. Every commercial-use-adjacent clause runs the other way -- restricting exploitation of WIX's own Licensed Content/assets (Sec 2.3), or governing a seller's tax/delivery/legality obligations when using the e-commerce feature (Sec 8) -- none gates a user's own commercial-use right by plan. Independently keyword-checked the pricing page (always English-readable): zero occurrences of \"commercial\". Both first-ranked (ToS) and second-ranked (pricing-page grid) document classes read and silent on a tier-gated right: vendor silence, not an access gap." }
  watermark_removal_tier: { value: lowest_paid, source: "https://support.wix.com/en/article/wix-premium-plan-pricing", evidence: "Unchanged from pass 1. Light is the entry paid tier and the lowest tier at which ad/branding removal is granted." }
  output_ownership_statement: { value: user_owns, source: "https://tr.wix.com/about/terms-of-use", evidence: "CHANGED from unknown. ToS Sec 3.1 (\"Fikri Mülkiyetiniz\"/\"Ihr geistiges Eigentum\"): between you and Wix, all IP rights in your User Content belong to you; Wix claims no ownership right. Sec 5.4 (\"Çıktı Sahipliği\"/\"Eigentum an den Ausgaben\" -- AI Output Ownership specifically) extends this to AI outputs in the same terms, qualified only by TR \"Wix'e ait önceden var olan herhangi bir fikrî mülkiyeti içermediği bir çerçevede\" / DE \"insoweit diese keinerlei bereits zuvor bestehendes geistiges Eigentum von Wix beinhaltet\" [to the extent the Output contains no pre-existing Wix IP] -- a subject-matter scope carve-out inherent to any output-ownership clause (a vendor cannot grant away its OWN pre-existing IP), not a tier/use-type/subscription-status gate, so it does not meet the codebook's own definition of conditional (\"Rights depend on tier, on use type, or on a subscription staying active\"). Sec 5.5 grants WIX a non-exclusive, sublicensable, worldwide licence over Inputs/Outputs for service improvement and model training -- a licence FROM the user TO Wix, the ordinary operational pattern, which does not convert this into vendor_license_retained (that value requires the VENDOR to retain ownership and license back to the user -- the reverse of what these clauses say). TR and DE agree verbatim in substance on all three clauses. Codebook rule applied: \"The terms of service ranks first...code from the terms\" -- read directly from Sections 3.1/5.4/5.5, not inferred from marketing." }
  usage_cap_quantified: { value: some_quantified, source: "https://support.wix.com/en/article/about-storage-and-bandwidth", evidence: "Unchanged value, reasoning corrected. Light: \"2 GB\" storage remains a quantified standing limit. Pass 1 treated \"Unlimited\" bandwidth as quantified via the unlimited carve-out because \"no qualifying clause located\" -- that search was defeated by the same ToS access failure resolved elsewhere on this record. ToS Sec 2.2 item 7, now readable (non-English rule, see coder_note), reserves Wix's right to impose per-plan, unquantified restrictions expressly including \"network trafiği ve bant genişliği\"/\"Bandbreite\" (network traffic and bandwidth) -- no figure attached, TR and DE agree. Per usage_cap_quantified rule 3 (\"Unlimited counts as quantified only where no clause elsewhere qualifies it\"), the bandwidth claim is therefore not cleanly quantified after all. Categorical value is unaffected either way: Light still has at least one quantified limit (storage, 2GB) and at least one not (now both bandwidth and the already-hedged AI-credit allowance) -- some_quantified under both readings." }
  unquantified_limit_clause: { value: present, source: "https://tr.wix.com/about/terms-of-use", evidence: "CHANGED from unknown. TWO independent unquantified-standard clauses found in ToS Section 2, read via tr.wix.com/de.wix.com (English Sections 2-19 do not render -- non-English rule in coder_note). (a) Sec 2.2 item 7: Wix reserves the right to impose different, per-plan restrictions on upload/storage/download/use including but not limited to network traffic and bandwidth, content size, download volume, subscriber count, storage volume -- no figure given for any. (b) Sec 2.3 prohibited-conduct list: TR \"makul olmayan, aşırı veya orantısız büyüklükte bir yük\"; DE independently \"unzumutbaren und unverhältnismäßigen Last\" [placing an unreasonable, excessive or disproportionately large burden] on Wix Services or interfering with server/network operation. Both are vendor-discretion, no-number standards on VOLUME/INTENSITY of use, matching the value table's own \"excessive use\" and \"abuse thresholds\"/\"throttling at the vendor's discretion\" entries -- read before, and controlling over, the decision rule's single illustrative example, per this study's own instruction that a table is never bound by its example. Decision rule 3's carve-out is for a prohibition on illegal/abusive CONTENT; these clauses are not about content legality, they are about USE VOLUME, which is exactly what this variable is defined to cover, so rule 3 does not exclude them. Read Section 2 in full for this determination (rule 1); a present finding does not require exhausting the remaining, topically unrelated sections (10-19: third-party services, logo maker, Wix Studio, warranty, liability, arbitration) the way an absent finding would." }

coder_note: |
  2026-08-17 ADJUDICATION SUMMARY (coder_pass 3). NOT a two-coder disagreement -- wix was
  single-coded (pass 1 only; no pass-2 record exists for this product). This adjudication was
  triggered by a 2026-08-17 post-window supplementary retrieval (orchestrator/
  post-window-retrieval.md and post-window-retrieval-2.md) that recovered the vendor's Terms of
  Use body -- confirmed unreadable in English across 4 independent pass-1 attempts -- via two
  non-English locale renderings, and explicitly declined to code the result, referring the
  construct question on unquantified_limit_clause, the non-English sourcing-rule question, and
  the renewal-notice/trial/output-ownership questions to adjudication.

  Of 37 coded variables: 3 values CHANGED by rule (unquantified_limit_clause unknown->present;
  output_ownership_statement unknown->user_owns; auto_renewal_disclosure_location
  help_center_only->multiple). 3 values UNCHANGED but re-sourced/strengthened from the
  newly-readable ToS (renewal_notice_commitment stays advance_notice_stated with an upgraded
  citation and a corrected section number, 6.3 not 6.2; auto_renewal_default stays "on" with an
  upgraded citation; usage_cap_quantified stays some_quantified with corrected reasoning about
  the "unlimited" bandwidth claim). 2 pre-existing unknowns CONFIRMED with an explicit kind
  declared (commercial_use_lowest_tier, failed_generation_charge_policy; both
  unknown_kind=vendor_silence). 4 trial-domain variables (trial_exists, trial_card_required,
  trial_length_days, trial_auto_converts) CHECKED against the newly-readable ToS Sec 6.6 and
  found not to conflict; left unchanged. refund_policy_exists/refund_window_days/
  refund_conditions/cancellation_self_serve independently corroborated by the newly-readable ToS
  (Secs 6.4, 7.1) without contradiction; left unchanged. The remaining ~24 variables pass through
  untouched. 0 values were newly coded unknown by this adjudication. 0 date_explained or
  variant_explained classifications: protocol 7.4.1 requires a vendor_edit register entry and
  7.4.2 requires two archive snapshots of the SAME URL showing two DISPLAY states; neither
  mechanism fits a retrieval-capability change (a document became readable that previously was
  not, via a route -- a different locale -- that was always live), so neither classification is
  claimed.

  === NON-ENGLISH SOURCING RULE (stated once, applied to every ToS-sourced value above) ===
  Wix's English Terms of Use (www.wix.com/about/terms-of-use) has a confirmed, PERSISTENT,
  vendor-side rendering defect: Sections 2-19 fail to display. This is not new and not
  window-specific -- the SAME broken "terms updated" banner (unfilled "[date of publication]" /
  "[enter future date- ~2 weeks from publications]" placeholder tokens) with an incrementing
  "Last Revised" label appears in a Wayback capture from 2026-03-20 (reading "January 5, 2026")
  and in the pass-1-cited 2026-08-13 capture and my own 2026-08-17 read (both reading "July 9,
  2026") -- five continuous months of the identical failure. I checked this specifically because
  it raised a real concern (had English been substantively re-issued after the Turkish/German
  30-October-2025 date?): the answer is no, this broken banner is a long-standing, unrelated
  widget malfunction, not evidence of a post-window rewrite, and see the window-era-warrant
  paragraph below for the direct check.

  The IDENTICAL instrument renders completely, via Wix's own first-party infrastructure (server:
  Pepyaka; x-meta-site-is-wix-site: 1; content-language negotiated server-side per locale; NOT a
  third-party embed -- verified by comparing response headers across the English, Turkish and
  German URLs today), at tr.wix.com/about/terms-of-use and de.wix.com/about/terms-of-use: same
  19-section spine, same topic order (2 Obligations / 3 Content-Ownership / 5 AI Services / 6
  Fees / 7 Cancellation / 8 E-Commerce ... 19 Arbitration), same Israel addendum. Both self-date
  "last updated: 30 October 2025." Both independently, in their own language, at ToS Section 17
  (General), state that the document was authored in English and translated into other languages
  for the reader's convenience, with the English version controlling in case of conflict (TR:
  "Bu Kullanım Koşulları İngiliz dilinde yazılmış ve kolaylık sağlamak amacıyla diğer dillere
  tercüme edilmiştir...İngilizce versiyonda yer alan hükümler geçerli olacaktır"; DE: "Diese
  Nutzungsbedingungen wurden in englischer Sprache verfasst und zum besseren Verständnis in
  andere Sprachen übersetzt...die Bestimmungen der englischsprachigen Version genießen
  Vorrang"). That is the vendor's OWN confirmation that these are genuine parallel translations
  of ONE governing instrument, not two coincidentally similar documents.

  Critically -- per the specific check this adjudication was asked to run -- this is NOT the
  client-side, request-locale-driven rendering-of-one-source artifact the second retrieval sweep
  found on a different product in this same study (a Termly-hosted ToS whose own API response
  carried "locale":"en" and "created_locales":["en"], proving only English was ever authored and
  the non-English text a coder met there was the SAME English source relocalised on the fly by a
  third-party widget -- one document, one reading, not two). I checked for the equivalent signal
  here and found the opposite: no third-party viewer, no machine-translation banner, and instead
  a first-party-served, professionally structured, self-dated, hreflang-declared pair of complete
  legal documents whose revision date and every quoted clause I checked agree with each other and
  with archive captures independent of today spanning three months (2026-05-18 through
  2026-08-05). Wix's tr/de pages are a different KIND of evidence than the Jobscan case, not
  merely a similar-looking one, and I verified the difference rather than assuming it.

  RULE: where two independently-fetched non-English locales of the vendor's own contractual
  document agree on a clause, and I have no reason to think the operative English wording would
  read differently (per the two paragraphs above), I code the construct from that text, and I
  flag every such value's evidence as resting on a non-English rendering of the vendor's own
  document rather than a confirmed reading of the (defectively-rendered) English original.
  Protocol section 9 item 6 ("English-language public pages only...understates disclosure for
  non-English-first vendors") does not govern this case and I am not applying it as a bar: that
  limitation describes a non-English-first vendor whose disclosure exists only in another
  language BY DESIGN, which this study's ordinary English-only collection practice would then
  undercount. Wix is not that. English is this document's own stated authoritative language, an
  English URL and template exist and are clearly intended to serve it, and five other document
  classes on this very record (pricing page, four help-center articles, blog post) are English
  and were read normally. This is a narrow, persistent RENDERING DEFECT on one locale of a
  document the vendor otherwise publishes, and plainly intends to publish, in English -- not a
  vendor choice to withhold English content. Where I could not obtain two independently-agreeing
  non-English locales for a construct, I did not apply this rule and left the value as pass 1
  coded it.

