conflict_note: |
  REFUND (refund_policy_exists, refund_window_days, refund_conditions) -- https://nicepage.com/terms
  vs https://nicepage.com/agreement, tied rank 1 for contractual variables (protocol 6.2: "terms of
  service or the dedicated policy page" is one combined class; nothing ranks a Terms-of-Use page
  above or below a License Agreement page). /terms, Refund Policy section: "You can request a refund
  within 14 days of the purchase date. Please be prepared to describe why you requested a refund via
  Microsoft Teams or phone and explain the actual reasons, and we will review your request."
  /agreement, Miscellaneous item 1: "The Nicepage.com website is under no obligation to refund your
  subscription fee under any circumstances. In case Nicepage.com determines that you are entitled to
  a refund of all or part of your subscription fee, such refund shall only be made to the credit card
  account originally used by you to purchase your Subscription. If your Subscription was paid by
  check, your refund would be made by check." Both passes independently quoted these same two
  clauses and both flagged the tension; they diverged only on whether it resolves (pass 2, reading
  one coherent discretionary policy) or stands (pass 1). Adjudicated as standing: protocol 6.2
  supplies no rank between the two documents, so codebook 2.1 step 3 governs, and a stated 14-day
  request-and-review process is an incompatible position against "no obligation... under any
  circumstances" with no window and no described buyer process -- reconciling them into one policy
  requires deciding which document's language is figurative, which the documents-only rule does not
  authorize a coder to do.

  NEW, captured by neither pass. Re-read the raw page text 2026-08-16 (both pages otherwise
  unchanged since collection -- see coder_note register-events check). /terms's own header, above
  its "Overview" section: "Please also read the License Agreement for Web Templates." -- /terms's
  own characterization names /agreement with a narrower scope (templates) than the software
  subscription /terms itself governs ("This Agreement governs your use of the Nicepage.com website
  and any services offered through the Nicepage.io website"). /agreement's own title: "End-User
  License Agreement For Nicepage (\"Software\")" -- a broader scope than templates. /agreement's
  opening paragraph additionally names a "Standard License subscription" and an "Extended License
  service," terms used nowhere else in either document and matching neither /premium's own
  Personal/Business/Pro/Ultimate tier names nor its own Subscription/License toggle. The vendor's
  own documents do not agree with each other about what /agreement covers. This does not resolve the
  refund tension toward either side -- it adds a second, independent layer of the same finding: a
  buyer reading both official documents cannot determine, from their face, either which refund
  position governs or which document governs at all.
