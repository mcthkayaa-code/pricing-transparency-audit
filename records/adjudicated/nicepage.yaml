default_display_state: |
  https://nicepage.com/premium loads on the "Subscription" toggle by default (not "License", i.e.
  recurring not one-time) -- all four paid tiers billed annually only, no monthly-recurring
  alternative offered anywhere on the page; USD $ prices with no currency/locale selector or
  variation (checked by both passes under D-003; pass 2 additionally read from a Turkey-based
  network location and still got plain USD). Business tier badged "Popular". Cookie banner offers
  "Accept" only, no visible decline control (both passes accepted it, after capturing pre-consent
  values). Confirmed unchanged on an independent raw-HTML re-fetch 2026-08-16 (not a summarizer):
  embedded baseSubscriptionPrices JSON reads personal=6.75/business=12.75/pro=18.75/ultimate=31.75,
  identical to both prior reads. Agreed independently by both passes and by this adjudicator -- not
  itself a disputed variable, and no basis for a variant_explained classification (protocol 7.4.2
  needs two archive snapshots of two DIFFERENT default states; all three reads recorded the same
  one state).

