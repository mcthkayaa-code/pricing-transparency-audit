coder_note: |
  ADJUDICATION SUMMARY (2026-08-16). tools/disagreements.py nicepage finds 5 substantive
  disagreements (free_plan_cap_value, trial_auto_converts, refund_policy_exists, refund_window_days,
  refund_conditions) plus 1 non-substantive prose mismatch (computation_assumptions -- same
  arithmetic, different wording). All 5 resolved by rule; 0 coded unknown. 1 resolves to pass 2's
  value (trial_auto_converts, a coverage gap: pass 1's own `sources:` list never includes the
  trial-limitations doc pass 2 found). 3 resolve to pass 1's value (the refund cluster, under
  protocol 6.2's equal-authority hierarchy, reinforced here with evidence neither pass captured --
  see below and conflict_note). 1 (free_plan_cap_value) lands on a string that happens to equal
  pass 1's verbatim, but not because pass 1 was deferred to: it is what pass 2's OWN saved DOM
  capture already recorded before pass 2's final coded field drifted from it -- see that variable's
  evidence for the full chain. No variable in this record required inventing a value neither pass
  supported; the closest case (free_plan_cap_value) is a labeling duplicate resolved by reading the
  page, not a numeric dispute.

  REGISTER EVENTS. Both pass1.yaml and pass2.yaml carry `register_events: []`. No vendor_edit entry
  exists for this product, so no disagreement qualifies for `date_explained` (protocol 7.4.1)
  regardless of the 5-day gap between collection dates (2026-08-10 / 2026-08-15): re-fetched
  https://nicepage.com/premium, /terms, /agreement, and /doc/4720/trial-limitations live 2026-08-16
  (raw HTML/text, not a summarizer) and confirmed the embedded pricing JSON, both refund clauses,
  and the trial-reversion sentence are all unchanged in substance from both passes' captures --
  nothing moved in this window. No disagreement qualifies for `variant_explained` (7.4.2) either:
  all three reads (pass 1, pass 2, this adjudicator) independently recorded the SAME default display
  state (Subscription tab, annual-only, no monthly toggle, plain USD, no locale variance) -- there
  are not two archive snapshots of two different default states to compare. All 5 disagreements
  resolved by rule; 0 by date_explained; 0 by variant_explained.

  THE PRICE-READING CHECK (task-specific caution, applied). Nicepage's pricing cards draw the cents
  as a superscript ('<sup>75</sup>'), so a plain-text/innerText extraction of '$6.75/mo' reads
  '$675/mo' -- a 100x misread. Both passes independently hit this and both independently caught it
  (pass 1 via embedded JSON + raw markup + screenshot; pass 2 via raw DOM + an archive.org crawler
  re-render), so headline_price_usd/first_charge_amount_usd were never in dispute and are carried
  through unchanged. This adjudicator introduced no new price figure from extracted text at any
  point -- the one live re-fetch of /premium used for this record was raw HTML grepped for the
  embedded JSON and the literal '<sup>' markup, never a summarizer, and every quantity pulled from
  WebFetch summaries (project/site counts, the trial doc's sentence) was a small count or a policy
  sentence, not a price, so the superscript failure mode does not apply to it.

  FREE_PLAN_CAP_VALUE -- full chain. Re-fetched https://nicepage.com/premium raw HTML 2026-08-16:
  BOTH label pairs are genuine, simultaneous vendor text in two different page regions. The per-tier
  pricing-card bullets (5 occurrences each, one per tier column) read "App Projects" (tooltip: "2
  projects in the Windows and Mac OS applications") and "HTML Sites" (tooltip: "Publish 2 HTML sites
  on your own hosting"). The detailed "Compare plans" table (1 occurrence each, as its own row
  label) reads "Desktop Projects" and "Online Projects" for the identical two caps -- the tooltips
  confirm these name the same two features. Pass 2's own premium-comparison-table-dom-evidence.txt
  (lines 40-41) independently extracted "Online Projects": 2 and "Desktop Projects": 2 from that
  same table -- matching pass 1 exactly -- yet pass 2's coded `free_plan_cap_value` field used the
  pricing-card wording instead, with no note explaining the switch. Adopted the comparison-table
  wording (= pass 1's string) because it is the single source both passes otherwise drew the other
  six of eight items from, and because it is what pass 2's own more rigorous capture already said.

  REFUND CLUSTER -- why it stands as conflicting rather than resolving. Both passes read the
  identical two documents and quoted the identical two clauses; they diverged only on whether the
  tension between them resolves into one policy or stands as a genuine conflict. Protocol 6.2's
  table gives contractual variables ONE combined rank-1 class -- "terms of service or the dedicated
  policy page" -- so nothing in the hierarchy ranks a Terms-of-Use page over a License Agreement
  page or the reverse; codebook 2.1 step 3 is explicit that equal rank plus incompatible values
  means `conflicting`, not a pick. Harmonizing the two into "one coherent discretionary policy" (as
  pass 2 did) requires deciding that /agreement's "under no obligation... under any circumstances"
  is reservation-of-rights language that does not really mean what it says, which is an act of legal
  interpretation the documents-only rule does not ask a coder to perform -- the task brief for this
  adjudication names this directly: apply 6.2's hierarchy, not which document sounds more binding.
  Re-reading the raw page text 2026-08-16 turned up two things neither pass's evidence file quotes,
  and both cut toward more indeterminacy, not less: (1) /terms's own header instructs "Please also
  read the License Agreement for Web Templates" -- /terms's own characterization of /agreement's
  scope is narrower than the software subscription. (2) /agreement's own title reads "End-User
  License Agreement For Nicepage (\"Software\")" -- broader than templates -- and its opening
  paragraph names an undefined "Standard License subscription" and "Extended License service", terms
  used nowhere else in the document and matching none of /premium's own tier or toggle names. The
  vendor's own materials do not agree with each other about what /agreement even covers. This does
  not tip the substantive refund conflict toward either document -- if anything it adds a second,
  independent axis of the same finding: a buyer reading both official pages cannot determine, from
  their face, either which refund position governs or which document governs at all. Full quotes in
  conflict_note.

  ENTRY-TIER CANDIDATES (unchanged from both passes, re-verified 2026-08-16): Personal $6.75/mo x 12
  = $81.00/yr (SELECTED, lowest). Losing: Business $12.75/mo x12=$153.00; Pro $18.75/mo x12=$225.00;
  Ultimate $31.75/mo x12=$381.00. All four generally available, purchasable without contacting
  sales, standing, single-seat -- Business's "Popular" ribbon is irrelevant since the tiebreak rule
  only applies to equal annual-equivalent costs. The one-time "License" toggle option (Personal $89
  / Business $169 / Pro $269 / Ultimate $439) is not part of the default display state and was
  correctly excluded by both passes under sampling-rules 7.2 rule 1 / protocol 6.8.

  BLINDNESS-EXPOSURE CHECK (D-014). Confirmed nicepage's pass-2 record is NOT in
  `records/pass2-contaminated/` (that directory holds only 10web, adobe-express, copyleaks,
  elevenlabs, krea-ai). `orchestrator/deviations-log.md` lists nicepage in D-014's "Tier A" exposure
  set (a coded value/relationship was named in the log, which was on an EARLIER version of the
  pass-2 reading list), but nicepage's own pass-2 collection_date (2026-08-15) postdates D-014's fix
  (2026-08-14, which replaced the reading list with `deviations-for-coders.md` and removed the full
  log from it) -- so this record was at risk under the pre-fix process but not actually coded under
  it. Noted for the record rather than silently assumed clean.

  DISCLOSURE. A directory-wide grep for "nicepage" across `orchestrator/*.md` (run to check for
  product-specific orchestrator notes, which this role is permitted to read) incidentally matched
  one line of `orchestrator/interim-signals.md`, a file this role is instructed not to read: a
  fragment naming nicepage as an example of an "Equal-authority contradiction" pattern. Not opened
  further. This adjudicator's `conflicting` determination on the refund cluster was already fully
