  free_plan_watermark: { value: "yes", source: "https://help.openai.com/en/articles/12460853-creating-videos-with-sora", evidence: "RESOLVED (one of the six sweep 3 held), independent of how free_plan_exists resolves. 'Creating videos with Sora' -- IN SCOPE, read in full 2026-08-17, dated 'Updated: 8 days ago' on the 2026-03-29 capture (~2026-03-21, closest in-scope watermark statement to the 2026-04-26 shutdown) -- states: 'A watermark will appear on downloaded videos in the following situations: ... You are not subscribed to ChatGPT Pro ... In these cases, the downloaded video will include a watermark.' This condition is framed by subscription status, not by a named free/paid tier, so it determines the outcome for ANY non-Pro access to Sora, including a free-tier route if one exists: whatever the free plan turns out to be, a user on it is by construction 'not subscribed to ChatGPT Pro' and therefore watermarked under this rule. Corroborated by 'Getting started with the Sora app' (2026-04-07 capture, content dated ~Feb 2026): 'Are videos watermarked? Yes. At launch, all Sora videos include a visible moving watermark.' Codebook §7 rule ('a pricing-table row ... is a documented yes for the free plan') read per the deviations-doc caution to look at what the rule actually requires rather than only its worked illustration: a documented, unconditional trigger covering every non-Pro route is functionally the same disclosure as an explicit free-column cross. This does NOT depend on resolving free_plan_exists; flagged here as a judgment call so a reader can independently disagree. Cannot be dated to the window; dated to 2026-03-21 (primary) / ~Feb 2026 (corroborating), both well before the 2026-04-26 shutdown; discontinued-stratum coding." }
