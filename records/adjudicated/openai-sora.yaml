  cost_per_output_computable: { value: "no", source: "https://help.openai.com/en/articles/12642688-using-credits-for-flexible-usage-in-chatgpt-plus-pro", evidence: "REVISED from unknown to no (same extension). Codebook rule 1 fixes the price input as the entry paid tier's price; rule 6: 'if it needs a number the vendor does not publish, code no.' The price input itself is the blocking figure: zero '$' occurs in any of the ten recovered documents, including the credits article, which describes HOW to buy credits ('you'll see a banner with Add credits') but never states what a credit costs in dollars. Distinguished from headline_price_usd/first_charge_amount_usd, whose own value tables have no 'no' option distinct from unknown ('unknown' there is explicitly defined as 'could not be located') -- cost_per_output_computable's table draws that line explicitly ('no: at least one required figure is not published' vs. 'unknown: the documents needed could not be located'), and the documents have now been located and read in full. computation_assumptions is therefore not_applicable, consistent with pass1's original coding. Not datable to the window; discontinued-stratum coding." }
  computation_assumptions: { value: "not_applicable", source: "not_applicable", evidence: "UNCHANGED. No computation performed; cost_per_output_computable is no, not yes/partial." }
  credit_rollover_policy: { value: "partial_rollover", source: "https://help.openai.com/en/articles/12642688-using-credits-for-flexible-usage-in-chatgpt-plus-pro", evidence: "REVISED from unknown (same extension). The credits article states directly: 'Do credits expire or roll over? Credits are valid for 12 months from purchase. Unused credits expire and do not roll over after the expiry date.' Genuinely close call, flagged rather than hidden: the vendor's own words say credits 'do not roll over', which reads toward expires_at_period_end; but structurally credits persist for a stated 12-month window from each individual purchase (not reset by a recurring monthly billing cycle the way expires_at_period_end's own worked example -- 'credits reset monthly' -- describes), which matches partial_rollover's own test ('carry forward subject to a stated cap or expiry') more closely. Coded partial_rollover on that structural test; a reader who weighs the vendor's explicit 'do not roll over' wording more heavily could reasonably code expires_at_period_end instead. Dated ~2026-03-11; not datable to the window; discontinued-stratum coding." }
