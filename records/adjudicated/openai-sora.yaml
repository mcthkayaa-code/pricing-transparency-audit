  free_plan_exists: { value: "unknown", source: "https://help.openai.com/en/articles/12642688-using-credits-for-flexible-usage-in-chatgpt-plus-pro", evidence: "REVISED reasoning (Question 2), value unchanged. Sweep 2 coded this 'addresses, no free plan' from the Sora-1-Web Billing FAQ's 'Currently ChatGPT Free ... not eligible for Sora access'. That document is OUT OF SCOPE for the coded product (see coder_note). The IN-SCOPE documents (credits article; Creating videos with Sora; Getting started with the Sora app), read in full 2026-08-17, never use the words 'free plan' or 'free tier' (zero hits across all ten documents, in scope and out), never state that a ChatGPT Free account is excluded from Sora, and never state what a Free account's baseline included usage is. 'Getting started with the Sora app' gates BASE access by invite/rollout ('Access starts with invite-only iOS users ... then expands'), not by ChatGPT paid tier -- only 'Sora 2 Pro' specifically is gated to ChatGPT Pro. The credits article's 'Sora for all users' (contrasted with 'Codex for Plus/Pro subscribers') establishes only that pay-as-you-go CREDIT purchases are open regardless of ChatGPT tier, which is a different claim from a documented zero-cost ONGOING allowance (codebook rule 2: 'a plan priced at zero with an ongoing allowance'). Neither an affirmative 'yes' (a documented no-cost allowance) nor a rule-3 'no' (documents stating no free option anywhere) is supported by the in-scope record. unknown_kind=vendor_silence: the governing document classes were read in full and do not settle it -- this is a genuine finding that the documents do not determine the answer, not a retrieval gap. Not datable to the window; discontinued-stratum coding." }
