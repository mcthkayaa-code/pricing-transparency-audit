  credit_system_present: { value: "yes", source: "https://help.openai.com/en/articles/12642688-using-credits-for-flexible-usage-in-chatgpt-plus-pro", evidence: "UNCHANGED value, evidence strengthened. pass1's basis (the discontinuation FAQ's 'any purchased ChatGPT/Sora credits can still be used for Codex') is now directly corroborated by the recovered credits article itself: 'How credits work. Your plan's included usage is used first. After you hit plan limits, usage draws from your credit balance.' Codebook rule 2 ('an intermediate currency that converts into outputs is a credit system'). In scope, read in full 2026-08-17. Dated ~2026-03-11 to 2026-04-26 (Oct 2025 introduction per the Release Notes); not datable to the window; discontinued-stratum coding." }
  credit_unit_defined: { value: "yes", source: "https://help.openai.com/en/articles/12642688-using-credits-for-flexible-usage-in-chatgpt-plus-pro", evidence: "REVISED from unknown (extends Question 2's document-governance finding beyond the nominal six -- see coder_note). Sweep 1/2 concluded this stays unknown because the OUT-OF-SCOPE Billing FAQ contains zero occurrences of 'credit'. That is true but the wrong document: the IN-SCOPE credits article publishes an explicit Sora 2 rate card converting credits into a named output unit -- 'Sora 2, 10s | 1 Video Gens | 10 credits' (and five further duration/resolution rows). Codebook rule: 'credit_unit_defined is yes where ANY official document converts credits into ANY output unit' -- this is exactly that conversion, for the product's own principal output (video). Verified by this adjudicator against an independently-fetched copy of the archive capture, not trusted from a sweep's quotation. Dated 'Updated: 17 days ago' on the 2026-03-28 capture (~2026-03-11); not datable to the window; discontinued-stratum coding." }
  credit_to_output_rate_published: { value: "partial", source: "https://help.openai.com/en/articles/12642688-using-credits-for-flexible-usage-in-chatgpt-plus-pro", evidence: "REVISED from unknown (same extension as credit_unit_defined). The credits article publishes a full, non-range rate card for the principal output (video): 10/20/30 credits for Sora 2 at 10s/15s/25s, 40-500 credits for Sora 2 Pro across five duration/resolution combinations -- these are exact figures for named configurations, not a range (codebook rule 3 distinguishes a stated range with 'no rule for which applies'; here every named configuration has its own number). Coded partial rather than yes because the same document, and no other recovered document, publishes any credit rate for Sora's OTHER advertised output type, image generation ('Creating images on Sora' is a separate help article this adjudicator did not find a credit rate in any recovered document for); codebook rule: 'yes' requires rates 'for the principal output AND for the other output types the plan advertises', which the image gap does not meet. Dated ~2026-03-11; not datable to the window; discontinued-stratum coding." }
  credit_rate_location: { value: "docs_help_center", source: "https://help.openai.com/en/articles/12642688-using-credits-for-flexible-usage-in-chatgpt-plus-pro", evidence: "REVISED from unknown (same extension). The rate card lives in exactly one document class -- a help-center article -- not on a pricing page and not in the terms, so 'docs_help_center' rather than 'multiple'. Dated ~2026-03-11; not datable to the window; discontinued-stratum coding." }
