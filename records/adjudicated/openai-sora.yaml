coder_note: |
  ADJUDICATION SUMMARY, 2026-08-17. This is not a pass1-vs-pass2 reconciliation: no second coding
  pass exists for openai-sora (single-pass record; not selected into the double-coded subsample).
  The brief for this record was to answer two questions the third post-window-retrieval sweep
  (orchestrator/post-window-retrieval-3.md) explicitly held rather than decided, after recovering
  documents pass1 could not reach. Of the six values sweep 3 held: 3 are resolved here to a
  determinate value (mandatory_addon_present=no, usage_cap_quantified=some_quantified,
  free_plan_watermark=yes); 3 stay unknown (free_plan_cap_documented, free_plan_cap_value,
  free_plan_duration). Question 2 additionally required checking free_plan_exists (stays unknown,
  reasoning substantially revised). Beyond the nominal six, applying the SAME document-governance
  finding (Question 2) surfaced that five more variables sweep 1/2 had left "vendor_silence" were
  in fact addressed by an in-scope document neither sweep had matched to them: credit_unit_defined
  (->yes), credit_to_output_rate_published (->partial), credit_rate_location (->docs_help_center),
  credit_rollover_policy (->partial_rollover), cost_per_output_computable (->no), and
  watermark_removal_tier (->highest_tier) -- six variables, beyond the nominal six the brief named.
  Two further variables (headline_billing_basis, commercial_use_lowest_tier) stay
  unknown with revised reasoning, because the document sweep 1/2 used for them is out of scope and
  no in-scope document settles them either. failed_generation_charge_policy and
  annual_default_toggle were settled today by D-075 and are carried forward untouched, per the
  assigning brief. The remaining 20 variables are unchanged from pass1 and undisputed by any sweep.
  No date_explained or variant_explained classification applies anywhere on this record: there is
  no vendor_edit register entry (nothing to re-collect -- the product has had no live pricing
  surface at all since 2026-04-26, four months before the window even opened) and no two-snapshot
  display-variant situation (no pricing page ever loaded in two states, because it never loaded a
  price at all). Total: 9 variables moved to a new determinate value, 6 stay unknown with revised
  reasoning, 2 settled today and untouched, 20 unchanged.

  QUESTION 1 -- THE WITHDRAWAL RULE ADOPTED. Rule: for a discontinued-stratum product, a value
  determinable from an official, dated, PRE-SHUTDOWN archived document is coded as a determinate
  value from that document on the same terms codebook section 1 and protocol section 6.2 direct for
  any document, regardless of whether the document remained reachable at the moment the collection
  window opened. I apply this to all values above resting on a pre-shutdown capture, not only the
  six sweep 3 named.
  Why: sampling-rules.md section 6.2 and protocol section 4 both provide for a discontinued product
  to be "coded from archived materials where those exist" without restricting those materials to
  ones still live at window-open -- and by construction NO discontinued product's operative
  documents remain live at window-open (that is what "discontinued" means). This record's own
  pass1 pass already, uncontroversially, coded determinate values this way before I ever opened it
  (cost_per_output_unit=per_video_minute, from an archived 2026-04-20 openai.com/sora/ marketing
  page; auto_renewal_default, refund_policy_exists and output_ownership_statement, all from the
  still-live ToS which nonetheless describes a product that no longer exists to be sold). Codebook
  section 4's evidence-requirements table lists "Public archive snapshot of any of the above" as a
  QUALIFYING source with no live-at-window-open restriction. Treating "published, then withdrawn
  before the window" as equivalent to plain vendor silence would make every discontinued-stratum
  coded value unknown by construction and would void the entire discontinued-stratum mechanism the
  study's own design builds for exactly this case -- that collapse is strong evidence the
  alternative reading is not the one the instrument intends.
  The argument I considered and reject as the GOVERNING rule, stated fairly: a window-era reader
  genuinely could not have read these documents (they were gone by 2026-08-05), so crediting them
  as if a window-era buyer could determine the term overstates what "before paying" meant for this
  product during the window. This concern is real, but I hold it is already absorbed by a different,
  existing mechanism rather than needing a second penalty here: protocol section 4 and sampling-
  rules section 6.2 EXCLUDE discontinued products from every aggregate transparency metric and from
  the index. The record is reported in its own separate table precisely so a reader is never misled
  into thinking these values describe what a window-era buyer could determine about a live,
  purchasable product. Coding the value AND excluding it from the index does the work the "code it
  unknown too" argument wants, without erasing what the vendor is independently and verifiably shown
  to have published. Coding a demonstrably-published, dated, quoted statement as if the vendor never
  said it would itself assert something the record now knows to be false -- exactly the risk the
  brief itself named on the other side of this question.
  I recommend, in my report to the orchestrator rather than in this record's values, that the
  attribution vocabulary gain a fifth kind for wave 2 -- something like withdrawn_pre_window -- for
  the distinct case (which this record's DETERMINATE values are NOT examples of, since I resolved
  Question 1 to make them codeable) where a value must stay unknown specifically because the only
  document that would settle it was withdrawn before the window and no other document reaches it.
  None of this record's final unknowns rest on that specific problem; they rest on genuine silence
  even within the full recovered documentary record, which is ordinary vendor_silence.

  QUESTION 2 -- WHICH DOCUMENT GOVERNS THE FREE-TIER / SORA-2 CLUSTER. The vendor's own documents
  split into two sets. Set A -- "Sora - Billing FAQ" and "Generating videos on Sora" -- both open
  with the identical sentence: "Please note that the following experience only applies to Sora 1 on
  Web. It does not apply to the Sora app or Sora 2 on web." Set B -- "Creating videos with Sora",
  "Getting started with the Sora app", and the ChatGPT-collection credits article -- carry no such
  disclaimer, discuss "Sora 2" and "the Sora app" directly and by name, and describe sora.com's own
  iOS/Android/web product (getting-started: 13 "Sora 2" mentions; credits article: 10). This
  record's own primary_source_url (https://sora.com, redirecting to sora.chatgpt.com, i.e. "the
  Sora app") and its state at shutdown are Set B's product, not Set A's -- Set A's own documents
  additionally state that surface was "actively being deprecated" with customers told to
  "transition away from Sora 1 web" at the same time. Protocol section 6.2's authority hierarchy
  does not resolve a disagreement between Set A and Set B on its own, because both sets are the same
  document class (official documentation / help center) and so rank equally under that hierarchy;
  what resolves it is a prior, more basic test the hierarchy presupposes rather than states --
  whether a document is competent evidence for the product being coded at all -- and the vendor's
  own express scope disclaimer answers that test directly, in the vendor's own words, not by my
  inference. I therefore treat Set A as inadmissible for coding the Sora-app/Sora-2 product this
  record measures, cite it only for contrast, and code from Set B wherever Set B settles a question,
  leaving a value unknown where even Set B does not.
  Consequence for free_plan_exists (checked though nobody disputed it, per the brief): Set A's "no,
  ChatGPT Free not eligible" (Billing FAQ, Feb 2026 capture) does not govern. Set B never uses the
  words "free plan" or "free tier" and never states what a ChatGPT Free account's baseline Sora
  access is; the credits article's "Sora for all users" establishes only that pay-as-you-go CREDIT
  purchases are open across ChatGPT tiers, a different claim from a documented zero-cost ongoing
  allowance. Result: unknown, not "no" and not "yes" -- the documents genuinely do not settle it.
  I note for completeness, because it changes how much confidence to place in Set A even on its own
  terms: within Set A itself, the Feb-2026 Billing FAQ excludes "ChatGPT Free" by name from Sora
  access, while the April-2026 "Generating videos on Sora" (the LATER Set-A capture, 12 days before
  shutdown) drops "Free" from that same sentence, verified independently by this adjudicator against
  a fresh fetch of both captures. Sweep 3 read this as the premise being "contested, not merely
  soft." Because I hold Set A inadmissible for this product regardless, this internal Set-A drift
  does not change my coded value, but it is additional reason not to treat Set A as if it were a
  clean, stable "no" that Set B's silence merely failed to reach.

  SOURCE VERIFICATION. Every archive.org capture cited above and quoted from was independently
  re-fetched by this adjudicator today (not copy-pasted from a sweep's prose), decompressed, and
  searched for the quoted text; byte counts and independent scan results are recorded in
  openai-sora-sources/MANIFEST.txt alongside the exact URLs. archive.org's replay path returned
  intermittent HTTP 503 throughout, consistent with all three sweeps' own infrastructure notes;
  every capture used above eventually returned HTTP 200 within 1-9 retries. Protocol section 6.4's
  same-day-snapshot rule is satisfied by the archive.org permalink itself (an immutable, publicly
  re-openable record) plus this adjudicator's own local copies fetched and dated 2026-08-17, which
  is the same day these values were coded.

  ENTRY TIER (carried from pass1, unaffected): no eligible entry-tier candidate could be identified
  by either pass1 or this adjudication. No document, in scope or out of scope, publishes a Sora-
  specific plan grid or price; access rode on ChatGPT's own subscription tiers, whose OWN pricing
  is never stated in any Sora-scoped document, and chatgpt.com/pricing's own archived capture never
  names Sora as a plan feature at all. No candidate is recorded as losing because none could be
  identified as eligible in the first place (sampling-rules.md 7.2).

  READING SCOPE. Read for this adjudication: protocol-v1.md, codebook-v1.md, sampling-rules.md,
  record-template.yaml, deviations-for-adjudicators.md (in full); records/pass1/openai-sora.yaml
  and its full openai-sora-sources/ directory; orchestrator/post-window-retrieval-3.md in full;
  the openai-sora sections of orchestrator/post-window-retrieval.md and
  orchestrator/post-window-retrieval-2.md; the openai-sora rows of orchestrator/unknown-
  attribution.csv and orchestrator/unknown-attribution-overrides.csv (to establish which values
  were already settled today and by what reasoning, per the brief's explicit direction on D-075);
  seven vendor documents independently fetched via web.archive.org (see MANIFEST.txt) plus one
  collection-index page. NOT opened, per the binding restrictions: any other product's record,
  aitoolspolice.com, site/content/reviews/, orchestrator/adjudication-queue.md,
  orchestrator/interim-signals.md, orchestrator/deviations-log.md. No pass2 record exists for this
  product to be blind to. This adjudication is not blind by design (protocol 7.4 permits and
  requires reading both prior material and the sources), so the pass1/pass2 "blindness" attestation
  does not apply verbatim; the applicable discipline is the reading-scope list above, observed in
  full.

conflict_note: >
  UNCHANGED from pass1. Refund position conflicts between two official sources of unequal rank for
  the contractual class (Terms of Use ranks first, help center second, per protocol section 6.2).
  Terms of Use (https://openai.com/policies/terms-of-use/): "Payments are non-refundable, except
  where required by law." ChatGPT billing help center
  (https://help.openai.com/en/articles/7232895-how-do-i-request-a-refund-for-my-chatgpt-subscription),
  which OpenAI's own Sora discontinuation FAQ explicitly points buyers to for refund questions:
  "Accidental purchases are generally eligible for a refund if you contact us within 14 days of the
  charge," plus stated regional rights (EU/UK/Turkey 14 days prorated; Korea 7 days full refund).
  Coded from the higher-ranked Terms of Use per codebook section 2.1 step 3 (refund_policy_exists =
  no_refunds_stated, refund_window_days = 0); the help-center figures are what would apply in
  practice for most buyers and are preserved here so the disagreement is not lost. This adjudication
  additionally found the newly-recovered ChatGPT/Sora credits article states the SAME non-refundable
  position for credits specifically ("Are credits refundable? Credits are non-refundable, except
  where required by law."), which corroborates rather than adds to this conflict.

