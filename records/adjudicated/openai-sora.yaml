default_display_state: >
  Unchanged from pass1: sora.com redirects to sora.chatgpt.com and shows only a shutdown notice
  as of the last read (2026-08-10, re-confirmed by D-009 the same day): "Sora is no longer
  available. You can export your data at any time." No pricing UI exists at any point during the
  collection window (2026-08-05 to 2026-08-13); the product shut down 2026-04-26, before the
  window opened. This adjudication additionally establishes (see coder_note, Question 2) that the
  vendor's own pre-shutdown documents distinguish TWO product surfaces that existed at different
  times under the same "Sora" name: "Sora 1 on Web" (gated to ChatGPT Plus/Business/Pro, being
  actively deprecated) and "the Sora app" / "Sora 2 on web" (sora.com's own iOS/Android/web app,
  invite-and-rollout gated, the surface matching this record's primary_source_url and matching the
  product's state at shutdown). The vendor's own documents state the first does not describe the
  second. Pricing/entry-tier variables below remain coded unknown because no document — of either
  surface — ever publishes a dollar figure for Sora at any point in its recovered documentary
  history; other variables below are coded from whichever surface's documents the vendor states
  actually govern the coded product, per the rule in coder_note.

