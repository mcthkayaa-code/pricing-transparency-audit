variables:
  headline_price_usd: { value: "unknown", source: "https://sora.com", evidence: "UNCHANGED from pass1, kind revised to unknown_kind=vendor_silence per the settled unknown-attribution.csv reclassification (POST-WINDOW RETRIEVAL 2026-08-17): the Sora - Billing FAQ was recovered and read in full and contains zero '$' characters; independently re-verified by this adjudicator across ALL ten now-recovered Sora/Sora-app documents (in scope and out of scope alike) plus the ChatGPT credits article, zero '$' in every one. No document, at any point in Sora's documentary history, publishes a dollar figure. Codebook §2.1 step 2/4: no determinate value stated anywhere; unknown_kind=vendor_silence because the documents were reachable and read in full, not because they could not be located. Cannot be dated to the window (no live pricing surface existed 2026-08-05 to 2026-08-13); coded under the discontinued-stratum rule (sampling-rules §6.2) from the full recovered pre-shutdown documentary record." }
  headline_billing_basis: { value: "unknown", source: "https://sora.com", evidence: "REVISED reasoning; value unchanged. Sweep 1/2 read this as 'addresses' on the Sora-1-Web Billing FAQ's 'Subscriptions for ChatGPT plans are charged on a calendar monthly basis' line. That document is OUT OF SCOPE for the coded product (see coder_note, Question 2): it expressly states it 'does not apply to the Sora app or Sora 2 on web'. No in-scope document (Creating videos with Sora; Getting started with the Sora app; the ChatGPT credits article, which explicitly is NOT calendar-monthly -- 'valid for 12 months from purchase') states a Sora-specific billing cadence, and headline_price_usd itself is unknown (rule 3: 'if the qualifier is absent ... check the billing FAQ and terms. If neither states it, code unknown' -- applied to the in-scope document set). unknown_kind=vendor_silence: the in-scope documents were read in full and state no cadence for a figure that itself does not exist. Not datable to the window; discontinued-stratum coding from pre-shutdown archives." }
  first_charge_amount_usd: { value: "unknown", source: "https://sora.com", evidence: "UNCHANGED. unknown_kind=vendor_silence (settled by the post-window sweeps): the recovered Billing FAQ and every other recovered Sora document state no first-charge figure of any kind; zero '$' anywhere, independently reconfirmed by this adjudicator. Not datable to the window; discontinued-stratum coding." }
  mandatory_addon_present: { value: "no", source: "https://help.openai.com/en/articles/12642688-using-credits-for-flexible-usage-in-chatgpt-plus-pro", evidence: "RESOLVED (one of the six sweep 3 held). Codebook rule 3 ('optional add-ons are not mandatory add-ons') + rule 5 ('documentation was read and shows no such charge, code no'). The ChatGPT/Sora credits article -- IN SCOPE, no Sora-1-only disclaimer, read in full 2026-08-17 -- states: 'Credits are a pay-as-you-go add-on for Codex & Sora when you need more usage beyond plan limits' and 'What changes for my plan? Nothing about your plan changes. You still get your plan's included usage.' This states in terms that NOT buying credits leaves the (unidentified) plan's included usage untouched, i.e. the add-on is optional. The OUT-OF-SCOPE Sora-1-Web Billing FAQ independently agrees on the same conclusion ('Only ChatGPT Plus users can upgrade their plan'; no separate add-on charge stated), so this value does not turn on which surface governs. Question 1 (published-then-withdrawn): this document's content is fixed at least from 2026-03-28 ('Updated: 17 days ago') through the 2026-04-26 shutdown; per the withdrawal rule in coder_note, a dated pre-shutdown capture is valid documentary evidence for a discontinued-stratum record on the same terms as any other document (sampling-rules §6.2), so this is coded determinate rather than unknown despite predating the window by over 4 months. Cannot be dated to the collection window itself; dated to 2026-03-28, ~6 weeks pre-shutdown." }
