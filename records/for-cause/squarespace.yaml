conflict_note: >
  refund_policy_exists / refund_conditions / refund_window_days: ToS 9.4 (higher-ranked source
  for this contractual variable class per protocol 6.2) frames refunds as fully discretionary --
  "you won't be issued a refund except in our sole discretion, or if legally required" -- while
  the dedicated Help Center refund policy (support.squarespace.com/hc/en-us/articles/46051001586701-Website-refund-policy)
  states a concrete, non-discretionary 14-day-for-annual-plans policy with no mention of
  discretion. Treated as complementary rather than incompatible (the specific document plausibly
  describes how the reserved discretion is exercised in practice) and coded from the specific,
  on-point Help Center policy; flagged here per protocol 6.2's instruction to record a hierarchy
  gap even where it does not change the coded value. Both URLs: https://www.squarespace.com/terms-of-service ;
  https://support.squarespace.com/hc/en-us/articles/46051001586701-Website-refund-policy

register_events:
  - { type: display_variant, detail: "The pricing page's own embedded ld+json OfferCatalog is internally inconsistent: Basic, Core and Advanced each carry ~54 region/currency-specific Offers (full global price list), but Plus carries only 2 Offers (USD, US region only) -- a much thinner data footprint than its siblings, suggesting Plus's structured data may be stale or that the vendor has withdrawn Plus from most non-US markets while the schema still lists it as a catalog item. This does not change entry-tier selection (Basic wins on annual-equivalent price by a wide margin: $228 vs. Plus's $588) and is recorded per instruction to log vendor-data disagreements rather than silently resolve them.", urls: ["https://web.archive.org/web/20260812101105/https://www.squarespace.com/pricing"] }

coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md 7.2). Four eligible candidates found on the pricing
  page's own ld+json OfferCatalog, all generally available, no sales contact, standing plans,
  single-seat pricing. Annual-equivalent USD cost per the ld+json Offer blocks (US region),
  default display state = annual toggle:
    - Basic:    $228.00/yr  <- WINNER (entry_tier_name)
    - Core:     $348.00/yr  (losing candidate)
    - Plus:     $588.00/yr  (losing candidate; see register_events for a structured-data anomaly
                on this specific plan, unrelated to its ranking here)
    - Advanced: $1,188.00/yr (losing candidate)
  A fifth named plan, "Mobile Start" (mentioned only in the Website-refund-policy Help Center
  article: "Mobile Start plans are purchased through the Squarespace app, which is managed by
  Apple"), does not appear anywhere in the pricing page's OfferCatalog and carries no price
  figure in any captured document. Treated as out of scope for this selection, which is anchored
  to the pricing page per sampling-rules 7.2, rather than as a ranked/losing candidate.

  CAPTURE-SET LIMITATION (design note required by this assignment). This coding is blind to
  pass 1's VALUES and REASONING (I did not open records/pass1/squarespace.yaml), but it is not
  blind to pass 1's DOCUMENT SELECTION: 7 of my 8 sources are the exact local captures pass 1
  saved to records/pass1/squarespace-sources/, read independently and re-coded from scratch. The
  8th (the pricing page itself, https://www.squarespace.com/pricing) was NOT among pass 1's
  local captures -- I located and read a window-dated archive.org snapshot of it independently
  (CDX search, then curl; see sources[] note). So this test measures whether two readers of
  substantially the same evidence reach the same values; it is not a fully independent
  replication of document discovery for the pricing page specifically. Flagging exactly as this
  assignment's instructions require, since it changes what an agreement/disagreement on this
  record can be read to mean.

  D-005 / MONEY-VALUE DOUBLE-REPRESENTATION. All money and credit-allowance figures were read
  from the pricing page's embedded ld+json (OfferCatalog + 4 SoftwareApplication/Offer blocks +
  FAQPage), parsed with Python's json.loads (a real parser, not brittle text-scraping, so the
  superscript-cents misread class of error does not apply). The archived capture's visible text
  and raw surrounding HTML held ZERO dollar figures anywhere (confirmed by direct text search) --
  the price-card markup was still in a "pricing-cards__loading" placeholder state, i.e. the
  actual on-screen numerals require client-side JS hydration that this static archive capture
  never performed. No browser/render tool was available in this working session to force
  hydration, so the on-screen TYPOGRAPHY of the headline figure ($19/mo vs. some other format)
  was not independently, visually confirmed -- only the underlying value (from ld+json) was.
  Magnitude sanity-checked against tier name and billing basis: Basic $19/25 mo, Core $29/39,
  Plus $49/65, Advanced $99/139 -- an ordinary, internally consistent SaaS website-builder price
  ladder, no order-of-magnitude anomaly. headline_price_usd's specific $19.00/mo framing (rather
  than reporting $228.00 as a lump annual figure) follows the monthly-styled-headline-under-
  annual-toggle convention this codebook's own worked examples use throughout section 7; this is
  a documented convention-based inference on TYPOGRAPHY only, not on the underlying VALUE, which
  is a direct machine-read of vendor-published structured data.

  CURRENCY CHECK (deviation D-003). Arm 1 (vendor's own currency disclosure) is satisfied twice
  over: the site carries a "Currency: Select currency:" selector in its global footer on every
  captured page, AND the pricing page's own ld+json OfferCatalog explicitly publishes a USD,
  US-region Offer for every one of the 4 plans with clean, unambiguous figures. Per D-003,
  "if the vendor offers USD, the USD figure is the published price" -- coded as money values
  throughout, not non_usd. (An Accept-Language header was not used as a locale test anywhere in
  this reasoning, per the binding instruction against that.)

  UNKNOWN VALUES (4 of 37), all classified vendor silence -- the relevant document(s) exist,
  were read in full, and address the surrounding topic without settling this specific construct:
  trial_auto_converts, failed_generation_charge_policy, commercial_use_lowest_tier,
  watermark_removal_tier. No access-failure or instrument-gap unknowns remain in this record;
  the single largest access gap in the evidence I started from (the pricing page was not among
  pass 1's local captures) was closed by an independent, window-dated archive.org retrieval
  before it could produce any unknowns.

  RENEWAL NOTICE NUANCE. renewal_notice_commitment is coded advance_notice_stated on the
  strength of the stated 15-day annual-plan commitment, but the same Help Center document is
  explicit that MONTHLY subscriptions get no reminder at all ("Monthly subscriptions renew
  automatically without an email reminder"). This is a real, documented asymmetry, not a
  qualification I am hiding: a reader relying on this coded value should know it does not mean
  every renewal is announced in advance.

  CREDIT ALLOWANCE DETAIL (context for credit_rollover_policy and usage_cap_quantified, not a
  separate coded construct). Per the AI-credits Help Center article: every Squarespace site gets
  10 one-time starter AI credits that do not renew at all (distinct from "resets monthly"); Basic
  gets ONLY those 10 and no recurring monthly allotment; Core/Plus/Advanced additionally get a
  recurring monthly allotment (20/40/120 credits respectively per the pricing page's feature
  table) that resets monthly and does not roll over.

  A-012: not applicable to this product. The 14-day trial is genuinely free (no charge, no card
  required); there is no cheap non-zero paid intro period.

  blindness: no other product's record was opened, in any pass. records/pass1/squarespace.yaml
  (this product's own pass-1 record) was NOT opened, not once, not for structure or the source
  list. No file under orchestrator/ was opened. aitoolspolice.com and site/content/reviews/ were
  not opened. I did not glob across the study directory; every study-directory file I read was
  opened by its exact path from the list this assignment names. I did not run git log, git show,
  git diff, or git blame, and did not read any other repository history; my only git operations
  were `git add` and a path-scoped `git commit` on this file alone.
status: complete
