coder_note: |
  ENTRY TIER SELECTION (sampling-rules.md 7.2): four eligible standing, sales-contact-free,
  generally-available candidates on the rendered pricing page, compared by annual-equivalent
  cost in the default (Yearly) display state: Starter $290/yr (selected, lowest), Growth
  $390/yr, Influencer $690/yr, Ultra $990/yr. Enterprise is excluded as a candidate (sales-gated,
  "Contact Sales", no published price). All four eligible tiers carry identical core feature
  sets (voiceovers, script/hook generation, background music, captions, no watermark, unlimited
  exports/templates) scaled only by monthly credits (500/1,000/2,000/5,000) and team-member
  count (3/5/7/10).

  MANDATORY-ADDON CONTEXT: "Warmed Accounts" is a separate, distinctly-priced optional product
  (from $49.90/account/month on the pricing-page teaser; the dedicated /warmed-accounts page
  shows current pack pricing of $69.8-$49.96/account/month depending on pack size) for buyers
  who want managed social accounts to post to. It is not required to use the Starter tier as
  advertised (create/edit/download video, auto-post to a buyer's own connected accounts), so
  mandatory_addon_present=no.

  DESIGN LIMITATION (stated per assignment instructions): this coding is blind to pass-1's
  VALUES and REASONING (that record and its YAML were never opened), but it is NOT blind to
  pass-1's DOCUMENT SELECTION -- the evidence base is the 80-capture set pass 1 chose to save.
  It therefore tests whether two readers of the same captured documents reach the same values;
  it does not test whether the right documents were chosen or whether a from-scratch document
  search would have found the same set (e.g. it would not surface a page pass 1 never saved).

  MID-TASK RULE CHANGE (A-019, resolved 2026-08-17): received from the coordinator after
  domains 1-6 were already drafted and committed, before domains 7-10 were drafted. Before this
  rule reached me I had reasoned toward refund_policy_exists=yes, refund_conditions=conditional,
  and cancellation_self_serve=self_serve_documented, based on faq_home_raw_segment.txt -- a
  saved file holding home-page FAQ answers (including "What is the refund policy?" and "Can I
  cancel my subscription anytime?") in an unquoted-key object-literal format. That format is
  consistent with page-internals/JS source rather than a confirmed rendered/on-screen state, and
  home-raw.html's own capture of the same accordion (collapsed, aria-expanded="false") does not
  carry the answer text in the DOM the way the pricing page's native <details> FAQ does. None of
  those three draft values were written to this file before the rule arrived, so nothing needed
  amending -- they were coded unknown directly, on rendered-only evidence, as shown above.
  Nothing else in this record rests on an unrendered payload: the one other place an embedded JS
  chunk was consulted (chunks/584c5016af948b8b.js, for headline_price_usd) was a same-page
  SECOND REPRESENTATION of a figure ($24/$290) already independently visible and rendered in
  pricing-raw.html's DOM (the binding two-representation rule requires exactly this cross-check),
  never the sole source for a value. That same chunk also contains several sets of
  stale/historical plan-pricing objects (different plan names, e.g. "Starter/Pro/Business" and
  other unrelated Pro/Premium/Ultra blocks at unconnected price points -- apparently leftover
  template/config data from other products or past pricing schemes on the same codebase) that
  were identified and deliberately never cited for any value.

  CAPTURE-SET OBSERVATIONS: (1) the home page's FAQ accordion is JS-driven and does not carry
  answer text in its own raw capture when collapsed, unlike the pricing page's native <details>
  FAQ -- a second, separately-named file (faq_home_raw_segment.txt) happens to hold the same
  answers in a source-like format, but per A-019 that does not count as disclosure; had that
  auxiliary file not existed at all, this gap would have been invisible rather than merely
  unusable. (2) The same accordion pattern recurs on /warmed-accounts (its own "Is there a
  refund policy?" / "What happens if I cancel?" questions are listed but unexpanded), for a
  different product line not used in this coding. (3) /billing is authentication-gated (307 to
  /login) and carries no public archive snapshot (CDX query empty) -- a structurally
  unreachable class under protocol §6.3, not merely an uncaptured one. (4) The one archive-save
  attempt logged in the evidence (archive_test_headers.txt, /terms) plus independent CDX lookups
  I ran today against the public index (not against pass-1's record) confirm ten window-dated
  (2026-08-05/06) snapshots exist for the pages actually used as sources here.

  ADMINISTRATIVE FIELDS: product_name taken from the vendor's own self-reference ("Faceless.so
  Pricing" title tag; "faceless.so by Faceless LLC" in the ToS). category and paid_submission
  are copied from the frozen frame per codebook §6, but the frame file is outside this
  for-cause assignment's stated reading list, so both are coded unknown here rather than
  guessed; the orchestrator holds the correct values already. product_status=active reflects
  only the window-dated evidence (a live, functioning product throughout 2026-08-05/10 with no
  shutdown signal); no live check was made per this assignment's evidence-only rule.

  ARCHIVE ATTEMPTS TODAY: two live web.archive.org/save/ attempts for the pricing URL both
  returned 520 (consistent with the stated 2026-08-17 outage); CDX read queries partially
  succeeded and are what produced the archive_url values above, independently of pass-1's
  record.

  blindness: no other product's record was opened, in any pass -- not records/pass1/faceless-
  so.yaml (the record under review), not any sibling record, not records/for-cause/gptzero.yaml
  or records/for-cause/squarespace.yaml (both visible as directory siblings, neither opened),
  not any orchestrator file, not aitoolspolice.com or site/content/reviews/. No repository git
  history was read (no git log/show/diff/blame); only `git add` and `git commit -- <this path>`
  were used, with commits scoped to this file at every checkpoint. This record's evidence base
  is pass 1's saved capture set (records/pass1/faceless-so-sources/), as this assignment
  directs -- see the design-limitation note above for what that does and does not make this
  coding blind to.
