coder_note: |
  DESIGN LIMITATION (per task instructions): this evidence base is the capture set pass 1
  chose to save (records/pass1/gptzero-sources/, 11 files). This coding is blind to pass 1's
  VALUES and REASONING but not to its DOCUMENT SELECTION -- it tests whether two readers of
  the same documents reach the same values, not whether the right documents were chosen.

  D-007 FILE HANDLING: the sources directory contains d007-currency-recheck-2026-08-10.txt, an
  analysis document (not a vendor source) that states pass-1's own stated value changes for
  headline_price_usd and first_charge_amount_usd. I treated the FACTS it reports (DOM
  currency-selector query = 0 matches, ?currency=USD parameter test = no effect, ToS Sec.5
  wording, archive-shell content) as legitimate evidence -- consistent with this task's framing
  of the whole sources directory as "your evidence base" -- but independently re-applied the
  CURRENT currency rule (deviations-for-coders.md) to those facts myself rather than adopting
  the file's stated conclusion. I reached the same value (unknown, not non_usd) by that
  independent route; recorded here so the overlap is visible rather than silently assumed.

  ENTRY TIER: candidates were the two plans shown as purchasable on the rendered pricing page.
  Premium: TRY 549/mo billed annually, annual-equivalent TRY 6,588 -- WINNER (lower). Professional
  (losing candidate): TRY 1,049/mo billed annually, annual-equivalent TRY 12,588. "Enterprise and
  Team Plans" excluded on eligibility grounds (sales-gated, "Contact Sales"). A "Premium for
  Students" page title string exists in the embedded JSON with no associated price captured
  anywhere in the evidence set, so it does not change the selection.

  MAJOR FINDING -- an "Essential" tier exists in the vendor's own tier data and was NOT shown
  as purchasable in my one observed rendered state. The embedded feature-comparison table
  (3sm69kou41dgv.js) lists tiers free/essential/premium/professional/writer/reviewer/pro/
  educator/api throughout, with essential="150,000" words/month (between free's 10,000 and
  premium's 300,000) -- but no plan card for it appeared in the rendered capture (only Premium
  and Professional cards rendered), and no price for it was found anywhere in the 11 files. The
  same JS bundle references a live experiment: getFeatureValue(GROWTH_BOOK_FEATURES.
  PRICING_EXPERIMENT_V3,"no-essential-no-quarterly") and code that filters plans where
  tier==="essential". This is directly relevant to protocol limitation 13 (a pricing page may
  not have one default display state) -- but I personally observed only ONE rendered state, so
  per protocol 6.8 rule 3 I have not logged a register_events display_variant entry (that
  requires the coder to have observed two states within the same pass). Coded entry_tier_name
  and all entry-tier variables from the state actually observed (Premium/Professional only).
  Flagging prominently per this task's request for anything the capture set left incomplete.

  CREDIT_SYSTEM_PRESENT judgment call: the only "credit" string in the whole 11-file set is the
  marketing bullet "Shared team credits" (one of three feature bullets for the sales-gated
  Enterprise/Team plan: "Everything you get with a Professional plan, for everyone." / "Shared
  team credits" / "Unified billing"). Checked the JS bundles for any further definition, balance
  API, or exchange rate tied to this term -- found none. Both self-serve paid tiers (the only
  ones with a documented price) meter directly in words, the codebook's explicit not-a-
  credit-system case. Read this as pooled/shared word-allowance language for team billing, not a
  distinct credit currency, and coded credit_system_present=no. This is a judgment call on thin,
  ambiguous evidence and is flagged for review given it gates three index items (C1/C2/C4).

  USAGE_CAP_QUANTIFIED gap: "Batch upload file limit" is a real row in the feature-comparison
  table but its values are unresolved JS constants (O.BatchFilesByPlan.{free,essential,premium,
  professional}) not defined in any of the three captured JS chunks -- an access limitation on
  my end, not a vendor non-disclosure I can confirm either way, so it was not counted toward or
  against "all_caps_quantified" (which rests on the two limits I could read directly: words/month
  and characters/scan, both quantified).

  ANCILLARY, NOT USED FOR CODING: homepage embedded JSON describes an educator ambassador
  program offering "GPTZero premium for life (valued at $288/year)" -- a promotional valuation
  on an unrelated referral-program page, not a price on the pricing page, and not a currency
  disclosure under the Arm-1 test (no currency statement, just an incidental dollar figure). Not
  used to code headline_price_usd; noted for completeness only.

  A-012: not applicable to this product. GPTZero's trial (ToS Sec.6) is a genuine zero-cost
  7-day free trial, not a cheap non-zero paid intro period, so the open question does not apply.

  blindness: did not open records/pass1/gptzero.yaml (the record under review), not once, not
  for structure or source list. Did not open any other product's record in any pass. Did not
  open orchestrator/, aitoolspolice.com, or site/content/reviews/. Did not run git log, git
  show, git diff, or git blame -- no repository history was read. Did open
  records/pass1/gptzero-sources/ in full, exactly as this task's instructions designate it as
  "your evidence base" for this for-cause coding.

conflict_note: "Tension (not a value conflict under codebook 2.1, since neither source states a competing NUMBER): the pricing page (https://gptzero.me/pricing) displays only TRY figures with no currency selector ('TRY 549/ month, billed annually'), while the ToS (https://gptzero.me/terms-of-use.html) Sec.5 states 'All payments shall be in U.S. dollars'. Neither supplies a USD figure. This tension is why headline_price_usd/first_charge_amount_usd are coded unknown rather than non_usd -- see variable evidence and coder_note."

