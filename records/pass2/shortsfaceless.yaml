coder_note: |
  Entry-tier selection (sampling-rules 7.2): two standing, generally-available, no-sales-contact
  plans found -- Essential $19/mo (annual-equiv $228.00) and Professional $29/mo (annual-equiv
  $348.00, badged "Most popular"). Essential selected as entry tier (lower annual-equivalent).
  Professional is the sole losing candidate. No per-seat pricing, no student/nonprofit-restricted
  tier, no usage-based-only pricing.

  A-012: vendor sells a paid, non-free, time-limited intro period. /deal (footer "Special deal")
  offers the Essential plan's first month for $9 instead of $19 ("50% OFF FIRST MONTH", described
  as a "one-time offer"), same 30-videos/40+voices/no-watermark feature set. No document states
  the post-month-one rate explicitly; framing implies reversion to the standard $19/mo but this is
  not stated outright. trial_exists coded "no" because this is not a FREE trial;
  trial_card_required/trial_length_days/trial_auto_converts coded not_applicable accordingly.

  credit_system_present/credit_unit_defined/credit_to_output_rate_published coded "yes" on
  Terms-of-Service evidence alone ("each credit allows for the generation of one video") even
  though the pricing page itself never uses the word "credit" and displays the allowance only as
  a video count ("up to 30 videos"). This is a documentary reading of the ToS, not an inference --
  flagging it because a coder who read only the pricing page could reasonably reach "no" instead.

  cost_per_output_unit coded "other": principal output is a discrete short-form video, and the
  allowance is stated as a video COUNT per month, not a duration; the closest enumerated value,
  per_video_minute, would misstate this as duration-based metering, which the product does not use.

  refund_policy_location coded pricing_page: the only refund statement found ("100% money-back
  guarantee") sits on /deal, a promotional sub-page structured like a pricing page (states a
  price, has a Buy Now CTA), not on the main #pricing section or a dedicated refund policy page.
  No closer-fitting value exists in the list. Same guarantee carries no stated day-window, hence
  refund_window_days=unknown.

  Site structure note: /pricing is not a real route on this site (nor are /refund,
  /refund-policy, /cancellation, /billing, /help, /faq, /docs, /terms -- all fall back to a
  generic "Sign in to ShortsFaceless" catch-all, confirmed by title-tag comparison across
  candidate paths). The only real official document pages found: homepage (with #pricing and
  #faq anchors), /tos, /privacy-policy, /google-api-disclosure (not used -- irrelevant to
  pricing/terms), and /deal.

  Third-party aggregator pages found during discovery search (not used as sources) publish
  inconsistent, apparently stale pricing for this product -- noted only as a caution that
  third-party listings should not be trusted, consistent with the discovery-aid-only rule.

  blindness: no other product's record was opened (no pass-1 record or -sources directory, no
  other pass-2 record, no aitoolspolice.com page, no site/content/reviews file). No repository
  history was read -- only `git add` and `git commit` were run this session, never `git log`,
  `git show`, `git diff`, or `git blame`.
conflict_note: "ToS ('Ownership and Rights') states only that the user retains ownership of input content and grants a processing license over it; it never states who owns generated output or whether commercial use is permitted. Only the on-page FAQ states this ('You do [own it]... including for commercial purposes'). output_ownership_statement and commercial_use_lowest_tier are coded from the FAQ since the higher-ranked ToS is silent rather than contradictory. URLs: https://www.shortsfaceless.com/tos ; https://www.shortsfaceless.com/"
