coder_note: |
  Entry-tier candidates (sampling-rules.md §7.2/§7.3): none eligible. The vendor publishes no
  paid tier anywhere on ismybrandinai.com — confirmed against the ToS ("Free tools — provided
  \"as is\""), the About page ("Free tools, no signup. The tools here run in your browser, free,
  with nothing to install."), the /tools listing ("A small set of free tools ... No signup,
  nothing stored."), the AI Bot Checker tool page and FAQ ("Is this tool really free? Yes."),
  and the complete sitemap.xml (54 URLs, none a pricing/plans/premium/upgrade/subscribe page).
  Per §7.3, entry-tier variables are coded not_applicable and the free-tier variables carry the
  record.

  Category/output note: the frame category is "AI bot checker", matching one of four free tools
  this vendor publishes (AI Bot Checker, AI Readiness Checker, AI Prompt Generator, llms.txt
  Generator). This record codes the AI Bot Checker tool specifically, per that category. Its
  documented output is a crawler-by-crawler allow/block/partial-limit report on the reader's own
  robots.txt — a report/analysis table, not a media artifact — which is why
  commercial_use_lowest_tier, watermark_removal_tier and output_ownership_statement are coded
  not_applicable, reached from this tool's own description page rather than assumed from the
  category name. The site's other tool, AI Readiness Checker, was also checked and follows the
  identical free/no-signup/scored-report pattern, so nothing material would change if the whole
  site rather than just this one tool were considered.

  A-012 does not apply: this is not a cheap non-zero time-limited intro period, it is a
  standing, always-free tool with no paid tier at all.

  Judgment calls, flagged for the adjudicator:
  1. auto_renewal_default=no_recurring_billing: not_applicable is barred on this variable, but
     that value's own definition is "sold as a one-time purchase," which this product literally
     is not (it is never sold/charged at all). Coded no_recurring_billing as the closest
     available determinate value, since no recurring billing exists in any form.
  2. renewal_notice_commitment and auto_renewal_disclosure_location coded not_applicable by
     consistency with "billing does not recur," though the codebook states that trigger
     explicitly only for auto_renewal_disclosure_location, not for renewal_notice_commitment.
  3. cost_per_output_unit=other: none of the enumerated units fit a diagnostic report; named
     "per domain / robots.txt check".
  4. cost_per_output_computable=yes / computation_assumptions=$0.00: codebook rule 1 nominally
     keys the price input to "the entry paid tier's price" under sampling-rules.md §7.2, which
     presupposes a priced entry tier. No entry tier exists here; coded yes on the reasoning that
     the vendor explicitly and repeatedly documents the cost as free, so the figure a reader
     needs (price=$0) is published without ambiguity or a usage assumption.
  5. free_plan_cap_documented=unknown rather than all_quantified: no document states a usage
     limit in either direction (quantified or an explicit "unlimited" claim); the tool's
     no-account, client-side design makes a cap technically improbable but that is inference,
     not documentation, so unknown is coded rather than inferring no limit.
  6. entry_tier_name=not_applicable and the pricing-page-anchored administrative fields
     (primary_source_url, default_display_state) point at the AI Bot Checker tool's own page in
     place of a pricing page, since this vendor publishes none; noted explicitly here so a
     reader is not misled into thinking a pricing page was missed.
  7. coder_role: the task assignment text said "secondary"; codebook-v1.md §6 defines this
     variable's value list as primary/second/adjudicated. Coded "second" to match the
     instrument's defined enum, per the instruction that the codebook is the only authority on
     what a value means; flagging the discrepancy here rather than silently picking one.

  Frame check: this record's product_id/product_name/category/product_status/paid_submission
  all match frame-for-pass2.csv row 40 exactly. No discrepancy found.

  blindness: no other record, no review page, no pass-1 material was opened.
