coder_note: |
  Entry tier = Starter, lowest annual-equivalent cost of the two eligible paid candidates
  (Starter $19.99/mo x 12 = $239.88 vs Business $56.99/mo x 12 = $683.88), both read in the
  page's default Yearly display state. Enterprise excluded: sales-gated ("Book a Demo"), not
  purchasable without contacting sales. Free excluded: $0.00, not a paid tier (covered under
  domain 3 instead).

  Vendor publishes TWO Terms-of-Service documents. /terms.html ("Vidnoz provides services... on
  this Website", "in your Vidnoz account") is used here as the governing ToS, since its wording
  matches the web product this record prices. /ai-terms-of-service.html ("Vidnoz AI provides
  services... on this Application", 17 uses of "Application" vs 3 of "Website", explicit "App
  Store" and "Apple ID" language) reads as the mobile-app in-app-purchase terms, a different
  purchase surface not reflected on the coded pricing page, so it was read but not coded from.

  Starter's price card carries a badge "25% OFF First Month" beside "$26.99" struck through to
  "$19.99/mo", which by its own wording could describe an introductory first-month-only rate
  that steps up afterward (an A-012-shaped pattern, though not a "trial" so the A-012 tag is not
  applied). Checked by switching the display toggle (permitted post-recording): under Monthly,
  the same badge shows struck-through and shown price IDENTICAL ($26.99 = $26.99, no live
  discount), suggesting the badge is reused UI copy that does not precisely describe the actual
  mechanism. The vendor's billing-cadence documents describe annual billing as a single charge
  ("1-year (yearly deduction)" per refundpolicy.html; subscription "continues until the same
  date on the following ... year" per the pricing FAQ), not a rate that steps up after month 1.
  Coded first_charge_amount_usd on that documented cadence rather than the ambiguous badge;
  flagging for adjudication since no checkout was opened (prohibited) to resolve this further.

  blindness: no other record, no review page, no pass-1 material was opened.
  git: no repository history (log/show/diff/blame) was read at any point.
conflict_note: "cancellation_self_serve: terms.html ('cancel...in your Vidnoz account', self-serve) vs refundpolicy.html ('customers may notify us of your intent to cancel') and the pricing-page FAQ ('by contacting our support') describe different mechanisms; ToS and the dedicated refund policy are equal-rank contractual sources (protocol 6.2) and disagree, so coded conflicting. | refund_policy_exists: terms.html states a general 'non-refundable except where required by law' while refundpolicy.html/the pricing FAQ carve out a specific 7-day annual guarantee; read as one coherent general-rule-plus-exception policy rather than incompatible values, and coded yes from the specific document; noted here for reviewer visibility. URLs: https://www.vidnoz.com/terms.html | https://www.vidnoz.com/refundpolicy.html | https://www.vidnoz.com/pricing.html"
