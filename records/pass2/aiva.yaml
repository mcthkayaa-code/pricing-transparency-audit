coder_note: |
  Entry-tier selection (sampling-rules 7.2): eligible paid candidates were Standard Annually
  (EUR11/mo, annual-equivalent EUR132.00) and Pro Annually (EUR33/mo, annual-equivalent
  EUR396.00, LOSING candidate). Free (EUR0) is not a paid candidate. Excluded as ineligible:
  Enterprise tier (sales-gated, "please contact us... to establish a custom plan", EULA §2) and
  the Students & Schools tier (named-program, contact/live-chat only, per pricing page note).
  Standard Annually wins on lowest annual-equivalent single-seat cost, read in the default
  (annual-preselected) display state.

  Currency (deviation D-003): no vendor currency selector or explicit currency statement found
  (arm 1 empty). Triggered a fresh web.archive.org/save/ capture of the pricing page on
  2026-08-14; Internet Archive's Save-Page-Now crawl runs from Internet Archive's own US
  infrastructure, independent of this coder's network. That capture shows the same EUR0/EUR11/EUR33
  figures and zero USD/$ mentions (grepped directly, see aiva-sources/pricing-homepage-archive-
  capture-2026-08-14.html) - arm 2 evidence that the vendor serves EUR, not USD, to a US reader
  too. Coded non_usd on that basis, not merely because this session runs from Turkey.

  cost_per_output_unit named "per track download" (coder_note per codebook rule 3): AIVA doesn't
  sell per-minute or per-second audio pricing; the metered unit is one whole composition download,
  capped by a max duration per tier.

  Money-value second-representation check (binding rule): headline/first-charge EUR figures were
  confirmed in raw DOM/HTML (div#option-price) matching the rendered text exactly - no superscript-
  cents or formatting artifact. Confirmed a second time in the archive.org capture's raw HTML.

  free_plan_watermark / watermark_removal_tier: explicitly checked pricing page, EULA (legal/1,
  full text), all 8 help-center FAQ articles, and the General User Manual - none use the word
  "watermark". Third-party review sites claim a 3-second audio watermark on free downloads; per
  protocol this cannot justify a coded value, so both variables are unknown despite that claim.

  trial_exists = no: explicitly checked for "trial" wording across every located official
  document (pricing page, EULA, 8 FAQ articles, user manual) plus WebSearch site: queries; none
  found. No A-012 (paid time-limited intro period) applies - AIVA has no intro-then-converts offer.

  refund_conditions / refund_window_days: EULA §9's refund eligibility is usage-conditioned ("have
  not used any of the premium features"), not time-windowed, so no day count exists to record;
  this is distinct from - and not in conflict with - the help-center downgrade FAQ's statement
  that paid amounts already used are non-refundable. Both are official AIVA sources describing
  different scenarios (pre-use withdrawal vs. post-use/downgrade), not incompatible positions on
  the same question, so no conflict_note entry was warranted.

  creators.aiva.ai/billing (referenced by the downgrade FAQ) requires login and was not opened,
  per the documents-only prohibition on signing in; any detail visible only behind that login
  (e.g. a possible in-account currency setting) is outside what this study can determine.

  blindness: no other record, no review page, no pass-1 material was opened. Disclosure: while
  reading sampling-rules.md section 7 (entry paid tier, as instructed), a single Read call's
  line-limit overshot into the start of section 8 ("Double-coded subsample" - target/selection-
  algorithm text only, e.g. "select the 1st, 5th, 9th, and every fourth product thereafter" per
  category). This is general published methodology with no product-specific content; it does not
  name which products (including AIVA) are in the reliability sample, and `double-coded-
  selection.csv` itself was never opened, so AIVA's sample membership was not determined or seen.
  Flagged per instructions rather than left unstated.
