  output_ownership_statement: { value: "user_owns", source: "https://www.aragon.ai/terms", evidence: "ToS: \"Aragon hereby assigns to you all of its rights, title, and interest (if any) in and to the Output...\" and, in the Ownership section: \"Materials excludes Outputs resulting from your use of the Service, which, as between you and Aragon, are owned by you.\" No tier- or subscription-status-dependent qualifier found (contrast with codebook's \"conditional\" example, which requires an active-subscription condition not present here)." }
  usage_cap_quantified: { value: "all_caps_quantified", source: "https://www.aragon.ai/pricing", evidence: "Every limit documented for the entry tier (Basic) carries a number: \"40 headshots\", \"Choice of 1 attire\", \"Choice of 1 background\", and (via the same page's FAQ) \"896 x 1088 pixels\" resolution. \"45 mins generation time\" is a turnaround/delivery-speed figure, not a usage allowance, but is itself numeric regardless. No unquantified limit found attached to this tier specifically." }
  unquantified_limit_clause: { value: "present", source: "https://www.aragon.ai/terms", evidence: "ToS: \"You agree that Aragon retains the right to create reasonable limits on its use and storage of User Content, including limits on file size, storage space, processing capacity, retention periods, and similar limits as described on the Service or as otherwise determined by Aragon in its sole discretion.\" Also, specifically for free tools: \"Aragon reserves the right, at its sole discretion and at any time without notice, to: (a) suspend, limit, or discontinue access to any free tool or service; (b) impose usage limits, queue times, or indefinite wait periods...\" Neither clause states a number." }

coder_note: |
  FRAME CORRECTION LOGGED: my assignment brief initially typed category as "AI headshot
  generator"; the coordinator flagged that the authoritative value is the frame's own wording.
  I had already read category from frame-for-pass2.csv directly before coding ("aragon-ai,Aragon
  AI,https://www.aragon.ai,AI headshot,active,no") and used "AI headshot" throughout, so no
  change was needed to this record — noting it here per instruction so the record shows the
  value's provenance is the frame file, not the typed brief.

  ENTRY TIER (sampling-rules 7.2): the pricing page's default display state is the "Headshots"
  tab > "Individual Pricing" sub-tab (confirmed by DOM/screenshot on two independent fresh loads
  before any interaction) — three one-time headshot packages, NOT the "Subscription" tab (which
  requires a click; see below). Eligible candidates and their prices: Basic $18 (winner, lowest),
  Standard $25 (loses), Executive $40 (loses). All three are standing individual-pricing tiers,
  generally available, no sales contact needed; the sitewide "20% off all packages, limited time
  only!" banner discounts all three equally (struck-through originals $35/$45/$75) and is read as
  a promotional PRICE on standing plans, not a promotional PLAN under eligibility rule 3.

  JUDGMENT CALL - one-time purchase and "annual-equivalent": sampling-rules 7.2's price basis is
  written for recurring monthly/annual comparisons ("annualize whatever the state shows"). Basic/
  Standard/Executive are one-time, non-recurring purchases with no monthly or annual figure to
  annualize. I compared the three eligible candidates on their one-time price directly ($18 <
  $25 < $40); this ranking is unaffected by any annualizing convention since none of the three
  recurs. Flagging this because the codebook's price-basis language does not explicitly cover an
  all-one-time default state.

  JUDGMENT CALL - toggle changes the SET of tiers: per deviations-for-coders.md guidance, checked
  whether the page's "Headshots"/"Subscription" toggle is a display toggle (same tiers, different
  price framing) or changes the entire tier SET. It is the latter — completely different products
  (one-time packages vs. recurring credit subscriptions) — so only the default ("Headshots") set
  was treated as eligible entry-tier candidates, per rule 1's instruction not to switch a toggle
  to find a different figure. The Subscription tab (Lite $15/Pro $29/Ultimate $49/Creator $249,
  monthly-default) was still read in full and used for the several variables the codebook scopes
  to "the product as a whole" rather than to the entry tier specifically (codebook 5.2's six-
  variable list is exhaustive; credit_system_present/credit_unit_defined/credit_to_output_rate_
  published/credit_rate_location/credit_rollover_policy/failed_generation_charge_policy/free_plan_*/
  trial_exists/auto_renewal_*/refund_policy_exists/refund_conditions/cancellation_self_serve/
  refund_policy_location/commercial_use_lowest_tier/watermark_removal_tier/output_ownership_
  statement/unquantified_limit_clause are NOT in that list, so I coded them from all official
  documents about the product, not only from the Basic package's own page section).

  JUDGMENT CALL - credit_unit_defined = yes: no single sentence states "1 credit = 1 image"; the
  rate is derived from four subscription cards whose credit/image/edit figures divide out
  identically (1:1 images, 4:1 edits) every time. Coded yes under rule 3's "any official document
  converts credits into any output unit"; a stricter reader could view this as only a plan-
  allowance restatement (rule 5) rather than a definition. Flagged in case this reads differently
  under adjudication.

  JUDGMENT CALL - watermark_removal_tier = lowest_paid: evidence covers the Subscription ladder
  only (explicit "No watermarks" from Aragon Lite up). No document anywhere states the watermark
  status of the one-time Headshot packages or the free tier. Aragon sells three parallel pricing
  structures (free / one-time headshots / recurring subscription) and this single-ladder variable
  does not map cleanly onto that; coded from the one sub-structure with explicit textual evidence
  rather than "unknown", since positive evidence does exist for part of the product line.

  CODER_ROLE FIELD: my task brief and the agent definition (research-data-collector.md) both
  say `coder_role: secondary`; codebook-v1.md section 6 lists the allowed value as `second`
  (primary|second|adjudicated). Used "secondary" per direct, repeated instruction; flagging the
  mismatch since the codebook is the nominal authority on value spellings.

  A-012 (paid time-limited intro period): does not apply to this record. The "20% off" banner is
  a straight price discount on one-time, non-recurring packages with no later auto-conversion to
  a higher rate; the Subscription tiers show flat monthly/annual prices from the first charge,
  with no distinct low-cost intro period found anywhere.

  blindness: no other record, no review page, no pass-1 material was opened.
conflict_note: >
  Refund cluster (refund_policy_exists, refund_window_days, refund_conditions,
  refund_policy_location) — https://www.aragon.ai/terms vs https://www.aragon.ai/refund-policy,
  both equal-authority contractual sources per protocol 6.2. ToS General Payment Terms: "Unless
  otherwise specifically provided for in these Terms, all fees are in U.S. Dollars and are
  non-refundable, except as required by law." A full-text sweep found ToS's only other refund
  provision is a pro-rata refund solely where "Aragon terminates these Terms or your Account
  without cause" (Aragon-initiated, not a buyer right) — none of the ToS's 5 total "refund"
  occurrences cross-reference the dedicated Refund Policy page. That page instead affirmatively
  grants a buyer-initiated, conditional refund: "Refund requests must be submitted within 14
  calendar days of the charge", "Refunds will only be granted if no credits have been used", plus
  a headshot "full refund" guarantee (conditions: didn't download, followed upload instructions).
  These are incompatible statements of the same buyer question ("can I get my money back if I'm
  simply unhappy"); coded conflicting rather than picking a side because the instrument's
  hierarchy names ToS and the dedicated policy page as CO-EQUAL rank-1 sources for contractual
  variables, with no tie-break rule provided for this case.

  cancellation_self_serve — https://www.aragon.ai/terms (internally) vs itself vs
  https://www.aragon.ai/pricing. ToS Subscription Service clause: renewal stops "unless you
  cancel the Subscription Service from within your Account" (self-serve-sounding) — then, same
  paragraph: "You may cancel the Subscription Service by contacting us at support@aragon.ai...
  YOUR CANCELLATION MUST BE RECEIVED BEFORE THE RENEWAL DATE..." (contact-required, detailed
  verified-email process). Pricing-page Subscription FAQ: "Yes, you can pause or cancel anytime
  from your billing page" (self-serve). Coded conflicting: the highest-ranked document does not
  speak with one voice on this point, and a second official source corroborates only one branch
  of that internal split.
