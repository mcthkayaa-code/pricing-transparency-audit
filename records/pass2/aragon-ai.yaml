  (confirmed by DOM/screenshot on two separate fresh loads, before any interaction) — flat
  one-time package prices (Basic/Standard/Executive), not the recurring "Subscription" tab.
  A "20% off all packages, limited time only!" banner is showing; displayed prices ($18/$25/$40)
  are the post-discount figures, struck-through originals ($35/$45/$75) also visible. No
  monthly/annual billing toggle appears in this default view — that toggle lives only inside the
  separate "Subscription" tab (one click away), where it itself defaults to "Monthly". Currency:
  plain "$" figures, no currency/country selector found (globe icon opens a LANGUAGE picker only:
  English/Deutsch/Français/Português); ToS confirms "all fees are in U.S. Dollars". Cookie
