  refund_policy_exists: { value: "conflicting", source: "https://www.aragon.ai/terms", evidence: "CONFLICT between two equal-authority contractual sources (protocol 6.2 ranks ToS and the dedicated refund/policy page together at tier 1). ToS General Payment Terms: \"all fees are in U.S. Dollars and are non-refundable, except as required by law\" — and ToS's only other refund provision is a pro-rata refund solely for Aragon-initiated no-cause termination (not a buyer-initiated right); a full regex sweep of the ToS's 5 total uses of \"refund\" found no cross-reference to the dedicated Refund Policy page at all. Against this, the dedicated Refund Policy page (https://www.aragon.ai/refund-policy) affirmatively grants a buyer-initiated conditional refund: \"Refund requests must be submitted within 14 calendar days of the charge\", \"Refunds will only be granted if no credits have been used\", plus a headshot-package \"full refund\" guarantee if photos don't represent the buyer (conditions apply). See conflict_note for full quotes and both URLs." }
  refund_window_days: { value: "conflicting", source: "https://www.aragon.ai/refund-policy", evidence: "Refund Policy page states \"14 calendar days\" (of purchase for headshot packages; of the charge for subscriptions) for the entry tier (Basic, one-time headshot package). ToS states no window at all in day-terms and instead frames the entry tier's fee as non-refundable outright (see refund_policy_exists). Coded conflicting for consistency with the underlying refund_policy_exists conflict — see conflict_note." }
  refund_conditions: { value: "conflicting", source: "https://www.aragon.ai/refund-policy", evidence: "Refund Policy page: conditional (\"conditional\" — must not have downloaded photos, must follow upload instructions, within 14 days). ToS: effectively no conditions apply because no such refund right is established there in the first place (non-refundable except as required by law or Aragon-initiated no-cause termination). See conflict_note." }
  cancellation_self_serve: { value: "conflicting", source: "https://www.aragon.ai/terms", evidence: "Internal tension within the ToS itself, corroborated by a third official source on one side: ToS Subscription Service clause first says renewal stops \"unless you cancel the Subscription Service from within your Account\" (self-serve-sounding), then in the SAME paragraph gives the specific operative mechanism: \"You may cancel the Subscription Service by contacting us at support@aragon.ai... YOUR CANCELLATION MUST BE RECEIVED BEFORE THE RENEWAL DATE...\" (contact-required, with a detailed verified-email process). The pricing-page Subscription FAQ independently states: \"Yes, you can pause or cancel anytime from your billing page\" (self-serve). Coded conflicting rather than picking a side because the highest-authority document does not speak with one voice. See conflict_note for full quotes." }
  refund_policy_location: { value: "conflicting", source: "https://www.aragon.ai/terms", evidence: "Refund position is stated in both the terms (\"terms\") and the dedicated refund page (\"dedicated_refund_page\") but the two disagree in substance (see refund_policy_exists), which per the variable's own decision rule leaves the governing class undeterminable — conflicting rather than multiple, since multiple is reserved for agreement." }
  commercial_use_lowest_tier: { value: "free", source: "https://www.aragon.ai/terms", evidence: "ToS Output clause: \"Aragon hereby assigns to you all of its rights, title, and interest (if any) in and to the Output generated through your use of the Service. You may use such Outputs for your own personal or commercial purposes, subject to these Terms.\" No tier restriction is stated anywhere; the grant covers all Output, including free-tier-generated headshots." }
