coder_note: |
  Entry-tier candidates (sampling-rules.md 7.2): Starter is $0 (the free plan), not a paid
  candidate. Enterprise is sales-gated ("Let's talk", contact sales) and fails eligibility
  rule 2, so it is excluded, not merely outranked. Professional was the only eligible paid
  candidate; annual-equivalent single-seat cost $59 x12=$708.00. No losing candidate to report
  beyond the exclusions above.

  A-012 (paid time-limited intro period): does not apply. Colossyan's trial is a zero-cost
  14-day trial, not a cheap non-zero paid intro period, so this record is not tagged A-012.

  Judgment calls (genuine ambiguity, flagged per instructions rather than resolved silently):
  1. cost_per_output_computable / computation_assumptions: Professional bundles TWO minute
     meters at one price - 30 min/mo with the NEO model and 10 min/mo with NEO2 (compare
     table). Neither is a "range"; both are fully published fixed numbers, so this is not
     cleanly the codebook's "secondary output" (different output TYPE, e.g. image vs video)
     or "range" case. I computed using NEO (the larger, first-listed meter, both on the plan
     card and in the compare table) as the base/principal reading: 59/30=1.97 USD/video-minute.
     Using NEO2 instead would give 59/10=5.90 USD/video-minute. Coded yes, not partial, since
     the calculation needs no assumption about typical use, only a choice of which published
     meter is principal.
  2. usage_cap_quantified (Professional) / free_plan_cap_documented (Starter): both tiers
     carry "Unlimited" labels on secondary features (course creation, viewers, MP4 downloads
     on Professional) alongside numerically capped minutes/avatars/etc. ToS §2.2 ties its
     "'Unlimited' plans are subject to... fair use guidelines" language to VIDEO GENERATION
     specifically (a 4-hour/day cap + a fair-use clause), which arguably only reaches an
     unlimited-MINUTES claim (which Professional/Starter don't make; only Enterprise's minutes
     are "Unlimited"). I coded some_quantified/some_quantified on the broader ground that AUP
     §4(f) ("excessively or disproportionately use THE SERVICES", not scoped to generation)
     is a discretionary, no-figure clause reaching all use of the product, which under
     usage_cap_quantified rule 3 disqualifies ANY "Unlimited" claim from counting as quantified,
     including course-creation/viewer/download counts. A stricter reader who scopes both
     qualifying clauses to video-generation only would code all_caps_quantified / all_quantified
     instead, since none of Professional's or Starter's OTHER limits are unquantified.
  3. output_ownership_statement: ToS §5.5 grants a "perpetual, limited, REVOCABLE... license to
     use Colossyan Material in that generated video", revocable on breach and conditioned on
     "full payment of fees and compliance with the [AUP]"; §8.1 is a general vendor-retains-IP
     clause. I coded vendor_license_retained (ownership is never granted to the customer at
     all, only a license) rather than conditional (which the codebook's own example ties to
     OWNERSHIP itself being time/status-limited, e.g. "for as long as the subscription remains
     active"). The Instant Avatar Terms (same page) go further still for that specific feature
     - "we own all legal rights... in... any output generated by the Instant Avatar" plus a
     mandatory assignment of any IP that vests in the customer - which is directionally
     consistent with (and reinforces) vendor_license_retained for the general case, though it
     was not used as the coded source since it covers a narrower feature.
  4. commercial_use_lowest_tier: Terms of Service and Acceptable Use Policy (the two
     highest-authority classes for this contractual variable) are silent on commercial use of
     outputs generally - the AUP restricts specific content/contexts (no TV advertising, no
     billion-dollar-revenue international ad campaigns, no political ads) but never makes a
     general commercial-use grant or denial. The only official statement found anywhere is on
     a vendor-owned marketing/comparison landing page (lps.colossyan.com, a Colossyan
     subdomain, "Colossyan vs Synthesia"): "Colossyan also grants full commercial licensing to
     videos created by paid subscribers." This is a lower-tier "other official vendor page"
     under protocol 6.2 rather than the ToS/pricing page the decision rule names first, but it
     is vendor-authored on a vendor domain (not third-party) and states a determinate policy
     where the higher-tier sources are silent rather than contradicting it, so I coded from it
     per codebook 2.1 step 2 rather than defaulting to unknown. Coded lowest_paid since the
     quote says "paid subscribers" generally, not a named higher tier.
  5. auto_renewal_disclosure_location: coded terms_only. The pricing-page FAQ ("access to
     Colossyan requires a recurring subscription") is consistent with auto-renewal but was
     judged short of an explicit renewal statement; a reader who counts it would make this
     multiple instead.
  6. refund_policy_location: coded multiple. The refund text is reachable both at the
     dedicated /refund-policy/ URL and embedded (same wording) within the /terms/ page load
     under its own "Refund Policy" heading - the site appears to bundle ToS + Refund Policy +
     Instant Avatar Terms into one legal document reachable from separate footer links/URLs.

  Source-conflict / staleness observation: the Zendesk "Pricing & Packaging FAQ" (marked "1
  year ago Updated") appears stale against the live pricing page on two points not otherwise
  used for a coded value: it illustrates "12*40=480 minutes" for an "annual Pro subscription"
  where the current pricing page shows 30 min/mo NEO for Professional (360/yr), and it states
  "there is no way to purchase additional minutes" where the current pricing-page FAQ says a
  Professional-yearly add-on pack (600 NEO2 minutes/$1,500/yr) exists. Neither of these feeds
  a coded variable directly, but both inform why I preferred the live pricing page over the
  help center wherever the two disagreed on a figure (see conflict_note for the trial_auto_converts
  case, which is variable-affecting).

  Currency: page served USD directly from a Turkey-based session; no currency selector, no
  country/currency URL parameter, no non-USD figure encountered anywhere. Non-essential
  cookies were declined ("Allow selection", necessary-only) before reading the default state.

  blindness: no other record, no review page, no pass-1 material was opened.
conflict_note: "1) trial_auto_converts: Zendesk help-center FAQ (https://colossyan.zendesk.com/hc/en-us/articles/31601584844177-Pricing-Packaging-FAQ) states \"You won't be able to generate videos unless you upgrade to a paid plan\" (no auto-charge implied) vs Terms of Service (https://www.colossyan.com/terms/) §3.4: \"Colossyan may charge automatically at the end of the trial or the renewal, unless you notify us in advance that you want to cancel\" (implies auto-charge). Trial terms are a pricing-class variable under protocol 6.2, where the help center (rank 2) outranks the Terms of Service (rank 3), so trial_auto_converts was coded \"no\" from the help center. 2) Minute allowance for the annual Professional/Pro tier: live pricing page (https://www.colossyan.com/pricing/) compare table shows 30 min/mo with NEO; Zendesk help-center FAQ's worked example says \"12*40=480 minutes in the case of an annual Pro subscription\" (i.e. 40 min/mo). Pricing-class hierarchy ranks the live pricing page above the help center, so the entry-tier allowance used throughout this record (usage_cap_quantified, cost_per_output_computable, computation_assumptions) is the pricing page's 30 min/mo, not the help center's 40. 3) Additional-minutes purchase: live pricing-page FAQ says a Professional-yearly add-on pack exists (\"600 extra NEO2 minutes for $1,500/year\"); Zendesk help-center FAQ says \"there is no way to purchase additional minutes.\" Not tied to a single coded variable; recorded here for completeness since it is a genuine source disagreement discovered during collection."
