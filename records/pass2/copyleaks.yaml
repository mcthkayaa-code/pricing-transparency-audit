coder_note: |
  ENTRY-TIER SELECTION (sampling-rules 7.2): eligible candidates were Personal ($13.99/mo billed
  annually = $167.88/yr annual-equivalent) and Pro ($74.99/mo billed annually = $899.88/yr).
  Personal wins on lowest annual-equivalent single-seat cost. Enterprise and Education are NOT
  eligible candidates -- both are "Talk to Sales" / custom-quote only, excluded under rule 2
  (purchasable without contacting sales).

  A/B TEST: /pricing runs a cookie-consent-gated first-fold A/B test (clientfiles/pricing-ab.js).
  Declining analytics cookies (our state, per the privacy-preserving default) deterministically
  serves the "control" arm -- confirmed by reading the script's logic directly. I additionally
  same-origin-fetched the "treatment" fragment (clientfiles/pricing-first-fold-variant.html) to
  check for a price difference: both arms show identical headline prices ($13.99/mo, $74.99/mo),
  identical "billed annually" framing, and identical credit allowances (1,200 / 12,000). The two
  arms differ only in marketing layout/anchor-pricing presentation (treatment adds a strikethrough
  "was $16.99"/"$99.99" list price) and in one metadata label: the treatment fragment explicitly
  tags Personal "1 seat", which the control text I coded from does not spell out in words (Personal
  has no stated seat count in the control read; Pro explicitly states "25 user seats" in both).
  This does not change any coded value since price, billing basis, and credit caps are identical
  across arms, and no limit for Personal beyond the credit allowance is stated in either arm.
  Logged as a register_events display_variant entry.

  "START FOR FREE": the site nav (visible on every page, including termsofuse) carries a
  "Start for Free" link to https://app.copyleaks.com/signup. Per the documents-only rule (no
  account creation, not even a free one), this was not followed past the signup page, and no
  official document (pricing page, terms of use, help center, docs) defines a distinct free plan
  or free trial reachable through it -- the pricing page's own "plan options" FAQ enumerates only
  paid/sales-gated tiers. free_plan_exists and trial_exists are coded "no" on that documentary
  record; the CTA's existence and unverified destination are flagged here for transparency rather
  than silently dropped.

  Local captures are verbatim extracted text (via rendered-page reads), not raw HTML files, per
  the tooling available to this pass; each capture file states its source URL and access date.

  NOTABLE: commercial_use_lowest_tier is coded not_granted on the terms of use's plain language
  (4.1: "non-commercial use ... only"; 2.1 bars it for Guest Users specifically) even though the
  product is marketed toward business use (Pro: "designed for startups and small teams"; Enterprise:
  IP/code governance, content moderation). No tier carve-out for commercial use was found anywhere
  in the document despite a full read plus keyword sweep. Flagged here as the single most surprising
  finding in this record, not just left implicit in the evidence quote.

  unquantified_limit_clause: searched for a separate Acceptable Use Policy distinct from the terms
  of use (WebSearch site:copyleaks.com) -- none found; usage restrictions live inside termsofuse
  section 5 itself, which was read as part of the full-document read this value rests on.

  blindness: no other record, no review page, no pass-1 material was opened.
conflict_note: "Credit-cycle framing tension: the pricing-page FAQ (\"your monthly scan limit is based on credits\" / \"Your allowance resets at the start of each new billing cycle\") and the help-center article on credit expiry (\"credits expire at the end of each billing cycle\", worked with a 1-month example) both describe a MONTHLY credit cycle -- used for usage_cap_quantified, credit_rollover_policy, and cost_per_output_computable. termsofuse 8.2 (Annual Account) instead says the account \"will be loaded with the number of Credits you purchased and will be valid for a 12-months period\", which a reader could take as a single annual pool rather than a monthly-resetting allowance. Coded the monthly reading: the pricing page ranks first for credit-rate variables under protocol 6.2, and two independent document classes (pricing page, help center) agree on \"monthly\" against the one ToS clause, which more plausibly describes the 12-month subscription TERM rather than the credit-reset cadence. Also noted: termsofuse 14.4 (\"All payments are completely non-refundable\") sits immediately before 14.5's conditional 10-day refund carve-out -- read as general-rule-then-specific-exception, not a genuine disagreement, and coded from 14.5, which the pricing page and two help-center articles independently corroborate as the operative policy."
