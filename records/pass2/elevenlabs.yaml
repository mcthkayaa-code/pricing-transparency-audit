coder_note: |
  Entry-tier selection (sampling-rules.md 7.2): candidates read in the pricing page's default
  (Monthly billing) display state, annualized (monthly x 12), single-seat where applicable.
  Free excluded (not a paid tier). Winning: Starter $6/mo -> annual-equivalent $72.00.
  Losing candidates: Creator $22/mo standing rate -> $264.00 (first month promotionally billed
  at $11, see A-012 note below; $22 is the recurring rate used for comparison); Pro $99/mo ->
  $1,188.00; Scale $299/mo, 3-seat minimum block (cannot buy fewer seats) -> $3,588.00; Business
  $990/mo, 10-seat minimum block -> $11,880.00; Enterprise excluded, "Contact us" / custom
  pricing, gated behind sales contact, not an eligible candidate per sampling-rules.md 7.2.

  A-012: Creator ($22/mo standing) is sold with "First month 50% off" -> $11 for the first
  month only, then reverts to $22/mo recurring. This is a paid (non-zero) time-limited intro
  period on a real, prominently-marketed tier (badged "Popular"), though not on the entry tier
  itself (Starter carries no such promo). Flagging per the open A-012 question.

  Judgment calls for adjudicator attention:
  - credit_to_output_rate_published = partial vs cost_per_output_computable = yes: the exact
    published credit rate is per CHARACTER (1 credit = 1 character for V2 Multilingual), not
    per the principal output unit (audio minutes), which the vendor gives only as a labeled
    approximation ("~30 min", "~$0.20/extra min" for Starter). I read the character rate as
    not satisfying C2 for the principal (audio-minute) output -> partial, but read the
    vendor's own published approximate $/minute figure as sufficient for C3 (no reader-side
    usage assumption required, only vendor-published numbers) -> yes. These two could
    reasonably be coded differently by another reader; full reasoning is in each variable's
    evidence field.
  - refund_policy_exists = yes, sourced from the Help Center's specific "14 days, no credit
    quota used" article rather than from the Terms of Service's more general "(e) Refunds and
    Exchanges. All sales are final. We may offer refunds at our sole discretion." I read these
    as compatible (a discretion reservation plus the vendor's stated standing practice for
    exercising it), not a true conflict between equal-authority sources -- see conflict_note.
  - watermark_removal_tier / free_plan_watermark: the only explicit watermark statement found
    concerns Dubbing output specifically ("Free plan users receive video dubs with a watermark;
    paid plans do not"); no watermark statement was found for the core Text to Speech audio
    output. Coded from the Dubbing statement as the best (only) available evidence.

  Scratchpad note (not a blindness breach; disclosed for transparency): the shared scratch
  directory used for temporary fetches already contained five files from an unrelated, unexplained
  prior run (contractual-docs.txt, feature-grid.txt, generative-credits-faq.txt,
  pricing-try-default.txt, pricing-usd-country-selected.txt), all timestamped before this pass
  began. None were opened or read. Every value in this record comes from documents fetched fresh
  in this pass, saved under records/pass2/elevenlabs-sources/, with URL and access date recorded
  above.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "Terms of Service (https://elevenlabs.io/terms-of-use), Section 6(e): \"Refunds and Exchanges. All sales are final. We may offer refunds at our sole discretion.\" vs. Help Center (https://help.elevenlabs.io/hc/en-us/articles/14315426883345-What-is-your-refund-policy): \"You are eligible for a refund if a request is filed within 14 days of payment and no credit quota was used...\" Coded refund_policy_exists / refund_window_days / refund_conditions from the Help Center's specific, operative terms, treating the ToS clause as a general discretion-reservation that the Help Center article operationalizes rather than a genuine incompatible-value conflict. Both URLs recorded here per protocol 6.2 regardless."
