coder_note: |
  ENTRY TIER SELECTION (sampling-rules 7.2). Eligible candidates (generally available, no sales
  contact, standing plans): 10K words/month, 20K words/month, 35K words/month, 50K words/month
  (slider 50,000-380,000 words). "Business / For Business" is INELIGIBLE (CTA "Contact Us",
  "Custom Pricing & Plans" -- fails "purchasable without contacting sales"). Annual-equivalent
  cost of each eligible candidate, read in the default (Yearly) display state:
    10K words/month: $60.00/yr (directly published "Charged annually $60.00") -- WINNER, lowest.
    20K words/month: $114.00/yr (directly published "Charged annually $114.00") -- losing.
    35K words/month: $189.00/yr (directly published "Charged annually $189.00") -- losing.
    50K words/month (slider): $21.25/mo shown at slider minimum; unlike the other three cards,
      no "Charged annually $X" figure is printed for this tier. Annual-equivalent computed
      (not directly published) as 21.25 x 12 = $255.00 -- losing either way.
  Entry tier = "10K words/month", $60.00/yr, matching FAQPage JSON-LD on the same page
  ("$5/month (billed annually at $60)").

  TOGGLE / TIER-SET CHECK (per assignment instructions). Default toggle state established from
  DOM classes (Yearly = active bg-blue-700/!text-white; Monthly = inactive bg-transparent/
  text-gray-800), not from extractor output order. Checked whether the toggle changes the SET of
  tiers, not just prices: an initial static WebFetch pass (before browser rendering) returned
  BOTH the monthly figure ($9.99) and the yearly figure ($5.00/mo, $60.00/yr) for all four named
  tiers in a single pass, indicating the same four tiers + Business exist under both bases and
  only the displayed price changes. No case found where the cheapest tier exists on one basis and
  not the other; both ladders match in tier names, only prices differ (2x monthly vs annual-per-
  month, consistent with the "50% off" yearly toggle label).

  BUNDLE DISCLOSURE (per assignment instructions). The coded "10K words/month" tier bundles AI
  humanization (metered at 10,000 words/month) together with "Unlimited AI Detecting" and
  "Unlimited Human Auto Typer" as included features, per the plan's own "Quick look at features"
  list on https://undetectable.ai/pricing. This is a single unified subscription surface -- AI
  Detector functionality is not sold separately from AI Humanizer functionality at this tier, in
  the vendor's own wording ("Unlimited AI Detecting" is listed directly inside the humanizer-
  metered plan card; no separate detector-only pricing tier exists). The sales-gated Business tier
  additionally bundles "Access to Smart Job Applier", an unrelated product, but that tier is not
  the coded entry tier.

  FREE PLAN vs FREE TRIAL (two distinct constructs, both documented). (1) An ongoing, no-signup
  "free version" / "Basic" model, coded as free_plan_exists=yes ("Is the AI Humanizer Free? Yes.
  There's a free version, but it uses a basic model and may be flagged by detectors." --
  /ai-humanizer). (2) A separate sign-up-gated "Free Trial" of the better "Undetectable" model,
  explicitly limited to 250 WORDS, not a day count ("Free Trial is limited to 250 words.
  Additional usage requires paid plan activation." -- /pricing), coded under domain 4. Because
  trial_length_days is defined in DAYS and no day-based figure is published anywhere (only the
  250-word usage cap), trial_length_days is coded unknown; the actual published limit (250 words,
  one-time) is recorded here for transparency rather than invented into the days field.

  JUDGMENT CALLS FLAGGED FOR ADJUDICATION:
  1. trial_auto_converts=no is read from "Additional usage requires paid plan activation" as
     requiring an affirmative user action (paying) rather than an automatic silent charge. This
     is an interpretation of wording, not an explicit "does not auto-renew" statement; a reader
     coding this "unknown" instead would also be defensible.
  2. usage_cap_quantified=some_quantified / unquantified_limit_clause=present both rest on reading
     ToS Sec 12 item 4 ("...remove...all files and content that are excessive in size or are in
     any way burdensome to our systems...") as the kind of vendor-discretion/unquantified-standard
     clause the codebook's F1/F2 rules describe. This clause is framed around file/content removal
     for system protection, not explicitly labeled a "fair use policy for all plans" the way the
     codebook's own worked example is; it is the only such clause found after reading the ToS in
     full. If adjudication reads it as out of scope for F1/F2, usage_cap_quantified would move to
     all_caps_quantified and unquantified_limit_clause to absent.
  3. cancellation_self_serve=contact_required codes the GENERAL/default route the ToS states for
     users outside California and New York ("All other users may cancel by emailing us"). CA/NY
     residents get a documented self-serve dashboard route instead (ToS 6.4). The codebook has no
     value for a jurisdiction-split policy; contact_required was chosen as the default/general
     case, analogous to how refund_policy_exists rule 3 treats a jurisdiction-restricted right.
  4. free_plan_cap_documented=none_quantified: the free/"Basic" tool's page <title> reads "Free AI
     Humanizer (Unlimited, No Signup)", but the word "Unlimited" is not repeated with a number in
     the visible body/FAQ copy, and a general product-description sentence elsewhere on the same
     page ("it can handle up to 10,000 characters in one go") is not clearly attributed to the
     free tier specifically (it reads as a general tool description). Neither figure was counted
     as a confirmed free-plan-specific quantified cap.
  5. watermark_removal_tier=unknown despite the pricing page listing "Watermark and future proof"
     as an entry-tier feature: this vendor sells a separate "AI Text Watermark Remover" product
     (footer link), suggesting "watermark" here means AI-model detection watermarks being removed
     from input text, not the vendor adding its own branding/watermark to output -- the opposite
     of the codebook's construct. No document resolves this explicitly either way, so coded
     unknown rather than guessed.

  MINOR OBSERVATION (not coded as a value or a formal conflict): the pricing page's own embedded
  FAQPage JSON-LD contains "...the monthly plan is $19/month..." in the same answer that correctly
  states "$5/month (billed annually at $60)" for the 10K tier. $19/month matches the 20K tier's own
  monthly card price, not the 10K tier's ($9.99/mo). Read as internally inconsistent/stale
  marketing copy on the SAME page rather than a second official source in disagreement; the entry
  tier's own plan-card figures (which match the JSON-LD's $5/$60 exactly) were coded, so this does
  not affect any coded value.

  credit_system_present=no is coded from the four standard tiers' direct word-count denomination.
  The sales-gated Business tier uses the word "credits" once ("Non-expiring credits") for what
  appears to be the same word-based quota at a different (unpublished) scale; this is the only
  place "credits" appears as a noun for the allowance, and it is not accompanied by a conversion
  rate or unit definition, so it was not read as establishing a separate intermediate currency for
  the product as a whole.

  Privacy Policy (/privacy) was not read in full: it is a data-handling document, not a pricing,
  billing, or IP/output-rights document, and nothing in any other source pointed to it as relevant
  to a coded variable.

  blindness: no other record, no review page, no pass-1 material was opened.
conflict_note: "Refund guarantee wording gap: the pricing-page banner and the Help/FAQ page describe the guarantee in unconditional-sounding marketing language ('Money back guarantee. If anything we produce is flagged as not human, we will refund the cost of humanization.' -- https://undetectable.ai/pricing; 'we will refund the cost of the generation, no questions asked.' -- https://undetectable.ai/help), while the Terms of Service -- the higher-authority source for this contractual variable per protocol 6.2 -- states an actual condition and window ('A refund of credits is only available if a submission provably flags as less than 75% human on a reputable AI detector. Refunds of credit or payment requests must be made within 30 days of the incident.' -- https://undetectable.ai/terms, Sec 6.1 and 27). refund_conditions and refund_policy_exists were coded from the Terms per the source hierarchy; this divergence is recorded per protocol's marketing-vs-contract rule even though the hierarchy resolves the coded value cleanly."
