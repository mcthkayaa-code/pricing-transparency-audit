coder_note: |
  ENTRY TIER / BUNDLE DISCLOSURE. Sapling sells the AI Detector as one feature inside a
  general multi-feature subscription, not as its own SKU. The coded entry tier is "Pro"
  ($25/month default display state). In the vendor's own pricing-grid wording, Pro
  grants, together for one price: "Advanced premium suggestions", "Autocomplete
  Everywhere", "Rephrase", "Unlimited use on premium domains", "Email & ticket support",
  unlimited "Snippets", AND "AI detector (longer queries)" -- there is no
  detector-only paid plan anywhere on sapling.ai. This IS a bundle in the vendor's own
  structure: one subscription price unlocks the whole suite, not a detector-specific
  price. All coded figures above are Pro's own published figures (not borrowed from the
  separate metered API, which prices its AI Detector endpoint differently from its
  Edits/Rephrase endpoint -- $0.005 vs $0.025 per 1000 characters -- see below).
  Separately, a perpetual FREE detector tool exists at /ai-content-detector, usable
  without an account, capped at 2000 input characters; this is what free_plan_* codes.

  ENTRY-TIER CANDIDATE SELECTION (sampling-rules.md section 7.2). Three paid surfaces
  are published: Pro ($25/mo, self-serve Stripe checkout), Enterprise ("Contact Us...
  Starts at 10 seats, $15/seat/month"), and a metered API ($0.005-0.0025 per 1000 chars
  for the Detector endpoint, one-time $5 minimum, no recurring fee). Only Pro is
  ELIGIBLE: Enterprise fails criterion 2 (its CTA is "Get started / Contact Us", not a
  self-serve purchase, regardless of the indicative $15/seat/month figure it discloses
  for a 10-seat minimum block -- annualized that indicative floor would be
  10 x 15 x 12 = $1,800.00/yr for the minimum purchasable block, recorded here for a
  reader who wants to check the exclusion, not as a comparable candidate). The API is
  usage-metered with no seat concept and no recurring fee to annualize (a $5 one-time
  minimum only) -- section 7.2's usage-based-unit-rate clause (rule 5) applies only
  where usage-based pricing is the vendor's ONLY paid option, which does not hold here
  since Pro exists, so the API has no annual-equivalent single-seat figure commensurable
  with Pro's and is excluded as not comparable rather than as a numeric loser. Pro was
  therefore the only eligible AND comparable candidate; its annual-equivalent figure is
  25.00 x 12 = $300.00/yr.

  OUTPUT-TYPE JUDGMENT CALL (commercial_use_lowest_tier, watermark_removal_tier,
  output_ownership_statement, free_plan_watermark). Verified directly on
  /ai-content-detector that this product's output is a probability score ("Fake:
  73.6%"), a per-sentence prediction breakdown, and a share certificate that expires
  after 3 days -- not an image/video/audio/text deliverable. Codebook watermark_removal_
  tier rule 3 gives "a detection score or an analysis table" as its own worked example
  of output that cannot carry a watermark; I have applied that same output-type finding,
  by the same not_applicable wording ("no output a commercial-use right/ownership could
  attach to"), to commercial_use_lowest_tier and output_ownership_statement, and (by
  extension, since its value table carries the identical carve-out) to the domain-3
  sibling free_plan_watermark. The full ToS was read end to end and contains no clause
  addressing ownership of, or a commercial license for, detection results specifically
  -- consistent with, not contradicting, this reading. Flagging this explicitly as a
  judgment call rather than a mechanical lookup, per this vendor's documents and not
  assumed from the "AI detector" category label alone.

  PROCESS DISCLOSURE (git). While debugging an unexpected "nothing to commit" message
  after an earlier `git add` on this record (which I now believe was a benign race with
  another collector's concurrent commit touching a different product -- my files were
  already durably committed by the time I checked), I ran `git diff --stat --cached`
  once. Output was empty (nothing was staged at that moment), so no content from any
  other record or from repository history was displayed. I did not run `git log`,
  `git show`, or `git blame` at any point, and did not open any other product's record.
  Recorded here per instruction rather than left undisclosed.

  blindness: no other record, no review page, no pass-1 material was opened.
