coder_note: |
  Entry-tier selection (sampling-rules 7.2): candidates were Quarterly ($89.95/3mo =
  $359.80/yr annual-equivalent, or $29.98/mo x 12 = $359.76/yr) and Monthly ($49.95/mo x 12 =
  $599.40/yr). Both generally available, no sales contact, standing recurring plans. Quarterly
  has the lower annual-equivalent cost and is selected as the entry tier. Monthly is the losing
  candidate at $599.40/yr annual-equivalent. Free ($0) is not a paid tier and was not a
  candidate. The pricing page labels the entry tier's column "Quarterly"; the Cancellation
  Policy separately names the same tier the "Premium 3 Month Plan" -- both cited, not treated
  as a naming conflict (same tier, two documents).

  Instrument-coverage gap (billing cadence): Jobscan's paid plans bill Quarterly or Monthly,
  never annually. headline_billing_basis and annual_default_toggle both have closed value
  lists built around an annual/monthly framing and neither has a value matching "quarterly
  cadence" or "quarterly preselected among three options" -- both coded unknown rather than
  inventing a new enum value, per the study's instrument-frozen instruction. annual_condition_
  disclosure is coded not_applicable on the more specific ground that no ANNUAL billing option
  exists at all.

  Not an A-012 case: the "For 3 months after FREE trial Save 40%" line on the Quarterly card is
  a same-cadence-forever comparison against the Monthly plan, not a time-limited intro rate that
  later increases. Verified arithmetic: 29.98/49.95 = 0.6002, i.e. exactly a 40% saving of the
  quarterly monthly-equivalent versus the monthly plan's price -- both are standing prices, nothing
  found stating the $89.95/quarter rate increases after the first billing cycle.

  Access barrier -- general Terms of Service unreadable in English: see sources list and
  jobscan-sources/terms-of-service-ACCESS-NOTE.txt for the full account (WebFetch, two browser
  navigations, a web.archive.org capture, and an archive.ph attempt all failed to surface English
  body text; the page renders in Turkish in this session). This is the reason commercial_use_
  lowest_tier, watermark_removal_tier, output_ownership_statement, and unquantified_limit_clause
  are unknown, and the reason usage_cap_quantified carries a caveat rather than an unqualified
  all_caps_quantified.

  free_plan_cap_value: "5 ATS & Recruiter Findings" is recorded as its own quantified figure
  because it carries a number and a dimension, but it may simply describe what each of the "5
  Free Resume Scans monthly" produces (findings are generated per scan) rather than being an
  independently metered second allowance. The pricing page does not disambiguate; both bullets
  are recorded verbatim rather than merged, so a reader can judge.

  Currency: vendor's own currency disclosure is explicit and unambiguous -- help center article
  "I didn't pay in USD. Will this affect my refund?": "All subscription charges are processed in
  USD." No non_usd figure was observed anywhere in this collection. D-003 arm 1 satisfied cleanly;
  no display_variant register event needed.

  Archival: archive.org's Save Page Now returned "You have already reached the limit of active
  Save Page Now sessions" on the first attempt and "Job failed" on a second attempt made a few
  minutes later (shared rate limit, expected per the study's own guidance -- two attempts is the
  cap). archive_status is local_copy_only across all sources, each with a dated verbatim local
  capture under jobscan-sources/.

  Price-arithmetic checker: tools/check_price_arithmetic.py prints a BASIS line for this record
  ("no period defined for 'unknown'") because headline_billing_basis is coded unknown for the
  reason given above. The two money values are in fact consistent with a quarterly cadence:
  29.98 x 3 = 89.94, one cent from the published 89.95 (ordinary rounding), corroborating that
  89.95 is the vendor's own quarterly figure rather than a misread.

  blindness: no other record, no review page, no pass-1 material was opened.
conflict_note: "Two Jobscan documents address refunds in incompatible-looking ways for what could be read as the same event: the SaaS Agreement grants a 30-day refund of prepaid fees, but only if Jobscan modifies the Service in a way that materially diminishes functionality, and that document is framed throughout as a negotiated Order-Form/'Customer' contract (the site's separate 'Organizations' offering). The Cancellation Policy grants a 2-day, 3.5%-fee refund for the individual self-serve Premium plan sold on the pricing page (the entry tier this record codes). Treated as two different documents governing two different products/contracts rather than a same-variable conflict between equal-authority sources, so refund_policy_exists/refund_window_days/refund_conditions are coded from the Cancellation Policy only. URLs: https://www.jobscan.co/saas-agreement and https://www.jobscan.co/cancellation-policy."
