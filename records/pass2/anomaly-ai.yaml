coder_note: |
  VENDOR URL CORRECTION. The assignment brief supplied vendor_home_url = https://anomaly.io.
  I checked that domain in my first tool calls, before coding anything, and found it resolves
  to a DIFFERENT product ("Anomaly" / Anomaly.io) — a metrics anomaly-detection and
  server-monitoring tool for DevOps (email/SMS/PagerDuty alerts, Grafana integration), no AI
  branding, no relation to "AI data analysis". frame-for-pass2.csv row 11 (the authoritative
  source per this agent's own instructions) gives vendor_home_url = https://www.findanomaly.ai
  for product_id anomaly-ai, category "AI data analysis" — that domain matches the product
  exactly: an AI platform (Mindlake Ltd, trading as Anomaly AI, England & Wales Co No.
  14894347) turning spreadsheets/GA4/ad-platform/database data into dashboards, insights, and
  refreshable reports. The coordinator separately flagged the same brief-vs-frame mismatch
  mid-task; by that point I had already resolved it. I coded EXCLUSIVELY from
  https://www.findanomaly.ai and its subpages throughout. anomaly.io was fetched exactly once,
  solely to compare it against findanomaly.ai and identify which was correct; no variable
  below is sourced from it, and it was not opened again afterward.

  ENTRY-TIER SELECTION (sampling-rules.md 7.2). Eligible paid candidates — Enterprise
  excluded (sales-gated, "Contact Sales", no public price); Free excluded ($0, not a paid
  tier): Pro $25/mo -> annual-equivalent $300.00 (WINNER, lowest); Analyst $90/mo ->
  $1,080.00; Team $45/seat/mo but the card states "minimum 2 seats ($90/month)" — a buyer
  cannot buy 1 seat, so per price-basis rule 3 the MINIMUM BLOCK is annualized: $90/mo x 12 =
  $1,080.00 (ties Analyst; both lose to Pro regardless). All figures read under the page's
  default Monthly toggle state; the annual toggle was viewed afterward only for descriptive
  context (Pro $20/mo billed $240/yr, Analyst $72/mo billed $864/yr, Team $36/seat/mo billed
  $432/seat/yr — each exactly the monthly total x0.8, i.e. the stated "Save 20%"), never to
  pick the entry tier.

  JUDGMENT CALLS, documented for adjudication:
  1. free_plan_cap_value "15 credits" coded as a quantified STANDING (one-time) limit, not a
     rate: the Free card reads "15 free credits" with no "/month" suffix, unlike Pro/Analyst/
     Team which all explicitly say ".../month" or "/seat/month" — the vendor could have
     written "/month" here and did not.
  2. free_plan_watermark = not_applicable and watermark_removal_tier = not_applicable: no
     document anywhere mentions watermarking. Principal output is dashboards/reports/analysis
     tables from business data. codebook-v1.md's own worked example for watermark_removal_
     tier's not_applicable case names "an analysis table" as a non-watermarkable output type;
     applied that same output-type test here rather than coding unknown for silence, since the
     basis is the output type itself, not merely vendor silence.
  3. output_ownership_statement = unknown, deliberately NOT user_owns: the terms' "You retain
     all rights to the data you upload or connect to the platform" is an INPUT-data clause. A
     separate "AI-Generated Content Disclaimer" clause treats "AI-generated outputs —
     including queries, analyses, visualisations, dashboards, and insights" as its own
     category, addressing only accuracy/liability, never ownership. Not inferring one clause
     covers the other since the vendor's own terms keep them distinct.
  4. commercial_use_lowest_tier = unknown: the only IP/commercial clause ("Content is provided
     for personal or internal business use only; commercial redistribution requires our
     written consent") governs the vendor's own service content (software/design/trademarks),
     not user-generated outputs; no pricing-grid row addresses commercial use of outputs.
  5. credit_to_output_rate_published = partial and cost_per_output_computable = partial: the
     only exact, non-hedged conversion published is at sub-output "step" level (0.5 credit for
     query/transform/chart-or-KPI-build/dashboard-card-regen; 1 credit for Python-script-run/
     Excel-workbook-validation). Dashboard/insight-level figures are always prefixed "~"
     (approximate) — e.g. Pro: "1,000 credits/month; ~600 insights with charts or ~200
     dashboards per month" — a consistent ~5 credits/dashboard across all 3 paid tiers
     (1000/200 = 4000/800 = 2000/400 = 5) but never stated as an exact/guaranteed rate.
     Treated as a vendor-published approximation, not a firm rate: 25/200≈0.125/dashboard,
     25/600≈0.042/insight, both approximate, hence partial not yes.
  6. cost_per_output_unit = other: no codebook-enumerated unit fits "dashboard" or "insight/
     report"; the vendor uses both terms without naming a single principal output.
  7. auto_renewal_disclosure_location = absent and refund_policy_location = absent (not
     unknown): confirmed via sitemap.xml (full page list retrieved, ~130 URLs, all marketing/
     blog/glossary content beyond the policy pages) plus 404 on /faq /help /refund
     /refund-policy /billing /subscription and 526/unconfigured on help.findanomaly.ai and
     docs.findanomaly.ai, and a web search for a Crisp-hosted help center turned up nothing
     product-specific — no help-center or dedicated billing/refund page exists for this
     vendor. Pricing page, terms of service, and privacy policy were each read in full; none
     discloses auto-renewal behaviour or any refund position.

  A-012: not applicable to this vendor. The Free tier is $0 (not a cheap non-zero paid intro
  period) and no separate time-limited discounted trial of a paid tier exists.

  SOURCES NOTE: Privacy Policy (https://www.findanomaly.ai/privacy) was read in full to check
  for refund/renewal/ownership content beyond the terms of service; it added nothing new
  (confirms Stripe as billing processor, data retention tied to account deletion only). No
  coded value above is sourced from it. Its archive.org capture returned an existing
  2026-08-06 snapshot on both allowed save attempts (2 of 2 used) rather than a fresh
  same-day one; flagged for transparency, though protocol 6.4's same-day rule is not
  triggered since no value relies on this page.

  blindness: no other record, no review page, no pass-1 material was opened.
