coder_note: |
  ENTRY TIER SELECTION (sampling-rules 7.2): eligible candidates on the default "Individuals" tab
  (no toggle/tab interaction), all single-account, non-sales-gated, standing plans: Firefly Standard
  $9.99/mo -> annual-equivalent $119.88 (WINNER, lowest); Firefly Pro $19.99/mo -> $239.88; Firefly
  Pro Plus $34.97/mo promo (list $49.99/mo, 30% off first 12mo) -> $419.64 promo / $599.88 list;
  Firefly Premium $139.91/mo promo (list $199.99/mo) -> $1,678.92 promo / $2,399.88 list. Pro Plus and
  Premium require an extra dropdown selection to view (not in the two default card slots, which
  default to Standard+Pro) but are still eligible candidates per sampling-rules 7.2's plan-eligibility
  test; neither is cheaper than Standard regardless. Business/Team-tab variants (Firefly Pro/Pro
  Plus/Premium "for teams", commitment=YEAR, annualized $239.88/$599.88/$2,399.88) excluded: reaching
  them requires clicking the "Business" tab, an interaction beyond the page's default load state.

  JUDGMENT CALL -- cost_per_output_unit/cost_per_output_computable: coded per_image / no, on the
  reasoning that standard (principal, image-generation) output is UNLIMITED/unmetered on all paid
  tiers so no stable $/image figure is derivable without an unstated usage assumption. An equally
  defensible alternative reading treats the unmetered standard-image capability itself as the
  "unmetered access to software" case in codebook rule 2, which would instead code
  cost_per_output_unit = per_seat_month and cost_per_output_computable = yes (trivially, cost per
  seat-month = the $9.99 plan price). Flagging both readings for the adjudicator; picked the
  stricter/no-credit-toward-vendor reading given the instrument's general bias against crediting
  computability that requires an interpretive leap.

  GAP -- trial_card_required / trial_auto_converts: the dedicated Subscription and Cancellation
  Terms page (which does cover Firefly) only describes "Free Trial Terms" (card-on-file, auto-charge
  at trial end) under its "Annual contract" plan-type subsections. The entry tier's confirmed
  commitment type is "Month to month" (commerce JSON), and that subsection of the SAME document
  carries no Free Trial Terms language at all. Coded both variables unknown rather than reading the
  Annual-contract trial language across to a Month-to-month product, which the instrument's
  no-inference rule does not permit.

  MINOR DISCREPANCY -- pricing-page promo banner text read "Save on our biggest Firefly plans until
  Aug 26" but the same promo's embedded JSON (promotionCode FFPLFFPU301YROW) states end date
  2026-10-22. Not scored (does not affect the entry tier, which carries no promo), noted for
  completeness only.

  blindness: no other record, no review page, no pass-1 material was opened.
conflict_note: "Free-plan refresh cadence: the live pricing page (accessed 2026-08-14, https://www.adobe.com/products/firefly/plans.html) frames the free tier as 'free daily generations... Limits refresh every day' (no mention of 'credits' for free users). The official help-center page (https://helpx.adobe.com/creative-cloud/apps/generative-ai/generative-credits-faq.html, same access date) states 'For free plans, generative credits are allocated upon first use of a Firefly feature... These credits expire one month from allocation' -- a monthly, credit-based cadence, not a daily one. Per protocol 6.2 the live pricing page ranks first for free-tier (pricing-class) variables, so free_plan_duration/free_plan_cap_documented are coded from it; this divergence between two official sources is recorded here per protocol 6.2's requirement to log it even where the hierarchy resolves the coded value cleanly. || Output ownership / free-user license: the Gen AI Product Specific Terms version actually in effect at read time (2026-04-23, https://www.adobe.com/go/adobe-gen-ai-addl-terms) contains no equivalent of the prior 2024-06-04 version's section 4.1, which granted Adobe a broad perpetual/worldwide license over free (non-paying) users' text-based Input+Output 'for any purpose' unless the user purchased a paid subscription. That clause is absent from the current document; output_ownership_statement is coded user_owns from the General Terms of Use sec. 4.2 (which the current Gen AI terms explicitly incorporate for all Input/Output), qualified only by the still-current Firefly Gallery license (Gen AI terms sec. 4: submitting Output to an Adobe-hosted gallery grants Adobe a marketing/reuse license over that specific submission, all tiers alike)."
