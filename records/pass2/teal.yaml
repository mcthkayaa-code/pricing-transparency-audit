coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md 7.2): Teal+ is sold at three simultaneously-displayed
  standing cadences, all eligible candidates (generally available, no sales contact, non-promotional):
  Weekly $13 (annual-equiv. 13 x 365/7 = $677.86), "Monthly" $29/30-days (29 x 365/30 = $352.83),
  "Quarterly" $79/90-days (79 x 365/90 = $320.39 -- LOWEST, selected as entry tier). None of the
  codebook's worked annualization cases (x12 for monthly, as-is for annual) literally covers a
  7/30/90-day cadence; annual-equivalent computed by (365/period_days) x price as the general form
  of the same "lowest annual-equivalent cost" test. Losing candidates: Weekly and "Monthly"(30-day)
  plans, figures above.

  BUNDLE DISCLOSURE (per assignment instrument note): Teal+ is a BUNDLE in the vendor's own framing.
  It is a platform subscription covering AI Resume Builder, Job Tracker, Cover Letter Generator,
  Analysis Mode, Design Mode, LinkedIn tools, Interview Prep, Networking CRM, etc. -- of which the
  resume builder (this review's category) is one component, not a separate SKU. Coded the Teal+
  tier because it is what grants unlimited access to the resume-builder-relevant AI features
  (bullet/summary/cover-letter generation, full Analysis Mode, Design Mode) beyond the free plan's
  capped allowance.

  BILLING-CADENCE INSTRUMENT GAP (per assignment instrument note): headline_billing_basis coded
  `unknown` because "Every 90 days" matches none of the codebook's allowed values -- see that
  variable's evidence for full reasoning. Not treated as one_time because ToS confirms recurring
  auto-renewal.

  JUDGMENT CALLS flagged for review (documents left genuine ambiguity; coded to best-supported
  reading per rules, disclosed rather than silently resolved):
  1. annual_default_toggle=no_toggle -- page shows 3 cadences at once with no toggle UI; none of
     the five allowed values precisely describes this shape.
  2. cost_per_output_unit=per_seat_month / cost_per_output_computable=yes -- entry tier is fully
     unmetered (Unlimited), so no credit/output allowance exists to divide by; treated the
     per-seat-month price itself (normalized to a common month) as the computable "cost per output"
     since no usage assumption is required. No codebook worked example covers this exact case.
  3. credit_rollover_policy=unknown -- free credits called "non-renewable" but no document states
     expiry/carryover, and the free plan has no billing-period boundary for "rollover" to attach to.
  4. commercial_use_lowest_tier=unknown -- a resume/cover-letter IS an output a commercial-use
     right could attach to, but no document states a tiered grant; closest text is a SERVICE-level
     (not output-level) personal-use/no-resale clause, judged non-dispositive and not coded from.

  MULTI-SOURCE CONFLICTS (both/all URLs; hierarchy applied per protocol 6.2/codebook 2.1):
  1. Billing-period roster: tealhq.com/terms Sec.5 states "Teal+ is offered in the following
     billing periods: weekly, monthly, quarterly, and annual" (4 cadences). The live pricing page
     (tealhq.com/pricing) and help.tealhq.com/en/articles/9530153-teal-vs-teal both show only
     THREE cadences with prices (weekly $13, monthly $29, quarterly $79) -- no annual price is
     published anywhere found. Pricing page governs plan existence/pricing (protocol 6.2 pricing-
     class hierarchy); no numeric candidate for a 4th "annual" tier exists to evaluate, so the
     3-cadence entry-tier selection above stands. Recorded here per codebook 3's rule that a
     hierarchy-resolved disagreement is still reported.
  2. Free-plan "Resume Bullets" AI-credit count: tealhq.com/pricing states "10 Credits"; help
     .tealhq.com/en/articles/9535168 (trial-FAQ) also states "10 credits." Against these, help
     .tealhq.com/en/articles/9530153 (Teal vs. Teal+ table) states "Resume Bullet Generation:
     5 credits," and help.tealhq.com/en/articles/9519206 (Using AI: Bullets) states "5 credits."
     Split 2-2 across official docs on the identical fact. Pricing page (rank-1 authority for this
     pricing-class variable) governs -> coded 10 in free_plan_cap_value; both readings recorded here.

  Free plan also grants (undifferentiated from paid, i.e. NOT caps): Unlimited Resumes, Unlimited
  Job Tracking -- listed for completeness, not included in free_plan_cap_value since they carry no
  restriction on the free tier.

  Currency: vendor's own explicit disclosure found -- help.tealhq.com "Teal vs. Teal+": "Note: All
  pricing is in USD. We accept all major credit cards and Google Pay." D-003 arm 1 satisfied
  directly; no non_usd anywhere.

  No A-012 (paid time-limited intro period) applicable -- Teal sells no discounted trial-length
  intro period; the free plan is ongoing/perpetual and the paid cadences are standing prices from
  first charge.

  blindness: no other record, no review page, no pass-1 material was opened. No breach to disclose.
conflict_note: "See coder_note 'MULTI-SOURCE CONFLICTS' for full detail with quotes. Summary: (1) tealhq.com/terms lists 4 billing periods incl. 'annual' vs pricing page + help.tealhq.com/en/articles/9530153-teal-vs-teal showing only 3 priced cadences, no annual price published anywhere -- pricing page governs, both URLs recorded. (2) Free-plan Resume-Bullets credit count: tealhq.com/pricing + help.tealhq.com/en/articles/9535168 say 10 credits; help.tealhq.com/en/articles/9530153 + help.tealhq.com/en/articles/9519206 say 5 credits -- pricing page (rank-1 authority) governs at 10, all four URLs recorded."
