coder_note: |
  Entry-tier candidates (Subscription tab, default display state, lowest annual-equivalent
  single-seat cost per sampling-rules 7.2): PERSONAL $6.75/mo x 12 = $81.00/yr -- WINNER, lowest.
  Losing candidates: BUSINESS $12.75/mo x 12 = $153.00/yr; PRO $18.75/mo x 12 = $225.00/yr;
  ULTIMATE $31.75/mo x 12 = $381.00/yr. STARTER ($0) excluded as the free tier, not a paid
  candidate.

  D-005 catch: a static WebFetch markdown conversion AND a live document.body.innerText
  extraction both independently misread the superscript-cents price layout as "$675/mo",
  "$1275/mo", "$1875/mo", "$3175/mo" (a x100 error). Raw DOM inspection
  (<span class="price-label">6<sup>75</sup></span> etc.) gives the correct $6.75/$12.75/$18.75/
  $31.75 reading, independently confirmed inside the archive.org save-page-now snapshot (its
  crawler executed the page's JS). Full detail in nicepage-sources/premium-price-dom-evidence.txt.

  Toggle judgment: the page's only toggle is "Subscription" (recurring, billed annually, default)
  vs "License" (one-time, lifetime, non-recurring) -- a product-type toggle, not a monthly/annual
  billing-period toggle. No monthly-recurring option exists at all, so annual_default_toggle is
  coded no_toggle rather than annual_preselected.

  Feature-tier vs usage-limit judgment: qualitative capability labels ("Basic/Advanced/Unlimited
  site search", "Basic/Full Customization", "Basic/Advanced E-Commerce") were treated as feature
  grades rather than usage limits under codebook section 5.1 (which defines a limit as a cap on
  consumption of outputs/minutes/exports/seats/storage/resolution/queue priority), and excluded
  from the free_plan_cap_documented / usage_cap_quantified tallies. Full per-tier cell dump in
  nicepage-sources/premium-comparison-table-dom-evidence.txt.

  Refund tension: see conflict_note for the full quotes. Coded refund_policy_exists = yes,
  refund_conditions = conditional, refund_window_days = 14 on the reading that terms.md's
  described 14-day review process and agreement.md's discretion language ("no obligation ...
  under any circumstances", followed immediately by how an approved refund is paid out) describe
  one coherent discretionary policy rather than two incompatible positions. Disclosed for
  independent review rather than resolved quietly.

  output_ownership_statement = unknown: the governing documents address use-restrictions and
  redistribution of Nicepage's own template assets, never who owns the buyer's finished website.

  Cookie-consent banner on https://nicepage.com/premium offered only an "Accept" control, no
  decline option (protocol 6.8 rule 5); accepted in order to read the page, noted here as the
  privacy rule requires.

  Frame row cross-checked against the live site: product_name "Nicepage", vendor_home_url,
  category "AI website builder", and product_status "active" all confirmed correct as given; no
  correction needed.

  A-012 does not apply to this product: the trial is free (not a paid time-limited intro period)
  and does not auto-convert to a paid charge -- it reverts to the free Starter plan after 7 days
  per https://nicepage.com/doc/4720/trial-limitations.

  blindness: no other record, no review page, no pass-1 material was opened. Did not read
  repository history (no git log, git show, git diff, or git blame was run).
conflict_note: "refund_policy_exists / refund_conditions: https://nicepage.com/terms operates a described refund-request process -- \"You can request a refund within 14 days of the purchase date. Please be prepared to describe why you requested a refund via Microsoft Teams or phone and explain the actual reasons, and we will review your request.\" -- while https://nicepage.com/agreement states \"The Nicepage.com website is under no obligation to refund your subscription fee under any circumstances,\" immediately followed by instructions for how an approved refund would be paid out. Both are terms-class documents (Terms of Use / License Agreement), so protocol 6.2's two-class hierarchy does not rank one above the other. Coded as yes / conditional / 14 days on the reading that the two describe one coherent discretionary-refund policy rather than two incompatible positions; logged here per protocol regardless of the resolution reached, so an adjudicator can weigh it independently."
