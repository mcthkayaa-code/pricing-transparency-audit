coder_note: |
  Entry tier (sampling-rules.md 7.2): among the "Business" tab's three generally-available,
  sales-contact-free, standing single-seat plans, lowest annual-equivalent cost wins. AI Starter
  $10/mo x12 = $120.00/yr (winner, entry_tier_name). Losing candidates: AI Premium $15/mo x12 =
  $180.00/yr; AI Ultimate $22.5/mo x12 = $270.00/yr (marked "BEST VALUE" by the vendor, but not
  cheapest). The "Agency + White Label" tab was excluded as a candidate set: it names a distinct
  audience/program (agencies/resellers) rather than being generally available to any buyer
  (sampling-rules 7.2 eligibility rule 1). A same-session attempt to click that tab via JS did not
  visibly change the displayed plan set/prices, so its own figures were not obtained; this does
  not affect the entry-tier choice since Business is the page's own confirmed default audience.

  free_plan_cap_documented judgment call: coded some_quantified on the reading that "limited to
  generating one website" is a quantified standing cap (1) while "full editing requires enabling
  the 7-day free trial" and "SSH and SFTP...not available on free plans" are feature-gates with no
  attached number. A coder who treated only volume-type limits as eligible "caps" (excluding
  feature gates entirely) could instead read the free tier as carrying exactly one limit, fully
  quantified. Noted so a later reader can see the fork.

  renewal_notice_commitment nuance: ToS states two OTHER, narrower notice commitments that are not
  a general per-renewal notice and were not used to code this variable: a 72-hour notice specific
  to fee-AMOUNT changes ("We have the right to change the fees for subscription plans. In this
  case we will notify You... at least 72 hours prior to your next billing cycle") and a 24-hour
  notice specific to the FIRST charge after the trial ("we send an email 24 hours prior to first
  charge"). Neither contradicts the governing "without notifications to you" statement about
  ordinary recurring renewals; both are recorded here for completeness.

  cancellation_self_serve caveat: ToS adds "In some cases, depending on your subscription plan, we
  may ask You to contact us to cancel Your subscription" immediately after the self-serve
  statement. Treated as a documented caveat on the general rule, not a second equal-authority
  source stating a different rule, so `conflicting` was not coded.

  Tooling note (not a display_variant): the very first screenshot taken on this pricing-page load
  showed the AI Ultimate card's per-website figure as "$3.4 per website"; every subsequent read of
  the same load and of a fresh navigation (get_page_text x2, raw outerHTML of the price node, a
  second full navigation) consistently showed "$5.6 per website" ($22.5/mo / 4 websites = 5.625,
  rounds to 5.6 — the arithmetic that is actually correct). Treated as a rendering race on the
  very first paint, not a vendor-served alternate state; $5.6 is the value coded, matching
  computation_assumptions-style arithmetic, not $3.4.

  A-012 (paid time-limited intro period): does not apply. 10Web's trial is $0 for 7 days (a true
  free trial under the codebook's definition), not a cheap non-zero paid intro period.

  Browser-tab hygiene: one browser tab (opened for the pricing page) stopped rendering (blank
  screenshots, one timeout) partway through this session after a scrollIntoView+wait cycle; it was
  abandoned without further retries per the agent's hygiene rule, its content already captured to
  10web-sources/pricing-page-rendered-2026-08-14.txt, and a fresh tab was opened for the remaining
  pages. help.10web.io sits behind a Cloudflare interstitial that blocked WebFetch (403) and curl
  (200 but challenge-page body only); a real rendered browser session passed it. See sources[] for
  which pages ended up archive_status local_copy_only after two archive.org save attempts each.

  blindness: no other record, no review page, no pass-1 material was opened.
conflict_note: "(1) refund_policy_exists / refund_window_days: pricing page badge 'Free 30-day money back guarantee' text 'The 30-day money-back guarantee applies until you claim your free domain.' [https://10web.io/pricing-platform/] DIRECTLY CONFLICTS with Terms of Service 'At 10Web we do not offer refunds for Platform subscriptions. All payments are final' [https://10web.io/legal/terms-of-service/]. Resolved per codebook 3 (ToS ranks first for the contractual/refund class): coded no_refunds_stated / 0 days from the ToS, conflict recorded per protocol 6.2's instruction to log it even where the hierarchy resolves the value. (2) free_plan_exists: help-center 'Free platform users are limited to generating one website...' and 'SSH and SFTP credentials are not available on free plans' [https://help.10web.io/hc/en-us/articles/360021420139-Get-Started-for-Free-on-10Web] is in tension with Terms of Service 'To be able to use the Platform and its Services you have to have an active subscription' [https://10web.io/legal/terms-of-service/]. Resolved per codebook 3 (pricing page + docs rank above ToS for the free-tier-limits/pricing class, and the pricing page's own H1 'Start free. Scale with every site' and 'Get started for free' CTAs corroborate the docs): coded yes. (3) trial_auto_converts: see the variable's own evidence field and coder_note tooling-note-adjacent entry above; https://help.10web.io/hc/en-us/articles/6136064762770-Why-Have-I-Been-Charged vs https://help.10web.io/hc/en-us/articles/360030873012-What-Happens-if-I-Fail-to-Upgrade-My-Plan-Before-the-Free-Trial-Ends, equal authority, coded conflicting."
