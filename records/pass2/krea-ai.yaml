coder_note: |
  Entry-tier selection (sampling-rules.md 7.2): eligible candidates were Individual Basic, Individual Pro, Individual Max, and Business (all purchasable without contacting sales, standing plans; Enterprise excluded, sales-gated/custom pricing only). Annual-equivalent cost compared using each card's displayed default (Yearly) monthly figure x 12:
  - Basic (WINNER): $5/mo shown x 12 = $60.00/yr (precise underlying rate $9 x 0.60 = $5.40/mo x 12 = $64.80/yr)
  - Pro: $21/mo x 12 = $252.00/yr ($35 base x 0.60, exact)
  - Max: $63/mo x 12 = $756.00/yr, at the page's default-selected 60k-unit compute pack ($105 base x 0.60); Max offers a 40k/60k/80k/100k pack selector so this figure is pack-dependent, but even the smallest disclosed pack (ld+json canonical "Individual Max" = 40,000 units/mo at $70 base, i.e. $42/mo x 12 = $504/yr yearly) is far above Basic.
  - Business: $160/mo x 12 = $1,920.00/yr at the default-selected 80k-unit pack ($ struck-through base not fully legible at the resolution checked); team/workspace plan, not remotely competitive with Basic regardless of exact base figure.
  No A-012 case (no paid non-zero time-limited intro period that auto-converts): the annual-vs-monthly toggle is a standard recurring billing-cadence choice, not a short intro period converting to a materially different plan afterward.
  Judgment calls: (1) cost_per_output_unit coded per_image because the frame categorizes Krea AI as "AI image generator" and the pricing page consistently lists image capability first; Krea equally prominently sells video (Seedance 2.0 counts shown on every tier) and other outputs, so a reader modeling Krea as a video tool would compute differently. (2) cost_per_output_computable coded partial because the only explicit credits-per-generation rate found (Nano Banana 2, ~50/generation) is for one of many selectable models, not Krea's own flagship "Krea 2" model, which has no published rate anywhere; this is a "many models, one rated" fact pattern the codebook's secondary-output framing doesn't perfectly anticipate, so partial was chosen as the closest fit to "not computable as a single principal-output figure, computable for one named case." (3) refund_policy_exists coded no_refunds_stated strictly per the protocol 6.2 source hierarchy (Terms of Service outranks a help-center billing article for contractual variables), despite the help-center article's detailed conditional refund program reading, to a plain-language buyer, like the more operative policy; this is the single highest-stakes judgment call in this record and is flagged for adjudication attention.
  blindness: no other record, no review page, no pass-1 material was opened.
conflict_note: "PRICING PAGE vs MANAGE-SUBSCRIPTIONS DOCS (numeric mismatch, pricing page governs per hierarchy for pricing-class variables): docs (https://docs.krea.ai/user-guide/help-and-support/manage-subscriptions) state 'Starting at $10/month', 'Basic: 4000/mo, Pro: 20000/mo, Max: 54000/mo', 'the 50/day from the free tier', and '20% off for annual plans'; live pricing page (https://www.krea.ai/pricing, confirmed via ld+json + rendered screenshot) shows Basic $9 base/5,000 units/mo, Free 100 units/day, and 'Save 40% on yearly plans' (confirmed exact via Pro's $35->$21 arithmetic). | TERMS vs REFUNDS-AND-BILLING DOCS on refund availability (Terms governs per hierarchy, rank 1 > rank 2 for contractual variables): Terms (https://www.krea.ai/terms) state Krea 'WILL NOT REFUND ANY FEES THAT YOU HAVE ALREADY PAID' except as expressly provided; docs (https://docs.krea.ai/user-guide/help-and-support/refunds-and-billing) describe an active conditional program ('eligible for a refund' if 'workspace usage must be below 650 compute units and... less than 20 generations for the current month', auto-offered via Stripe portal at cancellation). | PRICING PAGE vs NANO-BANANA-2 DOCS on credit rate: pricing page shows Basic's 5,000 units = '64 Nano Banana 2 generations' (implying ~78.1 units/generation), while https://docs.krea.ai/user-guide/features/nano-banana-2 states 'Credits ~50 per generation' explicitly - a ~56% discrepancy; the explicit docs rate was used for the cost-per-output computation since it is a stated rate rather than a derived ratio."
