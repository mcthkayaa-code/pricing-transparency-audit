coder_note: |
  ENTRY-TIER SELECTION (sampling-rules.md 7.2). Eligible candidates and annual-equivalent cost,
  computed in the pricing page's default display state:
    - Pro, billed annually: $14.50/mo x 12 = $174.00/yr -- WINNER (lowest annual-equivalent,
      single seat, generally available, no sales contact).
    - Team, 2-seat minimum (cannot buy 1 seat): $40/user/mo billed-annually (default toggle
      state) x 2 seats x 12 = $960.00/yr for the minimum purchasable block -- loses.
    - Pro, billed monthly (marketed separately on the same page as "Need to create a single
      presentation? ... Our monthly option... Cancel anytime. Everything in Pro plan (billed
      monthly) $45"): $45/mo x 12 = $540.00/yr -- loses. Confirmed via rendered read + raw DOM
      that this is a recurring monthly charge, not a one-time fee (page text: "Cancel anytime").
    - Enterprise: excluded, sales-gated ("Contact sales for pricing"), fails eligibility rule 2.
    - Education (year free for .edu students): excluded, restricted to a named/verified program,
      fails eligibility rule 1; also time-limited (one year), not a standing plan.
  entry_tier_name = Pro.

  PRICING DISPLAY VARIANT (protocol 6.8; binding deviation D-005 territory). The Pro card's price
  element carries three DOM attributes on the same node: data-pricing-exp-false="$12",
  data-pricing-exp="true", data-pricing-exp-true="$14.50". The vendor runs a live client-side
  pricing experiment via Optibase (script tag app.optibase.io/script.js, a Webflow A/B/personalization
  tool). Evidence gathered, in order:
    1. Raw static HTML (curl, no JS) renders the Pro price node's TEXT CONTENT as "$12" -- this is
       the pre-experiment / "false"-variant default.
    2. A live rendered browser read (JS executed), after declining non-essential cookies and before
       any other interaction, displayed "$14.50 /MO" / "Billed annually" in the Pro card -- confirmed
       independently via get_page_text extraction AND a screenshot of the rendered card.
    3. The SAME rendered page's own FAQ prose ("How much does Beautiful.ai cost?") was NOT updated by
       the experiment script and still reads "Pro for individual users at $12/month (billed
       annually)" -- an internal inconsistency on one document, caused by the experiment only
       targeting the price-card DOM node.
  Per protocol 6.8 rule 1, this record codes the state THIS READ observed ($14.50) and archives the
  page in that state (https://web.archive.org/web/20260814175159/https://www.beautiful.ai/pricing).
  This is coded as a genuine vendor-side display variant, NOT a coder-tooling misread: the magnitude
  is plausible either way (no order-of-magnitude error), and DOM evidence (the data-pricing-exp-*
  attributes) independently confirms both figures are legitimately vendor-served under different
  conditions, per the deviations-log guidance distinguishing real variants from misreads. Logged as
  a register_event (type display_variant) below. A first pass or later re-check landing on $12 would
  be explained by this same mechanism, not by coder error on either side.

  JUDGMENT CALLS.
  - renewal_notice_commitment coded no_notice_stated rather than unknown: the ToS was read in full
    (full-text keyword sweep) and contains advance-notice commitments for OTHER triggers (service
    changes, agreement changes) but none for a renewal charge specifically -- treated as a checked,
    documented absence by analogy with the absent/unknown split used elsewhere in the instrument
    (e.g. annual_condition_disclosure), since this variable's own rule does not spell out the
    silence case. Flagging this reasoning in case a different reading is preferred on review.
  - cancellation_self_serve coded from the pricing-page FAQ ("Billing section of your Profile")
    rather than from ToS 6.2(a) ("by contacting us at support@beautiful.ai"), on the reading that
    ToS 6.2(a) governs terminating the Agreement/Account entirely (a broader, different action),
    while the FAQ directly and specifically answers "How do I cancel my subscription?" and itself
    distinguishes cancellation from full account deletion ("To delete your account entirely, visit
    our FAQ page here."). See conflict_note; a stricter reading could instead code contact_required
    from the ToS as the higher-ranked contractual source.
  - watermark_removal_tier coded unknown rather than inferring from the "Player branding" compare-grid
    row (present on Team/Enterprise, absent on Pro): that label is never tied explicitly to
    watermarking, and inventing that equivalence was judged too speculative per the instrument's
    caution against invented structure.

  Two help-center URLs (refund policy, cancellation) returned a Cloudflare JS challenge to both a
  static fetch and to archive.org's crawler (2 attempts each) and were not used as coding sources;
  their content is duplicated on the pricing-page FAQ, which was used instead and is fully archived.
  https://www.beautiful.ai/terms-of-service-ai was fetched but returned no readable body text
  statically (not rendered); not used as a source.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "REFUND POLICY: ToS (https://www.beautiful.ai/terms-of-service, contractual class, ranks first) states \"All fees are non-refundable and non-cancellable.\" The pricing-page FAQ (https://www.beautiful.ai/pricing, same content as the Cloudflare-blocked help-center refund article) states \"Annual subscriptions may be eligible for a partial refund if a request is submitted within 24 hours of the initial purchase or renewal... Monthly subscriptions are non-refundable... subject to a processing fee.\" Coded refund_policy_exists/refund_window_days/refund_conditions from the higher-ranked ToS per protocol 6.2. CANCELLATION MECHANISM: ToS 6.2(a) (https://www.beautiful.ai/terms-of-service) states Customer terminates \"this Agreement and its Account... by contacting us at: support@beautiful.ai\", while the pricing-page FAQ (https://www.beautiful.ai/pricing) states \"You may cancel your Beautiful.ai subscription on the Billing section of your Profile\" and separately references contacting support only for full account deletion. Coded cancellation_self_serve from the FAQ as the source directly on point for subscription cancellation specifically; see coder_note for the reasoning and an alternative reading."
