coder_note: |
  FRAME CORRECTION: the task assignment specified vendor_home_url=https://aiclicks.app,
  product_name="AIClicks", category="AI SEO". None of these resolve or match
  frame-for-pass2.csv, which lists vendor_home_url=https://aiclicks.io, product_name="AIclicks",
  category="AI bot checker". Verified directly: https://aiclicks.app returns a DNS resolution
  failure ("Could not resolve host"); https://aiclicks.io resolves (HTTP 200) to a live product
  whose own site title/logo render "AIclicks" (matching the frame exactly) and whose product_id
  slug matches. Also note "AI SEO" is not one of this study's 15 defined categories
  (sampling-rules.md Sec.6.1), while the vendor's own Terms of Service literally describes the
  product as "an AI-SEO platform" -- so the original assignment's category may reflect a genuine
  positioning read, but frame-for-pass2.csv is the authoritative administrative source per
  codebook Sec.6 ("Copied from the frozen frame"), so product_name=AIclicks,
  vendor_home_url=https://aiclicks.io, and category="AI bot checker" were coded throughout,
  each independently confirmed live and consistent with the frame's product_id.

  ENTRY TIER: three paid tiers were eligible (Enterprise excluded: sales-gated, "Custom"/"Book a
  Call", no published price). Annual-equivalent cost at the default Monthly display state:
  Starter 59x12=708.00 (winner), Pro 189x12=2268.00, Business 499x12=5988.00. Starter selected as
  entry_tier_name.

  DOMAIN E (commercial use / ownership / watermark): the product's principal, pricing-determining
  output is visibility/citation-tracking analytics (an analysis-table-type deliverable); it also
  generates "AI-optimized articles" as a secondary content feature on every tier. Coded
  watermark_removal_tier=not_applicable on the principal-output test, whose own codebook example is
  "a detection score or an analysis table" -- but coded commercial_use_lowest_tier and
  output_ownership_statement=unknown rather than not_applicable, because their own not_applicable
  tests require NO output at all that such a right/ownership question could attach to, and the
  AI-generated articles are a real content output the documents never address for either rights or
  ownership. Readers who weigh "articles" as the principal output instead would reach
  watermark_removal_tier=unknown by the same logic as the other two.

  TOGGLE: attempted to switch the pricing page's Yearly toggle (permitted under protocol Sec.6.3)
  by direct click at its on-screen coordinates and by a JS .click() dispatch on its DOM container;
  the control never visibly changed state across repeated attempts, so no annual-price figures
  could be read from this page. Not needed for any coded value, since the default (and therefore
  governing) state throughout is Monthly.

  CURRENCY: no currency or country selector is present; only "$" figures appear anywhere in the
  fetched documents. A server response header showed the request geolocated to Turkey, yet the
  page served the same USD figures regardless, consistent with one global USD price rather than
  localized/geo-priced pricing.

  blindness: no other record, no review page, no pass-1 material was opened.
conflict_note: "Pricing page (https://aiclicks.io/pricing) FAQ states, verbatim: \"Yes. Starter and Pro plans include a 3-day free trial. No credit card required to start.\" Terms of Service (https://aiclicks.io/terms-and-conditions, Sec.11 Refunds & Cancellations) states, verbatim: \"AIclicks offers a 3-day free trial for new subscribers. During this trial period, your card is not charged. Once the trial ends, your subscription becomes active and your card on file is charged automatically. This is clearly communicated at the time of signup, on the pricing page, and within the checkout session before completing registration.\" The Terms' \"card on file\" / \"charged automatically\" language implies a card is collected before or during the trial, which is incompatible with the pricing page's explicit \"No credit card required to start\" -- and the Terms' own claim that this mechanism 'is clearly communicated... on the pricing page' is not borne out by the pricing page's FAQ wording. Coded trial_card_required=no from the pricing page per the source hierarchy (live pricing page ranks first for trial-terms/pricing-class variables, protocol Sec.6.2) rather than resolved by inference."
