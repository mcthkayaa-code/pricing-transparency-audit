coder_note: |
  Entry-tier selection (sampling-rules 7.2): eligible paid candidates compared by lowest
  annual-equivalent single-seat cost in the default (Yearly) display state. Standard $8/mo
  billed yearly = $96.00/yr -- SELECTED. Losing candidates: Pro $28/mo billed yearly =
  $336.00/yr; Fancy $76/mo billed yearly = $912.00/yr. Basic ($0) is the free plan, not an
  eligible paid candidate. Only one entry-tier-eligible field per plan; no seat-block minimums
  or student/nonprofit-restricted plans were present.

  Feature-grid fabrication caught: an initial summarizing WebFetch of the pricing page reported
  "Standard Plan... watermark-free downloads. Commercial use permitted" -- FALSE. Direct DOM/icon
  inspection (screenshot + accessibility read, not text extraction) showed the "Download videos
  with no watermark" and "Commercial use" rows carry a CROSS icon under Standard and a CHECK
  only from Pro upward, confirmed independently by the FAQ's prose answer. Coded from the
  verified DOM read, not the text-extraction summary.

  trial_exists judgment call: the pricing page (ranks first for this pricing variable) and the
  FAQ show no trial offer anywhere -- only a standing $0 Basic tier and three paid tiers, no
  time-limited trial CTA. The Terms of Service does contain a "Free and Trial Plans" clause
  ("We may offer free or trial Plans at our discretion... At the end of the trial period, your
  Account will automatically convert to a paid subscription...") but this is discretionary,
  contingent boilerplate that does not itself demonstrate a trial is currently offered, and ToS
  ranks below the pricing page and docs/help center for this pricing-class variable. Coded
  trial_exists = no on the higher-ranked sources' silence; the ToS clause is quoted in full in
  pika-sources/terms-of-service-2026-08-15.txt for review. A-012 does not apply: Pika sells no
  cheap non-zero time-limited paid intro period (Basic is $0/perpetual).

  cost_per_output_computable: Pika's credit-per-generation rate varies by resolution tier (480p/
  720p/1080p), each an exact published figure (not an ambiguous range). Computed using 480p as
  the base/lowest tier (the resolution Standard's "all resolutions" access starts from); 720p and
  1080p rates are noted in computation_assumptions for a reader who wants a different tier.

  Support page (https://pika.art/support) is an interactive ticket/chat tool ("Tell us a couple
  of things and we'll show you the same answer our team would write you") requiring category/
  issue input to produce an answer. Not used as a source and no query was submitted, to stay
  clear of protocol 6.3's no-vendor-contact prohibition; all evidence instead comes from the
  static FAQ, ToS, and AUP pages.

  blindness: no other record, no review page, no pass-1 material was opened. No repository
  history was read (git log/show/diff/blame were never run); only `git add` and `git commit`
  were used, per this agent's git rule.
conflict_note: "CONFLICT 1 (free-tier credit allowance): https://pika.art/pricing states Basic (free) grants \"80 monthly video credits\"; https://pika.art/faq (\"How does monthly video pricing work?\") states \"On the Basic (free) plan you get 150 credits per month.\" Coded free_plan_cap_value/free_plan_cap_documented from the pricing page per protocol 6.2 (pricing page ranks first for free-tier limits); FAQ figure recorded here, not coded. CONFLICT 2 (credit-to-output rate table): https://pika.art/pricing publishes a \"Model 2.5\" credit table (e.g. Text/Image-to-Video 720p/5s = 20 credits); https://pika.art/faq (\"How many credits do videos cost to generate?\") publishes a different table naming \"Turbo Model / Pro Mode / 1.0/1.5 Model / 2.1 Model / 2.2 Model\" with different figures for overlapping specs (e.g. its 2.2-Model Image-to-Video/Text-to-Video 720p/5s = 6 credits) and no 480p tier at all -- the FAQ table appears to predate the live pricing page's Model 2.5 rates. Coded credit_to_output_rate_published / credit_rate_location from the pricing page per protocol 6.2 (pricing variable); FAQ table recorded here, not coded."
