coder_note: |
  ENTRY TIER SELECTION (sampling-rules 7.2): only one eligible paid candidate found on the
  Individuals tab (default/pre-selected segment) in the US/USD state: "Acrobat Express" at
  US$10.99/mo, billed monthly, no annual option offered. Free ($0) is not a paid candidate.
  "Adobe Firefly Pro" is NOT shown as a purchasable card at all in the US/USD state (appears only
  as a non-priced descriptive blurb); even in the Turkiye/TRY default-geo state where it WAS a
  purchasable card, it was priced higher (TRY 478.80/mo) than the Premium/Acrobat-Express card
  (TRY 238.80/mo), so it would not have been the entry tier regardless of which geo state governs.
  Businesses/Students/Educators tabs were not read: Students/Educators are named-program-restricted
  (excluded by sampling-rules 7.2 eligibility rule 1) and Businesses is a distinct segment from the
  default-loaded Individuals tab.

  DISPLAY VARIANT (geography), logged as register_event: this collector's network location
  (Turkey) causes the bare pricing-page URL to geo-serve TRY pricing under the tier name "Adobe
  Express Premium" (TRY 238.80/mo incl. KDV, 30-day trial, no Acrobat AI Assistant features
  listed). The vendor's OWN footer country/currency selector offers "United States - USD $"
  explicitly (screenshot + navigation evidence); selecting it re-serves the same price point as
  "Acrobat Express" (US$10.99/mo, 7-day trial, WITH Acrobat Reader/AI Assistant/PDF
  Spaces/podcast-generation features added). Per the currency-check protocol (deviations-for-
  coders.md): "If the vendor offers USD, the USD figure is the published price; log the locally
  served currency as a display_variant register event" - so all entry-tier variables in this
  record are coded from the United States/USD state, and the Turkiye/TRY state (price, name,
  trial length, feature set) is recorded here and in register_events rather than coded as the
  primary value. Full verbatim captures of both states are in the sources directory.

  WATERMARK vs CONTENT CREDENTIALS: the Adobe Generative AI Product Specific Terms state a user
  "must not remove or alter any watermarks or Content Authenticity Initiative metadata (e.g.,
  Content Credentials) that may be generated with the Output" (contentauthenticity.org). This is
  invisible AI-provenance metadata applied generally to generative outputs, not a tier-specific
  VISIBLE branding/watermark statement of the kind the codebook's free_plan_watermark /
  watermark_removal_tier examples describe (a "Watermark-free exports" feature-grid row present
  for one tier and absent for another). No such tier-differentiated row or statement was found
  anywhere, so both variables are coded unknown rather than inferred from this clause.

  A-012 (paid time-limited intro period): does not apply. Acrobat Express sells a FREE 7-day
  trial (no charge during the trial) that converts to the full $10.99/mo rate, not a cheap
  non-zero intro period, so the trial_* variables were coded under the ordinary frozen-codebook
  rules with no A-012 flag needed.

  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "The TR-vs-US geo display variance (price, tier name, feature composition, trial length) is coded as a display_variant register event per protocol 6.8, not as a conflict between two official sources of equal authority, because it is the SAME document/page varying by inferred geography rather than two separate documents. No other disagreement was found across the pricing page, Subscription and Cancellation Terms, General Terms of Use, Adobe Express Product Specific Terms, Adobe Generative AI Product Specific Terms, and the generative-credits helpx FAQ - the credit-rollover, commercial-use, and 250-credits/month figures were each independently corroborated by two official sources with no divergence."
