coder_note: |
  Entry-tier candidates (sampling-rules 7.2): Basic selected, lowest annual-equivalent single-seat
  cost among eligible paid candidates ($10/mo default-annual display = $120.00/yr). Losing paid
  candidates: Pro, $16/mo = $192.00/yr (16 x 12); Teams, $18/mo per seat = $211.00/seat/yr, but ToS
  section 7.4 states "A Workspace subscription requires a minimum of three (3) paid seats" -- a
  buyer cannot buy fewer, so the minimum purchasable block is 3 x $211 = $633.00/yr, still far above
  Basic. Free ($0) was excluded from candidacy entirely as not a paid tier, per domain-3/domain-1
  separation in the codebook -- not treated as a "losing" paid candidate.

  Judgment calls flagged for adjudication:
  - refund_window_days=14 is the EU/EEA/UK statutory withdrawal window (ToS 5.4-5.6) only. Outside
    that jurisdiction the documents give no fixed window -- only a discretionary case-by-case policy
    bounded by "payment within the past 30 days AND fewer than 30 lifetime credits used". The
    instrument has no clean value for "a determinate number that only some buyers get, others get a
    discretionary test instead"; I coded the one concrete day-count the documents state rather than
    unknown, since it IS determinate for the population it covers. Flagging this reading explicitly.
  - credit_rate_location's pricing-page component rests on the page's embedded __NEXT_DATA__ i18n
    string (subscriptions.features.creditsTooltip = "Generation or modification of an image is
    usually worth 1-2 credits"), found by inspecting the page's own shipped JSON payload rather than
    by triggering a visible hover tooltip during the browser session. Deviations guidance endorses
    embedded JSON as valid evidence equal to rendered text; noting the retrieval method for
    transparency since it wasn't visually observed rendering on screen.
  - Teams' displayed annual figure ($211/seat/yr) is NOT 12 x its own monthly headline ($18 x 12 =
    $216) -- confirmed via two representations (get_page_text extraction and a screenshot zoom on
    the Teams card both read $211, so this is a genuine vendor-published figure, not a coder misread
    of the kind deviation D-005/superscript-cents warns about). Recorded for completeness; Teams is
    not the entry tier so this does not touch any scored A3 value for this record.
  - free_plan_cap_documented=some_quantified treats the Free plan's headline "Limited free credits"
    as a genuinely separate, unquantified statement from the specific quantified rates documented
    elsewhere ("3 generations per style per day", "3 image uploads daily", "Up to 2 images per
    generation") rather than assuming the vague phrase and the specific numbers describe the same
    thing -- collapsing them would be an inference the codebook bars.
  - A-012 (paid time-limited intro period) does not apply to this product: no evidence anywhere of a
    cheap non-zero intro period auto-converting to a higher recurring rate.

  Pricing-page archival limitation (also in sources[0].note): the public web.archive.org snapshot of
  the JS-hydrated pricing page captured the static shell and FAQ text but not the client-hydrated
  plan-card prices; those figures are additionally evidenced by a local capture
  (recraft-sources/pricing-page-rendered-2026-08-15.txt) and in-session screenshots, cross-checked
  against the text extraction with no discrepancy.

  Process disclosure (not a blindness breach, but disclosed for transparency per this study's
  disclose-anything-unusual norm): my first git commit for this record ("wip(recraft): sources+
  archival checkpoint") unexpectedly also included five already-staged files belonging to a
  DIFFERENT product's pass-2 record (sapling.yaml and records/pass2/sapling-sources/*), evidently
  staged by a concurrent coder session at the moment I ran `git commit`. I had run `git add` on only
  my own two paths; I never opened, read, or viewed the content of any sapling file at any point --
  I only saw their file NAMES in my own `git commit` command's own output, never their contents, and
  I did not run git log/show/diff to investigate. All subsequent commits in this record were scoped
  with `git commit -m "..." -- <my exact path>` to prevent recurrence. Flagging so the orchestrator
  is aware a shared-index race occurred; no content of any other product was seen by this coder.

  blindness: no other record, no review page, no pass-1 material was opened.
conflict_note: "Refund framing (informational, not a value-level source conflict): the pricing-page FAQ (https://www.recraft.ai/pricing) and billing docs (https://www.recraft.ai/docs/plans-and-billing/billing) present refunds in a discretionary-but-available frame (\"We may offer a refund at our discretion where...\"), while the Terms of Service (https://www.recraft.ai/legal/terms) states in general terms that fees are non-refundable (Section 14: \"Any Fees paid hereunder are non-refundable\"; Section 5: ordinary cancellation yields no refund for amounts already billed). The ToS's own EU/EEA/UK withdrawal carve-out (5.4-5.6) and the discretionary policy are the reconciling detail -- both documents describe the same overall policy (default non-refundable, with stated exceptions) rather than incompatible facts, so refund_policy_exists is coded yes from the fuller picture rather than conflicting. Recorded per codebook section 3's instruction to log a marketing-vs-contract gap even where the hierarchy resolves the coded value cleanly."
