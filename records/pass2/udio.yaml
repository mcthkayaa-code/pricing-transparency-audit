coder_note: |
  Entry-tier selection (sampling-rules 7.2): eligible paid candidates were Standard
  (annual-equivalent $96.00) and Pro (annual-equivalent $288.00); Standard selected as
  entry tier (lower annual-equivalent). Pro is the only losing candidate. A "student
  pricing" option is referenced ("Are you a student? Check out our discounted student
  pricing") but is restricted to students, not generally available, so excluded from
  candidacy under rule 1. The Free plan is not a paid tier and is not a candidate.

  cost_per_output_unit judgment call: no listed unit fits a discrete fixed-length song
  generation billed by preset tier (32s=1 credit, 130s=2 credits, not a linear
  per-minute rate), so coded `other`, named "per song" / "per full-length (~130s) song
  generation".

  cost_per_output_computable judgment call: Standard's monthly credit allowance is
  stated as 2400 in two independent, on-point, directly-dedicated official sources (the
  pricing page's own Standard plan card, repeated verbatim, and help.udio.com's
  dedicated "Credits and credit limits" article), against one incidental "e.g. 1200"
  aside inside the pricing-page FAQ's answer to an unrelated question (credit expiry).
  Computed cost-per-output using the corroborated 2400 figure rather than coding
  `conflicting` outright, since the two direct, on-point statements agree and the
  outlier is a parenthetical, exemplifying aside on a different topic -- but the
  discrepancy is fully disclosed here and in conflict_note for adjudication to
  overrule if this resolution is judged wrong.

  commercial_use_lowest_tier judgment call: ToS 5.2 ("you may not... exploit... any
  Output... for any commercial purpose") and 6.3 ("you may use Output solely for your
  personal and non-commercial purposes") are the only two clauses in any official
  document that speak directly to commercial use, and neither carries a tier-based
  carve-out. ToS 6.4 ("Attribution") waives only the ATTRIBUTION requirement for paid
  subscribers who make public use of Output; it never uses the word "commercial" and
  does not affirmatively grant commercial rights. Coded not_granted from 5.2 + 6.3
  rather than treating 6.4's attribution waiver as an implied commercial grant, since
  that would be inventing structure the text does not state (deviations digest:
  "Beware fabrication, not just misreading"). See conflict_note for the related
  help-center language that reads more permissively in tone.

  Archival limitation (deviation D-005): the archive.org snapshot of
  https://www.udio.com/pricing (https://web.archive.org/web/20260815133306/
  https://www.udio.com/pricing) captured only the pre-hydration page shell (title,
  "Pricing" heading) -- verified by fetching the snapshot and grepping for the price
  strings, which returned nothing. It does NOT itself display any price figure. All
  price/plan values in this record rest on my own rendered browser read (screenshots,
  DOM text extraction, and aria-checked DOM inspection of the toggle state), which is
  a valid documentary read under D-005; the shell-only archive is disclosed here as a
  known limitation rather than presented as self-proving. The four help-center article
  archives, by contrast, captured full readable text (verified the same way).

  Minor disclosure re: search hygiene -- before creating my own record/sources, I ran
  `git status --porcelain -- ".../records/pass2/"` (scoped to the pass2 records
  directory, not yet to my own paths, since udio.yaml did not exist yet to scope to)
  to check for a prior in-progress udio record. It returned one line, an untracked
  directory name belonging to a different, unrelated product ("teal-sources/"), with
  no file contents shown. No record content, coded value, or file belonging to that
  product was opened or read. Disclosed for transparency per instructions even though
  no record was opened.

  Read a price twice, in two representations (binding rule): headline/first-charge
  figures were confirmed in both the DOM text extraction (get_page_text) and a visual
  screenshot zoom of each plan card; no superscript-cents artifact was present (plain
  "$8" / "$24" / "$96" / "$288" integers), and magnitudes were sanity-checked against
  the entry-tier name and billing basis.

  blindness: no other record, no review page, no pass-1 material was opened. No
  repository history was read at any point (no git log, git show, git diff, or git
  blame was run); only `git add`/`git commit` and status/existence checks scoped to my
  own paths were used.
conflict_note: |
  (1) Output ownership -- Terms of Service (ranks first for contractual variables,
  protocol 6.2) vs. help-center FAQ (ranks second): ToS section 6.1 states "You agree
  that the Company and/or its licensors own all right, title and interest in and to
  the Services and the Output (including any and all intellectual property rights
  therein)..." (https://www.udio.com/terms-of-service). The help-center article
  "Answers to common usage questions" states "We don't claim any ownership over the
  content you generate using Udio in response to your inputs" and "You own the
  output." (https://help.udio.com/en/articles/10739216-answers-to-common-usage-questions).
  Coded output_ownership_statement from the higher-ranked ToS
  (vendor_license_retained) per protocol 6.2; both URLs and quotes recorded here per
  the same rule ("even where the hierarchy settles the coded value cleanly").

  (2) Standard-tier monthly credit allowance -- internally inconsistent across the
  vendor's own pricing page and help center: the Standard plan card states "2400
  credits per month (monthly credit limit, no rollovers)" and help.udio.com's
  "Credits and credit limits" article independently states "With our Standard
  subscription, you can use up to 2400 credits per month"
  (https://help.udio.com/en/articles/10739134-credits-and-credit-limits) -- but the
  SAME pricing page's own FAQ accordion answer to "Can purchased credits expire?"
  says "...monthly credits granted as part of your plan (e.g. 1200 credits for
  standard) will reset one month after your plan start date."
  (https://www.udio.com/pricing). Used 2400 for cost_per_output_computable's
  arithmetic (see coder_note for reasoning); flagged here since it could change the
  computed cost-per-song from ~$0.0067 to ~$0.0133 if 1200 is in fact current.
