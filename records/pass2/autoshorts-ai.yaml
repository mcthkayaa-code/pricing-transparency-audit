coder_note: |
  FRAME CHECK: product_id/product_name/vendor_home_url/category/product_status/paid_submission
  all matched the row I independently pulled from frame-for-pass2.csv
  ("autoshorts-ai,AutoShorts.ai,https://autoshorts.ai,Faceless video,active,no") against the
  fields given in my assignment. No discrepancy found.

  ENTRY-TIER SELECTION: eligible paid candidates were Starter ($19/mo), Daily ($39/mo), Hardcore
  ($69/mo); Free ($0) is not a paid tier and was not a candidate. Annual-equivalent cost in the
  default (Monthly) display state: Starter 19x12=$228.00 (winner), Daily 39x12=$468.00 (losing
  candidate), Hardcore 69x12=$828.00 (losing candidate). All three are generally available,
  purchasable without sales contact, standing (non-promotional), single-seat plans.

  TRIAL vs FREE PLAN: the vendor's own FAQ heading asks "Is there a free trial?" and answers
  "you can create your first series for free to test a video" -- but this describes the SAME
  $0 standing tier shown on the pricing grid, not a temporary trial of a paid plan. codebook
  trial_exists requires a trial "of a paid tier"; this offering is a distinct, separately-priced
  ($0) tier with its own permanently reduced feature set, not a time-boxed preview of
  Starter/Daily/Hardcore. Decision-rule step 1 ("a free plan is not a trial") routes it to
  Domain 3 regardless of the vendor's own colloquial "trial" label, so I coded free_plan_exists
  = yes and trial_exists = no. Flagging for adjudication in case the vendor's own wording should
  carry more weight than I gave it.

  FREE PLAN CURRENTLY PAUSED: pricing card shows an info badge "Temporarily paused" in place of
  a signup button, and the FAQ states "We have temporarily suspended the free plan due to abuse
  from botting / spamming. We will be re-enabling it soon once we implement a better bot
  detection system." I coded free_plan_exists = yes because the tier is fully documented with
  its own price and feature set (not removed from the page or disclaimed as discontinued), but
  a reader today cannot actually sign up for it. The JSON payload's billingInterval for this
  plan object is "once" (vs "monthly"/"yearly" for the paid tiers), consistent with it being a
  one-time allowance (1 video) rather than a recurring monthly grant -- this is why I coded
  free_plan_duration = perpetual (no stated TIME limit) rather than treating the 1-video usage
  cap as a duration limit; the usage cap itself is fully captured under free_plan_cap_value.

  TWO CREDIT SYSTEMS: the product has both "Motion Credits" (quantified per tier on the pricing
  grid: 27/62/124, resets each billing cycle, tooltip defines 1 credit = motion on 1 image) and
  "Image Credits" (FAQ only, no per-tier count published anywhere, described as refilling "on a
  30 day rolling basis," used only to regenerate a bad AI-generated image). I coded
  credit_unit_defined / credit_to_output_rate_published / credit_rate_location from the Motion
  Credit system since it is the one with a published per-tier quantity and an explicit
  conversion statement; the Image Credit system's existence and vagueness is noted here rather
  than coded separately, since the codebook's credit_* variables are singular (one system per
  product), not per-currency.

  COST PER OUTPUT -- ALTERNATIVE CALCULATION NOT USED AS PRIMARY: the entry tier separately
  guarantees a posting cadence ("Posts 3 Times A Week"; embedded JSON field "frequency":3 =
  posts/week) which is NOT gated by Motion Credits (credits only pay for an optional per-video
  motion effect; the FAQ confirms video creation/posting is schedule-driven, not credit-gated:
  "AutoShorts doesn't focus on individual video creation. Instead, you set up a Series that
  automatically generates videos on a schedule"). Using that cadence instead of credits:
  3/week x 30/7 (days-per-month / days-per-week, the same constants codebook uses for
  trial_length_days) = ~12.86 videos/month; $19 / 12.86 = ~$1.48 per video, for ANY video
  regardless of motion use. This is arguably closer to "true" cost per output than the
  motion-credit-based figure in computation_assumptions, but I did not use it as the primary
  computation because (a) the codebook's Domain 6 worked examples anchor cost-per-output to the
  credit-to-output conversion specifically, and (b) motion credits are the only place the vendor
  publishes an explicit per-output conversion RATE at all; the posting cadence is a plan
  guarantee, not a stated "cost per video" conversion. Flagging both figures for adjudication.

  CREDIT ROLLOVER -- MIXED POLICY: plan-included Motion and Image credits reset/refill on a
  cycle (coded expires_at_period_end, the clearest documented answer for the INCLUDED
  allotment), but the FAQ separately states purchasable "top off" credits "never expire" --
  a distinct, additional credit pool from the plan's included allowance. Both facts are true
  simultaneously; expires_at_period_end was chosen because it directly answers what happens to
  the plan's own unused credits at period end.

  AUTO-RENEWAL: no document anywhere (Terms & Conditions, FAQ, Privacy Policy, pricing page)
  states that subscriptions renew automatically. The Terms & Conditions page is a generic
  boilerplate website template that does not mention subscriptions, billing, or renewal at all,
  which is itself notable for a recurring-billing product. The closest language is the FAQ's
  "You can cancel any time though and your subscription ends," which describes the cancellation
  case rather than affirmatively stating automatic renewal absent cancellation. Per the
  no-inference rule (documents-only; implication is not a statement), I coded auto_renewal_default
  = unknown rather than inferring "on" from "membership"/"subscription" terminology or from the
  existence of monthly/yearly billing intervals in the pricing data.

  OUTPUT OWNERSHIP / COMMERCIAL USE: both drawn from the same unqualified FAQ answer ("Do I own
  the videos? ... sell them to clients"), which names no tier restriction, so I extended
  commercial_use_lowest_tier down to "free" (the lowest tier that can produce a video at all).
  Flagging in case an adjudicator reads the FAQ's general "SERIES & VIDEOS" framing as implicitly
  addressed only to paying users.

  CODER_ROLE VALUE: my assignment text and the agent definition both say coder_role:
  "secondary", but codebook-v1.md section 6 and record-template.yaml both fix this variable's
  value list to exactly primary|second|adjudicated -- "secondary" is not a member. I coded
  coder_role = "second" to stay inside the frozen instrument's enum (codebook section 5:
  categorical variables take exactly one value from the variable's own list), and note the
  wording mismatch here rather than silently picking one.

  blindness: no other record, no review page, no pass-2 material was opened.
