coder_note: |
  <entry-tier losing candidates with their annual-equivalent figures; any judgment call;
   any correction to the frame row; and the attestation line:>
  blindness: no other record, no review page, no pass-2 material was opened.
conflict_note: "<sources that disagree, with both URLs and both quotes; empty string if none>"
register_events:
  - { type: vendor_edit|display_variant, detail: "<one line>", urls: [<url>] }
status: in_progress|complete
