# RECORD TEMPLATE — copy this shape. Never open another product's record.
# Allowed values and decision rules live in codebook-v1.md; this file fixes only the SHAPE.
# ALWAYS QUOTE values: write value: "yes" / "no", never bare yes/no — unquoted, YAML turns
# them into booleans and the dataset ends up holding one value in two spellings (D-006).

product_id: <slug>
product_name: <vendor's name for the product>
category: <frame category>
product_status: active|discontinued
paid_submission: "yes"|"no"      # from the frozen frame row — QUOTE IT (unquoted, YAML makes it a boolean)
entry_tier_name: <plan name|not_applicable|unknown>
coder_pass: 1|2|3               # 3 = adjudication, which protocol 7.4 step 2 calls a third pass
coder_role: primary|second|adjudicated
collection_date: <YYYY-MM-DD>
recheck_date: <YYYY-MM-DD|not_applicable>
primary_source_url: <the pricing page>
archive_url: <snapshot of the pricing page|archive_failed|local_copy_only>
archive_status: archived|archive_failed|local_copy_only
default_display_state: <one line per protocol 6.8: currency, billing toggle, region>

sources:
  - { url: <url>, kind: pricing|tos|refund|docs|other, accessed: <YYYY-MM-DD>, archive: <snapshot-url|archive_failed|local_copy_only>, note: <optional> }

variables:
  headline_price_usd: { value: <allowed value>, source: <url>, evidence: "<operative phrase when the rule keys on wording>" }
  headline_billing_basis: { value: <allowed value>, source: <url>, evidence: "<operative phrase when the rule keys on wording>" }
